n))\n  Xte = _plain(names, blocks_te, len(X_test))\n  if CFG.get(\"topk\"):                                 # keep the k columns a GBDT actually uses\n    from sklearn.ensemble import HistGradientBoostingClassifier as H\n    V = Xtr.to_numpy(float)\n    m = H(max_iter=150, learning_rate=0.08, max_leaf_nodes=15, random_state=0).fit(V, yb)\n    from sklearn.inspection import permutation_importance as PI\n    imp = PI(m, V, yb, n_repeats=3, random_state=0, scoring=\"roc_auc\", n_jobs=4).importances_mean\n    keep = list(np.argsort(imp)[::-1][:CFG[\"topk\"]])\n    Xtr, Xte = Xtr.iloc[:, keep], Xte.iloc[:, keep]\n  return Xtr, Xte\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n_draw, rep, sub = CFG.get(\"draws\", 1), CFG.get(\"pos_rep\", 0), CFG.get(\"subsample\", 0)\n  if n_draw \u003c= 1 and not rep and not sub:\n    return [np.arange(len(X_train))]\n  y = np.asarray(y_train).ravel()\n  pos = np.flatnonzero(y == np.unique(y)[-1])\n  neg = np.setdiff1d(np.arange(len(y)), pos)\n  if len(pos) == 0 or len(neg) == 0:\n    return [np.arange(len(y))]\n  rng = np.random.default_rng(0)\n  out = []\n  for _ in range(max(1, n_draw)):\n    if sub:\n      idx = np.sort(np.concatenate([rng.choice(pos, max(1, int(round(len(pos) * sub))), replace=False),\n                                    rng.choice(neg, max(1, int(round(len(neg) * sub))), replace=False)]))\n    else:\n      idx = np.arange(len(y))\n    if rep:\n      idx = np.concatenate([idx] + [np.intersect1d(idx, pos)] * rep)\n    out.append(idx)\n  return out\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# polish_companies_bankruptcy — scored pipeline\n\nMetric is `1 - AUC` (lower is better). Test score of this pipeline: **0.005178**, mean over the 9\nTabArena folds (per-fold spread 0.0025–0.0075). The published TabFM baselines on the same folds are\n0.005806 plain / 0.004802 ensemble. Search best under 5×2 repeated stratified CV was 0.00535.\n\n## What it does\n\nTabFM is the only predictor; everything here is about the table it gets to attend over. The 64\nfinancial-ratio columns are heavy-tailed and span many orders of magnitude, so each one is passed\nthrough a signed log, `sign(x)·log1p(|x|)`, which compresses the tails while keeping the sign — on\nbankruptcy ratios (negative equity, negative working capital, negative profit) the sign carries real\ninformation, so a plain log or a rank transform throws something away. The ratio set is also highly\nredundant: a greedy pass drops any column whose absolute Pearson correlation with an already-kept\ncolumn exceeds 0.98, which shortens the context TabFM has to read without losing a direction of\nvariation. Missingness is treated as signal rather than noise: NaNs are left as NaNs for TabFM to\nhandle, and the pattern is made explicit with one binary indicator per column that has any missing\nvalue plus a single `n_missing` count per row. Finally, `feat_shuffle_method` is set to `none`, so\nTabFM's ensemble members all see the columns in the same, natural order instead of independently\npermuted ones — on a table this small (3,940 train rows) that turned out to help rather than hurt.\n\nNo row sampling, no reweighting, no calibration: the whole training set is one draw, and the\npredicted probabilities are returned untouched (AUC is rank-only, so a monotone postprocess could not\nchange the score). The `engineer()` body carries several other switches — winsorizing, MAD scaling,\ncube root, rank→Gaussian, median/sentinel fill, correlation-cluster averaging, MI column ordering,\nlog-ratio pair features, GBDT out-of-fold log-odds as a column, permutation-importance top-k\nselection — but the scored config (`CFG = {'tf': 'slog', 'miss_ind': 1, 'n_miss': 1, 'dedup': 0.98}`)\nleaves all of them off. They are dead code in this configuration, kept because the file is the exact\nartifact that was scored.\n\n`folds()` is 5-fold stratified, repeated twice (`random_state=12345`), which is what the search\nvalidated against; rows are exchangeable here, so nothing beyond stratifying on the rare positive\nclass is needed.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that says so and exits 0 — the pipeline reads no cache, no\nprecomputed feature file, no external artifact. It runs in well under a second and needs no disk.\nGo straight to `python final/run.py` (a few minutes, dominated by the TabFM forward passes; the\nrecorded final took ~61 s of pipeline+model time at 8 estimators).\n\n## Things a reader could get wrong\n\n- **`final/build/gen.py` is not a data step.** It is a code generator: `python gen.py '\u003cjson cfg\u003e'`\n  writes `pipeline.py` from a template, and `sweep.sh` in the workspace called it once per candidate\n  config so several evaluations could be queued per turn. The chosen config is already inlined in\n  `final/pipeline.py`. Do not run gen.py as part of a reproduction — it writes `pipeline.py` into the\n  current directory and would clobber the scored record.\n- **The scored snapshot is `history/pipeline_065.py`**, copied here as `final/pipeline.py`. Later\n  snapshots exist in `history/` (up to 096) and are *not* what was tested.\n- **`run.py` copies `final/pipeline.py` over the workspace `pipeline.py`** because the judge's\n  `apply_hooks` loads it by name. It refuses to do so if the two differ, which is a safety check, not\n  a failure of the build.\n- The dedup threshold is applied *after* the signed-log transform and is fitted per fold on that\n  fold's training rows, so the surviving column set is not fixed across folds. That is intentional;\n  it keeps the selection inside the fold and out of the validation rows."},{"id":"qsar-biodeg","name":"qsar-biodeg","short_name":"qsar-biodeg","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.058046,"plain_note":null,"n_train":702,"n_test":352,"n_folds":30,"thresholds":null,"summary":"The task is 702 training molecules described by 41 numeric molecular descriptors, binary biodegradability, scored as 1 − AUC. TabFM sees the 41 descriptors exactly as given: every representation change tried during the run — added percentile-rank copies, dropping the nine near-constant columns, log1p on the count columns, out-of-fold model scores as extra columns, synthetic feature crosses, SVD columns, and a PCA…","score":0.058188,"gain_pct":-0.244634,"medal":null,"category":"II","lines":127,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{"outlier_threshold":"1000.0","average_logits":"False"},"helper_functions":["_key","_rank","_ratios","_partners"],"helper_ranges":{"_key":[26,28],"_rank":[31,32],"_ratios":[35,48],"_partners":[51,65]},"hook_helpers":{"preprocess":["_key","_ratios","_partners"],"engineer":[],"postprocess":["_key","_rank"],"folds":[]},"hook_ranges":{"preprocess":[68,93],"engineer":[96,104],"postprocess":[107,127],"folds":[20,23]},"code":"import hashlib\nimport pathlib\n\nimport numpy as np\nimport pandas as pd\nfrom threadpoolctl import threadpool_limits\n\nCONTEXT_FRACTION = 0.75\nTABFM_KWARGS = {'outlier_threshold': 1000.0, 'average_logits': False}\nBLEND_W = 0.60           # weight on TabFM's ranking; 1.0 is TabFM alone\nPSEUDO_P = 1.0           # partner agreement needed before a test row joins the context (1.0 = off)\nLOG_COUNTS = False       # log1p the integer count columns\n\nID_COLS = ('row_id',)\nDUMP = pathlib.Path('.dump')\nPARTNER = pathlib.Path('.partner')\n_STATE = {}\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=5, random_state=0)\n  return list(rskf.split(X_train, y_train))\n\n\ndef _key(X, cols):\n  return hashlib.sha1(np.ascontiguousarray(\n      X[cols].to_numpy(dtype=np.float64)).tobytes()).hexdigest()[:16]\n\n\ndef _rank(a):\n  return pd.Series(a).rank(pct=True).to_numpy()\n\n\ndef _ratios(df):\n  \"\"\"Twelve descriptor ratios for the tree members of the blend partner. Trees split one column at\n  a time, so a ratio is information they cannot reach; TabFM never sees these.\"\"\"\n  g = lambda c: df[c].to_numpy(float)\n  hv, o, n, x = (g('Num_Heavy_Atoms'), g('Num_Oxygen_Atoms'), g('Num_Nitrogen_Atoms'),\n                 g('Num_Halogen_Atoms'))\n  cir, don = g('Num_Circuits'), g('Num_HBond_Donors_Atoms')\n  return df.assign(r_o_hv=o / (hv + 1), r_x_hv=x / (hv + 1), r_n_o=n / (o + 1),\n                   r_on_x=(o + n) / (x + 1), r_don_on=don / (o + n + 1), r_cir_hv=cir / (hv + 1),\n                   r_dO_o=g('Sum_dO_EStates') / (o + 1),\n                   r_benz_cir=g('Num_Substituted_BenzeneC') / (cir + 1),\n                   r_prim_hv=g('Num_Terminal_PrimaryC') / (hv + 1), hetero=o + n + x,\n                   c_est=g('Percentage_C_Atoms') * (hv + 1),\n                   r_eneg_ip=g('Mean_Sanderson_Electronegativity') / g('Mean_Ionization_Potential'))\n\n\ndef _partners():\n  \"\"\"(model, reads_ratios) -- the trees get the ratio columns, QDA is better without them.\"\"\"\n  from sklearn.discriminant_analysis import QuadraticDiscriminantAnalysis\n  from sklearn.ensemble import (ExtraTreesClassifier, HistGradientBoostingClassifier,\n                                RandomForestClassifier)\n  from sklearn.pipeline import make_pipeline\n  from sklearn.preprocessing import QuantileTransformer\n  return [(RandomForestClassifier(1000, random_state=0), True),\n          (ExtraTreesClassifier(1000, min_samples_leaf=2, max_features=0.4, random_state=0), True),\n          (HistGradientBoostingClassifier(max_iter=200, learning_rate=0.06, max_leaf_nodes=15,\n                                          l2_regularization=1.0, early_stopping=False,\n                                          random_state=0), True),\n          (make_pipeline(QuantileTransformer(output_distribution='normal', n_quantiles=250,\n                                             random_state=0),\n                         QuadraticDiscriminantAnalysis(reg_param=0.5)), False)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  \"\"\"Fits the two partner models on the real training rows -- their test scores are both the blend\n  ingredient postprocess needs and the pseudo-label source -- then extends the context with the test\n  rows they agree on. preprocess and engineer share a process, so _STATE carries the scores over.\"\"\"\n  feats = [c for c in X_train.columns if c not in ID_COLS]\n  y = (np.asarray(y_train) == 'Yes').astype(int)\n  if len(np.unique(y)) \u003c 2:            # `judge.py check` hands over a single-class slice\n    return X_train, y_train, X_test\n  Atr, Ate = _ratios(X_train[feats]), _ratios(X_test[feats])\n  with threadpool_limits(limits=1):    # ~100 cores against a 561x41 table is all OpenMP overhead\n    p = np.array([m.fit(*( (Atr, y) if r else (X_train[feats], y) ))\n                  .predict_proba(Ate if r else X_test[feats])[:, 1] for m, r in _partners()])\n  _STATE['partner'], _STATE['key'] = p, _key(X_test, feats)   # key on the untransformed test rows,\n  if LOG_COUNTS:                                              # which is what postprocess is handed\n    counts = [c for c in feats if X_train[c].dtype.kind == 'i' and X_train[c].max() \u003e 3]\n    X_train = X_train.assign(**{c: np.log1p(X_train[c]) for c in counts})\n    X_test = X_test.assign(**{c: np.log1p(X_test[c]) for c in counts})\n  if PSEUDO_P \u003e= 1.0:\n    return X_train, y_train, X_test\n  hi, lo = (p \u003e PSEUDO_P).all(axis=0), (p \u003c 1 - PSEUDO_P).all(axis=0)\n  take = np.where(hi | lo)[0]\n  if not len(take):\n    return X_train, y_train, X_test\n  lab = pd.Series(np.where(hi[take], 'Yes', 'No')).astype(y_train.dtype)\n  return (pd.concat([X_train, X_test.iloc[take]], ignore_index=True),\n          pd.concat([y_train, lab], ignore_index=True), X_test)\n\n\ndef engineer(X_train, y_train, X_test):\n  TABFM_KWARGS['max_num_rows'] = int(round(CONTEXT_FRACTION * len(X_train)))\n  try:\n    if 'partner' in _STATE:\n      PARTNER.mkdir(exist_ok=True)\n      np.save(PARTNER / f\"{_STATE['key']}.npy\", _STATE['partner'])\n  except Exception:\n    pass          # postprocess finds no file and returns TabFM's own probabilities unblended\n  return X_train, X_test\n\n\ndef postprocess(pred, y_orig, X_test):\n  feats = [c for c in X_test.columns if c not in ID_COLS]\n  key = _key(X_test, feats)\n  f = PARTNER / f'{key}.npy'\n  part = np.load(f) if f.exists() else None\n  try:                                 # the offline harness joins these back to data/train.csv\n    DUMP.mkdir(exist_ok=True)\n    np.savez(DUMP / f'{key}.npz', X=np.ascontiguousarray(X_test[feats].to_numpy(dtype=np.float64)),\n             cols=np.array(feats), pred=pred.to_numpy(dtype=np.float64),\n             classes=np.array([str(c) for c in pred.columns]),\n             partner=np.zeros((0, len(pred))) if part is None else part)\n  except Exception:\n    pass\n  if 'Yes' not in pred.columns or part is None:\n    return pred                        # `judge.py check`, or a probe run with no partner fitted\n  yes = pred['Yes'].to_numpy(dtype=np.float64)\n  s = BLEND_W * _rank(yes) + (1 - BLEND_W) * np.mean([_rank(p) for p in part], axis=0)\n  out = pred.copy()   # not a fresh DataFrame: a new string column index does not survive the\n  out['Yes'] = s      # hook's pickle round-trip on this pandas build (pyarrow-backed str dtype)\n  out['No'] = 1.0 - s\n  return out\n","readme":"# qsar-biodeg — final pipeline\n\n## What it does\n\nThe task is 702 training molecules described by 41 numeric molecular descriptors, binary\nbiodegradability, scored as 1 − AUC. TabFM sees the 41 descriptors exactly as given: every\nrepresentation change tried during the run — added percentile-rank copies, dropping the nine\nnear-constant columns, log1p on the count columns, out-of-fold model scores as extra columns,\nsynthetic feature crosses, SVD columns, and a PCA rotation at identical column count — measured\nworse than the identity on 25 folds, most of them well past the noise. What is tuned is how the\nensemble reads the table rather than what is in it: TabFM's 4-sigma outlier clip is switched off\n(it bites hardest on the un-normalised half of the ensemble, which is where these zero-inflated\ncounts keep their signal), members are pooled as probabilities rather than logits, and each of the\neight members is given a fresh 75 % bagged sample of the training rows. That last knob is the\nlargest TabFM-side effect in the run — on a table this small nothing else subsamples rows, so\nwithout it the members differ only by column order and class rotation. Because the judge reads\n`TABFM_KWARGS` after the hooks run and the split sizes differ (561 rows in CV, 702 in the final),\n`engineer()` writes `max_num_rows` itself.\n\nOn top of that, `postprocess` blends rankings: 0.60 on TabFM's ranking of the test rows and 0.40 on\nthe mean ranking of four ordinary sklearn models fitted on the same training rows — a random\nforest, extra trees, a histogram gradient booster, and QDA behind a normal quantile transform. The\nthree tree models additionally get twelve hand-built descriptor ratios (oxygens per heavy atom,\nhalogens per heavy atom, heteroatom count, electronegativity over ionisation potential, and so on);\na tree cannot form a ratio for itself, whereas TabFM rejects every extra column, so these never\nleave `preprocess` and TabFM's own input is untouched. QDA is better on the raw 41. TabFM remains\nthe predictor — it carries the majority of the weight alone against four models sharing the rest,\nand its correlation with the blended output is 0.994 — but the blend is worth 0.0021, the single\nlargest effect measured in the run. The partner set and the ratio columns were chosen on a separate\n5×6 CV (seed 1234) that TabFM's dumps do not cover, so only the blend weight was fitted to the 25\nscoring folds. Validation uses 5×5 repeated stratified CV; the rows are exchangeable, so there is no\ngroup or time structure to mirror.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`. The pipeline reads no precomputed cache: the\none file it opens, `.partner/\u003ckey\u003e.npy`, is written by its own `engineer()` hook seconds earlier in\nthe same run, and `.dump/\u003ckey\u003e.npz` is write-only. It takes no time and no disk.\n\nThe full reproduction is therefore just:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\nwhich is one TabFM pass with eight estimators over a 702-row context plus four small sklearn fits —\na couple of minutes on a GPU, dominated by model load.\n\n## Things a reader could get wrong\n\n- **`final/build/` does not build anything.** Those eleven scripts are the offline analysis harness\n  used during the search: `oh.py` matches the `.dump/*.npz` validation dumps back to\n  `data/train.csv` by row content and rescores post-processing for free, `cmp.py` does the paired\n  t-test between two `[RESULT n]` lines in `log.txt`, and the rest are one-off probes (ratio search,\n  greedy partner selection, PLS, nested weight fitting, decorrelation). They print numbers; none of\n  them writes a pipeline input. They are copied here for the record, not for the build.\n- **`.partner/` and `.dump/` are run-local.** Both are keyed by a hash of the test-row contents, so\n  a leftover directory from a different split cannot be picked up by mistake. If you want certainty,\n  delete both before running; the pipeline recreates what it needs. This matters because one probe\n  run during the search *did* silently re-read a previous run's partner file and scored as if\n  blended — that probe path was removed rather than patched, and the current pipeline only ever\n  reads a file written in the same process.\n- **`PSEUDO_P = 1.0` and `LOG_COUNTS = False` are inert.** They are two preprocess experiments left\n  in the code at their off values, kept because the measurements next to them in the module\n  docstring are the reason the pipeline does not use them. Do not read them as active features.\n- **The `pred.copy()` in `postprocess` is deliberate.** A DataFrame whose column index is\n  constructed inside a hook does not survive the pickle back to the judge on this pandas build\n  (ImportError on a pyarrow-backed StringArray). Mutating the frame the judge handed over is the\n  fix; building a fresh one costs two evaluations to rediscover.\n- **`threadpool_limits(1)` in `preprocess` is not a leftover.** ~100 cores against a 561×41 table is\n  all OpenMP overhead; the partner fits are meaningfully faster single-threaded.\n- **`run.py` copies `final/pipeline.py` over the workspace `pipeline.py`** and refuses to run if the\n  two differ, so the reproduction cannot drift from what was scored."},{"id":"QSAR-TID-11","name":"QSAR-TID-11","short_name":"QSAR-TID-11","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":0.754764,"plain_note":null,"n_train":3828,"n_test":1914,"n_folds":9,"thresholds":null,"summary":"The task is regression of `MEDIAN_PXC50` from 1024 binary FCFP6 fingerprint bits, scored by RMSE (lower is better), on ~3.8k training rows.","score":0.727102,"gain_pct":3.664987,"medal":null,"category":"II","lines":83,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer","postprocess"],"tabfm_kwargs":{"n_svd_features":"'sqrt'","enable_nnls":"True"},"helper_functions":["_bits","_sim","_mean_kernel","_kernel_pred"],"helper_ranges":{"_bits":[16,17],"_sim":[20,27],"_mean_kernel":[30,31],"_kernel_pred":[34,37]},"hook_helpers":{"preprocess":[],"engineer":["_bits","_sim","_mean_kernel","_kernel_pred"],"postprocess":[]},"hook_ranges":{"preprocess":[40,41],"engineer":[44,63],"postprocess":[66,83]},"code":"import numpy as np\nimport pandas as pd\nfrom sklearn.svm import SVR\n\nTABFM_KWARGS = {'n_svd_features': 'sqrt', 'enable_nnls': True}\n\nN_BITS = 500\nW_TABFM = 0.66\nW_RARE = 0.10\nSVR_C = 10.0\nSVR_EPS = 0.0\nTVERSKY = 0.7\nBLEND_FILE = '.blend.csv'\n\n\ndef _bits(X):\n  return [c for c in X.columns if c.startswith('FCFP6_')]\n\n\ndef _sim(A, B, alpha=None):\n  \"\"\"Tanimoto (alpha=None) or symmetric Tversky: how harshly the bits only one molecule has are counted.\"\"\"\n  inter = A @ B.T\n  na = A.sum(1)[:, None]\n  nb = B.sum(1)[None, :]\n  if alpha is None:\n    return inter / (na + nb - inter + 1e-9)\n  return inter / (inter + alpha * (na - inter) + alpha * (nb - inter) + 1e-9)\n\n\ndef _mean_kernel(A, B):\n  return (0.5 * (_sim(A, B) + _sim(A, B, TVERSKY))).astype(np.float64)\n\n\ndef _kernel_pred(A, B, y):\n  m = SVR(C=SVR_C, kernel='precomputed', epsilon=SVR_EPS, tol=1e-3,\n          cache_size=1000).fit(_mean_kernel(A, A), y)\n  return m.predict(_mean_kernel(B, A))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  cols = _bits(X_train)\n  A = X_train[cols].to_numpy(np.float32)\n  B = X_test[cols].to_numpy(np.float32)\n  y = np.asarray(y_train, dtype=np.float64).ravel()\n\n  order = np.argsort(-A.var(0), kind='stable')\n  sel = np.sort(order[:N_BITS])\n  rest = np.sort(order[N_BITS:])\n\n  try:\n    base = _kernel_pred(A, B, y)\n    if len(rest):                       # the bits the column cap keeps away from TabFM\n      base = (1.0 - W_RARE) * base + W_RARE * _kernel_pred(A[:, rest], B[:, rest], y)\n    pd.DataFrame({'row_id': X_test['row_id'].to_numpy(), 'base': base}).to_csv(BLEND_FILE, index=False)\n  except Exception:\n    pd.DataFrame({'row_id': [], 'base': []}).to_csv(BLEND_FILE, index=False)\n\n  keep = [cols[i] for i in sel]\n  return X_train[keep], X_test[keep]\n\n\ndef postprocess(pred, y_orig, X_test):\n  p = np.asarray(pred, dtype=np.float64).ravel()\n  base = None\n  try:\n    b = pd.read_csv(BLEND_FILE)\n    m = pd.DataFrame({'row_id': X_test['row_id'].to_numpy()}).merge(b, on='row_id', how='left')\n    if len(m) == len(p) and m['base'].notna().all():\n      base = m['base'].to_numpy()\n  except Exception:\n    base = None\n  out = p if base is None else W_TABFM * p + (1.0 - W_TABFM) * base\n  try:\n    pd.DataFrame({'row_id': X_test['row_id'].to_numpy(), 'pred': p,\n                  'base': base if base is not None else np.nan}).to_csv('preds_dump.csv', mode='a',\n                                                                        header=False, index=False)\n  except Exception:\n    pass\n  return pd.Series(out, index=pred.index if hasattr(pred, 'index') else None)\n","readme":"# QSAR-TID-11 — TabFM blended with a Tanimoto/Tversky-kernel SVR\n\nThe task is regression of `MEDIAN_PXC50` from 1024 binary FCFP6 fingerprint bits, scored by RMSE\n(lower is better), on ~3.8k training rows.\n\nThe pipeline is a fixed-weight blend of two predictors over the same rows. TabFM is the main one, but\nit can only take 500 columns, so `engineer` ranks the 1024 bits by variance and hands it the top 500 —\nthat is the only thing done to the features; there is no encoding, scaling, or synthetic column.\nAlongside it, `engineer` fits a chemistry-appropriate similarity model that the column cap does not\nconstrain: an SVR (`C=10`, `epsilon=0`) on a precomputed kernel that is the average of the Tanimoto\ncoefficient and a symmetric Tversky coefficient with `alpha=0.7`, i.e. two ways of trading off shared\nbits against bits only one molecule carries. That kernel model is itself a small blend: 0.90 of it is\ncomputed over all 1024 bits, and 0.10 over the 524 low-variance bits *alone* — the block TabFM never\nsees. That second term is a weak model on its own but is the most decorrelated component available\n(error correlation ~0.69 with TabFM, against ~0.87 for the full-bit kernel), precisely because it is\nbuilt from what TabFM is blind to. `engineer` writes the kernel prediction to `.blend.csv` keyed by\n`row_id`; `postprocess` reads it back, joins on `row_id`, and returns `0.66 * TabFM + 0.34 * kernel`.\nEvery weight is a fixed constant, chosen by cross-validation during the search, not refit at predict\ntime; if the kernel side fails or the join is incomplete, `postprocess` silently falls back to the\nraw TabFM prediction.\n\nScored result: mean RMSE **0.7271** over the 9 TabArena folds, against the published TabFM baselines\nof 0.7548 (plain) and 0.7329 (ensemble). Search-time 3-fold CV was 0.7370.\n\n## build.sh\n\nThere is nothing to build. `build.sh` is a comment and `exit 0`. The pipeline reads no cache, no\nprecomputed feature file, and no fitted artifact — only the frames the judge passes to its hooks. The\none filename it mentions, `.blend.csv`, it creates itself inside `engineer` and consumes inside\n`postprocess` on the same fold. Zero time, zero disk.\n\nTo reproduce:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader could get wrong\n\n- **`.blend.csv` is state, not a cache.** It is the channel between `engineer` and `postprocess`\n  within one fold, rewritten every time `engineer` runs. It must not be pre-seeded, and a stale copy\n  left in the workspace is harmless only because the join is on `row_id` and is checked for\n  completeness before use. Do not run two folds concurrently in the same working directory.\n- **`preds_dump.csv` is append-only diagnostic output** from the run's search, not an input, not a\n  submission. Nothing reads it. It will keep growing across runs; deleting it changes nothing.\n- **The 500-bit cap is TabFM's, not a modelling choice.** The variance ranking is a way to spend the\n  budget, and the run measured that alternatives (an LSA summary of the discarded block, selecting\n  bits by |corr| with the target) were both worse. The discarded bits are recovered on the SVR side\n  instead — that is what the `W_RARE = 0.10` term exists for.\n- **The weights are dataset-specific constants.** `W_TABFM = 0.66`, `W_RARE = 0.10`, `TVERSKY = 0.7`,\n  `SVR_C = 10` were all tuned on this training set's CV folds; none of them adapt.\n- **Cost scales quadratically.** The kernel is dense over all training rows (`n x n` Gram plus\n  `n_test x n` for prediction), computed twice per fold — once on 1024 bits, once on 524. At ~3.8k\n  training rows that is negligible; on a much larger split it would dominate, and it would also hit\n  the judge's 600 s per-stage limit long before TabFM did."},{"id":"QSAR_fish_toxicity","name":"QSAR_fish_toxicity","short_name":"QSAR_fish_toxicity","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":0.853535,"plain_note":null,"n_train":604,"n_test":303,"n_folds":30,"thresholds":null,"summary":"TabFM remains the predictor; everything around it is a small amount of local-neighbourhood regularisation, which is what a dataset this size and this smooth responds to.","score":0.848292,"gain_pct":0.614269,"medal":null,"category":"II","lines":73,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","outlier_threshold":"2.0","feat_shuffle_method":"'none'"},"helper_functions":["_knn_oof","_add"],"helper_ranges":{"_knn_oof":[22,31],"_add":[50,56]},"hook_helpers":{"preprocess":["_knn_oof"],"engineer":["_add"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[34,47],"engineer":[59,64],"postprocess":[67,73],"folds":[11,19]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt', 'outlier_threshold': 2.0, 'feat_shuffle_method': 'none'}\n\nF = ['CIC0', 'SM1_Dz(Z)', 'GATS1i', 'NdsCH', 'NdssC', 'MLOGP']\nNEW = [('r_mg', 'm / g'), ('r_sg', 's / g'), ('r_cg', 'c / g'), ('p_mc', 'm * c'), ('p_cs', 'c * s'), ('p_ms', 'm * s')]\nSTATE = '.pipe_state.pkl'   # engineer and postprocess run in separate processes; the workspace is the only channel\n\n\ndef folds(X_train, y_train):\n  \"\"\"Repeated stratified CV: 3 shuffles x 5 folds, so every row is scored three times under\n  three different training sets. The mean is the selection signal; a single 5-fold split moves\n  by ~0.002 on nothing but which rows landed together.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = np.asarray(y_train, dtype=float).ravel()\n  bins = np.digitize(y, np.quantile(y, np.linspace(0, 1, 11)[1:-1]))\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=3, random_state=7)\n  return list(rskf.split(np.zeros(len(y)), bins))\n\n\ndef _knn_oof(X, y, k=10):\n  \"\"\"Out-of-fold distance-weighted kNN estimate of the target, fitted inside the training rows only.\"\"\"\n  from sklearn.model_selection import KFold\n  from sklearn.neighbors import KNeighborsRegressor\n  from sklearn.preprocessing import StandardScaler\n  A = StandardScaler().fit_transform(X[F])\n  oof = np.zeros(len(A))\n  for tr, va in KFold(10, shuffle=True, random_state=0).split(A):\n    oof[va] = KNeighborsRegressor(k, weights='distance').fit(A[tr], y[tr]).predict(A[va])\n  return oof\n\n\ndef preprocess(X_train, y_train, X_test):\n  from sklearn.model_selection import KFold\n  from sklearn.preprocessing import StandardScaler\n  from sklearn.neighbors import KNeighborsRegressor\n  from sklearn.svm import SVR\n  from sklearn.ensemble import ExtraTreesRegressor\n  y = np.asarray(y_train, dtype=float).ravel()\n  A = StandardScaler().fit_transform(X_train[F])\n  oof = np.zeros(len(A))\n  for tr, va in KFold(10, shuffle=True, random_state=0).split(A):\n    oof[va] = (KNeighborsRegressor(5, weights='distance').fit(A[tr], y[tr]).predict(A[va])\n               + SVR(C=3).fit(A[tr], y[tr]).predict(A[va])\n               + ExtraTreesRegressor(200, random_state=0).fit(A[tr], y[tr]).predict(A[va])) / 3\n  return X_train, pd.Series((1 - 0.30) * y + 0.30 * oof, index=X_train.index), X_test\n\n\ndef _add(X):\n  X = X.copy()\n  c, s, g, m = X['CIC0'], X['SM1_Dz(Z)'], X['GATS1i'], X['MLOGP']\n  h, j = X['NdsCH'], X['NdssC']\n  for k, expr in NEW:\n    X[k] = eval(expr)\n  return X\n\n\ndef engineer(X_train, y_train, X_test):\n  Xtr, Xte = _add(X_train), _add(X_test)\n\n  pd.to_pickle({'X': X_train[F].reset_index(drop=True),\n                'y': np.asarray(y_train, dtype=float).ravel()}, STATE)\n  return Xtr, Xte\n\n\ndef postprocess(pred, y_orig, X_test):\n  from sklearn.preprocessing import StandardScaler\n  from sklearn.neighbors import KNeighborsRegressor\n  st = pd.read_pickle(STATE)\n  sc = StandardScaler().fit(st['X'])\n  p = KNeighborsRegressor(10, weights='distance').fit(sc.transform(st['X']), st['y']).predict(sc.transform(X_test[F]))\n  return (1 - 0.26) * pred + 0.26 * pd.Series(p, index=pred.index)\n","readme":"# QSAR fish toxicity — pipeline_094\n\n604 training rows, 6 numeric molecular descriptors, target `LC50`, scored by RMSE (lower is better).\n\n## What the pipeline does\n\nTabFM remains the predictor; everything around it is a small amount of local-neighbourhood\nregularisation, which is what a dataset this size and this smooth responds to.\n\n- **Target smoothing (`preprocess`).** An out-of-fold estimate of `LC50` is built from the standardised\n  six descriptors by averaging three cheap learners — distance-weighted 5-NN, an RBF `SVR(C=3)`, and a\n  200-tree `ExtraTreesRegressor` — under a 10-fold split. TabFM is then trained on\n  `0.70 * y + 0.30 * oof`: label noise on individual compounds gets pulled toward what their neighbours\n  say, which is worth more than it costs in bias at n=604.\n- **Feature engineering (`engineer`).** Six ratio/product crosses of the four continuous descriptors\n  (`MLOGP`, `SM1_Dz(Z)`, `CIC0`, `GATS1i`) are appended: `m/g`, `s/g`, `c/g`, `m*c`, `c*s`, `m*s`. The\n  two count features (`NdsCH`, `NdssC`) are left alone. `engineer` also pickles the original six\n  columns and the raw targets to `.pipe_state.pkl`, because `postprocess` runs in a separate process\n  and the workspace is the only channel between them.\n- **TabFM knobs.** `n_feature_crosses='sqrt'`, `outlier_threshold=2.0`, `feat_shuffle_method='none'`.\n- **kNN blend (`postprocess`).** A distance-weighted 10-NN fitted on all training rows (raw targets,\n  standardised descriptors) predicts the test rows, and the final answer is\n  `0.74 * tabfm + 0.26 * knn`. TabFM still carries the prediction — `tabfm_corr` on the test pass was\n  0.998.\n- **Validation (`folds`).** 3× repeated 5-fold CV, stratified on target deciles, so every row is scored\n  three times. A single 5-fold split on 604 rows moves by ~0.002 on fold assignment alone, which is the\n  same size as the effects being selected between.\n\nHeld-out test RMSE 0.8483 (CV selection score 0.8329). Over the 30 TabArena folds it averaged 0.8460\nagainst 0.8535 for plain TabFM and 0.8539 for the TabFM ensemble baseline.\n\n## What build.sh builds\n\nNothing. The pipeline reads no cache it does not write itself (`.pipe_state.pkl` is produced by\n`engineer` on every pass), and the run created no helper scripts, so `final/build.sh` is a comment and\n`exit 0`. It takes no time and no disk. There is no `final/build/` directory for the same reason.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader could get wrong\n\n- **`.pipe_state.pkl` is written into the workspace root, not `final/`.** `run.py` chdirs to the\n  workspace before calling the hooks, so the relative path resolves there. If two runs of this pipeline\n  ever share a working directory concurrently they would clobber each other's state file; sequential\n  runs are fine because `engineer` always rewrites it before `postprocess` reads it.\n- **The 0.30 target smoothing is a training-side transform only.** `preprocess` returns a modified\n  `y_train`; the metric is still computed against the untouched labels, and `postprocess` blends in a\n  kNN fitted on the *raw* targets, which partly undoes the shrinkage on the prediction side. The two\n  weights (0.30 and 0.26) were tuned together — moving one without the other is not a small change.\n- **`_add` uses `eval` over a fixed table of expressions.** That is cosmetic, not dynamic: `NEW` is a\n  module-level literal, so the feature set is static.\n- **`_knn_oof` is dead code** left over from an earlier candidate; nothing calls it.\n- Total runtime is dominated by the TabFM pass; the sklearn parts are seconds on this data (the\n  recorded 30-fold run spent ~90 s in `pre` and ~30 s in `post` across all 30 folds)."},{"id":"SDSS17","name":"SDSS17","short_name":"SDSS17","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.069689,"plain_note":null,"n_train":52035,"n_test":26018,"n_folds":9,"thresholds":null,"summary":"The prediction is made entirely by frozen zero-shot TabFM; the pipeline only changes *what it sees*. Two things happen. First, the 11 raw columns are rewritten into an astronomically natural basis: the two positional columns that carry no class signal but do carry survey-footprint noise (`cam_col`, `fiber_ID`) are dropped, and the five photometric magnitudes `u g r i z` are replaced by four colours (`u-r`, `g-r`…","score":0.056423,"gain_pct":19.036003,"medal":null,"category":"I","lines":37,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["engineer","sample"],"tabfm_kwargs":{"average_logits":"True","softmax_temperature":"1.0","norm_methods":"['quantile']"},"helper_functions":["_basis"],"helper_ranges":{"_basis":[14,19]},"hook_helpers":{"preprocess":[],"engineer":["_basis"],"sample":[],"postprocess":[]},"hook_ranges":{"preprocess":[10,11],"engineer":[22,23],"sample":[26,33],"postprocess":[36,37]},"code":"import numpy as np\n\nTABFM_KWARGS = {'average_logits': True, 'softmax_temperature': 1.0, 'norm_methods': ['quantile']}\nDRAWS, FRAC = 5, 0.95\nDROP = ['cam_col', 'fiber_ID']\nPAIRS = [('u', 'r'), ('g', 'r'), ('r', 'i'), ('r', 'z')]\nANCHOR_BANDS = ['g', 'r', 'i']\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _basis(df):\n  out = df.drop(columns=DROP).copy()\n  for a, b in PAIRS:\n    out[f'{a}_{b}'] = out[a] - out[b]\n  out['mag'] = out[ANCHOR_BANDS].mean(axis=1)\n  return out.drop(columns=['u', 'g', 'r', 'i', 'z'])\n\n\ndef engineer(X_train, y_train, X_test):\n  return _basis(X_train), _basis(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  rng = np.random.default_rng(0)\n  k = int(round(FRAC * n))\n  out = [np.arange(n)]\n  while len(out) \u003c DRAWS:\n    out.append(np.sort(rng.choice(n, k, replace=False)))\n  return out\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# SDSS17 — ObjectType (GALAXY / QSO / STAR), log loss, lower is better\n\n## What the pipeline does\n\nThe prediction is made entirely by frozen zero-shot TabFM; the pipeline only changes *what it sees*.\nTwo things happen. First, the 11 raw columns are rewritten into an astronomically natural basis: the\ntwo positional columns that carry no class signal but do carry survey-footprint noise (`cam_col`,\n`fiber_ID`) are dropped, and the five photometric magnitudes `u g r i z` are replaced by four colours\n(`u-r`, `g-r`, `r-i`, `r-z`) plus one brightness anchor, `mean(g, r, i)`. Colours are what separate\nquasars from stars and galaxies — a magnitude difference is distance-independent, whereas the raw\nmagnitudes are five strongly collinear columns that mostly encode apparent brightness. Anchoring on\nthe mean of the three best-measured SDSS bands rather than on a single band keeps the same brightness\ninformation with less photometric noise. Everything else (`alpha`, `delta`, `redshift`, `plate`,\n`MJD`, `spec_obj_ID`) passes through unchanged, so TabFM gets 9 columns instead of 11. Second, the\nprediction is bagged over the training context: `sample()` returns five index sets — one full draw\nplus four independent 95 % subsamples (seeded, `default_rng(0)`) — and TabFM runs once per draw with\n`average_logits=True`, `softmax_temperature=1.0` and quantile normalisation, so the five in-context\npasses are averaged in logit space. No post-processing is applied to the probabilities.\n\nValidation log loss on the harness's 3-fold CV was **0.05755**, against published TabFM baselines of\n0.069689 (plain) and 0.068171 (ensemble) on the same model and folds.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0. The pipeline reads no caches, no auxiliary\nartefacts, and no files at all — it is four pure hooks over the DataFrames the judge passes in, using\nonly numpy. It needs no disk beyond the raw `data/train.csv` and `data/test.csv` and takes no time.\n\n```\ncd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **The cost is all TabFM, and it is 5×.** `sample()` returning five index sets means five full\n  in-context passes per estimator, over ~52k and ~49k context rows. The hooks themselves are\n  microseconds; the wall clock is entirely the foundation-model passes, so budget accordingly.\n- **`DROP` is applied before the colour arithmetic** and only names `cam_col` and `fiber_ID`; the\n  judge's `row_id` is added to X and removed again by the judge itself, so the pipeline never sees or\n  drops it. If you run these hooks outside `judge.py`, do not pass `row_id` through to `engineer`.\n- **The raw magnitudes do not survive `engineer`.** `u g r i z` are dropped after the colours and the\n  anchor are computed; TabFM never sees an individual band.\n- **The subsample seed is fixed at 0 and the first draw is always the full training set**, so results\n  are reproducible run to run, but the bagging is *not* an out-of-bag scheme — the draws overlap\n  heavily by design (95 % each). They exist to decorrelate TabFM's in-context attention, not to\n  estimate variance.\n- **`FRAC = 0.95` was tuned against 3-fold CV on this task's fold-0 training split.** It is a\n  small-effect knob (differences of ~0.0005 in log loss); do not read it as a general recipe."},{"id":"seismic-bumps","name":"seismic-bumps","short_name":"seismic-bumps","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.206037,"plain_note":null,"n_train":1722,"n_test":862,"n_folds":9,"thresholds":null,"summary":"Frozen TabFM does all the predicting; the pipeline only changes the shape of the table it attends over. Three things happen, in this order. **Columns are removed.** Of the 18 original features only 8 survive: `seismic`, `shift`, `genergy`, `gpuls`, `gdenergy`, `gdpuls`, `nbumps`, plus the derived one below.","score":0.198742,"gain_pct":3.540626,"medal":null,"category":"II","lines":89,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"norm_methods":"['power', 'quantile_rtdl']"},"helper_functions":["_shape","_rankify"],"helper_ranges":{"_shape":[22,51],"_rankify":[54,68]},"hook_helpers":{"preprocess":[],"engineer":["_shape","_rankify"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[18,19],"engineer":[71,85],"postprocess":[88,89],"folds":[11,15]},"code":"import numpy as np\n\nVARIANT = 'base'\n\nTABFM_KWARGS = {'norm_methods': ['power', 'quantile_rtdl']}\n\n_DROP = ['ghazard', 'nbumps5', 'seismoacoustic', 'maxenergy', 'nbumps2', 'nbumps3', 'nbumps4', 'energy']\n_ADD = ['log_gpp', 'tranks']\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = np.asarray(y_train).ravel()\n  rskf = RepeatedStratifiedKFold(n_splits=3, n_repeats=10, random_state=20260908)\n  return [(tr, va) for tr, va in rskf.split(np.zeros(len(y)), y)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _shape(X):\n  X = X.copy()\n  if 'g_per_pulse' in _ADD:\n    X['g_per_pulse'] = X['genergy'] / X['gpuls'].clip(lower=1.0)\n  if 'log_gpp' in _ADD:                # same ordering as g_per_pulse, different spacing\n    X['g_per_pulse'] = np.log1p(X['genergy'] / X['gpuls'].clip(lower=1.0))\n  # gdenergy/gdpuls are percent deviations of genergy/gpuls from the seam's running\n  # average, so their ratio is the deviation of the energy-per-pulse that g_per_pulse\n  # measures in absolute terms.\n  if 'gd_ratio' in _ADD:\n    X['gd_ratio'] = (100.0 + X['gdenergy']) / (100.0 + X['gdpuls']).clip(lower=5.0)\n  if 'gd_gap' in _ADD:\n    X['gd_gap'] = X['gdenergy'] - X['gdpuls']\n  if 'g_avg' in _ADD:\n    X['g_avg'] = X['genergy'] / (1.0 + X['gdenergy'] / 100.0).clip(lower=0.05)\n  if 'seismic_shift' in _ADD:\n    X['seismic_shift'] = X['seismic'].astype(str) + X['shift'].astype(str)\n  if 'ordcat' in _ADD:\n    X['seismic'] = X['seismic'].astype(str).map({'a': 0.0, 'b': 1.0, 'c': 2.0, 'd': 3.0})\n    X['shift'] = X['shift'].astype(str).map({'N': 0.0, 'W': 1.0})\n  if 'dupcols' in _ADD:                # a strong column twice: more of the permuted views see it\n    X['nbumps_2'] = X['nbumps']\n    X['gpuls_2'] = X['gpuls']\n  if 'nb_pos' in _ADD:\n    X['nb_pos'] = (X['nbumps'] \u003e 0).astype(float)\n  if 'logs' in _ADD:                   # raw-scale members ('none') see a compressed table\n    for c in ('genergy', 'gpuls'):\n      X[c] = np.log1p(X[c])\n    X['g_per_pulse'] = np.log1p(X['g_per_pulse'])\n  return X.drop(columns=[c for c in _DROP if c in X.columns])\n\n\ndef _rankify(A, B, gauss=False, min_unique=0, pooled=False):\n  \"\"\"Replace numeric columns by their percentile within the training fold.\"\"\"\n  A, B = A.copy(), B.copy()\n  for c in A.columns:\n    if A[c].dtype.kind not in 'ifu' or A[c].nunique() \u003c min_unique:\n      continue\n    ref = np.sort(np.concatenate([A[c].to_numpy(float), B[c].to_numpy(float)])\n                  if pooled else A[c].to_numpy(float))\n    for F in (A, B):\n      p = np.searchsorted(ref, F[c].to_numpy(float), side='left') / len(ref)\n      if gauss:\n        from scipy.special import ndtri\n        p = ndtri(np.clip(p, 0.5 / len(ref), 1 - 0.5 / len(ref)))\n      F[c] = p\n  return A, B\n\n\ndef engineer(X_train, y_train, X_test):\n  A, B = _shape(X_train), _shape(X_test)\n  if 'ranks' in _ADD:\n    A, B = _rankify(A, B)\n  if 'granks' in _ADD:\n    A, B = _rankify(A, B, gauss=True)\n  if 'ranks_hi' in _ADD:\n    A, B = _rankify(A, B, min_unique=20)\n  if 'granks_hi' in _ADD:\n    A, B = _rankify(A, B, gauss=True, min_unique=20)\n  if 'tranks' in _ADD:                 # reference distribution pooled over train+test (no labels)\n    A, B = _rankify(A, B, gauss=True, pooled=True)\n  if 'tranks_u' in _ADD:\n    A, B = _rankify(A, B, pooled=True)\n  return A, B\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# seismic-bumps — final pipeline\n\nMetric: `1-auc`, lower is better.\n\n## What it does\n\nFrozen TabFM does all the predicting; the pipeline only changes the shape of the\ntable it attends over. Three things happen, in this order.\n\n**Columns are removed.** Of the 18 original features only 8 survive: `seismic`,\n`shift`, `genergy`, `gpuls`, `gdenergy`, `gdpuls`, `nbumps`, plus the derived one\nbelow. `ghazard`, `seismoacoustic`, `energy`, `maxenergy`, `nbumps2`–`nbumps5` are\ndropped. This was found incrementally (dropping `seismoacoustic` was worth −0.0036,\ndropping `energy` −0.0042) and then confirmed by a leave-one-out sweep over the\nsurvivors: putting any one of the 8 back out costs between +0.0008 (`shift`) and\n+0.0228 (`nbumps`), so the set is minimal, not merely small.\n\n**One column is added.** `g_per_pulse = log1p(genergy / max(gpuls, 1))` — the energy\ncarried per seismic pulse, which the raw pair only encodes jointly (−0.0037). Other\nratios that looked equally natural were tried and hurt: energy-per-bump +0.0075,\nbumps-per-pulse +0.0131.\n\n**Every numeric column is gaussianised.** Each column is replaced by its percentile\nagainst a reference distribution pooled over train **and** test rows (features only —\nno labels are touched), then pushed through the inverse normal CDF. The seismic\nfeatures are heavy-tailed and orders-of-magnitude apart; this puts them all on one\ncomparable, roughly-normal axis, which is what TabFM's in-context attention reads\nbest. Pooling the reference over train+test also removes the train/test scale shift\nfor free.\n\nTabFM's own knobs are almost untouched — only `norm_methods = ['power',\n'quantile_rtdl']`. That is deliberate: the run tested feature crosses (twice), SVD\nfeatures, class shift, logit averaging, outlier thresholds, per-member row bagging,\nordinal category codes, minority-row repetition in the context (+0.024) and a rank\nblend with RF/ET/LR, and every one of them was neutral or worse. On this task the\ntable's shape is the only lever that moves.\n\n`folds()` uses `RepeatedStratifiedKFold(3 splits × 10 repeats)`. The positive class is\nrare enough that a single 3-fold split has a fold-to-fold spread (std ≈ 0.022) far\nlarger than the effects being chased; 30 paired folds bring the standard error on a\npaired comparison down to ~0.0012, which is what made ~0.003-sized changes\ndistinguishable at all. Rows are exchangeable, so no group or time structure is\nimposed.\n\nValidation score of this pipeline (eval 79, 30 folds, 8 estimators): `1-auc = 0.20298`,\nagainst `0.21939` for the identity pipeline on the same folds.\n\n## What build.sh builds\n\nNothing. `final/build.sh` prints a line and exits 0.\n\nThe pipeline reads no files: all four hooks operate purely on the DataFrames the judge\npasses in, and no cache, embedding or fitted artefact is written to disk anywhere in\nthe run. Build time and disk cost are both zero.\n\n## Things a reader could get wrong\n\n- **`final/build/` is not part of the build.** `batch.py` was the edit-and-rerun helper\n  that rewrote the `_ADD` / `TABFM_KWARGS` / `_DROP` lines of `pipeline.py` between\n  evaluations; running it would overwrite the scored pipeline. `cmp.py` is read-only\n  reporting over `log.txt`. Neither produces an input to `pipeline.py`, so `build.sh`\n  documents them and does not call them.\n- **`_ADD` / `_DROP` are a switchboard, not dead code.** `_shape()` and `engineer()`\n  contain every feature variant tried during the search, each behind an `if '\u003cname\u003e' in\n  _ADD`. Only `_ADD = ['log_gpp', 'tranks']` is live: `log_gpp` builds the logged\n  energy-per-pulse column, `tranks` runs the train+test-pooled gaussian rank transform.\n  Everything else in those functions is inert with this `_ADD` and is kept as the record\n  of what was rejected.\n- **`log_gpp` and `g_per_pulse` write the same column name.** They are alternatives —\n  the plain ratio and its `log1p` — not two columns. Only one is ever in `_ADD`.\n- **The rank transform uses test features, and that is intended.** `_rankify(...,\n  pooled=True)` concatenates the train and test values of a column to build the\n  reference quantiles. It sees no test labels, only the feature matrix the judge already\n  hands `engineer()`.\n- **`preprocess` and `postprocess` are deliberately identity.** Probability calibration\n  is irrelevant to AUC, which is rank-only, so there is nothing for `postprocess` to do."},{"id":"splice","name":"splice","short_name":"splice","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.095889,"plain_note":null,"n_train":2126,"n_test":1064,"n_folds":9,"thresholds":null,"summary":"The task is a 60-nucleotide window centred on a candidate splice junction, classified as `EI` (donor), `IE` (acceptor) or `N`. TabFM is the predictor throughout; the pipeline only decides what it sees and how its output is finished.","score":0.074701,"gain_pct":22.096382,"medal":null,"category":"I","lines":510,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"permute_categorical":"True","average_logits":"False","norm_methods":"['none', 'power', 'quantile', 'quantile_rtdl', 'robust']","outlier_threshold":"20.0","enable_nnls":"True"},"helper_functions":["_obj","_letters","_fit_mode","_clean","_split_labels","_seq","_seqkey","_sub","_feats","_maxrun","_nearest","_stops","_gc3","_codes","_wam_fit","_wam_ll","_softmax","_pos_llr","_rank","_emphasise","_select"],"helper_ranges":{"_obj":[70,76],"_letters":[82,92],"_fit_mode":[95,100],"_clean":[107,119],"_split_labels":[132,142],"_seq":[165,167],"_seqkey":[170,173],"_sub":[176,177],"_feats":[180,283],"_maxrun":[286,292],"_nearest":[295,298],"_stops":[304,314],"_gc3":[317,320],"_codes":[324,335],"_wam_fit":[338,355],"_wam_ll":[358,374],"_softmax":[377,380],"_pos_llr":[387,408],"_rank":[417,427],"_emphasise":[439,446],"_select":[449,453]},"hook_helpers":{"preprocess":["_obj","_letters","_fit_mode","_clean","_split_labels","_seq","_sub"],"engineer":["_obj","_letters","_seq","_sub","_feats","_maxrun","_nearest","_stops","_gc3","_codes","_wam_fit","_wam_ll","_softmax","_pos_llr","_rank","_emphasise","_select"],"sample":[],"postprocess":["_letters","_seq","_seqkey","_softmax"],"folds":[]},"hook_ranges":{"preprocess":[148,162],"engineer":[456,476],"sample":[51,67],"postprocess":[479,510],"folds":[41,44]},"code":"import numpy as np\nimport pandas as pd\n\ntry:                                     # second line of defence against Arrow-backed strings\n  pd.set_option(\"mode.string_storage\", \"python\")\nexcept Exception:\n  pass\n\n# enable_nnls fits non-negative out-of-fold member weights instead of averaging uniformly. It was\n# written off as unusable below 5000 rows, but the holdout that makes it fail is only reserved when\n# row subsampling is active, and with max_num_rows unset no member subsamples 1913 rows. Under it,\n# diversity pays MORE, not less: four normalisations instead of five costs 0.0017 here against\n# 0.0005 under a uniform average, and a different method-to-slot pairing costs 0.0025 against 0.0009.\n# nnls_beta shrinks the fitted weights back towards uniform; the curve is a shallow minimum on a\n# 0.5-0.75 plateau (0.07679 / 0.07671 / 0.07671 / 0.07680 at 0.25 / 0.5 / 0.75 / 1.0), default kept.\n# class_shift survives too: dropping it costs 0.0017 under NNLS against 0.0015 under a uniform\n# average, so permuting output slots per member is not the obstacle to weighting members well.\nTABFM_KWARGS = {\"permute_categorical\": True, \"average_logits\": False, \"norm_methods\": [\"none\", \"power\", \"quantile\", \"quantile_rtdl\", \"robust\"], \"outlier_threshold\": 20.0, \"enable_nnls\": True}\n\nPOS = [f\"position_{i}\" for i in list(range(-30, 0)) + list(range(1, 31))]\nBASES = (\"A\", \"C\", \"G\", \"T\")\nIMPUTE_N = False                         # RESULT 77: imputing the ambiguity codes for TabFM too\n                                         # costs 0.0014 -- the code is itself a signal. Impute only\n                                         # inside the WAM (WAM_IMPUTE), where it costs parameters.\nWAM_IMPUTE = False                       # RESULT 78: a dead tie (0.07696) -- 50 cells out of 127k\nV = len(BASES) + (0 if (IMPUTE_N or WAM_IMPUTE) else 1)   # alphabet the weight-array counts over\n\n# (Laplace prior, order-1 backoff, order-2 backoff) per weight-array. Averaging the log-likelihood\n# over three backoff strengths instead of tuning one triple ties on CV and drops a fitted dependence\n# the final's larger training split would not share. An order-3 term is a dead tie (RESULT 51/52).\nWAM_GRID = ((1.0, 10.0, 100.0), (1.0, 20.0, 200.0), (1.0, 50.0, 400.0))\nBLEND_W = 0.16                           # WAM weight in the geometric blend. Fitted exactly on the\n                                         # deployed model's own out-of-fold probabilities: the optimum\n                                         # is 0.15 and the curve is flat from 0.13 to 0.17. The old\n                                         # 0.18 came from a TabFM that scored 0.092 raw against 0.081.\nSMOOTH = 0.002                           # uniform mass mixed into the final probabilities\nCACHE = \".wam_cache.npz\"                 # engineer -\u003e postprocess handoff inside the workspace\nDUMP = \"oof_dump.pkl\"                    # raw TabFM probabilities per fold, for offline tuning\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import StratifiedKFold\n  skf = StratifiedKFold(10, shuffle=True, random_state=0)\n  return list(skf.split(np.zeros(len(y_train)), y_train))\n\n\nN_DRAWS, DRAW_FRAC = 1, 0.90   # one draw. RESULT 21: four 90% draws cost 0.0018; RESULT 36: three\n                               # order-permuted full draws tie at 3x the wall time. The ensemble is saturated.\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Several stratified subsets of the training rows. The judge runs one fit+predict per draw and\n  averages, so this is the only way to push past the 8 members the judge fixes; at 90% each member\n  still sees nearly the whole context, unlike capping max_num_rows (RESULT 13, which lost 0.0026).\"\"\"\n  n = len(X_train)\n  if N_DRAWS \u003c= 1:\n    return [np.arange(n)]\n  y = np.asarray(y_train, dtype=object)\n  rng = np.random.default_rng(20260908)\n  draws = []\n  for _ in range(N_DRAWS):\n    keep = []\n    for c in np.unique(y):\n      idx = np.flatnonzero(y == c)\n      keep.append(rng.choice(idx, max(1, int(round(DRAW_FRAC * len(idx)))), replace=False))\n    draws.append(np.sort(np.concatenate(keep)))\n  return draws\n\n\ndef _obj(df):\n  \"\"\"Plain numpy-object strings only: the judge process that unpickles the hook output has no\n  pyarrow, so a pandas 3 Arrow-backed `str` column returned from here cannot be loaded there.\n  Column assignment re-infers the string dtype, so the cast has to happen frame-level, last.\"\"\"\n  cast = {c: object for c in df.columns\n          if df[c].dtype != object and not pd.api.types.is_numeric_dtype(df[c].dtype)}\n  return df.astype(cast) if cast else df\n\n\n_MODE = None             # per-position modal base, fitted on the training rows in preprocess\n\n\ndef _letters(X):\n  \"\"\"(n, 60) array of single characters. The ambiguity codes (N/D/S/R) are 50 cells out of 127k but\n  they cost a category slot in all 60 columns and take the weight-array's order-2 context space from\n  64 to 125, so imputing them with the position's modal base is nearly free information and a large\n  reduction in the parameters the WAM has to estimate.\"\"\"\n  a = np.asarray(X[POS].to_numpy(dtype=object), dtype=\"U1\")\n  bad = ~np.isin(a, BASES)\n  if not IMPUTE_N:\n    return np.where(bad, \"N\", a)\n  fill = _MODE if _MODE is not None else np.full(len(POS), \"A\")\n  return np.where(bad, np.broadcast_to(fill, a.shape), a)\n\n\ndef _fit_mode(X):\n  global _MODE\n  a = np.asarray(X[POS].to_numpy(dtype=object), dtype=\"U1\")\n  ok = np.isin(a, BASES)\n  _MODE = np.array([max(BASES, key=lambda b: int(((a[:, j] == b) \u0026 ok[:, j]).sum()))\n                    for j in range(len(POS))], dtype=\"U1\")\n\n\nNUMERIC_POS = False      # RESULT 60: a consistent integer code per nucleotide scores 0.09690, far\n                         # worse than the categorical columns TabFM encodes itself\n\n\ndef _clean(X):\n  X = X.copy()\n  a = _letters(X)\n  if NUMERIC_POS:\n    code = np.full(a.shape, len(BASES), dtype=np.int8)\n    for i, b in enumerate(BASES):\n      code[a == b] = i\n    for j, c in enumerate(POS):\n      X[c] = code[:, j]\n    return X\n  for j, c in enumerate(POS):\n    X[c] = a[:, j].astype(object)\n  return _obj(X)\n\n\n# Row selection was tried in both directions and the plain context wins: dropping the rows a\n# cross-fitted WAM rules out costs 0.0027 (RESULT 53) and giving the borderline rows a second copy\n# costs 0.0033 (RESULT 54). Appending mutated copies of every row costs 0.0063 (RESULT 39).\n\n\nSPLIT_N = False          # RESULT 72: splitting the decoy negatives off scores 0.08322. Thinning\n                         # a 1103-row class into 900 + 200 costs the in-context fit more than an\n                         # explicit 'looks like a site but is not' group buys it.\n\n\ndef _split_labels(X, y):\n  \"\"\"The N class is a grab-bag: about 9% of it carries a canonical GT at +1,+2 or AG at -2,-1, and\n  those decoys are what the confusion matrix is made of (21 of 49 errors). Splitting them off gives\n  TabFM's in-context fit an explicit \"looks like a site but is not\" group to compare a test row\n  against, instead of leaving that distinction implicit inside one heterogeneous class.\n  postprocess sums the two N columns back, so the merge is exact.\"\"\"\n  s = _seq(X)\n  decoy = (_sub(s, 30, 32) == \"GT\") | (_sub(s, 28, 30) == \"AG\")\n  y = np.asarray(y, dtype=object)\n  out = np.where(y != \"N\", y, np.where(decoy, \"N_decoy\", \"N_plain\"))\n  return pd.Series(np.asarray(out, dtype=object), dtype=object)   # object, never Arrow-backed\n\n\nDEDUP = False            # RESULT 73: keeping one row per distinct sequence costs 0.0005.\n\n\ndef preprocess(X_train, y_train, X_test):\n  if IMPUTE_N or WAM_IMPUTE:\n    _fit_mode(X_train)\n  Xtr = _clean(X_train)\n  if DEDUP:\n    # 99 of the 2126 training rows repeat a sequence that is already there (55 twice, 13 three\n    # times, 6 four times). A repeat carries no new evidence but does take a share of the attention\n    # TabFM spends on its context, and RESULT 54 showed that deliberately duplicating rows costs\n    # 0.0033 -- so the accidental duplication should be costing something too.\n    keep = ~pd.Index(_seq(Xtr)).duplicated()\n    Xtr = Xtr[keep].reset_index(drop=True)\n    y_train = pd.Series(np.asarray(y_train, dtype=object)[keep], dtype=object)\n  if SPLIT_N and set(np.unique(np.asarray(y_train, dtype=object))) \u003e= {\"N\"}:\n    y_train = _split_labels(Xtr, y_train)\n  return Xtr, y_train, _clean(X_test)\n\n\ndef _seq(X):\n  \"\"\"One string per row, index 0 = position_-30 ... index 59 = position_30.\"\"\"\n  return np.ascontiguousarray(_letters(X)).view(f\"U{len(POS)}\").ravel()\n\n\ndef _seqkey(X):\n  \"\"\"None when the frame no longer carries every raw position column -- `judge.py check` hands\n  postprocess the engineered X_test rather than the original one, unlike a real run.\"\"\"\n  return _seq(X) if all(c in X.columns for c in POS) else None\n\n\ndef _sub(s, i, j):\n  return np.asarray([x[i:j] for x in s], dtype=object)\n\n\ndef _feats(X):\n  s = _seq(X)\n  f = {}\n  # the two canonical junction dinucleotides (index 29 = position_-1, index 30 = position_1)\n  dn_down = _sub(s, 30, 32)              # +1,+2  -\u003e 'GT' for donors\n  dn_up = _sub(s, 28, 30)                # -2,-1  -\u003e 'AG' for acceptors\n  if JUNCTION:\n    f[\"dn_down\"], f[\"dn_up\"] = dn_down, dn_up\n    f[\"is_GT\"] = (dn_down == \"GT\").astype(np.int8)\n    f[\"is_AG\"] = (dn_up == \"AG\").astype(np.int8)\n  # consensus windows around the junction (RESULT 47: removing them costs 0.0015, so the near-unique\n  # 9-mer earns its place)\n  f[\"donor_win\"] = _sub(s, 27, 36)       # -3..+6, donor consensus MAG|GTRAGT\n  f[\"acc_win\"] = _sub(s, 25, 33)         # -5..+3, acceptor consensus  YYNCAG|G\n  # the two junction conjunctions are worth 0.0030 (RESULT 67) and are low-cardinality categoricals,\n  # the shape that works here. Generalise them: the adjacent 2-mer at every position, 59 columns of\n  # at most 25 levels each, which permute_categorical -- the biggest knob -- also gets to act on.\n  if DIMER_COLS:\n    for p in range(59):\n      f[f\"dm_{p}\"] = _sub(s, p, p + 2)\n  arr = _letters(X)\n  isY = (arr == \"C\") | (arr == \"T\")      # pyrimidine\n  isG = arr == \"G\"\n  isC = arr == \"C\"\n  up, dn = slice(0, 30), slice(30, 60)\n  f[\"py_up\"] = isY[:, up].sum(1).astype(np.int16)          # polypyrimidine tract strength\n  f[\"py_up15\"] = isY[:, 15:28].sum(1).astype(np.int16)     # -15..-3, the tract proper\n  f[\"py_dn\"] = isY[:, dn].sum(1).astype(np.int16)\n  f[\"gc_up\"] = (isG | isC)[:, up].sum(1).astype(np.int16)\n  f[\"gc_dn\"] = (isG | isC)[:, dn].sum(1).astype(np.int16)\n  f[\"gc_diff\"] = (f[\"gc_dn\"] - f[\"gc_up\"]).astype(np.int16)\n  # longest pyrimidine run in the upstream window\n  run = np.zeros(len(s), dtype=np.int16)\n  best = np.zeros(len(s), dtype=np.int16)\n  for j in range(0, 30):\n    run = np.where(isY[:, j], run + 1, 0)\n    best = np.maximum(best, run)\n  f[\"py_run_up\"] = best\n  # AG dinucleotides upstream: an acceptor is the FIRST AG after the branch point\n  ag = (arr[:, :-1] == \"A\") \u0026 (arr[:, 1:] == \"G\")\n  gt = (arr[:, :-1] == \"G\") \u0026 (arr[:, 1:] == \"T\")\n  if AGGT:\n    f[\"n_ag_up\"] = ag[:, 0:27].sum(1).astype(np.int16)     # AGs strictly before -2,-1\n    f[\"n_gt_dn\"] = gt[:, 31:59].sum(1).astype(np.int16)    # GTs strictly after +1,+2\n    f[\"n_ag_all\"] = ag.sum(1).astype(np.int16)\n    f[\"n_gt_all\"] = gt.sum(1).astype(np.int16)\n    # distance from the junction to the nearest flanking AG / GT (0 when there is none)\n    f[\"d_ag_up\"] = _nearest(ag[:, 0:27][:, ::-1])\n    f[\"d_gt_dn\"] = _nearest(gt[:, 31:59])\n  # consensus match counts: donor GT[AG]AGT at +1..+6, acceptor [CT]AG at -3..-1\n  if COLLAPSED:\n    # consensus match counts: donor GT[AG]AGT at +1..+6, acceptor [CT]AG at -3..-1\n    f[\"donor_match\"] = ((arr[:, 30] == \"G\").astype(np.int16) + (arr[:, 31] == \"T\")\n                        + np.isin(arr[:, 32], [\"A\", \"G\"]) + (arr[:, 33] == \"A\")\n                        + (arr[:, 34] == \"G\") + (arr[:, 35] == \"T\")).astype(np.int16)\n    f[\"acc_match\"] = (np.isin(arr[:, 27], [\"C\", \"T\"]).astype(np.int16)\n                      + (arr[:, 28] == \"A\") + (arr[:, 29] == \"G\")).astype(np.int16)\n    # coding potential: an exon must be readable in some frame, an intron need not be\n    f[\"stop_up\"] = _stops(arr[:, 0:30])\n    f[\"stop_dn\"] = _stops(arr[:, 30:60])\n    # period-3 base composition, the other exon signature (frame unknown -\u003e take the spread)\n    f[\"gc3_up\"] = _gc3(isG | isC, 0, 30)\n    f[\"gc3_dn\"] = _gc3(isG | isC, 30, 60)\n  # the same two signals resolved per frame / per codon phase instead of collapsed\n  # RESULT 50: ablating the per-frame block costs 0.0010\n  for off in range(3):\n    f[f\"stop_up{off}\"] = _stops(arr[:, 0:30], off)\n    f[f\"stop_dn{off}\"] = _stops(arr[:, 30:60], off)\n    f[f\"gcph_up{off}\"] = (100 * (isG | isC)[:, off:30:3].mean(1)).astype(np.int16)\n    f[f\"gcph_dn{off}\"] = (100 * (isG | isC)[:, 30 + off:60:3].mean(1)).astype(np.int16)\n  # base and dinucleotide composition: counts TabFM cannot form by attending one column at a time\n  for b in BASES:\n    eq = arr == b\n    f[f\"n{b}_up\"] = eq[:, 0:30].sum(1).astype(np.int16)\n    f[f\"n{b}_dn\"] = eq[:, 30:60].sum(1).astype(np.int16)\n  di = np.char.add(arr[:, :-1], arr[:, 1:])\n  # RESULT 49: ablating the 48 dinucleotide counts costs 0.0007\n  for b1 in BASES:\n    for b2 in BASES:\n      eq = di == b1 + b2\n      f[f\"n_{b1}{b2}\"] = eq.sum(1).astype(np.int16)\n      f[f\"n_{b1}{b2}_up\"] = eq[:, 0:29].sum(1).astype(np.int16)\n      f[f\"n_{b1}{b2}_dn\"] = eq[:, 30:59].sum(1).astype(np.int16)\n  # RESULT 48: ablating the blocks and runs costs 0.0006\n  # composition profile along the window, twelve blocks of five bases\n  for k in range(12):\n    sl = slice(5 * k, 5 * k + 5)\n    f[f\"gc_b{k}\"] = (isG | isC)[:, sl].sum(1).astype(np.int16)\n    f[f\"py_b{k}\"] = isY[:, sl].sum(1).astype(np.int16)\n  # the polypyrimidine tract is a local maximum, not a window average\n  c = np.cumsum(np.concatenate([np.zeros((len(s), 1), np.int16), isY], 1), 1)\n  for w in (10, 15):\n    run = (c[:, w:] - c[:, :-w]).astype(np.int16)\n    f[f\"py_max{w}\"] = run[:, :30].max(1)\n    f[f\"py_argmax{w}\"] = run[:, :30].argmax(1).astype(np.int16)\n    f[f\"py_max{w}_dn\"] = run[:, 30:].max(1)\n  # longest homopolymer run of each base, per half\n  for b in BASES:\n    eq = arr == b\n    f[f\"run{b}_up\"] = _maxrun(eq[:, 0:30])\n    f[f\"run{b}_dn\"] = _maxrun(eq[:, 30:60])\n  f[\"runR_up\"] = _maxrun(~isY[:, 0:30])\n  f[\"runR_dn\"] = _maxrun(~isY[:, 30:60])\n  return pd.DataFrame(f, index=X.index)\n\n\ndef _maxrun(mask):\n  run = np.zeros(len(mask), dtype=np.int16)\n  best = np.zeros(len(mask), dtype=np.int16)\n  for j in range(mask.shape[1]):\n    run = np.where(mask[:, j], run + 1, 0)\n    best = np.maximum(best, run)\n  return best\n\n\ndef _nearest(mask):\n  \"\"\"Index of the first True in each row, counted from column 0; 0 when the row has none.\"\"\"\n  has = mask.any(1)\n  return np.where(has, mask.argmax(1) + 1, 0).astype(np.int16)\n\n\nSTOPS = (\"TAA\", \"TAG\", \"TGA\")\n\n\ndef _stops(arr, frame=None):\n  \"\"\"In-frame stop codons of the half-window; the minimum over the three frames when frame is None.\"\"\"\n  n, w = arr.shape\n  best = np.full(n, 99, dtype=np.int16)\n  for off in (range(3) if frame is None else (frame,)):\n    cnt = np.zeros(n, dtype=np.int16)\n    for p in range(off, w - 2, 3):\n      tri = np.char.add(np.char.add(arr[:, p], arr[:, p + 1]), arr[:, p + 2])\n      cnt += np.isin(tri, STOPS)\n    best = np.minimum(best, cnt)\n  return best\n\n\ndef _gc3(gc, lo, hi):\n  \"\"\"Spread of GC content across the three codon phases -- exons are periodic, introns are not.\"\"\"\n  v = np.stack([gc[:, lo + k:hi:3].mean(1) for k in range(3)], 1)\n  return (100 * (v.max(1) - v.min(1))).astype(np.int16)\n\n\n# ---------------------------------------------------------------- order-2 weight-array model\ndef _codes(X):\n  \"\"\"Integer codes for the weight-array. With WAM_IMPUTE the ambiguity codes take the position's\n  modal base, so the order-2 context space is 64 per position instead of 125 -- the same counts\n  spread over 40% fewer cells -- while TabFM still sees 'N' as its own category.\"\"\"\n  a = _letters(X)\n  out = np.full(a.shape, len(BASES) - 1 if WAM_IMPUTE else len(BASES), dtype=np.int64)\n  if WAM_IMPUTE and _MODE is not None:\n    for i, b in enumerate(BASES):\n      out[np.broadcast_to(_MODE, a.shape) == b] = i\n  for i, b in enumerate(BASES):\n    out[a == b] = i\n  return out\n\n\ndef _wam_fit(A, yi, K):\n  P = A.shape[1]\n  cnt = np.zeros((K, P, V))\n  tc = np.zeros((K, P - 1, V, V))\n  t2 = np.zeros((K, P - 2, V * V, V))\n  nc = np.zeros(K)\n  for c in range(K):\n    Ac = A[yi == c]\n    nc[c] = len(Ac)\n    for p in range(P):\n      cnt[c, p] = np.bincount(Ac[:, p], minlength=V)\n    i1 = Ac[:, :-1] * V + Ac[:, 1:]\n    for p in range(P - 1):\n      tc[c, p] = np.bincount(i1[:, p], minlength=V * V).reshape(V, V)\n    i2 = (Ac[:, :-2] * V + Ac[:, 1:-1]) * V + Ac[:, 2:]\n    for p in range(P - 2):\n      t2[c, p] = np.bincount(i2[:, p], minlength=V * V * V).reshape(V * V, V)\n  return cnt, tc, t2, nc\n\n\ndef _wam_ll(M, A, alpha, m1, m2):\n  \"\"\"Per-class log-likelihood: order 2 backed off to order 1, backed off to the position frequency.\"\"\"\n  cnt, tc, t2, nc = M\n  P = A.shape[1]\n  ar, a1, a2 = np.arange(P)[None, :], np.arange(P - 1)[None, :], np.arange(P - 2)[None, :]\n  prev1, prev2 = tc.sum(3), t2.sum(3)\n  ll = np.zeros((len(A), len(nc)))\n  for c in range(len(nc)):\n    p0 = (cnt[c][ar, A] + alpha) / (nc[c] + V * alpha)\n    p1 = ((tc[c][a1, A[:, :-1], A[:, 1:]] + m1 * p0[:, 1:])\n          / (prev1[c][a1, A[:, :-1]] + m1))\n    j = A[:, :-2] * V + A[:, 1:-1]\n    p2 = ((t2[c][a2, j, A[:, 2:]] + m2 * p1[:, 1:])\n          / (prev2[c][a2, j] + m2))\n    ll[:, c] = (np.log(p0[:, 0]) + np.log(p1[:, 0]) + np.log(p2).sum(1)\n                + np.log(max(nc[c], 1.0) / nc.sum()))\n  return ll\n\n\ndef _softmax(z):\n  z = z - z.max(1, keepdims=True)\n  e = np.exp(z)\n  return e / e.sum(1, keepdims=True)\n\n\nPOS_LLR = False          # RESULT 33: 0.358. Leave-one-out deflates each context row's own-class\n                         # column, so TabFM learns \"anomalously low = true class\" and it inverts at test\n\n\ndef _pos_llr(Atr, yi, K, Ate, alpha=1.0):\n  \"\"\"log P(base at p | class c) - log P(base at p | last class), one column per (position, class).\n  For a training row the model that scores it has that row's own count removed, so the column\n  carries no information about its own label; test rows are scored against the full fold.\"\"\"\n  P = Atr.shape[1]\n  cnt = np.zeros((K, P, V))\n  nc = np.zeros(K)\n  for c in range(K):\n    Ac = Atr[yi == c]\n    nc[c] = len(Ac)\n    for p in range(P):\n      cnt[c, p] = np.bincount(Ac[:, p], minlength=V)\n  ar = np.arange(P)[None, :]\n  out = []\n  for A, own in ((Atr, yi), (Ate, None)):\n    lp = np.empty((len(A), P, K), dtype=np.float64)\n    for c in range(K):\n      o = 0.0 if own is None else (own == c).astype(float)[:, None]\n      lp[:, :, c] = np.log(np.maximum(cnt[c][ar, A] - o + alpha, 1e-9)\n                           / np.maximum(nc[c] - (0.0 if own is None else (own == c)[:, None]) + V * alpha, 1e-9))\n    out.append((lp[:, :, :K - 1] - lp[:, :, K - 1:]).astype(np.float32))\n  return out\n\n\nKEEP_POS = POS           # RESULT 76: -20..+20 costs 0.0007, -12..+12 tied; the full window stays\n\n\nTOPK = 0                 # RESULT 57: keeping only the best 80 numeric columns costs 0.0011 --\n\n\ndef _rank(F, y, k):\n  \"\"\"Column names to keep: every categorical, plus the k numeric columns with the highest ANOVA F\n  against the fold's own labels. Selection uses labels but produces no per-row encoding, so it\n  cannot repeat the RESULT 33 failure, where a leave-one-out column deflated every context row.\"\"\"\n  from sklearn.feature_selection import f_classif\n  num = [c for c in F.columns if pd.api.types.is_numeric_dtype(F[c])]\n  if not TOPK or len(num) \u003c= k:\n    return list(F.columns)\n  sc = np.nan_to_num(f_classif(F[num].to_numpy(float), np.asarray(y, dtype=object))[0])\n  keep = set(np.asarray(num)[np.argsort(-sc)[:k]])\n  return [c for c in F.columns if c not in num or c in keep]\n\n\nEMPHASIS = ()            # RESULT 66: two extra copies of each junction column costs 0.0028 --\n                         # more columns dilute attention faster than duplicates concentrate it\nDIMER_COLS = False       # RESULT 75: an adjacent 2-mer column at every position costs 0.0032\nJUNCTION = True          # RESULT 67: dropping them costs 0.0030 -- the explicit low-cardinality\n                         # conjunction is used, even though both windows already contain those positions\nAGGT = True              # RESULT 68: dropping the AG/GT counts and distances costs 0.0007\nCOLLAPSED = True         # RESULT 69: dropping the collapsed coding signals costs 0.0005.\n\n\ndef _emphasise(F):\n  \"\"\"Extra copies of the junction columns. TabFM attends over columns, and with 157 of them and no\n  feature subsampling (max_num_features is 500) the motif that actually defines the label competes\n  with 150 background statistics for that attention; duplicates raise its share.\"\"\"\n  for c, k in EMPHASIS:\n    for i in range(k):\n      F[f\"{c}_x{i}\"] = F[c]\n  return F\n\n\ndef _select(X, F):\n  \"\"\"Raw nucleotide columns only near the junction; the rest of the window reaches TabFM through\n  the composition aggregates, which is where the last four evaluations' gains came from.\"\"\"\n  drop = [c for c in POS if c not in KEEP_POS]\n  return _obj(pd.concat([X.drop(columns=drop), F], axis=1))\n\n\ndef engineer(X_train, y_train, X_test):\n  Ftr, Fte = _feats(X_train), _feats(X_test)\n  if TOPK:\n    cols = _rank(Ftr, y_train, TOPK)\n    Ftr, Fte = Ftr[cols], Fte[cols]\n  classes = np.array(sorted(pd.unique(np.asarray(y_train, dtype=object))))\n  yi = np.searchsorted(classes, np.asarray(y_train, dtype=object))\n  Atr, Ate = _codes(X_train), _codes(X_test)\n  if BLEND_W:\n    M = _wam_fit(Atr, yi, len(classes))\n    ll = np.mean([_wam_ll(M, Ate, *g) for g in WAM_GRID], axis=0)\n    np.savez(CACHE, keys=_seq(X_test), P=_softmax(ll), cols=classes.astype(str))\n  if POS_LLR:\n    K = len(classes)\n    for L, F in zip(_pos_llr(Atr, yi, K, Ate), (Ftr, Fte)):\n      for j, p in enumerate(POS):\n        for c in range(K - 1):\n          F[f\"llr{c}_{p}\"] = L[:, j, c]\n  if EMPHASIS:\n    Ftr, Fte = _emphasise(Ftr), _emphasise(Fte)\n  return _select(X_train, Ftr), _select(X_test, Fte)\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Geometric blend with the WAM, then a uniform floor. Log loss is decided by the few rows the\n  model is confidently wrong about -- at 2126 scored rows one row at p_true=1e-4 is worth 0.004 of\n  the mean -- so both steps target the tail rather than the typical row.\"\"\"\n  cols = [str(c) for c in pred.columns]\n  if any(c.startswith(\"N_\") for c in cols):        # merge the split negatives back, exactly\n    merged = {}\n    for j, c in enumerate(cols):\n      k = \"N\" if c.startswith(\"N_\") else c\n      merged[k] = merged.get(k, 0.0) + np.asarray(pred)[:, j]\n    order = [c for c in cols if not c.startswith(\"N_\")] + [\"N\"]\n    pred = pd.DataFrame({c: merged[c] for c in order}, index=pred.index)\n  P = np.asarray(pred, dtype=float)\n  P = P / np.clip(P.sum(1, keepdims=True), 1e-12, None)\n  key = _seqkey(X_test)\n  if DUMP and key is not None:\n    import pickle\n    with open(DUMP, \"ab\") as fh:\n      pickle.dump((key, list(pred.columns), P), fh)\n  if BLEND_W:\n    try:\n      z = np.load(CACHE, allow_pickle=False)\n      cols = [str(c) for c in pred.columns]\n      ok = (len(z[\"keys\"]) == len(P) and list(z[\"cols\"]) == cols\n            and (key is None or bool((z[\"keys\"] == key).all())))\n    except Exception:\n      ok = False\n    if ok:\n      W = np.clip(z[\"P\"], 1e-12, None)\n      P = _softmax((1.0 - BLEND_W) * np.log(np.clip(P, 1e-12, None)) + BLEND_W * np.log(W))\n  P = (1.0 - SMOOTH) * P + SMOOTH / P.shape[1]\n  return pd.DataFrame(P, columns=pred.columns, index=pred.index)\n","readme":"# splice — donor / acceptor / neither, log loss\n\n## What the pipeline does\n\nThe task is a 60-nucleotide window centred on a candidate splice junction, classified as `EI`\n(donor), `IE` (acceptor) or `N`. TabFM is the predictor throughout; the pipeline only decides what it\nsees and how its output is finished.\n\nThe 60 raw position columns are kept as low-cardinality **categorical** strings — ambiguity codes\n(N/D/S/R) are collapsed to a single `N` category rather than imputed, because the code is itself a\nsignal — and TabFM is left to encode them. Integer codes for the bases score much worse. On top of\nthose columns, `engineer` adds ~160 hand-built numeric and categorical summaries that TabFM cannot\nform by attending to one column at a time: the two junction dinucleotides and their GT/AG flags, two\nlonger consensus windows around the junction, AG/GT counts and distances to the nearest flanking\nsite, per-frame stop-codon counts and per-phase GC (the coding-potential signature that separates\nexon from intron), 48 dinucleotide counts, base composition in five-base blocks, polypyrimidine-tract\nmaxima and homopolymer runs. All 2126 training rows go into the context as one draw — subsampling,\ndeduplicating, augmenting and reweighting rows were all tried and all cost accuracy.\n\nAlongside TabFM, `engineer` fits a small **order-2 positional weight-array model** (a per-class,\nper-position Markov model of the sequence, order-2 backed off to order-1 backed off to the position\nfrequency, averaged over three backoff strengths). It is far weaker alone (0.1295 vs TabFM's 0.0806)\nbut wrong in different places, so `postprocess` combines the two geometrically with weight 0.16 on\nthe WAM and then mixes in a 0.002 uniform floor. Log loss here is decided by a few dozen confidently\nwrong rows, and both steps target that tail: 0.0806 raw → 0.0794 with the floor → **0.0767** blended,\non stratified 10-fold. TabFM's own ensemble knobs contribute the rest: `permute_categorical`, five\ndifferent normalisations across the eight members, and NNLS-fitted out-of-fold member weights.\n\n## What build.sh builds\n\nNothing. The pipeline has no prerequisite caches — it reads only `.wam_cache.npz`, which `engineer`\nwrites and `postprocess` reads back within the same fold. `build.sh` says so and exits 0; it takes no\ntime and no disk. Running it before `python final/run.py` is harmless and unnecessary.\n\n## Things a reader could get wrong\n\n- **`oof_dump.pkl` is not an input.** `postprocess` appends raw per-fold TabFM probabilities to it for\n  offline analysis. It is append-only and never read by the pipeline; deleting it changes nothing. It\n  does grow across repeated runs.\n- **`final/build/` is search tooling, not build tooling.** `try.py` edited `TABFM_KWARGS` and ran\n  check+val; `lab.py` replays the judge's 10-fold log loss over dumped TabFM probabilities and is how\n  `BLEND_W` and `SMOOTH` were fitted. `lab.py` expects `$TMPDIR/oof_P.npy`, a file distilled from\n  `oof_dump.pkl` by an ad-hoc shell snippet during the run; it is not needed to reproduce the\n  submission, and the constants it produced are already in `pipeline.py`.\n- **`folds()` is 10-fold, not the judge's default 3.** Every score quoted above and in the\n  `pipeline.py` docstring is on that stratified 10-fold split with 8 estimators, so it is not directly\n  comparable to a 3-fold number from elsewhere in the run.\n- **String dtypes matter.** `_obj()` forces plain numpy-object strings on every frame the hooks\n  return, because the judge process that unpickles the hook output has no pyarrow and cannot load a\n  pandas 3 Arrow-back
