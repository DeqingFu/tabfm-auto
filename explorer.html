S['miss']:\n    cols = ['gender', 'enrolled_university', 'education_level', 'major_discipline',\n            'company_size', 'company_type', 'last_new_job', 'experience']\n    for D, S in ((A, X_train), (B, X_test)):\n      D['n_missing'] = S[cols].isna().sum(axis=1).to_numpy().astype(float)\n      D['no_company'] = (S['company_size'].isna() & S['company_type'].isna()).to_numpy().astype(float)\n\n  if FEATS['inter']:\n    for D in (A, B):\n      D['exp_minus_lnj'] = D['experience'] - D['last_new_job']\n      D['cdi_x_exp'] = D['cdi'] * D['experience']\n      D['hours_per_exp'] = D['train_hours'] / (1.0 + D['experience'])\n\n  if FEATS['na_flags']:                          # per-column missingness, not just its count\n    for c in ['gender', 'enrolled_university', 'education_level', 'major_discipline',\n              'company_size', 'company_type', 'last_new_job', 'experience']:\n      A['na_' + c[:6]] = X_train[c].isna().to_numpy().astype(float)\n      B['na_' + c[:6]] = X_test[c].isna().to_numpy().astype(float)\n\n  if FEATS['na_level']:                          # missing as its own category rather than NaN\n    for D in (A, B):\n      for c in ['city', 'gender', 'enrolled', 'major', 'comp_type']:\n        D[c] = pd.Series(D[c]).where(pd.notna(D[c]), 'NA').astype(object)\n\n  if FEATS['size_rank']:                         # equal-spaced bucket index instead of log10 headcount\n    order = {k: float(i) for i, k in enumerate(\n        ['<10', '10/49', '50-99', '100-500', '500-999', '1000-4999', '5000-9999', '10000+'])}\n    A['comp_size'] = _num(X_train['company_size'], order)\n    B['comp_size'] = _num(X_test['company_size'], order)\n\n  if FEATS['drop_city']:\n    A, B = A.drop(columns=['city']), B.drop(columns=['city'])\n  if DROP:\n    A, B = A.drop(columns=DROP), B.drop(columns=DROP)\n  return _plain(A), _plain(B)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# HR Analytics — Job Change of Data Scientists (metric: 1-auc, lower is better)\n\n## What the pipeline does\n\nTabFM does all the predicting; the pipeline only decides how the table is\nrepresented to it. The raw HR table is mostly strings, several of which are\nordinal but would be coded arbitrarily by TabFM's \"appearance-order\" categorical\nencoder, so each of those is rewritten as a number that respects its natural\norder: `experience` (`<1` → 0, `>20` → 21), `last_new_job` (`never` → 0,\n`>4` → 5), `education_level` (Primary School … Phd → 0…4), and `company_size`\nas an equal-spaced bucket rank over the eight size bands. `relevent_experience`\nbecomes a 0/1 flag, `training_hours` is log1p-ed (it is strongly right-skewed),\nand `city`, `gender`, `enrolled_university`, `major_discipline`,\n`company_type` stay categorical. Two missingness features are added, because\nabsent employer fields carry signal here: a count of NaNs across the eight\noptional columns, and a flag for \"no company_size and no company_type at all\".\nOn top of that, TabFM's own ensemble knobs are turned up — square-root-many\nrandom feature crosses, categorical permutation across ensemble members, and\nall five per-member normalisations (`none`, `power`, `quantile`,\n`quantile_rtdl`, `robust`). Each of those was measured one at a time during the\nsearch; together they took 3-fold CV from 1-auc 0.19745 to 0.19583. Predictions\nare returned unmodified (`postprocess` is the identity); no row sampling and no\n`max_num_rows` override, so TabFM attends over the whole ~19k-row training\ntable.\n\nThe module also carries a `FEATS` dict of toggles for features that were tried\nand rejected — out-of-fold target encoding of `city`, city frequency counts,\npairwise interactions, per-column NaN flags, \"missing as its own level\",\ndropping `city`. Only `miss` and `size_rank` are `True` in the scored version;\nthe rest is dead-but-documented search history and the `_target_encode` helper\nit needs. Leaving them in changes nothing about what runs.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0: the pipeline reads no cache,\nno auxiliary file, no precomputed artifact — only the DataFrames the judge\npasses in. It takes no time and no disk. Run it anyway if you like; the real\ncommand is:\n\n```\ncd <this workspace> && bash final/build.sh && python final/run.py\n```\n\n`python final/run.py` needs a GPU with TabFM available and runs 8 ensemble\nmembers over the full training context; it writes `final/submission.csv`.\n`python final/run.py --check` validates prerequisites and imports without\ntouching TabFM.\n\n## Things a reader could get wrong\n\n- `_plain()` is not cosmetic. Under pandas 3 the string columns come back as\n  pyarrow-backed `StringDtype`, and the judge unpickles the hook output in a\n  process that cannot always import pyarrow; `_plain` casts those columns *and\n  the column index* back to plain object. Removing it breaks the run in a way\n  that has nothing to do with modelling.\n- `row_id` is deliberately passed through in `_feat`, but guarded by a\n  membership test: it is absent under `judge.py check`, which feeds a 200-row\n  slice without the id column.\n- `preprocess` returns `y_train.astype(object)` — the labels stay the original\n  `Yes`/`No` strings for TabFM. The 0/1 form (`yb`) is derived inside\n  `engineer` only to feed the (currently disabled) target encoder.\n- `TE_FOLDS` / `TE_PRIOR` / `_target_encode` are unused while\n  `FEATS['city_te']` is `False`. Do not read their presence as evidence that\n  the scored model used target encoding — it did not.\n","package":[],"derivations":[]},{"id":"in_vehicle_coupon_recommendation","name":"in_vehicle_coupon_recommendation","short_name":"in_vehicle_coupon_recommendation","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.151169,"plain_note":null,"n_train":8456,"n_test":4228,"n_folds":9,"thresholds":null,"summary":"The prediction is made entirely by frozen TabFM over the raw training rows — there is no second model, no sampling of the context, and no post-processing (the metric is AUC, so only a non-monotone transform could move it, and per-coupon recalibration was measured to hurt).","score":0.140461,"gain_pct":7.083463,"medal":null,"category":"II","lines":138,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","n_svd_features":"'sqrt'","norm_methods":"['none', 'power', 'quantile', 'quantile_rtdl', 'robust']","permute_categorical":"True"},"helper_functions":["_map","_recode"],"helper_ranges":{"_map":[82,83],"_recode":[90,122]},"hook_helpers":{"preprocess":[],"engineer":["_map","_recode"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[86,87],"engineer":[125,126],"postprocess":[129,130],"folds":[133,138]},"code":"\"\"\"in_vehicle_coupon_recommendation -- TabFM pipeline.  CV 1-auc 0.15261 (identity: 0.17055 on 3 folds).\n\nThe task is a survey: 567 respondents answered ~22 in-car coupon scenarios each. What moved\nthe score, in order of how much:\n\n* TabFM's ensembling knobs (-0.004). Crosses and SVD each help alone and more together, and\n  the norm cycle wants to be wide. Its length wants to be ODD: members alternate augmented /\n  plain by index parity, so an even-length cycle locks each normalisation to one parity\n  forever while an odd one gives every method both. Five methods, one each.\n* Six coupon-anchored interaction columns (-0.003), then a seventh (-0.0002). TabFM's own\n  n_feature_crosses only pairs NUMERIC columns, so no categorical x categorical interaction\n  is ever generated for it -- these are the ones it cannot build itself. A logistic probe\n  over one-hot main effects ranked the candidates; a leave-one-out at the end confirmed all\n  seven earn their place and that an eighth does not.\n* Recoding the ordered bands as numbers (-0.0025 for age/income/education alone). 'never' <\n  'less1' < '1~3' < '4~8' < 'gt8' is invisible to TabFM while the column is a string. Rank\n  spacing beat visits-per-month spacing; folding the two nested distance flags into one\n  0/1/2 level beat keeping them.\n* The venue-match columns (-0.002) and keeping missingness visible (-0.001). TabFM\n  mean-imputes numeric columns, so a recoded band would otherwise lose the fact that it was\n  blank -- hence the sentinel below 'never' and the per-row count.\n\nWhat did not work, so that it is not retried:\n\n* Anything built on the respondent. Every profile in the held-out split also occurs in\n  training, so a per-respondent accept-rate looks free, but it cost 0.05 AUC (eval 2) and\n  still 0.03 with the train/test out-of-fold mismatch removed (eval 15); TabFM collapses\n  onto the encoding. The respondent as a plain category cost 0.001 (eval 74). Dumping\n  TabFM's own out-of-fold predictions and fitting a shrunken per-respondent residual on top\n  of them made the score worse at every smoothing and every weight: TabFM has already taken\n  everything the respondent structure has.\n* A second model. A logistic model reaches 0.777 AUC and a gradient-boosted tree 0.812\n  against TabFM's 0.847, and blending either in logit space gains 0.00007 at best.\n* Post-processing of any kind. The metric is AUC, so only a non-monotone change matters, and\n  per-coupon recalibration is not one that helps: TabFM's group means already sit on the\n  group base rates, and even an affine per-group refit is 0.0013 worse.\n* Touching the context. `sample` is deliberately absent -- the judge's default (one draw,\n  every training row) beat max_num_rows=4000 by 0.0025, three draws each doubling a random\n  quarter by 0.0009, dropping the 5% of rows a GBDT gets most confidently wrong by 0.009,\n  and doubling that same 5% by 0.007. The hard rows are the boundary; leave them alone.\n* NNLS member weights (+0.002 and 3x the time), probability instead of logit averaging,\n  class_shift off, tighter outlier clipping, frequency category codes, count-encoding the\n  categoricals, keeping the bands as strings as well as numbers, hour-of-day as a category,\n  the whole scenario as one category, and splitting the target into (answer x coupon) heads.\n\nNote softmax_temperature and binary_calibration_method cannot move this metric at all: with\naverage_logits=True the temperature is a monotone scaling of the averaged logits, and Platt\ncalibration is applied after the members are averaged. Both are exactly rank-preserving.\n\"\"\"\n# KW-NOTE: eval96: rank-scale leave-one-out -- without coupon x Bar\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt', 'n_svd_features': 'sqrt',\n                'norm_methods': ['none', 'power', 'quantile', 'quantile_rtdl', 'robust'],\n                'permute_categorical': True}\n\nFREQ = {'never': 0.0, 'less1': 1.0, '1~3': 2.0, '4~8': 3.0, 'gt8': 4.0}\nFREQ_COLS = ['Bar', 'CoffeeHouse', 'CarryAway', 'RestaurantLessThan20', 'Restaurant20To50']\nAGE = {'below21': 18.0, '21': 21.0, '26': 26.0, '31': 31.0, '36': 36.0, '41': 41.0,\n       '46': 46.0, '50plus': 55.0}\nINCOME = {'Less than $12500': 6.25, '$12500 - $24999': 18.75, '$25000 - $37499': 31.25,\n          '$37500 - $49999': 43.75, '$50000 - $62499': 56.25, '$62500 - $74999': 68.75,\n          '$75000 - $87499': 81.25, '$87500 - $99999': 93.75, '$100000 or More': 112.5}\nEDU = {'Some High School': 0.0, 'High School Graduate': 1.0, 'Some college - no degree': 2.0,\n       'Associates degree': 3.0, 'Bachelors degree': 4.0,\n       'Graduate degree (Masters or Doctorate)': 5.0}\nEXPIRY = {'2h': 2.0, '1d': 24.0}\n\n# which visit-frequency column the coupon is asking about\nCOUPON_VENUE = {'Bar': 'Bar', 'Coffee House': 'CoffeeHouse',\n                'Carry out & Take away': 'CarryAway',\n                'Restaurant(<20)': 'RestaurantLessThan20',\n                'Restaurant(20-50)': 'Restaurant20To50'}\n\n# direction_opp is 1 - direction_same; car is ~99% missing; the two flags become `distance`\nDROP = ['direction_opp', 'car', 'toCoupon_GEQ15min', 'toCoupon_GEQ25min']\n\nPAIRS = [('coupon', 'destination'), ('coupon', 'passenger'), ('coupon', 'time'), ('coupon', 'expiration'), ('coupon', 'CoffeeHouse'), ('coupon', 'income')]\n\n\ndef _map(s, table):\n  return s.astype('object').map(table).astype(float)\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _recode(X):\n  X = X.copy()\n  nmiss = X[FREQ_COLS].isna().sum(axis=1).astype(float)\n  for c in FREQ_COLS:\n    X[c] = _map(X[c], FREQ)\n  X['age'] = _map(X['age'], AGE)\n  X['income'] = _map(X['income'], INCOME)\n  X['education'] = _map(X['education'], EDU)\n  X['expiration'] = _map(X['expiration'], EXPIRY)\n  # the two flags are nested (>=25min implies >=15min): one ordered level instead\n  X['distance'] = X['toCoupon_GEQ15min'].astype(float) + X['toCoupon_GEQ25min'].astype(float)\n\n  coup = X['coupon'].astype('object')            # how often this driver visits the\n  own = np.full(len(X), np.nan)                  # venue type the coupon is for\n  for c, col in COUPON_VENUE.items():\n    m = (coup == c).to_numpy()\n    own[m] = X.loc[m, col].to_numpy()\n  X['venue_freq'] = own\n  X['out_freq'] = X[FREQ_COLS].sum(axis=1, min_count=1).astype(float)\n  X['venue_share'] = X['venue_freq'] / (X['out_freq'] + 1.0)\n\n  # a numeric column is mean-imputed by TabFM, which would erase the blanks the bands had\n  for c in FREQ_COLS:\n    X[c] = X[c].fillna(-1.0)\n  X['n_missing'] = nmiss\n\n  for a, b in PAIRS:\n    # plain object dtype: an Arrow-backed result does not survive the hook pickle\n    va, vb = X[a].astype('object').to_numpy(), X[b].astype('object').to_numpy()\n    X[f'{a}_x_{b}'] = pd.Series([f'{u}|{v}' for u, v in zip(va, vb)],\n                                index=X.index, dtype=object)\n\n  return X.drop(columns=[c for c in DROP if c in X.columns])\n\n\ndef engineer(X_train, y_train, X_test):\n  return _recode(X_train), _recode(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n\n\ndef folds(X_train, y_train):\n  \"\"\"5 folds instead of the judge's 3: paired comparisons between two pipelines are what\n  this search reads, and 5 folds both halve the noise on that difference and put the\n  per-fold training size (6765) nearer the 11415 rows the final actually fits on.\"\"\"\n  from sklearn.model_selection import StratifiedKFold\n  return list(StratifiedKFold(5, shuffle=True, random_state=0).split(X_train, y_train))\n","readme":"# in_vehicle_coupon_recommendation — final pipeline\n\nMetric: `1-auc`, lower is better. Cross-validated score of this pipeline: **0.15261** (5-fold;\nthe untouched identity pipeline scores 0.17055 on the judge's 3 folds).\n\n## What it does\n\nThe prediction is made entirely by frozen TabFM over the raw training rows — there is no second\nmodel, no sampling of the context, and no post-processing (the metric is AUC, so only a\nnon-monotone transform could move it, and per-coupon recalibration was measured to hurt). All the\nwork is in how the survey is represented to TabFM and in how its ensemble is configured.\n\nFeature side, in `engineer`: the ordered survey bands are recoded as numbers rather than left as\nstrings, because their order is invisible to TabFM while they are categorical — the five\nvisit-frequency columns onto a 0–4 rank scale, plus age, income, education and the coupon\nexpiration onto natural units. Blank bands are kept visible with a sentinel below `never` and a\nper-row missing count, since TabFM mean-imputes numeric columns and would otherwise erase them.\nThe two nested distance flags collapse into one 0/1/2 level; `direction_opp` (the complement of\n`direction_same`) and the ~99%-missing `car` column are dropped. Three columns tie the coupon to\nthe respondent's habits: how often they visit the venue type the coupon is for, their total\ngoing-out frequency, and the ratio of the two. Finally six string-concatenated interaction\ncolumns anchored on `coupon` (× destination, passenger, time, expiration, CoffeeHouse, income) —\nTabFM's own `n_feature_crosses` only pairs numeric columns, so categorical × categorical\ninteractions are the ones it cannot construct for itself; the set was ranked by a logistic probe\nover one-hot main effects and confirmed by a leave-one-out at the end.\n\nModel side, `TABFM_KWARGS` turns on feature crosses and SVD features (both `sqrt`), categorical\npermutation, and a five-method normalisation cycle. The cycle length is deliberately odd:\nensemble members alternate augmented/plain by index parity, so an even-length cycle would pin\neach normalisation to one parity forever.\n\n`folds()` overrides the judge's 3 folds with 5 stratified folds — the search reads paired\ndifferences between pipelines, and 5 folds both halve the noise on that difference and put the\nper-fold training size closer to the ~11.4k rows the final actually fits on.\n\nThe pipeline's own docstring carries the full negative record (respondent-level features, model\nblending, context sampling, NNLS member weights, …) so those are not retried.\n\n## build.sh\n\nThere is nothing to build. `pipeline.py` reads no files — every feature is computed row-wise from\nthe DataFrames the judge passes in. `final/build.sh` is a documented no-op that exits 0 in well\nunder a second and needs no disk. There is no `final/build/` directory because no helper script\nwas ever written during the run; all exploration was throw-away shell heredocs.\n\n```\ncd <workspace> && bash final/build.sh && python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **`sample` and `postprocess` are absent/identity on purpose.** That is a measured choice, not an\n  omission: the judge's default context (one draw, all training rows) beat `max_num_rows=4000` by\n  0.0025, and every re-weighting of the hard rows was worse.\n- **`softmax_temperature` and `binary_calibration_method` are missing for a reason.** With\n  `average_logits=True` the temperature is a monotone rescaling of the averaged logits and Platt\n  calibration runs after averaging; both are exactly rank-preserving and so cannot move AUC.\n- **The rows are not exchangeable at the respondent level** — 567 respondents answered ~22\n  scenarios each, and every profile in the test split also occurs in training. That looks like free\n  signal but is not: any per-respondent encoding cost 0.03–0.05 AUC. `folds()` therefore uses plain\n  stratified splits, matching how the test split was made.\n- **`run.py` copies `final/pipeline.py` over the workspace `pipeline.py`** and refuses to run if the\n  two differ, so a reproduction cannot silently score a different file.\n","package":[],"derivations":[]},{"id":"Is-this-a-good-customer","name":"Is-this-a-good-customer","short_name":"Is-this-a-good-customer","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.246864,"plain_note":null,"n_train":1148,"n_test":575,"n_folds":30,"thresholds":null,"summary":"The task is a small credit-scoring table: 1148 rows, 13 columns, 11.3% positives, scored as 1 − ROC-AUC (lower is better). The pipeline is deliberately thin around a frozen TabFM.","score":0.243205,"gain_pct":1.482193,"medal":null,"category":"II","lines":134,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","postprocess","folds"],"tabfm_kwargs":{"class_shift":"False","feat_shuffle_method":"'none'"},"helper_functions":["aux_rank"],"helper_ranges":{"aux_rank":[70,108]},"hook_helpers":{"preprocess":[],"engineer":["aux_rank"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[66,67],"engineer":[111,119],"postprocess":[122,134],"folds":[61,63]},"code":"\"\"\"Is-this-a-good-customer: 1148 x 13 credit-scoring rows, 11.3% positives, scored 1 - ROC-AUC.\n\nIntent: more shrinkage on the auxiliary logistic (C=0.1). C=1.0 cost +0.0008, so the tested side of this knob slopes away from 0.3; this completes the bracket on the judge rather than on the off-judge scan that chose it.\nThree changes carry it, each measured against the identity pipeline on the 30 folds below:\n\n  1. Five columns removed (-0.0035). A leave-one-out scan over all 13 columns split them cleanly:\n     dropping product_type costs +0.059, credit_amount / credit_term / age about +0.010 each,\n     education +0.0085, sex / income / is_client about +0.005 -- while having_children_flg,\n     phone_operator, family_status, month and region cost nothing or pay. This table is better off\n     narrow in both directions: three engineered ratios cost +0.0114, an out-of-fold product_type\n     rate +0.0097, quantile bins +0.0054, a GBDT probability as a ninth column +0.0154. Every\n     column added to the eight was worse than the eight.\n  2. education as its ordinal level rather than a string (-0.0018), the one recoding that helped;\n     integer codes handed over as strings cost +0.0026 and product_type ranked by default rate\n     +0.0042.\n  3. A 0.45-weight rank blend of TabFM's output with a GBDT + logistic pair fitted on the same\n     training fold (-0.0073 on top of the first two). The pair is a tool: TabFM keeps 0.55 of the\n     ranking and tabfm_corr stays at 0.968. The weight sits on a long plateau that rises very\n     slowly -- 0.25 -> 0.23498, 0.30 -> 0.23364, 0.40 -> 0.23339 with the first GBDT shape, then\n     0.33 -> 0.23139, 0.40 -> 0.23110, 0.45 -> 0.23077 with this one. Every step is inside the\n     paired noise on its own (0.45 vs 0.40 is -0.00033 +- 0.00031) and only the direction\n     replicates, so 0.45 is where it is capped by choice: TabFM stays the majority of the ranking.\n     Combining the two rankings in normal scores instead of linearly was indistinguishable\n     (0.23061 vs 0.23077, a paired -0.00016 +- 0.00036), so the simpler form is kept. The auxiliary\n     is three members rather than two: a random forest joining the boosted trees and the logistic is\n     worth -0.0014 together with dropping the class weighting it was first tried with (+0.0006 --\n     re-balancing a forest at an 11% positive rate turned out to be the wrong guess, and leaving it\n     out is one parameter fewer). min_samples_leaf 1 costs +0.0011 and 8 is a tie, so 3 sits in a\n     flat spot. Bagging the GBDT over bootstrap resamples instead was worse (+0.0012), as were\n     extremely randomised trees as a fourth member (+0.0005) and the credit-burden ratios\n     (+0.0003 to +0.0027).\n\nclass_shift=False and feat_shuffle_method='none' add a further -0.0009 together; every other TabFM\nknob measured neutral on this table (crosses +0.0008, SVD +0.0012, three or four norm_methods\n+0.0004, permute_categorical -0.0015 then +0.0006, average_logits=False +0.0002) and\nmax_num_rows=512 cost +0.0043 -- with 918 rows in context, shrinking it is the one clear mistake.\nsample() was no better than the single full-context draw: repeating the positives -0.0028 alone but\n+0.0004 here, a 1:3 balanced second context +0.0034. Dropping the 2% worst-fit training rows was\nneutral, 6% cost +0.018.\n\nValidation: 6 repeats of stratified 5-fold, 30 folds, train 918 / val 230. The judge's default\nsingle 3-fold has a fold std of 0.010 on this task, larger than anything worth measuring; paired\nacross these 30 folds the standard error of a difference is ~0.001. Identity scores 0.24374 here,\nthis pipeline 0.22937, a paired -0.01437 +- 0.00164.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\n# columns whose leave-one-out delta was zero or negative\nDROP = ('having_children_flg', 'phone_operator', 'family_status', 'month', 'region')\n\nEDU = {'Incomplete secondary education': 0, 'Secondary education': 1, 'Secondary special education': 2,\n       'Incomplete higher education': 3, 'Higher education': 4, 'PhD degree': 5}\n\nBLEND_W = 0.45          # weight of the auxiliary ranking; TabFM keeps the majority\nAUX_FILE = '.aux_pred.npy'   # engineer and postprocess are separate processes: the workspace is the channel\n\nTABFM_KWARGS = {'class_shift': False, 'feat_shuffle_method': 'none'}\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  return list(RepeatedStratifiedKFold(n_splits=5, n_repeats=6, random_state=0).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef aux_rank(X_train, y, X_test):\n  \"\"\"A GBDT and a logistic regression fitted on the training fold only, rank-averaged over the test\n  rows. Off-judge on the same folds the boosted trees and the logistic alone score 0.2376 against\n  TabFM's 0.2381, and their errors differ enough from TabFM's that blending the rankings beats\n  either. Three members with three inductive biases rank-average better than two.\"\"\"\n  from sklearn.compose import ColumnTransformer\n  from sklearn.ensemble import HistGradientBoostingClassifier, RandomForestClassifier\n  from sklearn.linear_model import LogisticRegression\n  from sklearn.pipeline import make_pipeline\n  from sklearn.preprocessing import OneHotEncoder, OrdinalEncoder, StandardScaler\n  from scipy.stats import rankdata\n  A = X_train.drop(columns=['row_id'], errors='ignore')\n  B = X_test.drop(columns=['row_id'], errors='ignore')\n  if len(np.unique(y)) < 2:                      # `judge.py check` slices a single-class window\n    return np.full(len(B), 0.5)\n  cat = [c for c in A.columns if A[c].dtype.kind not in 'if']\n  num = [c for c in A.columns if c not in cat]\n  enc = OrdinalEncoder(handle_unknown='use_encoded_value', unknown_value=-1)\n  if cat:\n    enc.fit(A[cat].astype(object).map(str))\n\n  def codes(D):\n    D = D.copy()\n    if cat:\n      D[cat] = enc.transform(D[cat].astype(object).map(str))\n    return D.to_numpy(dtype=float)\n\n  CA, CB = codes(A), codes(B)\n  g = HistGradientBoostingClassifier(max_iter=120, learning_rate=0.06, max_leaf_nodes=15,\n                                     min_samples_leaf=20, l2_regularization=3.0, random_state=0)\n  g.fit(CA, y)\n  rf = RandomForestClassifier(500, min_samples_leaf=3, random_state=0).fit(CA, y)\n  lr = make_pipeline(ColumnTransformer([('c', OneHotEncoder(handle_unknown='ignore', min_frequency=5), cat),\n                                        ('n', StandardScaler(), num)]),\n                     LogisticRegression(C=0.1, max_iter=3000))\n  lr.fit(A, y)\n  ranks = [rankdata(g.predict_proba(CB)[:, 1]), rankdata(rf.predict_proba(CB)[:, 1]),\n           rankdata(lr.predict_proba(B)[:, 1])]\n  return np.mean(ranks, axis=0) / len(B)\n\n\ndef engineer(X_train, y_train, X_test):\n  y = (y_train.astype(str) == 'Yes').to_numpy().astype(int)\n  out = []\n  for X in (X_train, X_test):\n    d = X.drop(columns=[c for c in DROP if c in X.columns])\n    d['education'] = X['education'].map(EDU).astype(float)\n    out.append(d)\n  np.save(AUX_FILE, aux_rank(X_train, y, X_test))\n  return out[0], out[1]\n\n\ndef postprocess(pred, y_orig, X_test):\n  if pred.shape[1] != 2:\n    return pred\n  from scipy.stats import rankdata\n  aux = np.load(AUX_FILE)\n  if len(aux) != len(pred):\n    return pred\n  lo, hi = pred.columns[0], pred.columns[1]\n  n = len(pred)\n  z = (1 - BLEND_W) * rankdata(pred[hi].to_numpy()) / n + BLEND_W * rankdata(aux) / n\n  out = pred.copy()             # copy rather than a fresh frame: a new string column index is\n  out[lo], out[hi] = 1 - z, z   # arrow-backed, and the judge unpickles this where pyarrow is absent\n  return out\n","readme":"# Is-this-a-good-customer — final pipeline\n\n## What it does\n\nThe task is a small credit-scoring table: 1148 rows, 13 columns, 11.3% positives, scored as\n1 − ROC-AUC (lower is better). The pipeline is deliberately thin around a frozen TabFM.\n\nFeature side, it *narrows* the table rather than widening it. A leave-one-out scan over all 13\ncolumns found five that cost nothing or paid to remove (`having_children_flg`, `phone_operator`,\n`family_status`, `month`, `region`), so those are dropped, and `education` is recoded from its\nstring to its ordinal level. Nothing is added: engineered ratios, out-of-fold target rates, quantile\nbins and a GBDT probability as an extra column were all measured and all hurt. TabFM then sees the\neight remaining columns over the full training context (no subsampling — `sample()` is not defined,\nand shrinking `max_num_rows` was the one clearly bad knob), with `class_shift=False` and\n`feat_shuffle_method='none'`.\n\nOn top of that, `engineer()` also fits an auxiliary trio on the *same* training fold — a\nHistGradientBoosting classifier, a 500-tree random forest, and a one-hot + standardised logistic\nregression (C=0.1) — and rank-averages their test-row scores. `postprocess()` blends that ranking\nwith TabFM's at weight 0.45, in ranks, so TabFM keeps the majority (0.55) of the final ordering;\n`tabfm_corr` stays around 0.968. The three auxiliaries are tools with different inductive biases,\nnot a replacement: alone they are roughly level with TabFM, and it is the disagreement that the\nblend buys. Because `engineer()` and `postprocess()` run in separate processes, the auxiliary\nranking travels between them through `.aux_pred.npy` in the workspace.\n\nValidation during the run was 6 repeats of stratified 5-fold (30 folds, 918 train / 230 val),\nbecause the judge's default single 3-fold has a fold std of ~0.010 on this table — larger than any\neffect worth measuring. Against an identity pipeline on those 30 folds: 0.24374 → 0.22937, a paired\n−0.01437 ± 0.00164.\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` reads no file it does not write itself — the single filename it names,\n`.aux_pred.npy`, is produced by `engineer()` earlier in the same run and consumed by\n`postprocess()`. `build.sh` therefore prints that and exits 0. Runtime: instant. Disk: zero.\n\n    bash final/build.sh && python final/run.py\n\n`final/build/` is absent because no build script exists to copy: the two helpers written during the\nsearch (`base.py`, `sweep.py`) were off-judge variant drivers that mutated a copy of `pipeline.py`\nand scored candidates locally, produced no cache the pipeline reads, and were deleted from the\nworkspace before the run ended.\n\n## Things a reader could get wrong\n\n- **`.aux_pred.npy` is not a cache to pre-build.** Pre-computing it would be wrong: it depends on\n  the training fold currently in hand, and the pipeline overwrites it on every `engineer()` call.\n  If a stale one is lying around, `postprocess()` guards on length and falls back to raw TabFM\n  output, so a mismatch degrades silently rather than crashing — delete it if in doubt.\n- **The auxiliary models are fitted inside `engineer()`, on the training fold only.** There is no\n  leakage path from the test rows, and no cross-fit artefact carried between folds.\n- **Blend weight 0.45 is a choice, not an optimum.** The weight sits on a long, very slowly rising\n  plateau (0.33 → 0.23139, 0.40 → 0.23110, 0.45 → 0.23077), and each step is inside the paired noise\n  on its own; only the direction replicates. It is capped at 0.45 so TabFM stays the majority of the\n  ranking. Pushing it higher would likely score a hair better and would stop being a TabFM pipeline.\n- **`folds()` is 30 folds, not the judge's 3.** That is what the numbers quoted above are measured\n  on; a single 3-fold reproduction will look much noisier than the differences discussed here.\n- **This is a TabArena task.** The competition data under `data/` is the harness-prepared fold-0\n  split; `final/run.py` loads it through the bundled `final/judge.py` + `final/config.yaml`, so the\n  reproduction cannot drift from what was scored. `run.py` copies `final/pipeline.py` over the\n  workspace `pipeline.py` and refuses to run if the two already differ.\n","package":[],"derivations":[]},{"id":"jm1","name":"jm1","short_name":"jm1","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.210591,"plain_note":null,"n_train":7256,"n_test":3629,"n_folds":9,"thresholds":null,"summary":"The prediction is a single frozen TabFM in-context pass over the *entire, unmodified* training table — the search found that every intervention on the rows made things worse (shrinking the context, collapsing the 415 exact-duplicate metric groups, dropping hard rows, oversampling the 19% positives, bagging subsamples), and so did every label-derived feature (a GBDT out-of-fold prediction, a leave-one-out group…","score":0.211423,"gain_pct":-0.395079,"medal":null,"category":"I","lines":125,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"class_shift":"False"},"helper_functions":["_shape"],"helper_ranges":{"_shape":[74,112]},"hook_helpers":{"preprocess":[],"engineer":["_shape"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[70,71],"engineer":[115,121],"postprocess":[124,125],"folds":[62,67]},"code":"\"\"\"jm1 (NASA MDP software defect prediction), 21 McCabe/Halstead metrics per module,\nmetric 1-ROC-AUC (lower better).\n\nWhat the run found\n------------------\nNothing that touches the *rows* helps. TabFM's context is the model here and every\nedit to it costs: shrinking each member's context (max_num_rows 4500/3000/1500 ->\n0.2203/0.2272/0.2551 against 0.2185 with all 5804 rows), collapsing the 415\nexact-duplicate metric groups (0.2240), dropping the 6% of rows a GBDT gets most\nwrong (0.2345), oversampling the 19% positives (0.2718), bagging three 85% draws\n(0.2219). The natural, complete, duplicate-laden training table is the best context.\n\nNothing that injects a *label-derived column* helps either, and it is not close: a\nGBDT out-of-fold prediction as a feature scored 0.2509 and a leave-one-out defect\nrate over the exact-duplicate groups 0.2668, both against 0.2185. Rank-blending a\nGBDT into the output in postprocess degraded monotonically with its weight (0.2188\nat w=0.15, 0.2210 at w=0.30), which is what a 0.75-AUC side model does to a\n0.78-AUC one. TabFM's own knobs are all inside the fold spread: feature crosses,\nSVD features, NNLS, softmax temperature, feature shuffling and the normalisation\nlist each move the score by less than 0.001.\n\nWhat does work is the feature *representation*, and only that:\n\n  1. Drop l, i, b, t. They are exact functions of the others (l=1/d, i=v/d,\n     b=v/3000, t=e/18 -- mismatch rate <0.03% on each), so they carry nothing and\n     cost a fifth of the table's width.            identity 0.2219 -> 0.2199\n  2. Keep the 13 raw measurements and add 22 ratios and identity residuals. loc,\n     v(g) and the Halstead terms are all size proxies; what separates a buggy module\n     from a merely big one is the *shape* -- cyclomatic density, comment density,\n     operator repetition -- plus the residuals of the identities that ought to hold\n     (branchCount=2v(g)-1, v=N*log2(eta), e=v*d, loc=lOCode+lOComment+lOBlank).\n     A group ablation showed all five groups contribute.        -> 0.2185\n  3. Reshape those ratios with a signed log1p. They span as many decades as the raw\n     columns (rep_op, e_per_loc) and z>4 outlier clipping leaves no resolution\n     inside the bulk. Logging the *raw* columns instead is worse: the reshape has to\n     land on the derived quantities.                            -> 0.2167\n\nMeasured on three independent fold partitions rather than one, because the useful\ndifferences here are the size of the noise. Against the same features unshaped,\nlog-shaped ratios with class_shift=False scored -0.0018 (5-fold seed 0), +0.0002\n(10-fold seed 1) and -0.0009 (5-fold seed 2) -- a real but small edge, not the\n0.0018 the first split alone suggested. The identity pipeline scores 0.2219 /\n0.2191 / 0.2262 on those three, so the pipeline as a whole is worth ~0.005 AUC.\n\"\"\"\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\n\n# class_shift randomises the label permutation per member; with two classes it buys\n# no diversity, and dropping it helped slightly on every fold set.\nTABFM_KWARGS = {'class_shift': False}\n\nN_FOLDS = 5\nFOLD_SEED = 2\n\n# The raw measurements, minus l/i/b/t which are exact functions of v, d and e.\nBASE = ['loc', 'v(g)', 'ev(g)', 'iv(g)', 'lOCode', 'lOComment', 'lOBlank',\n        'locCodeAndComment', 'uniq_Op', 'uniq_Opnd', 'total_Op', 'total_Opnd',\n        'branchCount']\nEPS = 1e-6\n\n\ndef folds(X_train, y_train):\n  \"\"\"Rows are independent software modules with no time or group structure, so\n  plain stratified CV mirrors how the held-out split was made.\"\"\"\n  y = np.asarray(y_train).ravel()\n  skf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=FOLD_SEED)\n  return list(skf.split(np.zeros(len(y)), y))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _shape(X):\n  \"\"\"Size-normalised ratios and identity residuals, signed-log1p compressed.\"\"\"\n  loc, vg = X['loc'], X['v(g)']\n  n1, n2, N1, N2 = X['uniq_Op'], X['uniq_Opnd'], X['total_Op'], X['total_Opnd']\n  eta, N = n1 + n2, N1 + N2\n  raw = {\n      # how branchy the code is for its size\n      'cyc_dens': vg / (loc + EPS),\n      'ev_ratio': X['ev(g)'] / (vg + EPS),\n      'iv_ratio': X['iv(g)'] / (vg + EPS),\n      'bc_ratio': X['branchCount'] / (vg + EPS),\n      'bc_resid': X['branchCount'] - 2 * vg + 1,\n      # what the lines are made of\n      'comment_dens': X['lOComment'] / (loc + EPS),\n      'blank_dens': X['lOBlank'] / (loc + EPS),\n      'code_dens': X['lOCode'] / (loc + EPS),\n      'loc_resid': loc - (X['lOCode'] + X['lOComment'] + X['lOBlank']),\n      # how dense the Halstead terms are per line\n      'n_per_loc': X['n'] / (loc + EPS),\n      'v_per_loc': X['v'] / (loc + EPS),\n      'e_per_loc': X['e'] / (loc + EPS),\n      # vocabulary, and how often it is reused\n      'eta': eta,\n      'N': N,\n      'N_per_eta': N / (eta + EPS),\n      'op_ratio': n1 / (n2 + EPS),\n      'tot_ratio': N1 / (N2 + EPS),\n      'rep_op': N1 / (n1 + EPS),\n      'rep_opnd': N2 / (n2 + EPS),\n      # where the recorded Halstead values disagree with their own definitions\n      'v_resid': X['v'] - N * np.log2(eta.replace(0, np.nan)),\n      'e_resid': X['e'] - X['v'] * X['d'],\n      'n_resid': X['n'] - N,\n  }\n  out = {}\n  for k, v in raw.items():\n    v = np.asarray(v, dtype=float)\n    out[k] = np.sign(v) * np.log1p(np.abs(v))\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  def build(X):\n    Z = X[[c for c in X.columns if c in BASE or c == 'row_id']].copy()\n    for k, v in _shape(X).items():\n      Z[k] = v\n    return Z\n  return build(X_train), build(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# jm1 — TabFM pipeline\n\nTask: NASA MDP software defect prediction (TabArena `jm1`), ~5.8k software modules described by\n21 McCabe/Halstead complexity metrics, binary target `defects`, scored as `1 - ROC-AUC` (lower is\nbetter) averaged over the 9 folds the published TabFM baseline used.\n\n## What the pipeline does\n\nThe prediction is a single frozen TabFM in-context pass over the *entire, unmodified* training\ntable — the search found that every intervention on the rows made things worse (shrinking the\ncontext, collapsing the 415 exact-duplicate metric groups, dropping hard rows, oversampling the\n19% positives, bagging subsamples), and so did every label-derived feature (a GBDT out-of-fold\nprediction, a leave-one-out group defect rate) and every rank-blend of a side model into the\noutput. So `preprocess` and `postprocess` are identity, `sample` is not defined at all, and the\nonly TabFM knob set is `class_shift=False` (with two classes the per-member label permutation\nbuys no diversity).\n\nAll of the gain is in the **feature representation**, done in `engineer`:\n\n1. **Drop `l`, `i`, `b`, `t`.** They are exact algebraic functions of `v`, `d` and `e`\n   (`l=1/d`, `i=v/d`, `b=v/3000`, `t=e/18`; mismatch rate under 0.03% each), so they add no\n   information and cost a fifth of the table's width.\n2. **Keep the 13 raw measurements and add 22 derived columns.** `loc`, `v(g)` and the Halstead\n   terms are all proxies for size; what distinguishes a buggy module from a merely large one is\n   *shape* — cyclomatic density, comment/blank/code density, operator repetition, vocabulary\n   reuse — plus the residuals of the identities that ought to hold\n   (`branchCount = 2·v(g) − 1`, `v = N·log2(η)`, `e = v·d`, `loc = lOCode+lOComment+lOBlank`).\n   A group ablation showed all five groups contribute.\n3. **Signed-`log1p` the derived columns.** They span as many decades as the raw ones\n   (`rep_op`, `e_per_loc`), and outlier clipping leaves no resolution inside the bulk. Applying\n   the reshape to the raw columns instead is worse — it has to land on the derived quantities.\n\n`folds()` is plain 5-fold stratified CV (seed 2): rows are independent modules with no time or\ngroup structure, so that mirrors how the held-out split was made.\n\nValidation history (3-fold CV, 8 estimators, `1-auc`): identity pipeline ≈ 0.2219, dropping the\nredundant columns 0.2199, adding the ratios/residuals 0.2185, log-shaping them 0.2167. The\ndifferences here are the size of the fold noise, so the last step was re-checked on three\nindependent fold partitions (5-fold seed 0, 10-fold seed 1, 5-fold seed 2) rather than one; it\ncame out −0.0018 / +0.0002 / −0.0009, a real but small edge. End to end the pipeline is worth\nroughly 0.005 AUC over the identity baseline.\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` reads no files — every feature is computed arithmetically from the\ncolumns the judge already passes in. `final/build.sh` therefore documents that and exits 0; it\ntakes no time and needs no disk. Run:\n\n```\nbash final/build.sh && python final/run.py\n```\n\n`python final/run.py --check` verifies prerequisites and imports without touching the GPU.\n\n## Things a reader could get wrong\n\n- **`final/build/sweep.py` is not a build step.** It is the search driver: it rewrote the `CFG =`\n  line of the *then-current* `pipeline.py` for each variant fed on stdin, ran `judge.py check`\n  and `judge.py val`, and left the best variant in place. The scored pipeline has no `CFG` line,\n  so running sweep.py against it would fail its assertion. It is shipped as a record only.\n- **Earlier snapshots wrote a `.blend_*.npy` cache**; the scored pipeline (`history/pipeline_096.py`)\n  removed that side-model path entirely, so no stale cache is read and none needs rebuilding.\n- **`_shape()` reads `n`, `v`, `d`, `e` from the input** even though they are not in `BASE` — they\n  are used to build the derived columns and then dropped from the output table. `X['d']` and the\n  rest must therefore still be present in the raw frame; the pipeline does not tolerate a\n  pre-pruned input.\n- **`eta.replace(0, np.nan)` in `v_resid` is a pandas call**, so `engineer` expects pandas\n  Series, not numpy arrays — which is what the judge passes.\n- The run's reported score comes from the mean over the 9 TabArena folds of the final evaluation,\n  not from the 3-fold CV numbers quoted above; the two are not directly comparable.\n","package":[],"derivations":[]},{"id":"kddcup09_appetency","name":"kddcup09_appetency","short_name":"kddcup09_appetency","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.155939,"plain_note":null,"n_train":33333,"n_test":16667,"n_folds":9,"thresholds":null,"summary":"The task is ~33k rows × 212 columns (174 numeric, 38 string) with 1.8% positives, scored as 1 − AUC (lower is better). TabFM does the predicting; the pipeline's whole job is to decide *which* columns it sees and how the high-cardinality string columns are represented.","score":0.150456,"gain_pct":3.516118,"medal":null,"category":"II","lines":175,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["preprocess","engineer"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile', 'robust']"},"helper_functions":["_as_str","_codes","_cat_features","_pair_codes","_auc","_uni_score","_select"],"helper_ranges":{"_as_str":[36,40],"_codes":[50,56],"_cat_features":[59,81],"_pair_codes":[84,91],"_auc":[94,96],"_uni_score":[99,109],"_select":[112,122]},"hook_helpers":{"preprocess":[],"engineer":["_as_str","_codes","_cat_features","_pair_codes","_auc","_uni_score","_select"],"postprocess":[]},"hook_ranges":{"preprocess":[43,47],"engineer":[125,171],"postprocess":[174,175]},"code":"\"\"\"kddcup09_appetency -- 33k rows, 212 cols (174 numeric, 38 string), 1.8% positives, metric 1-AUC.\n\nIntent (v3): v2 (count + cross-fitted target encoding for the 38 string columns) gave\n0.17726 -> 0.17533 but cost 519s an evaluation against 140s. Rank the 273 engineered columns by\nin-fold univariate AUC (NaN treated as its own extreme, so a missingness signal counts) and keep\nthe top K: most of these columns are 97% missing noise, and the column count drives TabFM's cost.\n(v7) K: 60->0.18262, 120->0.17022, 180->0.16593, 220->0.16166, 273->0.17533; keep 220.\n(v13) pairwise categorical encodings scored 0.40858: their levels are nearly all unseen at\nquery time, so the column varies over the context and is constant over the queries. Nine of the\nraw categoricals have 1.6k-11.7k levels and carry the same mismatch in weaker form. Make both\nencodings agree across context and query: a level seen fewer than 10 times is the prior, and\nthe count a context row sees excludes its own out-of-fold block, so a singleton reads 0 there\nexactly as an unseen query value does. Mark: 0.15168 (this file, RESULT 16). Rejected since: floor 30 (0.15298), truncated strings\n(0.15313), five norm methods (0.15422), quantile_rtdl for power (0.15594), K=250 (0.15883),\npermute_categorical (0.15575), outlier_threshold 10 (0.15309).\n(v21) K=220 was tuned against the leaky encodings; with ~400 positives a univariate |AUC-0.5|\nbelow ~0.03 is noise, and cleaner target encodings should make the noise columns relatively\nmore costly. K: 150 -> 0.15491, 180 -> 0.15028, 200 -> 0.15011, 220 -> 0.15168, 250 -> 0.15883; K=200 stands.\nAlso rejected: averaging out-of-fold partitions 0.18518 (it converges on leave-one-out, which is\nanti-correlated with the row's own label), row-level n_obs/n_rare summaries 0.15091.\n(v26) the target encodings are the highest-ranked columns; shrink them harder, 20 -> 60.\n\"\"\"\nimport numpy as np\nimport pandas as pd\nfrom scipy.stats import rankdata\n\nTABFM_KWARGS = {'norm_methods': ['none', 'power', 'quantile', 'robust']}\n\nKEEP_STR_MAX = 30      # raw string kept for columns with at most this many training levels\nTE_FOLDS = 5\nTE_SMOOTH = 60.0\nN_KEEP = 200           # columns kept, ranked by in-fold univariate AUC\nMIN_LEVEL = 10         # a level rarer than this is encoded as the prior on both sides\n\n\ndef _as_str(s):\n  \"\"\"plain object-dtype strings: an arrow-backed str column does not survive the hook pickle.\"\"\"\n  v = s.astype(object).to_numpy(dtype=object).copy()\n  v[pd.isna(v)] = \"__NA__\"\n  return pd.Series(v, dtype=object, index=s.index)\n\n\ndef preprocess(X_train, y_train, X_test):\n  # an arrow-backed str dtype does not survive the hook pickle on every judge server\n  if not isinstance(y_train, pd.DataFrame) and y_train.dtype.kind not in \"fiuO\":\n    y_train = y_train.astype(object)\n  return X_train, y_train, X_test\n\n\ndef _codes(st, sv):\n  \"\"\"integer codes for a categorical column; query values unseen in training get -1.\"\"\"\n  ct, uniq = pd.factorize(st, use_na_sentinel=False)\n  lut = pd.Series(np.arange(len(uniq)), index=uniq)\n  cv = sv.map(lut).to_numpy()\n  cv = np.where(pd.isna(cv), -1, cv).astype(np.int64)\n  return ct.astype(np.int64), cv, len(uniq)\n\n\ndef _cat_features(ct, cv, n, yb, rng):\n  \"\"\"count + cross-fitted target encoding for one categorical column.\"\"\"\n  cnt = np.bincount(ct, minlength=n).astype(np.float64)\n  pos = np.bincount(ct, weights=yb, minlength=n)\n  prior = yb.mean()\n\n  known = cnt >= MIN_LEVEL\n\n  # cross-fitted on the context rows, full-fit map on the query rows\n  te_t, cnt_t = np.empty(len(ct)), np.empty(len(ct))\n  order = rng.permutation(len(ct))\n  scale = TE_FOLDS / (TE_FOLDS - 1.0)\n  for p in np.array_split(order, TE_FOLDS):\n    c_out = np.bincount(ct[p], minlength=n).astype(np.float64)\n    p_out = np.bincount(ct[p], weights=yb[p], minlength=n)\n    c_in, p_in = cnt - c_out, pos - p_out\n    m = np.where(known, (p_in + prior * TE_SMOOTH) / (c_in + TE_SMOOTH), prior)\n    te_t[p] = m[ct[p]]\n    cnt_t[p] = c_in[ct[p]] * scale\n  m_full = np.where(known, (pos + prior * TE_SMOOTH) / (cnt + TE_SMOOTH), prior)\n  te_v = np.where(cv >= 0, m_full[np.clip(cv, 0, None)], prior)\n  cnt_v = np.where(cv >= 0, cnt[np.clip(cv, 0, None)], 0.0)\n  return cnt_t, cnt_v, te_t, te_v\n\n\ndef _pair_codes(at, av, bt, bv, nb):\n  \"\"\"codes of the (a, b) pair, renumbered densely; a query row with either side unseen gets -1.\"\"\"\n  kt, uniq = pd.factorize(at * nb + bt, use_na_sentinel=False)\n  lut = pd.Series(np.arange(len(uniq)), index=uniq)\n  raw = np.where((av < 0) | (bv < 0), -1, av * nb + bv)\n  kv = pd.Series(raw).map(lut).to_numpy()\n  kv = np.where(pd.isna(kv), -1, kv).astype(np.int64)\n  return kt.astype(np.int64), kv, len(uniq)\n\n\ndef _auc(v, yb, npos, nneg):\n  r = rankdata(v)\n  return (r[yb > 0].sum() - npos * (npos + 1) / 2) / (npos * nneg)\n\n\ndef _uni_score(v, yb, npos, nneg):\n  \"\"\"|AUC-0.5| of one column, taking the better of ranking NaN lowest / highest, so that a column\n  whose signal lives in its missingness pattern scores as high as one whose signal is in its values.\"\"\"\n  if v.dtype.kind not in \"fiu\":\n    return 0.0\n  m = np.isnan(v)\n  if not m.any():\n    return abs(_auc(v, yb, npos, nneg) - 0.5)\n  lo = np.where(m, -np.inf, v)\n  hi = np.where(m, np.inf, v)\n  return max(abs(_auc(lo, yb, npos, nneg) - 0.5), abs(_auc(hi, yb, npos, nneg) - 0.5))\n\n\ndef _select(ft, cat, yb):\n  \"\"\"Top-N columns by in-fold univariate AUC; a raw string column inherits its target encoding's score.\"\"\"\n  npos, nneg = float(yb.sum()), float(len(yb) - yb.sum())\n  score = {}\n  for c, v in ft.items():\n    score[c] = _uni_score(np.asarray(v), yb, npos, nneg)\n  for c in cat:\n    if c in score:\n      score[c] = max(score.get(c + \"_te\", 0.0), score.get(c + \"_cnt\", 0.0))\n  order = sorted(score, key=lambda c: -score[c])\n  return set(order[:N_KEEP])\n\n\ndef engineer(X_train, y_train, X_test):\n  y = y_train.iloc[:, 0] if isinstance(y_train, pd.DataFrame) else y_train\n  yb = (y.astype(str).to_numpy() == \"1\").astype(np.float64)\n  rng = np.random.default_rng(0)\n\n  cols = [c for c in X_train.columns if c != \"row_id\"]\n  num = [c for c in cols if pd.api.types.is_numeric_dtype(X_train[c])]\n  cat = [c for c in cols if c not in num]\n\n  ft, fv = {}, {}\n  for c in num:\n    v = X_train[c]\n    if v.notna().sum() == 0 or v.nunique(dropna=True) <= 1:\n      continue\n    ft[c] = v.to_numpy(dtype=np.float64)\n    fv[c] = X_test[c].to_numpy(dtype=np.float64)\n\n  codes = {}\n  for c in cat:\n    st, sv = _as_str(X_train[c]), _as_str(X_test[c])\n    ct, cv, nu = _codes(st, sv)\n    if nu <= 1:\n      continue\n    codes[c] = (ct, cv, nu)\n    a, b, d, e = _cat_features(ct, cv, nu, yb, rng)\n    ft[c + \"_cnt\"], fv[c + \"_cnt\"] = a, b\n    ft[c + \"_te\"], fv[c + \"_te\"] = d, e\n    if nu <= KEEP_STR_MAX:\n      ft[c] = st.to_numpy()\n      fv[c] = sv.to_numpy()\n\n  keep = _select(ft, cat, yb)\n  ft = {c: v for c, v in ft.items() if c in keep}\n  fv = {c: v for c, v in fv.items() if c in keep}\n\n  Xt = pd.DataFrame(ft, index=X_train.index)\n  Xv = pd.DataFrame(fv, index=X_test.index)\n  for c in Xt.columns:\n    if Xt[c].dtype.kind not in \"fiu\":\n      Xt[c] = Xt[c].astype(object)\n      Xv[c] = Xv[c].astype(object)\n  if \"row_id\" in X_train.columns:\n    Xt[\"row_id\"] = X_train[\"row_id\"].to_numpy()\n    Xv[\"row_id\"] = X_test[\"row_id\"].to_numpy()\n  Xt.columns = pd.Index(list(Xt.columns), dtype=object)\n  Xv.columns = pd.Index(list(Xv.columns), dtype=object)\n  return Xt, Xv\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# kddcup09_appetency — final pipeline\n\n## What it does\n\nThe task is ~33k rows × 212 columns (174 numeric, 38 string) with 1.8% positives, scored as\n1 − AUC (lower is better). TabFM does the predicting; the pipeline's whole job is to decide\n*which* columns it sees and how the high-cardinality string columns are represented.\n\nFor each of the 38 string columns it builds two numeric views from the training rows of the\ncurrent fold: a level **count** and a **target encoding** (positive rate per level, smoothed\ntoward the prior with `TE_SMOOTH = 60`). Both are made to look the same on the context side\nand the query side, which was the single biggest win of the run: the target encoding is\ncross-fitted over 5 random blocks (a context row's encoding is computed from the other four\nblocks, so it never sees its own label), the count a context row reads likewise excludes its\nown block and is rescaled by 5/4, and any level occurring fewer than `MIN_LEVEL = 10` times\ncollapses to the prior on both sides. Without that symmetry a rare level reads one way in\ncontext and another way at query time and the score collapses (0.409 vs 0.152). String\ncolumns with at most 30 levels are additionally passed through as raw categoricals.\n\nThe resulting ~273 columns are then ranked by in-fold univariate AUC — with NaN scored both\nas the smallest and as the largest value, taking the better of the two, so a column whose\nsignal is purely its missingness pattern ranks on par with one whose signal is in its values —\nand only the top `N_KEEP = 200` survive. Most of the raw columns are ~97% missing noise, and\ncolumn count is what drives TabFM's cost, so this both speeds up and improves the fit. A raw\nstring column inherits the score of its own encodings. TabFM then runs with\n`norm_methods = ['none', 'power', 'quantile', 'robust']` and the predictions are returned\nunmodified.\n\n## build.sh\n\nThere is nothing to build. `final/build.sh` is a no-op that exits 0 with a comment saying so.\nThe pipeline reads no cache, no precomputed feature file and no auxiliary artifact — every\nstatistic is recomputed inside `engineer()` from the fold's own training rows, which is also\nwhat keeps the target encodings honest. It needs no time and no disk.\n\nTo reproduce:\n\n```\ncd <this workspace> && bash final/build.sh && python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **The encodings are fold-local by design, not by omission.** It would be natural to\n  precompute the count/target maps once over the whole training file and cache them. Doing so\n  leaks labels across the CV boundary and makes the validation numbers meaningless. The\n  cross-fitting inside `engineer()` is the method, not an implementation detail.\n- **`N_KEEP = 200` is tuned against the *clean* encodings.** An earlier value of 220 was tuned\n  while the encodings still had the context/query mismatch; after that was fixed, 180/200/220\n  scored 0.1503 / 0.1501 / 0.1517. Re-tune it if the feature set changes.\n- **`_as_str` exists for a real reason.** Arrow-backed string dtypes do not survive the pickle\n  the judge uses to hand data to the hooks on every server, so string columns are forced to\n  plain `object` dtype (and NaN to the literal `\"__NA__\"` level) before anything else happens.\n  The same defensive cast is applied to `y_train` in `preprocess`.\n- Rejected variants are recorded in the module docstring of `final/pipeline.py` with their\n  scores — worth reading before re-trying one of them.\n","package":[],"derivations":[]},{"id":"Marketing_Campaign","name":"Marketing_Campaign","short_name":"Marketing_Campaign","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.072983,"plain_note":null,"n_train":1493,"n_test":747,"n_folds":30,"thresholds":null,"summary":"The predictor is the frozen TabFM foundation model doing in-context learning over the training rows; everything here is about what it gets to see and how its votes are combined. The task is small (1493 train / 747 test rows for the scored split), so no row selection is needed — every training row is always in context.","score":0.061612,"gain_pct":15.580341,"medal":null,"category":"I","lines":107,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","folds"],"tabfm_kwargs":{"n_svd_features":"'sqrt'","n_feature_crosses":"'sqrt'","outlier_threshold":"2.0","permute_categorical":"True","average_logits":"False","softmax_temperature":"0.2"},"helper_functions":["_expand"],"helper_ranges":{"_expand":[56,90]},"hook_helpers":{"preprocess":[],"engineer":["_expand"],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[52,53],"engineer":[94,95],"sample":[98,103],"postprocess":[106,107],"folds":[45,49]},"code":"\"\"\"Marketing_Campaign / 1-AUC. Best 0.07042 (eval 55). Identity 0.08883.\n\n  eval 55  4 shuffled draws at T=0.3          0.07042  (-0.00020, t=-1.2 vs 52)\n\nConfirms the first half of the interaction: the draw axis is worth more at a sharp temperature\n(-0.00020 from four draws) than it was at the default one (-0.00017 from eight, eval 25).\n\nIntent (eval 56): the second half. If the temperature curve turned at 0.15 because eight votes\ncould not resolve finely enough, then 32 votes should tolerate a sharper setting -- the tie\nfloor moves down as voters are added. T=0.2 with the same four draws; at eight members that\nsetting was on the wrong side of the turn.\n\"\"\"\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import RepeatedStratifiedKFold\n\nTABFM_KWARGS = {\n    'n_svd_features': 'sqrt',\n    'n_feature_crosses': 'sqrt',\n    'outlier_threshold': 2.0,\n    'permute_categorical': True,\n    'average_logits': False,\n    'softmax_temperature': 0.2,\n}\n\nN_SPLITS, N_REPEATS, FOLD_SEED = 5, 6, 0\nN_DRAWS = 4\n\nMNT = ['MntWines', 'MntFruits', 'MntMeatProducts', 'MntFishProducts',\n       'MntSweetProducts', 'MntGoldProds']\nNUMP = ['NumWebPurchases', 'NumCatalogPurchases', 'NumStorePurchases']\nCMP = ['AcceptedCmp1', 'AcceptedCmp2', 'AcceptedCmp3', 'AcceptedCmp4', 'AcceptedCmp5']\nCATS = ['Wine', 'Fruit', 'Meat', 'Fish', 'Sweet', 'Gold']\nEDU = {'Basic': 0.0, '2n Cycle': 1.0, 'Graduation': 2.0, 'Master': 3.0, 'PhD': 4.0}\nPARTNER = {'Married': 1.0, 'Together': 1.0}\nMARITAL = {'Single': 0.0, 'Divorced': 1.0, 'Widow': 2.0,\n           'Together': 3.0, 'Married': 4.0}\n# 64 -> 81 columns (k: 8 -> 9) paid for in copies of the strongest columns, not new ones.\nDUP = ['MntWines', 'NumCatalogPurchases', 'AcceptedCmp5', 'AcceptedCmp1', 'Income',\n       'Recency', 'MntMeatProducts', 'MntGoldProds', 'Dt_Customer', 'MntTotal',\n       'AcceptedCmpTotal', 'NumPurchasesTotal', 'Teenhome', 'NumWebPurchases',\n       'MntFishProducts', 'SpendPerPurchase', 'WebConversion']\n\n\ndef folds(X_train, y_train):\n  y = np.asarray(y_train).ravel()\n  rskf = RepeatedStratifiedKFold(n_splits=N_SPLITS, n_repeats=N_REPEATS,\n                                 random_state=FOLD_SEED)\n  return [(tr, va) for tr, va in rskf.split(np.zeros(len(y)), y)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _expand(df):\n  df = df.copy()\n  mnt = df[MNT].sum(axis=1).astype('float64')\n  npur = df[NUMP].sum(axis=1).astype('float64')\n  kids = (df['Kidhome'] + df['Teenhome']).astype('float64')\n  inc = df['Income'].astype('float64')\n  ten = (pd.to_datetime(df['Dt_Customer'], errors='coerce')\n         - pd.Timestamp('2012-01-01')).dt.days.astype('float64')\n  df['MntTotal'] = mnt\n  df['NumPurchasesTotal'] = npur\n  df['NumPurchasesAll'] = npur + df['NumDealsPurchases']\n  df['AcceptedCmpTotal'] = df[CMP].sum(axis=1).astype('float64')\n  df['Children'] = kids\n  df['SpendPerPurchase'] = mnt / (npur + 1.0)\n  df['IncomePerHead'] = inc / (kids + 2.0)\n  df['WebConversion'] = df['NumWebPurchases'] / (df['NumWebVisitsMonth'] + 1.0)\n  for name, col in zip(CATS, MNT):\n    df[name + 'Share'] = df[col] / (mnt + 1.0)\n  df['DealShare'] = df['NumDealsPurchases'] / (npur + 1.0)\n  for name, col in zip(['Web', 'Catalog', 'Store'], NUMP):\n    df[name + 'Share'] = df[col] / (npur + 1.0)\n  df['Tenure'] = ten\n  df['Age'] = 2014.0 - df['Year_Birth']\n  df['SpendPerDay'] = mnt / (ten + 1.0)\n  df['SpendOverIncome'] = mnt / (inc + 1.0)\n  df['RecencyOverTenure'] = df['Recency'] / (ten + 1.0)\n  df['VisitsPerPurchase'] = df['NumWebVisitsMonth'] / (npur + 1.0)\n  for name, col in zip(CATS, MNT):\n    df[name + 'PerPurchase'] = df[col] / (npur + 1.0)\n    df['Log' + name] = np.log1p(df[col].astype('float64'))\n  df['EduOrd'] = [EDU.get(v, 2.0) for v in df['Education'].tolist()]\n  df['HasPartner'] = [PARTNER.get(v, 0.0) for v in df['Marital_Status'].tolist()]\n  df['IsParent'] = (kids > 0).astype('float64')\n  df['Dt_Customer'] = ten\n  return df\n\n\n\ndef engineer(X_train, y_train, X_test):\n  return _expand(X_train), _expand(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Same rows every draw, different order -- the judge fixes random_state, so order is\n  the only thing that makes one draw's members differ from another's (eval 24).\"\"\"\n  n = len(X_train)\n  rng = np.random.default_rng(0)\n  return [np.arange(n)] + [rng.permutation(n) for _ in range(N_DRAWS - 1)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Marketing_Campaign — TabFM pipeline (history/pipeline_056.py)\n\n## What the pipeline does\n\nThe predictor is the frozen TabFM foundation model doing in-context learning over the training rows;\neverything here is about what it gets to see and how its votes are combined. The task is small (1493\ntrain / 747 test rows for the scored split), so no row selection is needed — every training row is\nalways in context. Three things are layered on top of that.\n\n**Feature expansion.** `engineer` widens the 25-ish raw customer columns to ~81 by adding the ratios\nand totals that actually carry the marketing-response signal: total spend and total purchases, the\nper-category spend shares and log-spends, channel shares (web / catalog / store), deal share, web\nconversion (web purchases per visit), spend per purchase, spend over income, income per household\nmember, and a spend-per-day rate. `Dt_Customer` is converted to a tenure in days from 2012-01-01\n(and reused in place of the raw date), `Year_Birth` to an age, and the two categorical columns are\ngiven ordinal encodings (`Education` → 0–4, `Marital_Status` → a has-partner flag). A short list of\nthe strongest columns (`DUP`) is duplicated verbatim. That is deliberate and not a bug: TabFM's\ninternal SVD/feature-cross budget is set as `sqrt(n_columns)`, so widening the table from 64 to 81\ncolumns buys one more component (k: 8 → 9), and paying for it in copies of columns that already\nmatter beat paying for it in new, weaker ones.\n\n**Ensembling by draw.** The judge fixes TabFM's `random_state`, so two ensemble members over the same\nrows in the same order are identical. `sample` therefore returns four index arrays over the *same*\nfull training set — the identity permutation plus three shuffles from a fixed seed — which is what\nmakes the four draws differ at all. Their predictions are averaged.\n\n**Sharpened voting.** `TABFM_KWARGS` averages probabilities rather than logits at\n`softmax_temperature=0.2`, with `n_svd_features` / `n_feature_crosses` at `'sqrt'`, outlier clipping\nat 2.0 σ, and categorical permutation on. The sharp temperature and the extra draws interact: more\nvoters let the temperature go lower before ties stop resolving.\n\nValidation used 5-fold × 6-repeat stratified CV (`folds()`), which is far more stable than the\ndefault 3 folds on a dataset this small — most of the tuning steps were worth less than the fold\nspread otherwise.\n\nScored result: **1-AUC = 0.0616** as the mean over the 30 TabArena folds (published TabFM baselines\non the same folds: 0.0730 plain, 0.0724 ensemble). Search-time CV best was 0.0703.\n\n## What build.sh builds\n\nNothing. `bash final/build.sh` prints one line and exits 0 in well under a second, needs no disk, and\nexists only so the documented `bash final/build.sh && python final/run.py` sequence works. The\npipeline has no prerequisites: all four hooks are pure functions of the DataFrames the judge passes\nin, and the run that produced them never wrote a cache, a feature file, or a helper module. (This is\nalso why there is no `final/build/` directory — there were no build scripts to copy into it.)\n\nTo reproduce, you need the competition data in place under `data/` and a GPU with TabFM available;\n`python final/run.py` runs the same `judge.load_task` / `judge.run_pipeline` path used during the\nsearch. `python final/run.py --check` verifies imports and prerequisites without touching TabFM.\n\n## Things a reader could get wrong\n\n- **The duplicated columns in `DUP` are intentional.** Deleting them changes TabFM's `sqrt`-sized\n  SVD/cross budget and costs accuracy; they are not leftover debris.\n- **`sample` is not subsampling.** It returns four permutations of *all* training rows. If you\n  \"simplify\" it to a single `np.arange(n)`, the four ensemble draws collapse into one identical\n  prediction, because the judge pins `random_state`.\n- **`MARITAL` is dead code.** An ordinal marital encoding that lost to the binary `HasPartner` flag;\n  the dict is still defined but never used.\n- **Row counts differ between the run record and TabArena.** `result.json` reports 1493/747 for the\n  search split, but the 30-fold final ran 44800 train / 22400 test rows in total across folds.\n- **Hard-coded dates.** Tenure is measured from 2012-01-01 and age from 2014, matching this\n  dataset's collection window; they are constants, not \"today\".\n- **The docstring at the top of `pipeline.py` describes the *next* experiment** (eval 56's intent),\n  as the search loop required. It is the record of why this configuration was tried, not a\n  description of a pending change.\n","package":[],"derivations":[]},{"id":"maternal_health_risk","name":"maternal_health_risk","short_name":"maternal_health_risk","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.371068,"plain_note":null,"n_train":676,"n_test":338,"n_folds":30,"thresholds":null,"summary":"676 training rows, six numeric columns (Age, SystolicBP, DiastolicBP, BS, BodyTemp, HeartRate), three risk classes, scored by log loss. The predictor is a stock frozen TabFM with no ensemble knobs set (`TABFM_KWARGS = {}`); all the work is in the feature representation handed to it.","score":0.364813,"gain_pct":1.685675,"medal":null,"category":"I","lines":106,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","postprocess","folds"],"tabfm_kwargs":{},"helper_functions":["_feat"],"helper_ranges":{"_feat":[76,86]},"hook_helpers":{"preprocess":[],"engineer":["_feat"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[72,73],"engineer":[89,90],"postprocess":[93,106],"folds":[66,69]},"code":"\"\"\"maternal_health_risk -- 676 training rows, 6 numeric columns, 3 classes, log loss.\n\nThe whole pipeline is four derived blood-pressure / heart-rate axes handed to a\nstock TabFM, one implausible HeartRate value blanked, and DiastolicBP dropped\nbecause those derived columns already carry it.  Everything else was measured\nand thrown away.  What 89 evaluations established:\n\n  * Nothing downstream of TabFM is worth anything.  TabFM comes out calibrated:\n    the best global temperature is 1.05 (-0.0007) and full vector scaling\n    fitted on *all* folds at once -- an unreachable ceiling -- is worth 0.0013.\n    Geometric blending with RF / ExtraTrees / kNN / logistic out-of-fold\n    predictions only hurts; on the search folds those score 0.53 / 0.54 / 1.89 /\n    0.80 against TabFM's 0.409.  Averaging up to eight different pipelines'\n    out-of-fold matrices moves the score by 0.0002, so the 8-member ensemble is\n    already saturated and extra `sample()` draws would only cost time.\n  * Nothing that perturbs the context rows helps, and most of it is disastrous.\n    Jittered copies of the training rows cost 0.08, coarsening Age and BS costs\n    0.07, per-member row subsampling (max_num_rows=512) costs 0.019, and\n    deleting the minority label inside conflicting duplicate groups costs 0.24 --\n    that last one is the whole story of this dataset: 131 of 676 rows sit in\n    groups that share a feature vector and disagree on the label, and those\n    disagreements *are* the probabilities the metric asks for.  TabFM already\n    reads them better than an explicit duplicate-group estimator does (0.425 vs\n    0.579 on the rows that have duplicates), so it needs no help.  Repeating the\n    whole context twice changes nothing, as expected of an attention model.\n  * The ensembling knobs are flat.  norm_methods, n_feature_crosses,\n    n_svd_features, outlier_threshold, average_logits and feat_shuffle_method\n    all land within +-0.003 of the default; class_shift=False costs 0.002 and\n    enable_nnls costs 0.002 for three times the run time.  TABFM_KWARGS stays {}.\n  * What does pay is giving TabFM new *axes*.  Every norm_method standard-scales\n    each column first, so an affine copy of a column is invisible and a plainly\n    duplicated one (BS twice, random projections) mildly hurts -- only genuine\n    new combinations of columns help, and only about four before they dilute\n    each other.  Corollary, found late and worth 0.001: once MAP/PP-style\n    combinations are present the raw DiastolicBP column is exactly recoverable\n    from them, and dropping it helps rather than hurts.\n  * Anything that separates training rows from held-out rows is poison.  A\n    \"distance to the nearest other training row\" column scores 0.466: training\n    rows sit closer to their neighbours than held-out rows do, so the column\n    means something different in context than at prediction time.\n\nMeasurement.  The judge's default 3-fold CV has a 0.042 fold spread on 676 rows,\nfar too coarse to choose between changes worth 0.005, so folds() replaces it.\nSearching used RepeatedStratifiedKFold(10 x 2, seed 0) -- identity 0.40895, this\npipeline's feature family 0.40095.  The findings above are from that round.\nSelection then moved to a fresh partition, RepeatedStratifiedKFold(10 x 8, seed\n1234), so the finalists were ranked on a split the fifty-odd search evaluations\nhad not been selected against: identity 0.37941, this pipeline 0.37331, and the\neight runners-up lie within one paired standard error (0.0013) of each other --\nthe family of derived-axis pipelines is a real -0.005, the ordering inside it is\nnot, so the pick among them went to the simplest column set as much as to the\nnumber.\n\npostprocess dumps each fold's raw probabilities to .dump/<DUMP>/.  Because\nfolds() is deterministic those files reconstruct offline (oof.py) into exactly\nthe score the judge printed, which is how every postprocess-only question above\nwas answered for free instead of costing an evaluation each.\n\"\"\"\nimport numpy as np\n\nTABFM_KWARGS = {}\n\nDUMP = 'final'\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  return list(RepeatedStratifiedKFold(\n      n_splits=10, n_repeats=8, random_state=1234).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _feat(df):\n  sbp = df[\"SystolicBP\"].astype(float)\n  dbp = df[\"DiastolicBP\"].astype(float)\n  hr = df[\"HeartRate\"].astype(float)\n  d = df.drop(columns=[\"DiastolicBP\"])          # = SystolicBP - PulsePressure\n  d[\"HeartRate\"] = hr.mask(hr < 40, np.nan)     # two rows read 7 bpm\n  d[\"PulsePressure\"] = sbp - dbp\n  d[\"ShockIndex\"] = hr / sbp\n  d[\"BPratio\"] = sbp / dbp\n  d[\"FracPP\"] = (sbp - dbp) / ((sbp + 2 * dbp) / 3.0)\n  return d\n\n\ndef engineer(X_train, y_train, X_test):\n  return _feat(X_train), _feat(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  if DUMP:\n    try:\n      import hashlib, os\n      d = os.path.join(\".dump\", DUMP)\n      os.makedirs(d, exist_ok=True)\n      rid = (X_test[\"row_id\"].to_numpy(dtype=\"int64\") if \"row_id\" in X_test.columns\n             else np.arange(len(X_test), dtype=\"int64\"))\n      np.savez(os.path.join(d, hashlib.sha1(rid.tobytes()).hexdigest()[:12] + \".npz\"),\n               p=pred.to_numpy(dtype=\"float64\"), rid=rid,\n               cols=np.array([str(c) for c in pred.columns]))\n    except Exception:\n      pass\n  return pred\n","readme":"# maternal_health_risk — final pipeline\n\n## What it does\n\n676 training rows, six numeric columns (Age, SystolicBP, DiastolicBP, BS, BodyTemp, HeartRate),\nthree risk classes, scored by log loss. The predictor is a stock frozen TabFM with no ensemble\nknobs set (`TABFM_KWARGS = {}`); all the work is in the feature representation handed to it. Four\nderived circulatory axes are added — pulse pressure (SBP−DBP), shock index (HR/SBP), the SBP/DBP\nratio, and fractional pulse pressure (pulse pressure over mean arterial pressure) — the two rows\nwhose HeartRate reads 7 bpm are blanked to NaN, and the raw DiastolicBP column is dropped because\nit is exactly recoverable from SystolicBP plus the derived axes and only dilutes them. Nothing is\ndone after TabFM: it comes out calibrated (the best global temperature is 1.05, worth 0.0007), and\nblending in RF / ExtraTrees / kNN / logistic out-of-fold predictions, or perturbing the context\nrows in any way, measured worse. The dataset's defining property is that 131 of 676 rows sit in\ngroups sharing a feature vector with disagreeing labels; those disagreements *are* the target\nprobabilities, and TabFM reads them better than an explicit duplicate-group estimator, so the\npipeline leaves them alone.\n\n`folds()` replaces the judge's default 3-fold CV, whose 0.042 fold spread on 676 rows is too coarse\nto rank changes worth 0.005, with `RepeatedStratifiedKFold(10 splits × 8 repeats, seed 1234)`.\n`postprocess` additionally writes each fold's raw probability matrix to `.dump/final/` so that\npost-processing ideas could be scored offline (`final/build/oof.py`) instead of costing an\nevaluation; it does not alter the predictions.\n\n## What build.sh builds\n\nNothing. The pipeline reads no cache, feature store, or precomputed artefact — it is four pure\nhooks over the DataFrames the judge supplies. `final/build.sh` is a comment and `exit 0`; it takes\nno time and no disk. Go straight to:\n\n    bash final/build.sh && python final/run.py\n\n## Things a reader could get wrong\n\n- **`final/build/` is not part of the build.** Those four scripts are search-time tooling:\n  `precheck.py` is a stricter free dry run than `judge.py check` (it reproduces the judge's fold 0\n  including the pickle round-trip and real dtypes), `drive.py` and `drive2.py` rewrite module-level\n  constants of `pipeline.py` and invoke `judge.py val` so several configurations run from one shell\n  call, and `oof.py` rescores the dumped fold probabilities offline. They also expect to live in the\n  workspace root next to `pipeline.py` and `judge.py`, not in `final/build/`, so they will not run\n  in place without being copied up.\n- **`DUMP` has a side effect.** Running the pipeline creates `.dump/final/*.npz` (a few hundred KB\n  at most). It is wrapped in a bare `except: pass`, so a read-only workspace is harmless. Set\n  `DUMP = ''` to switch it off; predictions are identical either way.\n- **The dropped column is not lost information.** `DiastolicBP` is removed only after PulsePressure\n  and friends are computed from it; every norm_method standard-scales each column, so an affine\n  copy of an existing column is invisible to TabFM and a genuinely redundant one mildly hurts.\n- **The score margin is small and the ordering inside the winning family is noise.** On the\n  selection split this pipeline scores 0.37331 log loss against 0.37941 for the identity pipeline;\n  the eight runners-up lie within one paired standard error (0.0013) of it. The −0.005 from the\n  derived-axis family is real, the choice of exactly these four axes was decided by simplicity as\n  much as by the number.\n","package":[],"derivations":[]},{"id":"miami_housing","name":"miami_housing","short_name":"miami_housing","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":74223.673106,"plain_note":null,"n_train":9184,"n_test":4592,"n_folds":9,"thresholds":null,"summary":"TabFM predicts `SALE_PRC` directly from the Miami housing table; the pipeline never transforms the target and never post-processes the prediction. All of the work is in how the *features* are presented to the in-context model, and in TabFM's own ensemble knobs.","score":71802.210396,"gain_pct":3.262386,"medal":null,"category":"I","lines":54,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","norm_methods":"['quantile', 'quantile_rtdl', 'quantile_rtdl', 'power']","outlier_threshold":"20.0"},"helper_functions":["_log"],"helper_ranges":{"_log":[33,39]},"hook_helpers":{"preprocess":[],"engineer":["_log"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[29,30],"engineer":[45,50],"postprocess":[53,54],"folds":[23,26]},"code":"\"\"\"Intent (val 94): 1024 spreads -- the last rung before precision becomes the question.\n\n256 spreads = 74795.6. The axis has not turned yet and the steps are roughly constant in\nlog s (+41, +81, +83), so the additive limit is where this is heading. It cannot be ridden\nindefinitely: a cross varies by about 2/s relative to its own mean, so at 1024 that is 2e-3,\nwhich float32 still holds to four digits but not much beyond. If this rung pays, it is the\nlast one I would trust on a final I cannot re-measure.\n\"\"\"\nimport numpy as np\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt',\n                # a cycle over members: quantile and quantile_rtdl on the plain (even) members,\n                # quantile_rtdl and power on the crossed (odd) ones. Order is load-bearing.\n                'norm_methods': ['quantile', 'quantile_rtdl', 'quantile_rtdl', 'power'],\n                'outlier_threshold': 20.0}\n\n# every non-negative column: LATITUDE would collapse to a constant and LONGITUDE is negative\nLOGGED = ['LND_SQFOOT', 'TOT_LVG_AREA', 'SPEC_FEAT_VAL', 'RAIL_DIST', 'OCEAN_DIST', 'WATER_DIST',\n          'CNTR_DIST', 'SUBCNTR_DI', 'HWY_DIST', 'age', 'month_sold', 'structure_quality',\n          'avno60plus']\n\n\ndef folds(X_train, y_train):\n  \"\"\"Three repeats of 3-fold: nine splits, each training on 2/3 of the rows like the final does.\"\"\"\n  from sklearn.model_selection import RepeatedKFold\n  return list(RepeatedKFold(n_splits=3, n_repeats=3, random_state=0).split(X_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train,
