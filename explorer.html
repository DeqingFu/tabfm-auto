dine\n  isG = arr == \"G\"\n  isC = arr == \"C\"\n  up, dn = slice(0, 30), slice(30, 60)\n  f[\"py_up\"] = isY[:, up].sum(1).astype(np.int16)          # polypyrimidine tract strength\n  f[\"py_up15\"] = isY[:, 15:28].sum(1).astype(np.int16)     # -15..-3, the tract proper\n  f[\"py_dn\"] = isY[:, dn].sum(1).astype(np.int16)\n  f[\"gc_up\"] = (isG | isC)[:, up].sum(1).astype(np.int16)\n  f[\"gc_dn\"] = (isG | isC)[:, dn].sum(1).astype(np.int16)\n  f[\"gc_diff\"] = (f[\"gc_dn\"] - f[\"gc_up\"]).astype(np.int16)\n  # longest pyrimidine run in the upstream window\n  run = np.zeros(len(s), dtype=np.int16)\n  best = np.zeros(len(s), dtype=np.int16)\n  for j in range(0, 30):\n    run = np.where(isY[:, j], run + 1, 0)\n    best = np.maximum(best, run)\n  f[\"py_run_up\"] = best\n  # AG dinucleotides upstream: an acceptor is the FIRST AG after the branch point\n  ag = (arr[:, :-1] == \"A\") & (arr[:, 1:] == \"G\")\n  gt = (arr[:, :-1] == \"G\") & (arr[:, 1:] == \"T\")\n  if AGGT:\n    f[\"n_ag_up\"] = ag[:, 0:27].sum(1).astype(np.int16)     # AGs strictly before -2,-1\n    f[\"n_gt_dn\"] = gt[:, 31:59].sum(1).astype(np.int16)    # GTs strictly after +1,+2\n    f[\"n_ag_all\"] = ag.sum(1).astype(np.int16)\n    f[\"n_gt_all\"] = gt.sum(1).astype(np.int16)\n    # distance from the junction to the nearest flanking AG / GT (0 when there is none)\n    f[\"d_ag_up\"] = _nearest(ag[:, 0:27][:, ::-1])\n    f[\"d_gt_dn\"] = _nearest(gt[:, 31:59])\n  # consensus match counts: donor GT[AG]AGT at +1..+6, acceptor [CT]AG at -3..-1\n  if COLLAPSED:\n    # consensus match counts: donor GT[AG]AGT at +1..+6, acceptor [CT]AG at -3..-1\n    f[\"donor_match\"] = ((arr[:, 30] == \"G\").astype(np.int16) + (arr[:, 31] == \"T\")\n                        + np.isin(arr[:, 32], [\"A\", \"G\"]) + (arr[:, 33] == \"A\")\n                        + (arr[:, 34] == \"G\") + (arr[:, 35] == \"T\")).astype(np.int16)\n    f[\"acc_match\"] = (np.isin(arr[:, 27], [\"C\", \"T\"]).astype(np.int16)\n                      + (arr[:, 28] == \"A\") + (arr[:, 29] == \"G\")).astype(np.int16)\n    # coding potential: an exon must be readable in some frame, an intron need not be\n    f[\"stop_up\"] = _stops(arr[:, 0:30])\n    f[\"stop_dn\"] = _stops(arr[:, 30:60])\n    # period-3 base composition, the other exon signature (frame unknown -> take the spread)\n    f[\"gc3_up\"] = _gc3(isG | isC, 0, 30)\n    f[\"gc3_dn\"] = _gc3(isG | isC, 30, 60)\n  # the same two signals resolved per frame / per codon phase instead of collapsed\n  # RESULT 50: ablating the per-frame block costs 0.0010\n  for off in range(3):\n    f[f\"stop_up{off}\"] = _stops(arr[:, 0:30], off)\n    f[f\"stop_dn{off}\"] = _stops(arr[:, 30:60], off)\n    f[f\"gcph_up{off}\"] = (100 * (isG | isC)[:, off:30:3].mean(1)).astype(np.int16)\n    f[f\"gcph_dn{off}\"] = (100 * (isG | isC)[:, 30 + off:60:3].mean(1)).astype(np.int16)\n  # base and dinucleotide composition: counts TabFM cannot form by attending one column at a time\n  for b in BASES:\n    eq = arr == b\n    f[f\"n{b}_up\"] = eq[:, 0:30].sum(1).astype(np.int16)\n    f[f\"n{b}_dn\"] = eq[:, 30:60].sum(1).astype(np.int16)\n  di = np.char.add(arr[:, :-1], arr[:, 1:])\n  # RESULT 49: ablating the 48 dinucleotide counts costs 0.0007\n  for b1 in BASES:\n    for b2 in BASES:\n      eq = di == b1 + b2\n      f[f\"n_{b1}{b2}\"] = eq.sum(1).astype(np.int16)\n      f[f\"n_{b1}{b2}_up\"] = eq[:, 0:29].sum(1).astype(np.int16)\n      f[f\"n_{b1}{b2}_dn\"] = eq[:, 30:59].sum(1).astype(np.int16)\n  # RESULT 48: ablating the blocks and runs costs 0.0006\n  # composition profile along the window, twelve blocks of five bases\n  for k in range(12):\n    sl = slice(5 * k, 5 * k + 5)\n    f[f\"gc_b{k}\"] = (isG | isC)[:, sl].sum(1).astype(np.int16)\n    f[f\"py_b{k}\"] = isY[:, sl].sum(1).astype(np.int16)\n  # the polypyrimidine tract is a local maximum, not a window average\n  c = np.cumsum(np.concatenate([np.zeros((len(s), 1), np.int16), isY], 1), 1)\n  for w in (10, 15):\n    run = (c[:, w:] - c[:, :-w]).astype(np.int16)\n    f[f\"py_max{w}\"] = run[:, :30].max(1)\n    f[f\"py_argmax{w}\"] = run[:, :30].argmax(1).astype(np.int16)\n    f[f\"py_max{w}_dn\"] = run[:, 30:].max(1)\n  # longest homopolymer run of each base, per half\n  for b in BASES:\n    eq = arr == b\n    f[f\"run{b}_up\"] = _maxrun(eq[:, 0:30])\n    f[f\"run{b}_dn\"] = _maxrun(eq[:, 30:60])\n  f[\"runR_up\"] = _maxrun(~isY[:, 0:30])\n  f[\"runR_dn\"] = _maxrun(~isY[:, 30:60])\n  return pd.DataFrame(f, index=X.index)\n\n\ndef _maxrun(mask):\n  run = np.zeros(len(mask), dtype=np.int16)\n  best = np.zeros(len(mask), dtype=np.int16)\n  for j in range(mask.shape[1]):\n    run = np.where(mask[:, j], run + 1, 0)\n    best = np.maximum(best, run)\n  return best\n\n\ndef _nearest(mask):\n  \"\"\"Index of the first True in each row, counted from column 0; 0 when the row has none.\"\"\"\n  has = mask.any(1)\n  return np.where(has, mask.argmax(1) + 1, 0).astype(np.int16)\n\n\nSTOPS = (\"TAA\", \"TAG\", \"TGA\")\n\n\ndef _stops(arr, frame=None):\n  \"\"\"In-frame stop codons of the half-window; the minimum over the three frames when frame is None.\"\"\"\n  n, w = arr.shape\n  best = np.full(n, 99, dtype=np.int16)\n  for off in (range(3) if frame is None else (frame,)):\n    cnt = np.zeros(n, dtype=np.int16)\n    for p in range(off, w - 2, 3):\n      tri = np.char.add(np.char.add(arr[:, p], arr[:, p + 1]), arr[:, p + 2])\n      cnt += np.isin(tri, STOPS)\n    best = np.minimum(best, cnt)\n  return best\n\n\ndef _gc3(gc, lo, hi):\n  \"\"\"Spread of GC content across the three codon phases -- exons are periodic, introns are not.\"\"\"\n  v = np.stack([gc[:, lo + k:hi:3].mean(1) for k in range(3)], 1)\n  return (100 * (v.max(1) - v.min(1))).astype(np.int16)\n\n\n# ---------------------------------------------------------------- order-2 weight-array model\ndef _codes(X):\n  \"\"\"Integer codes for the weight-array. With WAM_IMPUTE the ambiguity codes take the position's\n  modal base, so the order-2 context space is 64 per position instead of 125 -- the same counts\n  spread over 40% fewer cells -- while TabFM still sees 'N' as its own category.\"\"\"\n  a = _letters(X)\n  out = np.full(a.shape, len(BASES) - 1 if WAM_IMPUTE else len(BASES), dtype=np.int64)\n  if WAM_IMPUTE and _MODE is not None:\n    for i, b in enumerate(BASES):\n      out[np.broadcast_to(_MODE, a.shape) == b] = i\n  for i, b in enumerate(BASES):\n    out[a == b] = i\n  return out\n\n\ndef _wam_fit(A, yi, K):\n  P = A.shape[1]\n  cnt = np.zeros((K, P, V))\n  tc = np.zeros((K, P - 1, V, V))\n  t2 = np.zeros((K, P - 2, V * V, V))\n  nc = np.zeros(K)\n  for c in range(K):\n    Ac = A[yi == c]\n    nc[c] = len(Ac)\n    for p in range(P):\n      cnt[c, p] = np.bincount(Ac[:, p], minlength=V)\n    i1 = Ac[:, :-1] * V + Ac[:, 1:]\n    for p in range(P - 1):\n      tc[c, p] = np.bincount(i1[:, p], minlength=V * V).reshape(V, V)\n    i2 = (Ac[:, :-2] * V + Ac[:, 1:-1]) * V + Ac[:, 2:]\n    for p in range(P - 2):\n      t2[c, p] = np.bincount(i2[:, p], minlength=V * V * V).reshape(V * V, V)\n  return cnt, tc, t2, nc\n\n\ndef _wam_ll(M, A, alpha, m1, m2):\n  \"\"\"Per-class log-likelihood: order 2 backed off to order 1, backed off to the position frequency.\"\"\"\n  cnt, tc, t2, nc = M\n  P = A.shape[1]\n  ar, a1, a2 = np.arange(P)[None, :], np.arange(P - 1)[None, :], np.arange(P - 2)[None, :]\n  prev1, prev2 = tc.sum(3), t2.sum(3)\n  ll = np.zeros((len(A), len(nc)))\n  for c in range(len(nc)):\n    p0 = (cnt[c][ar, A] + alpha) / (nc[c] + V * alpha)\n    p1 = ((tc[c][a1, A[:, :-1], A[:, 1:]] + m1 * p0[:, 1:])\n          / (prev1[c][a1, A[:, :-1]] + m1))\n    j = A[:, :-2] * V + A[:, 1:-1]\n    p2 = ((t2[c][a2, j, A[:, 2:]] + m2 * p1[:, 1:])\n          / (prev2[c][a2, j] + m2))\n    ll[:, c] = (np.log(p0[:, 0]) + np.log(p1[:, 0]) + np.log(p2).sum(1)\n                + np.log(max(nc[c], 1.0) / nc.sum()))\n  return ll\n\n\ndef _softmax(z):\n  z = z - z.max(1, keepdims=True)\n  e = np.exp(z)\n  return e / e.sum(1, keepdims=True)\n\n\nPOS_LLR = False          # RESULT 33: 0.358. Leave-one-out deflates each context row's own-class\n                         # column, so TabFM learns \"anomalously low = true class\" and it inverts at test\n\n\ndef _pos_llr(Atr, yi, K, Ate, alpha=1.0):\n  \"\"\"log P(base at p | class c) - log P(base at p | last class), one column per (position, class).\n  For a training row the model that scores it has that row's own count removed, so the column\n  carries no information about its own label; test rows are scored against the full fold.\"\"\"\n  P = Atr.shape[1]\n  cnt = np.zeros((K, P, V))\n  nc = np.zeros(K)\n  for c in range(K):\n    Ac = Atr[yi == c]\n    nc[c] = len(Ac)\n    for p in range(P):\n      cnt[c, p] = np.bincount(Ac[:, p], minlength=V)\n  ar = np.arange(P)[None, :]\n  out = []\n  for A, own in ((Atr, yi), (Ate, None)):\n    lp = np.empty((len(A), P, K), dtype=np.float64)\n    for c in range(K):\n      o = 0.0 if own is None else (own == c).astype(float)[:, None]\n      lp[:, :, c] = np.log(np.maximum(cnt[c][ar, A] - o + alpha, 1e-9)\n                           / np.maximum(nc[c] - (0.0 if own is None else (own == c)[:, None]) + V * alpha, 1e-9))\n    out.append((lp[:, :, :K - 1] - lp[:, :, K - 1:]).astype(np.float32))\n  return out\n\n\nKEEP_POS = POS           # RESULT 76: -20..+20 costs 0.0007, -12..+12 tied; the full window stays\n\n\nTOPK = 0                 # RESULT 57: keeping only the best 80 numeric columns costs 0.0011 --\n\n\ndef _rank(F, y, k):\n  \"\"\"Column names to keep: every categorical, plus the k numeric columns with the highest ANOVA F\n  against the fold's own labels. Selection uses labels but produces no per-row encoding, so it\n  cannot repeat the RESULT 33 failure, where a leave-one-out column deflated every context row.\"\"\"\n  from sklearn.feature_selection import f_classif\n  num = [c for c in F.columns if pd.api.types.is_numeric_dtype(F[c])]\n  if not TOPK or len(num) <= k:\n    return list(F.columns)\n  sc = np.nan_to_num(f_classif(F[num].to_numpy(float), np.asarray(y, dtype=object))[0])\n  keep = set(np.asarray(num)[np.argsort(-sc)[:k]])\n  return [c for c in F.columns if c not in num or c in keep]\n\n\nEMPHASIS = ()            # RESULT 66: two extra copies of each junction column costs 0.0028 --\n                         # more columns dilute attention faster than duplicates concentrate it\nDIMER_COLS = False       # RESULT 75: an adjacent 2-mer column at every position costs 0.0032\nJUNCTION = True          # RESULT 67: dropping them costs 0.0030 -- the explicit low-cardinality\n                         # conjunction is used, even though both windows already contain those positions\nAGGT = True              # RESULT 68: dropping the AG/GT counts and distances costs 0.0007\nCOLLAPSED = True         # RESULT 69: dropping the collapsed coding signals costs 0.0005.\n\n\ndef _emphasise(F):\n  \"\"\"Extra copies of the junction columns. TabFM attends over columns, and with 157 of them and no\n  feature subsampling (max_num_features is 500) the motif that actually defines the label competes\n  with 150 background statistics for that attention; duplicates raise its share.\"\"\"\n  for c, k in EMPHASIS:\n    for i in range(k):\n      F[f\"{c}_x{i}\"] = F[c]\n  return F\n\n\ndef _select(X, F):\n  \"\"\"Raw nucleotide columns only near the junction; the rest of the window reaches TabFM through\n  the composition aggregates, which is where the last four evaluations' gains came from.\"\"\"\n  drop = [c for c in POS if c not in KEEP_POS]\n  return _obj(pd.concat([X.drop(columns=drop), F], axis=1))\n\n\ndef engineer(X_train, y_train, X_test):\n  Ftr, Fte = _feats(X_train), _feats(X_test)\n  if TOPK:\n    cols = _rank(Ftr, y_train, TOPK)\n    Ftr, Fte = Ftr[cols], Fte[cols]\n  classes = np.array(sorted(pd.unique(np.asarray(y_train, dtype=object))))\n  yi = np.searchsorted(classes, np.asarray(y_train, dtype=object))\n  Atr, Ate = _codes(X_train), _codes(X_test)\n  if BLEND_W:\n    M = _wam_fit(Atr, yi, len(classes))\n    ll = np.mean([_wam_ll(M, Ate, *g) for g in WAM_GRID], axis=0)\n    np.savez(CACHE, keys=_seq(X_test), P=_softmax(ll), cols=classes.astype(str))\n  if POS_LLR:\n    K = len(classes)\n    for L, F in zip(_pos_llr(Atr, yi, K, Ate), (Ftr, Fte)):\n      for j, p in enumerate(POS):\n        for c in range(K - 1):\n          F[f\"llr{c}_{p}\"] = L[:, j, c]\n  if EMPHASIS:\n    Ftr, Fte = _emphasise(Ftr), _emphasise(Fte)\n  return _select(X_train, Ftr), _select(X_test, Fte)\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Geometric blend with the WAM, then a uniform floor. Log loss is decided by the few rows the\n  model is confidently wrong about -- at 2126 scored rows one row at p_true=1e-4 is worth 0.004 of\n  the mean -- so both steps target the tail rather than the typical row.\"\"\"\n  cols = [str(c) for c in pred.columns]\n  if any(c.startswith(\"N_\") for c in cols):        # merge the split negatives back, exactly\n    merged = {}\n    for j, c in enumerate(cols):\n      k = \"N\" if c.startswith(\"N_\") else c\n      merged[k] = merged.get(k, 0.0) + np.asarray(pred)[:, j]\n    order = [c for c in cols if not c.startswith(\"N_\")] + [\"N\"]\n    pred = pd.DataFrame({c: merged[c] for c in order}, index=pred.index)\n  P = np.asarray(pred, dtype=float)\n  P = P / np.clip(P.sum(1, keepdims=True), 1e-12, None)\n  key = _seqkey(X_test)\n  if DUMP and key is not None:\n    import pickle\n    with open(DUMP, \"ab\") as fh:\n      pickle.dump((key, list(pred.columns), P), fh)\n  if BLEND_W:\n    try:\n      z = np.load(CACHE, allow_pickle=False)\n      cols = [str(c) for c in pred.columns]\n      ok = (len(z[\"keys\"]) == len(P) and list(z[\"cols\"]) == cols\n            and (key is None or bool((z[\"keys\"] == key).all())))\n    except Exception:\n      ok = False\n    if ok:\n      W = np.clip(z[\"P\"], 1e-12, None)\n      P = _softmax((1.0 - BLEND_W) * np.log(np.clip(P, 1e-12, None)) + BLEND_W * np.log(W))\n  P = (1.0 - SMOOTH) * P + SMOOTH / P.shape[1]\n  return pd.DataFrame(P, columns=pred.columns, index=pred.index)\n","readme":"# splice — donor / acceptor / neither, log loss\n\n## What the pipeline does\n\nThe task is a 60-nucleotide window centred on a candidate splice junction, classified as `EI`\n(donor), `IE` (acceptor) or `N`. TabFM is the predictor throughout; the pipeline only decides what it\nsees and how its output is finished.\n\nThe 60 raw position columns are kept as low-cardinality **categorical** strings — ambiguity codes\n(N/D/S/R) are collapsed to a single `N` category rather than imputed, because the code is itself a\nsignal — and TabFM is left to encode them. Integer codes for the bases score much worse. On top of\nthose columns, `engineer` adds ~160 hand-built numeric and categorical summaries that TabFM cannot\nform by attending to one column at a time: the two junction dinucleotides and their GT/AG flags, two\nlonger consensus windows around the junction, AG/GT counts and distances to the nearest flanking\nsite, per-frame stop-codon counts and per-phase GC (the coding-potential signature that separates\nexon from intron), 48 dinucleotide counts, base composition in five-base blocks, polypyrimidine-tract\nmaxima and homopolymer runs. All 2126 training rows go into the context as one draw — subsampling,\ndeduplicating, augmenting and reweighting rows were all tried and all cost accuracy.\n\nAlongside TabFM, `engineer` fits a small **order-2 positional weight-array model** (a per-class,\nper-position Markov model of the sequence, order-2 backed off to order-1 backed off to the position\nfrequency, averaged over three backoff strengths). It is far weaker alone (0.1295 vs TabFM's 0.0806)\nbut wrong in different places, so `postprocess` combines the two geometrically with weight 0.16 on\nthe WAM and then mixes in a 0.002 uniform floor. Log loss here is decided by a few dozen confidently\nwrong rows, and both steps target that tail: 0.0806 raw → 0.0794 with the floor → **0.0767** blended,\non stratified 10-fold. TabFM's own ensemble knobs contribute the rest: `permute_categorical`, five\ndifferent normalisations across the eight members, and NNLS-fitted out-of-fold member weights.\n\n## What build.sh builds\n\nNothing. The pipeline has no prerequisite caches — it reads only `.wam_cache.npz`, which `engineer`\nwrites and `postprocess` reads back within the same fold. `build.sh` says so and exits 0; it takes no\ntime and no disk. Running it before `python final/run.py` is harmless and unnecessary.\n\n## Things a reader could get wrong\n\n- **`oof_dump.pkl` is not an input.** `postprocess` appends raw per-fold TabFM probabilities to it for\n  offline analysis. It is append-only and never read by the pipeline; deleting it changes nothing. It\n  does grow across repeated runs.\n- **`final/build/` is search tooling, not build tooling.** `try.py` edited `TABFM_KWARGS` and ran\n  check+val; `lab.py` replays the judge's 10-fold log loss over dumped TabFM probabilities and is how\n  `BLEND_W` and `SMOOTH` were fitted. `lab.py` expects `$TMPDIR/oof_P.npy`, a file distilled from\n  `oof_dump.pkl` by an ad-hoc shell snippet during the run; it is not needed to reproduce the\n  submission, and the constants it produced are already in `pipeline.py`.\n- **`folds()` is 10-fold, not the judge's default 3.** Every score quoted above and in the\n  `pipeline.py` docstring is on that stratified 10-fold split with 8 estimators, so it is not directly\n  comparable to a 3-fold number from elsewhere in the run.\n- **String dtypes matter.** `_obj()` forces plain numpy-object strings on every frame the hooks\n  return, because the judge process that unpickles the hook output has no pyarrow and cannot load a\n  pandas 3 Arrow-backed string column. Removing that cast breaks the run in a way unrelated to\n  modelling.\n- Most of the constants near the top of `pipeline.py` (`IMPUTE_N`, `SPLIT_N`, `DEDUP`, `DIMER_COLS`,\n  `POS_LLR`, `TOPK`, `EMPHASIS`, `NUMERIC_POS`) are switched **off** and kept only as documented\n  negative results, with the measured cost of turning each one on in the adjacent comment.\n","package":[],"derivations":[]},{"id":"students_dropout_and_academic_success","name":"students_dropout_and_academic_success","short_name":"students_dropout_and_academic_success","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.50716,"plain_note":null,"n_train":2949,"n_test":1475,"n_folds":9,"thresholds":null,"summary":"Frozen TabFM does all the predicting; the pipeline gives it two things. First, **external ordinal structure**. Four of the columns — `Mothers_qualification`, `Fathers_qualification`, `Mothers_occupation`, `Fathers_occupation` — are ladders (schooling levels, ISCO-style skill levels) that TabFM's categorical encoder turns into unrelated integers, and most of the ~28 maternal levels appear only a handful of times in a…","score":0.511122,"gain_pct":-0.781213,"medal":null,"category":"II","lines":159,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"multiclass_calibration_method":"'vector'","calibration_lambda":"0.001","average_logits":"False","enable_nnls":"True","nnls_beta":"1.0","permute_categorical":"True","feat_shuffle_method":"'none'"},"helper_functions":["_rank_column"],"helper_ranges":{"_rank_column":[121,133]},"hook_helpers":{"preprocess":[],"engineer":["_rank_column"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[143,144],"engineer":[147,155],"postprocess":[158,159],"folds":[136,140]},"code":"\"\"\"Intent: drop prev_edu, the one rank the subset data says is hurting.\n\nBoth norm tilts cost the same ~.0011 against 4:4, so the ensemble wants balance, not the stronger\nview. On the ranks: occupations alone .51009, occupations plus prev_edu .51079 -- so prev_edu is\nnegative *in that company*, while all five together reach .50953. Read across those three, the\nparental education pair is what supplies the +.0006 and prev_edu is riding on it. This is the\nsubset that follows: both occupations, both parents' education, no prev_edu. Baseline .50953.\n\nFive ordinal ranks the table cannot derive, and a TabFM stripped of its synthetic features.\n\nTwo things moved the score on this task, and they point the same way.\n\n**External order.** Mothers_qualification, Fathers_qualification and Previous_qualification are\neducation ladders and Mothers_occupation / Fathers_occupation are skill ladders, but\n`cat_encoder_mode='appearance'` hands \"Can't read or write\" and \"Higher Education - Doctorate\" two\nunrelated integers. About 20 of the 28 maternal levels appear fewer than 20 times in a 2212-row\ncontext, so without an order those rows can borrow strength from nobody. Five numeric rank columns,\nmapped by regex from external knowledge and added alongside the untouched strings, are worth .0054\n(.51421 without the occupation pair alone, .51701 without all five). Ranking the rungs evenly\nrather than by years-of-schooling added another .0005: under 'none' normalisation the raw gaps are\nwhat the model sees, and 16 -> 18 -> 21 at the top against 8 -> 8.5 -> 9 in the middle is a claim\nabout distance the data does not support. The 'not completed' half-rungs are merged into the year\nbelow -- whether a rung was finished is still in the string column.\n\n**No synthetic features.** Everything that manufactures new columns loses, and loses consistently:\nsqrt feature crosses and SVD components together cost .0023 (and .0018 / .0015 apiece), a third\nnormalisation .0006, and seven curricular-unit ratios of my own .0035 -- retried after the crosses\ncame off, in case they had only been redundant with them, and still losing. Everything that merely\npermutes what is already there pays: permute_categorical is worth .0031, class_shift .0024.\nfeat_shuffle_method is the exception, a wash either way (.51127 vs .51156), left off.\n\nWhat reaches the posterior: NNLS weights the 8 members on their out-of-fold probabilities (.0011,\nand it does not rescue the synthetic features -- .51384 with them back on), then vector calibration\nfits a per-class scale and bias on the same probabilities (.0020). Between them they make\nsoftmax_temperature inert: 0.75 and 1.2 both lose to the 0.9 default by ~.0005.\n\nAlso rejected: bagging 4 draws at 88% of the rows (.0066 -- with 2212 rows in context, losing 12%\nof them beats anything a 32-member average buys); a class-balanced context (.63474 -- TabFM reads\nthe class prior straight from the rows and the calibration bias, bounded to +/-1, cannot put it\nback); blending a spline-logistic helper fitted on the same fold (.0010 at weight 0.25 -- TabFM\nalready subsumes the linear signal); mixing 1% of the training prior into every row (.0013);\ndropping the three near-constant columns (.0016); collapsing rare levels, flat (.0028) or into\ntheir own rung (.0003); alphabetical category codes (.0016); outlier_threshold 2.5 (.0010) or\n8.0 (.0012); the application phase and course-field groupings, together (.0044) and alone (.0005).\n\nFolds: 2 repeats of stratified 4-fold. The judge's 3 folds put every effect inside the split noise,\nso this scores each row twice on models built from different subsets, and its 2212-row context is\nnearer the 2949 the final fits on. Every number above is measured on these folds.\n\"\"\"\nimport re\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import RepeatedStratifiedKFold\n\nTABFM_KWARGS = {\n    'multiclass_calibration_method': 'vector',\n    'calibration_lambda': 0.001,\n    'average_logits': False,     # required by enable_nnls\n    'enable_nnls': True,\n    'nnls_beta': 1.0,\n    'permute_categorical': True,\n    'feat_shuffle_method': 'none',\n}\n\n# (regex, years-of-schooling equivalent); first match wins, so the specific rules come first\nEDU_RULES = [\n    (r\"doctorate\", 21),\n    (r\"master\", 18),\n    (r\"specialized higher studies\", 17),\n    (r\"bachelor|higher education - degree|degree \\(1st cycle\\)\", 16),\n    (r\"professional higher technical\", 14),\n    (r\"frequency of higher education\", 13),\n    (r\"technological specialization\", 13),\n    (r\"short cycle diploma\", 13),\n    (r\"technical-professional\", 12),\n    (r\"secondary education|12th year of schooling or eq\", 12),\n    (r\"12th year of schooling - not completed\", 11),\n    (r\"general commerce|2nd cycle of the general high school\", 11),\n    (r\"other - 11th year\", 11),\n    (r\"complementary high school course - not concluded\", 10),\n    (r\"complementary high school\", 11),\n    (r\"general course of administration and commerce|supplementary accounting\", 11),\n    (r\"11th year of schooling - not completed\", 10),\n    (r\"10th year of schooling - not completed\", 9),\n    (r\"10th year of schooling\", 10),\n    (r\"9th year of schooling - not completed\", 8),\n    (r\"3rd cycle\", 9),\n    (r\"8th year of schooling\", 8),\n    (r\"7th year\", 7),\n    (r\"2nd cycle\", 6),\n    (r\"1st cycle \\(4th/5th year\\)|basic education 1st cycle\", 4),\n    (r\"can read without\", 2),\n    (r\"can't read or write|cannot read\", 0),\n]\n\n# (regex, ISCO-style skill rank, 9 = managers ... 2 = elementary occupations)\nOCC_RULES = [\n    (r\"representatives of legislative|directors of\", 9),\n    (r\"specialists in intellectual|health professionals|teachers|finance/administration specialists\"\n     r\"|ict specialists\", 8),\n    (r\"intermediate level technicians|technicians|sergeants|finance/statistics\", 7),\n    (r\"administrative staff|administrative support|office workers\", 6),\n    (r\"personal service|personal care|sellers|meal preparation|armed forces\", 5),\n    (r\"unskilled|subsistence|cleaning workers\", 2),\n    (r\"skilled construction|skilled workers|metal workers|electricians|food/craft|craftsmen\"\n     r\"|food/woodworking\", 4),\n    (r\"farmers\", 4),\n    (r\"machine operators|installation and machine|assembly workers|vehicle drivers\", 3),\n    (r\"student\", None),          # a parent still studying is not a rung on this ladder\n]\n\n# source column -> the rank column added beside it. 'Unknown', '(blank)' and 'Other Situation'\n# match no rule and stay NaN, which TabFM handles natively.\nRANKED = [(\"Mothers_qualification\", \"mother_edu\", EDU_RULES),\n          (\"Fathers_qualification\", \"father_edu\", EDU_RULES),\n          (\"Mothers_occupation\", \"mother_occ\", OCC_RULES),\n          (\"Fathers_occupation\", \"father_occ\", OCC_RULES)]\n\n\ndef _rank_column(values, rules):\n  \"\"\"Position on the ladder, evenly spaced. The ladder comes from the rule table rather than from\n  the rows, so every fold -- and the held-out split -- shares one scale.\"\"\"\n  ladder = {v: float(i) for i, v in enumerate(sorted({r for _, r in rules if r is not None}))}\n  cache = {}\n  out = np.empty(len(values))\n  for i, v in enumerate(values):\n    if v not in cache:\n      s = str(v).lower()\n      hit = next((r for pat, r in rules if re.search(pat, s)), None)\n      cache[v] = ladder[hit] if hit is not None else np.nan\n    out[i] = cache[v]\n  return out\n\n\ndef folds(X_train, y_train):\n  \"\"\"2 repeats of stratified 4-fold: every row scored twice, on a 2212-row context.\"\"\"\n  y = np.asarray(y_train).ravel()\n  cv = RepeatedStratifiedKFold(n_splits=4, n_repeats=2, random_state=20260907)\n  return [(tr, va) for tr, va in cv.split(np.zeros(len(y)), y)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  out = []\n  for X in (X_train, X_test):\n    X = X.copy()\n    for src, dst, rules in RANKED:\n      if src in X.columns:\n        X[dst] = _rank_column(np.asarray(X[src], dtype=object), rules)\n    out.append(X)\n  return out[0], out[1]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# students_dropout_and_academic_success — final pipeline\n\nMetric: multiclass log loss, lower is better. 2949 training rows × 1475 test rows per fold,\n8 TabFM estimators. Scored test log loss **0.511122** (mean over the 9 TabArena folds; the\npublished TabFM baseline is 0.50716 plain / 0.505215 ensemble).\n\n## What the pipeline does\n\nFrozen TabFM does all the predicting; the pipeline gives it two things. First, **external\nordinal structure**. Four of the columns — `Mothers_qualification`, `Fathers_qualification`,\n`Mothers_occupation`, `Fathers_occupation` — are ladders (schooling levels, ISCO-style skill\nlevels) that TabFM's categorical encoder turns into unrelated integers, and most of the ~28\nmaternal levels appear only a handful of times in a 2200-row context, so those rows can borrow\nstrength from nobody. `engineer` maps each level through a regex rule table written from outside\nknowledge and adds a numeric rank column beside the untouched string column. The ranks are\n*evenly spaced positions on the ladder*, not years of schooling: under `'none'` normalisation the\nraw gaps are what the model sees, and 16→18→21 at the top against 8→8.5→9 in the middle asserts\na distance the data does not support. Levels matching no rule (`Unknown`, `(blank)`,\n`Other Situation`, and parents recorded as students) stay NaN, which TabFM handles natively.\nSecond, **no synthetic features at all** — feature crosses, SVD components, curricular-unit\nratios and extra normalisations each measured as a loss, while transformations that only permute\nwhat is already there pay off. So `preprocess` and `postprocess` are identity, and the remaining\ngains come from TabFM's own knobs: NNLS weighting of the 8 members on their out-of-fold\nprobabilities plus vector calibration (a per-class scale and bias) on the same probabilities.\n`folds()` overrides the judge's 3-fold CV with 2 repeats of stratified 4-fold, which scores every\nrow twice and puts the context size (2212 rows) nearer the 2949 the final fits on.\n\n## build.sh\n\nNothing to build — `bash final/build.sh` prints nothing and exits 0 in well under a second, with\nno disk cost. The pipeline reads no cache, no embedding and no fitted artifact; the rank tables\nare inline constants in `final/pipeline.py`. Run `python final/run.py` directly.\n\n## Things a reader could get wrong\n\n- `final/build/dtcheck.py` is the only script this run wrote besides the pipeline, and it is a\n  **guard, not a build step**: it asserts that no hook output carries pandas `StringDtype` (the\n  judge's interpreter cannot unpickle it) and writes no files. It must be run from the workspace\n  root, not from `final/`.\n- `TABFM_KWARGS` sets `average_logits: False` because `enable_nnls: True` requires it. The two\n  are not independent knobs.\n- The regex rule tables are order-sensitive — first match wins, so the specific patterns must\n  stay above the general ones (e.g. `12th year of schooling - not completed` before\n  `12th year of schooling or eq`). Reordering them silently changes the encoding.\n- `folds()` affects only the search-time CV. Changing it does not change what `run.py` produces,\n  but every effect size quoted in the pipeline docstring was measured on those folds and is not\n  comparable to a judge 3-fold number.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` and refuses to run if the\n  two differ, so leave the workspace copy as it is.\n","package":[],"derivations":[]},{"id":"superconductivity","name":"superconductivity","short_name":"superconductivity","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":8.951704,"plain_note":null,"n_train":14175,"n_test":7088,"n_folds":9,"thresholds":null,"summary":"Frozen zero-shot TabFM predicts `critical_temp` by in-context learning over the whole training table; everything shipped here is about *how much variety* the eight ensemble members see, because that turned out to be the only lever on this task that moved the score.","score":8.794604,"gain_pct":1.754973,"medal":null,"category":"I","lines":191,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["preprocess","engineer","sample","postprocess"],"tabfm_kwargs":{"n_svd_features":"'sqrt'","norm_methods":"['none', 'power', 'quantile', 'robust']"},"helper_functions":[],"helper_ranges":{},"hook_helpers":{"preprocess":[],"engineer":[],"sample":[],"postprocess":[]},"hook_ranges":{"preprocess":[150,161],"engineer":[164,177],"sample":[144,147],"postprocess":[180,191]},"code":"\"\"\"superconductivity / RMSE (TabArena).  Best: 9.35500 (eval 78), against 9.40996 for the identity.\n\nFour things ship. Three are measured well above the noise; two more are small enough that theory,\nnot the measurement, is why they are here (both are marked below). 9.35916 is the score without the\nlast two, and is the reference every ablation in this file is quoted against.\n\nWhat ships, and what each piece is worth (ablated against its own removal on this exact base):\n  norm_methods = [none, power, quantile, robust]   +0.026   eval 59 vs 56\n  n_svd_features = 'sqrt'                          +0.020   eval 57 vs 56\n  log1p on the non-negative columns with skew>2.5  +0.015   eval 58 vs 56\n  clip to the training target range                        cannot hurt: critical_temp lies inside it\n\nThe two that pay both widen the views the eight ensemble members see, and that is the only lever on\nthis task that ever moved the score. Nothing that touched the data itself survived: TabFM wants\nevery row and every column of this table exactly as it is handed them.\n\n  - Rows are expensive. 9450 -> 6000 context rows cost 0.28 (eval 8); dropping the 174 rows whose\n    label contradicts their exact duplicates cost 0.065 (eval 50); averaging duplicate groups'\n    targets cost 0.08 (eval 12); 9450 mixup rows cost 0.22 (eval 15). Never remove or invent a row.\n    No absolute row cap is set, deliberately: max_num_rows would mean 9450 rows in CV and 14175 in\n    the final, i.e. a different fraction of the data in the two places.\n  - Columns are expensive too. Keeping the top 50 by importance cost 0.038 (eval 29); dropping the\n    ten FusionHeat columns, the weakest property of the eight, cost 0.040 (eval 54).\n  - Added columns lose. 24 domain ratios (eval 6), 10 PCA components (23), a quantile-ranked copy of\n    all 81 (37), a duplicate of the top five (46). A PCA-whitened basis (47) and replacing wtd_X by\n    wtd_X - X (32) both lose too: TabFM reads these raw, collinear columns better than any rotation\n    or contrast of them. Synthetic columns pay only as n_svd_features does, on half the members.\n  - Target-derived columns are toxic, however weak. An out-of-fold ExtraTrees prediction dropped the\n    score to 10.12 -- ExtraTrees' own score (eval 9) -- and out-of-fold chemical-system target means\n    to 12.12 (eval 30), roughly what those means score alone. TabFM abandons the other 81 columns.\n  - The output needs nothing. Shrinking predictions toward the training mean at b=0.95 cost 0.20,\n    and the quadratic through it puts the optimum at b=1.003 (eval 10). Blending in a tree ensemble\n    (ET+RF+HistGB, 9.94 together) is worth 0.0007 at its own optimum (evals 14, 31): the error\n    correlation with TabFM is ~0.93, so there is nothing left to recover. Clipping to each chemical\n    system's observed target range loses -- only 82% of held-out targets fall inside it.\n  - Knobs that lose or do nothing: log1p on the target (eval 4, -0.23), enable_nnls (7, and again on\n    the heterogeneous four-view ensemble, 36), outlier_threshold at 2.5 / 6.0 / 20 (27, 38, 11),\n    permute_categorical with the two count columns as strings (51), extra draws that repeat a\n    quarter of the rows (33). feat_shuffle_method='none' is bit-identical to the default (21), so\n    the key is a no-op in this build -- column order does reach the model (35) but carries no\n    signal, whether reversed (35) or sorted by importance (45).\n  - Two TabFM fits are not two models. The judge fits one TabFM per column of y_train, so handing it\n    [y, sqrt(y)] buys a second fit for free -- the one diversity axis no TABFM_KWARGS reaches. The\n    sqrt fit alone scores 9.42703 and disagrees per fold (better on fold 3, worse on 1 and 2), but\n    the two predictions differ by only 1.4 RMS: correlation 0.989. The quadratic through w=0, 0.4\n    and 1 (evals 60, 63, 62) puts the optimum at w=0.17 and 9.3563, a gain of 0.003 for twice the\n    runtime and a tabfm_corr the audit cannot read.\n    Revisited (evals 77-78). A positive weight on the second fit is not a guess: the optimal weight\n    is positive whenever rho < sigma_raw/sigma_sqrt, and here rho=0.989 against 9.35916/9.42703 =\n    0.9928. So this belongs with the permuted draws -- weakly justified by theory, too small for the\n    measurement to confirm -- rather than with the noise-mined choices. w=0.17 is that optimum, and\n    eval 77 measures it at 9.35628 on one draw against 9.35916, which is the 9.3563 the quadratic\n    predicted, to four decimals. Two independent confirmations of the same small effect.\n    Eval 78 stacks it with the eight permuted draws -- two mechanisms, both weakly positive a priori,\n    acting on different sources of variance -- and gets 9.35500, the two effects landing additively.\n    Eval 79 asks whether a third parameterisation adds a third fit worth having: cbrt(y), milder than\n    the log1p that lost 0.23 on its own and less collinear with raw than sqrt is. Probed at one draw\n    against the 9.35628 two-target reference before paying for it at eight: 9.35585, better by\n    0.0004 on guessed weights (0.10/0.10). Inside the noise, but positive, and for the same reason\n    the second fit is -- so eval 80 paid for it at eight draws: 9.35541, against 9.35500 for two\n    targets. The third fit is redundant; cbrt is too collinear with sqrt to add a new direction.\n    Eval 81 closes a gap in that test: cbrt was only ever measured *beside* sqrt at guessed weights,\n    never as the sole partner at its own optimum. The blend gain is C^2/V, so what matters is how\n    decorrelated the partner is, not how good it is alone -- and cbrt is the less collinear of the\n    two. One draw, w=0.20, against the 9.35628 that sqrt-only scores there: 9.35605. The two\n    partners are interchangeable to within 0.0002, an order of magnitude below the 0.003 spread\n    between realisations of one configuration, so sqrt stays on the strength of eval 78 having\n    actually been measured at eight draws.\n    Eval 83 asks the deployment question rather than a search one: does K=4 give the same answer for\n    half the compute? The K-curve is noise-dominated, so eight draws may be buying runtime and\n    nothing else, and the final's cost scales directly with it.\n  - Which two views get the SVD columns is a real choice, not noise: it is worth 0.016 (eval 61),\n    above the band below. n_svd_features reaches the odd-indexed members, so positions 1 and 3 of\n    norm_methods name them. All six pairings, measured on this base (evals 56, 61, 66-69):\n      power+robust 9.35916, none+power 9.36240, quantile+robust 9.36468, power+quantile 9.36517,\n      none+robust 9.36935, none+quantile 9.37494.\n    Four of the six sit within 0.006 of each other, so what the sweep really says is \"not\n    none+quantile\"; power+robust wins it and is what ships.\n    Eval 70 went one step past the sweep, using an 8-long list to keep a different view in every\n    plain slot while putting power in all four augmented ones, so the SVD columns concentrate on one\n    view instead of two: 9.37405, worse. Spreading them stays better, which is the same answer the\n    rest of this run keeps giving.\n  - Eval 71: does *row* order reach the model? Column order does (eval 35), and if rows do too then\n    several draws of all the rows in different orders are separate fits to average -- ensemble\n    diversity at zero information cost, which is the thing every other attempt at diversity had to\n    pay rows for (evals 8, 33). Three draws, each the full training set, permuted. If TabFM is\n    permutation-invariant over rows the three predictions are identical and the score comes back at\n    9.35916 exactly; anything else means the axis is real.\n    It is real -- the permuted draws give different predictions -- and it is the one lever here that\n    trades nothing away: the draws see identical rows and identical columns, so there is no\n    information cost and no change of bias, only an independent noise term being averaged out.\n    Averaging cannot raise the expected error, so more draws is weakly better a priori.\n    How much it is worth is a different question, and the honest answer is \"barely measurable\":\n      K = 1     9.35916      K = 3     9.35759      K = 8     9.35672      K = 16    9.35880\n    and K=8 again on a second permutation seed (eval 74) gives 9.35981 -- worse than one draw.\n    A 1/K variance model fitted to the first three points predicted an asymptote near 9.3547; K=16\n    then came back above K=8 and the reseed came back above K=1, so that model was fitting noise.\n    Each K is one realisation of a fixed seed. The four multi-draw runs average 9.35823 against\n    9.35916 for the single draw: 0.0009, against a 0.003 spread between realisations of the *same*\n    configuration. So the honest reading is that row-order averaging buys nothing measurable here,\n    and 9.35672 is a favourable realisation rather than a gain.\n    It ships anyway, on the theory rather than the measurement: averaging draws that see identical\n    rows and columns cannot raise the expected error, so K=8 is weakly better than K=1 a priori and\n    the reseed cannot argue otherwise. The price is eight times the fits -- about 72 fold-draws and\n    half an hour for the final, which is affordable. If it were expensive, K=1 would be the call.\n  - Eval 75: log1p only really reaches the members that normalise with 'none' -- the other three\n    views rescale those columns themselves -- and it is worth 0.015, so those two members are\n    carrying it. If that is the mechanism, 'none' deserves more than two slots of eight. An 8-long\n    list gives none x3, power x2, robust x2, quantile x1 while keeping the SVD columns on\n    power+robust, the pairing that won the sweep. Run at one draw against the 9.35916 reference,\n    since draw-averaging is worth nothing measurable and eight times the time.\n    9.35903 against 9.35916: neutral to four decimals. The other direction, none x1 / power x3 /\n    quantile x2 / robust x2, gives 9.36341 (eval 76). So view multiplicity is a flat dimension with\n    at most a mild preference for keeping 'none' at two slots or more, and the balanced four-view\n    list stands. With this the norm_methods space is closed: sets (18-20, 48, 49), lengths (24, 28),\n    the six SVD pairings (56, 61, 66-69), concentration (70) and multiplicity (75, 76).\n  - Scale of the noise: an arbitrary neutral change moves the score by about 0.01, so the log1p\n    threshold anywhere in [1.5, 3.2] (9.362-9.377, non-monotone) is one plateau; 2.5 is the best\n    measured point, not a tuned one. n_feature_crosses sits inside that band too and is dropped --\n    it looked worth 0.013 on one base and -0.003 on this one, and leaving it out halves the runtime.\n    On the shipping base, though, threshold 2.5 does beat 1.5 by 0.020 (eval 65 vs 56), so that one\n    choice is above the band. Eval 65 also reproduced eval 22 to the last digit, being the same\n    configuration: the judge is deterministic and every fold score here is exact, not sampled.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {\n    # Four normalisation views over the eight members instead of the default two, and SVD columns\n    # for the odd-indexed half of them. Both are diversity, which is what this task rewards.\n    \"n_svd_features\": \"sqrt\",\n    \"norm_methods\": [\"none\", \"power\", \"quantile\", \"robust\"],\n}\n\n_Y_LO = 0.0         # critical_temp is a temperature in K: it cannot be negative\n_Y_HI = 200.0\n_LOG_X_SKEW = 2.5   # log1p the non-negative columns more skewed than this (decided on X_train)\n_ID_COLS = (\"row_id\",)\n_W_SQRT, _W_CBRT = 0.17, 0.00   # weights on the reshaped-target fits; the rest goes to the raw fit\n_PERM_SEED = 0      # seed for the row permutations\n_DRAWS = 4          # fits of the whole training set, in different row orders, averaged by the judge\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  rng = np.random.default_rng(_PERM_SEED)\n  return [np.arange(n)] + [rng.permutation(n) for _ in range(_DRAWS - 1)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  if _W_SQRT or _W_CBRT:\n    # Extra target columns mean the judge fits one TabFM per column: further, partly decorrelated\n    # fits of the same model on the same rows, which no TABFM_KWARGS can buy.\n    y = np.maximum(np.asarray(y_train, dtype=np.float64).ravel(), 0.0)\n    cols = {\"raw\": y}\n    if _W_SQRT:\n      cols[\"sqrt\"] = np.sqrt(y)\n    if _W_CBRT:\n      cols[\"cbrt\"] = np.cbrt(y)\n    y_train = pd.DataFrame(cols, index=X_train.index)\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  # Nine columns -- seven of the ten FusionHeat statistics, plus wtd_range_Density and\n  # wtd_gmean_ThermalConductivity -- run over four orders of magnitude with almost all their mass\n  # near zero. The members using norm_methods='none' see a spike and a long tail that the z-score\n  # clipping then flattens; log1p makes them readable and leaves their ordering untouched.\n  Xtr, Xte = X_train.copy(), X_test.copy()\n  for c in Xtr.columns:\n    col = Xtr[c]\n    if c in _ID_COLS or not pd.api.types.is_numeric_dtype(col):\n      continue\n    if col.min() >= 0 and float(col.skew()) > _LOG_X_SKEW:\n      Xtr[c] = np.log1p(col)\n      Xte[c] = np.log1p(Xte[c].clip(lower=0))\n  return Xtr, Xte\n\n\ndef postprocess(pred, y_orig, X_test):\n  # The true target lies inside the training range, so clipping to it cannot raise the RMSE.\n  y = y_orig.iloc[:, 0] if isinstance(y_orig, pd.DataFrame) else y_orig\n  if _W_SQRT or _W_CBRT:\n    out = (1.0 - _W_SQRT - _W_CBRT) * pred[\"raw\"]\n    if _W_SQRT:\n      out = out + _W_SQRT * pred[\"sqrt\"].clip(lower=0.0) ** 2\n    if _W_CBRT:\n      out = out + _W_CBRT * pred[\"cbrt\"].clip(lower=0.0) ** 3\n    pred = out\n  lo, hi = max(_Y_LO, float(np.min(y))), min(_Y_HI, float(np.max(y)))\n  return pred.clip(lower=lo, upper=hi)\n","readme":"# superconductivity — TabFM pipeline (RMSE, lower is better)\n\n## What the pipeline does\n\nFrozen zero-shot TabFM predicts `critical_temp` by in-context learning over the whole training\ntable; everything shipped here is about *how much variety* the eight ensemble members see, because\nthat turned out to be the only lever on this task that moved the score. No row is ever dropped,\nresampled, deduplicated or synthesised, and no column is added, selected or rotated — a long list of\nablations in the pipeline's docstring records that each of those cost between 0.03 and 0.28 RMSE.\n\nFour things ship:\n\n- **Four normalisation views** (`none`, `power`, `quantile`, `robust`) spread across the eight\n  members instead of TabFM's default two, with `n_svd_features=\"sqrt\"` adding SVD columns to the\n  odd-indexed half — i.e. to the `power` and `robust` views, the pairing that won a six-way sweep.\n- **`log1p` on the non-negative columns with skew > 2.5** (nine of the 81 — mostly the FusionHeat\n  statistics), which spread over four orders of magnitude with nearly all their mass near zero. This\n  mainly helps the members that normalise with `none`, which otherwise see a spike plus a long tail\n  that z-score clipping flattens.\n- **Row-order draws.** TabFM is *not* permutation-invariant over the context rows, so the pipeline\n  hands the judge four index orderings of the full training set (identity plus three seeded\n  permutations). The draws see identical rows and identical columns, so averaging them costs no\n  information and cannot raise the expected error. Measured, the gain is ~0.001 — inside the noise;\n  it ships on the argument, not the measurement.\n- **A second target parameterisation.** The judge fits one TabFM per column of `y_train`, so\n  `preprocess` passes `[y, sqrt(y)]`; `postprocess` squares the second prediction back and blends at\n  `0.17`, then clips to the training target range. The two fits correlate 0.989, below the\n  `sigma_raw/sigma_sqrt = 0.993` break-even, so a positive weight is a priori right; measured, it is\n  worth ~0.003.\n\nScored result: **8.7946 mean RMSE over the 9 TabArena folds**, against 8.9517 for the plain TabFM\nbaseline and 8.9176 for the ensemble baseline (search CV: 9.35488).\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no files — it only transforms the DataFrames the judge passes to its\nfour hooks — so `final/build.sh` is a comment and `exit 0`. It runs in under a second and needs no\ndisk. `final/build/` is empty for the same reason: the run wrote no helper scripts, every experiment\nwas an edit to `pipeline.py` followed by `python judge.py val`.\n\n    bash final/build.sh && python final/run.py     # writes final/submission.csv\n\n## Things a reader could get wrong\n\n- **`_DRAWS = 4`, not 8.** The docstring's long argument for row-order averaging was written when\n  K=8 was current; eval 83 asked whether K=4 buys the same answer for half the compute, and 4 is what\n  was scored on the test split. The K-curve is noise-dominated (9.3572–9.3598 across K=1, 3, 8, 16),\n  so this is a runtime choice, not a quality regression.\n- **`_W_CBRT = 0.00`.** The cbrt target column is wired up but switched off — evals 79–81 found it\n  too collinear with sqrt to add a third direction. Setting it non-zero costs another full TabFM fit.\n- **No `max_num_rows`.** Deliberate: a row cap would mean 9450 context rows in 3-fold CV but 14175 in\n  the final, i.e. a different fraction of the data in the two places. The table is small enough to be\n  used whole under the judge's 65536-row default.\n- **Runtime is dominated by prediction, not fitting.** The scored final took ~37 min for 9 folds:\n  ~167 s of fit against ~2014 s of predict, since each of the 4 draws × 8 members re-attends over\n  the full context for every test chunk. Halving `_DRAWS` roughly halves the wall clock.\n- **The numbers quoted in the docstring's ablation list are CV scores** from the 3-fold search on\n  fold 0's training split, on a ~9.36 scale. They are not comparable to the 8.79 test figure above,\n  which is the mean over 9 TabArena folds with more training rows.\n","package":[],"derivations":[]},{"id":"taiwanese_bankruptcy_prediction","name":"taiwanese_bankruptcy_prediction","short_name":"taiwanese_bankruptcy_prediction","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.050296,"plain_note":null,"n_train":4546,"n_test":2273,"n_folds":9,"thresholds":null,"summary":"TabFM makes the prediction; the pipeline is about what it gets to read. `engineer` appends 14 combinations of the raw financial ratios to the 94 originals — mostly *gaps* between pairs of near-duplicate readings (the three ROA variants, the two gross margins, the two net-value-per-share columns, pre- vs after-tax interest), because those pairs correlate above 0.999 and a per-column rank transform provably cannot…","score":0.045872,"gain_pct":8.795928,"medal":null,"category":"II","lines":243,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile', 'robust']"},"helper_functions":["_add_features","_importance","_stash_aux"],"helper_ranges":{"_add_features":[145,172],"_importance":[175,184],"_stash_aux":[211,227]},"hook_helpers":{"preprocess":[],"engineer":["_add_features","_importance","_stash_aux"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[141,142],"engineer":[187,208],"postprocess":[230,243],"folds":[129,138]},"code":"\"\"\"Taiwanese bankruptcy prediction -- 1-AUC, lower is better. 4546 rows x 94 columns, 3.2% positive.\n\nWHAT THIS PIPELINE DOES, and why each part is there\n  1. `engineer` builds 14 combinations of the raw ratios and appends them to the 94 originals.\n  2. A random forest fitted on the fold's own training rows ranks all 108; the top 52 are kept.\n  3. Those 52 are mapped to gaussian ranks by one QuantileTransformer fitted on the training and\n     test rows pooled. TabFM sees that.\n  4. `postprocess` rank-averages an ExtraTrees fitted on the same training rows into TabFM's\n     ranking at weight 0.12. TabFM carries the other 88% and the ranking stays 0.998-correlated\n     with its raw output.\nCV 0.05349 against 0.05806 for the identity pipeline, on 9 folds (RepeatedStratifiedKFold 3x3,\nfolds_sig 28cca862), which mirror the 9 TabArena folds the final is scored on. The order the\nengineered columns are built in is load-bearing to about 0.0003: it decides ties in the importance\nranking and so which columns sit either side of the cut. Eval 67 is the same pipeline with them\nsorted by kind and scores 0.05375; this is the order that was measured.\n\nFINAL. norm_methods keeps 'none' (eval 71, best at 0.05338): that key was set at eval 20 against\nraw 1e9-scale columns, and once every column arrives as a gaussian rank 'none' is the member that\nleaves the good representation alone. TabFM's own default ['none','power'] ties it exactly\n(eval 72, 0.05339); the four-method list ships because it spreads the final's 32 members over more\nviews for the same score. K was re-read against that member mix and stays at 52 (50 -> 0.05360,\n54 -> 0.05371). The candidate pool is saturated: reading the kept gaps as ratios rather than\ndifferences cost 0.0008 (eval 69), which is the fourth batch of additions in a row to lose.\n\nLAST ROUND (evals 76-81), all against the shipped 0.05338. Every one of the six ties or loses, and\nbetween them they close the four dimensions that were still open:\n  76 pooled rank to uniform rather than normal                  0.05364  normal, and this one moved\n     -- eval 60 called it an exact tie, but that was before 'none' joined the cycle and gave two\n     members the transform's output to read literally. A knob's reading expires when the thing it\n     interacts with changes.\n  77 outlier_threshold=3.0 (winsorise the outer 0.27%)          0.05346  tie\n  78 norm_methods=['none'], all 8 members                       0.05359  the other three methods\n     do contribute a little, even though moving 'none' from 2/8 to 4/8 (eval 72) changed nothing\n  79 rank only the |skew|>2 columns, standardise the rest       0.05347  tie. Ranking discards\n     spacing and TabFM embeds numbers, so this should have recovered something on the well-behaved\n     columns. It did not: the rank carries essentially all these columns have.\n  80 blend weight 0.18                                          0.05341  tie; 0.12 kept\n  81 mean rank of the three importance seeds, not mean gini     0.05385  worse -- the levels carry\n     information the ranks throw away, even though the cut is where a single seed's spike does the\n     most damage\n\n  eval 82 blend in probit space instead of rank space           0.05329  <- BEST, and the last\n          real finding. In rank space a disagreement between rank 10 and rank 200 counts the same\n          as one between 700 and 890; only the first kind is about rows that might be bankrupt.\n          Probit stretches the tails, so the blend is decided where the 3% live.\n\n  Four follow-ups, all ties or worse, which between them say the probit result is about the\n  geometry of the combination and nothing else:\n  eval 83 weight 0.20 in the new geometry                       0.05331  tie; 0.12 kept\n  eval 84 TabFM's standardised logit in place of its rank       0.05331  tie -- once its ordering\n          is fixed, TabFM's confidence adds nothing\n  eval 85 selection forest with min_samples_leaf=1              0.05397  worse; leaf=3 kept. At 98\n          positives, letting splits isolate single bankruptcies makes the ranking worse, not finer\n  eval 86 clip the partner's probit to +-2, leave TabFM's alone 0.05331  tie -- the weaker input\n          having the loudest voice in the tails was not, after all, costing anything\n\nINTENT (eval 87): another reading that expired the same way eval 76's did. The pooled transform is\nbuilt from 1000 knots over 6062 rows and interpolates between them, so neighbouring ranks get\npulled together -- which matters most for the ten gap columns, whose whole content sits inside a\nfew adjacent ranks. Eval 66 measured a knot-per-row map as an exact tie, but that was before\n'none' joined the cycle: back then all four members re-ranked the output and washed the\ninterpolation error out. Two members now read it literally.\n\nTHE THREE THINGS THAT MATTERED, and the reasoning behind each\n  Representation (eval 42, -0.0007). Every column is min-max scaled over the original dataset:\n  21 of them are bimodal with mass at 1e9, the rest are squeezed into a sliver of [0,1]. TabFM\n  normalises the context and applies that normaliser to the queries, so a map estimated on 3030\n  rows is what the 1516 query rows get. Fitting one rank-to-normal map on both sets pooled --\n  `engineer` sees both frames and no labels, so this is available and costs nothing -- gave the\n  first real gain, and it is what made the two below possible.\n\n  Gap columns (eval 47, -0.0010 paired, std 0.0007, 8 of 9 folds). Nine pairs in this table\n  correlate above 0.999: the three ROA variants, the three gross margins, the three\n  net-value-per-share readings, pre- vs after-tax interest. The levels are redundant; the\n  differences between them are the one thing a per-column rank transform provably cannot\n  reconstruct, because both marginals are almost the same and the gap is not a function of either\n  rank. Evals 48/51/52 then tried 22, 9 and 6 more combinations and every batch lost. Eval 51 is\n  the one that explains the rest: the nine additions with the *highest* univariate AUC (0.83-0.89,\n  the band of the strongest raw columns) were the worst of the lot, because ROA-over-debt and\n  friends are near-monotone restatements of columns already present -- they evict a gap column and\n  return nothing. Strength of a candidate is the wrong criterion; orthogonality to a rank\n  transform is the right one.\n\n  Selection (evals 5, 44, 54, 62). 52 of 108, refitted inside each fold. The cut is sharp on one\n  side (K=42 costs 0.0021) and gentle on the other (K=70 costs 0.0010), with 50/52/55 within\n  0.0003 of each other. Note the interaction with the representation: K=60 lost 0.0002 to K=40 on\n  raw columns and beat it by 0.0001 once they were gaussianised, i.e. part of what the selection\n  was doing was compensating for columns TabFM could not read.\n\nWHAT DID NOT WORK, grouped, so the negative space is legible\n  Ensembling. Three draws each dropping a different 5% of the negatives changed the score by\n  0.00003 (eval 25) -- averaging three 8-member ensembles is worth nothing here, so what remains\n  is bias, not variance, and that ruled out the whole family: per-member row subsampling (eval 13),\n  NNLS member weights (evals 8, 36), probability instead of logit averaging (eval 12), turning off\n  class shift (eval 26) or feature shuffling (eval 40).\n  Synthetic features. Feature crosses refused three times (evals 4, 32, 57) and SVD twice\n  (evals 4, 46), including after the columns were gaussianised, when both should have been at\n  their most useful.\n  Class balance. The context is 3.2% positive and every attempt to change that lost: four\n  balanced draws (eval 10, +0.0011), positives repeated three times (eval 14, +0.0124).\n  Context pruning. Dropping the 2% of negatives that look most bankrupt cost 0.0015 (eval 38) and\n  dropping the 30% that look least bankrupt cost 0.0012 (eval 39) -- the hard negatives define the\n  boundary and the easy ones still carry the base rate.\n  Stacking as a column. Feeding the tree score to TabFM as a feature (OOF for the context,\n  full-fit for the queries) cost 0.0074 (eval 17): TabFM leans on the column and the two marginals\n  do not match. As an output blend the same model is worth 0.0002-0.0007.\n  Aggregates across columns. An oriented row profile -- mean, dispersion, count below -1 sigma --\n  is information TabFM structurally cannot build, and it still cost 0.0017 (eval 58).\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  postprocess(pred, y_orig, X_test)     -> pred\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]\n\"\"\"\nimport numpy as np\nfrom scipy.stats import norm as _NORM, rankdata\nfrom sklearn.ensemble import ExtraTreesClassifier, RandomForestClassifier\nfrom sklearn.model_selection import RepeatedStratifiedKFold\nfrom sklearn.preprocessing import QuantileTransformer\n\nTABFM_KWARGS = {'norm_methods': ['none', 'power', 'quantile', 'robust']}\n\nTOP_K = 52            # columns handed to TabFM, chosen inside each fold\nAUX_W = 0.12          # ExtraTrees' share of the final ranking\nAUX_FILE = '.aux_pred.npy'\nID_COLS = ('row_id',)   # present in the final's frames, absent in val's; the judge drops it\n\n\ndef folds(X_train, y_train):\n  \"\"\"Nine folds with the geometry of the nine the final is scored on: 2/3 train, 1/3 held out.\n\n  The judge's default 3-fold left a 0.0086 standard error on the mean, which is larger than\n  anything measured here; three repeats cut the split noise without changing the train size the\n  score describes.\n  \"\"\"\n  y = np.asarray(y_train).ravel()\n  cv = RepeatedStratifiedKFold(n_splits=3, n_repeats=3, random_state=20260908)\n  return [(tr, va) for tr, va in cv.split(np.zeros(len(y)), y)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _add_features(X):\n  \"\"\"Candidates for the selection: gaps between near-duplicate readings, and a few ratios.\n\n  The gaps are the point. Nine pairs of columns here correlate above 0.999, so a rank transform\n  gives TabFM two almost identical marginals and no way back to the difference between them.\n  \"\"\"\n  d = X['Debt_Ratio_Percent']\n  return X.assign(\n      roa_x_debt=X['Net_Income_to_Total_Assets'] * (1.0 - d),\n      ni_minus_bd=X['Net_Income_to_Total_Assets'] - X['Borrowing_Dependency'],\n      eps_over_debt=X['Persistent_EPS_Last_4_Seasons'] / (d + 1e-6),\n      altman=(1.2 * X['Working_Capital_to_Total_Assets']\n              + 1.4 * X['Retained_Earnings_to_Total_Assets']\n              + 3.3 * X['Net_Income_to_Total_Assets']\n              + 0.6 * X['Equity_to_Liability']\n              + 1.0 * X['Total_Asset_Turnover']),\n      cf_cover=X['Cash_Flow_to_Liability'] / (X['Current_Liability_to_Assets'] + 1e-6),\n      liq=X['Quick_Ratio'] - X['Current_Ratio'],\n      roa_spread=X['ROA_C_Before_Interest_Depreciation'] - X['ROA_A_Before_Interest_After_Tax'],\n      roa_spread2=(X['ROA_B_Before_Interest_Depreciation_After_Tax']\n                   - X['ROA_A_Before_Interest_After_Tax']),\n      margin_gap=X['Operating_Gross_Margin'] - X['Realized_Sales_Gross_Margin'],\n      pershare_gap=X['Net_Profit_Before_Tax_Per_Share'] - X['Operating_Profit_Per_Share'],\n      nv_gap=X['Net_Value_Per_Share_A'] - X['Net_Value_Per_Share_C'],\n      int_rate_gap=X['PreTax_Net_Interest_Rate'] - X['AfterTax_Net_Interest_Rate'],\n      cont_gap=X['Continuous_Interest_Rate_After_Tax'] - X['AfterTax_Net_Interest_Rate'],\n      te_ratio=X['Total_Income_to_Total_Expense'] / (X['Total_Expense_to_Assets'] + 1e-6),\n      wc_eq=X['Working_Capital_to_Equity'] - X['Current_Liabilities_to_Equity'])\n\n\ndef _importance(X, y, seeds=(0, 1, 2)):\n  \"\"\"Averaged RF gini importance -- one seed is noisy at 98 positives, six were no better.\"\"\"\n  imp = np.zeros(X.shape[1])\n  for s in seeds:\n    rf = RandomForestClassifier(n_estimators=300, min_samples_leaf=3,\n                                class_weight='balanced_subsample', max_features='sqrt',\n                                random_state=s, n_jobs=8)\n    rf.fit(X.values, y)\n    imp += rf.feature_importances_\n  return imp / len(seeds)\n\n\ndef engineer(X_train, y_train, X_test):\n  ids = [c for c in X_train.columns if c in ID_COLS]\n  base = [c for c in X_train.columns if c not in ID_COLS]\n  X_train = X_train[ids].join(_add_features(X_train[base].astype(float)))\n  X_test = X_test[ids].join(_add_features(X_test[base].astype(float)))\n  feats = [c for c in X_train.columns if c not in ID_COLS]\n\n  y = (np.asarray(y_train).ravel() == np.unique(np.asarray(y_train).ravel())[-1]).astype(int)\n  imp = _importance(X_train[feats].astype(float).fillna(0.0), y)   # fold's own rows: no leakage\n  keep = [feats[i] for i in sorted(np.argsort(-imp)[:TOP_K])]\n  _stash_aux(X_train[feats].astype(float), y, X_test[feats].astype(float))\n\n  # One rank-to-normal map per column, fitted on the training and test rows pooled: no labels are\n  # involved, and it is the only way both sides arrive under the same transform (TabFM fits its\n  # normalisers on the context alone).\n  A, B = X_train[keep].astype(float).copy(), X_test[keep].astype(float).copy()\n  qt = QuantileTransformer(output_distribution='normal', random_state=0,\n                           n_quantiles=len(A) + len(B))\n  qt.fit(np.vstack([A.to_numpy(), B.to_numpy()]))\n  A[:] = qt.transform(A.to_numpy())     # in place: a rebuilt frame would carry an arrow-backed\n  B[:] = qt.transform(B.to_numpy())     # column Index, which the judge process cannot unpickle\n  return X_train[ids].join(A), X_test[ids].join(B)\n\n\ndef _stash_aux(Xtr, y, Xte):\n  \"\"\"ExtraTrees scores for the test rows, fitted on this fold's training rows only.\n\n  postprocess() is handed pred / y_orig / X_test but not X_train, and each hook stage runs in its\n  own subprocess, so the workspace is the only way to carry a fitted model's output across.\n  The forest reads all 108 columns rather than the 52 TabFM gets: it wants the width TabFM does\n  not (eval 27), and the blend is paid for being unlike TabFM rather than for being strong -- a\n  four-model aux with a better standalone score blended worse (eval 21).\n  \"\"\"\n  A, B = Xtr.to_numpy(dtype=float), Xte.to_numpy(dtype=float)\n  if len(np.unique(y)) < 2:                      # `judge.py check` slices can be single-class\n    np.save(AUX_FILE, np.zeros(len(B)))\n    return\n  et = ExtraTreesClassifier(n_estimators=600, min_samples_leaf=2, max_features='sqrt',\n                            class_weight='balanced_subsample', random_state=0, n_jobs=8)\n  et.fit(A, y)\n  np.save(AUX_FILE, rankdata(et.predict_proba(B)[:, 1]) / len(B))\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Rank-average the ExtraTrees score into TabFM's ranking at AUX_W.\"\"\"\n  aux = np.load(AUX_FILE)\n  if pred.shape[1] != 2 or not aux.any():\n    return pred\n  out = pred.copy()\n  pos = out.columns[-1]\n  n = len(out)\n  probit = lambda u: _NORM.ppf(np.clip(u, 0.5 / n, 1.0 - 0.5 / n))\n  blend = (1.0 - AUX_W) * probit(rankdata(out[pos].to_numpy()) / n) + AUX_W * probit(aux)\n  blend = rankdata(blend) / n\n  out[pos] = blend\n  out[out.columns[0]] = 1.0 - blend\n  return out\n","readme":"# Taiwanese bankruptcy prediction — final pipeline\n\n## What it does\n\nTabFM makes the prediction; the pipeline is about what it gets to read. `engineer` appends 14\ncombinations of the raw financial ratios to the 94 originals — mostly *gaps* between pairs of\nnear-duplicate readings (the three ROA variants, the two gross margins, the two net-value-per-share\ncolumns, pre- vs after-tax interest), because those pairs correlate above 0.999 and a per-column\nrank transform provably cannot reconstruct the difference between them. A random forest fitted on\nthe fold's own training rows (gini importance averaged over three seeds, `min_samples_leaf=3`)\nranks all 108 columns and the top 52 are kept. Those 52 are mapped to gaussian ranks by a single\n`QuantileTransformer` fitted on the training and test rows pooled, with one knot per row — pooling\nis legal here (`engineer` sees both frames and no labels) and it is what makes the raw columns,\n21 of which are bimodal with mass at 1e9, readable at all. TabFM then runs as a 32-member ensemble\nover `norm_methods=['none','power','quantile','robust']`. Finally `postprocess` blends an\nExtraTrees classifier — fitted on the same fold's rows but reading all 108 columns, i.e. paid for\nbeing unlike TabFM rather than for being strong — into TabFM's ranking at weight 0.12, in probit\nspace rather than rank space so the blend is decided in the tails where the 3.2% of bankruptcies\nlive. The result stays ~0.998-correlated with TabFM's raw ordering.\n\nCV: 0.05329 (1 − AUC, lower is better) over 9 folds, RepeatedStratifiedKFold 3×3, against 0.05806\nfor the identity pipeline. `folds()` uses 3×3 rather than the judge's default 3-fold because a\nplain 3-fold left a 0.0086 standard error on the mean — larger than every effect measured in the\nrun.\n\n## What build.sh builds\n\nNothing. The pipeline reads no precomputed cache: the one file it names, `.aux_pred.npy`, is\nwritten by `engineer` and read back by `postprocess` in the next hook subprocess. `build.sh` says\nso and exits 0 — it takes no time and no disk. Just run:\n\n```\ncd <this workspace> && bash final/build.sh && python final/run.py\n```\n\n`run.py` needs the competition data in `data/` and a GPU for TabFM; the full pass is one\n32-estimator TabFM run over 3030 context rows, so it is minutes, not hours.\n\n## Things a reader would otherwise get wrong\n\n- **The order of the `assign` calls in `_add_features` is load-bearing**, to about 0.0003. It\n  decides ties in the importance ranking and therefore which columns sit either side of the K=52\n  cut. Eval 67 is the identical pipeline with the same 14 columns sorted by kind, and it scores\n  0.05375. Do not tidy them.\n- **`A[:] = qt.transform(...)` assigns in place on purpose.** Rebuilding the frame would give it an\n  arrow-backed column Index that the judge's hook subprocess cannot unpickle.\n- **`norm_methods` keeping `'none'` is not an oversight.** Once every column arrives as a gaussian\n  rank, `'none'` is the member that leaves the good representation alone; TabFM's own default\n  `['none','power']` ties it exactly, and the four-method list ships only because it spreads the\n  32 members over more views for the same score.\n- **The blend weight and the ExtraTrees are secondary.** 0.12 → 0.18 → 0.20 are all ties. The\n  geometry (probit, not rank) is what was worth 0.0001–0.0002, not the weight.\n- **Class rebalancing hurts here.** The context is 3.2% positive and every attempt to change that\n  lost: balanced draws +0.0011, repeating positives +0.0124, dropping hard negatives +0.0015.\n  Likewise stacking the tree score in as a *feature* cost 0.0074; only the output blend works.\n- `pipeline.py` in the workspace root and `final/pipeline.py` are the same file (`history/\n  pipeline_087.py`); `run.py` refuses to proceed if they ever diverge.\n","package":[],"derivations":[]},{"id":"website_phishing","name":"website_phishing","short_name":"website_phishing","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.210781,"plain_note":null,"n_train":902,"n_test":451,"n_folds":30,"thresholds":null,"summary":"`website_phishing` is a tiny table: 902 training rows, 451 test rows, nine categorical indicators that each take one of three levels (`Phishy` / `Suspicious` / `Legitimate`), and a three-class target scored by multiclass log loss.","score":0.206749,"gain_pct":1.912886,"medal":null,"category":"II","lines":63,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","average_logits":"False","multiclass_calibration_method":"'vector'","calibration_lambda":"0.0","enable_nnls":"True","nnls_beta":"0.25","softmax_temperature":"0.85"},"helper_functions":[],"helper_ranges":{},"hook_helpers":{"preprocess":[],"engineer":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[46,47],"engineer":[50,59],"postprocess":[62,63],"folds":[40,43]},"code":"\"\"\"website_phishing: 9 three-level categorical indicators, 902 rows, 3-class log loss.\n\nIntent for this val: the screened configuration, and honest folds to select it on. Ordinal codes\nfor the indicators (that is what lets TabFM's numeric feature crosses fire at all), its out-of-fold\nvector calibration with no ridge on the calibration parameters, NNLS member weights shrunk most of\nthe way back to uniform, and a slightly cooler softmax.\n\nRESULT 4 added a fixed outer calibration map in postprocess and scored 0.21212, but that gain was\nnot real. Fitting the map on one 3x10-fold split and applying it to a second split looked like\n-0.0006, yet both splits score the *same* 902 rows, so that test is in-sample. Refitting the map on\nhalf the rows and scoring the other half -- the only row-disjoint test available -- costs +0.007\n(and +0.010 for a full 3x3 matrix map): six to twelve parameters read off 902 rows is all sampling\nnoise. It is dropped, and `folds` moves to seed 1 so the final is selected over evaluations that do\nnot carry it.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]   OPTIONAL\n  postprocess(pred, y_orig, X_test)     -> pred\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]            OPTIONAL\n\"\"\"\nimport numpy as np\nfrom sklearn.model_selection import RepeatedStratifiedKFold\n\n# Every indicator takes one of these three levels; the level names re-use the target's class names\n# as codes, and they carry a natural low/middle/high order (checked against the two other orders).\nORD = {\"Phishy\": -1.0, \"Suspicious\": 0.0, \"Legitimate\": 1.0}\n\nTABFM_KWARGS = {\n    \"n_feature_crosses\": \"sqrt\",              # numeric-only, hence the ordinal codes\n    \"average_logits\": False,                  # required by both the calibrator and NNLS\n    \"multiclass_calibration_method\": \"vector\",\n    \"calibration_lambda\": 0.0,\n    \"enable_nnls\": True,\n    \"nnls_beta\": 0.25,\n    \"softmax_temperature\": 0.85,\n}\n\n\ndef folds(X_train, y_train):\n  \"\"\"3 x 10-fold: each fit sees 811 of the 902 rows, close to the 902 the final's folds give it,\n  and the mean over 30 folds is quiet enough to read differences of ~0.001.\"\"\"\n  return list(RepeatedStratifiedKFold(n_splits=10, n_repeats=3, random_state=1).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  cols = [c for c in X_train.columns if c != \"row_id\"]\n\n  def enc(X):\n    out = X.copy()\n    for c in cols:\n      out[c] = out[c].map(ORD).astype(float)\n    return out\n\n  return enc(X_train), enc(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# website_phishing — final pipeline\n\n## What it does\n\n`website_phishing` is a tiny table: 902 training rows, 451 test rows, nine categorical indicators\nthat each take one of three levels (`Phishy` / `Suspicious` / `Legitimate`), and a three-class\ntarget scored by multiclass log loss. With that little data the useful lever is not feature\nengineering but *representation* plus TabFM's own ensembling.\n\nThe pipeline does one thing to the features: it recodes every indicator as an **ordinal number**\n(`Phishy = -1`, `Suspicious = 0`, `Legitimate = 1`) instead of leaving it as a string category. The\nlevels have a natural low/middle/high order — the other two orderings were tried and were worse —\nand, more importantly, TabFM's automatic feature crosses only fire on numeric columns, so the\nordinal coding is what lets it build interactions between the nine indicators at all. Everything\nelse is TabFM configuration: per-member logits (not averaged probabilities) so that a downstream\ncombiner can see them, out-of-fold **vector calibration** of the multiclass logits with no ridge\npenalty on the calibration parameters, **NNLS** ensemble-member weights shrunk most of the way back\nto uniform (`nnls_beta = 0.25`), and a slightly cool softmax (`temperature = 0.85`). `preprocess`\nand `postprocess` are identity.\n\n`folds()` is overridden to 3×10-fold repeated stratified CV (seed 1). Ten folds means each fit sees\n811 of the 902 rows, close to what the final gets, and averaging 30 folds is quiet enough to read\ndifferences around 0.001 — a 3-fold default on 902 rows is not.\n\nOne thing deliberately *not* in the pipeline: an earlier revision added a fixed outer calibration\nmap in `postprocess` and scored 0.21212, but that gain was an artifact. Both CV splits used to\n\"validate\" it score the same 902 rows, so the check was in-sample; the only row-disjoint test\navailable (fit the map on half the rows, score the other half) cost +0.007, and +0.010 for a full\n3×3 matrix map. Six to twelve parameters read off 902 rows is sampling noise. It was dropped, and\nthe fold seed was moved so the final would be selected over evaluations that did not carry it.\n\nScored result on the held-out split: **log loss 0.2067** (30-fold TabArena mean 0.2062, against\npublished TabFM baselines of 0.2108 plain / 0.2091 ensemble).\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0, and it says so in a comment.\n\nThe pipeline reads no files — no cached features, no fitted artifacts, no auxiliary tables. It\nconsumes only the DataFrames the judge passes to its hooks. The 26 scripts under `final/build/`\n(`v1.py` … `v22.py`, `lab.py`, `bench.py`, `post.py`, `calib.py`) are the offline experiments that\nchose the constants now hard-coded in `TABFM_KWARGS` and `ORD`; they wrote only their own scratch\noutput (`lab_results.jsonl` and similar), which nothing in the pipeline reads. They are kept for the\nrecord, not as build steps.\n\nRuntime: `bash final/build.sh` is instantaneous and needs no disk. `python final/run.py` is the\nwhole cost — roughly a couple of minutes on one GPU for 8 TabFM estimators over a 902-row context —\nand writes a single `final/submission.csv`.\n\n## Things a reader could get wrong\n\n- **`ORD` reuses the target's class names as level names.** The three indicator levels are literally\n  spelled `Phishy`, `Suspicious`, `Legitimate`, the same words as the three target classes. They are\n  unrelated to the label; the mapping is a feature encoding, not leakage.\n- **The `row_id` column is skipped** by `engineer`, on purpose — it is the submission key, not a\n  feature.\n- **`average_logits: False` is load-bearing.** Both the vector calibrator and the NNLS member\n  weighting need per-member logits; flipping it back to `True` silently disables the two settings\n  underneath it.\n- **`folds()` affects selection, not the final fit.** It defines the CV the search was scored on; the\n  final fit uses all 902 training rows.\n- The reported 0.2067 is the TabArena 30-fold protocol's held-out score, not a Kaggle leaderboard\n  number — `data/meta.
