 mnt / (npur + 1.0)\n  df['IncomePerHead'] = inc / (kids + 2.0)\n  df['WebConversion'] = df['NumWebPurchases'] / (df['NumWebVisitsMonth'] + 1.0)\n  for name, col in zip(CATS, MNT):\n    df[name + 'Share'] = df[col] / (mnt + 1.0)\n  df['DealShare'] = df['NumDealsPurchases'] / (npur + 1.0)\n  for name, col in zip(['Web', 'Catalog', 'Store'], NUMP):\n    df[name + 'Share'] = df[col] / (npur + 1.0)\n  df['Tenure'] = ten\n  df['Age'] = 2014.0 - df['Year_Birth']\n  df['SpendPerDay'] = mnt / (ten + 1.0)\n  df['SpendOverIncome'] = mnt / (inc + 1.0)\n  df['RecencyOverTenure'] = df['Recency'] / (ten + 1.0)\n  df['VisitsPerPurchase'] = df['NumWebVisitsMonth'] / (npur + 1.0)\n  for name, col in zip(CATS, MNT):\n    df[name + 'PerPurchase'] = df[col] / (npur + 1.0)\n    df['Log' + name] = np.log1p(df[col].astype('float64'))\n  df['EduOrd'] = [EDU.get(v, 2.0) for v in df['Education'].tolist()]\n  df['HasPartner'] = [PARTNER.get(v, 0.0) for v in df['Marital_Status'].tolist()]\n  df['IsParent'] = (kids \u003e 0).astype('float64')\n  df['Dt_Customer'] = ten\n  return df\n\n\n\ndef engineer(X_train, y_train, X_test):\n  return _expand(X_train), _expand(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Same rows every draw, different order -- the judge fixes random_state, so order is\n  the only thing that makes one draw's members differ from another's (eval 24).\"\"\"\n  n = len(X_train)\n  rng = np.random.default_rng(0)\n  return [np.arange(n)] + [rng.permutation(n) for _ in range(N_DRAWS - 1)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Marketing_Campaign — TabFM pipeline (history/pipeline_056.py)\n\n## What the pipeline does\n\nThe predictor is the frozen TabFM foundation model doing in-context learning over the training rows;\neverything here is about what it gets to see and how its votes are combined. The task is small (1493\ntrain / 747 test rows for the scored split), so no row selection is needed — every training row is\nalways in context. Three things are layered on top of that.\n\n**Feature expansion.** `engineer` widens the 25-ish raw customer columns to ~81 by adding the ratios\nand totals that actually carry the marketing-response signal: total spend and total purchases, the\nper-category spend shares and log-spends, channel shares (web / catalog / store), deal share, web\nconversion (web purchases per visit), spend per purchase, spend over income, income per household\nmember, and a spend-per-day rate. `Dt_Customer` is converted to a tenure in days from 2012-01-01\n(and reused in place of the raw date), `Year_Birth` to an age, and the two categorical columns are\ngiven ordinal encodings (`Education` → 0–4, `Marital_Status` → a has-partner flag). A short list of\nthe strongest columns (`DUP`) is duplicated verbatim. That is deliberate and not a bug: TabFM's\ninternal SVD/feature-cross budget is set as `sqrt(n_columns)`, so widening the table from 64 to 81\ncolumns buys one more component (k: 8 → 9), and paying for it in copies of columns that already\nmatter beat paying for it in new, weaker ones.\n\n**Ensembling by draw.** The judge fixes TabFM's `random_state`, so two ensemble members over the same\nrows in the same order are identical. `sample` therefore returns four index arrays over the *same*\nfull training set — the identity permutation plus three shuffles from a fixed seed — which is what\nmakes the four draws differ at all. Their predictions are averaged.\n\n**Sharpened voting.** `TABFM_KWARGS` averages probabilities rather than logits at\n`softmax_temperature=0.2`, with `n_svd_features` / `n_feature_crosses` at `'sqrt'`, outlier clipping\nat 2.0 σ, and categorical permutation on. The sharp temperature and the extra draws interact: more\nvoters let the temperature go lower before ties stop resolving.\n\nValidation used 5-fold × 6-repeat stratified CV (`folds()`), which is far more stable than the\ndefault 3 folds on a dataset this small — most of the tuning steps were worth less than the fold\nspread otherwise.\n\nScored result: **1-AUC = 0.0616** as the mean over the 30 TabArena folds (published TabFM baselines\non the same folds: 0.0730 plain, 0.0724 ensemble). Search-time CV best was 0.0703.\n\n## What build.sh builds\n\nNothing. `bash final/build.sh` prints one line and exits 0 in well under a second, needs no disk, and\nexists only so the documented `bash final/build.sh \u0026\u0026 python final/run.py` sequence works. The\npipeline has no prerequisites: all four hooks are pure functions of the DataFrames the judge passes\nin, and the run that produced them never wrote a cache, a feature file, or a helper module. (This is\nalso why there is no `final/build/` directory — there were no build scripts to copy into it.)\n\nTo reproduce, you need the competition data in place under `data/` and a GPU with TabFM available;\n`python final/run.py` runs the same `judge.load_task` / `judge.run_pipeline` path used during the\nsearch. `python final/run.py --check` verifies imports and prerequisites without touching TabFM.\n\n## Things a reader could get wrong\n\n- **The duplicated columns in `DUP` are intentional.** Deleting them changes TabFM's `sqrt`-sized\n  SVD/cross budget and costs accuracy; they are not leftover debris.\n- **`sample` is not subsampling.** It returns four permutations of *all* training rows. If you\n  \"simplify\" it to a single `np.arange(n)`, the four ensemble draws collapse into one identical\n  prediction, because the judge pins `random_state`.\n- **`MARITAL` is dead code.** An ordinal marital encoding that lost to the binary `HasPartner` flag;\n  the dict is still defined but never used.\n- **Row counts differ between the run record and TabArena.** `result.json` reports 1493/747 for the\n  search split, but the 30-fold final ran 44800 train / 22400 test rows in total across folds.\n- **Hard-coded dates.** Tenure is measured from 2012-01-01 and age from 2014, matching this\n  dataset's collection window; they are constants, not \"today\".\n- **The docstring at the top of `pipeline.py` describes the *next* experiment** (eval 56's intent),\n  as the search loop required. It is the record of why this configuration was tried, not a\n  description of a pending change."},{"id":"maternal_health_risk","name":"maternal_health_risk","short_name":"maternal_health_risk","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.371068,"plain_note":null,"n_train":676,"n_test":338,"n_folds":30,"thresholds":null,"summary":"676 training rows, six numeric columns (Age, SystolicBP, DiastolicBP, BS, BodyTemp, HeartRate), three risk classes, scored by log loss. The predictor is a stock frozen TabFM with no ensemble knobs set (`TABFM_KWARGS = {}`); all the work is in the feature representation handed to it.","score":0.364813,"gain_pct":1.685675,"medal":null,"category":"I","lines":48,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","postprocess","folds"],"tabfm_kwargs":{},"helper_functions":["_feat"],"helper_ranges":{"_feat":[18,28]},"hook_helpers":{"preprocess":[],"engineer":["_feat"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[14,15],"engineer":[31,32],"postprocess":[35,48],"folds":[8,11]},"code":"import numpy as np\n\nTABFM_KWARGS = {}\n\nDUMP = 'final'\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  return list(RepeatedStratifiedKFold(\n      n_splits=10, n_repeats=8, random_state=1234).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _feat(df):\n  sbp = df[\"SystolicBP\"].astype(float)\n  dbp = df[\"DiastolicBP\"].astype(float)\n  hr = df[\"HeartRate\"].astype(float)\n  d = df.drop(columns=[\"DiastolicBP\"])          # = SystolicBP - PulsePressure\n  d[\"HeartRate\"] = hr.mask(hr \u003c 40, np.nan)     # two rows read 7 bpm\n  d[\"PulsePressure\"] = sbp - dbp\n  d[\"ShockIndex\"] = hr / sbp\n  d[\"BPratio\"] = sbp / dbp\n  d[\"FracPP\"] = (sbp - dbp) / ((sbp + 2 * dbp) / 3.0)\n  return d\n\n\ndef engineer(X_train, y_train, X_test):\n  return _feat(X_train), _feat(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  if DUMP:\n    try:\n      import hashlib, os\n      d = os.path.join(\".dump\", DUMP)\n      os.makedirs(d, exist_ok=True)\n      rid = (X_test[\"row_id\"].to_numpy(dtype=\"int64\") if \"row_id\" in X_test.columns\n             else np.arange(len(X_test), dtype=\"int64\"))\n      np.savez(os.path.join(d, hashlib.sha1(rid.tobytes()).hexdigest()[:12] + \".npz\"),\n               p=pred.to_numpy(dtype=\"float64\"), rid=rid,\n               cols=np.array([str(c) for c in pred.columns]))\n    except Exception:\n      pass\n  return pred\n","readme":"# maternal_health_risk — final pipeline\n\n## What it does\n\n676 training rows, six numeric columns (Age, SystolicBP, DiastolicBP, BS, BodyTemp, HeartRate),\nthree risk classes, scored by log loss. The predictor is a stock frozen TabFM with no ensemble\nknobs set (`TABFM_KWARGS = {}`); all the work is in the feature representation handed to it. Four\nderived circulatory axes are added — pulse pressure (SBP−DBP), shock index (HR/SBP), the SBP/DBP\nratio, and fractional pulse pressure (pulse pressure over mean arterial pressure) — the two rows\nwhose HeartRate reads 7 bpm are blanked to NaN, and the raw DiastolicBP column is dropped because\nit is exactly recoverable from SystolicBP plus the derived axes and only dilutes them. Nothing is\ndone after TabFM: it comes out calibrated (the best global temperature is 1.05, worth 0.0007), and\nblending in RF / ExtraTrees / kNN / logistic out-of-fold predictions, or perturbing the context\nrows in any way, measured worse. The dataset's defining property is that 131 of 676 rows sit in\ngroups sharing a feature vector with disagreeing labels; those disagreements *are* the target\nprobabilities, and TabFM reads them better than an explicit duplicate-group estimator, so the\npipeline leaves them alone.\n\n`folds()` replaces the judge's default 3-fold CV, whose 0.042 fold spread on 676 rows is too coarse\nto rank changes worth 0.005, with `RepeatedStratifiedKFold(10 splits × 8 repeats, seed 1234)`.\n`postprocess` additionally writes each fold's raw probability matrix to `.dump/final/` so that\npost-processing ideas could be scored offline (`final/build/oof.py`) instead of costing an\nevaluation; it does not alter the predictions.\n\n## What build.sh builds\n\nNothing. The pipeline reads no cache, feature store, or precomputed artefact — it is four pure\nhooks over the DataFrames the judge supplies. `final/build.sh` is a comment and `exit 0`; it takes\nno time and no disk. Go straight to:\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader could get wrong\n\n- **`final/build/` is not part of the build.** Those four scripts are search-time tooling:\n  `precheck.py` is a stricter free dry run than `judge.py check` (it reproduces the judge's fold 0\n  including the pickle round-trip and real dtypes), `drive.py` and `drive2.py` rewrite module-level\n  constants of `pipeline.py` and invoke `judge.py val` so several configurations run from one shell\n  call, and `oof.py` rescores the dumped fold probabilities offline. They also expect to live in the\n  workspace root next to `pipeline.py` and `judge.py`, not in `final/build/`, so they will not run\n  in place without being copied up.\n- **`DUMP` has a side effect.** Running the pipeline creates `.dump/final/*.npz` (a few hundred KB\n  at most). It is wrapped in a bare `except: pass`, so a read-only workspace is harmless. Set\n  `DUMP = ''` to switch it off; predictions are identical either way.\n- **The dropped column is not lost information.** `DiastolicBP` is removed only after PulsePressure\n  and friends are computed from it; every norm_method standard-scales each column, so an affine\n  copy of an existing column is invisible to TabFM and a genuinely redundant one mildly hurts.\n- **The score margin is small and the ordering inside the winning family is noise.** On the\n  selection split this pipeline scores 0.37331 log loss against 0.37941 for the identity pipeline;\n  the eight runners-up lie within one paired standard error (0.0013) of it. The −0.005 from the\n  derived-axis family is real, the choice of exactly these four axes was decided by simplicity as\n  much as by the number."},{"id":"miami_housing","name":"miami_housing","short_name":"miami_housing","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":74223.673106,"plain_note":null,"n_train":9184,"n_test":4592,"n_folds":9,"thresholds":null,"summary":"TabFM predicts `SALE_PRC` directly from the Miami housing table; the pipeline never transforms the target and never post-processes the prediction. All of the work is in how the *features* are presented to the in-context model, and in TabFM's own ensemble knobs.","score":71802.210396,"gain_pct":3.262386,"medal":null,"category":"I","lines":46,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","norm_methods":"['quantile', 'quantile_rtdl', 'quantile_rtdl', 'power']","outlier_threshold":"20.0"},"helper_functions":["_log"],"helper_ranges":{"_log":[25,31]},"hook_helpers":{"preprocess":[],"engineer":["_log"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[21,22],"engineer":[37,42],"postprocess":[45,46],"folds":[15,18]},"code":"import numpy as np\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt',\n                # a cycle over members: quantile and quantile_rtdl on the plain (even) members,\n                # quantile_rtdl and power on the crossed (odd) ones. Order is load-bearing.\n                'norm_methods': ['quantile', 'quantile_rtdl', 'quantile_rtdl', 'power'],\n                'outlier_threshold': 20.0}\n\n# every non-negative column: LATITUDE would collapse to a constant and LONGITUDE is negative\nLOGGED = ['LND_SQFOOT', 'TOT_LVG_AREA', 'SPEC_FEAT_VAL', 'RAIL_DIST', 'OCEAN_DIST', 'WATER_DIST',\n          'CNTR_DIST', 'SUBCNTR_DI', 'HWY_DIST', 'age', 'month_sold', 'structure_quality',\n          'avno60plus']\n\n\ndef folds(X_train, y_train):\n  \"\"\"Three repeats of 3-fold: nine splits, each training on 2/3 of the rows like the final does.\"\"\"\n  from sklearn.model_selection import RepeatedKFold\n  return list(RepeatedKFold(n_splits=3, n_repeats=3, random_state=0).split(X_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _log(df):\n  \"\"\"Invisible to the rank-based members, and the whole point for the crossed ones.\"\"\"\n  d = df.copy()\n  for c in LOGGED:\n    if c in d.columns:\n      d[c] = np.log1p(np.maximum(d[c].to_numpy(dtype=float), 0.0))\n  return d\n\n\nSHIFT = 1024.0\n\n\ndef engineer(X_train, y_train, X_test):\n  A, B = _log(X_train), _log(X_test)\n  cols = [c for c in LOGGED if c in A.columns]\n  off = SHIFT * A[cols].std()\n  A[cols], B[cols] = A[cols] + off, B[cols] + off\n  return A, B\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# miami_housing — final pipeline\n\n## What it does\n\nTabFM predicts `SALE_PRC` directly from the Miami housing table; the pipeline never\ntransforms the target and never post-processes the prediction. All of the work is in how\nthe *features* are presented to the in-context model, and in TabFM's own ensemble knobs.\n\nTwo things happen to the features. First, the thirteen columns that are non-negative\n(`LND_SQFOOT`, `TOT_LVG_AREA`, `SPEC_FEAT_VAL`, the five distance columns, `age`,\n`month_sold`, `structure_quality`, `avno60plus`) get `log1p`. `LATITUDE` and `LONGITUDE`\nare deliberately left alone — a log of latitude in this region is effectively a constant,\nand longitude is negative. Second, each logged column is shifted by a constant offset of\n`1024 × std(column)`, the same offset applied to train and test.\n\nThat shift is the non-obvious part, and it is what most of the search converged on. It is\ninvisible to TabFM's rank/quantile-based normalisers — a monotone constant offset does not\nmove a quantile — but it is not invisible to the *feature crosses*, which are products of\nraw columns. Pushing a column far from zero drives its pairwise products toward the\nadditive regime: `(a+s)(b+s)/s² ≈ 1 + (a+b)/s`, so a cross degenerates into a scaled sum\nof its two parents plus a vanishing interaction term. Larger shifts kept helping\nmonotonically across the search (16 → 64 → 256 → 1024) with roughly constant gains per\ndoubling in `log s`, and 1024 is the last rung before float32 precision becomes the\nlimiting factor: at that scale a cross varies by about 2/s ≈ 2e-3 relative to its own mean.\n\nTabFM's configuration mirrors this: `n_feature_crosses='sqrt'` so crossed members exist at\nall, `outlier_threshold=20.0` so the shifted values are not clipped, and a four-element\nnormaliser cycle `['quantile', 'quantile_rtdl', 'quantile_rtdl', 'power']` whose *order*\nis load-bearing — it puts the two rank-based methods on the plain (even-indexed) members,\nwhere the shift is a no-op, and `quantile_rtdl`/`power` on the crossed (odd) ones, where it\nis the whole point.\n\n`folds()` returns three repeats of 3-fold (`RepeatedKFold`, seed 0): nine splits, each\ntraining on 2/3 of the rows, which is what the final fit sees. Rows are exchangeable here,\nso no group or time structure is imposed.\n\nResult on the 9 TabArena folds: **RMSE 71802.2** mean, against the published TabFM\nbaselines of 74223.7 (plain) and 73559.4 (ensemble); CV during the search read 74765.0.\n`tabfm_corr = 1.0` — TabFM is the sole predictor, as required.\n\n## What build.sh builds\n\nNothing. The pipeline reads no file it does not itself write, so `final/build.sh` is a\ncomment and `exit 0`. It runs instantly and needs no disk. Running it is still the\ndocumented entry point:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\n`python final/run.py` is the real cost: one frozen 8-estimator TabFM pass over the task.\nOn the H100 this run used, the scored final took ~75 s of wall clock across all 9 folds\n(2.6 s preprocess, 4.1 s fit, 58.6 s predict, 2.4 s postprocess, over 82656 train / 41328\ntest rows in total). It needs a GPU with roughly 12 GB free; the table is small enough that\nthe context never approaches the judge's row cap.\n\n## What a reader might otherwise get wrong\n\n- **The data is a judge prerequisite, not a pipeline one.** This is a TabArena task:\n  `judge.py` reads `${TABARENA_DIR:-$HOME/.cache/tabarena}/miami_housing/fold_\u003ck\u003e/{train,test}.csv`\n  for k = 0..8 and asserts `fold_0/train.csv` exists. That cache is produced by the repo's\n  TabArena downloader, which was never invoked from this workspace — so the exact command\n  is *not* part of this run's record and `build.sh` does not guess at it. Populate the\n  cache the same way the rest of the repo does before running `final/run.py`.\n  `data/train.csv` and `data/test.csv` here are fold_0 materialised for the agent to read;\n  they are not what the final is scored on.\n- **The final is a mean over 9 folds, not one holdout.** `run.py`/`judge.py` refit the same\n  pipeline independently on each fold. Per-fold RMSE ranged 64276 to 78218 — a spread of\n  ~14k — so a single-fold number is not comparable to the headline 71802.\n- **The 1024 shift is not a normalisation trick and does not commute with anything.** It is\n  applied *after* the log and *before* TabFM, and it only means something in combination\n  with `n_feature_crosses='sqrt'` and the normaliser order above. Reordering `norm_methods`,\n  dropping the crosses, or lowering `outlier_threshold` changes what the shift does, not\n  just how much.\n- **1024 was the end of a trend, not a measured optimum with headroom above it.** The search\n  never saw the curve turn; it stopped there because float32 precision in the crosses\n  becomes the binding constraint, and this was the last rung worth trusting on a final that\n  could not be re-measured."},{"id":"MIC","name":"MIC","short_name":"MIC","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.428926,"plain_note":null,"n_train":1132,"n_test":567,"n_folds":30,"thresholds":null,"summary":"TabFM is the predictor throughout; the pipeline only changes what it sees and how confident its output is. The 1132 training rows and 111 raw columns are expanded to about 160 by three groups of engineered features.","score":0.417764,"gain_pct":2.602314,"medal":null,"category":"I","lines":409,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","postprocess","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","n_svd_features":"'sqrt'"},"helper_functions":["_collapse","_composites","_plain","_aux","_cause_z","_missing_flags","_dump"],"helper_ranges":{"_collapse":[57,72],"_composites":[75,201],"_plain":[204,209],"_aux":[212,240],"_cause_z":[247,274],"_missing_flags":[277,299],"_dump":[388,397]},"hook_helpers":{"preprocess":[],"engineer":["_collapse","_composites","_plain","_aux","_cause_z","_missing_flags"],"sample":[],"postprocess":["_dump"],"folds":[]},"hook_ranges":{"preprocess":[53,54],"engineer":[302,337],"sample":[340,385],"postprocess":[400,409],"folds":[47,50]},"code":"import os\nimport re\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt', 'n_svd_features': 'sqrt'}\n\nPOWER = 0.89\nCOLLAPSE = False\nCOMPOSITES = True\nCOMPOSITES2 = True\nCOMPOSITES3 = True\nMISSING_FLAGS = False\nCOMPOSITES4 = False\nCOMPOSITES5 = False\nCOMPOSITES6 = True\nCAUSE_Z = True\nCAUSE_Z_X = False\nSENTINEL = False\nMISS_COLS = True\n# composite columns to drop again after everything is built (the ablation pass; order-safe,\n# because the cause scores that consume them have already been computed by this point)\nDROP_FEATS = ('n_relapse', 'n_opioid', 'n_nsaid', 'n_drugs', 'n_missing', 'acute',\n              'prior_burden')\nSENTINEL_COLS = ('R_AB_1_n', 'R_AB_2_n', 'R_AB_3_n', 'NA_R_1_n', 'NA_R_2_n', 'NA_R_3_n',\n                 'NOT_NA_1_n', 'NOT_NA_2_n', 'NOT_NA_3_n', 'NA_KB', 'NOT_NA_KB', 'LID_KB')\nDROP_EMPTY = True\nAUX_TREES = 0       # ExtraTrees size for the stacked log-probability columns; 0 disables them\nCONTEXT_FRAC = 1.00   # fraction of the training fold TabFM gets as context (1.0 = all of it)\nDRAWS = 7           # TabFM passes the judge averages: 1 full-context + DRAWS-1 subsamples\nDRAW_FRAC = 0.94    # size of each subsample draw\nALIVE_ONLY = False  # subsample only the majority class in the extra draws, never a death row\nROW_SHUFFLE = False # extra draws are row permutations of the full fold rather than subsamples\nSCALES = (0.97, 0.94, 0.91, 0.88, 0.85)   # per-draw context fractions; overrides DRAWS/DRAW_FRAC\nOVERSAMPLE = 0      # extra copies of every non-'alive' training row put into TabFM's context\nDEATH_SHIFT = 1 / 3.0   # label-shift correction for that oversampling, applied in postprocess\n\nDUMP_DIR = os.path.join(os.getcwd(), \"_oof\")\nDUMP = os.path.isdir(DUMP_DIR)\n\n# one-hot blocks: prefix -\u003e the columns, filled in from the frame (order matters, it is the code)\nONEHOT = ('nr_', 'np_', 'endocr_', 'zab_leg_', 'ritm_ecg_p_', 'n_r_ecg_p_', 'n_p_ecg_p_', 'fibr_ter_')\nDROP = ('KFK_BLOOD', 'IBS_NASL')   # 99.6% / 95.8% missing\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=3, random_state=0)\n  return list(rskf.split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _collapse(df, with_count):\n  \"\"\"Replace each one-hot block by an ordinal code (+ a count for the blocks in `with_count`).\"\"\"\n  out = df.copy()\n  for pre in ONEHOT:\n    cols = [c for c in df.columns if c.startswith(pre)]\n    if len(cols) \u003c 2:\n      continue\n    B = df[cols].to_numpy(dtype=float)\n    allnan = np.isnan(B).all(axis=1)\n    # code = 1-based index of the last active column, 0 when none fire, NaN when the block is NaN\n    idx = np.where(np.nan_to_num(B) \u003e 0, np.arange(1, len(cols) + 1)[None, :], 0).max(axis=1)\n    out = out.drop(columns=cols)\n    out[pre + 'code'] = np.where(allnan, np.nan, idx).astype(float)\n    if pre in with_count:\n      out[pre + 'n'] = np.where(allnan, np.nan, np.nansum(B, axis=1))\n  return out\n\n\ndef _composites(df):\n  \"\"\"Clinical composites: the raw table has the pieces but not the ratios/differences.\"\"\"\n  f = {}\n  g = lambda c: df[c].to_numpy(dtype=float) if c in df.columns else np.full(len(df), np.nan)\n  so, do_ = g('S_AD_ORIT'), g('D_AD_ORIT')\n  sk, dk = g('S_AD_KBRIG'), g('D_AD_KBRIG')\n  f['pp_orit'] = so - do_\n  f['map_orit'] = (so + 2 * do_) / 3.0\n  f['pp_kbrig'] = sk - dk\n  f['d_sys'] = so - sk                              # blood pressure change between ambulance and ICU\n  im = np.c_[g('ant_im'), g('lat_im'), g('inf_im'), g('post_im')]\n  f['im_walls'] = (np.nan_to_num(im) \u003e 0).sum(1).astype(float)\n  f['im_max'] = np.nanmax(im, axis=1)\n  f['im_sum'] = np.nansum(im, axis=1)\n  alt, ast = g('ALT_BLOOD'), g('AST_BLOOD')\n  f['ast_alt'] = ast / np.where(alt \u003e 0, alt, np.nan)\n  f['log_alt'] = np.log1p(alt)\n  f['log_ast'] = np.log1p(ast)\n  f['k_dev'] = np.abs(g('K_BLOOD') - 4.2)\n  f['na_dev'] = np.abs(g('NA_BLOOD') - 140.0)\n  f['acute'] = np.nansum(np.c_[g('K_SH_POST'), g('O_L_POST'), g('FIB_G_POST'),\n                               g('MP_TP_POST'), g('GT_POST'), g('SVT_POST')], axis=1)\n  f['n_relapse'] = np.nansum(np.c_[g('R_AB_1_n'), g('R_AB_2_n'), g('R_AB_3_n')], axis=1)\n  f['n_opioid'] = np.nansum(np.c_[g('NA_R_1_n'), g('NA_R_2_n'), g('NA_R_3_n')], axis=1)\n  f['n_nsaid'] = np.nansum(np.c_[g('NOT_NA_1_n'), g('NOT_NA_2_n'), g('NOT_NA_3_n')], axis=1)\n  f['n_drugs'] = np.nansum(np.c_[g('LID_S_n'), g('B_BLOK_S_n'), g('ANT_CA_S_n'), g('GEPAR_S_n'),\n                                 g('ASP_S_n'), g('TIKL_S_n'), g('TRENT_S_n')], axis=1)\n  f['n_missing'] = df.isna().sum(axis=1).to_numpy(dtype=float)\n  if COMPOSITES2:\n    age = g('AGE')\n    f['sbp_min'] = np.nanmin(np.c_[so, sk], axis=1)\n    f['dbp_min'] = np.nanmin(np.c_[do_, dk], axis=1)\n    f['sbp_low'] = (f['sbp_min'] \u003c 100).astype(float)\n    f['age_over_sbp'] = 100.0 * age / np.where(f['sbp_min'] \u003e 0, f['sbp_min'], np.nan)\n    f['age_x_zsn'] = age * g('ZSN_A')\n    f['age_x_inf'] = age * g('INF_ANAM')\n    f['wbc_esr'] = g('L_BLOOD') * g('ROE')\n    f['log_wbc'] = np.log1p(g('L_BLOOD'))\n    f['killip'] = 2.0 * np.nan_to_num(g('K_SH_POST')) + np.nan_to_num(g('O_L_POST'))\n    f['prior_burden'] = (np.nan_to_num(g('INF_ANAM')) + np.nan_to_num(g('STENOK_AN'))\n                         + np.nan_to_num(g('IBS_POST')) + np.nan_to_num(g('ZSN_A')))\n    if MISS_COLS:\n      for c in ('S_AD_KBRIG', 'S_AD_ORIT', 'K_BLOOD', 'NA_BLOOD', 'ALT_BLOOD', 'ROE',\n                'NA_KB', 'DLIT_AG'):\n        f['miss_' + c] = (df[c].isna().to_numpy(dtype=float) if c in df.columns\n                          else np.zeros(len(df)))\n  if COMPOSITES3:\n    # The three per-day ICU blocks (pain relapse, opioid days, NSAID days) are only recorded while\n    # the patient is still in the unit: they are missing for 0.3% of the survivors and for 40-47% of\n    # the deaths. How far into the stay the record runs is both the strongest death signal in the\n    # table and the main clue to which cause it was, so make it explicit instead of leaving it as NaN.\n    day = [['R_AB_1_n', 'NA_R_1_n', 'NOT_NA_1_n'],\n           ['R_AB_2_n', 'NA_R_2_n', 'NOT_NA_2_n'],\n           ['R_AB_3_n', 'NA_R_3_n', 'NOT_NA_3_n']]\n    miss = []\n    for d, cols in enumerate(day, 1):\n      M = np.c_[[df[c].isna().to_numpy(dtype=float) if c in df.columns else np.zeros(len(df))\n                 for c in cols]].T\n      f['miss_day%d' % d] = M.mean(axis=1)\n      miss.append(M)\n    M = np.concatenate(miss, axis=1)\n    f['n_missing_day'] = M.sum(axis=1)\n    f['icu_days'] = 3.0 - f['miss_day2'] - f['miss_day3']\n    f['icu_days_x_killip'] = f['icu_days'] * f['killip']\n    f['icu_days_x_acute'] = f['icu_days'] * f['acute']\n    f['icu_days_x_age'] = f['icu_days'] * g('AGE')\n  if COMPOSITES4:\n    # More of the day structure: was there activity on a day (not just a record), how the pain and\n    # the analgesia trend over the three days, and which whole blocks of the chart are absent.\n    r1, r2, r3 = g('R_AB_1_n'), g('R_AB_2_n'), g('R_AB_3_n')\n    o1, o2, o3 = g('NA_R_1_n'), g('NA_R_2_n'), g('NA_R_3_n')\n    s1, s2, s3 = g('NOT_NA_1_n'), g('NOT_NA_2_n'), g('NOT_NA_3_n')\n    act = lambda *v: (np.nan_to_num(np.c_[v]) \u003e 0).any(axis=1).astype(float)\n    f['act_day1'], f['act_day2'], f['act_day3'] = act(r1, o1, s1), act(r2, o2, s2), act(r3, o3, s3)\n    f['d_relapse'] = np.nan_to_num(r3) - np.nan_to_num(r1)\n    f['d_opioid'] = np.nan_to_num(o3) - np.nan_to_num(o1)\n    f['d_nsaid'] = np.nan_to_num(s3) - np.nan_to_num(s1)\n    f['analgesia1'] = np.nan_to_num(o1) + np.nan_to_num(s1)\n    f['no_ambulance'] = np.c_[[df[c].isna().to_numpy(dtype=float) if c in df.columns\n                               else np.zeros(len(df))\n                               for c in ('NA_KB', 'NOT_NA_KB', 'LID_KB')]].T.mean(axis=1)\n    f['labs_missing'] = np.c_[[df[c].isna().to_numpy(dtype=float) if c in df.columns\n                               else np.zeros(len(df))\n                               for c in ('K_BLOOD', 'NA_BLOOD', 'ALT_BLOOD', 'AST_BLOOD',\n                                         'ROE', 'L_BLOOD')]].T.sum(axis=1)\n    ecg = [c for c in df.columns if c.startswith(('ritm_ecg_p_', 'n_r_ecg_p_', 'n_p_ecg_p_'))]\n    f['ecg_missing'] = df[ecg].isna().any(axis=1).to_numpy(dtype=float) if ecg else np.zeros(len(df))\n    f['icu_days_x_imwalls'] = f['icu_days'] * f['im_walls']\n    f['icu_days_x_zsn'] = f['icu_days'] * np.nan_to_num(g('ZSN_A'))\n    f['icu_days_x_time'] = f['icu_days'] * g('TIME_B_S')\n  if COMPOSITES5:\n    # Block counts alongside the indicators they come from: how many arrhythmias in the history,\n    # how many rhythm / conduction disturbances on the ECG. The blocks stay one-hot (e16 preferred\n    # that to collapsing them), so these are additive, not a replacement.\n    for pre in ONEHOT:\n      cols = [c for c in df.columns if c.startswith(pre)]\n      if cols:\n        f['cnt_' + pre.strip('_')] = np.nansum(df[cols].to_numpy(dtype=float), axis=1)\n    f['ecg_total'] = f.get('cnt_n_r_ecg_p', 0.0) + f.get('cnt_n_p_ecg_p', 0.0)\n    if COMPOSITES4:   # last_active_day is built from the fourth batch's per-day activity flags\n      f['last_active_day'] = np.where(f['act_day3'] \u003e 0, 3.0,\n                                      np.where(f['act_day2'] \u003e 0, 2.0,\n                                               np.where(f['act_day1'] \u003e 0, 1.0, 0.0)))\n  if COMPOSITES6:\n    # One textbook risk profile per cause of death. Predicting which cause is 54% of the loss and\n    # the model is close to the prior on the rarest four; the ingredients are all in the table but\n    # each cause needs a different handful of them combined, which 906 rows and 6-14 examples of a\n    # class are not enough to learn. Coarse integer sums on purpose -- these are directions from\n    # cardiology (rupture: first, large anterior infarct in an older patient with no prior angina\n    # and preserved pressure; shock: hypotension with a wide infarct; embolism: late arrival,\n    # high ESR, atrial fibrillation), not coefficients fitted to this split.\n    z = lambda v: np.nan_to_num(v, nan=0.0)\n    b = lambda cond: cond.astype(float)\n    age = g('AGE')\n    f['sc_shock'] = (2 * z(g('K_SH_POST')) + b(so \u003c 100) + b(do_ \u003c 60) + b(f['im_walls'] \u003e= 2))\n    f['sc_rupture'] = (b(z(g('INF_ANAM')) == 0) + b(g('ant_im') \u003e= 3) + b(age \u003e= 65)\n                       + b(so \u003e= 140) + b(z(g('ZSN_A')) == 0))\n    f['sc_chf'] = (2 * z(g('ZSN_A')) + b(z(g('SEX')) == 0) + b(g('lat_im') \u003e= 2)\n                   + b(age \u003e= 65) + b(g('ROE') \u003e= 20))\n    f['sc_vf'] = (2 * z(g('FIB_G_POST')) + b(age \u003c 65) + z(g('NITR_S')) + b(g('NA_BLOOD') \u003c 136))\n    f['sc_thrombo'] = (b(g('TIME_B_S') \u003e= 5) + b(g('ROE') \u003e= 20) + z(g('ritm_ecg_p_02'))\n                       + z(g('MP_TP_POST')) + b(z(g('ant_im')) == 0))\n    f['sc_edema'] = (2 * z(g('O_L_POST')) + b(age \u003e= 70) + b(g('STENOK_AN') \u003e= 4)\n                     + b(g('K_BLOOD') \u003c 4.0) + z(g('NITR_S')))\n    f['sc_asystole'] = (b(g('GB') \u003e= 2) + b(g('ant_im') \u003e= 3) + b(age \u003e= 65) + z(g('GIPER_NA')))\n\n  return pd.concat([df, pd.DataFrame(f, index=df.index)], axis=1)\n\n\ndef _plain(df):\n  \"\"\"The judge host unpickles our frames; give it an object-dtype column Index, not the\n  pyarrow-backed str Index pandas 3 builds inside pd.concat (host raises ImportError on it).\"\"\"\n  df = df.copy()\n  df.columns = pd.Index(list(map(str, df.columns)), dtype=object)\n  return df\n\n\ndef _aux(Xtr, y, Xte):\n  \"\"\"Log-probabilities from an ExtraTrees, as extra columns for TabFM to attend over.\n\n  Out-of-fold for the training rows and the mean of the same fold models for the test rows, so the\n  two sides carry the same amount of noise. Fit strictly inside whatever rows engineer() was given.\n  \"\"\"\n  from sklearn.ensemble import ExtraTreesClassifier\n  from sklearn.model_selection import StratifiedKFold\n  A = Xtr.drop(columns=[c for c in ('row_id',) if c in Xtr.columns]).to_numpy(dtype=float)\n  B = Xte.drop(columns=[c for c in ('row_id',) if c in Xte.columns]).to_numpy(dtype=float)\n  A, B = np.nan_to_num(A, nan=-999.0), np.nan_to_num(B, nan=-999.0)\n  y = np.asarray(y)\n  classes = np.unique(y)\n  mk = lambda: ExtraTreesClassifier(AUX_TREES, min_samples_leaf=3, random_state=0, n_jobs=4)\n  oof = np.full((len(A), len(classes)), np.nan)\n  te = np.zeros((len(B), len(classes)))\n  k = 0\n  for tr, va in StratifiedKFold(5, shuffle=True, random_state=0).split(A, y):\n    m = mk().fit(A[tr], y[tr])\n    cols = np.searchsorted(classes, m.classes_)\n    oof[np.ix_(va, cols)] = m.predict_proba(A[va])\n    te[:, cols] += m.predict_proba(B)\n    k += 1\n  te /= k\n  lp = lambda P: np.log(np.clip(P, 1e-4, 1))\n  for j, c in enumerate(classes):\n    Xtr['aux_' + str(c)] = lp(oof[:, j])\n    Xte['aux_' + str(c)] = lp(te[:, j])\n  return Xtr, Xte\n\n\nCAUSE_Z_COLS = ('S_AD_ORIT', 'D_AD_ORIT', 'INF_ANAM', 'ant_im', 'lat_im', 'inf_im', 'ZSN_A', 'SEX',\n                'ROE', 'AGE', 'NA_BLOOD', 'NITR_S', 'TIME_B_S', 'STENOK_AN', 'K_BLOOD', 'GB')\n\n\ndef _cause_z(df, stats):\n  \"\"\"Smooth version of the per-cause risk scores: signed sums of z-scores instead of thresholds.\n\n  The z-scores use the training fold's own mean/std (passed in as `stats`), and the signs are the\n  directions the class-conditional means show -- shock is hypotension, rupture is a first large\n  anterior infarct at a preserved pressure, embolism is a late arrival with a high ESR.\n  \"\"\"\n  z = {}\n  for c in CAUSE_Z_COLS:\n    m, sd = stats.get(c, (0.0, 1.0))\n    v = df[c].to_numpy(dtype=float) if c in df.columns else np.full(len(df), np.nan)\n    z[c] = np.nan_to_num((v - m) / (sd if sd \u003e 0 else 1.0))\n  ev = lambda c: (np.nan_to_num(df[c].to_numpy(dtype=float)) if c in df.columns\n                  else np.zeros(len(df)))\n  out = {\n      'z_shock': -z['S_AD_ORIT'] - z['D_AD_ORIT'] + 2 * ev('K_SH_POST'),\n      'z_rupture': -z['INF_ANAM'] + z['ant_im'] + z['S_AD_ORIT'] - z['ZSN_A'],\n      'z_chf': z['ZSN_A'] - z['SEX'] + z['lat_im'] + z['ROE'],\n      'z_vf': -z['AGE'] - z['NA_BLOOD'] + z['NITR_S'] + 2 * ev('FIB_G_POST'),\n      'z_thrombo': z['TIME_B_S'] + z['ROE'] - z['ant_im'] + z['inf_im'] + ev('ritm_ecg_p_02'),\n      'z_edema': z['AGE'] + z['STENOK_AN'] - z['K_BLOOD'] + 2 * ev('O_L_POST'),\n      'z_asystole': z['GB'] + z['ant_im'] + z['AGE'],\n  }\n  if CAUSE_Z_X and 'icu_days' in df.columns:\n    d = df['icu_days'].to_numpy(dtype=float)\n    for k in list(out):\n      out[k + '_x_days'] = out[k] * d\n  return pd.concat([df, pd.DataFrame(out, index=df.index)], axis=1)\n\n\ndef _missing_flags(Xtr, Xte):\n  \"\"\"One indicator per distinct missingness pattern, for the patterns that occur often enough.\n\n  Whether a cell was recorded is a signal in its own right here (no ambulance report, no lab drawn,\n  the patient was no longer in the unit) and TabFM only ever sees the NaN. Columns that go missing\n  together -- the ECG blocks, the per-day ICU blocks, the paired blood pressures -- share one flag.\n  \"\"\"\n  base = [c for c in Xtr.columns if c != 'row_id']\n  seen, groups = {}, []\n  for c in base:\n    m = Xtr[c].isna().to_numpy()\n    r = m.mean()\n    if r \u003c 0.02 or r \u003e 0.98:\n      continue\n    key = m.tobytes()\n    if key in seen:\n      continue\n    seen[key] = c\n    groups.append(c)\n  for c in groups:\n    Xtr['nan_' + c] = Xtr[c].isna().to_numpy(dtype=float)\n    Xte['nan_' + c] = Xte[c].isna().to_numpy(dtype=float)\n  return Xtr, Xte\n\n\ndef engineer(X_train, y_train, X_test):\n  if COMPOSITES:\n    X_train, X_test = _composites(X_train), _composites(X_test)\n  if SENTINEL:\n    # \"Not recorded\" is a state, not a missing measurement, for the per-day ICU columns and the\n    # ambulance drug chart: the patient had left the unit, or no ambulance team filled a form.\n    # TabFM imputes a NaN, which puts those rows at the column average; -1 keeps them separate\n    # and below every real value (all of these are counts in 0..4).\n    for c in SENTINEL_COLS:\n      if c in X_train.columns:\n        X_train[c] = X_train[c].fillna(-1.0)\n        X_test[c] = X_test[c].fillna(-1.0)\n  if CAUSE_Z:\n    stats = {c: (float(X_train[c].mean()), float(X_train[c].std()))\n             for c in CAUSE_Z_COLS if c in X_train.columns}\n    X_train, X_test = _cause_z(X_train, stats), _cause_z(X_test, stats)\n  if DROP_FEATS:\n    X_train = X_train.drop(columns=[c for c in DROP_FEATS if c in X_train.columns])\n    X_test = X_test.drop(columns=[c for c in DROP_FEATS if c in X_test.columns])\n  if DROP_EMPTY:\n    X_train = X_train.drop(columns=[c for c in DROP if c in X_train.columns])\n    X_test = X_test.drop(columns=[c for c in DROP if c in X_test.columns])\n  if MISSING_FLAGS:\n    X_train, X_test = _missing_flags(X_train.copy(), X_test.copy())\n  if not COLLAPSE:\n    return _plain(X_train), _plain(X_test)\n  drop = [c for c in DROP if c in X_train.columns]\n  Xtr, Xte = X_train.drop(columns=drop), X_test.drop(columns=drop)\n  with_count = {pre for pre in ONEHOT\n                if np.nanmax(np.nansum(Xtr[[c for c in Xtr.columns if c.startswith(pre)]]\n                                       .to_numpy(dtype=float), axis=1)) \u003e 1}\n  Xtr, Xte = _collapse(Xtr, with_count), _collapse(Xte, with_count)\n  Xtr, Xte = _plain(Xtr), _plain(Xte[Xtr.columns])\n  if AUX_TREES:\n    Xtr, Xte = _aux(Xtr, y_train, Xte)\n  return _plain(Xtr), _plain(Xte[Xtr.columns])\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"One full-context draw plus DRAWS-1 stratified subsamples; the judge averages the passes.\n\n  n_estimators is fixed at 8, so extra draws are the only way to enlarge the ensemble. The\n  subsamples are stratified because thromboembolism has 6 rows in a training fold and a plain\n  uniform 88% would sometimes drop the class out of the context entirely.\n  \"\"\"\n  idx = np.arange(len(X_train))\n  if CONTEXT_FRAC \u003c 1.0:      # calibration probe: how does the optimal POWER move with context size\n    from sklearn.model_selection import StratifiedShuffleSplit\n    keep, _ = next(iter(StratifiedShuffleSplit(1, train_size=CONTEXT_FRAC, random_state=3)\n                        .split(idx, np.asarray(y_train))))\n    return [np.sort(keep)]\n  if DRAWS \u003c= 1:\n    return [idx]\n  yv = np.asarray(y_train)\n  if ROW_SHUFFLE:\n    # Diversity with no information loss, if TabFM's context is not perfectly order-invariant:\n    # every draw is the whole training fold, just in a different row order. If the model is\n    # order-invariant the draws collapse to one and the score simply reproduces DRAWS=1.\n    rng = np.random.default_rng(11)\n    return [idx] + [rng.permutation(idx) for _ in range(DRAWS - 1)]\n  if SCALES:\n    # Multi-scale draws: the full fold plus one subsample at each fraction in SCALES. Members that\n    # saw 85% and 97% of the rows are more different from each other than two independent 94%\n    # subsamples are, and diversity is the only thing an extra draw can buy.\n    from sklearn.model_selection import StratifiedShuffleSplit\n    out = [idx]\n    for i, fr in enumerate(SCALES):\n      keep, _ = next(iter(StratifiedShuffleSplit(1, train_size=fr, random_state=100 + i)\n                          .split(idx, yv)))\n      out.append(np.sort(keep))\n    return out\n  if ALIVE_ONLY:\n    # Every death row is in every draw: the rarest class has 6 rows in a training fold, and a draw\n    # that happens to drop one of them loses a sixth of what there is to learn about it. The\n    # diversity comes from resampling the 84% majority instead, which can spare the rows.\n    rng = np.random.default_rng(7)\n    keep_all = idx[yv != 'alive']\n    alive = idx[yv == 'alive']\n    k = int(round(DRAW_FRAC * len(alive)))\n    return [idx] + [np.sort(np.concatenate([keep_all, rng.choice(alive, k, replace=False)]))\n                    for _ in range(DRAWS - 1)]\n  from sklearn.model_selection import StratifiedShuffleSplit\n  sss = StratifiedShuffleSplit(n_splits=DRAWS - 1, train_size=DRAW_FRAC, random_state=7)\n  return [idx] + [np.sort(keep) for keep, _ in sss.split(idx, yv)]\n\n\ndef _dump(pred, X_test):\n  if not DUMP:\n    return\n  try:\n    out = pd.DataFrame(np.asarray(pred, dtype=float), columns=[str(c) for c in pred.columns])\n    out.insert(0, \"row_id\", np.asarray(X_test[\"row_id\"]))\n    n = len(os.listdir(DUMP_DIR))\n    out.to_csv(os.path.join(DUMP_DIR, \"part_%03d.csv\" % n), index=False)\n  except Exception:\n    pass\n\n\ndef postprocess(pred, y_orig, X_test):\n  _dump(pred, X_test)\n  Q = np.clip(np.asarray(pred, dtype=float), 1e-12, None)\n  if OVERSAMPLE \u003e 0:\n    w = np.array([1.0 if c == 'alive' else DEATH_SHIFT for c in pred.columns])\n    Q = Q * w\n    Q = Q / Q.sum(axis=1, keepdims=True)\n  Q = Q ** POWER\n  Q = Q / Q.sum(axis=1, keepdims=True)\n  return pd.DataFrame(Q, columns=pred.columns, index=pred.index)\n","readme":"# MIC — myocardial infarction complications (8-class cause of death, log loss)\n\n## What the pipeline does\n\nTabFM is the predictor throughout; the pipeline only changes what it sees and how confident its\noutput is. The 1132 training rows and 111 raw columns are expanded to about 160 by three groups of\nengineered features. First, the structure of the ICU chart: the per-day pain-relapse and analgesia\nblocks are only filled in while the patient is still in the unit, so they are missing for a third\nof a percent of the survivors and for 40–47% of the deaths; the pipeline turns that into explicit\nper-day missing fractions, an `icu_days` ordinal and its products with the Killip score, the\nacute-event count and age. Second, clinical composites the table has the ingredients for but not\nthe value — pulse pressure and MAP, the ambulance-to-ICU systolic change, infarct extent, AST/ALT,\npotassium and sodium deviation from normal, age × chronic heart failure, and missingness flags for\nthe columns whose absence is itself informative. Third, one coarse textbook risk profile per cause\nof death (shock, rupture, CHF, VF, thromboembolism, pulmonary edema, asystole), in both an integer\nthreshold form and a z-scored form whose means and standard deviations come from the training fold\nonly; predicting *which* cause accounts for roughly half the loss and the model otherwise sits near\nthe class prior for the rarest four causes. Two nearly empty columns are dropped and seven\nroll-up sums that an ablation showed were not paying are removed after the cause scores that\nconsume them have been computed.\n\nBecause the judge fixes the TabFM ensemble at 8 estimators, the pipeline enlarges the ensemble in\nthe only remaining way: `sample()` returns seven contexts — the full training fold plus one\nstratified subsample at each of 97 / 94 / 91 / 88 / 85% — and the judge averages one TabFM pass per\ncontext. Multi-scale draws beat repeated draws at a single fraction, and pure row permutations\nreproduce the single-draw score exactly (TabFM's context is order-invariant), so a draw has to give\nup rows to be a different model. `TABFM_KWARGS` enables feature crosses and SVD features only.\nFinally `postprocess()` raises the averaged probabilities to a global power of 0.89 and renormalises\n— TabFM is mildly overconfident on this table and flattening is worth about 0.005 log loss; nothing\nmore elaborate (vector scaling, prior blends, per-class or row-dependent temperatures) survived.\nValidation uses `folds()` = 5-fold × 3 repeats rather than the judge's shuffled 3-fold, because with\n8 classes and 8–73 examples of the seven death causes the 3-fold spread swamped the effects being\nmeasured.\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` reads no files — all features are computed in-process from the frames\nthe judge passes in — so `final/build.sh` is a comment and `exit 0`. It takes no time and no disk.\n\n## Things a reader could otherwise get wrong\n\n- Run it as `bash final/build.sh \u0026\u0026 python final/run.py` from this workspace. `run.py` copies\n  `final/pipeline.py` over `./pipeline.py` (refusing if the workspace copy differs) and calls the\n  same `judge.load_task` / `judge.run_pipeline` used during the run, so the reproduction cannot\n  drift from what was scored. It writes `final/submission.csv`.\n- `final/build/oof.py` is an offline analysis tool, not part of the prediction path. It rescores\n  probability dumps that `pipeline.py` writes into `_oof/` — and it writes them *only if* an `_oof/`\n  directory already exists in the working directory when the pipeline runs. With no `_oof/`\n  directory the dump is a silent no-op, which is the intended default.\n- `oof.py` also expects `.train_shuffled.csv` (the training set shuffled with `random_state=0`,\n  which reproduces the judge's row order); the command that made it is quoted in `build.sh`.\n- Many module-level constants in `pipeline.py` (`COLLAPSE`, `MISSING_FLAGS`, `COMPOSITES4/5`,\n  `SENTINEL`, `AUX_TREES`, `OVERSAMPLE`, `ROW_SHUFFLE`, `ALIVE_ONLY`, `CONTEXT_FRAC`) are switches\n  for experiments that were measured and rejected. They are off in the scored configuration, and the\n  header comment records what each cost. `SCALES` overrides `DRAWS`/`DRAW_FRAC`, so editing those\n  two alone changes nothing.\n- Reference numbers from the run, on the 5×3-fold validation: 0.44446 for the identity pipeline on\n  the judge's own 3 folds, 0.43822 for it on these 15 folds, and 0.41562 for this configuration."},{"id":"NATICUSdroid","name":"NATICUSdroid","short_name":"NATICUSdroid","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.011356,"plain_note":null,"n_train":4994,"n_test":2497,"n_folds":9,"thresholds":null,"summary":"The task is 4994 Android apps described by 86 binary permission flags, predicting `Malware` (Yes/No), scored as `1 - AUC`. TabFM z-scores every column before attending over the context rows, so for a binary flag an affine re-encoding is a no-op: the only two things about a flag that reach the model are *which of its two states is the minority* (that state gets the large |z|) and…","score":0.011483,"gain_pct":-1.118352,"medal":null,"category":"II","lines":42,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"permute_categorical":"True","n_feature_crosses":"'sqrt'"},"helper_functions":[],"helper_ranges":{},"hook_helpers":{"preprocess":[],"engineer":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[7,8],"engineer":[11,30],"postprocess":[33,34],"folds":[37,42]},"code":"import numpy as np\n\nTABFM_KWARGS = {'permute_categorical': True, 'n_feature_crosses': 'sqrt'}\nSTRONG_FRAC = 0.8        # share of flags kept numeric with a fixed target-aligned orientation\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  cols = [c for c in X_train.columns if c != 'row_id']\n  lab = y_train.astype(str).to_numpy()\n  classes = np.unique(lab)\n  if len(classes) \u003c 2:                      # `check` runs on a slice of the class-sorted train.csv\n    return X_train, X_test\n  y = (lab == classes[-1]).astype(int)\n  B = X_train[cols].to_numpy(np.int64)\n  # P(malware | flag=1) - P(malware | flag=0), guarding flags that are constant in this fold\n  n1 = B.sum(axis=0)\n  p1 = np.divide(B.T @ y, n1, out=np.full(len(cols), y.mean()), where=n1 \u003e 0)\n  p0 = np.divide((1 - B).T @ y, len(B) - n1, out=np.full(len(cols), y.mean()), where=n1 \u003c len(B))\n  d = p1 - p0\n  strong = np.abs(d) \u003e= np.quantile(np.abs(d), 1 - STRONG_FRAC)\n  # strong flags: numeric, oriented so 1 is always the malware-associated state\n  flip = [c for c, di, s in zip(cols, d, strong) if s and di \u003c 0]\n  # weak flags: categorical, so permute_categorical re-polarises them per ensemble member\n  cast = {c: 'category' for c, s in zip(cols, strong) if not s}\n  return (X_train.assign(**{c: 1 - X_train[c] for c in flip}).astype(cast),\n          X_test.assign(**{c: 1 - X_test[c] for c in flip}).astype(cast))\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n\n\ndef folds(X_train, y_train):\n  # 2 repeats of a 10-fold: 4495 context rows per fold, the closest this training set gets to the\n  # 4994 the final fits on, on the seed that took no part in choosing STRONG_FRAC\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  cv = RepeatedStratifiedKFold(n_splits=10, n_repeats=2, random_state=3)\n  return list(cv.split(X_train, y_train))\n","readme":"# NATICUSdroid — final pipeline\n\n## What it does\n\nThe task is 4994 Android apps described by 86 binary permission flags, predicting `Malware`\n(Yes/No), scored as `1 - AUC`. TabFM z-scores every column before attending over the context rows,\nso for a binary flag an affine re-encoding is a no-op: the only two things about a flag that reach\nthe model are *which of its two states is the minority* (that state gets the large |z|) and *whether\nthe flag is routed as numeric or as categorical*. The pipeline sets exactly those two things, per\nflag, and changes nothing else — no columns are added, removed or transformed, and the context is\nalways the full set of training rows.\n\nInside each training fold it measures every flag's signed lift `P(malware | flag=1) - P(malware |\nflag=0)`. The top 80% by |lift| are kept **numeric and sign-aligned**: any flag whose lift is\nnegative is replaced by `1 - flag`, so a large positive value always means the malware-associated\nstate of that permission. The remaining 20%, whose sign is not reliable enough to fix without\nfitting noise, are cast to `category`, which turns on TabFM's `permute_categorical`: each ensemble\nmember then sees its own random polarity for them and the ensemble averages over a symmetry the data\nhas and the model does not. On top of that, `n_feature_crosses='sqrt'` gives half the members nine\nrandom pairwise crosses — built from numeric columns only, so they cross the *oriented* strong\nflags, which is why the same knob is a loss on the raw table. `folds()` is 2 repeats of a stratified\n10-fold (seed 3), giving 4495 context rows per fold, the closest the training set gets to the 4994\nthe final fit sees.\n\nMeasured against the identity pipeline on the same folds, at the geometry closest to the final's\n(4495 context rows, 20 folds, a seed that took no part in any design choice): **0.011552 vs\n0.012029**, better on 18 of 20 folds, t = 4.6. The full ablation and eval log is in the docstring at\nthe top of `pipeline.py`.\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no files — every quantity it uses is recomputed from the training\nDataFrame it is handed. `final/build.sh` is a comment and `exit 0`; it takes no time and no disk.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader could get wrong\n\n- **`data/train.csv` is sorted by label** (only 3 label switches across 4994 rows), so row position\n  predicts the target almost perfectly *inside the training file*. That is an artefact of how the\n  file was written — `test.csv` is shuffled (position/prediction Spearman −0.002) — and any\n  index-derived feature would show a large fake CV gain. The pipeline deliberately derives nothing\n  from row order.\n- A consequence of that sorting: `judge.py check`, which runs the hooks on the first 200 rows, sees\n  a single class. `engineer()` detects this and returns the table untouched, so `check` exercises\n  the plumbing but not the logic. `final/build/t.py` is the local substitute — it runs the hooks on\n  a real two-class fold and pushes the result through TabFM's own encoder. Run it from the\n  workspace root, not from `final/`.\n- The lift ranking is computed **inside each fold**, from that fold's training rows only, so there\n  is no leakage from validation rows and the shipped code path is identical in CV and in the final\n  fit (only the number of context rows changes).\n- `STRONG_FRAC = 0.8` is the single hand-set constant. It is flat between 0.75 and 0.9 at 3995\n  context rows and a clean interior optimum at 4495 (0.65 → 0.011719, 0.8 → 0.011552, 0.9 →\n  0.011709); its advantage grows with context size, and the final has more rows than any tuning run,\n  which is why 0.8 ships.\n- TabFM stays the only predictor. No auxiliary model's output enters the features or the prediction\n  (a GBM+ExtraTrees rank blend was tried and cost 4e-4)."},{"id":"online_shoppers_intention","name":"online_shoppers_intention","short_name":"online_shoppers_intention","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.060362,"plain_note":null,"n_train":8220,"n_test":4110,"n_folds":9,"thresholds":null,"summary":"Frozen TabFM does all the predicting, in-context over the full training set; the pipeline around it is deliberately almost empty, because on this task nearly everything tried made it worse. The one substantive change is feature selection: five columns are dropped before TabFM sees the table — `OperatingSystems`, `Browser`, `Region` (near-zero importance nominal ids) and `Informational`, `Informational_Duration`…","score":0.060214,"gain_pct":0.245187,"medal":null,"category":"II","lines":89,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'"},"helper_functions":["_binary","_keep_clean"],"helper_ranges":{"_binary":[23,27],"_keep_clean":[30,56]},"hook_helpers":{"preprocess":["_binary","_keep_clean"],"engineer":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[59,64],"engineer":[67,85],"postprocess":[88,89],"folds":[17,20]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt'}\n\nDROP = ['OperatingSystems', 'Browser', 'Region', 'Informational', 'Informational_Duration']\n\nNOMINAL = []\n\nLOG1P = []\n\nMERGE_INFO = False\n\nCLEAN = 0.0\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=4, random_state=12345)\n  return list(rskf.split(X_train, y_train))\n\n\ndef _binary(y):\n  \"\"\"0/1 for the target however it arrives: the judge hands over 'True'/'False' strings, a local\n  read_csv gives bools.\"\"\"\n  a = np.asarray(y).ravel()\n  return (a == np.unique(a)[-1]).astype(int)\n\n\ndef _keep_clean(X, y, frac):\n  \"\"\"Indices of the rows to keep: drop, within each class, the `frac` of rows a boosted model\n  fitted out-of-fold on this same training fold finds least compatible with their label.\"\"\"\n  from sklearn.ensemble import HistGradientBoostingClassifier\n  from sklearn.model_selection import StratifiedKFold\n  A = X.drop(columns=[c for c in ('row_id',) if c in X.columns]).copy()\n  for c in A.columns:\n    if A[c].dtype == object or str(A[c].dtype) == 'str':\n      A[c] = A[c].astype('category')\n    elif A[c].dtype == bool:\n      A[c] = A[c].astype(int)\n  z = _binary(y)\n  oof = np.zeros(len(A))\n  for tr, va in StratifiedKFold(4, shuffle=True, random_state=0).split(A, z):\n    m = HistGradientBoostingClassifier(categorical_features='from_dtype', random_state=0,\n                                       max_iter=150, learning_rate=0.1, max_leaf_nodes=16,\n                                       min_samples_leaf=30, l2_regularization=1.0,\n                                       early_stopping=False).fit(A.iloc[tr], z[tr])\n    oof[va] = m.predict_proba(A.iloc[va])[:, 1]\n  agree = np.where(z == 1, oof, 1.0 - oof)\n  keep = np.ones(len(A), dtype=bool)\n  for cls in (0, 1):\n    idx = np.flatnonzero(z == cls)\n    n = int(round(frac * len(idx)))\n    if n:\n      keep[idx[np.argsort(agree[idx])[:n]]] = False\n  return keep\n\n\ndef preprocess(X_train, y_train, X_test):\n  if CLEAN \u003e 0:\n    keep = _keep_clean(X_train, y_train, CLEAN)\n    X_train = X_train.loc[keep].reset_index(drop=True)\n    y_train = y_train.loc[keep].reset_index(drop=True)\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  out = []\n  for df in (X_train, X_test):\n    df = df.copy()\n    if MERGE_INFO and 'Informational' in df.columns:\n      df['Administrative'] = df['Administrative'] + df['Informational']\n      df['Administrative_Duration'] = df['Administrative_Duration'] + df['Informational_Duration']\n    df = df.drop(columns=[c for c in DROP if c in df.columns])\n    for c in LOG1P:\n      if c in df.columns:\n        df[c] = np.log1p(df[c].to_numpy(dtype=float).clip(0))\n    for c in NOMINAL:\n      # dtype=object, explicitly: pandas 3 makes any string column a pyarrow-backed StringDtype\n      # and the process that unpickles this has no pyarrow (evals 6, 7)\n      if c in df.columns:\n        df[c] = pd.Series(np.array(['c%s' % v for v in df[c].to_numpy()], dtype=object),\n                          index=df.index, dtype=object)\n    out.append(df)\n  return out[0], out[1]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# online_shoppers_intention — final pipeline\n\nBinary classification of `Revenue` over 8220 training rows x 17 features, scored as `1 - AUC`\n(lower is better).\n\n## What the pipeline does\n\nFrozen TabFM does all the predicting, in-context over the full training set; the pipeline around it\nis deliberately almost empty, because on this task nearly everything tried made it worse. The one\nsubstantive change is feature selection: five columns are dropped before TabFM sees the table —\n`OperatingSystems`, `Browser`, `Region` (near-zero importance nominal ids) and `Informational`,\n`Informational_Duration` (subsumed by the Administrative counterparts). TabFM itself runs with\n`n_feature_crosses='sqrt'`; no row sampling, no target transform, no post-processing of the\nprobabilities, no second model. The hooks keep switches for the alternatives that were measured and\nrejected — `LOG1P`, `NOMINAL` (integer ids as string categoricals), `MERGE_INFO` (fold\nInformational into Administrative), and `CLEAN` (drop the fraction of rows an out-of-fold\nHistGradientBoosting finds least compatible with their label) — all left at their off/empty values,\nsince each was flat or worse against the identity baseline. The GBDT was worth 0.930 AUC against\nTabFM's 0.940 and their rankings agree, so it pays neither as an extra column (+0.00441) nor as a\nrank blend at the output (+0.00053); those routes are closed.\n\n`folds()` is a repeated stratified 5-fold, 4 repeats, `random_state=12345` — 20 fits, because the\ncandidates that were still in contention differed by ~0.00015 and that is not resolvable at 10\nfolds. The rows are exchangeable (no time or group structure), so plain stratification mirrors the\ntest split.\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no files — it only transforms the DataFrames the judge passes to its\nhooks, and names no path or cache anywhere. `final/build.sh` says so and exits 0; it runs\ninstantly and needs no disk.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n`python final/run.py` is the real cost: it loads the competition data, runs the hooks and the frozen\nTabFM pass (`judge.estimators_final` estimators, override with `-n`), and writes\n`final/submission.csv`. Use `python final/run.py --check` for the hooks-only dry run with no TabFM.\n\n## Things a reader could get wrong\n\n- The two scripts under `final/build/` are **search tooling, not build steps**, and `build.sh`\n  intentionally does not call them. `sweep.py` rewrites the `TABFM_KWARGS` line and the intent\n  docstring of the workspace `pipeline.py` in place and spends judge budget running\n  `judge.py val` per case; `cmp.py` only reads `log.txt` to print paired fold diffs between two\n  `[RESULT n]` lines. Running `sweep.py` here would mutate the scored pipeline.\n- `run.py` copies `final/pipeline.py` over `\u003cworkspace\u003e/pipeline.py` (the judge loads it by name)\n  and refuses to run if the workspace copy differs — that guard is expected, not an error to\n  route around.\n- The `NOMINAL` branch in `engineer` builds string columns with `dtype=object` explicitly. That is\n  not stylistic: pandas 3 turns any string column into a pyarrow-backed `StringDtype`, and the\n  process that unpickles the frame has no pyarrow. The branch is inactive by default but the\n  constraint applies to anyone who switches it on.\n- `_binary` maps the label with `a == np.unique(a)[-1]` because the target arrives as `'True'`/\n  `'False'` strings from the judge but as real bools from a local `read_csv`.\n- The docstring's per-experiment deltas are on the 20-fold CV, paired against the eval each one\n  followed; identity there is 0.06036 and the best measured 0.06028. They are not test scores."},{"id":"physiochemical_protein","name":"physiochemical_protein","short_name":"physiochemical_protein","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":2.888108,"plain_note":null,"n_train":30486,"n_test":15244,"n_folds":9,"thresholds":null,"summary":"The task is TabArena's `physiochemical_protein` regression: predict `ResidualSize` from nine physicochemical descriptors, scored by RMSE (lower is better). TabFM does the predicting; the pipeline is entirely about what it sees and how its output is read back.","score":2.775078,"gain_pct":3.913635,"medal":null,"category":"II","lines":72,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['quantile_rtdl', 'robust', 'none', 'power', 'quantile']","max_num_rows":"65536"},"helper_functions":["_key","_sig","_ratios"],"helper_ranges":{"_key":[33,34],"_sig":[37,40],"_ratios":[43,48]},"hook_helpers":{"preprocess":[],"engineer":["_key","_sig","_ratios"],"postprocess":["_sig"],"folds":[]},"hook_ranges":{"preprocess":[26,30],"engineer":[51,58],"postprocess":[61,72],"folds":[21,23]},"code":"import hashlib\nimport os\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'norm_methods': ['quantile_rtdl', 'robust', 'none', 'power', 'quantile'],\n                'max_num_rows': 65536}\n\nSIZE = 'TotalSurfaceArea'\nBASE = ['TotalSurfaceArea', 'NonPolarExposedArea', 'FracExposedNonPolarResidue',\n        'FracExposedNonPolarPart', 'MassWeightedExposedArea', 'AvgDeviationExposedArea',\n        'EuclideanDistance', 'SecondaryStructurePenalty', 'SpatialDistNK']\nRATIOS = ['FracExposedNonPolarPart', 'MassWeightedExposedArea',\n          'AvgDeviationExposedArea']\nHANDOFF = '.dup_lookup.npz'\nW = 0.6\nCV_FOLDS = 5\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import KFold\n  return list(KFold(CV_FOLDS, shuffle=True, random_state=0).split(X_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  hi = float(y_train.max())\n  v = y_train.to_numpy(dtype=float)\n  y = pd.DataFrame({'t0': v, 't1': hi - v}, index=y_train.index)\n  return X_train, y, X_test\n\n\ndef _key(X):\n  return pd.Series(map('|'.join, X[BASE].round(6).astype(str).to_numpy()), index=X.index)\n\n\ndef _sig(X):\n  cols = [c for c in BASE if c in X.columns]   # engineer drops one; both real callers see the raw frame\n  return hashlib.sha1(np.ascontiguousarray(\n      X[cols].to_numpy(dtype=float)).tobytes()).hexdigest()\n\n\ndef _ratios(X):\n  Z = X.copy()\n  size = X[SIZE].to_numpy(dtype=float)\n  for c in RATIOS:\n    Z[f'{c}_per_area'] = X[c].to_numpy(dtype=float) / size\n  return Z.drop(columns=['AvgDeviationExposedArea', 'MassWeightedExposedArea'])\n\n\ndef engineer(X_train, y_train, X_test):\n  lut = pd.Series(y_train['t0'].to_numpy(dtype=float)).groupby(_key(X_train).to_numpy()).mean()\n  hit = _key(X_test).map(lut).to_numpy(dtype=float)\n  try:\n    np.savez(os.path.join(os.getcwd(), HANDOFF), hit=hit, sig=np.array(_sig(X_test)))\n  except OSError:\n    pass\n  return _ratios(X_train), _ratios(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  lo, hi = float(np.min(y_orig)), float(np.max(y_orig))\n  out = 0.5 * (pred['t0'].to_numpy(dtype=float) + (hi - pred['t1'].to_numpy(dtype=float)))\n  try:\n    z = np.load(os.path.join(os.getcwd(), HANDOFF), allow_pickle=False)\n    lut_hit, sig = z['hit'], str(z['sig'])\n  except Exception:\n    lut_hit, sig = None, None\n  if lut_hit is not None and len(lut_hit) == len(out) and sig == _sig(X_test):\n    m = np.isfinite(lut_hit)\n    out[m] = W * lut_hit[m] + (1.0 - W) * out[m]\n  return pd.Series(out, index=pred.index).clip(lo, hi)\n","readme":"# physiochemical_protein — final pipeline\n\n## What it does\n\nThe task is TabArena's `physiochemical_protein` regression: predict `ResidualSize` from nine\nphysicochemical descriptors, scored by RMSE (lower is better). TabFM does the predicting; the\npipeline is entirely about what it sees and how its output is read back.\n\nFour things happen around the frozen model.\n\n*Two-headed target.* `preprocess` replaces the single target with a pair of columns, `t0 = y` and\n`t1 = max(y) - y`, so TabFM regresses the same quantity from both ends of its range. `postprocess`\naverages the two views back together (`0.5 * (t0 + (hi - t1))`) and clips to the observed training\nrange. The mirrored head is a cheap second opinion whose errors are not identical to the first's.\n\n*Feature table.* `engineer` divides three of the extensive descriptors\n(`FracExposedNonPolarPart`, `MassWeightedExposedArea`, `AvgDeviationExposedArea`) by\n`TotalSurfaceArea` to make size-free ratios, then drops the two raw columns whose information the\nratios carry (`AvgDeviationExposedArea`, `MassWeightedExposedArea`). The table TabFM sees is ten\ncolumns; the search settled there — nine lost.\n\n*Duplicate-row lookup.* Many rows in this dataset repeat exactly across the split. `engineer` builds\na lookup keyed on the nine base features rounded to 6 decimals, mapping each key to the mean training\ntarget, and looks up every test row. Hits are blended into the final prediction at weight `W = 0.6`\nagainst TabFM's own output. Because `engineer` and `postprocess` do not share state directly, the\nhit vector is passed through `.dup_lookup.npz` in the working directory, guarded by a SHA-1 of the\ntest features so a stale file from another invocation is ignored rather than misapplied.\n\n*Ensemble knobs.* `TABFM_KWARGS` runs the eight estimators over five normalisation views —\n`quantile_rtdl`, `robust`, `none`, `power`, `quantile` (cycled, so the first three appear twice) —\nwith `max_num_rows = 65536`. `folds()` is plain 5-fold shuffled KFold: the rows are exchangeable, so\nvalidation needs no group or time structure.\n\nPublished TabFM baselines on the same folds: plain 2.888108, TabFM-Ensemble 2.88039. The best\nvalidation reference recorded for this pipeline's neighbourhood was 2.80260.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0, because `pipeline.py` reads no precomputed file.\nThe one `.npz` it touches, `.dup_lookup.npz`, it writes itself during the same run. It takes no time\nand no disk.\n\nThe whole run was edits to `pipeline.py` — no helper script or cache was ever written — which is why\nthere is no `final/build/` directory to call into.\n\n## Things a reader could get wrong\n\n- `.dup_lookup.npz` in the workspace root is **output**, not input. Deleting it is safe: the next run\n  recreates it. If it is present but stale, the signature check makes `postprocess` fall back to the\n  plain TabFM prediction instead of blending in the wrong rows.\n- The lookup is not leakage. It is keyed on features and filled only from training targets; test\n  labels never enter the workspace.\n- `_sig` deliberately intersects with `X.columns`, because `engineer` returns a frame with two of the\n  base columns dropped. Both real callers pass the raw frame, so the signature is over all nine, but\n  the guard survives being called on the engineered one.\n- `preprocess` returns a two-column `y`, so anything reading `y_train` after that point sees\n  `t0`/`t1`, not `ResidualSize`. `postprocess` receives the original `y_orig` for the clip bounds.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` and refuses to run if the two\n  differ; they are identical to `history/pipeline_096.py`, the scored snapshot."},{"id":"polish_companies_bankruptcy","name":"polish_companies_bankruptcy","short_name":"polish_companies_bankruptcy","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.005806,"plain_note":null,"n_train":3940,"n_test":1970,"n_folds":9,"thresholds":null,"summary":"TabFM is the only predictor; everything here is about the table it gets to attend over. The 64 financial-ratio columns are heavy-tailed and span many orders of magnitude, so each one is passed through a signed log, `sign(x)·log1p(|x|)`, which compresses the tails while keeping the sign — on bankruptcy ratios (negative equity, negative working capital, negative profit) the sign carries real information, so a plain…","score":0.005178,"gain_pct":10.816397,"medal":null,"category":"II","lines":207,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","folds"],"tabfm_kwargs":{"feat_shuffle_method":"'none'"},"helper_functions":["_plain","_slog"],"helper_ranges":{"_plain":[21,25],"_slog":[28,29]},"hook_helpers":{"preprocess":[],"engineer":["_plain","_slog"],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[17,18],"engineer":[32,180],"sample":[183,203],"postprocess":[206,207],"folds":[11,14]},"code":"import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import RepeatedStratifiedKFold\nfrom sklearn.preprocessing import QuantileTransformer\n\nCFG = {'tf': 'slog', 'miss_ind': 1, 'n_miss': 1, 'dedup': 0.98}\n\nTABFM_KWARGS = {'feat_shuffle_method': 'none'}\n\n\ndef folds(X_train, y_train):\n  y = np.asarray(y_train).ravel()\n  cv = RepeatedStratifiedKFold(n_splits=5, n_repeats=2, random_state=12345)\n  return [(tr, va) for tr, va in cv.split(np.zeros(len(y)), y)]\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _plain(names, mats, n):\n  \"\"\"Float frame with an object-dtype column index: pandas 3 builds pyarrow-backed string indexes\n  inside the judge's sandbox and the parent process cannot unpickle those.\"\"\"\n  return pd.DataFrame(np.column_stack(mats).reshape(n, len(names)),\n                      columns=pd.Index([str(c) for c in names], dtype=object))\n\n\ndef _slog(a):\n  return np.sign(a) * np.log1p(np.abs(a))\n\n\ndef engineer(X_train, y_train, X_test):\n  cols = [c for c in X_train.columns if c != \"row_id\"]\n  ids = [c for c in X_train.columns if c == \"row_id\"]\n  cols0 = list(cols)\n  A = X_train[cols].to_numpy(dtype=float)\n  B = X_test[cols].to_numpy(dtype=float)\n  names, blocks_tr, blocks_te = [], [], []\n  for c in ids:\n    names.append(c)\n    blocks_tr.append(X_train[c].to_numpy(dtype=float)[:, None])\n    blocks_te.append(X_test[c].to_numpy(dtype=float)[:, None])\n\n  t = CFG.get(\"tf\", \"raw\")\n  if t in (\"wins\", \"wins_slog\"):                      # clip to train quantiles, fold-fitted\n    q = CFG.get(\"wq\", 0.01)\n    lo = np.nanquantile(A, q, axis=0)\n    hi = np.nanquantile(A, 1 - q, axis=0)\n    A, B = np.clip(A, lo, hi), np.clip(B, lo, hi)\n  if t == \"mad_slog\":                                 # scale by a robust spread before compressing\n    med = np.nanmedian(A, axis=0)\n    mad = np.nanmedian(np.abs(A - med), axis=0)\n    s = np.where(mad \u003e 0, mad * 1.4826, 1.0)\n    A, B = (A - med) / s, (B - med) / s\n  if t == \"sslog\":                                    # scale only -- keep the sign, which is meaningful here\n    s = np.nanmedian(np.abs(A), axis=0)\n    s = np.where(s \u003e 0, s, 1.0)\n    A, B = A / s, B / s\n  if t in (\"slog\", \"wins_slog\", \"mad_slog\", \"sslog\"):\n    A, B = _slog(A), _slog(B)\n  elif t == \"cbrt\":                                   # a milder compression than the log\n    A, B = np.cbrt(A), np.cbrt(B)\n  elif t == \"rankg\":                                  # rank -\u003e gaussian, fold-fitted\n    qt = QuantileTransformer(output_distribution=\"normal\",\n                             n_quantiles=min(1000, len(A)), subsample=10**9, random_state=0)\n    A, B = qt.fit_transform(A), qt.transform(B)\n  f = CFG.get(\"fill\")\n  if f == \"med\":                                      # fold-fitted median fill (indicators keep theinformation carried by the pattern)\n    m = np.nanmedian(A, axis=0)\n    m = np.where(np.isfinite(m), m, 0.0)\n    A, B = np.where(np.isnan(A), m, A), np.where(np.isnan(B), m, B)\n  elif f == \"sent\":                                   # NaN as one distinct out-of-range value\n    v = CFG.get(\"sent\", -9.0)\n    A, B = np.where(np.isnan(A), v, A), np.where(np.isnan(B), v, B)\n\n  if CFG.get(\"dedup\"):                                # drop columns that duplicate an earlier one\n    keep, seen = [], []\n    for j in range(A.shape[1]):\n      v = A[:, j]\n      ok = np.isfinite(v)\n      if ok.sum() \u003c 2 or np.nanstd(v) == 0:\n        continue\n      dup = False\n      for k in seen:\n        m = ok \u0026 np.isfinite(A[:, k])\n        if m.sum() \u003e 2 and abs(np.corrcoef(v[m], A[m, k])[0, 1]) \u003e CFG[\"dedup\"]:\n          dup = True\n          break\n      if not dup:\n        seen.append(j)\n        keep.append(j)\n    cols = [cols[j] for j in keep]\n    A, B = A[:, keep], B[:, keep]\n\n  if CFG.get(\"order\") == \"mi\":        # with column shuffling off, the order TabFM sees is mine to choose\n    from sklearn.feature_selection import mutual_info_classif\n    yy = np.asarray(y_train).ravel()\n    yy = (yy == np.unique(yy)[-1]).astype(int) if len(np.unique(yy)) \u003e 1 else np.zeros(len(yy), int)\n    med = np.nanmedian(A, axis=0)\n    Z = np.where(np.isnan(A), np.where(np.isfinite(med), med, 0.0), A)\n    o = np.argsort(mutual_info_classif(Z, yy, random_state=0))[::-1]\n    cols = [cols[j] for j in o]\n    A, B = A[:, o], B[:, o]\n\n  if not CFG.get(\"drop_base\", 0):\n    names += list(cols)\n    blocks_tr.append(A)\n    blocks_te.append(B)\n\n  if CFG.get(\"slog2\") and t != \"slog\":                # a second view of the same columns\n    names += [\"sl_\" + c for c in cols0]\n    blocks_tr.append(_slog(X_train[cols0].to_numpy(dtype=float)))\n    blocks_te.append(_slog(X_test[cols0].to_numpy(dtype=float)))\n  NA_tr = np.isnan(X_train[cols0].to_numpy(dtype=float))\n  NA_te = np.isnan(X_test[cols0].to_numpy(dtype=float))\n  if CFG.get(\"miss_ind\"):\n    mc = [j for j in range(len(cols0)) if NA_tr[:, j].any()]\n    names += [\"mi_\" + cols0[j] for j in mc]\n    blocks_tr.append(NA_tr[:, mc].astype(float))\n    blocks_te.append(NA_te[:, mc].astype(float))\n  if CFG.get(\"n_miss\"):\n    names.append(\"n_missing\")\n    blocks_tr.append(NA_tr.sum(1, keepdims=True).astype(float))\n    blocks_te.append(NA_te.sum(1, keepdims=True).astype(float))\n\n  R_tr = X_train[cols0].to_numpy(dtype=float)\n  R_te = X_test[cols0].to_numpy(dtype=float)\n  if CFG.get(\"neg_ind\"):                              # sign flags: negative equity / profit / working capital\n    frac = np.nanmean(R_tr \u003c 0, axis=0)\n    nc = [j for j in range(len(cols0)) if 0.01 \u003c frac[j] \u003c 0.5]\n    names += [\"neg_\" + cols0[j] for j in nc]\n    blocks_tr.append((R_tr[:, nc] \u003c 0).astype(float))\n    blocks_te.append((R_te[:, nc] \u003c 0).astype(float))\n\n  y = np.asarray(y_train).ravel()\n  yb = (y == np.unique(y)[-1]).astype(int) if len(np.unique(y)) \u003e 1 else np.zeros(len(y), int)\n  need_rank = CFG.get(\"pairs\") or CFG.get(\"topk\") or CFG.get(\"oof\")\n  if need_rank:\n    from sklearn.ensemble import HistGradientBoostingClassifier\n    from sklearn.inspection import permutation_importance  # noqa: F401  (kept for reference)\n    S_tr = _slog(R_tr)\n    S_te = _slog(R_te)\n  if CFG.get(\"pairs\"):                                # log-ratios of the k most informative columns\n    from sklearn.feature_selection import mutual_info_classif\n    Z = np.where(np.isfinite(S_tr), S_tr, np.nanmedian(np.where(np.isfinite(S_tr), S_tr, np.nan), axis=0))\n    mi = mutual_info_classif(np.nan_to_num(Z), yb, random_state=0)\n    top = list(np.argsort(mi)[::-1][:CFG[\"pairs\"]])\n    for a in range(len(top)):\n      for b in range(a + 1, len(top)):\n        i, j = top[a], top[b]\n        names.append(\"lr_%d_%d\" % (i, j))\n        blocks_tr.append((S_tr[:, i] - S_tr[:, j])[:, None])\n        blocks_te.append((S_te[:, i] - S_te[:, j])[:, None])\n  if CFG.get(\"oof\"):                                  # a GBDT's out-of-fold log-odds as one extra column\n    from sklearn.model_selection import StratifiedKFold\n    md = dict(max_iter=CFG.get(\"oof_iter\", 200), learning_rate=0.06, max_leaf_nodes=15,\n              l2_regularization=1.0, random_state=0)\n    o_tr = np.zeros(len(S_tr))\n    o_te = np.zeros(len(S_te))\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=7)\n    for a, b in skf.split(S_tr, yb):\n      m = HistGradientBoostingClassifier(**md).fit(S_tr[a], yb[a])\n      o_tr[b] = m.predict_proba(S_tr[b])[:, 1]\n      o_te += m.predict_proba(S_te)[:, 1] / 5.0\n    lg = lambda p: np.log(np.clip(p, 1e-6, 1 - 1e-6) / (1 - np.clip(p, 1e-6, 1 - 1e-6)))\n    names.append(\"gbdt_logodds\")\n    blocks_tr.append(lg(o_tr)[:, None])\n    blocks_te.append(lg(o_te)[:, None])\n\n  Xtr = _plain(names, blocks_tr, len(X_trai
