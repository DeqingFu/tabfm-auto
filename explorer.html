y-assigned string column becomes an `ArrowStringArray`; the judge\n  unpickles the result in a pandas 3.0 *without* pyarrow and refuses to load one. `judge.py check`\n  runs in-process, never crosses that boundary, and reports ok either way. Forcing plain object\n  dtype is what keeps the handoff working.\n- **The dropped columns are a measured choice, not a rule about flat features.** `credit_score`\n  looks just as flat by decile as the dropped ones, but removing it costs 0.0013, so it stays.\n- Additive feature engineering was tried extensively (interactions, ratios, age bins, zero-balance ×\n  country) and every variant lost by 0.0001–0.0011. Oversampling the minority class in the context\n  rows is catastrophic (0.147 at 2×, 0.289 at 3×). The docstring at the top of `pipeline.py` is the\n  full negative-results list; consult it before re-trying anything."},{"id":"Bioresponse","name":"Bioresponse","short_name":"Bioresponse","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.117806,"plain_note":null,"n_train":2500,"n_test":1251,"n_folds":9,"thresholds":null,"summary":"The task is 1776 numeric molecular descriptors, 2500 training rows, scored as `1 - AUC`. The judge accepts at most 500 columns into TabFM's context, so the whole job is choosing what the frozen model gets to see.","score":0.11711,"gain_pct":0.590802,"medal":null,"category":"II","lines":142,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","postprocess","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'"},"helper_functions":["_plain","_codes","_usable_cols","_importance","_select","_rank","_dump"],"helper_ranges":{"_plain":[30,33],"_codes":[36,37],"_usable_cols":[40,54],"_importance":[57,65],"_select":[68,80],"_rank":[111,112],"_dump":[115,123]},"hook_helpers":{"preprocess":[],"engineer":["_plain","_codes","_usable_cols","_importance","_select"],"postprocess":["_rank","_dump"],"folds":[]},"hook_ranges":{"preprocess":[26,27],"engineer":[83,108],"postprocess":[126,142],"folds":[20,23]},"code":"import os\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {\"n_feature_crosses\": \"sqrt\"}\n\nN_FOLDS = 5           # own CV: 2000 context rows per fold, closer to the 2500 the final fits\nTOP_K = 220           # raw descriptors kept\nN_SVD = 40            # SVD components of the full matrix appended\nDECORR = 0.9          # skip a candidate correlated above this with one already picked\nET_SEEDS = 2          # ExtraTrees seeds the importance is averaged over\nRF_TREES = 500        # auxiliary RandomForest, blended in postprocess\nRF_CRIT = \"entropy\"   # best single auxiliary offline: 0.1398 vs 0.1410 for gini\nRF_WEIGHT = 0.05      # weight of the RF ranking; TabFM keeps 0.95\nSIDE = \".side_rf.npy\"\nDUMP = \"oof_dump.csv\"\nTAG = \"final\"\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import StratifiedKFold\n  y = np.asarray(y_train).ravel().astype(str)\n  return list(StratifiedKFold(N_FOLDS, shuffle=True, random_state=0).split(X_train, y))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _plain(df):\n  # pandas may hand back an arrow-backed column Index, which the judge cannot unpickle\n  df.columns = pd.Index([str(c) for c in df.columns], dtype=object)\n  return df\n\n\ndef _codes(y_train):\n  return pd.factorize(np.asarray(y_train).ravel().astype(str), sort=True)[0]\n\n\ndef _usable_cols(X_train):\n  \"\"\"Every descriptor except the id column, constants and exact duplicates on this fold.\"\"\"\n  cols = [c for c in X_train.columns if c != \"row_id\"]\n  A = X_train[cols].to_numpy(dtype=np.float64)\n  keep, seen = [], set()\n  for j, c in enumerate(cols):\n    v = A[:, j]\n    if v.min() == v.max():\n      continue\n    k = v.tobytes()\n    if k in seen:\n      continue\n    seen.add(k)\n    keep.append(c)\n  return keep\n\n\ndef _importance(A, y):\n  from sklearn.ensemble import ExtraTreesClassifier\n  imp = np.zeros(A.shape[1])\n  for seed in range(ET_SEEDS):\n    et = ExtraTreesClassifier(n_estimators=400, random_state=seed, n_jobs=-1,\n                              max_features=\"sqrt\", min_samples_leaf=2)\n    et.fit(A, y)\n    imp += et.feature_importances_\n  return imp\n\n\ndef _select(A, imp, k):\n  \"\"\"Top-k by importance, skipping anything too correlated with an already-picked column.\"\"\"\n  cand = np.argsort(-imp)[:min(A.shape[1], 4 * k)]\n  Z = A[:, cand].astype(np.float64)\n  Z = (Z - Z.mean(0)) / np.clip(Z.std(0), 1e-9, None)\n  picked = []\n  for j in range(len(cand)):\n    if picked and np.abs(Z[:, picked].T @ Z[:, j]).max() / len(Z) \u003e DECORR:\n      continue\n    picked.append(j)\n    if len(picked) == k:\n      break\n  return sorted(cand[picked].tolist())\n\n\ndef engineer(X_train, y_train, X_test):\n  from sklearn.decomposition import TruncatedSVD\n  from sklearn.ensemble import RandomForestClassifier\n  from sklearn.preprocessing import StandardScaler\n\n  cols = _usable_cols(X_train)\n  y = _codes(y_train)\n  A = X_train[cols].to_numpy(dtype=np.float32)\n  B = X_test[cols].to_numpy(dtype=np.float32)\n  single = len(np.unique(y)) \u003c 2          # only happens on `judge.py check`'s 150-row slice\n\n  imp = np.zeros(len(cols)) if single else _importance(A, y)\n  sel = [cols[i] for i in _select(A, imp, TOP_K)]\n  Xtr, Xte = [X_train[sel].reset_index(drop=True)], [X_test[sel].reset_index(drop=True)]\n\n  sc = StandardScaler().fit(np.vstack([A, B]))\n  svd = TruncatedSVD(N_SVD, random_state=0).fit(np.vstack([sc.transform(A), sc.transform(B)]))\n  names = [f\"svd{i}\" for i in range(N_SVD)]\n  Xtr.append(pd.DataFrame(svd.transform(sc.transform(A)), columns=names))\n  Xte.append(pd.DataFrame(svd.transform(sc.transform(B)), columns=names))\n\n  if not single:                          # second opinion, kept out of the context, merged in postprocess\n    rf = RandomForestClassifier(RF_TREES, criterion=RF_CRIT, n_jobs=-1, random_state=0)\n    rf.fit(A, y)\n    np.save(SIDE, rf.predict_proba(B)[:, 1].astype(np.float64))\n  return _plain(pd.concat(Xtr, axis=1)), _plain(pd.concat(Xte, axis=1))\n\n\ndef _rank(v):\n  return pd.Series(np.asarray(v, dtype=float)).rank(method=\"average\").to_numpy() / (len(v) + 1.0)\n\n\ndef _dump(pred, X_test, side):\n  \"\"\"My own record of TabFM's fold predictions; nothing downstream reads it.\"\"\"\n  try:\n    d = pd.DataFrame({\"tag\": TAG, \"row_id\": np.asarray(X_test[\"row_id\"]),\n                      \"tabfm\": np.asarray(pred[pred.columns[-1]], dtype=float)})\n    d[\"side\"] = np.asarray(side, dtype=float) if side is not None else np.nan\n    d.to_csv(DUMP, mode=\"a\", header=not os.path.exists(DUMP), index=False)\n  except Exception:\n    pass\n\n\ndef postprocess(pred, y_orig, X_test):\n  side = np.load(SIDE) if os.path.exists(SIDE) else None\n  if side is not None:\n    os.remove(SIDE)\n    if len(side) != len(pred):\n      side = None\n  _dump(pred, X_test, side)\n  if side is None or RF_WEIGHT \u003c= 0:\n    return pred\n  pos = pred.columns[-1]\n  blend = (1.0 - RF_WEIGHT) * _rank(pred[pos].to_numpy()) + RF_WEIGHT * _rank(side)\n  out = pred.copy()\n  out[pos] = blend\n  for c in out.columns:\n    if c != pos:\n      out[c] = 1.0 - blend\n  return out\n","readme":"# Bioresponse — final pipeline\n\n## What it does\n\nThe task is 1776 numeric molecular descriptors, 2500 training rows, scored as `1 - AUC`. The judge\naccepts at most 500 columns into TabFM's context, so the whole job is choosing what the frozen\nmodel gets to see. `engineer` ranks the descriptors by ExtraTrees impurity importance averaged over\ntwo seeds and walks that ranking greedily, skipping any candidate whose absolute correlation with an\nalready-picked column exceeds 0.9, until 220 raw descriptors are kept. To keep the ~1500 discarded\ncolumns from vanishing entirely, it standardises the full matrix over train+test features (no\nlabels) and appends 40 TruncatedSVD components of it — 260 columns in total. TabFM then predicts by\nin-context learning over those rows, with `n_feature_crosses='sqrt'` (the one ensemble knob that\nmoved the score). A RandomForest(entropy, 500 trees) fitted on all 1776 raw descriptors is trained\nalongside but deliberately kept *out* of the context — offered as a column it hurts badly, because\nthe cross-fitted train values do not match the full-fit test values — and instead its ranking is\nmixed into TabFM's ranking in `postprocess` with weight 0.05. `folds` is 5-fold stratified rather\nthan the judge's default 3-fold, so each fold's 2000 context rows sit closer to the 2500 the final\nrun fits. Validation numbers for this and for the couple of dozen variants that were tried and\nrejected are tabulated in the docstring at the top of `pipeline.py`.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`: the pipeline recomputes every derived artefact\n(importances, selection, SVD basis, auxiliary forest) inside `engineer` on each run, and the only\nfiles it names — `.side_rf.npy` and `oof_dump.csv` — it writes itself. It takes no time and no disk.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader could get wrong\n\n- **`.side_rf.npy` is intra-run state, not a cache.** `engineer` writes it, `postprocess` reads and\n  deletes it in the same pass. Do not run two passes concurrently in this directory, and do not\n  treat a leftover file as reusable — it would be silently ignored anyway if its length does not\n  match the current test block.\n- **`oof_dump.csv` is append-only and already exists here** from the search. Nothing downstream\n  reads it; it was written so blend weights and paired-bootstrap standard errors could be measured\n  offline against the training labels without spending evaluations. New runs append to it. Delete it\n  if you want a clean record.\n- **The blend weight is small on purpose.** `RF_WEIGHT = 0.05` is worth about 0.0001 here. Its\n  offline optimum was 0.15 at the 1667 context rows of a 3-fold split and 0.05 at 2000; since the\n  final fits 2500 rows and the RF's useful share shrinks as TabFM's context grows, 0.05 is the\n  conservative end of a flat curve, not a tuned peak.\n- **Most of the variant table is one plateau.** A paired bootstrap over the dumps puts the standard\n  error of a difference at roughly 0.0007–0.0013, i.e. larger than most of the gaps in the docstring.\n  Only the crosses and the small RF blend clearly survived, together worth about 0.001. Reading\n  individual entries there as ordered rankings would overfit the record.\n- **`engineer` has a degenerate branch.** When it sees a single class (only `judge.py check`'s\n  150-row slice does) it skips the importance model and the forest and selects on a zero importance\n  vector. That path exists to keep the free dry run working; it is not a prediction path."},{"id":"blood-transfusion-service-center","name":"blood-transfusion-service-center","short_name":"blood-transfusion-service-center","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.244169,"plain_note":null,"n_train":498,"n_test":250,"n_folds":30,"thresholds":null,"summary":"The task is 748 RFMT rows (recency, frequency, monetary, time) split 498 train / 250 test, scored as `1 - ROC-AUC`, so only the ordering of the predictions matters. The pipeline drops `TotalBloodDonated` — it is exactly `250 * NumberOfDonations` in every row, a duplicate column — and hands TabFM the three remaining raw counts unchanged.","score":0.24306,"gain_pct":0.454194,"medal":null,"category":"II","lines":93,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile', 'robust']","n_feature_crosses":"'sqrt'","n_svd_features":"'sqrt'"},"helper_functions":["_views","_partners","_rank01","_partner_score"],"helper_ranges":{"_views":[29,37],"_partners":[40,50],"_rank01":[53,55],"_partner_score":[58,69]},"hook_helpers":{"preprocess":[],"engineer":["_views","_partners","_rank01","_partner_score"],"postprocess":["_rank01"],"folds":[]},"hook_ranges":{"preprocess":[25,26],"engineer":[72,76],"postprocess":[79,93],"folds":[20,22]},"code":"import os\n\n# sklearn's OpenMP/BLAS pools hang in this sandbox; the hooks are single-threaded by design.\nfor _v in (\"OMP_NUM_THREADS\", \"OPENBLAS_NUM_THREADS\", \"MKL_NUM_THREADS\"):\n  os.environ.setdefault(_v, \"1\")\n\nimport numpy as np\n\nTABFM_KWARGS = {\n    \"norm_methods\": [\"none\", \"power\", \"quantile\", \"robust\"],\n    \"n_feature_crosses\": \"sqrt\",\n    \"n_svd_features\": \"sqrt\",\n}\n\nDROP = (\"TotalBloodDonated\",)     # exactly 250 * NumberOfDonations, in every row\nW_TABFM = 0.60                    # TabFM's share of the final ranking\nPARTNER_FILE = \".partner.npy\"     # engineer -\u003e postprocess: separate hook processes, no shared state\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  return list(RepeatedStratifiedKFold(n_splits=3, n_repeats=10, random_state=0).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _views(X):\n  \"\"\"Two feature views for the partner: the raw counts, and the counts plus RFMT quotients.\"\"\"\n  R = X[\"MonthsSinceLastDonation\"].to_numpy(float)      # months since last donation\n  F = X[\"NumberOfDonations\"].to_numpy(float)            # lifetime donation count\n  T = X[\"MonthsSinceFirstDonation\"].to_numpy(float)     # months since first donation\n  span = np.clip(T - R, 0.0, None)                      # length of the active window\n  gap = span / np.maximum(F - 1.0, 1.0)                 # mean interval between donations\n  raw = np.column_stack([R, F, T])\n  return raw, np.column_stack([raw, F / (T + 1.0), span, gap, R / (gap + 1.0)])\n\n\ndef _partners():\n  \"\"\"(view, estimator, weight within the partner). A fixed mix, not a fitted one -- see above.\"\"\"\n  from sklearn.ensemble import ExtraTreesClassifier\n  from sklearn.linear_model import LogisticRegression\n  from sklearn.pipeline import make_pipeline\n  from sklearn.preprocessing import QuantileTransformer\n  lr = make_pipeline(QuantileTransformer(n_quantiles=100, output_distribution=\"normal\"),\n                     LogisticRegression(C=3.0, max_iter=3000))\n  return [(1, ExtraTreesClassifier(n_estimators=600, min_samples_leaf=12, criterion=\"entropy\", random_state=3), 0.4),\n          (0, ExtraTreesClassifier(n_estimators=600, min_samples_leaf=10, max_features=0.5, random_state=1), 0.4),\n          (1, lr, 0.2)]\n\n\ndef _rank01(v):\n  from scipy.stats import rankdata\n  return rankdata(v) / (len(v) + 1.0)\n\n\ndef _partner_score(X_train, y_train, X_test):\n  \"\"\"Rank-averaged p(positive) from the non-TabFM models, fitted on this fold's training rows.\"\"\"\n  classes = np.sort(y_train.astype(str).unique())\n  if len(classes) \u003c 2 or len(X_test) \u003c 2:               # `check` slices a single-class head\n    return None\n  y = (y_train.astype(str).to_numpy() == classes[-1]).astype(int)\n  tr_v, te_v = _views(X_train), _views(X_test)\n  out = np.zeros(len(X_test))\n  for view, est, w in _partners():\n    est.fit(tr_v[view], y)\n    out += w * _rank01(est.predict_proba(te_v[view])[:, 1])\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  s = _partner_score(X_train, y_train, X_test)\n  np.save(PARTNER_FILE, np.asarray([]) if s is None else s)\n  return (X_train.drop(columns=[c for c in DROP if c in X_train.columns]),\n          X_test.drop(columns=[c for c in DROP if c in X_test.columns]))\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Move TabFM's ranking 40% of the way towards the partner's. AUC reads only the ordering.\"\"\"\n  if len(pred.columns) != 2 or len(pred) \u003c 2:\n    return pred\n  try:\n    s = np.load(PARTNER_FILE)\n  except OSError:\n    return pred\n  if len(s) != len(pred):\n    return pred\n  blend = W_TABFM * _rank01(pred.iloc[:, 1].to_numpy()) + (1.0 - W_TABFM) * _rank01(s)\n  out = pred.astype(float)      # keep pred's own column Index: rebuilding it from the\n  out.iloc[:, 1] = blend        # Arrow-backed class labels breaks the pickle back to the judge\n  out.iloc[:, 0] = 1.0 - blend\n  return out\n","readme":"# blood-transfusion-service-center — final pipeline\n\n## What it does\n\nThe task is 748 RFMT rows (recency, frequency, monetary, time) split 498 train / 250 test, scored\nas `1 - ROC-AUC`, so only the ordering of the predictions matters. The pipeline drops\n`TotalBloodDonated` — it is exactly `250 * NumberOfDonations` in every row, a duplicate column —\nand hands TabFM the three remaining raw counts unchanged. TabFM's ensemble is configured with a\nfour-way normalisation cycle (`none / power / quantile / robust`) plus both synthetic-feature\nknobs (`n_svd_features='sqrt'`, `n_feature_crosses='sqrt'`); with only three columns, a random\nrotation and a random cross are views no other ensemble member has, and those two knobs are where\nmost of the TabFM-side gain came from. Deriving RFMT ratios as *columns* consistently hurt, but the\nsame ratios help as *models*: alongside TabFM the pipeline fits a small fixed sklearn ensemble on\nthe same fold — two ExtraTrees (one entropy, one gini on the raw counts) and a\nQuantileTransformer + logistic regression — on a view that adds the quotients (donation rate,\nactive span, mean inter-donation gap, recency in gap units). Both sides are converted to\npercentile ranks and blended 60% TabFM / 40% partner; the blended rank is written back as the\npositive-class probability. TabFM stays the predictor and carries the majority weight (the two\nrankings correlate ~0.974, so the partner is a nudge, not a replacement).\n\n`folds()` is `RepeatedStratifiedKFold(3 splits, 10 repeats, seed 0)` = 30 folds, mirroring the\nTabArena protocol at 2/3 scale, because the judge's default single 3-fold CV had a fold spread\n(std 0.056) far wider than any effect being measured.\n\nScored result: `1-auc = 0.24306` on the held-out test split (30 TabArena folds), against the\npublished TabFM baselines of 0.244169 plain / 0.241016 ensemble.\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` has no precomputed inputs — it reads only the competition data the\njudge passes to its hooks, and the one file it names (`.partner.npy`) it writes itself as a\nper-fold channel from `engineer()` to `postprocess()`. `build.sh` therefore just prints that and\nexits 0: zero runtime, zero disk. There is no `final/build/` directory because the only file this\nrun ever wrote into the workspace was `pipeline.py`.\n\n    bash final/build.sh \u0026\u0026 python final/run.py     # writes final/submission.csv\n\nOne end-to-end run is on the order of a few minutes on a GPU node (the scored run took 201 s\nwall, of which ~105 s was preprocessing and ~33 s the TabFM forward passes, 8 estimators).\n\n## Things a reader could get wrong\n\n- **`.partner.npy` is scratch, not a cache.** A copy is sitting in the workspace from the last\n  run. Deleting it changes nothing; leaving a stale one changes nothing either, because\n  `postprocess()` compares its length to the number of prediction rows and returns TabFM's raw\n  ranking unchanged if they disagree. It does mean the pipeline is **not safe to run twice\n  concurrently in the same working directory** — two folds in flight would overwrite each other's\n  file.\n- **The blend is rank-space only.** The numbers written to the submission are percentile ranks,\n  not calibrated probabilities. That is correct for AUC and wrong for anything else.\n- **`sklearn` is forced single-threaded** at import time (`OMP_NUM_THREADS=1` etc.); the\n  OpenMP/BLAS pools hang in the judge's sandbox. The hooks are single-threaded by design and this\n  costs nothing at 498 rows.\n- **The partner is a fixed mix, not a fitted one.** The weights (0.4 / 0.4 / 0.2 within the\n  partner, 0.6 / 0.4 against TabFM) were chosen offline and deliberately not optimised by a greedy\n  weight search — that search scored better in-sample (0.23746 → 0.23864 out-of-sample) but did\n  not transfer between repeats.\n- **`run.py` refuses to overwrite a differing `pipeline.py` in the workspace.** The workspace copy\n  is the scored record; if the two ever diverge, reconcile them by hand rather than deleting one."},{"id":"churn","name":"churn","short_name":"churn","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.067433,"plain_note":null,"n_train":3333,"n_test":1667,"n_folds":9,"thresholds":null,"summary":"The prediction is made entirely by frozen TabFM in-context over the training rows; the pipeline only changes what those rows look like. Three things happen to the feature frame. First, the four `total_*_charge` columns are dropped: each is exactly its minutes column times a fixed per-second rate (day .170, eve .085, night .045, intl .270, residual under a cent of rounding), and exact duplicate columns are the one…","score":0.060965,"gain_pct":9.591743,"medal":null,"category":"I","lines":89,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"n_svd_features":"'sqrt'"},"helper_functions":["_feat","_summaries"],"helper_ranges":{"_feat":[25,30],"_summaries":[33,78]},"hook_helpers":{"preprocess":[],"engineer":["_feat","_summaries"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[21,22],"engineer":[81,85],"postprocess":[88,89],"folds":[15,18]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'n_svd_features': 'sqrt'}\n\nRATE = {'day': 0.17, 'eve': 0.085, 'night': 0.045, 'intl': 0.27}   # charge = minutes x rate, exactly\nCHARGE = [f'total_{p}_charge' for p in RATE]\nMINUTES = [f'total_{p}_minutes' for p in RATE]\nN_PCA = 2            # components handed to the context (4 was 0.0006 worse, 8 clearly worse)\nLDA_SHRINKAGE = 0.05\nLOGIT_C = 0.5\nSQUASH = 'rank'      # pass the two supervised directions through a sigmoid\n\n\ndef folds(X_train, y_train):\n  \"\"\"40 folds: the effects here are 0.001-0.003 against a 0.017 fold-to-fold spread.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  return list(RepeatedStratifiedKFold(n_splits=5, n_repeats=8, random_state=1).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _feat(X):\n  \"\"\"Raw columns minus the four charge duplicates, plus the two cross-column sums.\"\"\"\n  d = X.drop(columns=CHARGE)\n  d['total_charge'] = sum(X[f'total_{p}_minutes'] * r for p, r in RATE.items())\n  d['total_minutes'] = X[MINUTES].sum(axis=1)\n  return d\n\n\ndef _summaries(A, B, y):\n  \"\"\"Linear summaries of the whole row, fitted on this fold's training rows only.\n\n  Two unsupervised (the leading principal components) and two supervised (an LDA direction and a\n  logistic one, fitted on the frame the components have already been added to). All four are\n  low-variance enough that their values on the rows they were fitted on mean the same thing as\n  their values on the test rows - the property that separated them from the boosted-tree column and\n  the interaction logistic, both of which cost 0.007-0.008.\n  \"\"\"\n  from sklearn.decomposition import PCA\n  from sklearn.discriminant_analysis import LinearDiscriminantAnalysis\n  from sklearn.impute import SimpleImputer\n  from sklearn.linear_model import LogisticRegression\n  from sklearn.preprocessing import StandardScaler\n  def std(P, Q):\n    imp = SimpleImputer(strategy='median').fit(P)\n    sc = StandardScaler().fit(imp.transform(P))\n    return sc.transform(imp.transform(P)), sc.transform(imp.transform(Q))\n\n  a, b = std(A, B)\n  pca = PCA(n_components=N_PCA, random_state=0).fit(a)\n  pa, pb = pca.transform(a), pca.transform(b)\n  out = {f'pca{j}': (pa[:, j], pb[:, j]) for j in range(N_PCA)}\n  yb = (np.asarray(y).astype(str) == 'Yes').astype(int)\n  if yb.min() == yb.max():        # judge.py check runs on a 150-row slice that is all one class\n    zeros = (np.zeros(len(a)), np.zeros(len(b)))\n    return {**out, 'lda0': zeros, 'logit0': zeros}\n  A2, B2 = A.copy(), B.copy()               # each direction is fitted on the frame the previous\n  for name, (u, v) in out.items():          # ones have already been added to (eval 68: +0.0004\n    A2[name], B2[name] = u, v               # if they are all fitted on the base frame instead)\n  a, b = std(A2, B2)\n  lda = LinearDiscriminantAnalysis(solver='lsqr', shrinkage=LDA_SHRINKAGE).fit(a, yb)\n  out['lda0'] = (lda.decision_function(a), lda.decision_function(b))\n  A2['lda0'], B2['lda0'] = out['lda0']\n  a, b = std(A2, B2)\n  logit = LogisticRegression(C=LOGIT_C, max_iter=3000).fit(a, yb)\n  out['logit0'] = (logit.decision_function(a), logit.decision_function(b))\n  if SQUASH == 'rank':\n    for k in ('lda0', 'logit0'):\n      ref = np.sort(out[k][0])\n      out[k] = tuple(np.searchsorted(ref, v) / len(ref) for v in out[k])\n  elif SQUASH:\n    import scipy.special as sp\n    for k in ('lda0', 'logit0'):\n      out[k] = tuple(sp.expit(v) for v in out[k])\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  A, B = _feat(X_train), _feat(X_test)\n  for name, (a, b) in _summaries(A, B, y_train).items():\n    A[name], B[name] = a, b\n  return A, B\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# churn (TabArena) — final pipeline\n\n## What it does\n\nThe prediction is made entirely by frozen TabFM in-context over the training rows; the pipeline only\nchanges what those rows look like. Three things happen to the feature frame. First, the four\n`total_*_charge` columns are dropped: each is exactly its minutes column times a fixed per-second\nrate (day .170, eve .085, night .045, intl .270, residual under a cent of rounding), and exact\nduplicate columns are the one thing TabFM measurably disliked here. Second, the two sums no single\ncolumn can express are added back — `total_charge` and `total_minutes`. Third, four *linear summaries\nof the whole row* are appended, all fitted on the current fold's training rows only and applied to\nboth sides: the two leading principal components, then an LDA direction (lsqr, shrinkage 0.05) fitted\non the frame those components are already part of, then an L2 logistic direction (C=0.5) fitted on the\nframe including the LDA column. The two supervised directions are rank-transformed against the\ntraining-row distribution before being handed over, so their in-context values sit on the same scale\nas their test values. The only TabFM knob changed from default is `n_svd_features='sqrt'`, which gives\nroughly half the ensemble members random projections on top of the columns. `preprocess` and\n`postprocess` are the identity, and `tabfm_corr` is 1.000 — nothing blends into or overrides TabFM's\noutput.\n\nThe design constraint behind the summary columns is variance, not accuracy: a column may only be added\nif its value on the rows it was fitted on means the same thing as its value on unseen rows. That is\nwhat separated these four from the two strong-but-overfit alternatives that were tried and rejected —\na stacked GBDT column (+0.008) and a logistic on all 231 pairwise interactions (+0.007).\n\nValidation used `RepeatedStratifiedKFold(5 × 8, seed 1)` = 40 folds, because the fold-to-fold spread\n(~0.017) is an order of magnitude larger than the effects being chased (0.001–0.003); every decision\nabove is a paired comparison across those 40 folds. Score on them: 0.07341 identity → 0.07109 base\nfeatures → 0.06486 this pipeline (1 − ROC-AUC, lower is better).\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`. The pipeline reads no files and names no paths —\nevery derived column, including the fitted PCA/LDA/logistic directions, is computed inside the hooks\nfrom the frames the judge passes in, per fold. No caches, no artifacts, no disk, no time.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader could get wrong\n\n- **The summaries are refitted per call, not once.** `engineer()` fits PCA, LDA and the logistic on\n  whatever `X_train` it is handed. During CV that is the fold's training rows; at test time it is the\n  full training set. This is deliberate — it is what keeps the columns honest — but it means the\n  feature frame is not reproducible from a saved artifact, and a run costs one PCA + one LDA + one\n  logistic fit on ~3k × 21 (milliseconds) on top of the TabFM pass.\n- **`_summaries` has a degenerate branch.** If the labels handed in are all one class, the two\n  supervised columns are filled with zeros. That exists only so `python judge.py check`, which runs a\n  150-row slice, does not crash; it never fires on real data.\n- **`SQUASH = 'rank'`** despite the neighbouring comment saying \"sigmoid\". Both were measured and tied\n  (0.06499 vs 0.06502); rank is what the constant selects and what ran.\n- **`final/build/cmp.py`** is not part of the pipeline. It is the analysis helper used during the run\n  to compute paired diffs between `[RESULT n]` lines in `log.txt`; it needs `log.txt`, not the data.\n- The header docstring of `pipeline.py` is the full experiment record for the run — 73 evaluations,\n  including everything that did not work. It is worth more than this README if you intend to keep\n  searching."},{"id":"coil2000_insurance_policies","name":"coil2000_insurance_policies","short_name":"coil2000_insurance_policies","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.212434,"plain_note":null,"n_train":6548,"n_test":3274,"n_folds":9,"thresholds":null,"summary":"TabFM predicts, unmodified: `TABFM_KWARGS` is empty, because all sixteen constructor knobs were measured one at a time during the run and none of them beat the shipped defaults. Everything the pipeline does is to the table TabFM reads.","score":0.212748,"gain_pct":-0.147811,"medal":null,"category":"II","lines":112,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","folds"],"tabfm_kwargs":{},"helper_functions":["_decode","_counts","_rare_count_cols"],"helper_ranges":{"_decode":[50,58],"_counts":[65,87],"_rare_count_cols":[90,98]},"hook_helpers":{"preprocess":["_decode"],"engineer":["_counts","_rare_count_cols"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[61,62],"engineer":[101,108],"postprocess":[111,112],"folds":[43,47]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {}\n\nN_SPLITS, N_REPEATS, FOLD_SEED = 4, 3, 12345\nDROP_RARE_COUNTS = 0.05        # drop numberOf* for products held by fewer than 5% of rows\nEXTRA_COUNTS = ()              # an 18th count: measured, adds nothing (evals 81-83)\n\n# --- the three string-coded ordinals, back onto the scale their sibling columns use ---\nAGE = {'20-30 years': 1, '30-40 years': 2, '40-50 years': 3,\n       '50-60 years': 4, '60-70 years': 5, '70-80 years': 6}\nPCT = {'0%': 0, '1 - 10%': 1, '11 - 23%': 2, '24 - 36%': 3, '37 - 49%': 4,\n       '50 - 62%': 5, '63 - 75%': 6, '76 - 88%': 7, '89 - 99%': 8, '100%': 9}\nL4 = {'f 0': 0, 'f 1 - 49': 1, 'f 50 - 99': 2, 'f 100 - 199': 3, 'f 200 - 499': 4,\n      'f 500 - 999': 5, 'f 1000 - 4999': 6, 'f 5000 - 9999': 7,\n      'f 10000 - 19999': 8, 'f 20000 - ?': 9}\nORDINAL = {'avgAge': AGE, 'romanCatholic': PCT,\n           'contributionPrivateThirdPartyInsurance': L4}\nNOMINAL = ['customerSubtype', 'customerMainType']\n\n# the 36 M* columns that are percentage-of-neighbourhood bands (the rest of the M* block are\n# counts, ages or purchasing-power classes and are left alone), by the ladder they belong to\nSOCIO_GROUPS = {\n    'religion': ['romanCatholic', 'protestant', 'otherReligion', 'noReligion'],\n    'marital': ['married', 'livingTogether', 'otherRelation', 'singles'],\n    'children': ['householdWithoutChildren', 'householdWithChildren'],\n    'education': ['highLevelEducation', 'mediumLevelEducation', 'lowerLevelEducation'],\n    'occupation': ['highStatus', 'entrepreneur', 'farmer', 'middleManagement',\n                   'skilledLabourers', 'unskilledLabourers'],\n    'class': ['socialClassA', 'socialClassB1', 'socialClassB2', 'socialClassC', 'socialClassD'],\n    'housing': ['rentedHouse', 'homeOwners'],\n    'car': ['oneCar', 'twoCars', 'noCar'],\n    'health': ['nationalHealthService', 'privateHealthInsurance'],\n    'income': ['incomeLessThan30k', 'income30To45k', 'income45To75k', 'income75To122k',\n               'incomeAbove123k'],\n}\nPCT_COLS = [c for g in SOCIO_GROUPS.values() for c in g]\nINCOME = SOCIO_GROUPS['income']\nEDU = SOCIO_GROUPS['education']\n\n\ndef folds(X_train, y_train):\n  \"\"\"12 folds: every training row is validated three times, on three different partitions.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=N_SPLITS, n_repeats=N_REPEATS, random_state=FOLD_SEED)\n  return list(rskf.split(X_train, y_train))\n\n\ndef _decode(X):\n  X = X.copy()\n  for c, m in ORDINAL.items():\n    if c in X.columns:\n      X[c] = pd.Series(X[c], index=X.index).map(m).astype('float64')\n  for c in NOMINAL:                    # arrow-backed strings do not survive the hook pickle\n    if c in X.columns:\n      X[c] = X[c].astype(object)\n  return X\n\n\ndef preprocess(X_train, y_train, X_test):\n  return _decode(X_train), y_train, _decode(X_test)\n\n\ndef _counts(X):\n  \"\"\"The 17 row-wise counts, in the order they are appended to the table.\"\"\"\n  P = [c for c in X.columns if c.startswith('contribution')]\n  A = [c for c in X.columns if c.startswith('numberOf') and c != 'numberOfHouses']\n  a = X[A].to_numpy('float64')\n  pc = X[[c for c in PCT_COLS if c in X.columns]].to_numpy('float64')\n  F = {}\n  F['agg_nProducts'] = (a \u003e 0).sum(1)                 # distinct products held\n  F['agg_nZeroPct'] = (pc == 0).sum(1)                # how narrow the zip profile is\n  F['agg_nHighPct'] = (pc \u003e= 5).sum(1)                # how many bands it dominates\n  F['agg_nIncomeBands'] = (X[INCOME].to_numpy('float64') \u003e 0).sum(1)\n  F['agg_nEduBands'] = (X[EDU].to_numpy('float64') \u003e 0).sum(1)\n  for name, cols in SOCIO_GROUPS.items():             # spread of each ladder\n    g = [c for c in cols if c in X.columns]\n    F['agg_nb_' + name] = (X[g].to_numpy('float64') \u003e 0).sum(1)\n  F['agg_nPolicies'] = a.sum(1)\n  F['agg_policiesPerProduct'] = F['agg_nPolicies'] / np.maximum(F['agg_nProducts'], 1)\n  p = X[P].to_numpy('float64')\n  for e in EXTRA_COUNTS:\n    F['agg_' + e] = {'nContribTypes': lambda: (p \u003e 0).sum(1),\n                     'nVeryHighPct': lambda: (pc \u003e= 8).sum(1),\n                     'nMulti': lambda: (a \u003e= 2).sum(1)}[e]()\n  return {k: np.asarray(v, dtype='float64') for k, v in F.items()}\n\n\ndef _rare_count_cols(X):\n  \"\"\"numberOf* halves of the product pairs that are almost always zero.\"\"\"\n  out = []\n  for c in X.columns:\n    if c.startswith('contribution'):\n      a = 'numberOf' + c[len('contribution'):]\n      if a in X.columns and float((X[c].to_numpy('float64') != 0).mean()) \u003c DROP_RARE_COUNTS:\n        out.append(a)\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  Ztr, Zte = X_train.copy(), X_test.copy()\n  for k, v in _counts(X_train).items():   # assign, never concat: concat rebuilds string arrays\n    Ztr[k] = v\n  for k, v in _counts(X_test).items():\n    Zte[k] = v\n  drop = _rare_count_cols(X_train)\n  return Ztr.drop(columns=drop), Zte.drop(columns=drop)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# COIL2000 / MobileHomePolicy — final pipeline\n\nMetric: 1 − ROC-AUC, lower is better. Final validation score 0.21445 (12-fold), against 0.22008 for\nthe identity pipeline.\n\n## What the pipeline does\n\nTabFM predicts, unmodified: `TABFM_KWARGS` is empty, because all sixteen constructor knobs were\nmeasured one at a time during the run and none of them beat the shipped defaults. Everything the\npipeline does is to the table TabFM reads.\n\nThree columns arrive as decoded strings (`avgAge`, `romanCatholic`,\n`contributionPrivateThirdPartyInsurance`) even though their sibling columns carry the same ordinal\nscales as plain integers; `preprocess` maps them back onto that numeric scale, so a ladder is\ncontiguous rather than half-categorical. `engineer` then appends seventeen row-wise **count**\ncolumns and drops nothing else. The table already states, per product, how much a household\ncontributes and how many policies it holds, and per zip-code ladder what share of the neighbourhood\nsits in each band — but never *how many* products the household holds, or across how many bands a\nladder spreads. Those cross-column counts are the one summary an attention-over-rows model cannot\nform from a single row, and they are essentially the entire gain (removing them costs +0.006). The\ncounts are: distinct products held, total policies, policies per product, how many of the 36\npercentage columns are zero and how many are ≥5, how many income and education bands are occupied,\nand the band spread of each of the ten socio-economic ladders. Finally, for each product held by\nfewer than 5% of households the `numberOf*` half of the pair is dropped — it correlates 0.86–0.98\nwith the contribution half and adds nothing for rare products.\n\n`folds()` overrides the judge's default 3-fold CV with `RepeatedStratifiedKFold(4 × 3)`. At a 6%\npositive rate the per-fold std is ~0.010, so 12 folds are what make the paired per-fold comparison\nsharp enough (SE ≈ 0.0004) to separate a real effect from a re-roll of TabFM's ensemble. `postprocess`\nis the identity — AUC is invariant to any monotone rescaling of the scores.\n\nThe docstring at the top of `pipeline.py` is the fuller record: what was tried, what it scored, and\nwhich of the small edits were ablated more than once.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a documented no-op that echoes one line and exits 0.\n\nThe pipeline names no file at all — its hooks operate only on the DataFrames the judge hands them,\nand the judge loads those from `data/train.csv` and `data/test.csv` itself. There are no caches, no\nprecomputed features, no auxiliary models, and the run wrote no helper scripts (every experiment was\nan edit to `pipeline.py` followed by `python judge.py val`), which is why `final/build/` is empty.\nRuntime: instant. Disk: zero.\n\n## Things a reader could get wrong\n\n- **The reproduction is still not bit-identical.** `run.py` runs one frozen TabFM pass with\n  `judge.estimators_final` estimators; validation used 8. Ensemble member ordering re-rolls, and this\n  task's re-roll floor is ~0.002 in the metric — bigger than several of the deliberate design\n  decisions recorded in the docstring. Do not read a small delta against 0.21445 as a bug.\n- **Any edit that changes the emitted column count re-rolls that ensemble.** This is measured, not\n  suspected: eval 22 wrote the same two normalisers in the other order — statistically the identical\n  ensemble — and moved the score 0.0014 with 10 of 12 folds agreeing in sign. It is the resolution\n  limit on everything below ~0.002.\n- **`engineer` assigns columns one at a time on purpose.** `pd.concat` rebuilds the frame and\n  destroys the object-dtype string columns that `_decode` deliberately preserves; likewise `_decode`\n  casts the two nominal columns to `object` because arrow-backed strings do not survive the pickle\n  the judge uses to cross the hook boundary. Neither line is stylistic.\n- **The 0.05 rare-product cut sits just under life insurance (5.2%).** A CV fold whose training rows\n  fall slightly short of that drops a seventeenth column, so the cut is mildly fold-dependent. Moving\n  it to 0.04 — identical on the full training set — was measured (0.21462 vs 0.21451) and rejected;\n  both are the same model on the full data.\n- **`EXTRA_COUNTS` and the band-midpoint rescaling look like unfinished work; they are not.** Both\n  were implemented, measured repeatedly and removed. The apparent gain from an 18th count in evals\n  78–80 was an artifact of `DROP_RARE_COUNTS` having been left at 0 from the preceding ablation.\n- **`run.py` refuses to run if `\u003cworkspace\u003e/pipeline.py` differs from `final/pipeline.py`.** They are\n  identical as shipped; if you edit one, reconcile both."},{"id":"concrete_compressive_strength","name":"concrete_compressive_strength","short_name":"concrete_compressive_strength","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":3.986323,"plain_note":null,"n_train":686,"n_test":344,"n_folds":30,"thresholds":null,"summary":"The pipeline is a pure feature representation for TabFM: the frozen model makes the prediction in-context over the training rows, with default ensemble settings (`TABFM_KWARGS = {}`), no row sampling, no target transform and no post-processing.","score":3.816901,"gain_pct":4.250082,"medal":null,"category":"I","lines":38,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{},"helper_functions":["_feat"],"helper_ranges":{"_feat":[16,30]},"hook_helpers":{"preprocess":[],"engineer":["_feat"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[12,13],"engineer":[33,34],"postprocess":[37,38],"folds":[6,9]},"code":"import numpy as np\n\nTABFM_KWARGS = {}\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedKFold\n  rkf = RepeatedKFold(n_splits=10, n_repeats=14, random_state=0)\n  return list(rkf.split(X_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _feat(d):\n  d = d.copy()\n  binder = d['Cement'] + d['BlastFurnaceSlag'] + d['FlyAsh']\n  d['ceff'] = d['Cement'] + 1.0 * d['BlastFurnaceSlag'] + 0.4 * d['FlyAsh']\n  d['binder'] = binder\n  d['water_cement'] = d['Water'] / d['Cement']\n  d['water_binder_vol'] = d['Water'] / (d['Cement'] / 3.15 + d['BlastFurnaceSlag'] / 2.90\n                                        + d['FlyAsh'] / 2.30)\n  d['log_age'] = np.log(d['Age'])\n  agg = d['CoarseAggregate'] + d['FineAggregate']\n  d['agg_total'] = agg\n  d['fine_frac'] = d['FineAggregate'] / agg\n  d['sp_binder'] = d['Superplasticizer'] / binder\n  return d.drop(columns=['CoarseAggregate', 'FineAggregate', 'Superplasticizer', 'Cement',\n                         'BlastFurnaceSlag'])\n\n\ndef engineer(X_train, y_train, X_test):\n  return _feat(X_train), _feat(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# concrete_compressive_strength — final pipeline\n\n## What it does\n\nThe pipeline is a pure feature representation for TabFM: the frozen model makes the prediction\nin-context over the training rows, with default ensemble settings (`TABFM_KWARGS = {}`), no row\nsampling, no target transform and no post-processing. All of the work is in `engineer`, which\nreplaces the eight raw mix-design columns with a twelve-column concrete-chemistry view. Cement,\nblast-furnace slag and fly ash are folded into two cementitious aggregates — the plain binder mass\nand an efficiency-weighted `ceff` (slag at 1.0, fly ash at 0.4, coefficients chosen by a scan over\nthe published range) — and the water content is expressed as ratios rather than an absolute mass:\n`water/cement` and a volumetric `water/binder` using the specific gravities 3.15 / 2.90 / 2.30.\nAge enters as `log(Age)`, since strength gain is logarithmic in curing time. The two aggregate\nmasses become a total and a fine fraction, and superplasticizer becomes a dose relative to binder.\nThe five columns that are then fully carried by these derived features — CoarseAggregate,\nFineAggregate, Superplasticizer, Cement and BlastFurnaceSlag — are dropped; the last two were\nremoved on paired evidence across repeated CV folds late in the run, each confirmed on two seeds.\n\nValidation used `RepeatedKFold(n_splits=10, n_repeats=14, random_state=0)`, so column decisions of\nthis size (~0.01 RMSE) could be judged as paired differences over 140 folds rather than as a single\nCV number. Rows are exchangeable here — no time or group structure — so plain repeated K-fold\nmirrors the test split. Reference validation RMSE for the 12-column model: 3.72740.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`: `pipeline.py` has no prerequisites — it reads\nno caches, no fitted artifacts and no derived tables, only the DataFrames the judge passes in. It\nruns instantly and needs no disk.\n\n## Things a reader could get wrong\n\n- **`final/build/` is not a data-building directory.** `setk.py` and `cmp.py` are search-loop\n  tooling (rewriting the pipeline's docstring/kwargs, and running a paired t-test over `log.txt`\n  fold vectors). They are preserved for the record and are deliberately not called by `build.sh`.\n- **`water_cement` divides by raw Cement, which is dropped afterwards.** The column disappears from\n  the model but is still needed inside `_feat`; the drop happens last, on purpose.\n- **`water_cement` and `sp_binder` can be infinite in principle.** Nothing in this dataset has zero\n  cement or zero binder, so the guard was never needed and never added. A different mix table could\n  produce `inf` here.\n- **The docstring at the top of `pipeline.py` is the intent note for evaluation 80**, the last one\n  the budget allowed — it describes the BlastFurnaceSlag removal as a live hypothesis, written\n  before that evaluation ran. It is a lab-notebook entry, not a description of the final result;\n  the code below it is what was scored."},{"id":"credit-g","name":"credit-g","short_name":"credit-g","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.194169,"plain_note":null,"n_train":666,"n_test":334,"n_folds":30,"thresholds":null,"summary":"The predictor is frozen TabFM, in context over all 666 training rows; the pipeline's whole job is to change how the German-credit table is *represented* before TabFM attends over it. Ten of the thirteen non-numeric columns encode something ordered — how much is in the checking account, how much is saved, how long the job has lasted, how the past credits went, what property is owned, who else is liable, what other…","score":0.193985,"gain_pct":0.094763,"medal":null,"category":"II","lines":75,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"permute_categorical":"True","n_svd_features":"'sqrt'","n_feature_crosses":"'sqrt'","norm_methods":"['none', 'power', 'quantile', 'robust']"},"helper_functions":["_ordinalise"],"helper_ranges":{"_ordinalise":[46,52]},"hook_helpers":{"preprocess":[],"engineer":["_ordinalise"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[42,43],"engineer":[55,71],"postprocess":[74,75],"folds":[37,39]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'permute_categorical': True, 'n_svd_features': 'sqrt', 'n_feature_crosses': 'sqrt',\n                'norm_methods': ['none', 'power', 'quantile', 'robust']}\n\n# Risk orderings, ascending: the direction the Statlog attribute is defined in, and for the\n# three-level columns the safest level first. credit_history's two middle levels are the one place\n# this run overrules that reading (see the header).\nORD = {\n    'checking_status': ['\u003c0 DM', '0 \u003c= ... \u003c 200 DM',\n                        '\u003e= 200 DM / salary assignments for \u003e= 1 year', 'no checking account'],\n    'savings_status': ['\u003c 100 DM', '100 \u003c= ... \u003c 500 DM', '500 \u003c= ... \u003c 1000 DM',\n                       '\u003e= 1000 DM', 'unknown / no savings'],\n    'employment_since': ['unemployed', '\u003c 1 year', '1 \u003c= ... \u003c 4 years',\n                         '4 \u003c= ... \u003c 7 years', '\u003e= 7 years'],\n    'credit_history': ['no credits taken / all paid duly', 'all credits at this bank paid duly',\n                       'delay in paying off in past', 'existing credits paid duly till now',\n                       'critical account / other credits existing'],\n    'property': ['real estate', 'building society savings / life insurance',\n                 'car or other (not savings)', 'unknown / no property'],\n    'other_debtors': ['guarantor', 'none', 'co-applicant'],\n    'other_installment_plans': ['none', 'stores', 'bank'],\n    'housing': ['rent', 'for free', 'own'],\n    'telephone': ['none', 'yes, registered'],\n    'foreign_worker': ['no', 'yes'],\n}\nRARE_FRAC = 35 / 599.0   # credit_purpose levels rarer than this share of a fold's training rows are\n                         # folded into 'other'. It is 35 rows at the 599 a validation fold gives,\n                         # which is what was tuned (20 costs +0.0022, 65 costs +0.0015), and it\n                         # scales to ~39 at the 666 the real folds train on. That matters: the\n                         # level it has to separate from 'business' (~68 rows there) is 'education',\n                         # ~33 +- 5 rows, so a fixed 35 would leave education out of 'other' in\n                         # roughly a third of the final's folds and silently do the worse thing.\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  return list(RepeatedStratifiedKFold(n_splits=10, n_repeats=10, random_state=0).split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _ordinalise(X):\n  \"\"\"Ordered categoricals -\u003e their rank on that ordering, in place.\"\"\"\n  X = X.copy()\n  for c, order in ORD.items():\n    if c in X.columns:\n      X[c] = X[c].astype(str).map({v: float(i) for i, v in enumerate(order)})\n  return X\n\n\ndef engineer(X_train, y_train, X_test):\n  A, B = _ordinalise(X_train), _ordinalise(X_test)\n  for f in (A, B):                                 # the two smallest male levels (35 and 57 rows)\n    v = f['personal_status_sex'].to_numpy(dtype=object)      # say the same thing: not single\n    f['personal_status_sex'] = np.array(['male: not single' if str(x).startswith('male') and\n                                         'single' not in str(x) else x for x in v], dtype=object)\n  for c in ('credit_purpose',):\n    va, vb = A[c].to_numpy(dtype=object), B[c].to_numpy(dtype=object)\n    vc = pd.Series(va).value_counts()\n    rare = set(vc[vc \u003c RARE_FRAC * len(va)].index)   # decided on the training rows, applied to both\n    if rare:\n      A[c] = np.array(['other' if v in rare else v for v in va], dtype=object)\n      B[c] = np.array(['other' if v in rare else v for v in vb], dtype=object)\n  for c in A.columns:                              # a string column built here comes out arrow-backed\n    if not pd.api.types.is_numeric_dtype(A[c]):    # and the judge process cannot unpickle that;\n      A[c], B[c] = A[c].astype(object), B[c].astype(object)      # plain object survives the trip\n  return A, B\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# credit-g — final pipeline\n\n## What it does\n\nThe predictor is frozen TabFM, in context over all 666 training rows; the pipeline's whole job is to\nchange how the German-credit table is *represented* before TabFM attends over it. Ten of the thirteen\nnon-numeric columns encode something ordered — how much is in the checking account, how much is\nsaved, how long the job has lasted, how the past credits went, what property is owned, who else is\nliable, what other instalment plans run, how the applicant is housed, whether there is a telephone,\nwhether the applicant is a foreign worker — but reach the model as unordered appearance codes.\n`engineer` replaces each in place by its rank on a fixed risk ordering, so they arrive as monotone\nnumerics (the one place the data overrules the canonical reading is `credit_history`, where\n\"delay in paying off in past\" is coded below \"existing credits paid duly till now\" to keep the column\nmonotone in bad rate). The three genuinely unordered columns stay categorical, with their sparse\nlevels merged: `credit_purpose` folds every level rarer than 35/599 of the training rows into\n`other` — decided on the training rows only, expressed as a share so it scales to the real fold size —\nand `personal_status_sex` merges its two smallest male levels into `male: not single`; `job` is left\nuntouched. `TABFM_KWARGS` then turns on every view-diversity device the model offers: per-member\npermutation of the categorical codes, sqrt(n) random feature crosses and sqrt(n) SVD components for\nhalf the members, and four normalisations cycled across the eight members instead of two.\n`preprocess`, `sample` and `postprocess` are the identity — every training row stays in context and\nTabFM's own ranking is what is submitted. `folds` replaces the judge's 3-fold CV with repeated\nstratified 10-fold (10 repeats), because the 3-fold spread (std 0.028) is far larger than any effect\nworth measuring here. On those 100 splits this pipeline scores 0.17996 (1 − ROC-AUC, lower is better)\nagainst 0.19707 for the identity pipeline, paired t = 10.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`: the pipeline reads no files and needs no caches,\nfitted artefacts or derived tables — every constant it uses is a literal in `pipeline.py`, and the\ndata arrives through the judge. It runs instantly and needs no disk.\n\nReproduce with:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\nThe cost is one TabFM pass over 666 training rows with `judge.estimators_final` members; the dataset\nis tiny, so this is minutes on a GPU, not hours.\n\n## Things a reader could get wrong\n\n- **`final/build/` is not build machinery.** Those three scripts were the run's analysis and editing\n  helpers, and `build.sh` deliberately does not call them. `local.py` is a sklearn-only sanity check\n  used to sketch feature ideas cheaply, `cmp.py` does paired t-tests between two `[RESULT n]` fold\n  arrays in `log.txt`. `setkw.py` **rewrites `pipeline.py` in place** — running it now would edit the\n  scored pipeline. All three assume the workspace root as their cwd.\n- **The `credit_history` ordering is intentional, not a typo.** It contradicts the canonical Statlog\n  reading; it is worth −0.0017 at t = −2.65 because it makes the column monotone in bad rate. The\n  same inversion applied to `employment_since` and `savings_status` made things worse, so those keep\n  the canonical order.\n- **`RARE_FRAC` is a share, not a count, on purpose.** At the 599 rows a validation fold gives it is\n  exactly 35 rows (the tuned value); at the 666 the final trains on it becomes ~39. The level it has\n  to decide about, `education`, has ~33 ± 5 rows, so a hard-coded 35 would fold it only about two\n  thirds of the time in the real folds — and not folding it costs +0.0022.\n- **`engineer` casts its string columns back to `object` on the way out.** That is not cosmetic: a\n  string column built here comes out arrow-backed and the judge process cannot unpickle that.\n- **The scores quoted above are on this pipeline's own 100-split CV**, not on the judge's default\n  3-fold and not on the held-out test split."},{"id":"credit_card_clients_default","name":"credit_card_clients_default","short_name":"credit_card_clients_default","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.206832,"plain_note":null,"n_train":20000,"n_test":10000,"n_folds":9,"thresholds":null,"summary":"TabFM makes the prediction; the pipeline only changes how the credit-card table is written down for it and how its ensemble is configured. The feature work is a single re-expression of the monetary columns into ratios, so that a row is described by how much of its own credit line it is using rather than by raw New Taiwan dollars: the six `BILL_AMT` columns become utilisation `BILL_AMT_i / LIMIT_BAL`, kept as a level…","score":0.207268,"gain_pct":-0.210799,"medal":null,"category":"II","lines":47,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","norm_methods":"['none', 'power', 'quantile', 'robust', 'quantile_rtdl']","class_shift":"False","outlier_threshold":"3.0","average_logits":"False"},"helper_functions":[],"helper_ranges":{},"hook_helpers":{"preprocess":[],"engineer":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[18,19],"engineer":[26,47],"postprocess":[22,23],"folds":[12,15]},"code":"import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import StratifiedKFold\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt', 'norm_methods': ['none', 'power', 'quantile', 'robust', 'quantile_rtdl'], 'class_shift': False, 'outlier_threshold': 3.0, 'average_logits': False}\n\nPAY = ['PAY_0', 'PAY_2', 'PAY_3', 'PAY_4', 'PAY_5', 'PAY_6']\nBILL = [f'BILL_AMT{i}' for i in range(1, 7)]\nAMT = [f'PAY_AMT{i}' for i in range(1, 7)]\n\n\ndef folds(X_train, y_train):\n  y = np.asarray(y_train).ravel()\n  skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=0)\n  return list(skf.split(np.zeros(len(y)), y))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n\n\ndef engineer(X_train, y_train, X_test):\n  def f(X):\n    X = X.copy()\n    B = X[BILL].values.astype(np.float64)\n    A = X[AMT].values.astype(np.float64)\n    L = X['LIMIT_BAL'].values.astype(np.float64)\n    U = B / L[:, None]\n    X[BILL[0]] = U[:, 0]\n    X[BILL[5]] = U[:, 5]\n    for i in range(1, 5):\n      X[BILL[i]] = U[:, i - 1] - U[:, i]\n    for i, c in enumerate(AMT):\n      denom = np.maximum(B[:, i + 1], 1.0) if i \u003c 5 else L\n      X[c] = np.clip(A[:, i] / denom, 0.0, 1.75)\n    e = X['EDUCATION'].values.astype(np.int64).copy()\n    e[(e == 0) | (e \u003e= 4)] = 4\n    X['EDUCATION'] = e\n    m = X['MARRIAGE'].values.astype(np.int64).copy()\n    m[m == 0] = 3\n    X['MARRIAGE'] = m\n    return X\n  return f(X_train), f(X_test)\n","readme":"# credit_card_clients_default — final pipeline\n\n## What it does\n\nTabFM makes the prediction; the pipeline only changes how the credit-card table is written down for\nit and how its ensemble is configured. The feature work is a single re-expression of the monetary\ncolumns into ratios, so that a row is described by how much of its own credit line it is using rather\nthan by raw New Taiwan dollars: the six `BILL_AMT` columns become utilisation `BILL_AMT_i /\nLIMIT_BAL`, kept as a level for the newest and oldest month and as month-over-month *changes* in\nutilisation for the four in between; the six `PAY_AMT` columns become the share of the previous\nmonth's bill that was actually paid (`PAY_AMT_i / max(BILL_AMT_{i+1}, 1)`, and against `LIMIT_BAL` for\nthe oldest, where no earlier bill exists), clipped at 1.75 so that one-off large repayments do not\nstretch the scale for everyone else. The two categoricals get their undocumented codes folded into\nthe documented ones (`EDUCATION` 0 and 4+ → \"other\", `MARRIAGE` 0 → \"other\"). The `PAY_*` repayment\nstatus columns, `LIMIT_BAL`, and the demographics pass through untouched. `preprocess` and\n`postprocess` are identity; the ensemble knobs (`TABFM_KWARGS`) do the rest — sqrt feature crosses,\nfive different input normalisations across ensemble members (`none`, `power`, `quantile`, `robust`,\n`quantile_rtdl`), class shift off, outlier clipping at 3 sigma, and averaging member **probabilities**\nrather than logits. `folds()` is a plain 5-fold stratified split (shuffled, seed 0): the rows are\nexchangeable, there is no time or group structure to mirror. Metric is 1 − AUC, lower is better.\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` reads no files — every hook is a pure function of the DataFrames the\njudge passes in, with no cached features, no offline-fitted model, no auxiliary artifact.\n`bash final/build.sh` prints one line and exits 0 in well under a second, and needs no disk. It\nexists only so that `bash final/build.sh \u0026\u0026 python final/run.py` works as documented.\n\nThe real cost is `python final/run.py`: one frozen TabFM pass per ensemble member (8 members by\ndefault, `judge.estimators_final`) over the full training set as in-context rows, on a GPU. That is\nminutes, not hours, at this table's size (~24k rows, 23 columns), and writes `final/submission.csv`.\n\n## Things a reader could get wrong\n\n- **`final/build/` does not exist for this run.** The run's two helper scripts, `sweep.py` and\n  `runvars.py`, were search drivers — they rewrote `pipeline.py` to a candidate variant, ran\n  `judge.py check` / `judge.py val`, and printed the RESULT line. They built no data and are not part\n  of reproducing the result; both were deleted at the end of the run, so there was nothing to copy.\n- **The column names are reused, not added to.** `engineer` overwrites `BILL_AMT1..6` and\n  `PAY_AMT1..6` in place with the derived ratios, so the frame keeps its original width and a column\n  called `BILL_AMT3` in the output is a *change in utilisation*, not a bill amount. The feature count\n  TabFM sees is unchanged from the raw data.\n- **`BILL_AMT2..5` are differences, `BILL_AMT1` and `BILL_AMT6` are levels.** This is deliberate and\n  slightly asymmetric: the loop writes `U[:, i-1] - U[:, i]` for `i` in 1..4, i.e. into `BILL_AMT2`\n  through `BILL_AMT5`.\n- **`average_logits: False` matters.** Averaging probabilities instead of logits across the five\n  normalisation variants was one of the knobs that moved the score; it is not a default.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` (they are identical here) and\n  calls the same `judge.load_task` / `judge.run_pipeline` used during the run, so the reproduction\n  cannot drift from what was scored."},{"id":"customer_satisfaction_in_airline","name":"customer_satisfaction_in_airline","short_name":"customer_satisfaction_in_airline","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.003939,"plain_note":null,"n_train":86586,"n_test":43294,"n_folds":9,"thresholds":null,"summary":"The prediction is made entirely by the frozen TabFM in-context learner over the raw training rows; the pipeline around it is deliberately minimal, because on this task every attempt to add structure lost to leaving the columns alone.","score":0.003814,"gain_pct":3.173394,"medal":null,"category":"II","lines":31,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["engineer","sample"],"tabfm_kwargs":{"max_num_rows":"131072","norm_methods":"['none', 'power', 'quantile_rtdl', 'robust']","outlier_threshold":"10.0","permute_categorical":"True","n_svd_features":"'sqrt'"},"helper_functions":[],"helper_ranges":{},"hook_helpers":{"preprocess":[],"engineer":[],"sample":[],"postprocess":[]},"hook_ranges":{"preprocess":[12,13],"engineer":[16,22],"sample":[25,27],"postprocess":[30,31]},"code":"import numpy as np\n\nTABFM_KWARGS = {\n    \"max_num_rows\": 131072,\n    \"norm_methods\": [\"none\", \"power\", \"quantile_rtdl\", \"robust\"],\n    \"outlier_threshold\": 10.0,\n    \"permute_categorical\": True,\n    \"n_svd_features\": \"sqrt\",\n}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  X_train, X_test = X_train.copy(), X_test.copy()\n  for df in (X_train, X_test):\n    a = df[\"ArrivalDelayinMinutes\"].to_numpy(dtype=\"float64\")\n    d = df[\"DepartureDelayinMinutes\"].to_numpy(dtype=\"float64\")\n    df[\"ArrivalDelayinMinutes\"] = np.where(np.isnan(a), d, a)\n  return X_train, X_test\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  idx = np.arange(len(X_train))\n  return [idx, idx[::-1].copy()]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# customer_satisfaction_in_airline — final pipeline\n\n## What it does\n\nThe prediction is made entirely by the frozen TabFM in-context learner over the raw training\nrows; the pipeline around it is deliberately minimal, because on this task every attempt to\nadd structure lost to leaving the columns alone. The only feature change is a single\nimputation: `ArrivalDelayinMinutes` is missing on a small number of rows, and it is filled\nfrom `DepartureDelayinMinutes` on the same row, which predicts it far better than any column\nstatistic. Nothing else is transformed, no column is dropped, no target post-processing is\napplied.\n\nThe gains instead come from how TabFM is asked to look at the data. The full training set is\nused as context (`max_num_rows = 131072` \u003e 86,586 training rows, so no subsampling happens),\nand `sample()` returns two draws over the *same* rows — the natural order and its exact\nreverse. That is not a bagging trick: it is a cheap way to average out TabFM's residual\nsensitivity to context ordering while keeping every row in view. Row bagging on top of it was\ntried and was 4e-5 worse — the two axes are not complementary, and context size wins. The\nensemble knobs mix four input normalisers (`none`, `power`, `quantile_rtdl`, `robust`) rather\nthan the default set, enable `permute_categorical`, and use `sqrt`-many SVD features; each was\nablated individually against 3-fold CV, and the normaliser mix and the SVD setting are the two\nthat carry most of the improvement. `outlier_threshold` was the last knob resolved: it reaches\nonly the two delay columns (nothing else has a z that large) and the clip is soft, so it just\nsets where their tail starts compressing. Bracketing it at 8 / 12 / 16 / 30 gave a\nsingle-peaked curve, and 10.0 is what came out of closing that bracket.\n\nValidation: 3-fold CV, `1-auc` (lower is better), best ~0.00390. Held-out test: **0.003814**,\nagainst a TabArena ensemble baseline of 0.003800 and a plain baseline of 0.003939.\n\n## What build.sh builds\n\nNothing. The pipeline reads no caches or derived files — only the competition CSVs, which the\njudge loads. `final/build.sh` is a comment and `exit 0`: it takes no time and needs no disk.\n\n```\nbash final/build.sh \u0026\u0026 python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **The reversed index in `sample()` is not a different subset.** Both draws contain all\n  86,586 training rows. If you \"simplify\" it to a single draw you lose ~1e-5 of metric; if you\n  read it as subsampling and try to make the two halves disjoint you will do considerably\n  worse.\n- **`max_num_rows = 131072` is not a subsample size here.** It exceeds the training set, so it\n  is effectively \"use everything\". It matters only if this pipeline is pointed at a larger\n  table.\n- **The arrival-delay fill mutates a column in place** rather than adding an indicator. A\n  missingness flag did not help; the information is apparently already carried by the departure\n  delay.\n- **`run.py` copies `final/pipeline.py` over the workspace `pipeline.py`** and refuses to run\n  if the two differ. They are identical as shipped (both are `history/pipeline_061.py`), so\n  this only bites if you edit one of them.\n- **The estimator count is the judge's, not the pipeline's.** Scoring used 8\n  (`judge.estimators_final`); `run.py -n` overrides it. Nothing in `TABFM_KWARGS` sets it.\n- The TabFM pass itself is the whole cost: ~19 minutes wall clock on the scoring run\n  (~1050 s of it in predict), dominated by the test-set forward passes."},{"id":"diabetes","name":"diabetes","short_name":"diabetes","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.157982,"plain_note":null,"n_train":512,"n_test":256,"n_folds":30,"thresholds":null,"summary":"The task is the Pima diabetes table (512 training rows, 8 numeric features, binary target, metric `1-auc`, lower is better). TabFM makes every prediction; the pipeline only decides what it sees and how its ensemble is configured.","score":0.147075,"gain_pct":6.903951,"medal":null,"category":"II","lines":76,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","folds"],"tabfm_kwargs":{"average_logits":"False","class_shift":"False","n_feature_crosses":"'sqrt'","n_svd_features":"'sqrt'","norm_methods":"['power']","enable_nnls":"True","nnls_beta":"1.0"},"helper_functions":["_demissing","_clean","_ratios"],"helper_ranges":{"_demissing":[18,22],"_clean":[28,46],"_ratios":[54,67]},"hook_helpers":{"preprocess":["_demissing","_clean","_ratios"],"engineer":["_ratios"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[49,51],"engineer":[70,72],"postprocess":[75,76],"folds":[12,15]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'average_logits': False, 'class_shift': False,\n                'n_feature_crosses': 'sqrt', 'n_svd_features': 'sqrt',\n                'norm_methods': ['power'], 'enable_nnls': True, 'nnls_beta': 1.0}\n\nN_REPEATS = 12\nZERO_IS_MISSING = ['Glucose', 'BloodPressure', 'SkinThickness', 'Insulin', 'BMI']\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=3, n_repeats=N_REPEATS, random_state=0)\n  return list(rskf.split(X_train, y_train))\n\n\ndef _demissing(X):\n  X = X.copy()\n  for c in ZERO_IS_MISSING:\n    X[c] = X[c].astype(float).replace(0.0, np.nan)\n  return X\n\n\nDROP_FRAC = 0.10\n\n\ndef _clean(X, y):\n  \"\"\"Drop the rows whose own label is least consistent with their measurements.\"\"\"\n  from sklearn.linear_model import LogisticRegression\n  from sklearn.model_selection import StratifiedKFold\n  from sklearn.pipeline import make_pipeline\n  from sklearn.impute import SimpleImputer\n  from sklearn.preprocessing import StandardScaler\n  A = _ratios(X).drop(columns=['row_id'], errors='ignore').to_numpy(float)\n  A[~np.isfinite(A)] = np.nan\n  t = (y.to_numpy() == np.unique(y.to_numpy())[1]).astype(int)\n  p = np.zeros(len(A))\n  for tri, vai in StratifiedKFold(10, shuffle=True, random_state=11).split(A, t):\n    m = make_pipeline(SimpleImputer(strategy='median'), StandardScaler(),\n                      LogisticRegression(C=1.0, max_iter=3000))\n    m.fit(A[tri], t[tri])\n    p[vai] = m.predict_proba(A[vai])[:, 1]\n  agree = np.where(t == 1, p, 1.0 - p)\n  keep = np.sort(np.argsort(agree)[int(round(DROP_FRAC * len(A))):])\n  return X.iloc[keep].reset_index(drop=True), y.iloc[keep].reset_index(drop=True)\n\n\ndef preprocess(X_train, y_train, X_test):\n  X_train, y_train = _clean(_demissing(X_train), y_train)\n  return X_train, y_train, _demissing(X_test)\n\n\ndef _ratios(X):\n  X = X.copy()\n  X['Age_cap50'] = X['Age'].clip(upper=50)\n  X['Age_cap40'] = X['Age'].clip(upper=40)\n  X['BP_per_Age'] = X['BloodPressure'] / X['Age']\n  X['Preg_per_Age'] = X['Pregnancies'] / X['Age']\n  X['Age_per_BP'] = X['Age'] / X['BloodPressure']\n  X['Skin_per_DPF'] = X['SkinThickness'] / X['DiabetesPedigreeFunction']\n  X['Ins_per_Age'] = X['Insulin'] / X['Age']\n  X['sqrt_Preg'] = np.sqrt(X['Pregnancies'])\n  X['log_DPF'] = np.log(X['DiabetesPedigreeFunction'])\n  X['log_Glucose'] = np.log(X['Glucose'])\n  X['sqrt_Insulin'] = np.sqrt(X['Insulin'])\n  return X.replace([np.inf, -np.inf], np.nan)\n\n\ndef engineer(X_train, y_train, X_test):\n  X_train, X_test = _ratios(X_train), _ratios(X_test)\n  return X_train, X_test\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# diabetes — final pipeline\n\n## What it does\n\nThe task is the Pima diabetes table (512 training rows, 8 numeric features, binary target,\nmetric `1-auc`, lower is better). TabFM makes every prediction; the pipeline only decides what\nit sees and how its ensemble is configured.\n\nThree things happen around the frozen model. First, the physiologically impossible zeros in\n`Glucose`, `BloodPressure`, `SkinThickness`, `Insulin` and `BMI` are turned back into `NaN`, so\nTabFM reads them as missing rather than as real measurements at the bottom of each range.\nSecond, a label-noise filter drops the 10% of training rows whose own label agrees least with\ntheir measurements: an out-of-fold logistic regression (10-fold, on the engineered feature view)\nscores every training row, each row's agreement is the predicted probability of its own class,\nand the worst decile is removed before TabFM ever sees the table. This runs on the training\nsplit only — the test rows are never filtered. Third, the feature view is widened with a small\nhand-picked set of ratios and transforms (age caps at 40/50, `BloodPressure`/`Age` and its\ninverse, `Pregnancies`/`Age`, `SkinThickness`/`DiabetesPedigreeFunction`, `Insulin`/`Age`,\n`sqrt(Pregnancies)`, `log(DiabetesPedigreeFunction)`, `log(Glucose)`, `sqrt(Insulin)`), with\ninfinities mapped to `NaN`. The same engineered view feeds both the noise filter and TabFM.\nTabFM itself runs with per-member probability averaging (not logit averaging), no class shift,\n`sqrt`-many feature crosses and SVD features, power normalisation, and NNLS ensemble weighting\nat `beta=1.0`. `postprocess` is the identity. `folds()` replaces the judge's plain 3-fold CV\nwith 3-fold repeated 12 times (36 scored folds) — that was purely to make the search's own\ncomparisons readable on 512 rows; it does not change the model.\n\n## build.sh\n\nThere is nothing to build. `pipeline.py` reads no files: all four hooks operate on the\nDataFrames the judge passes in, and `TABFM_KWARGS` is a literal. `final/build.sh` therefore\nprints a line and exits 0 — it takes no time and no disk.\n\nThe scripts under `final/build/` are the run's offline analysis tools, not build steps, and\n`build.sh` deliberately does not call them. `off.py` loads per-fold `.npz` dumps that a\ntemporary debug hook (in an earlier, discarded `pipeline.py`) wrote under `dump/`; `fsearch.py`\ndoes greedy forward feature selection on top of those dumps with a cheap logistic-regression\nproxy — that search is where the ratio features above came from; `honest.py` re-runs the same\nselection on one half of the rows and measures whether it transfers to the other half; `cmp.py`\nreads `log.txt` and does a paired comparison between two past evaluations. Reproducing them\nwould require regenerating the `dump/` directory with the old debug hook, which is not part of\nthe scored pipeline.\n\n## Things a reader could get wrong\n\n- The row filter is a training-side operation inside `preprocess`; the 10% figure is a fixed\n  fraction of the rows the pipeline is given, not a probability threshold.\n- `_ratios` is applied twice: once inside `_clean` to build the logistic regression's design\n  matrix (with `row_id` dropped), and once in `engineer` for TabFM. Changing it changes both.\n- `N_REPEATS = 12` only affects validation-time folds. The final scoring uses the harness's own\n  splits, so removing it would not change the predictions, but it does change `folds_sig` and\n  hence which past evaluations are comparable.\n- Run it with `python final/run.py` from the workspace root; `run.py` copies `final/pipeline.py`\n  over `pipeline.py` and refuses to proceed if the workspace copy has been edited to something\n  different."},{"id":"Diabetes130US","name":"Diabetes130US","short_name":"Diabetes130US","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.329168,"plain_note":null,"n_train":47678,"n_test":23840,"n_folds":9,"thresholds":null,"summary":"TabFM makes the prediction on its own, in one frozen in-context pass over the whole training split — there is no `sample()` hook, `postprocess` is the identity, and no other model is blended in (`tabfm_corr` = 1.000). All the work is in how the table is presented to it, plus two ensemble knobs.","score":0.319307,"gain_pct":2.995735,"medal":null,"category":"I","lines":160,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"norm_methods":"['none', 'quantile_rtdl']","outlier_threshold":"20.0"},"helper_functions":["_icd_num","_icd_group","_disch_group","_lump","_lump_to_group","_feat"],"helper_ranges":{"_icd_num":[28,30],"_icd_group":[33,56],"_disch_group":[59,71],"_lump":[74,80],"_lump_to_group":[83,96],"_feat":[99,126]},"hook_helpers":{"preprocess":[],"engineer":["_icd_num","_icd_group","_disch_group","_lump","_lump_to_group","_feat"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[137,138],"engineer":[141,156],"postprocess":[159,160],"folds":[129,134]},"code":"import numpy as np\nimport pandas as pd\n\npd.set_option('mode.string_storage', 'python')   # judge process cannot unpickle arrow-backed strings\n\nTABFM_KWARGS = {'norm_methods': ['none', 'quantile_rtdl'],\n                'outlier_threshold': 20.0}\n\nDRUGS = ['metformin', 'repaglinide', 'nateglinide', 'chlorpropamide', 'glimepiride', 'acetohexamide',\n         'glipizide', 'glyburide', 'tolbutamide', 'pioglitazone', 'rosiglitazone', 'acarbose', 'miglitol',\n         'troglitazone', 'tolazamide', 'examide', 'citoglipton', 'insulin', 'glyburide-metformin',\n         'glipizide-metformin', 'glimepiride-pioglitazone', 'metformin-rosiglitazone',\n         'metformin-pioglitazone']\n# constant or \u003c150 non-'No' rows in the training split\nDEAD = ['acetohexamide', 'examide', 'citoglipton', 'glimepiride-pioglitazone']\n# univariate AUC \u003c= 0.5035 on the training split; dropped after the med counts are built\nWEAK = []\nDIAG = ['diag_1', 'diag_2', 'diag_3']\nLUMP = {'medical_specialty': 1, 'admission_source_id': 1}\nMIN_DIAG = 1\nAGE_MID = {'[0-10)': 5, '[10-20)': 15, '[20-30)': 25, '[30-40)': 35, '[40-50)': 45, '[50-60)': 55,\n           '[60-70)': 65, '[70-80)': 75, '[80-90)': 85, '[90-100)': 95}\nWT_MID = {'[0-25)': 12, '[25-50)': 37, '[50-75)': 62, '[75-100)': 87, '[100-125)': 112,\n          '[125-150)': 137, '[150-175)': 162, '[175-200)': 187, '\u003e200': 212}\nDOSE = {'No': 0, 'Steady': 1, 'Up': 2, 'Down': -1}\n\n\ndef _icd_num(s):\n  s = s.fillna('').astype(str)\n  return pd.to_numeric(s.str.extract(r'^(\\d+\\.?\\d*)', expand=False), errors='coerce')\n\n\ndef _icd_group(s):\n  \"\"\"ICD-9 code -\u003e chapter, with 250.x split out as its own 'Diabetes' chapter.\"\"\"\n  s = s.fillna('').astype(str)\n  v = _icd_num(s)\n  g = np.full(len(s), 'Other', dtype=object)\n  ok = v.notna().to_numpy()\n  vv = v.to_numpy()\n  for lo, hi, lab in [(1, 140, 'Infect'), (140, 240, 'Neoplasm'), (240, 280, 'EndoMeta'),\n                      (280, 290, 'Blood'), (290, 320, 'Mental'), (320, 390, 'Nervous'),\n                      (390, 460, 'Circ'), (460, 520, 'Resp'), (520, 580, 'Digest'),
