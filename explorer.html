  --surface: #ffffff;
  --subtle: #f0f4f9;
  --subtle-2: #e2e8f0;
  --border: #d5dfec;
  --hairline: #e5ecf5;
  --text: #0b1220;
  --text-2: #334155;
  --muted: #5f6b7c;
  --accent: #1a73e8;
  --accent-soft: hsla(214 89% 51% / 0.11);
  --pos: #0d7a52;
  --pos-soft: hsla(158 81% 26% / 0.12);
  --neg: hsl(352 70% 42%);
  --neg-soft: hsla(352 76% 48% / 0.11);
  --medal: #b45309;
  --medal-soft: hsla(42 94% 48% / 0.16);
  --shadow-sm: 0 1px 2px hsla(220 30% 10% / 0.04);
  --shadow-md: 0 8px 24px hsla(220 30% 10% / 0.08);
  --code-bg: #f3f6fb;
  --code-bar: #eaf0f8;
  --code-sect: #e2eaf5;
  --code-border: #d5dfec;
  --code-text: #0f172a;
  --code-ln: #64748b;
  --t-kw: #1a73e8;
  --t-fn: #00838f;
  --t-hook: #4f46e5;
  --t-str: #0d7a52;
  --t-num: #0284c7;
  --t-com: #64748b;
  --t-bi: #0369a1;
  --t-const: #4338ca;
  --font-sans: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Google Sans Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070b14;
  --surface: #0f1624;
  --subtle: #162033;
  --subtle-2: #1e2b42;
  --border: #223049;
  --hairline: #1a253a;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --muted: #8b9bb4;
  --accent: #589df6;
  --accent-soft: hsla(213 90% 65% / 0.15);
  --pos: #34d399;
  --pos-soft: hsla(156 68% 46% / 0.15);
  --neg: hsl(352 82% 68%);
  --neg-soft: hsla(352 78% 54% / 0.15);
  --medal: #fbbf24;
  --medal-soft: hsla(44 92% 54% / 0.15);
  --shadow-sm: 0 1px 2px hsla(0 0% 0% / 0.35);
  --shadow-md: 0 10px 28px hsla(0 0% 0% / 0.5);
  --code-bg: #050811;
  --code-bar: #0b111e;
  --code-sect: #111a2e;
  --code-border: #1e2b42;
  --code-text: #e2e8f0;
  --code-ln: #64748b;
  --t-kw: #589df6;
  --t-fn: #22d3ee;
  --t-hook: #818cf8;
  --t-str: #34d399;
  --t-num: #38bdf8;
  --t-com: #64748b;
  --t-bi: #67e8f9;
  --t-const: #a5b4fc;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }


.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1600px;
  height: 100%;
  margin: 0 auto;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 24px;
  height: 24px;
  flex: none;
  display: block;
}
.brand-mark .logo-backbone { fill: #1a73e8; }
.brand-mark .logo-cell-mid { fill: #1a73e8; fill-opacity: 0.36; }
.brand-mark .logo-spark { fill: #00b4d8; }
[data-theme="dark"] .brand-mark .logo-backbone { fill: #589df6; }
[data-theme="dark"] .brand-mark .logo-cell-mid { fill: #589df6; fill-opacity: 0.38; }
[data-theme="dark"] .brand-mark .logo-spark { fill: #22d3ee; }
.brand-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
.brand-sep { color: var(--border); font-weight: 400; }
.brand-sub { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex: none; }

.mode-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
  border: 1px solid var(--hairline);
}
.mode-btn {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  border: 1px solid var(--border);
  background: var(--surface);
}
.icon-btn:hover { background: var(--subtle); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }


.app {
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  min-height: calc(100vh - 52px);
}
.app.no-sidebar { grid-template-columns: minmax(0, 1fr); }
.app.no-sidebar .sidebar { display: none; }


.sidebar {
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.sidebar-top {
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  height: 34px;
  border-radius: 7px;
  background: var(--subtle);
  border: 1px solid transparent;
  transition: border-color 0.12s, background 0.12s;
}
.search:focus-within { background: var(--surface); border-color: var(--accent); }
.search svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.search input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 12.5px;
  color: var(--text);
}
.search input::placeholder { color: var(--muted); }
.kbd-hint {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  line-height: 1.4;
}

.suite-pills {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--subtle);
}
.suite-btn {
  flex: 1 1 auto;
  padding: 4px 4px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}
.suite-btn:hover { color: var(--text); }
.suite-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.list-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}
.list-count { font-size: 12px; font-weight: 600; color: var(--muted); }
.sort-select {
  appearance: none;
  background: transparent;
  border: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  padding-right: 2px;
  text-align: right;
}
.sort-select:hover { color: var(--text); }

.task-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-item {
  width: 100%;
  text-align: left;
  padding: 7px 9px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.1s;
}
.task-item:hover { background: var(--subtle); }
.task-item.is-active { background: var(--accent-soft); }
.task-item-left { min-width: 0; flex: 1; }
.task-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-item.is-active .task-name { color: var(--accent); font-weight: 700; }
.task-sub {
  display: block;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


.gain {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex: none;
}
.gain.pos { background: var(--pos-soft); color: var(--pos); }
.gain.neg { background: var(--neg-soft); color: var(--neg); }
.gain.na { background: var(--subtle); color: var(--muted); }
.gain.medal { background: var(--medal-soft); color: var(--medal); font-family: var(--font-sans); }


.main { min-width: 0; }
.page {
  padding: 20px 24px 36px;
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}


.task-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.th-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.cat-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}
.th-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}
.th-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.kpi-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
}
.kpi {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-left: 18px;
  border-left: 1px solid var(--hairline);
}
.kpi:first-child { padding-left: 0; border-left: none; }
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.th-summary {
  margin: 10px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--hairline);
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-2);
  max-width: 92ch;
}
.th-summary code, .cell-sum code, .doc code {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--subtle);
  color: var(--text);
}


.workspace {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ws-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 16px;
  min-height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.ws-tabs {
  display: flex;
  align-items: stretch;
  gap: 4px;
}
.ws-tab {
  position: relative;
  padding: 11px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.12s;
}
.ws-tab:hover { color: var(--text); }
.ws-tab.is-active { color: var(--text); }
.ws-tab.is-active::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.tab-meta {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.ws-right {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 0;
}
.kw-group {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.kw-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.kw-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--subtle);
  color: var(--text-2);
}
.tb-btn {
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--subtle);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.tb-btn:hover { background: var(--subtle-2); color: var(--text); }


.stage-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 16px;
  background: var(--subtle);
  border-bottom: 1px solid var(--border);
}
.stage-group, .helper-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.bar-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-right: 3px;
}
.hook-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.hook-btn:hover:not(:disabled) { border-color: var(--text-2); color: var(--text); }
.hook-btn.pass-hook { opacity: 0.65; font-weight: 500; }
.hook-btn.is-selected {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  opacity: 1;
}
.hook-sub {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  opacity: 0.78;
}
.helper-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--hairline);
}
.helper-btn:hover { border-color: var(--accent); color: var(--accent); }
.helper-btn.other-hook {
  background: transparent;
  border-style: dashed;
  color: var(--muted);
}
.helper-btn.other-hook:hover { color: var(--text); border-color: var(--border); }


.code-wrap { background: var(--code-bg); color: var(--code-text); }
.code {
  margin: 0;
  padding: 12px 0 16px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  tab-size: 2;
}
.code-sect {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  margin: 8px 0 4px;
  background: var(--code-sect);
  border-top: 1px solid var(--code-border);
  border-bottom: 1px solid var(--code-border);
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-2);
}
.code-sect:first-child { margin-top: 0; border-top: none; }
.code-sect b { font-family: var(--font-mono); color: var(--t-hook); font-weight: 600; }
.code-sect.is-flash { background: hsla(214 89% 51% / 0.20); }
.code-line {
  display: block;
  padding: 0 16px 0 0;
  white-space: pre;
}
.code-line:hover { background: hsla(215 28% 50% / 0.1); }
.code-line.is-flash { background: hsla(214 89% 51% / 0.18); }
.ln {
  display: inline-block;
  width: 46px;
  padding-right: 12px;
  text-align: right;
  color: var(--code-ln);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.t-kw { color: var(--t-kw); }
.t-fn { color: var(--t-fn); font-weight: 600; }
.t-hook { color: var(--t-hook); font-weight: 700; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-bi { color: var(--t-bi); }
.t-const { color: var(--t-const); }


.doc {
  padding: 22px 26px 28px;
  max-width: 82ch;
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
}
.doc h3, .doc h4, .doc h5 {
  margin: 20px 0 8px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.doc h3:first-child, .doc h4:first-child { margin-top: 0; }
.doc p { margin: 0 0 12px; color: var(--text-2); }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; color: var(--text-2); }
.doc li { margin-bottom: 5px; }
.doc b { color: var(--text); font-weight: 600; }
.doc em { font-style: italic; }
.doc pre {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-text);
  font-family: var(--font-mono);
  font-size: 12.5px;
  overflow-x: auto;
}
.doc-tbl { margin: 12px 0; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.doc-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc-tbl th, .doc-tbl td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--hairline); }
.doc-tbl th { background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 600; }
.doc-tbl tr:last-child td { border-bottom: none; }


.summary-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.stat {
  padding: 14px 18px;
  border-left: 1px solid var(--hairline);
}
.stat:first-child { border-left: none; }
.stat-k { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat-v {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-v.pos { color: var(--pos); }
.stat-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
}
.seg button {
  padding: 4px 11px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.seg button:hover { color: var(--text); }
.seg button.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td {
  padding: 10px 12px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--hairline);
}
.tbl th {
  background: var(--subtle);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  user-select: none;
}
.tbl th.sortable { cursor: pointer; }

<script id="explorer-data" type="application/json">{"tasks":[{"id":"airfoil_self_noise","name":"airfoil_self_noise","short_name":"airfoil_self_noise","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":1.071162,"plain_note":null,"n_train":1002,"n_test":501,"n_folds":30,"thresholds":null,"summary":"The prediction is made by TabFM, frozen and zero-shot, attending over the training rows; the pipeline around it is entirely a change of coordinates. The NASA airfoil self-noise data is 106 (chord, free-stream velocity, angle of attack) configurations, each swept over 1/3-octave frequency bands, and the physics that sets the sound pressure level is multiplicative and lives on log scales.","score":0.916498,"gain_pct":14.438899,"medal":null,"category":"I","lines":215,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["preprocess","engineer","sample","postprocess"],"tabfm_kwargs":{},"helper_functions":["_phys","_brackets","_ecdf_grid"],"helper_ranges":{"_phys":[31,84],"_brackets":[87,139],"_ecdf_grid":[142,143]},"hook_helpers":{"preprocess":[],"engineer":["_phys","_brackets"],"sample":[],"postprocess":["_ecdf_grid"]},"hook_ranges":{"preprocess":[146,152],"engineer":[170,202],"sample":[155,167],"postprocess":[205,215]},"code":"\"\"\"airfoil_self_noise -- TabFM pipeline.\n\nData: NASA airfoil self-noise. 106 (chord, velocity, angle) configurations, each measured over a\n1/3-octave frequency sweep; suction-side displacement thickness is a deterministic function of the\nconfiguration. Target: scaled sound pressure level in dB. Folds: the judge's own\nKFold(3, shuffle, seed 0) -- 2/3 train, the ratio each TabArena final fold uses.\n\nLog: identity 1.37711 -> BPM log-space features 1.24650. Ensemble knobs (crosses, svd, nnls, extra\nnorm_methods) were all neutral-to-worse at 8 estimators; leave-one-out spectral neighbours were much\nworse (1.62), the 1/3-octave sweeps are too coarse to interpolate.\n\nVariant: dfU_dchord\n\nIntent: ablate the feature groups and add the Brooks-Pope-Marcolini reduced Strouhal numbers --\nSt/St1 and St/St2 are the arguments the empirical spectral shape functions are written in, and K1,\ndK1 their Reynolds-dependent amplitudes.\n\nHooks: preprocess / engineer / sample / postprocess / folds, TABFM_KWARGS -- see skills/tabfm.md.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nOPT = {'groups': ['raw', 'logs', 'st', 're', 'ratio', 'bpm'], 'drop': ['frequency', 'free-stream-velocity', 'chord-length']}\nTABFM_KWARGS = {}\n\nC_SOUND = 340.46      # m/s\nNU = 1.5e-5           # kinematic viscosity of air, m^2/s\nCFG = ['chord-length', 'free-stream-velocity', 'attack-angle']\n\n\ndef _phys(df, groups):\n  f = df['frequency'].to_numpy(dtype=float)\n  a = df['attack-angle'].to_numpy(dtype=float)\n  c = df['chord-length'].to_numpy(dtype=float)\n  u = df['free-stream-velocity'].to_numpy(dtype=float)\n  d = df['suction-side-displacement-thickness'].to_numpy(dtype=float)\n  m = u / C_SOUND\n  re_c = u * c / NU\n  re_d = u * d / NU\n  st_d = f * d / u\n  out = pd.DataFrame(index=df.index)\n  if 'raw' in groups:\n    for col in df.columns:\n      out[col] = df[col].to_numpy()\n  if 'logs' in groups:\n    out['log_f'] = np.log10(f)\n    out['log_d'] = np.log10(d)\n    out['log_c'] = np.log10(c)\n  if 'st' in groups:\n    out['log_St_d'] = np.log10(st_d)\n    out['log_St_c'] = np.log10(f * c / u)\n  if 're' in groups:\n    out['log_Re_c'] = np.log10(re_c)\n    out['log_Re_d'] = np.log10(re_d)\n  if 'ratio' in groups:\n    out['log_d_over_c'] = np.log10(d / c)\n  if 'bpm' in groups:\n    out['bpm_scale'] = 10.0 * np.log10(d) + 50.0 * np.log10(m)\n  if 'logu' in groups:\n    out['log_u'] = np.log10(u)\n  if 'ord' in groups:                                           # the design is a small discrete grid\n    for nm, v in (('o_f', f), ('o_a', a), ('o_c', c), ('o_u', u)):\n      out[nm] = pd.Series(v).rank(method='dense').to_numpy() - 1.0\n  if 'st1r' in groups:                                          # distance to the BPM peak Strouhal\n    out['log_St1r'] = np.log10(st_d / (0.02 * m ** -0.6))\n  if 'ang' in groups:\n    out['a2'] = a ** 2\n    out['a_stall'] = np.maximum(a - 12.5, 0.0)\n    out['sin_a'] = np.sin(np.deg2rad(a))\n    out['a_x_logf'] = a * np.log10(f)\n  if 'bpm2' in groups:\n    st1 = 0.02 * m ** -0.6                                     # peak Strouhal, zero incidence\n    shift = np.where(a < 1.33, 1.0,\n                     np.where(a <= 12.5, 10.0 ** (0.0054 * (a - 1.33) ** 2), 4.72))\n    st2 = st1 * shift\n    k1 = np.where(re_c < 2.47e5, -4.31 * np.log10(re_c) + 156.3,\n                  np.where(re_c > 8.0e5, 128.5, -9.0 * np.log10(re_c) + 181.6))\n    dk1 = np.where(re_d < 5000.0, a * (1.43 * np.log10(np.maximum(re_d, 1.0)) - 5.29), 0.0)\n    out['log_St1r'] = np.log10(st_d / st1)\n    out['log_St2r'] = np.log10(st_d / st2)\n    out['log_St_shift'] = np.log10(shift)\n    out['bpm_K1'] = k1\n    out['bpm_dK1'] = dk1\n  return out\n\n\ndef _brackets(X_train, y_train, X_test, slim):\n  \"\"\"For each row, the training levels immediately below and above it in log-frequency inside its own\n  configuration. Training rows are served leave-one-out, so the columns mean the same thing on both\n  sides. No configuration-mean column: a leave-one-out mean is (S - y_i)/(n-1), which moves against\n  y_i inside a configuration and taught TabFM the wrong sign (RESULT 17, 2.49).\"\"\"\n  y = np.asarray(y_train, dtype=float).ravel()\n  lf_tr = np.log10(X_train['frequency'].to_numpy(dtype=float))\n  lf_te = np.log10(X_test['frequency'].to_numpy(dtype=float))\n  k_tr = list(zip(*(X_train[c].to_numpy() for c in CFG)))\n  k_te = list(zip(*(X_test[c].to_numpy() for c in CFG)))\n  groups = {}\n  for i, k in enumerate(k_tr):\n    groups.setdefault(k, []).append(i)\n  sortd = {}\n  for k, ix in groups.items():\n    ix = np.asarray(ix)[np.argsort(lf_tr[np.asarray(ix)], kind='stable')]\n    sortd[k] = (lf_tr[ix], y[ix])\n\n  def make(n):\n    return {c: np.full(n, np.nan) for c in\n            (('nb_interp', 'nb_slope') if slim else\n             ('nb_lo', 'nb_hi', 'nb_dlo', 'nb_dhi', 'nb_interp', 'nb_slope'))}\n\n  def put(dst, row, ylo, yhi, dlo, dhi):\n    if not slim:\n      dst['nb_lo'][row], dst['nb_hi'][row] = ylo, yhi\n      dst['nb_dlo'][row], dst['nb_dhi'][row] = dlo, dhi\n    if not np.isnan(ylo) and not np.isnan(yhi):\n      dst['nb_interp'][row] = ylo + (yhi - ylo) * dlo / (dlo + dhi)\n      dst['nb_slope'][row] = (yhi - ylo) / (dlo + dhi)\n    elif not np.isnan(ylo):\n      dst['nb_interp'][row] = ylo\n    elif not np.isnan(yhi):\n      dst['nb_interp'][row] = yhi\n\n  ctr, cte = make(len(lf_tr)), make(len(lf_te))\n  for k, ix in groups.items():\n    gl, gy = sortd[k]\n    n = len(gl)\n    order = np.asarray(ix)[np.argsort(lf_tr[np.asarray(ix)], kind='stable')]\n    for p, row in enumerate(order):\n      put(ctr, row,\n          gy[p - 1] if p > 0 else np.nan, gy[p + 1] if p + 1 < n else np.nan,\n          gl[p] - gl[p - 1] if p > 0 else np.nan, gl[p + 1] - gl[p] if p + 1 < n else np.nan)\n  for row, (k, lf) in enumerate(zip(k_te, lf_te)):\n    if k not in sortd:\n      continue\n    gl, gy = sortd[k]\n    p = int(np.searchsorted(gl, lf))\n    put(cte, row,\n        gy[p - 1] if p > 0 else np.nan, gy[p] if p < len(gl) else np.nan,\n        lf - gl[p - 1] if p > 0 else np.nan, gl[p] - lf if p < len(gl) else np.nan)\n  return ctr, cte\n\n\ndef _ecdf_grid(n):\n  return (np.arange(n) + 1.0) / (n + 1.0)\n\n\ndef preprocess(X_train, y_train, X_test):\n  if OPT.get('ytrans') == 'rankgauss':          # reshape the target, inverted in postprocess from y_orig\n    from scipy.stats import norm, rankdata\n    y = np.asarray(y_train, dtype=float).ravel()\n    z = norm.ppf(rankdata(y, method='average') / (len(y) + 1.0))\n    y_train = pd.Series(z, index=y_train.index, name=getattr(y_train, 'name', 'y'))\n  return X_train, y_train, X_test\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Bagged draws. Every member of every draw is fit with the same random_state, so two identical\n  draws are the same model: row content is the only diversity a draw can add.\"\"\"\n  n, k, fr = len(X_train), OPT.get('draws', 1), OPT.get('draw_frac', 1.0)\n  rng = np.random.default_rng(12345)\n  if OPT.get('perm_draws'):        # same rows, different order: is TabFM's context order-sensitive?\n    return [rng.permutation(n) for _ in range(OPT['perm_draws'])]\n  if k <= 1 and fr >= 1.0:\n    return [np.arange(n)]\n  m = max(2, int(round(fr * n)))\n  if OPT.get('bootstrap'):\n    return [np.sort(rng.choice(n, m, replace=True)) for _ in range(k)]\n  return [np.sort(rng.choice(n, m, replace=False)) for _ in range(k)]\n\n\ndef engineer(X_train, y_train, X_test):\n  g = OPT['groups']\n  tr, te = _phys(X_train, g), _phys(X_test, g)\n  if 'cfgid' in g:                                    # a string key TabFM can match exactly on\n    for frame, src in ((tr, X_train), (te, X_test)):\n      frame['cfg_id'] = [f'{c1:g}_{u1:g}_{a1:g}' for c1, u1, a1 in\n                         zip(*(src[c].to_numpy() for c in CFG))]\n  if 'nbr' in g:                                      # bracketing levels of the same sweep, LOO on train\n    for frame, cols in zip((tr, te), _brackets(X_train, y_train, X_test, OPT.get('nbr_slim'))):\n      for k2, v2 in cols.items():\n        frame[k2] = v2\n  if 'cfgmean' in g:                                    # leave-one-out mean level of the configuration\n    y = np.asarray(y_train, dtype=float).ravel()\n    k_tr = list(zip(*(X_train[c].to_numpy() for c in CFG)))\n    k_te = list(zip(*(X_test[c].to_numpy() for c in CFG)))\n    tot, cnt = {}, {}\n    for k, v in zip(k_tr, y):\n      tot[k] = tot.get(k, 0.0) + v\n      cnt[k] = cnt.get(k, 0) + 1\n    tr['cfg_mean'] = [(tot[k] - v) / (cnt[k] - 1) if cnt[k] > 1 else np.nan for k, v in zip(k_tr, y)]\n    te['cfg_mean'] = [tot[k] / cnt[k] if k in cnt else np.nan for k in k_te]\n  fr = OPT.get('max_rows_frac')\n  if fr:                       # per-member row subsampling: bagging inside the 8-member ensemble,\n    TABFM_KWARGS['max_num_rows'] = max(2, int(round(fr * len(X_train))))   # at no extra compute\n  for c in OPT.get('drop', []):\n    tr, te = tr.drop(columns=[c]), te.drop(columns=[c])\n  for c, k in OPT.get('dup', []):               # a repeated column takes more of TabFM's attention\n    for j in range(k):\n      tr[f'{c}_r{j}'], te[f'{c}_r{j}'] = tr[c].to_numpy(), te[c].to_numpy()\n  for c in ('row_id',):\n    if c in X_train.columns and c not in tr.columns:\n      tr[c], te[c] = X_train[c].to_numpy(), X_test[c].to_numpy()\n  return tr, te\n\n\ndef postprocess(pred, y_orig, X_test):\n  if OPT.get('ytrans') == 'rankgauss':\n    from scipy.stats import norm\n    ys = np.sort(np.asarray(y_orig, dtype=float).ravel())\n    u = norm.cdf(np.asarray(pred, dtype=float).ravel())\n    back = np.interp(u, _ecdf_grid(len(ys)), ys)\n    return pd.Series(back, index=pred.index, name=getattr(pred, 'name', None))\n  if OPT.get('clip'):\n    y = np.asarray(y_orig, dtype=float).ravel()\n    return pred.clip(y.min(), y.max())\n  return pred\n","readme":"# airfoil_self_noise — TabFM pipeline\n\n## What it does\n\nThe prediction is made by TabFM, frozen and zero-shot, attending over the training rows; the pipeline\naround it is entirely a change of coordinates. The NASA airfoil self-noise data is 106 (chord,\nfree-stream velocity, angle of attack) configurations, each swept over 1/3-octave frequency bands,\nand the physics that sets the sound pressure level is multiplicative and lives on log scales. So\n`engineer()` rewrites each row in the variables the Brooks–Pope–Marcolini semi-empirical model is\nactually written in: log frequency, log displacement thickness and log chord; the two Strouhal\nnumbers `f·δ/U` and `f·c/U`; the chord- and thickness-based Reynolds numbers; the thickness-to-chord\nratio; and a `10·log10(δ) + 50·log10(M)` amplitude term that carries the model's overall level\nscaling. The raw columns ride along, except `frequency`, `free-stream-velocity` and `chord-length`,\nwhich are dropped — the log and dimensionless forms of those three say the same thing more usefully,\nand keeping both only dilutes the attention. The target is left untouched, the full training split is\nhanded to TabFM as a single draw, `TABFM_KWARGS` is empty (judge defaults), and `postprocess()` is a\npass-through. This coordinate change alone is what the run bought: RMSE 1.377 on the identity\npipeline down to about 1.247.\n\nThe module also carries switched-off machinery from the search — rank-Gauss target transform, bagged\nor bootstrapped draws, permutation draws, per-configuration leave-one-out neighbour brackets,\nconfiguration mean-encoding, column duplication, prediction clipping. None of it is reachable with\nthe `OPT` dict as scored; the docstring records why each was dropped (notably: leave-one-out spectral\nneighbours scored 1.62, far worse — the 1/3-octave sweeps are too coarse to interpolate across).\n\n## What build.sh builds\n\nNothing. `pipeline.py` names no file and reads nothing but the DataFrames the judge hands its hooks,\nand the run wrote no helper scripts or caches — `final/build/` is empty for that reason.\n`bash final/build.sh` prints one line and exits 0. Runtime: instant. Disk: zero.\n\n## Things a reader could get wrong\n\n- **The data does not come from `data/`.** This is a `tabarena:` task. `judge.load_task` reads the\n  fold cache at `~/.cache/tabarena/airfoil_self_noise/fold_0/{train,test}.csv` (override with\n  `TABARENA_DIR`), and asserts with \"fold cache missing; run the tabarena downloader\" if it is not\n  there. The `data/train.csv` and `data/test.csv` in this workspace are a label-free copy the judge\n  materialised for the agent to look at; they are not what a rerun loads. Populating that cache is\n  the one prerequisite, and it is upstream of this directory — build.sh deliberately does not try to\n  fetch it.\n- **The scored number is a 30-fold mean, not this workspace's fold 0.** The final ran the pipeline\n  independently on each of the 30 folds the published TabFM baseline used and averaged the RMSE.\n  `python judge.py val` during the run was 3-fold CV *inside* fold 0's training split, so its numbers\n  (the ~1.247 above) are search-time signal, not the reported test score.\n- **`python final/run.py` will not finish on this task, and the pipeline is not the reason.** After\n  the TabFM pass it does `pd.read_csv(T.competition.sample_submission)` to order the submission, and\n  `load_tabarena_task` never sets `T.competition` — there is no sample submission for a TabArena\n  fold. Expect an `AttributeError` at that line; `T.submission(pred, T.X_test)` just above it has\n  already produced the `row_id` / `scaled-sound-pressure` frame. `python final/run.py --check` stops\n  before all of this and is fine. I read this off `final/judge.py:266-296` and `final/run.py:119-124`\n  rather than executing it — this session had no shell — so treat it as a code reading, and note that\n  `run.py` and `judge.py` are outside the two files I was allowed to write, hence left alone.\n- **`folds()` is not defined**, on purpose: the rows are exchangeable within fold 0's training split\n  once the configuration structure is in the features, so validation used the judge's own\n  `KFold(3, shuffle, seed 0)`, whose 2/3 train ratio matches what each TabArena final fold sees.\n","package":[],"derivations":[]},{"id":"Amazon_employee_access","name":"Amazon_employee_access","short_name":"Amazon_employee_access","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.141604,"plain_note":null,"n_train":21846,"n_test":10923,"n_folds":9,"thresholds":null,"summary":"The table is nine high-cardinality categorical id columns and a binary target; the metric is `1 - ROC-AUC` (lower is better). TabFM pools labels by itself when it attends over the context rows, so nothing label-derived is handed to it — out-of-fold target rates made it clearly worse.","score":0.103916,"gain_pct":26.615067,"medal":null,"category":"II","lines":260,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer","postprocess"],"tabfm_kwargs":{},"helper_functions":["_frame","_short","_base_codes","_combo","_nuniq","_dedup","_aux"],"helper_ranges":{"_frame":[70,75],"_short":[78,79],"_base_codes":[82,89],"_combo":[92,99],"_nuniq":[102,105],"_dedup":[108,124],"_aux":[127,202]},"hook_helpers":{"preprocess":[],"engineer":["_frame","_short","_base_codes","_combo","_nuniq","_dedup","_aux"],"postprocess":[]},"hook_ranges":{"preprocess":[205,206],"engineer":[209,231],"postprocess":[234,260]},"code":"\"\"\"Amazon employee access: 9 high-cardinality categorical id columns, metric 1 - ROC-AUC.\n\nEverything here follows from two findings about how TabFM reads this table.\n\n1. It pools labels by itself. It attends over the context rows *with their labels*, so any\n   column derived from the target is redundant to it and arrives with a train/test shift it\n   cannot see. Out-of-fold target rates cost 0.147 -> 0.185 (eval 7) and 0.132 -> 0.170\n   (eval 29, with the test-side estimator matched to the training-side noise). Nothing\n   label-derived reaches TabFM.\n   What it cannot recover on its own is label-free co-occurrence structure, and that is what\n   `engineer` supplies: how often each id value and each pair of id values occurs, and how\n   many distinct values of every other column each id value touches.\n        raw ids only                                    0.15172\n        + per-column counts                             0.14696\n        + pair counts                                   0.13615\n        + group degrees                                 0.13202\n\n2. It is sensitive to width, but to the *kind* of column rather than the count. 56 degree\n   columns helped; 56 triple counts (eval 9), 28 pair PMIs (eval 19), a 16-dim co-occurrence\n   SVD (eval 20) and 56 group means (eval 51) each cost 0.003-0.012. So the wide, redundant\n   blocks are left out entirely rather than handed to TabFM and pruned.\n\nThe two side models are tools that cover the part of the hypothesis space TabFM is weakest\nin: explicit per-category weights (sparse one-hot logistic regressions over single, pair and\ntriple keys, averaged over five regularisations) and axis-aligned splits on the count block\n(five gradient-boosting fits from stumps to 63 leaves, averaged, stacked on the linear model's out-of-fold logit --\nwhose test side comes from the same inner models as its training side, so the column means\nthe same thing on both). Both are fitted on the fold's training rows only, and `postprocess`\nfolds their standardised logits into TabFM's at .50 / .24 / .26, which keeps TabFM the largest\nsingle component by a wide margin. On fold 0 TabFM alone scores 0.1178, the linear model\n0.1319 and the boosting 0.1554; the blend is 0.1260 over the three folds against 0.1318 for\nTabFM's own features, and its ranking still correlates 0.95 with TabFM's. The blend weights\nsit on a flat plateau: .22/.28 through .34/.16 all score 0.1259-0.1266.\n\nTried and not kept: ids as strings for the 'appearance' encoder (0.170), ids as frequency\nranks (0.135), n_feature_crosses / n_svd_features / NNLS member weights / a four-norm cycle /\na raised outlier threshold / a smaller max_num_rows / averaging several row draws (all within\nnoise or worse), oversampling the minority class into the context (0.201), a wider feature\nblock for the side models (0.1264 -> 0.1285), row-level aggregates of the count block\n(0.1275), extra-trees in the tree average (0.1265) and a boosting fit that drops the raw ids\n(0.1263).\n\"\"\"\nimport itertools\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {}\n\nBASE = ['RESOURCE', 'MGR_ID', 'ROLE_ROLLUP_1', 'ROLE_ROLLUP_2', 'ROLE_DEPTNAME',\n        'ROLE_TITLE', 'ROLE_FAMILY_DESC', 'ROLE_FAMILY', 'ROLE_CODE']\nKEYCOLS = [c for c in BASE if c != 'ROLE_CODE']   # ROLE_CODE is 1-1 with ROLE_TITLE\n\nCNT_ORDERS = [1, 2]        # count-encode every keyset of these sizes (label-free, train+test)\nDEDUP = 0.999              # drop a column that repeats an earlier one; the role hierarchy is nested\n\nAUX_ORDERS = [1, 2, 3]     # one-hot key groups for the linear side model\nAUX_MIN_COUNT = 2          # values seen once share a 'rare' slot per group\nAUX_CS = [0.1, 0.3, 1.0, 3.0, 10.0]   # its predictions are averaged over these regularisations\nAUX_W = 0.24               # weight of the linear side model in the blend\nAUX2_W = 0.26              # weight of the gradient-boosting side model\nGB_GRID = [(600, 0.03, 31), (300, 0.08, 15), (900, 0.02, 63),   # (iters, rate, leaves) of the\n           (400, 0.05, 8), (250, 0.10, 4)]                      # boosting fits that are averaged\nGB_NORAW = False           # one boosting fit sees the count block without the raw ids\nET_IN_Q = False            # an extra-trees fit joins the boosting average\nSTACK_LR = True            # the boosting model also sees the linear model's out-of-fold logit\nAUX_FILE = '.aux_pred.npz'\n\n\ndef _frame(d):\n  \"\"\"Object-dtype column index: the judge host unpickles our hook output without pyarrow,\n  and pandas 3's arrow-backed string Index cannot be loaded there.\"\"\"\n  f = pd.DataFrame(d)\n  f.columns = pd.Index(list(f.columns), dtype=object)\n  return f\n\n\ndef _short(c):\n  return c[:4] + c[-2:]\n\n\ndef _base_codes(X_train, X_test):\n  \"\"\"Dense codes per column over train+test, so keys line up across the split.\"\"\"\n  out = {}\n  for c in BASE:\n    v = np.concatenate([X_train[c].to_numpy(np.int64), X_test[c].to_numpy(np.int64)])\n    _, inv = np.unique(v, return_inverse=True)\n    out[c] = (inv.astype(np.int64), int(inv.max()) + 1)\n  return out\n\n\ndef _combo(codes, ks):\n  \"\"\"Dense codes for the tuple of columns `ks`.\"\"\"\n  s = np.zeros(len(codes[ks[0]][0]), np.int64)\n  for c in ks:\n    inv, k = codes[c]\n    s = s * k + inv\n  _, inv = np.unique(s, return_inverse=True)\n  return inv.astype(np.int64), int(inv.max()) + 1\n\n\ndef _nuniq(kc, nk, vc, nv):\n  \"\"\"How many distinct values of the second key each value of the first co-occurs with.\"\"\"\n  u = np.unique(kc * nv + vc)\n  return np.bincount(u // nv, minlength=nk).astype(float)\n\n\ndef _dedup(F):\n  \"\"\"Drop constant columns and ones that repeat an earlier column. ROLE_TITLE fixes\n  ROLE_FAMILY and MGR_ID nearly fixes the rollups, so a mechanical feature grid over this\n  table produces exact copies.\"\"\"\n  names = list(F)\n  M = np.column_stack([F[k] for k in names]).astype(np.float64)\n  sd = M.std(0)\n  keep, Z = [], []\n  for j, nm in enumerate(names):\n    if sd[j] < 1e-9:\n      continue\n    z = (M[:, j] - M[:, j].mean()) / sd[j]\n    if Z and np.abs(np.asarray(Z) @ z).max() / len(z) > DEDUP:\n      continue\n    keep.append(nm)\n    Z.append(z)\n  return {k: F[k] for k in keep}\n\n\ndef _aux(codes, n, y_train, X_test, F):\n  \"\"\"Side models, fitted on the fold's training rows only and handed to `postprocess`\n  through the workspace, because the two hooks run in separate processes.\n\n  `p`: logistic regression on the one-hot of every single/pair/triple key -- an explicit\n       weight per category value, which no aggregate column gives TabFM.\n  `q`: gradient boosting on the same dense count block TabFM sees.\n  \"\"\"\n  from scipy import sparse\n  from sklearn.ensemble import HistGradientBoostingClassifier\n  from sklearn.linear_model import LogisticRegression\n  lab = y_train.astype(str).to_numpy()\n  y = (lab == np.unique(lab)[-1]).astype(int)\n  if y[:n].min() == y[:n].max():          # single-class slice (judge.py check): nothing to fit\n    return\n  N = len(codes[BASE[0]][0])\n\n  cols, off = [], 0\n  for o in AUX_ORDERS:\n    for ks in itertools.combinations(KEYCOLS, o):\n      inv, ncat = _combo(codes, ks)\n      keep = np.bincount(inv, minlength=ncat) >= AUX_MIN_COUNT\n      m = np.full(ncat, int(keep.sum()))   # everything rarer shares the group's last slot\n      m[keep] = np.arange(int(keep.sum()))\n      cols.append(m[inv] + off)\n      off += int(keep.sum()) + 1\n  C = np.stack(cols, 1)\n  M = sparse.csr_matrix((np.ones(C.size), (np.repeat(np.arange(N), C.shape[1]), C.ravel())),\n                        shape=(N, off))\n  zs = []\n  for c in AUX_CS:\n    clf = LogisticRegression(C=c, solver='liblinear', max_iter=300).fit(M[:n], y)\n    v = clf.decision_function(M[n:])\n    zs.append((v - v.mean()) / (v.std() + 1e-12))\n\n  raw_at = [j for j, k in enumerate(F) if k.startswith('r_')]\n  D = np.column_stack([F[k] for k in F])\n  if STACK_LR:\n    from sklearn.model_selection import StratifiedKFold\n    oof, inner = np.zeros(n), []\n    for itr, iva in StratifiedKFold(3, shuffle=True, random_state=0).split(oof, y[:n]):\n      f = LogisticRegression(C=1.0, solver='liblinear', max_iter=300).fit(M[:n][itr], y[itr])\n      oof[iva] = f.decision_function(M[:n][iva])\n      inner.append(f.decision_function(M[n:]))\n    te = np.mean(inner, 0)                  # same 2/3 support as the out-of-fold column\n    te = (te - te.mean()) / (te.std() + 1e-12)\n    col = np.concatenate([(oof - oof.mean()) / (oof.std() + 1e-12), te])\n    D = np.column_stack([D, col])           # boosting corrects the linear model where it errs\n  qs = []\n  for it, lr, leaves in GB_GRID:\n    gb = HistGradientBoostingClassifier(max_iter=it, learning_rate=lr, max_leaf_nodes=leaves,\n                                        l2_regularization=1.0, early_stopping=False,\n                                        random_state=0).fit(D[:n], y)\n    v = gb.predict_proba(D[n:])[:, 1]\n    v = np.log(np.clip(v, 1e-6, 1 - 1e-6) / (1 - np.clip(v, 1e-6, 1 - 1e-6)))\n    qs.append((v - v.mean()) / (v.std() + 1e-12))\n  if GB_NORAW:\n    D2 = np.delete(D, raw_at, axis=1)     # same model, counts only: the raw ids are the one\n    gb = HistGradientBoostingClassifier(  # block whose splits do not generalise to new values\n        max_iter=600, learning_rate=0.03, l2_regularization=1.0,\n        early_stopping=False, random_state=0).fit(D2[:n], y)\n    v = gb.predict_proba(D2[n:])[:, 1]\n    v = np.log(np.clip(v, 1e-6, 1 - 1e-6) / (1 - np.clip(v, 1e-6, 1 - 1e-6)))\n    qs.append((v - v.mean()) / (v.std() + 1e-12))\n  if ET_IN_Q:\n    from sklearn.ensemble import ExtraTreesClassifier\n    et = ExtraTreesClassifier(400, max_features='sqrt', min_samples_leaf=4, n_jobs=4,\n                              random_state=0).fit(D[:n], y)\n    v = et.predict_proba(D[n:])[:, 1]\n    v = np.log(np.clip(v, 1e-6, 1 - 1e-6) / (1 - np.clip(v, 1e-6, 1 - 1e-6)))\n    qs.append((v - v.mean()) / (v.std() + 1e-12))\n  q = np.mean(qs, 0)\n\n  np.savez(AUX_FILE, p=np.mean(zs, 0), q=1.0 / (1.0 + np.exp(-q)),\n           ids=X_test['row_id'].to_numpy(np.int64) if 'row_id' in X_test.columns\n           else np.arange(len(X_test)))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  n = len(X_train)\n  codes = _base_codes(X_train, X_test)\n  F = {}\n  for c in KEYCOLS:\n    F['r_' + c] = np.concatenate([X_train[c].to_numpy(float), X_test[c].to_numpy(float)])\n\n  cnt_of = {}\n  for o in CNT_ORDERS:\n    for ks in itertools.combinations(KEYCOLS, o):\n      inv, ncat = _combo(codes, ks)\n      cnt_of[ks] = np.bincount(inv, minlength=ncat).astype(float)[inv]\n      F['n_' + '+'.join(_short(c) for c in ks)] = np.log1p(cnt_of[ks])\n\n  for a, b in itertools.product(KEYCOLS, KEYCOLS):\n    if a == b:\n      continue\n    ia, na = codes[a]\n    F[f'd_{_short(a)}|{_short(b)}'] = np.log1p(_nuniq(ia, na, *codes[b])[ia])\n\n  _aux(codes, n, y_train, X_test, F)      # the side models see the block before dedup\n  F = _dedup(F)\n  return _frame({k: v[:n] for k, v in F.items()}), _frame({k: v[n:] for k, v in F.items()})\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Fold the two side models into TabFM's ranking in standardised-logit space. TabFM keeps\n  the largest weight; if the side models did not run, its prediction is returned untouched.\"\"\"\n  import os\n  if not os.path.exists(AUX_FILE):\n    return pred\n  d = np.load(AUX_FILE)\n  ids = (X_test['row_id'].to_numpy(np.int64) if 'row_id' in X_test.columns\n         else np.arange(len(X_test)))\n  if len(d['p']) != len(pred) or not np.array_equal(d['ids'], ids):\n    return pred\n  out = pred.copy()\n  out.columns = pd.Index([str(c) for c in out.columns], dtype=object)\n  yes = out.columns[-1]\n\n  def z(v):\n    v = np.clip(v, 1e-6, 1 - 1e-6)\n    v = np.log(v / (1 - v))\n    return (v - v.mean()) / (v.std() + 1e-12)\n\n  s = d['p']\n  b = 1.0 / (1.0 + np.exp(-((1.0 - AUX_W - AUX2_W) * z(out[yes].to_numpy())\n                            + AUX_W * (s - s.mean()) / (s.std() + 1e-12)\n                            + AUX2_W * z(d['q']))))\n  out[out.columns[0]] = 1.0 - b\n  out[yes] = b\n  return out\n","readme":"# Amazon employee access — final pipeline\n\n## What it does\n\nThe table is nine high-cardinality categorical id columns and a binary target; the metric is\n`1 - ROC-AUC` (lower is better). TabFM pools labels by itself when it attends over the context\nrows, so nothing label-derived is handed to it — out-of-fold target rates made it clearly worse.\nWhat it cannot recover on its own is label-free co-occurrence structure, so `engineer` gives it\nthe raw ids plus three blocks computed over train and test together: the log count of every\nsingle column value and every pair of column values, and, for every ordered pair of columns, how\nmany distinct values of the second each value of the first touches. Near-duplicate and constant\ncolumns are dropped (the role hierarchy is nested, so a mechanical feature grid produces exact\ncopies). Wider blocks — triple counts, pair PMIs, a co-occurrence SVD, group means — were each\ntried and each cost accuracy, so they are left out rather than pruned later.\n\nTwo side models, fitted on the fold's training rows only, cover the part of the hypothesis space\nTabFM is weakest in. A sparse one-hot logistic regression over single/pair/triple key groups\n(values seen once share a per-group \"rare\" slot), averaged over five regularisation strengths,\nsupplies an explicit weight per category value. A gradient-boosting average over five\n(iterations, learning rate, leaves) settings fits axis-aligned splits on the same dense count\nblock, stacked on the linear model's out-of-fold logit — its test-side column comes from the same\ninner folds as the training side, so the feature means the same thing on both. `engineer` writes\ntheir test-side predictions to `.aux_pred.npz`; `postprocess` reads that back (the hooks run in\nseparate processes) and blends all three in standardised-logit space at .50 TabFM / .24 linear /\n.26 boosting. TabFM stays the largest single component, and the blend's ranking still correlates\n~0.95 with TabFM's own. Validation: 0.1260 for the blend vs 0.1318 for TabFM on these features\nalone, over the 3 CV folds.\n\n## build.sh\n\nNothing. `final/build.sh` prints a note and exits 0. The pipeline reads no precomputed cache —\nevery feature and both side models are derived inside `engineer` from the frames the judge passes\nin. No hand-built caches were made during the run, so `final/build/` is absent. Zero time, zero\ndisk.\n\n## Things a reader could get wrong\n\n- `.aux_pred.npz` at the workspace root is **not** a prerequisite. `engineer` writes it and\n  `postprocess` reads it back within the same run, purely to cross the process boundary between\n  the hooks. Do not pre-build it; a stale copy is rejected by the row-count / row-id guard in\n  `postprocess`, which then returns TabFM's prediction unblended (silently better than wrong, but\n  it is not the scored configuration).\n- Because of that guard, and the single-class early return in `_aux`, `python judge.py check`\n  and any small-slice run legitimately produce a TabFM-only prediction. That is expected, not a\n  broken hook.\n- Counts and degrees are computed over train **and** test rows jointly. This is transductive but\n  label-free — no target information crosses the split.\n- The runtime cost is mostly the side models: five liblinear fits plus three stacking fits on a\n  wide sparse matrix, and five `HistGradientBoostingClassifier` fits, all inside `engineer`,\n  before TabFM runs at all. On the full training set expect this to dominate the non-GPU time.\n- `_frame` forces an object-dtype column Index on purpose: the judge host unpickles hook output\n  without pyarrow, and a pandas 3 arrow-backed string Index cannot be loaded there. Do not\n  \"simplify\" it away.\n","package":[],"derivations":[]},{"id":"anneal","name":"anneal","short_name":"anneal","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.016094,"plain_note":null,"n_train":598,"n_test":300,"n_folds":30,"thresholds":null,"summary":"The task is 598 training rows × 38 mostly-categorical columns, 5 classes, scored by log loss. TabFM does all the predicting; everything that pays sits in how the table is handed to it.","score":0.010308,"gain_pct":35.951286,"medal":null,"category":"I","lines":224,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{},"helper_functions":["_dump","_s","_cap","_levels","_build"],"helper_ranges":{"_dump":[128,133],"_s":[136,138],"_cap":[141,149],"_levels":[152,160],"_build":[163,196]},"hook_helpers":{"preprocess":["_dump"],"engineer":["_s","_cap","_levels","_build"],"postprocess":["_dump"],"folds":[]},"hook_ranges":{"preprocess":[205,209],"engineer":[212,214],"postprocess":[217,224],"folds":[199,202]},"code":"\"\"\"anneal (598 rows x 38 columns, 5 classes, log loss). TabFM with a rebuilt feature representation, one\nlabel-free atypicality column, and a global exponent on its output. CV 0.02151 (identity, same folds) ->\n0.01168, at 99.67% accuracy.\n\nINTENT (e95_formonehot): replace the formability ordinal with one-hots. It is the last column encoded as\na bare ordinal, and its class map is strongly non-monotone -- 1 -> {3:24, 5:14}, 2 -> {2:31, 3:226},\n3 -> {2:21, 3:43, 5:31}, 5 -> {3:6} -- so thresholds are the wrong tool. Adding one-hots alongside the\nordinal was 0.01606 sixty evaluations ago; replacing it is the untested version, and the NA level keeps\nbeing carried by the all-zeros pattern (an explicit flag for it was 0.01207). Reference: 0.01168.\n\nHOW THIS WAS MEASURED. `folds()` replaces the judge's 3-fold CV, which on 598 rows scored\nfolds=[0.069, 0.010, 0.003] -- a spread of 0.029 around a mean of 0.028, unable to resolve anything -- with\nrepeated stratified 10-fold, 3 repeats. Every row is validated three times, the training split is 538 rows\ninstead of 399 (the final fits 598), and comparisons are paired on identical rows. On top of that,\n`postprocess` dumps each fold's raw probabilities to dumps/<tag>/, which replays the judge's score to the\ndigit offline. That made POWER free to fit, and let every configuration be split into the part that\ngeneralises and the part that does not.\n\nWHERE THE LOSS IS. Over the 30 folds = 1794 graded predictions, ~1600 sit at max p >= 0.999, are 100%\ncorrect, and carry ~0.1 nats between them. Essentially the whole loss is two label exceptions:\n  * row 411 -- carbon 10, hardness 0, surface-quality E. Every rule in the table says class 3; it is\n    labelled U, and it is the only one of the 49 carbon-bearing rows that is not 3.\n  * row 377 -- hardness 80 with temper_rolling T. hardness 70 is 13/13 class 3 and 85 is 20/20 class U;\n    80 has exactly one row of each, so its neighbour row 369 decides it and the two disagree.\nSo every change is read as two numbers: `bulk` = mean nats over the other 1788 predictions, `hard` = mean\nnats over those two rows' 6. A change that only moves `hard` is a lottery on two rows; one that moves\n`bulk` is measured on 1788.\n\nWHAT PAID, all of it in the representation. One theme runs through it: this table states its rules through\nlevels that are rare, implicit, or split by noise, and each one had to be given a column of its own.\n  * One-hot every categorical level, indicators for the 14 flag columns, drop the 7 constant ones:\n    0.02151 -> 0.01625. The rules being missed all lived in a rare level of a 3-way string column, which\n    as a single appearance-ordered code is a needle -- enamelability 1 -> class 3 (6/6) and 2 -> class 2\n    (3/3), family TN <=> class 5 (45/45). Row 289 alone had been 6.2 nats, 16% of the loss.\n  * 0 means \"not applicable\", not a magnitude, in five of the seven numerics: carbon is 91% zeros and then\n    jumps to 3, strength 93% then 300, bore 95% then 500, len 46% then 1. NaN them: bulk 0.00248 ->\n    0.00161, total -> 0.01534. No presence indicators alongside: NaN already says it and the five extra\n    columns cost 0.0002. hardness is the exception and keeps its zeros -- see below.\n  * thick/width/len carry imperial-to-metric jitter (0.699/0.700/0.701, 609.9/610.0, 761/762 are one\n    product measured twice), which splits physically identical rows into distinct context entries.\n    Rounding to the step that merges the jitter and nothing coarser (thick 2 dp, len 10) -> 0.01483;\n    thick at 0.2 rounds a 0.75 gauge onto 0.8 and was 0.01630.\n  * Four columns carry 1-2 positive rows in the whole dataset and cannot support any rule (bc, exptl,\n    blue_bright_varn_clean B and V): dropping them moved bulk 0.00162 -> 0.00152 and hard 4.08 -> 4.02.\n  * min_freq: for each row, how many training rows share the rarest value it carries, over all raw\n    columns, capped and log1p'd. Entirely label-free, and the largest single gain after the encoding --\n    0.01498 -> 0.01293, moving both halves (bulk 0.00152 -> 0.00121, hard 4.02 -> 3.84), with the cap\n    worth another 0.0003. It is the only lever found that reaches the exceptions per row rather than\n    globally: both hard rows carry a value seen once, and class U is this dataset's catch-all. Variants\n    all lose -- the mean log-frequency as a second column 0.01429, leave-one-out counts 0.01666 (at 598\n    rows a value seen once is common enough that half the table then reads as unprecedented), excluding\n    thick/width/len 0.01709, counting rounded instead of raw values 0.01293, nearest-neighbour Hamming\n    distance 0.01385 added and 0.01532 as a replacement.\n  * \"not_applicable\" is the all-zeros pattern of a one-hot group, so a decisive missing level costs the\n    model an AND over every column in the group. Three of them got their own indicator: 0.01263 ->\n    0.01188. The curve over how many is clean and unimodal -- 1 flag 0.01209, 2 0.01200, 3 0.01188,\n    4 0.01233, all 7 0.01248 -- and the three that pay are those whose missing level is a class in its\n    own right: surface-quality NA (162 rows, class 3 at 33% against 76% overall and no U at all),\n    condition NA (193 rows, holding all 26 U rows), steel NA (64 rows, no U and no 1). The other four are\n    NOT(a OR b) over two columns, which the model can already form. formability's NA is just as decisive\n    but it is a numeric with a NaN there, and making it explicit was 0.01207 -- the NaN suffices.\n  * formability is left as a bare ordinal even though its class map is non-monotone (1 -> {3:24, 5:14},\n    2 -> {2:31, 3:226}, 3 -> {2:21, 3:43, 5:31}, 5 -> {3:6}): one-hots alongside it were 0.01606 and\n    one-hots instead of it 0.01215, so at 538 rows the four columns cost more than the thresholds do.\n  * With that indicator in place sq_ord became redundant twice over (it is NaN exactly where\n    surface-quality is NA, and the D/E/F/G one-hots carry the rest), and dropping it was the last gain:\n    0.01188 -> 0.01168. shape=COIL is redundant in the same arithmetic sense but dropping it is 0.01190,\n    so the pruning is about repeated information, not column count.\n  * POWER, a global exponent on the output probabilities. Splitting the rows into five groups shows a < 1\n    helps exactly the two groups holding rows 411/377 and costs the other three, so it is insurance,\n    priced at this dataset's ~0.35% rate of confidently-wrong label exceptions -- a property of the 898\n    rows, which the held-out 300 share. At p_true ~ 0.9999 softening costs ~1e-4 nats while lifting a 0.02\n    to 0.03, which is why it is nearly free. Flat: 0.01168 at 0.87, 0.01169 at 0.85, 0.01203 at 1.0. With\n    average_logits=True TabFM returns softmax(mean_logits / T), so softmax_temperature is the same knob,\n    not a second one.\n\nWHAT DID NOT, AND WHY. Every hedging mechanism that acts per member or per draw loses, for one reason:\n1788 predictions sit at p_true ~ 0.9998, so one hedging member in eight costs far more than any hedge on\nthe 6 wrong ones can repay. Arithmetic member averaging 0.02212, with bagging 0.02266; draw-level bagging\n(1 full draw + 4 leaving out a stratified quarter) 0.01951; permuting row order gives no diversity at all\nunless row subsampling is on (0.02169, four draws, otherwise unchanged). Per-member bagging is the one\nthat briefly worked -- max_num_rows at 89% was 0.01416 against 0.01498 -- but once min_freq is in it is\nredundant and only its bulk cost remains (0.01331), so it is off. Every constructor knob was measured,\nmost twice, and the plain defaults win: feature crosses 0.01336, three norm_methods 0.01401, five 0.01691,\nnone alone 0.01823, class_shift=False 0.01714, n_svd_features 0.01656, feat_shuffle none 0.01622,\noutlier_threshold 10 0.01573, TabFM's own out-of-fold vector calibration 0.01742. Out-of-fold ExtraTrees\nlog-odds as extra features 0.03359 -- TabFM adopts the weaker model's errors. Rescaling hardness like the\nother zero-inflated columns gives the best bulk of anything tried (0.00083) and still loses (0.01405 at\nits own exponent), because it spreads 45..85 over the full range and sharpens the 70/80/85 boundary row\n377 sits on the wrong side of; re-tested after min_freq, it still does not pay.\n\"\"\"\nimport os\nimport uuid\n\nimport numpy as np\nimport pandas as pd\n\npd.set_option(\"mode.string_storage\", \"python\")   # the judge process cannot unpickle a pyarrow-backed\n                                                 # string column, so engineer() returns numerics only\n\nTABFM_KWARGS = {}\n\nTAG = \"final\"\nDUMP_DIR = f\"dumps/{TAG}\"\nPOWER = 0.87                                     # global exponent on the output probabilities\n\nNUMERIC = [\"carbon\", \"hardness\", \"strength\", \"thick\", \"width\", \"len\", \"bore\"]\nZERO_IS_NA = [\"carbon\", \"strength\", \"bore\", \"len\", \"width\"]   # 0 == not applicable; hardness excluded\nROUND = {\"thick\": 0.01, \"width\": 0.1, \"len\": 10.0}            # rounding step, in the column's own units\nFLAGS = {\"temper_rolling\": \"T\", \"non-ageing\": \"N\", \"surface-finish\": \"P\", \"bc\": \"Y\", \"bf\": \"Y\",\n         \"bt\": \"Y\", \"bl\": \"Y\", \"chrom\": \"C\", \"phos\": \"P\", \"cbond\": \"Y\", \"exptl\": \"Y\", \"ferro\": \"Y\",\n         \"lustre\": \"Y\", \"packing\": \"3\"}\nONEHOT = [\"family\", \"steel\", \"condition\", \"enamelability\", \"bw_me\", \"oil\",\n          \"blue_bright_varn_clean\", \"shape\", \"surface-quality\"]\nSQ_ORDER = {\"D\": 1.0, \"E\": 2.0, \"F\": 3.0, \"G\": 4.0}\n# \"not_applicable\" is the all-zeros pattern of a one-hot group, so a decisive missing level costs the\n# model an AND over four columns. surface-quality's is the one that matters: 162 rows, class 3 at 33%\n# against 76% overall, no class U at all, and every class-1 and class-5 row in the table.\nNA_FLAGS = [\"surface-quality\", \"condition\", \"steel\"]\nSQ_ORD = False\nFORM_ONEHOT = False   # one-hot instead of the ordinal was 0.01215; the ordinal stays\nFORM_NA = False   # 0.01207: formability keeps only its NaN\nRARITY_CAP_FRAC = 15.0 / 538   # cap on the count, as a fraction of the training rows (15 at search time)\nDROP = [\"bc\", \"exptl\", \"blue_bright_varn_clean=B\", \"blue_bright_varn_clean=V\"]   # 1-2 positive rows each\n# product-type, m, marvi, corr, jurofm, s and p are single-valued and are simply never rebuilt.\n\n\ndef _dump(kind, obj):\n  try:\n    os.makedirs(DUMP_DIR, exist_ok=True)\n    obj.to_pickle(os.path.join(DUMP_DIR, f\"{kind}_{uuid.uuid4().hex}.pkl\"))\n  except Exception:\n    pass\n\n\ndef _s(col):\n  \"\"\"Plain object-dtype array of python strings; never a pandas string dtype.\"\"\"\n  return np.array([(\"\" if x is None or x != x else str(x)) for x in col.tolist()], dtype=object)\n\n\ndef _cap(n):\n  \"\"\"Cap on the frequency count, scaled to the training size.\n\n  A value seen 15 times in a 538-row fold is seen ~17 in the 598 rows the final fits, so an absolute cap\n  would silently move the feature to a different point of its curve. The curve is a plateau over\n  14/15/16/20 (0.01270/0.01263/0.01272/0.01291) with an edge below it (12 is 0.01373), so the anchor is\n  set mid-plateau and scaled: 15 here, 16 in the final. Floored to an integer so that both fold sizes in\n  the search get exactly 15 and one configuration is measured rather than two.\"\"\"\n  return float(int(RARITY_CAP_FRAC * n))\n\n\ndef _levels(X_train):\n  \"\"\"Everything the encoding needs, fitted on the training fold only.\"\"\"\n  lv = {c: sorted(v for v in set(_s(X_train[c])) if v != \"not_applicable\") for c in ONEHOT}\n  lv[\"__cap__\"] = _cap(len(X_train))\n  fm = pd.to_numeric(pd.Series(_s(X_train[\"formability\"])), errors=\"coerce\").to_numpy(float)\n  lv[\"__form__\"] = sorted(set(fm[~np.isnan(fm)]))\n  lv[\"__freq__\"] = {c: pd.Series(_s(X_train[c])).value_counts().to_dict()\n                    for c in X_train.columns if c != \"row_id\"}\n  return lv\n\n\ndef _build(df, levels):\n  out = pd.DataFrame(index=df.index)\n  for c in NUMERIC:\n    v = pd.to_numeric(df[c], errors=\"coerce\").astype(float).to_numpy()\n    if c in ZERO_IS_NA:\n      v = np.where(v > 0, v, np.nan)\n    if c in ROUND:\n      step = ROUND[c]\n      v = np.where(np.isnan(v), v, np.maximum(np.round(v / step) * step, step))\n    out[c] = v\n  for c, v in FLAGS.items():\n    out[c] = (_s(df[c]) == v).astype(float)\n  for c in ONEHOT:\n    s = _s(df[c])\n    for v in levels[c]:\n      out[f\"{c}={v}\"] = (s == v).astype(float)\n    if c in NA_FLAGS:\n      out[f\"{c}=NA\"] = (s == \"not_applicable\").astype(float)\n  fm = pd.to_numeric(pd.Series(_s(df[\"formability\"])), errors=\"coerce\").to_numpy(float)\n  if FORM_ONEHOT:\n    for v in levels[\"__form__\"]:        # non-monotone in the label, so an ordinal is the wrong encoding\n      out[f\"formability={v:g}\"] = (fm == v).astype(float)\n  else:\n    out[\"formability\"] = fm\n  if FORM_NA:                           # 202 rows, and they hold all 26 class-U and all 5 class-1 rows\n    out[\"formability=NA\"] = np.isnan(fm).astype(float)\n  # min_freq: how many training rows share the rarest value this row carries. Label-free.\n  F = np.stack([np.array([levels[\"__freq__\"][c].get(v, 0) for v in _s(df[c])], dtype=float)\n                for c in levels[\"__freq__\"]], axis=1)\n  out[\"min_freq\"] = np.log1p(np.clip(F, 0.0, levels[\"__cap__\"])).min(axis=1)\n  out = out.drop(columns=[c for c in DROP if c in out.columns])\n  if SQ_ORD:\n    out[\"sq_ord\"] = np.array([SQ_ORDER.get(v, np.nan) for v in _s(df[\"surface-quality\"])], dtype=float)\n  return out\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=10, n_repeats=3, random_state=0)\n  return list(rskf.split(np.zeros(len(y_train)), np.asarray(y_train).ravel()))\n\n\ndef preprocess(X_train, y_train, X_test):\n  if \"row_id\" in X_train.columns:   # (row_id, label) pairs rebuild the label map for the offline replay\n    _dump(\"lab\", pd.DataFrame({\"row_id\": X_train[\"row_id\"].to_numpy(),\n                               \"y\": np.asarray(y_train).ravel().astype(object)}))\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  lv = _levels(X_train)\n  return _build(X_train, lv), _build(X_test, lv)\n\n\ndef postprocess(pred, y_orig, X_test):\n  out = pd.DataFrame(pred).copy()\n  rec = out.copy()                  # dumped before POWER, so the offline replay can refit it from raw\n  rec.columns = [str(c) for c in rec.columns]\n  rec.insert(0, \"row_id\", np.asarray(X_test[\"row_id\"]) if \"row_id\" in X_test.columns else np.arange(len(rec)))\n  _dump(\"pred\", rec)\n  q = np.clip(out.to_numpy(float), 1e-300, None) ** POWER\n  return pd.DataFrame(q / q.sum(axis=1, keepdims=True), index=out.index, columns=out.columns)\n","readme":"# anneal — final pipeline\n\n## What it does\n\nThe task is 598 training rows × 38 mostly-categorical columns, 5 classes, scored by log loss. TabFM\ndoes all the predicting; everything that pays sits in how the table is handed to it. `engineer()`\nrebuilds the frame from scratch: every categorical level becomes its own one-hot column, the 14 flag\ncolumns become indicators, the 7 single-valued columns are dropped, and four more columns that carry\nonly 1–2 positive rows in the whole dataset go too. Five of the seven numerics use 0 to mean \"not\napplicable\" rather than as a magnitude, so those zeros become NaN (hardness is the exception and keeps\nits zeros); thick/width/len are rounded to the step that merges imperial-to-metric measurement jitter,\nso physically identical products collapse to one context entry. Three one-hot groups whose missing\nlevel is a class in its own right — surface-quality, condition, steel — get an explicit `=NA`\nindicator, because \"not applicable\" is otherwise the all-zeros pattern and costs the model an AND over\nthe whole group. One engineered column, `min_freq`, is added: for each row, the count of training rows\nsharing the rarest raw value it carries, clipped to a cap and log1p'd — entirely label-free, and the\nlargest single gain after the encoding, since the dataset's few label exceptions all carry a\nvalue seen once. All of this is fitted on the training fold only (levels, frequency tables, cap).\nTabFM then runs with plain default constructor knobs — every one was measured and none beat the\ndefault — and `postprocess()` applies a single global exponent of 0.87 to the output probabilities,\nwhich is cheap insurance at this dataset's ~0.35% rate of confidently-wrong label exceptions.\n\n`folds()` overrides the judge's 3-fold CV with repeated stratified 10-fold × 3 repeats, because at 598\nrows the 3-fold spread (0.029 around a mean of 0.028) could not resolve any change. Reported CV under\nthose folds: 0.01168 log loss at 99.67% accuracy, against 0.02151 for an identity pipeline on the same\nfolds.\n\n## What build.sh builds\n\nNothing. `pipeline.py` opens no file — all its input arrives as dataframe arguments, and every fitted\nquantity is derived inside `engineer()` from the training fold it is given. `final/build.sh` says so\nand exits 0. It takes no time and no disk.\n\nRun:\n\n    cd <this workspace> && bash final/build.sh && python final/run.py\n\nRequires the competition data under `data/` (the same layout the run used) and a working TabFM/GPU\nenvironment; `python final/run.py --check` verifies everything short of the TabFM pass.\n\n## Things a reader could get wrong\n\n- **`final/build/` is not build tooling.** Those four scripts are the offline analysis harness from the\n  search: `oof.py` and `cmp.py` reload the per-fold probability dumps and rescore/recalibrate them\n  without touching a GPU, `aux.py` refits auxiliary models on the identical folds for comparison,\n  `setcfg.py` rewrote `TABFM_KWARGS`/`TAG` between evaluations. They are kept as a record; running them\n  is not part of reproducing the submission.\n- **`postprocess()` writes to `dumps/final/`** (raw pre-exponent probabilities plus a row_id→label map,\n  one pickle per call). That is instrumentation for the offline replay above, not an output anyone\n  needs; it is written, never read back, and can be deleted. On the final fit it is a handful of small\n  files.\n- **The exponent is applied after the dump, not before.** The pickles hold TabFM's raw output, which is\n  why `cmp.py` can refit POWER offline. Do not double-apply it when reading them.\n- **`POWER` and `softmax_temperature` are the same knob**, not two: with `average_logits=True` TabFM\n  returns `softmax(mean_logits / T)`. Only `POWER` is used here.\n- **The rarity cap scales with fold size** (`RARITY_CAP_FRAC = 15/538`), so a 538-row CV fold and the\n  598-row final fit sit at 15 and 16 rather than at different points of the feature's curve. Replacing\n  it with an absolute constant silently changes the configuration.\n- `pd.set_option(\"mode.string_storage\", \"python\")` at import is load-bearing: the judge process cannot\n  unpickle a pyarrow-backed string column.\n","package":[],"derivations":[]},{"id":"Another-Dataset-on-used-Fiat-500","name":"Another-Dataset-on-used-Fiat-500","short_name":"Another-Dataset-on-used-Fiat-500","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":703.639653,"plain_note":null,"n_train":1025,"n_test":513,"n_folds":30,"thresholds":null,"summary":"TabFM predicts the price directly from the seven raw columns: no engineered feature, no dropped column, and default ensemble knobs (`TABFM_KWARGS = {}`). Seventy-one evaluations looked for something better on that front and found nothing — every added column scored 723–753 against 720 for the untouched table, every dropped column 723–756, and every TabFM knob 721–725.","score":693.48622,"gain_pct":1.442988,"medal":null,"category":"I","lines":110,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","postprocess","folds"],"tabfm_kwargs":{},"helper_functions":["_design","_partner","_weights"],"helper_ranges":{"_design":[59,64],"_partner":[67,72],"_weights":[75,89]},"hook_helpers":{"preprocess":["_design","_partner","_weights"],"engineer":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[92,99],"engineer":[102,103],"postprocess":[106,110],"folds":[52,56]},"code":"\"\"\"Used Fiat 500 price, RMSE. 1025 training rows x 7 columns; the final refits on 30 TabArena folds.\n\nWHAT THIS DOES\nTabFM predicts, on the untouched seven columns, with default ensemble knobs -- 71 evaluations found no\nfeature and no knob that beats that. The one thing that does beat it is where TabFM stops being the\nbetter guess. Its out-of-fold error runs from 446 on rows that sit next to a context row to 841 on\nrows in empty space, and a plain GBDT, far worse overall (756 vs 722), is no worse than TabFM out\nthere. So the two are averaged with a weight that is zero on dense rows and opens up on sparse ones:\n\n    w = 0.55 * min(d/dref, 1) * min(km / (2 * median km), 1)      prediction = (1-w)*TabFM + w*GBDT\n\nd is the query's distance to its nearest context row and dref the median spacing of the context\nitself, both measured on the fold's training rows, so the rule rescales itself when the final hands\nit 1025 rows instead of 820. The mileage factor is the second half: after the density factor, low-km\ncars still wanted w=0 and high-km cars w~0.55, and the two factors together beat density alone by 2.5\npoints in a nested offline check (weights chosen on four folds, scored on the fifth) before any of it\nwas measured here. TabFM carries the prediction on every row and all of it on the dense ones\n(tabfm_corr 0.998).\n\nINTENT: eval 72 - restore the best configuration (702.69) with the dead experimental scaffolding\nremoved, and confirm the cleaned file reproduces it exactly.\n\nMEASURED, 15 folds (3 repeats of 5-fold, sig ac149037), identity = 712.29\n  fixed blend w=0.20                                708.95      distance-only weight  705.81\n  + mileage factor (this file, raw target)          703.79      + sqrt target         702.69\n  w_max 0.5 / 0.55 / 0.6 / 0.7 / 0.8       703.87 / 703.79 / 703.84 / 704.35 / 705.42   (flat basin)\n  k0 1.5 / 2.0 / 2.5                       703.97 / 703.84 / 704.48\n  partner depth-3 709.71  huber 705.88  +RF 706.61  log-target 705.91  3rd-NN density 705.99\n  n_feature_crosses on top 705.11\nEarlier, 38 evaluations at 5 folds: nothing beat the identity. Every TABFM_KWARGS knob 721-725 against\n720.45. Every added column 723-753, every dropped column 723-756 -- all seven are load-bearing.\nTarget log/sqrt/reflected-log 721.3/720.8/740.7. Outlier trimming 723, bagged draws 723, mixup context\n749-776, a second model's opinion as a context column 728-753. TabFM's residuals hold no geographic\nstructure left to take (corr 0.03) and it beats 1-NN even among the closest rows.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  postprocess(pred, y_orig, X_test)     -> pred\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]\n\"\"\"\nimport numpy as np\n\nTABFM_KWARGS = {}\n\nW_MAX = 0.55      # blend weight at full distance and full mileage\nD0 = 1.0          # distance scale, in units of the context's own median nearest-neighbour spacing\nKMF = 2.0         # mileage scale, in units of the fold's median km\nBSTASH = '.blend.npy'\nWSTASH = '.wblend.npy'\n\n\ndef folds(X_train, y_train):\n  \"\"\"3 repeats of 5-fold: every row is scored under three different partitions, which is what makes a\n  2-point difference readable on 1025 rows. At a single 5-fold the whole field sat inside 720-724.\"\"\"\n  from sklearn.model_selection import RepeatedKFold\n  return list(RepeatedKFold(n_splits=5, n_repeats=3, random_state=0).split(X_train))\n\n\ndef _design(X, cols=None):\n  \"\"\"Numeric view of the table for the helper models; the id column is not a feature.\"\"\"\n  import pandas as pd\n  A = pd.get_dummies(X.drop(columns=[c for c in ['row_id'] if c in X.columns]),\n                     columns=['model']).astype(float)\n  return A if cols is None else A.reindex(columns=cols, fill_value=0.0)\n\n\ndef _partner(A, y, B):\n  \"\"\"The second opinion, fitted on the fold's training rows only.\"\"\"\n  from sklearn.ensemble import GradientBoostingRegressor\n  g = GradientBoostingRegressor(random_state=0, n_estimators=600, learning_rate=0.05,\n                                max_depth=2, min_samples_leaf=5)\n  return g.fit(A, y).predict(B)\n\n\ndef _weights(A, B):\n  \"\"\"How much of the query row to hand to the partner. Near a context row TabFM's in-context fit is\n  close to the local noise floor and averaging only adds error; in empty space both models are\n  guessing and averaging pays. Both scales are read off the training rows, so nothing is hard-coded\n  to this fold's size.\"\"\"\n  from sklearn.neighbors import NearestNeighbors\n  from sklearn.preprocessing import QuantileTransformer\n  qt = QuantileTransformer(n_quantiles=min(300, len(A)), output_distribution='normal').fit(A)\n  Zt = qt.transform(A)\n  nn = NearestNeighbors(n_neighbors=2).fit(Zt)\n  dref = max(float(np.median(nn.kneighbors(Zt)[0][:, 1])), 1e-9)\n  d = nn.kneighbors(qt.transform(B))[0][:, 0]\n  kmed = max(float(np.median(A['km'].to_numpy())), 1.0)\n  return (W_MAX * np.clip(d / (D0 * dref), 0.0, 1.0)\n          * np.clip(B['km'].to_numpy() / (KMF * kmed), 0.0, 1.0))\n\n\ndef preprocess(X_train, y_train, X_test):\n  \"\"\"TabFM and the partner both work on sqrt(price); postprocess squares the blend back.\"\"\"\n  import
