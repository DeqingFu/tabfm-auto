  --surface: #ffffff;
  --subtle: #f0f4f9;
  --subtle-2: #e2e8f0;
  --border: #d5dfec;
  --hairline: #e5ecf5;
  --text: #0b1220;
  --text-2: #334155;
  --muted: #5f6b7c;
  --accent: #1a73e8;
  --accent-soft: hsla(214 89% 51% / 0.11);
  --pos: #0d7a52;
  --pos-soft: hsla(158 81% 26% / 0.12);
  --neg: hsl(352 70% 42%);
  --neg-soft: hsla(352 76% 48% / 0.11);
  --medal: #b45309;
  --medal-soft: hsla(42 94% 48% / 0.16);
  --shadow-sm: 0 1px 2px hsla(220 30% 10% / 0.04);
  --shadow-md: 0 8px 24px hsla(220 30% 10% / 0.08);
  --code-bg: #f3f6fb;
  --code-bar: #eaf0f8;
  --code-sect: #e2eaf5;
  --code-border: #d5dfec;
  --code-text: #0f172a;
  --code-ln: #64748b;
  --t-kw: #1a73e8;
  --t-fn: #00838f;
  --t-hook: #4f46e5;
  --t-str: #0d7a52;
  --t-num: #0284c7;
  --t-com: #64748b;
  --t-bi: #0369a1;
  --t-const: #4338ca;
  --font-sans: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Google Sans Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070b14;
  --surface: #0f1624;
  --subtle: #162033;
  --subtle-2: #1e2b42;
  --border: #223049;
  --hairline: #1a253a;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --muted: #8b9bb4;
  --accent: #589df6;
  --accent-soft: hsla(213 90% 65% / 0.15);
  --pos: #34d399;
  --pos-soft: hsla(156 68% 46% / 0.15);
  --neg: hsl(352 82% 68%);
  --neg-soft: hsla(352 78% 54% / 0.15);
  --medal: #fbbf24;
  --medal-soft: hsla(44 92% 54% / 0.15);
  --shadow-sm: 0 1px 2px hsla(0 0% 0% / 0.35);
  --shadow-md: 0 10px 28px hsla(0 0% 0% / 0.5);
  --code-bg: #050811;
  --code-bar: #0b111e;
  --code-sect: #111a2e;
  --code-border: #1e2b42;
  --code-text: #e2e8f0;
  --code-ln: #64748b;
  --t-kw: #589df6;
  --t-fn: #22d3ee;
  --t-hook: #818cf8;
  --t-str: #34d399;
  --t-num: #38bdf8;
  --t-com: #64748b;
  --t-bi: #67e8f9;
  --t-const: #a5b4fc;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }


.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1600px;
  height: 100%;
  margin: 0 auto;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 24px;
  height: 24px;
  flex: none;
  display: block;
}
.brand-mark .logo-backbone { fill: #1a73e8; }
.brand-mark .logo-cell-mid { fill: #1a73e8; fill-opacity: 0.36; }
.brand-mark .logo-spark { fill: #00b4d8; }
[data-theme="dark"] .brand-mark .logo-backbone { fill: #589df6; }
[data-theme="dark"] .brand-mark .logo-cell-mid { fill: #589df6; fill-opacity: 0.38; }
[data-theme="dark"] .brand-mark .logo-spark { fill: #22d3ee; }
.brand-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
.brand-sep { color: var(--border); font-weight: 400; }
.brand-sub { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex: none; }

.mode-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
  border: 1px solid var(--hairline);
}
.mode-btn {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  border: 1px solid var(--border);
  background: var(--surface);
}
.icon-btn:hover { background: var(--subtle); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }


.app {
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  min-height: calc(100vh - 52px);
}
.app.no-sidebar { grid-template-columns: minmax(0, 1fr); }
.app.no-sidebar .sidebar { display: none; }


.sidebar {
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.sidebar-top {
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  height: 34px;
  border-radius: 7px;
  background: var(--subtle);
  border: 1px solid transparent;
  transition: border-color 0.12s, background 0.12s;
}
.search:focus-within { background: var(--surface); border-color: var(--accent); }
.search svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.search input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 12.5px;
  color: var(--text);
}
.search input::placeholder { color: var(--muted); }
.kbd-hint {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  line-height: 1.4;
}

.suite-pills {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--subtle);
}
.suite-btn {
  flex: 1 1 auto;
  padding: 4px 4px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}
.suite-btn:hover { color: var(--text); }
.suite-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.list-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}
.list-count { font-size: 12px; font-weight: 600; color: var(--muted); }
.sort-select {
  appearance: none;
  background: transparent;
  border: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  padding-right: 2px;
  text-align: right;
}
.sort-select:hover { color: var(--text); }

.task-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-item {
  width: 100%;
  text-align: left;
  padding: 7px 9px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.1s;
}
.task-item:hover { background: var(--subtle); }
.task-item.is-active { background: var(--accent-soft); }
.task-item-left { min-width: 0; flex: 1; }
.task-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-item.is-active .task-name { color: var(--accent); font-weight: 700; }
.task-sub {
  display: block;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


.gain {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex: none;
}
.gain.pos { background: var(--pos-soft); color: var(--pos); }
.gain.neg { background: var(--neg-soft); color: var(--neg); }
.gain.na { background: var(--subtle); color: var(--muted); }
.gain.medal { background: var(--medal-soft); color: var(--medal); font-family: var(--font-sans); }


.main { min-width: 0; }
.page {
  padding: 20px 24px 36px;
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}


.task-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.th-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.cat-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}
.th-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}
.th-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.kpi-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
}
.kpi {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-left: 18px;
  border-left: 1px solid var(--hairline);
}
.kpi:first-child { padding-left: 0; border-left: none; }
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.th-summary {
  margin: 10px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--hairline);
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-2);
  max-width: 92ch;
}
.th-summary code, .cell-sum code, .doc code {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--subtle);
  color: var(--text);
}


.workspace {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ws-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 16px;
  min-height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.ws-tabs {
  display: flex;
  align-items: stretch;
  gap: 4px;
}
.ws-tab {
  position: relative;
  padding: 11px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.12s;
}
.ws-tab:hover { color: var(--text); }
.ws-tab.is-active { color: var(--text); }
.ws-tab.is-active::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.tab-meta {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.ws-right {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 0;
}
.kw-group {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.kw-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.kw-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--subtle);
  color: var(--text-2);
}
.tb-btn {
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--subtle);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.tb-btn:hover { background: var(--subtle-2); color: var(--text); }


.stage-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 16px;
  background: var(--subtle);
  border-bottom: 1px solid var(--border);
}
.stage-group, .helper-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.bar-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-right: 3px;
}
.hook-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.hook-btn:hover:not(:disabled) { border-color: var(--text-2); color: var(--text); }
.hook-btn.pass-hook { opacity: 0.65; font-weight: 500; }
.hook-btn.is-selected {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  opacity: 1;
}
.hook-sub {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  opacity: 0.78;
}
.helper-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--hairline);
}
.helper-btn:hover { border-color: var(--accent); color: var(--accent); }
.helper-btn.other-hook {
  background: transparent;
  border-style: dashed;
  color: var(--muted);
}
.helper-btn.other-hook:hover { color: var(--text); border-color: var(--border); }


.code-wrap { background: var(--code-bg); color: var(--code-text); }
.code {
  margin: 0;
  padding: 12px 0 16px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  tab-size: 2;
}
.code-sect {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  margin: 8px 0 4px;
  background: var(--code-sect);
  border-top: 1px solid var(--code-border);
  border-bottom: 1px solid var(--code-border);
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-2);
}
.code-sect:first-child { margin-top: 0; border-top: none; }
.code-sect b { font-family: var(--font-mono); color: var(--t-hook); font-weight: 600; }
.code-sect.is-flash { background: hsla(214 89% 51% / 0.20); }
.code-line {
  display: block;
  padding: 0 16px 0 0;
  white-space: pre;
}
.code-line:hover { background: hsla(215 28% 50% / 0.1); }
.code-line.is-flash { background: hsla(214 89% 51% / 0.18); }
.ln {
  display: inline-block;
  width: 46px;
  padding-right: 12px;
  text-align: right;
  color: var(--code-ln);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.t-kw { color: var(--t-kw); }
.t-fn { color: var(--t-fn); font-weight: 600; }
.t-hook { color: var(--t-hook); font-weight: 700; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-bi { color: var(--t-bi); }
.t-const { color: var(--t-const); }


.doc {
  padding: 22px 26px 28px;
  max-width: 82ch;
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
}
.doc h3, .doc h4, .doc h5 {
  margin: 20px 0 8px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.doc h3:first-child, .doc h4:first-child { margin-top: 0; }
.doc p { margin: 0 0 12px; color: var(--text-2); }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; color: var(--text-2); }
.doc li { margin-bottom: 5px; }
.doc b { color: var(--text); font-weight: 600; }
.doc em { font-style: italic; }
.doc pre {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-text);
  font-family: var(--font-mono);
  font-size: 12.5px;
  overflow-x: auto;
}
.doc-tbl { margin: 12px 0; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.doc-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc-tbl th, .doc-tbl td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--hairline); }
.doc-tbl th { background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 600; }
.doc-tbl tr:last-child td { border-bottom: none; }


.summary-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.stat {
  padding: 14px 18px;
  border-left: 1px solid var(--hairline);
}
.stat:first-child { border-left: none; }
.stat-k { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat-v {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-v.pos { color: var(--pos); }
.stat-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
}
.seg button {
  padding: 4px 11px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.seg button:hover { color: var(--text); }
.seg button.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td {
  padding: 10px 12px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--hairline);
}
.tbl th {
  background: var(--subtle);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  user-select: none;
}
.tbl th.sortable { cursor: pointer; }

<script id="explorer-data" type="application/json">{"tasks":[{"id":"airfoil_self_noise","name":"airfoil_self_noise","short_name":"airfoil_self_noise","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":1.071162,"plain_note":null,"n_train":1002,"n_test":501,"n_folds":30,"thresholds":null,"summary":"The prediction is made by TabFM, frozen and zero-shot, attending over the training rows; the pipeline around it is entirely a change of coordinates. The NASA airfoil self-noise data is 106 (chord, free-stream velocity, angle of attack) configurations, each swept over 1/3-octave frequency bands, and the physics that sets the sound pressure level is multiplicative and lives on log scales.","score":0.916498,"gain_pct":14.438899,"medal":null,"category":"I","lines":48,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["engineer"],"tabfm_kwargs":{},"helper_functions":["_phys"],"helper_ranges":{"_phys":[11,32]},"hook_helpers":{"preprocess":[],"engineer":["_phys"],"sample":[],"postprocess":[]},"hook_ranges":{"preprocess":[35,36],"engineer":[39,40],"sample":[43,44],"postprocess":[47,48]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {}\n\nC_SOUND = 340.46      # speed of sound in air (m/s)\nNU = 1.5e-5           # kinematic viscosity of air (m^2/s)\nDROP_COLS = ['frequency', 'free-stream-velocity', 'chord-length']\n\n\ndef _phys(df):\n  f = df['frequency'].to_numpy(dtype=float)\n  c = df['chord-length'].to_numpy(dtype=float)\n  u = df['free-stream-velocity'].to_numpy(dtype=float)\n  d = df['suction-side-displacement-thickness'].to_numpy(dtype=float)\n\n  m = u / C_SOUND\n  re_c = u * c / NU\n  re_d = u * d / NU\n  st_d = f * d / u\n\n  out = df.copy()\n  out['log_f'] = np.log10(f)\n  out['log_d'] = np.log10(d)\n  out['log_c'] = np.log10(c)\n  out['log_St_d'] = np.log10(st_d)\n  out['log_St_c'] = np.log10(f * c / u)\n  out['log_Re_c'] = np.log10(re_c)\n  out['log_Re_d'] = np.log10(re_d)\n  out['log_d_over_c'] = np.log10(d / c)\n  out['bpm_scale'] = 10.0 * np.log10(d) + 50.0 * np.log10(m)\n  return out.drop(columns=DROP_COLS)\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  return _phys(X_train), _phys(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  return [np.arange(len(X_train))]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# airfoil_self_noise — TabFM pipeline\n\n## What it does\n\nThe prediction is made by TabFM, frozen and zero-shot, attending over the training rows; the pipeline\naround it is entirely a change of coordinates. The NASA airfoil self-noise data is 106 (chord,\nfree-stream velocity, angle of attack) configurations, each swept over 1/3-octave frequency bands,\nand the physics that sets the sound pressure level is multiplicative and lives on log scales. So\n`engineer()` rewrites each row in the variables the Brooks–Pope–Marcolini semi-empirical model is\nactually written in: log frequency, log displacement thickness and log chord; the two Strouhal\nnumbers `f·δ/U` and `f·c/U`; the chord- and thickness-based Reynolds numbers; the thickness-to-chord\nratio; and a `10·log10(δ) + 50·log10(M)` amplitude term that carries the model's overall level\nscaling. The raw columns ride along, except `frequency`, `free-stream-velocity` and `chord-length`,\nwhich are dropped — the log and dimensionless forms of those three say the same thing more usefully,\nand keeping both only dilutes the attention. The target is left untouched, the full training split is\nhanded to TabFM as a single draw, `TABFM_KWARGS` is empty (judge defaults), and `postprocess()` is a\npass-through. This coordinate change alone is what the run bought: RMSE 1.377 on the identity\npipeline down to about 1.247.\n\n## What build.sh builds\n\nNothing. `pipeline.py` names no file and reads nothing but the DataFrames the judge hands its hooks,\nand the run wrote no helper scripts or caches — `final/build/` is empty for that reason.\n`bash final/build.sh` prints one line and exits 0. Runtime: instant. Disk: zero.\n\n## Things a reader could get wrong\n\n- **The data does not come from `data/`.** This is a `tabarena:` task. `judge.load_task` reads the\n  fold cache at `~/.cache/tabarena/airfoil_self_noise/fold_0/{train,test}.csv` (override with\n  `TABARENA_DIR`), and asserts with \"fold cache missing; run the tabarena downloader\" if it is not\n  there. The `data/train.csv` and `data/test.csv` in this workspace are a label-free copy the judge\n  materialised for the agent to look at; they are not what a rerun loads. Populating that cache is\n  the one prerequisite, and it is upstream of this directory — build.sh deliberately does not try to\n  fetch it.\n- **The scored number is a 30-fold mean, not this workspace's fold 0.** The final ran the pipeline\n  independently on each of the 30 folds the published TabFM baseline used and averaged the RMSE.\n  `python judge.py val` during the run was 3-fold CV *inside* fold 0's training split, so its numbers\n  (the ~1.247 above) are search-time signal, not the reported test score.\n- **`python final/run.py` will not finish on this task, and the pipeline is not the reason.** After\n  the TabFM pass it does `pd.read_csv(T.competition.sample_submission)` to order the submission, and\n  `load_tabarena_task` never sets `T.competition` — there is no sample submission for a TabArena\n  fold. Expect an `AttributeError` at that line; `T.submission(pred, T.X_test)` just above it has\n  already produced the `row_id` / `scaled-sound-pressure` frame. `python final/run.py --check` stops\n  before all of this and is fine. I read this off `final/judge.py:266-296` and `final/run.py:119-124`\n  rather than executing it — this session had no shell — so treat it as a code reading, and note that\n  `run.py` and `judge.py` are outside the two files I was allowed to write, hence left alone.\n- **`folds()` is not defined**, on purpose: the rows are exchangeable within fold 0's training split\n  once the configuration structure is in the features, so validation used the judge's own\n  `KFold(3, shuffle, seed 0)`, whose 2/3 train ratio matches what each TabArena final fold sees."},{"id":"Amazon_employee_access","name":"Amazon_employee_access","short_name":"Amazon_employee_access","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.141604,"plain_note":null,"n_train":21846,"n_test":10923,"n_folds":9,"thresholds":null,"summary":"The table is nine high-cardinality categorical id columns and a binary target; the metric is `1 - ROC-AUC` (lower is better). TabFM pools labels by itself when it attends over the context rows, so nothing label-derived is handed to it — out-of-fold target rates made it clearly worse.","score":0.103916,"gain_pct":26.615067,"medal":null,"category":"II","lines":218,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer","postprocess"],"tabfm_kwargs":{},"helper_functions":["_frame","_short","_base_codes","_combo","_nuniq","_dedup","_aux"],"helper_ranges":{"_frame":[28,33],"_short":[36,37],"_base_codes":[40,47],"_combo":[50,57],"_nuniq":[60,63],"_dedup":[66,82],"_aux":[85,160]},"hook_helpers":{"preprocess":[],"engineer":["_frame","_short","_base_codes","_combo","_nuniq","_dedup","_aux"],"postprocess":[]},"hook_ranges":{"preprocess":[163,164],"engineer":[167,189],"postprocess":[192,218]},"code":"import itertools\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {}\n\nBASE = ['RESOURCE', 'MGR_ID', 'ROLE_ROLLUP_1', 'ROLE_ROLLUP_2', 'ROLE_DEPTNAME',\n        'ROLE_TITLE', 'ROLE_FAMILY_DESC', 'ROLE_FAMILY', 'ROLE_CODE']\nKEYCOLS = [c for c in BASE if c != 'ROLE_CODE']   # ROLE_CODE is 1-1 with ROLE_TITLE\n\nCNT_ORDERS = [1, 2]        # count-encode every keyset of these sizes (label-free, train+test)\nDEDUP = 0.999              # drop a column that repeats an earlier one; the role hierarchy is nested\n\nAUX_ORDERS = [1, 2, 3]     # one-hot key groups for the linear side model\nAUX_MIN_COUNT = 2          # values seen once share a 'rare' slot per group\nAUX_CS = [0.1, 0.3, 1.0, 3.0, 10.0]   # its predictions are averaged over these regularisations\nAUX_W = 0.24               # weight of the linear side model in the blend\nAUX2_W = 0.26              # weight of the gradient-boosting side model\nGB_GRID = [(600, 0.03, 31), (300, 0.08, 15), (900, 0.02, 63),   # (iters, rate, leaves) of the\n           (400, 0.05, 8), (250, 0.10, 4)]                      # boosting fits that are averaged\nGB_NORAW = False           # one boosting fit sees the count block without the raw ids\nET_IN_Q = False            # an extra-trees fit joins the boosting average\nSTACK_LR = True            # the boosting model also sees the linear model's out-of-fold logit\nAUX_FILE = '.aux_pred.npz'\n\n\ndef _frame(d):\n  \"\"\"Object-dtype column index: the judge host unpickles our hook output without pyarrow,\n  and pandas 3's arrow-backed string Index cannot be loaded there.\"\"\"\n  f = pd.DataFrame(d)\n  f.columns = pd.Index(list(f.columns), dtype=object)\n  return f\n\n\ndef _short(c):\n  return c[:4] + c[-2:]\n\n\ndef _base_codes(X_train, X_test):\n  \"\"\"Dense codes per column over train+test, so keys line up across the split.\"\"\"\n  out = {}\n  for c in BASE:\n    v = np.concatenate([X_train[c].to_numpy(np.int64), X_test[c].to_numpy(np.int64)])\n    _, inv = np.unique(v, return_inverse=True)\n    out[c] = (inv.astype(np.int64), int(inv.max()) + 1)\n  return out\n\n\ndef _combo(codes, ks):\n  \"\"\"Dense codes for the tuple of columns `ks`.\"\"\"\n  s = np.zeros(len(codes[ks[0]][0]), np.int64)\n  for c in ks:\n    inv, k = codes[c]\n    s = s * k + inv\n  _, inv = np.unique(s, return_inverse=True)\n  return inv.astype(np.int64), int(inv.max()) + 1\n\n\ndef _nuniq(kc, nk, vc, nv):\n  \"\"\"How many distinct values of the second key each value of the first co-occurs with.\"\"\"\n  u = np.unique(kc * nv + vc)\n  return np.bincount(u // nv, minlength=nk).astype(float)\n\n\ndef _dedup(F):\n  \"\"\"Drop constant columns and ones that repeat an earlier column. ROLE_TITLE fixes\n  ROLE_FAMILY and MGR_ID nearly fixes the rollups, so a mechanical feature grid over this\n  table produces exact copies.\"\"\"\n  names = list(F)\n  M = np.column_stack([F[k] for k in names]).astype(np.float64)\n  sd = M.std(0)\n  keep, Z = [], []\n  for j, nm in enumerate(names):\n    if sd[j] \u003c 1e-9:\n      continue\n    z = (M[:, j] - M[:, j].mean()) / sd[j]\n    if Z and np.abs(np.asarray(Z) @ z).max() / len(z) \u003e DEDUP:\n      continue\n    keep.append(nm)\n    Z.append(z)\n  return {k: F[k] for k in keep}\n\n\ndef _aux(codes, n, y_train, X_test, F):\n  \"\"\"Side models, fitted on the fold's training rows only and handed to `postprocess`\n  through the workspace, because the two hooks run in separate processes.\n\n  `p`: logistic regression on the one-hot of every single/pair/triple key -- an explicit\n       weight per category value, which no aggregate column gives TabFM.\n  `q`: gradient boosting on the same dense count block TabFM sees.\n  \"\"\"\n  from scipy import sparse\n  from sklearn.ensemble import HistGradientBoostingClassifier\n  from sklearn.linear_model import LogisticRegression\n  lab = y_train.astype(str).to_numpy()\n  y = (lab == np.unique(lab)[-1]).astype(int)\n  if y[:n].min() == y[:n].max():          # single-class slice (judge.py check): nothing to fit\n    return\n  N = len(codes[BASE[0]][0])\n\n  cols, off = [], 0\n  for o in AUX_ORDERS:\n    for ks in itertools.combinations(KEYCOLS, o):\n      inv, ncat = _combo(codes, ks)\n      keep = np.bincount(inv, minlength=ncat) \u003e= AUX_MIN_COUNT\n      m = np.full(ncat, int(keep.sum()))   # everything rarer shares the group's last slot\n      m[keep] = np.arange(int(keep.sum()))\n      cols.append(m[inv] + off)\n      off += int(keep.sum()) + 1\n  C = np.stack(cols, 1)\n  M = sparse.csr_matrix((np.ones(C.size), (np.repeat(np.arange(N), C.shape[1]), C.ravel())),\n                        shape=(N, off))\n  zs = []\n  for c in AUX_CS:\n    clf = LogisticRegression(C=c, solver='liblinear', max_iter=300).fit(M[:n], y)\n    v = clf.decision_function(M[n:])\n    zs.append((v - v.mean()) / (v.std() + 1e-12))\n\n  raw_at = [j for j, k in enumerate(F) if k.startswith('r_')]\n  D = np.column_stack([F[k] for k in F])\n  if STACK_LR:\n    from sklearn.model_selection import StratifiedKFold\n    oof, inner = np.zeros(n), []\n    for itr, iva in StratifiedKFold(3, shuffle=True, random_state=0).split(oof, y[:n]):\n      f = LogisticRegression(C=1.0, solver='liblinear', max_iter=300).fit(M[:n][itr], y[itr])\n      oof[iva] = f.decision_function(M[:n][iva])\n      inner.append(f.decision_function(M[n:]))\n    te = np.mean(inner, 0)                  # same 2/3 support as the out-of-fold column\n    te = (te - te.mean()) / (te.std() + 1e-12)\n    col = np.concatenate([(oof - oof.mean()) / (oof.std() + 1e-12), te])\n    D = np.column_stack([D, col])           # boosting corrects the linear model where it errs\n  qs = []\n  for it, lr, leaves in GB_GRID:\n    gb = HistGradientBoostingClassifier(max_iter=it, learning_rate=lr, max_leaf_nodes=leaves,\n                                        l2_regularization=1.0, early_stopping=False,\n                                        random_state=0).fit(D[:n], y)\n    v = gb.predict_proba(D[n:])[:, 1]\n    v = np.log(np.clip(v, 1e-6, 1 - 1e-6) / (1 - np.clip(v, 1e-6, 1 - 1e-6)))\n    qs.append((v - v.mean()) / (v.std() + 1e-12))\n  if GB_NORAW:\n    D2 = np.delete(D, raw_at, axis=1)     # same model, counts only: the raw ids are the one\n    gb = HistGradientBoostingClassifier(  # block whose splits do not generalise to new values\n        max_iter=600, learning_rate=0.03, l2_regularization=1.0,\n        early_stopping=False, random_state=0).fit(D2[:n], y)\n    v = gb.predict_proba(D2[n:])[:, 1]\n    v = np.log(np.clip(v, 1e-6, 1 - 1e-6) / (1 - np.clip(v, 1e-6, 1 - 1e-6)))\n    qs.append((v - v.mean()) / (v.std() + 1e-12))\n  if ET_IN_Q:\n    from sklearn.ensemble import ExtraTreesClassifier\n    et = ExtraTreesClassifier(400, max_features='sqrt', min_samples_leaf=4, n_jobs=4,\n                              random_state=0).fit(D[:n], y)\n    v = et.predict_proba(D[n:])[:, 1]\n    v = np.log(np.clip(v, 1e-6, 1 - 1e-6) / (1 - np.clip(v, 1e-6, 1 - 1e-6)))\n    qs.append((v - v.mean()) / (v.std() + 1e-12))\n  q = np.mean(qs, 0)\n\n  np.savez(AUX_FILE, p=np.mean(zs, 0), q=1.0 / (1.0 + np.exp(-q)),\n           ids=X_test['row_id'].to_numpy(np.int64) if 'row_id' in X_test.columns\n           else np.arange(len(X_test)))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  n = len(X_train)\n  codes = _base_codes(X_train, X_test)\n  F = {}\n  for c in KEYCOLS:\n    F['r_' + c] = np.concatenate([X_train[c].to_numpy(float), X_test[c].to_numpy(float)])\n\n  cnt_of = {}\n  for o in CNT_ORDERS:\n    for ks in itertools.combinations(KEYCOLS, o):\n      inv, ncat = _combo(codes, ks)\n      cnt_of[ks] = np.bincount(inv, minlength=ncat).astype(float)[inv]\n      F['n_' + '+'.join(_short(c) for c in ks)] = np.log1p(cnt_of[ks])\n\n  for a, b in itertools.product(KEYCOLS, KEYCOLS):\n    if a == b:\n      continue\n    ia, na = codes[a]\n    F[f'd_{_short(a)}|{_short(b)}'] = np.log1p(_nuniq(ia, na, *codes[b])[ia])\n\n  _aux(codes, n, y_train, X_test, F)      # the side models see the block before dedup\n  F = _dedup(F)\n  return _frame({k: v[:n] for k, v in F.items()}), _frame({k: v[n:] for k, v in F.items()})\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Fold the two side models into TabFM's ranking in standardised-logit space. TabFM keeps\n  the largest weight; if the side models did not run, its prediction is returned untouched.\"\"\"\n  import os\n  if not os.path.exists(AUX_FILE):\n    return pred\n  d = np.load(AUX_FILE)\n  ids = (X_test['row_id'].to_numpy(np.int64) if 'row_id' in X_test.columns\n         else np.arange(len(X_test)))\n  if len(d['p']) != len(pred) or not np.array_equal(d['ids'], ids):\n    return pred\n  out = pred.copy()\n  out.columns = pd.Index([str(c) for c in out.columns], dtype=object)\n  yes = out.columns[-1]\n\n  def z(v):\n    v = np.clip(v, 1e-6, 1 - 1e-6)\n    v = np.log(v / (1 - v))\n    return (v - v.mean()) / (v.std() + 1e-12)\n\n  s = d['p']\n  b = 1.0 / (1.0 + np.exp(-((1.0 - AUX_W - AUX2_W) * z(out[yes].to_numpy())\n                            + AUX_W * (s - s.mean()) / (s.std() + 1e-12)\n                            + AUX2_W * z(d['q']))))\n  out[out.columns[0]] = 1.0 - b\n  out[yes] = b\n  return out\n","readme":"# Amazon employee access — final pipeline\n\n## What it does\n\nThe table is nine high-cardinality categorical id columns and a binary target; the metric is\n`1 - ROC-AUC` (lower is better). TabFM pools labels by itself when it attends over the context\nrows, so nothing label-derived is handed to it — out-of-fold target rates made it clearly worse.\nWhat it cannot recover on its own is label-free co-occurrence structure, so `engineer` gives it\nthe raw ids plus three blocks computed over train and test together: the log count of every\nsingle column value and every pair of column values, and, for every ordered pair of columns, how\nmany distinct values of the second each value of the first touches. Near-duplicate and constant\ncolumns are dropped (the role hierarchy is nested, so a mechanical feature grid produces exact\ncopies). Wider blocks — triple counts, pair PMIs, a co-occurrence SVD, group means — were each\ntried and each cost accuracy, so they are left out rather than pruned later.\n\nTwo side models, fitted on the fold's training rows only, cover the part of the hypothesis space\nTabFM is weakest in. A sparse one-hot logistic regression over single/pair/triple key groups\n(values seen once share a per-group \"rare\" slot), averaged over five regularisation strengths,\nsupplies an explicit weight per category value. A gradient-boosting average over five\n(iterations, learning rate, leaves) settings fits axis-aligned splits on the same dense count\nblock, stacked on the linear model's out-of-fold logit — its test-side column comes from the same\ninner folds as the training side, so the feature means the same thing on both. `engineer` writes\ntheir test-side predictions to `.aux_pred.npz`; `postprocess` reads that back (the hooks run in\nseparate processes) and blends all three in standardised-logit space at .50 TabFM / .24 linear /\n.26 boosting. TabFM stays the largest single component, and the blend's ranking still correlates\n~0.95 with TabFM's own. Validation: 0.1260 for the blend vs 0.1318 for TabFM on these features\nalone, over the 3 CV folds.\n\n## build.sh\n\nNothing. `final/build.sh` prints a note and exits 0. The pipeline reads no precomputed cache —\nevery feature and both side models are derived inside `engineer` from the frames the judge passes\nin. No hand-built caches were made during the run, so `final/build/` is absent. Zero time, zero\ndisk.\n\n## Things a reader could get wrong\n\n- `.aux_pred.npz` at the workspace root is **not** a prerequisite. `engineer` writes it and\n  `postprocess` reads it back within the same run, purely to cross the process boundary between\n  the hooks. Do not pre-build it; a stale copy is rejected by the row-count / row-id guard in\n  `postprocess`, which then returns TabFM's prediction unblended (silently better than wrong, but\n  it is not the scored configuration).\n- Because of that guard, and the single-class early return in `_aux`, `python judge.py check`\n  and any small-slice run legitimately produce a TabFM-only prediction. That is expected, not a\n  broken hook.\n- Counts and degrees are computed over train **and** test rows jointly. This is transductive but\n  label-free — no target information crosses the split.\n- The runtime cost is mostly the side models: five liblinear fits plus three stacking fits on a\n  wide sparse matrix, and five `HistGradientBoostingClassifier` fits, all inside `engineer`,\n  before TabFM runs at all. On the full training set expect this to dominate the non-GPU time.\n- `_frame` forces an object-dtype column Index on purpose: the judge host unpickles hook output\n  without pyarrow, and a pandas 3 arrow-backed string Index cannot be loaded there. Do not\n  \"simplify\" it away."},{"id":"anneal","name":"anneal","short_name":"anneal","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.016094,"plain_note":null,"n_train":598,"n_test":300,"n_folds":30,"thresholds":null,"summary":"The task is 598 training rows × 38 mostly-categorical columns, 5 classes, scored by log loss. TabFM does all the predicting; everything that pays sits in how the table is handed to it.","score":0.010308,"gain_pct":35.951286,"medal":null,"category":"I","lines":133,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{},"helper_functions":["_dump","_s","_cap","_levels","_build"],"helper_ranges":{"_dump":[37,42],"_s":[45,47],"_cap":[50,58],"_levels":[61,69],"_build":[72,105]},"hook_helpers":{"preprocess":["_dump"],"engineer":["_s","_cap","_levels","_build"],"postprocess":["_dump"],"folds":[]},"hook_ranges":{"preprocess":[114,118],"engineer":[121,123],"postprocess":[126,133],"folds":[108,111]},"code":"import os\nimport uuid\n\nimport numpy as np\nimport pandas as pd\n\npd.set_option(\"mode.string_storage\", \"python\")   # the judge process cannot unpickle a pyarrow-backed\n                                                 # string column, so engineer() returns numerics only\n\nTABFM_KWARGS = {}\n\nTAG = \"final\"\nDUMP_DIR = f\"dumps/{TAG}\"\nPOWER = 0.87                                     # global exponent on the output probabilities\n\nNUMERIC = [\"carbon\", \"hardness\", \"strength\", \"thick\", \"width\", \"len\", \"bore\"]\nZERO_IS_NA = [\"carbon\", \"strength\", \"bore\", \"len\", \"width\"]   # 0 == not applicable; hardness excluded\nROUND = {\"thick\": 0.01, \"width\": 0.1, \"len\": 10.0}            # rounding step, in the column's own units\nFLAGS = {\"temper_rolling\": \"T\", \"non-ageing\": \"N\", \"surface-finish\": \"P\", \"bc\": \"Y\", \"bf\": \"Y\",\n         \"bt\": \"Y\", \"bl\": \"Y\", \"chrom\": \"C\", \"phos\": \"P\", \"cbond\": \"Y\", \"exptl\": \"Y\", \"ferro\": \"Y\",\n         \"lustre\": \"Y\", \"packing\": \"3\"}\nONEHOT = [\"family\", \"steel\", \"condition\", \"enamelability\", \"bw_me\", \"oil\",\n          \"blue_bright_varn_clean\", \"shape\", \"surface-quality\"]\nSQ_ORDER = {\"D\": 1.0, \"E\": 2.0, \"F\": 3.0, \"G\": 4.0}\n# \"not_applicable\" is the all-zeros pattern of a one-hot group, so a decisive missing level costs the\n# model an AND over four columns. surface-quality's is the one that matters: 162 rows, class 3 at 33%\n# against 76% overall, no class U at all, and every class-1 and class-5 row in the table.\nNA_FLAGS = [\"surface-quality\", \"condition\", \"steel\"]\nSQ_ORD = False\nFORM_ONEHOT = False   # one-hot instead of the ordinal was 0.01215; the ordinal stays\nFORM_NA = False   # 0.01207: formability keeps only its NaN\nRARITY_CAP_FRAC = 15.0 / 538   # cap on the count, as a fraction of the training rows (15 at search time)\nDROP = [\"bc\", \"exptl\", \"blue_bright_varn_clean=B\", \"blue_bright_varn_clean=V\"]   # 1-2 positive rows each\n# product-type, m, marvi, corr, jurofm, s and p are single-valued and are simply never rebuilt.\n\n\ndef _dump(kind, obj):\n  try:\n    os.makedirs(DUMP_DIR, exist_ok=True)\n    obj.to_pickle(os.path.join(DUMP_DIR, f\"{kind}_{uuid.uuid4().hex}.pkl\"))\n  except Exception:\n    pass\n\n\ndef _s(col):\n  \"\"\"Plain object-dtype array of python strings; never a pandas string dtype.\"\"\"\n  return np.array([(\"\" if x is None or x != x else str(x)) for x in col.tolist()], dtype=object)\n\n\ndef _cap(n):\n  \"\"\"Cap on the frequency count, scaled to the training size.\n\n  A value seen 15 times in a 538-row fold is seen ~17 in the 598 rows the final fits, so an absolute cap\n  would silently move the feature to a different point of its curve. The curve is a plateau over\n  14/15/16/20 (0.01270/0.01263/0.01272/0.01291) with an edge below it (12 is 0.01373), so the anchor is\n  set mid-plateau and scaled: 15 here, 16 in the final. Floored to an integer so that both fold sizes in\n  the search get exactly 15 and one configuration is measured rather than two.\"\"\"\n  return float(int(RARITY_CAP_FRAC * n))\n\n\ndef _levels(X_train):\n  \"\"\"Everything the encoding needs, fitted on the training fold only.\"\"\"\n  lv = {c: sorted(v for v in set(_s(X_train[c])) if v != \"not_applicable\") for c in ONEHOT}\n  lv[\"__cap__\"] = _cap(len(X_train))\n  fm = pd.to_numeric(pd.Series(_s(X_train[\"formability\"])), errors=\"coerce\").to_numpy(float)\n  lv[\"__form__\"] = sorted(set(fm[~np.isnan(fm)]))\n  lv[\"__freq__\"] = {c: pd.Series(_s(X_train[c])).value_counts().to_dict()\n                    for c in X_train.columns if c != \"row_id\"}\n  return lv\n\n\ndef _build(df, levels):\n  out = pd.DataFrame(index=df.index)\n  for c in NUMERIC:\n    v = pd.to_numeric(df[c], errors=\"coerce\").astype(float).to_numpy()\n    if c in ZERO_IS_NA:\n      v = np.where(v \u003e 0, v, np.nan)\n    if c in ROUND:\n      step = ROUND[c]\n      v = np.where(np.isnan(v), v, np.maximum(np.round(v / step) * step, step))\n    out[c] = v\n  for c, v in FLAGS.items():\n    out[c] = (_s(df[c]) == v).astype(float)\n  for c in ONEHOT:\n    s = _s(df[c])\n    for v in levels[c]:\n      out[f\"{c}={v}\"] = (s == v).astype(float)\n    if c in NA_FLAGS:\n      out[f\"{c}=NA\"] = (s == \"not_applicable\").astype(float)\n  fm = pd.to_numeric(pd.Series(_s(df[\"formability\"])), errors=\"coerce\").to_numpy(float)\n  if FORM_ONEHOT:\n    for v in levels[\"__form__\"]:        # non-monotone in the label, so an ordinal is the wrong encoding\n      out[f\"formability={v:g}\"] = (fm == v).astype(float)\n  else:\n    out[\"formability\"] = fm\n  if FORM_NA:                           # 202 rows, and they hold all 26 class-U and all 5 class-1 rows\n    out[\"formability=NA\"] = np.isnan(fm).astype(float)\n  # min_freq: how many training rows share the rarest value this row carries. Label-free.\n  F = np.stack([np.array([levels[\"__freq__\"][c].get(v, 0) for v in _s(df[c])], dtype=float)\n                for c in levels[\"__freq__\"]], axis=1)\n  out[\"min_freq\"] = np.log1p(np.clip(F, 0.0, levels[\"__cap__\"])).min(axis=1)\n  out = out.drop(columns=[c for c in DROP if c in out.columns])\n  if SQ_ORD:\n    out[\"sq_ord\"] = np.array([SQ_ORDER.get(v, np.nan) for v in _s(df[\"surface-quality\"])], dtype=float)\n  return out\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=10, n_repeats=3, random_state=0)\n  return list(rskf.split(np.zeros(len(y_train)), np.asarray(y_train).ravel()))\n\n\ndef preprocess(X_train, y_train, X_test):\n  if \"row_id\" in X_train.columns:   # (row_id, label) pairs rebuild the label map for the offline replay\n    _dump(\"lab\", pd.DataFrame({\"row_id\": X_train[\"row_id\"].to_numpy(),\n                               \"y\": np.asarray(y_train).ravel().astype(object)}))\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  lv = _levels(X_train)\n  return _build(X_train, lv), _build(X_test, lv)\n\n\ndef postprocess(pred, y_orig, X_test):\n  out = pd.DataFrame(pred).copy()\n  rec = out.copy()                  # dumped before POWER, so the offline replay can refit it from raw\n  rec.columns = [str(c) for c in rec.columns]\n  rec.insert(0, \"row_id\", np.asarray(X_test[\"row_id\"]) if \"row_id\" in X_test.columns else np.arange(len(rec)))\n  _dump(\"pred\", rec)\n  q = np.clip(out.to_numpy(float), 1e-300, None) ** POWER\n  return pd.DataFrame(q / q.sum(axis=1, keepdims=True), index=out.index, columns=out.columns)\n","readme":"# anneal — final pipeline\n\n## What it does\n\nThe task is 598 training rows × 38 mostly-categorical columns, 5 classes, scored by log loss. TabFM\ndoes all the predicting; everything that pays sits in how the table is handed to it. `engineer()`\nrebuilds the frame from scratch: every categorical level becomes its own one-hot column, the 14 flag\ncolumns become indicators, the 7 single-valued columns are dropped, and four more columns that carry\nonly 1–2 positive rows in the whole dataset go too. Five of the seven numerics use 0 to mean \"not\napplicable\" rather than as a magnitude, so those zeros become NaN (hardness is the exception and keeps\nits zeros); thick/width/len are rounded to the step that merges imperial-to-metric measurement jitter,\nso physically identical products collapse to one context entry. Three one-hot groups whose missing\nlevel is a class in its own right — surface-quality, condition, steel — get an explicit `=NA`\nindicator, because \"not applicable\" is otherwise the all-zeros pattern and costs the model an AND over\nthe whole group. One engineered column, `min_freq`, is added: for each row, the count of training rows\nsharing the rarest raw value it carries, clipped to a cap and log1p'd — entirely label-free, and the\nlargest single gain after the encoding, since the dataset's few label exceptions all carry a\nvalue seen once. All of this is fitted on the training fold only (levels, frequency tables, cap).\nTabFM then runs with plain default constructor knobs — every one was measured and none beat the\ndefault — and `postprocess()` applies a single global exponent of 0.87 to the output probabilities,\nwhich is cheap insurance at this dataset's ~0.35% rate of confidently-wrong label exceptions.\n\n`folds()` overrides the judge's 3-fold CV with repeated stratified 10-fold × 3 repeats, because at 598\nrows the 3-fold spread (0.029 around a mean of 0.028) could not resolve any change. Reported CV under\nthose folds: 0.01168 log loss at 99.67% accuracy, against 0.02151 for an identity pipeline on the same\nfolds.\n\n## What build.sh builds\n\nNothing. `pipeline.py` opens no file — all its input arrives as dataframe arguments, and every fitted\nquantity is derived inside `engineer()` from the training fold it is given. `final/build.sh` says so\nand exits 0. It takes no time and no disk.\n\nRun:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\nRequires the competition data under `data/` (the same layout the run used) and a working TabFM/GPU\nenvironment; `python final/run.py --check` verifies everything short of the TabFM pass.\n\n## Things a reader could get wrong\n\n- **`final/build/` is not build tooling.** Those four scripts are the offline analysis harness from the\n  search: `oof.py` and `cmp.py` reload the per-fold probability dumps and rescore/recalibrate them\n  without touching a GPU, `aux.py` refits auxiliary models on the identical folds for comparison,\n  `setcfg.py` rewrote `TABFM_KWARGS`/`TAG` between evaluations. They are kept as a record; running them\n  is not part of reproducing the submission.\n- **`postprocess()` writes to `dumps/final/`** (raw pre-exponent probabilities plus a row_id→label map,\n  one pickle per call). That is instrumentation for the offline replay above, not an output anyone\n  needs; it is written, never read back, and can be deleted. On the final fit it is a handful of small\n  files.\n- **The exponent is applied after the dump, not before.** The pickles hold TabFM's raw output, which is\n  why `cmp.py` can refit POWER offline. Do not double-apply it when reading them.\n- **`POWER` and `softmax_temperature` are the same knob**, not two: with `average_logits=True` TabFM\n  returns `softmax(mean_logits / T)`. Only `POWER` is used here.\n- **The rarity cap scales with fold size** (`RARITY_CAP_FRAC = 15/538`), so a 538-row CV fold and the\n  598-row final fit sit at 15 and 16 rather than at different points of the feature's curve. Replacing\n  it with an absolute constant silently changes the configuration.\n- `pd.set_option(\"mode.string_storage\", \"python\")` at import is load-bearing: the judge process cannot\n  unpickle a pyarrow-backed string column."},{"id":"Another-Dataset-on-used-Fiat-500","name":"Another-Dataset-on-used-Fiat-500","short_name":"Another-Dataset-on-used-Fiat-500","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":703.639653,"plain_note":null,"n_train":1025,"n_test":513,"n_folds":30,"thresholds":null,"summary":"TabFM predicts the price directly from the seven raw columns: no engineered feature, no dropped column, and default ensemble knobs (`TABFM_KWARGS = {}`). Seventy-one evaluations looked for something better on that front and found nothing — every added column scored 723–753 against 720 for the untouched table, every dropped column 723–756, and every TabFM knob 721–725.","score":693.48622,"gain_pct":1.442988,"medal":null,"category":"I","lines":70,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","postprocess","folds"],"tabfm_kwargs":{},"helper_functions":["_design","_partner","_weights"],"helper_ranges":{"_design":[19,24],"_partner":[27,32],"_weights":[35,49]},"hook_helpers":{"preprocess":["_design","_partner","_weights"],"engineer":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[52,59],"engineer":[62,63],"postprocess":[66,70],"folds":[12,16]},"code":"import numpy as np\n\nTABFM_KWARGS = {}\n\nW_MAX = 0.55      # blend weight at full distance and full mileage\nD0 = 1.0          # distance scale, in units of the context's own median nearest-neighbour spacing\nKMF = 2.0         # mileage scale, in units of the fold's median km\nBSTASH = '.blend.npy'\nWSTASH = '.wblend.npy'\n\n\ndef folds(X_train, y_train):\n  \"\"\"3 repeats of 5-fold: every row is scored under three different partitions, which is what makes a\n  2-point difference readable on 1025 rows. At a single 5-fold the whole field sat inside 720-724.\"\"\"\n  from sklearn.model_selection import RepeatedKFold\n  return list(RepeatedKFold(n_splits=5, n_repeats=3, random_state=0).split(X_train))\n\n\ndef _design(X, cols=None):\n  \"\"\"Numeric view of the table for the helper models; the id column is not a feature.\"\"\"\n  import pandas as pd\n  A = pd.get_dummies(X.drop(columns=[c for c in ['row_id'] if c in X.columns]),\n                     columns=['model']).astype(float)\n  return A if cols is None else A.reindex(columns=cols, fill_value=0.0)\n\n\ndef _partner(A, y, B):\n  \"\"\"The second opinion, fitted on the fold's training rows only.\"\"\"\n  from sklearn.ensemble import GradientBoostingRegressor\n  g = GradientBoostingRegressor(random_state=0, n_estimators=600, learning_rate=0.05,\n                                max_depth=2, min_samples_leaf=5)\n  return g.fit(A, y).predict(B)\n\n\ndef _weights(A, B):\n  \"\"\"How much of the query row to hand to the partner. Near a context row TabFM's in-context fit is\n  close to the local noise floor and averaging only adds error; in empty space both models are\n  guessing and averaging pays. Both scales are read off the training rows, so nothing is hard-coded\n  to this fold's size.\"\"\"\n  from sklearn.neighbors import NearestNeighbors\n  from sklearn.preprocessing import QuantileTransformer\n  qt = QuantileTransformer(n_quantiles=min(300, len(A)), output_distribution='normal').fit(A)\n  Zt = qt.transform(A)\n  nn = NearestNeighbors(n_neighbors=2).fit(Zt)\n  dref = max(float(np.median(nn.kneighbors(Zt)[0][:, 1])), 1e-9)\n  d = nn.kneighbors(qt.transform(B))[0][:, 0]\n  kmed = max(float(np.median(A['km'].to_numpy())), 1.0)\n  return (W_MAX * np.clip(d / (D0 * dref), 0.0, 1.0)\n          * np.clip(B['km'].to_numpy() / (KMF * kmed), 0.0, 1.0))\n\n\ndef preprocess(X_train, y_train, X_test):\n  \"\"\"TabFM and the partner both work on sqrt(price); postprocess squares the blend back.\"\"\"\n  import pandas as pd\n  A, B = _design(X_train), _design(X_test, _design(X_train).columns)\n  z = np.sqrt(np.asarray(y_train, dtype=float))\n  np.save(BSTASH, _partner(A.to_numpy(), z, B.to_numpy()))\n  np.save(WSTASH, _weights(A, B))\n  return X_train, pd.Series(z, index=y_train.index, name=y_train.name), X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  return X_train, X_test\n\n\ndef postprocess(pred, y_orig, X_test):\n  import pandas as pd\n  w = np.load(WSTASH)\n  z = (1 - w) * np.asarray(pred, dtype=float) + w * np.load(BSTASH)\n  return pd.Series(np.square(z), index=X_test.index)\n","readme":"# Another-Dataset-on-used-Fiat-500 — used Fiat 500 price, RMSE (lower is better)\n\n## What the pipeline does\n\nTabFM predicts the price directly from the seven raw columns: no engineered feature, no dropped\ncolumn, and default ensemble knobs (`TABFM_KWARGS = {}`). Seventy-one evaluations looked for\nsomething better on that front and found nothing — every added column scored 723–753 against 720\nfor the untouched table, every dropped column 723–756, and every TabFM knob 721–725.\n\nThe one change that does help is a *density-gated blend*. TabFM's out-of-fold error is not uniform:\nabout 446 on rows that sit right next to a training row and about 841 on rows in sparse regions of\nfeature space. A plain gradient-boosted tree is much worse overall (756 vs 722) but is *not* worse\nthan TabFM out in that empty space. So the two predictions are averaged with a weight that is zero\non dense rows and opens up on sparse ones:\n\n    w = 0.55 * min(d / d_ref, 1) * min(km / (2 * median km), 1)\n    prediction = (1 - w) * TabFM + w * GBDT\n\n`d` is the query row's distance to its nearest training row and `d_ref` the median nearest-neighbour\nspacing of the training rows themselves, both measured on a quantile-normalised numeric view of the\nfold's own training split — so the rule rescales itself when the final fits on 1025 rows instead of\nthe 820 a CV fold sees, rather than carrying a hard-coded distance. The mileage factor is the second\nhalf of the gate: after conditioning on density, low-km cars still preferred `w = 0` and high-km cars\n`w ≈ 0.55`. Both models work on `sqrt(price)`; `postprocess` squares the blend back. Validation is 3\nrepeats of 5-fold (15 folds) — at a single 5-fold the whole candidate field sat inside 720–724 and\nnothing was readable.\n\nTabFM carries the prediction on every row and essentially all of it on the dense ones\n(`tabfm_corr = 0.998`).\n\nScored result: **693.49 RMSE**, mean over the 30 TabArena folds, against published TabFM baselines\nof 703.64 (plain) and 703.70 (ensemble). Search CV was 702.69.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`.\n\nThe pipeline reads no precomputed file. `.blend.npy` and `.wblend.npy` are the only filenames it\nmentions, and it writes both itself in `preprocess()` on every fold to hand the GBDT prediction and\nthe blend weights across to `postprocess()` — per-fold scratch, not a cache. Everything else comes\nfrom the competition data the judge loads and passes into the hooks. Runtime and disk for the build\nstep are therefore zero.\n\n`python final/run.py` (one TabFM pass, 8 estimators, on this task's ~1k train / ~500 test rows)\ntakes well under a minute on a GPU node; the recorded final run was 83 s of wall time across all 30\nfolds.\n\n## Things a reader could get wrong\n\n- **`final/build/` is not part of the build.** `sw.py`, `fe.py` and `kw.py` are search helpers that\n  rewrite a module-level constant plus the `INTENT` comment in `pipeline.py` and then shell out to\n  `judge.py check` + `judge.py val`; `explore.py` is a local sklearn-only proxy CV used to try ideas\n  without spending judge budget. They are kept for the record. None of them produces an artefact,\n  and running one would *edit* `pipeline.py`, not build anything.\n- **The blend weights are recomputed per fold, on purpose.** `_weights()` fits its\n  `QuantileTransformer` and `NearestNeighbors` on the training rows it is handed. Precomputing them\n  once from the full training set would leak across folds and would also use the wrong `d_ref`.\n- **`W_MAX`, `D0` and `KMF` are on a flat basin.** `W_MAX` 0.5/0.55/0.6/0.7/0.8 scored\n  703.87/703.79/703.84/704.35/705.42, and the mileage scale 1.5/2.0/2.5 gave 703.97/703.84/704.48.\n  The exact constants are not delicate; the shape of the gate is what matters. They were also chosen\n  in a nested offline check (fit on four folds, scored on the fifth) before being measured here.\n- **`folds()` is 15 folds, not the judge's default 3.** That is deliberate and it is what the\n  reported search numbers (`folds_sig ac149037`) were measured on; a 3-fold rerun will not reproduce\n  702.69.\n- **The `row_id` column is dropped for the helper models only** (`_design`). TabFM still sees the\n  table exactly as given — dropping any column from TabFM's view made things worse."},{"id":"APSFailure","name":"APSFailure","short_name":"APSFailure","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.007387,"plain_note":null,"n_train":50666,"n_test":25334,"n_folds":9,"thresholds":null,"summary":"The task is the Air Pressure System failure set: ~170 anonymised, non-negative, heavy-tailed sensor counters with a lot of missing values and ~1.8% positives, scored as `1 - AUC` (lower is better). TabFM makes the prediction; the pipeline only decides what table it sees.","score":0.005416,"gain_pct":26.682009,"medal":null,"category":"I","lines":52,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer"],"tabfm_kwargs":{"n_svd_features":"'sqrt'"},"helper_functions":["_build"],"helper_ranges":{"_build":[14,44]},"hook_helpers":{"preprocess":[],"engineer":["_build"],"postprocess":[]},"hook_ranges":{"preprocess":[10,11],"engineer":[47,48],"postprocess":[51,52]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {\"n_svd_features\": \"sqrt\"}\n\nHIST_GROUPS = [\"ag\", \"ay\", \"az\", \"ba\", \"cn\", \"cs\", \"ee\"]\n\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _build(X):\n  out = X.copy()\n  bins_all = []\n  tots = {}\n  for g in HIST_GROUPS:\n    cols = [f\"{g}_{i:03d}\" for i in range(10)]\n    cols = [c for c in cols if c in X.columns]\n    if len(cols) \u003c 2:\n      continue\n    B = X[cols].to_numpy(dtype=float)\n    tot = np.nansum(B, axis=1)\n    allna = np.isnan(B).all(axis=1)\n    tot = np.where(allna, np.nan, tot)\n    denom = np.where(tot \u003e 0, tot, np.nan)\n    F = B / denom[:, None]\n    idx = np.arange(len(cols), dtype=float)\n    com = np.nansum(F * idx[None, :], axis=1)\n    com = np.where(np.isnan(denom), np.nan, com)\n    tots[f\"{g}_tot\"] = np.log1p(tot)\n    out[f\"{g}_com\"] = com\n    for j, c in enumerate(cols):\n      out[f\"{g}_f{j}\"] = F[:, j]\n    bins_all += cols\n\n  out = out.drop(columns=bins_all)\n  raw = [c for c in X.columns if c not in bins_all and c != \"row_id\"]\n  out[raw] = np.log1p(out[raw].to_numpy(dtype=float))\n  for k, v in tots.items():\n    out[k] = v\n  out[\"n_na\"] = X.isna().sum(axis=1).to_numpy()\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  return _build(X_train), _build(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# APSFailure — scored pipeline\n\n## What it does\n\nThe task is the Air Pressure System failure set: ~170 anonymised, non-negative, heavy-tailed sensor\ncounters with a lot of missing values and ~1.8% positives, scored as `1 - AUC` (lower is better).\nTabFM makes the prediction; the pipeline only decides what table it sees.\n\nSeven of the column families (`ag_*`, `ay_*`, `az_*`, `ba_*`, `cn_*`, `cs_*`, `ee_*`) are ten-bin\nhistograms of one underlying quantity rather than ten independent counters, so the pipeline\nreparametrises each of them into the shape TabFM can actually compare row to row: a total\n(`{g}_tot`, log1p'd), the ten bins renormalised to fractions of that total (`{g}_f0..f9`), and the\ncentre of mass of those fractions (`{g}_com`). Rows whose bins are entirely missing keep NaN rather\nthan a fabricated zero, and the raw bin columns are dropped — keeping both views was tried and lost\nto dilution. Every remaining raw counter is log1p'd, which is the single largest win in the log, and\nthe number of missing values per row is added as one feature. No rows are dropped or resampled:\nevery attempt to subsample the negatives or bag draws scored worse on every fold, so TabFM sees the\nfull training set as its in-context support. The only ensemble knob touched is\n`n_svd_features=\"sqrt\"`, which hands half the ensemble members a compact SVD summary of these\nstrongly collinear columns. `preprocess` and `postprocess` are identity.\n\n3-fold CV with 8 estimators put this at about 0.0057–0.0064 `1-AUC`, against 0.0071 for feeding the\nraw table through unchanged.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0 and says so. The pipeline reads no file from disk\n— it is four pure functions of the frames the judge passes in — and no cache or intermediate\nartefact was produced anywhere in this run, so `final/build/` is empty. It takes no time and no\ndisk. Running it is still harmless if you want to follow the documented two-step.\n\n## Things a reader could get wrong\n\n- `HIST_GROUPS` is a hand-picked list of prefixes, and `_build` expects the members to be named\n  `{prefix}_000 … {prefix}_009`. A group with fewer than two of those columns present is skipped and\n  its columns then stay in the raw log1p'd block, so the code is safe against renamed inputs but\n  silently loses the reparametrisation. If you point this at a differently-named copy of the data,\n  check that the histogram columns are still matching.\n- `row_id` is excluded from the log1p block but is *not* dropped; the judge strips identifier columns\n  itself, so removing it here is not the pipeline's job.\n- The bin fractions are divided by the total only where that total is strictly positive; an all-zero\n  histogram yields NaN fractions on purpose, so that \"no observations\" and \"observations spread\n  evenly\" are not represented the same way.\n- Missing values are deliberately left as NaN throughout — no imputation. TabFM handles them, and\n  `n_na` makes the missingness pattern itself available as a signal.\n- `python final/run.py` copies `final/pipeline.py` over the workspace `pipeline.py` (they are already\n  identical) and calls the same `judge.load_task` / `judge.run_pipeline` used during the run, at\n  `judge.N_EST_FINAL` estimators rather than the 8 used for CV. Expect the run to take much longer\n  than a `val` fold, and expect a GPU to be needed for the TabFM pass."},{"id":"bank-marketing","name":"bank-marketing","short_name":"bank-marketing","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.230918,"plain_note":null,"n_train":30140,"n_test":15071,"n_folds":9,"thresholds":null,"summary":"The predictor is a frozen TabFM doing in-context learning over the whole training fold; the search that produced this pipeline was almost entirely a search over *how the table is presented to it* and over its ensemble knobs, not over added modelling machinery.","score":0.231443,"gain_pct":-0.227353,"medal":null,"category":"II","lines":40,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile', 'robust']","average_logits":"False","enable_nnls":"True","nnls_beta":"1.0","n_svd_features":"'sqrt'","softmax_temperature":"1.4","permute_categorical":"True"},"helper_functions":["_feat"],"helper_ranges":{"_feat":[22,32]},"hook_helpers":{"preprocess":[],"engineer":["_feat"],"postprocess":[]},"hook_ranges":{"preprocess":[15,16],"engineer":[35,36],"postprocess":[39,40]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {\n    \"norm_methods\": [\"none\", \"power\", \"quantile\", \"robust\"],\n    \"average_logits\": False,\n    \"enable_nnls\": True,\n    \"nnls_beta\": 1.0,\n    \"n_svd_features\": \"sqrt\",\n    \"softmax_temperature\": 1.4,\n    \"permute_categorical\": True,\n}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\nMERGE = {\"hld\": [\"housing\", \"loan\", \"default\"]}\n\n\ndef _feat(X):\n  X = X.copy()\n  for new, cols in MERGE.items():\n    if all(c in X.columns for c in cols):\n      vals = [X[c].fillna(\"\").astype(str).to_numpy(dtype=object) for c in cols]\n      # object dtype on purpose: the judge server that unpickles the hook output has no pyarrow, so a\n      # freshly created pandas-3 `str` column (arrow-backed inside the hook sandbox) cannot be\n      # reconstructed there -- RESULT 31/32 both died on exactly that.\n      X[new] = pd.Series([\"|\".join(t) for t in zip(*vals)], index=X.index, dtype=object).astype(object)\n      X = X.drop(columns=cols)\n  return X\n\n\ndef engineer(X_train, y_train, X_test):\n  return _feat(X_train), _feat(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# bank-marketing — final pipeline\n\n## What it does\n\nThe predictor is a frozen TabFM doing in-context learning over the whole training fold; the search\nthat produced this pipeline was almost entirely a search over *how the table is presented to it* and\nover its ensemble knobs, not over added modelling machinery. Two things survived.\n\n**Feature side — compression, not addition.** The dataset is 13 raw columns (no `duration`), and\nTabFM turned out to be sensitive to column *count* here: eight OOF target-encoded columns cost\n+0.0034 in metric, four log-scaled count columns +0.0005, while dropping `default` outright was\nexactly free. So the only engineering step is a merge: the three yes/no binaries `housing`, `loan`\nand `default` are concatenated into one 8-level categorical `hld`, carrying the same information in\none column instead of three (13 → 11 columns). Nothing is scaled, imputed, encoded or sampled —\n`preprocess` and `postprocess` are identity, and there is no `sample` hook, so every ensemble member\nattends over the entire training fold.\n\n**Ensemble side — TABFM_KWARGS.** Four normalisation views (`none`, `power`, `quantile`, `robust`;\ndropping `none` costs 0.0011), probability averaging rather than logit averaging, NNLS stacking of\nthe members (`nnls_beta=1.0`, worth ~0.0006), `n_svd_features=\"sqrt\"` (~0.0002),\n`permute_categorical=True` (the single largest win, ~0.0007, better on all three folds), and\n`softmax_temperature=1.4` — a deliberate softening of TabFM's output distribution that sits on a\nflat plateau between 1.4 and 2.2 and is worth ~0.0004.\n\nThings that were tried and rejected, so a reader does not re-run them: feature crosses, per-member\nrow bagging and fractional bagging, class-balanced or positive-duplicated contexts, reduced\n`max_num_rows`, frequency-mode categorical encoding, pdays sentinel / signed-log balance / log-count\ntransforms, OOF target encoding, and a HistGB blend on the dumped OOF probabilities (it reached only\n0.2455 alone, and the best blend bought +0.0002 for ~900s per fold).\n\n3-fold CV on the training set, metric `1-auc` (lower is better): **0.23607**, down from 0.23920 for\nthe identity pipeline.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`. The pipeline reads no files it does not receive\nas function arguments — no caches, no fitted artifacts, no precomputed features — so there is no\nbuild step to reproduce. It takes no time and no disk. `final/build/` is therefore absent: none of\nthe throwaway scripts written during the search is a prerequisite of the scored pipeline.\n\n## Things a reader could get wrong\n\n- **The `object` dtype in `_feat` is load-bearing, not stylistic.** The engineered `hld` column is\n  built with `pd.Series(..., dtype=object).astype(object)` because the hook sandbox has pyarrow and\n  the judge server that unpickles the hook output does not: a freshly created pandas-3 `str` column\n  is arrow-backed inside the sandbox and cannot be reconstructed on the other side. Two evaluations\n  (RESULT 31 and 32) died on exactly that. Do not \"clean this up\" to a plain string dtype.\n- **`MERGE` is applied defensively.** `_feat` only merges when all three source columns are present,\n  so the hook is a no-op on a frame that has already been transformed. That is guard code, not a\n  sign that the columns are ever legitimately missing in this task.\n- **Row order and the fold definition matter for reproducing the CV number, not the submission.**\n  The pipeline defines no `folds()`; the 0.23607 above is against the judge's default 3-fold split\n  (`folds_sig=d4d7ad64`). `python final/run.py` does not recompute it — it runs the final 8-estimator\n  TabFM pass over the full training set and writes `final/submission.csv`.\n- **`run.py` copies `final/pipeline.py` over the workspace `pipeline.py`** (the judge's `apply_hooks`\n  loads it by that name) and refuses to run if the two differ, rather than silently overwriting the\n  scored record."},{"id":"Bank_Customer_Churn","name":"Bank_Customer_Churn","short_name":"Bank_Customer_Churn","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.122917,"plain_note":null,"n_train":6666,"n_test":3334,"n_folds":9,"thresholds":null,"summary":"TabFM does all the predicting; the pipeline's whole contribution is deciding what table it gets to attend over. The table is made *shorter and less numeric*, not richer.","score":0.122773,"gain_pct":0.117152,"medal":null,"category":"II","lines":57,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"class_shift":"False","norm_methods":"['none']"},"helper_functions":["_build","_object"],"helper_ranges":{"_build":[26,33],"_object":[36,44]},"hook_helpers":{"preprocess":[],"engineer":["_build","_object"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[22,23],"engineer":[47,53],"postprocess":[56,57],"folds":[12,19]},"code":"import numpy as np\nimport pandas as pd\n\n# class_shift and the normaliser list are the only two constructor knobs that beat the defaults;\n# everything else in TABFM_KWARGS was measured and left alone.\nTABFM_KWARGS = {'class_shift': False, 'norm_methods': ['none']}\n\nDROP = ('estimated_salary', 'credit_card', 'tenure')\nAS_LEVELS = ('products_number', 'active_member')\n\n\ndef folds(X_train, y_train):\n  \"\"\"5x repeated stratified 3-fold. The judge's default 3-fold spread is std=0.009 on a 0.126\n  score, which cannot rank changes worth 0.0005; the repeats average the split noise out while\n  keeping the 2:1 train/validation ratio of the TabArena folds the final is scored on.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = np.asarray(y_train).ravel()\n  cv = RepeatedStratifiedKFold(n_splits=3, n_repeats=5, random_state=0)\n  return list(cv.split(np.zeros(len(y)), y))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _build(df):\n  \"\"\"Every column here is a function of that row alone, so train and test need no shared state.\"\"\"\n  d = df.drop(columns=[c for c in DROP if c in df.columns])\n  for c in AS_LEVELS:\n    d[c] = _object([('v%d' % v) for v in df[c].astype(int)], d.index)\n  d['bal_zero'] = (df['balance'] == 0).astype(int)\n  d['balance'] = df['balance'].where(df['balance'] \u003e 0, np.nan)\n  return d\n\n\ndef _object(values, index):\n  \"\"\"Force plain-numpy object dtype.\n\n  The hooks run in a pandas 3.0 that has pyarrow, so a string column assigned normally becomes an\n  ArrowStringArray; the judge unpickles the result in a pandas 3.0 that does not have pyarrow and\n  refuses to load one. `judge.py check` runs in-process and never crosses that boundary, so it\n  reports ok either way -- this cost three evaluations to find.\n  \"\"\"\n  return pd.Series(np.asarray(values, dtype=object), index=index, dtype=object)\n\n\ndef engineer(X_train, y_train, X_test):\n  a, b = _build(X_train), _build(X_test)\n  for d in (a, b):\n    for c in d.columns:\n      if not pd.api.types.is_numeric_dtype(d[c]):\n        d[c] = _object(d[c], d.index)\n  return a, b\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Bank_Customer_Churn — final pipeline\n\nMetric is `1 - ROC-AUC` (lower is better) over 6666 training rows and 10 raw columns.\n\n## What it does\n\nTabFM does all the predicting; the pipeline's whole contribution is deciding what table it gets to\nattend over. The table is made *shorter and less numeric*, not richer. Three columns are dropped\n(`estimated_salary`, which is uniform noise by construction; `credit_card`, 0.214 vs 0.200 churn;\n`tenure`, flat at 0.177–0.226 across all 11 values with no trend). `products_number` and\n`active_member` are recoded as string levels, because churn against `products_number` goes\n28% / 7% / 83% / 100% and presenting that as an ordinal number asks the model to un-learn the\nordering. `balance` is a spike-at-zero mixture — 43% of rows are exactly 0.0, the rest roughly\nnormal around 120k — so it is split into a NaN-for-zero column (TabFM handles NaNs natively) plus an\nexplicit `bal_zero` flag; both halves earn their place, dropping either is worse. On the ensemble\nside only two constructor knobs beat the defaults: `class_shift=False` (it adjusts members for the\n20/80 class prior before averaging, so unlike the monotone knobs it can move a rank metric) and\n`norm_methods=['none']` instead of `['none','power']`, the power-transformed half of the members\nbeing the weaker one. `folds()` is 5×repeated stratified 3-fold: the judge's default single 3-fold\nhas std 0.009 on a 0.126 score and cannot rank changes worth 0.0005, while the repeats keep the 2:1\ntrain/validation ratio the final is scored at. No other model appears anywhere — GBDT stacking and\nrank-blending were tried and lost at every weight. Identity scored 0.12761 on these folds; this\nscores 0.12576, better on 15/15 folds.\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no files — its hooks are pure functions of the DataFrames the judge\npasses in, and there is no `sample()` hook. `final/build.sh` is a documented no-op that exits 0 in\nwell under a second and needs no disk. Run:\n\n```\nbash final/build.sh \u0026\u0026 python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **`final/build/` is not called by `build.sh`, on purpose.** `xp.py` is an experiment driver that\n  *rewrites module-level constants inside `pipeline.py`*; running it now would mutate the scored\n  pipeline. `guard.py` re-ran the hooks and pickled the output to `$TMPDIR/guard.pkl` purely so the\n  judge's venv could attempt to unpickle it; that file is scratch and the pipeline never reads it.\n  Both are kept as the record of how the search was run.\n- **The `_object()` helper is load-bearing, not style.** The hooks execute in a pandas 3.0 that has\n  pyarrow, where an ordinaril
