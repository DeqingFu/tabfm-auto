\n                      (580, 630, 'Genito'), (630, 680, 'Pregnancy'), (680, 710, 'Skin'),\n                      (710, 740, 'Musculo'), (740, 760, 'Congenital'), (760, 780, 'Perinatal'),\n                      (780, 800, 'Symptoms'), (800, 1000, 'Injury')]:\n    g[ok \u0026 (vv \u003e= lo) \u0026 (vv \u003c hi)] = lab\n  g[ok \u0026 (vv \u003e= 250) \u0026 (vv \u003c 251)] = 'Diabetes'\n  g[ok \u0026 (vv == 785)] = 'Circ'\n  g[ok \u0026 (vv == 786)] = 'Resp'\n  g[ok \u0026 (vv == 787)] = 'Digest'\n  g[ok \u0026 (vv == 788)] = 'Genito'\n  a = s.to_numpy()\n  g[np.char.startswith(a.astype(str), 'V')] = 'V'\n  g[np.char.startswith(a.astype(str), 'E')] = 'E'\n  g[a == ''] = 'NA'\n  return pd.Series(g, index=s.index, dtype=object)\n\n\ndef _disch_group(s):\n  \"\"\"24 discharge dispositions (readmission rate 0.00-0.45) -\u003e 7 clinical buckets.\"\"\"\n  t = s.fillna('NA').astype(str)\n  low = t.str.lower()\n  g = np.full(len(t), 'other', dtype=object)\n  g[low.str.contains('short term hospital').to_numpy()] = 'shortterm'\n  g[low.str.contains('snf|icf|nursing facility|long term care').to_numpy()] = 'nursing'\n  g[low.str.contains('rehab|psychiatric|inpatient care institution|swing bed').to_numpy()] = 'rehab'\n  g[low.str.contains('home health|home iv').to_numpy()] = 'homehealth'\n  g[(t == 'Discharged to home').to_numpy()] = 'home'\n  g[low.str.contains('expired|hospice').to_numpy()] = 'terminal'\n  g[(t == 'NA').to_numpy()] = 'NA'\n  return pd.Series(g, index=s.index, dtype=object)\n\n\ndef _lump(col_tr, col_te, min_count):\n  \"\"\"Levels rarer than min_count in the fold's training rows -\u003e 'rare'.\"\"\"\n  a = col_tr.fillna('NA').astype(str)\n  b = col_te.fillna('NA').astype(str)\n  keep = set(a.value_counts()[lambda v: v \u003e= min_count].index)\n  return (a.where(a.isin(keep), 'rare').to_numpy(),\n          b.where(b.isin(keep), 'rare').to_numpy())\n\n\ndef _lump_to_group(col_tr, col_te, g_tr, g_te, min_count):\n  \"\"\"Rare ICD code -\u003e its 3-digit trunk; a rare trunk -\u003e its chapter.\"\"\"\n  a = col_tr.fillna('NA').astype(str)\n  b = col_te.fillna('NA').astype(str)\n  ta = a.str.split('.').str[0]\n  tb = b.str.split('.').str[0]\n  keep = set(a.value_counts()[lambda v: v \u003e= min_count].index)\n  keep_t = set(ta.value_counts()[lambda v: v \u003e= min_count].index)\n  out = []\n  for k, t, g in ((a, ta, g_tr), (b, tb, g_te)):\n    v = ('g:' + g.astype(str)).to_numpy()\n    v = np.where(t.isin(keep_t).to_numpy(), 't:' + t.to_numpy(), v)\n    out.append(np.where(k.isin(keep).to_numpy(), k.to_numpy(), v))\n  return out[0], out[1]\n\n\ndef _feat(df):\n  df = df.copy()\n  df = df.drop(columns=[c for c in DEAD if c in df.columns])\n  df['age_ord'] = df['age'].map(AGE_MID).astype(float)\n  df['weight_mid'] = df['weight'].map(WT_MID).astype(float)\n  df = df.drop(columns=['age', 'weight'])\n\n  for c in DIAG:\n    df[c + '_g'] = _icd_group(df[c])\n    df[c + '_n'] = _icd_num(df[c])\n  gs = np.stack([df[c + '_g'].to_numpy() for c in DIAG], 1)\n  df['n_diab_diag'] = (gs == 'Diabetes').sum(1)\n  df['n_circ_diag'] = (gs == 'Circ').sum(1)\n\n  df['disch_g'] = _disch_group(df['discharge_disposition_id'])\n  df['service_util'] = df['number_outpatient'] + df['number_emergency'] + df['number_inpatient']\n  live = [c for c in DRUGS if c in df.columns]\n  M = np.stack([df[c].map(DOSE).fillna(0).to_numpy() for c in live], 1)\n  df['n_meds_taken'] = (M != 0).sum(1)\n  df['n_meds_up'] = (M == 2).sum(1)\n  df['n_meds_down'] = (M == -1).sum(1)\n  df['n_meds_changed'] = df['n_meds_up'] + df['n_meds_down']\n\n  t = df['time_in_hospital'].astype(float)\n  df['med_per_day'] = df['num_medications'] / t\n  df['lab_per_day'] = df['num_lab_procedures'] / t\n  df['proc_per_day'] = df['num_procedures'] / t\n  return df.drop(columns=[c for c in WEAK if c in df.columns])\n\n\ndef folds(X_train, y_train):\n  \"\"\"5 folds, not the judge's 3: bigger training folds (38.1k, against 47.7k at the final)\n  and less split noise, to re-rank candidates that were inside the noise at 3 folds.\"\"\"\n  from sklearn.model_selection import StratifiedKFold\n  kf = StratifiedKFold(5, shuffle=True, random_state=0)\n  return list(kf.split(X_train, np.asarray(y_train).astype(str)))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  a, b = _feat(X_train), _feat(X_test)\n  for c, m in LUMP.items():                      # frequencies from the fold's training rows only\n    a[c], b[c] = _lump(a[c], b[c], m)\n  for c in DIAG:\n    a[c], b[c] = _lump_to_group(a[c], b[c], a[c + '_g'], b[c + '_g'], MIN_DIAG)\n  cols = [c for c in a.columns if c in set(b.columns)]\n  a, b = a[cols].copy(), b[cols].copy()\n  for d in (a, b):                               # plain object strings: the judge process\n    for c in cols:                               # cannot unpickle an arrow-backed StringArray\n      if not pd.api.types.is_numeric_dtype(d[c]):\n        miss = d[c].isna().to_numpy()\n        v = np.array(d[c].astype(str), dtype=object, copy=True)\n        v[miss] = np.nan\n        d[c] = v\n  return a, b\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Diabetes130US — 30-day readmission (metric: 1 − ROC-AUC, lower is better)\n\n## What the pipeline does\n\nTabFM makes the prediction on its own, in one frozen in-context pass over the whole training\nsplit — there is no `sample()` hook, `postprocess` is the identity, and no other model is blended\nin (`tabfm_corr` = 1.000). All the work is in how the table is presented to it, plus two ensemble\nknobs.\n\nThe feature step is domain rewriting of the hospital-encounter table, applied identically to the\ncontext rows and the query rows: the four constant / near-constant diabetes-drug columns are\ndropped; `age` and `weight` buckets become numeric midpoints (and the raw bucket strings are\ndropped — keeping both was measurably worse); each of `diag_1/2/3` gains an ICD-9 chapter label\n(with 250.x split out as its own \"Diabetes\" chapter, V- and E-codes as their own levels) and a\nnumeric code, while the raw code string is kept at full cardinality (~670 levels); the 24\ndischarge dispositions collapse into 7 clinical buckets alongside the raw column; and a handful of\ncounts are derived — prior-visit utilisation, diabetes/circulatory diagnosis counts, medications\ntaken / raised / lowered / changed, and per-day intensity ratios for medications, labs and\nprocedures. `medical_specialty` and `admission_source_id` are mapped through a frequency lump\nwhose threshold is 1, i.e. every level seen in the fold's training rows survives and only levels\nunseen there fall to `'rare'`; that map is built inside `engineer` from the training rows of the\ncurrent fold only, so no label and no test information leaks. Missing values are left as NaN for\nthe plain categoricals and carry an explicit `'NA'` level only where \"not recorded\" is itself\ninformative. TabFM is then run with `norm_methods=['none','quantile_rtdl']` (the eight ensemble\nmembers split across two normalisations) and `outlier_threshold=20.0` instead of the default 4.0.\n\n`folds()` overrides the judge's 3-fold CV with a 5-fold stratified split. That was the pivotal\nchoice of the run: at 3 folds each context is 31.8k rows, well short of the 47.7k the final model\nactually fits on, and several conclusions reached there — pruning weak columns, keeping the\n`power` normalisation, lumping rare ICD codes — all reversed once measured at 5 folds. The\nlast 3-fold configuration scored 0.33024; the shipped one scores 0.32708 at 5 folds.\n\n## What `build.sh` builds\n\nNothing. It is a comment and `exit 0`. The pipeline reads no cached artifact — every table it\nuses is derived inside the hooks from the DataFrames the judge passes in, and every lookup\n(drug list, bucket midpoints, ICD chapter ranges, discharge buckets) is a literal in\n`final/pipeline.py`. Zero runtime, zero disk.\n\nTo reproduce:\n\n```\ncd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n```\n\n`final/run.py` writes `final/submission.csv`. Runtime is dominated by the single TabFM pass over\n~48k context rows on a GPU; there is no training loop.\n\n## Things a reader could get wrong\n\n- **The docstring in `pipeline.py` is a run log, not a spec.** It narrates 71 evaluations in\n  chronological order, and several of its earlier conclusions are explicitly overturned later in\n  the same docstring (evals 60–71). Only the code below it, and the final section of the\n  docstring, describe what actually ships.\n- **`WEAK = []` and `MIN_DIAG = 1` / `LUMP = {...: 1}` are deliberate no-ops**, not leftovers.\n  They are the knobs whose non-trivial values won at 3 folds and lost at 5; the empty list and the\n  threshold of 1 are the *result* of that re-measurement. `DEAD` (four drug columns) is the only\n  column prune that survived.\n- **`folds()` changes the validation protocol, not the model.** The final fit uses the whole\n  training set; `folds()` only affects `judge.py val`. Scores in `log.txt` before eval 60 are on a\n  3-fold split and are not comparable to the ones after.\n- **`pd.set_option('mode.string_storage', 'python')` at import, and the object-dtype coercion at\n  the end of `engineer`, are required, not stylistic.** The judge runs the pipeline in a separate\n  process and cannot unpickle arrow-backed string arrays; removing either makes the run fail\n  rather than merely differ.\n- **Rows are exchangeable here** — no time or group structure was found in the encounter table, so\n  a plain stratified split mirrors how the test split was made."},{"id":"diamonds","name":"diamonds","short_name":"diamonds","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":499.65244,"plain_note":null,"n_train":35960,"n_test":17980,"n_folds":9,"thresholds":null,"summary":"The target is `price` and the metric is RMSE in dollars, so the pipeline splits the problem into a smooth global part, which an in-context model over ~24k rows is worst at, and a local part, which is what it is best at. A ridge regression in log-price fits the smooth part: a cubic spline in log(carat) with knots at the carat weights the trade pays a premium to cross (0.3, 0.5, 0.7, 1.0, 1.5, 2.0 plus fill-ins), the…","score":484.524027,"gain_pct":3.027787,"medal":null,"category":"II","lines":156,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["preprocess","engineer","postprocess"],"tabfm_kwargs":{"max_num_rows":"65536","n_svd_features":"'sqrt'"},"helper_functions":["_feat","_design","_grade_codes","_solve","_base","_oof_base"],"helper_ranges":{"_feat":[28,58],"_design":[61,82],"_grade_codes":[85,101],"_solve":[104,110],"_base":[113,114],"_oof_base":[117,126]},"hook_helpers":{"preprocess":["_feat","_design","_grade_codes","_solve","_base","_oof_base"],"engineer":["_feat"],"postprocess":[]},"hook_ranges":{"preprocess":[129,142],"engineer":[145,148],"postprocess":[151,156]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'max_num_rows': 65536, 'n_svd_features': 'sqrt'}   # above the row count: every row stays in context\n\nCUT = {'Fair': 0, 'Good': 1, 'Very Good': 2, 'Premium': 3, 'Ideal': 4}\nCOLOR = {'J': 0, 'I': 1, 'H': 2, 'G': 3, 'F': 4, 'E': 5, 'D': 6}\nCLARITY = {'I1': 0, 'SI2': 1, 'SI1': 2, 'VS2': 3, 'VS1': 4, 'VVS2': 5, 'VVS1': 6, 'IF': 7}\n\n# preprocess and postprocess run in separate subprocesses over a shared workspace,\n# so the fold's test-row baseline travels through a scratch file, not a global.\n_STASH = '.base_test.npy'\nSHRINK = 1.043    # weight on TabFM's correction; solved for, flat over 1.00-1.10\n_GUARD = 0.45     # five conditional sigmas: the correction cannot exceed this share of base\n\n# knots where the trade itself puts them: the \"magic\" carat weights buyers pay a\n# premium to cross (0.3, 0.5, 0.7, 1.0, 1.5, 2.0) plus fill-in knots between them.\n_KNOTS = np.log(np.array([0.3, 0.4, 0.5, 0.7, 0.9, 1.0, 1.2, 1.5, 2.0, 2.5, 3.0]))\n_RIDGE, _KFOLD = 1e-5, 5\n_BOUNDS = (250.0, 25000.0)   # the trend's output range; set per fold from the prices seen\n\n\n_GRADES = (('cut', 5), ('color', 7), ('clarity', 8))\n_RANK_CODES = False   # True = uniform spacing, only rescaled; False = spaced by fitted value\n_CODES = {}        # per-fold grade codes, shared from preprocess to engineer\n\n\ndef _feat(d, codes=None):\n  \"\"\"Domain features. `codes` respaces the grade columns; the ridge always gets the\n  plain 0..k-1 ranks, because it builds its dummies by comparing against them.\"\"\"\n  o = pd.DataFrame(index=d.index)\n  ct = d['carat'].astype(float)\n  o['carat'] = ct\n  o['cut'] = d['cut'].map(CUT).astype(float)\n  o['color'] = d['color'].map(COLOR).astype(float)\n  o['clarity'] = d['clarity'].map(CLARITY).astype(float)\n  if codes:\n    for name, _ in _GRADES:\n      o[name] = codes[name][o[name].to_numpy().astype(int)]\n  o['depth'] = d['depth'].astype(float)\n  o['table'] = d['table'].astype(float)\n  x = d['x'].replace(0.0, np.nan).astype(float)      # a zero dimension is missing, not small\n  y = d['y'].replace(0.0, np.nan).astype(float)\n  z = d['z'].replace(0.0, np.nan).astype(float)\n  o['x'], o['y'], o['z'] = x, y, z\n\n  o['vol'] = x * y * z\n  o['log_carat'] = np.log(ct)\n  o['density'] = ct / (x * y * z)\n  o['size'] = np.cbrt(ct)\n  o['diam'] = 0.5 * (x + y)\n  o['yx'] = y / x\n  o['zx'] = z / x\n  o['depth_calc'] = 200.0 * z / (x + y)\n  o['table_mm'] = o['table'] * 0.005 * (x + y)\n  o['depth_dev'] = np.abs(o['depth'] - 61.9)\n  o['table_dev'] = np.abs(o['table'] - 56.5)\n  return o\n\n\ndef _design(f):\n  \"\"\"The trend in log-price: a carat spline, the three grades, and their pairs.\n  Cells are enumerated, never support-filtered, so train and test always produce\n  the same 259 columns.\"\"\"\n  lc = f['log_carat'].to_numpy()\n  cut, color, clarity = (f[c].to_numpy() for c in ('cut', 'color', 'clarity'))\n  cols = [np.ones_like(lc), lc, lc ** 2, lc ** 3]\n  cols += [np.maximum(lc - k, 0.0) for k in _KNOTS]\n\n  for g, k in ((cut, 5), (color, 7), (clarity, 8)):\n    for j in range(1, k):                              # drop first level, keep intercept\n      d = (g == j).astype(float)\n      cols += [d, d * lc, d * lc ** 2]\n  for A, ka, B, kb in ((color, 7, clarity, 8), (cut, 5, clarity, 8), (cut, 5, color, 7)):\n    for a in range(1, ka):\n      for b in range(1, kb):\n        d = ((A == a) \u0026 (B == b)).astype(float)\n        cols += [d, d * lc]\n\n  dp, tb = f['depth'].to_numpy() - 61.75, f['table'].to_numpy() - 57.46\n  cols += [dp, dp ** 2, tb, tb ** 2, dp * tb]\n  return np.nan_to_num(np.column_stack(cols), nan=0.0, posinf=0.0, neginf=0.0)\n\n\ndef _grade_codes(f, t):\n  \"\"\"Recode each grade level by its additive effect on log-price, order preserved.\"\"\"\n  lc = f['log_carat'].to_numpy()\n  cols, spans = [np.ones_like(lc), lc, lc ** 2, lc ** 3], {}\n  for name, k in _GRADES:\n    spans[name] = (len(cols), k)\n    cols += [(f[name].to_numpy() == j).astype(float) for j in range(1, k)]\n  A = np.nan_to_num(np.column_stack(cols), nan=0.0)\n  reg = 1e-8 * A.shape[0] * np.eye(A.shape[1])\n  reg[0, 0] = 0.0\n  w = np.linalg.solve(A.T @ A + reg, A.T @ t)\n  out = {}\n  for name, k in _GRADES:\n    i, _ = spans[name]\n    e = np.arange(float(k)) if _RANK_CODES else np.concatenate([[0.0], w[i:i + k - 1]])\n    out[name] = (e - e.mean()) / (e.std() + 1e-9)      # centred, unit scale, monotone\n  return out\n\n\ndef _solve(A, t):\n  reg = _RIDGE * A.shape[0] * np.eye(A.shape[1])\n  reg[0, 0] = 0.0\n  w = np.linalg.solve(A.T @ A + reg, A.T @ t)\n  e = np.exp(A @ w)\n  scale = float(e @ np.exp(t) / (e @ e))   # least squares in dollars, not Duan's mean-of-ratios\n  return w, scale\n\n\ndef _base(A, w, scale):\n  return np.clip(scale * np.exp(A @ w), *_BOUNDS)\n\n\ndef _oof_base(A, t):\n  \"\"\"The training rows' own baseline, each fifth of them fit without themselves.\"\"\"\n  out = np.empty(len(t))\n  edge = np.linspace(0, len(t), _KFOLD + 1).astype(int)\n  order = np.random.default_rng(0).permutation(len(t))\n  for i in range(_KFOLD):\n    va = order[edge[i]:edge[i + 1]]\n    tr = np.setdiff1d(order, va, assume_unique=True)\n    out[va] = _base(A[va], *_solve(A[tr], t[tr]))\n  return out\n\n\ndef preprocess(X_train, y_train, X_test):\n  global _BOUNDS\n  f_tr, f_te = _feat(X_train), _feat(X_test)\n  t = np.log(np.asarray(y_train, dtype=float))\n  _BOUNDS = (float(np.min(y_train)), float(np.max(y_train)))\n  _CODES.update(_grade_codes(f_tr, t))\n  A_tr = _design(f_tr)\n  base_tr = _oof_base(A_tr, t)\n  base_te = _base(_design(f_te), *_solve(A_tr, t))\n  np.save(_STASH, base_te)\n  X_train, X_test = X_train.copy(), X_test.copy()\n  X_train['base'], X_test['base'] = base_tr, base_te\n\n  return X_train, y_train.astype(float) - base_tr, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  a, b = _feat(X_train, _CODES), _feat(X_test, _CODES)\n  a['base'], b['base'] = X_train['base'].to_numpy(), X_test['base'].to_numpy()\n  return a, b\n\n\ndef postprocess(pred, y_orig, X_test):\n  base = np.load(_STASH)\n  out = SHRINK * np.asarray(pred, dtype=float) + base\n  out = np.clip(out, base * (1.0 - _GUARD), base * (1.0 + _GUARD))\n  # price is truncated in this data, so anything outside the observed range is wrong\n  return np.clip(out, float(np.min(y_orig)), float(np.max(y_orig)))\n","readme":"# diamonds — TabFM on a dollar residual off a ridge trend\n\n## What the pipeline does\n\nThe target is `price` and the metric is RMSE in dollars, so the pipeline splits the problem\ninto a smooth global part, which an in-context model over ~24k rows is worst at, and a local\npart, which is what it is best at. A ridge regression in log-price fits the smooth part: a\ncubic spline in log(carat) with knots at the carat weights the trade pays a premium to cross\n(0.3, 0.5, 0.7, 1.0, 1.5, 2.0 plus fill-ins), the three quality grades with their own\nlog-carat slopes and curvature, all three pairwise grade interactions, and quadratic\ndepth/table terms — 259 columns, penalty 1e-5, exponentiated back with a dollar\nleast-squares scale rather than a smearing estimate. That fitted value is `base`. For the\ntraining rows it is computed out-of-fold over 5 folds, so TabFM is not handed residuals\nsmaller than the ones it must predict; for the test rows it comes from a single fit on the\nwhole training split. `base` is clipped to the observed price range of the fold, because\nprice is truncated in this data and a trend that extrapolates past it (it reaches 24481 on\nthe real test split) is wrong with certainty.\n\nTabFM then predicts `price - base` in dollars, from the nine raw attributes plus geometry\n(volume, density, mean diameter, the y/x and z/x shape ratios, the recomputed depth, table\nin mm, deviations from the modal depth and table), the three grades recoded by their fitted\nadditive log-price effect rather than by rank — so D-to-E and I-to-J are not equal steps —\nand `base` itself as a feature, which is what tells TabFM how large a correction this stone\nowes. `max_num_rows` is set above the row count so every training row stays in context, and\n`n_svd_features='sqrt'` is the one TabFM knob that paid. Postprocess adds `1.043 *\nprediction` back to `base` (the shrinkage is a solved argmin, not a searched value: MSE is\nexactly quadratic in it), clips the result to `base ± 45%` as a per-row runaway guard, and\nclips again to the training price range.\n\nMeasured: 484.52 RMSE, the mean over the 9 TabArena folds, against published baselines of\n499.65 (plain TabFM) and 495.15 (TabFM-Ensemble). Search CV best was 489.21.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`. The pipeline reads no file it does not\nwrite itself — the only file it touches, `.base_test.npy`, is a within-fold scratch handoff\nfrom `preprocess` to `postprocess`, which run in separate subprocesses. It takes no time and\nno disk. No helper scripts were written during the run, which is why `final/build/` does not\nexist.\n\n## What a reader could get wrong\n\n- **The data is a judge prerequisite, not a pipeline one.** This is a TabArena task:\n  `judge.py` reads `${TABARENA_DIR:-$HOME/.cache/tabarena}/diamonds/fold_\u003ck\u003e/{train,test}.csv`\n  (30 folds cached, 9 used). `data/train.csv` and `data/test.csv` in this workspace are\n  fold 0, materialised by the judge. Those folds were downloaded by the repo's tabarena\n  downloader before this run started, from outside this workspace, so the exact invocation\n  is not in this run's record and `build.sh` deliberately does not guess at it. If the cache\n  is present, `python final/run.py` works as documented.\n- **`run.py` reproduces one fold, not the reported score.** It loads fold 0 and writes a\n  single `final/submission.csv`. The 484.52 in `result.json` is the mean over 9 folds, each\n  fitted independently — that is `judge.py`'s `tabarena_final` path, not the driver's. Also\n  note `run.py` ends by merging against `T.competition.sample_submission`, which a TabArena\n  task has no attribute for; expect it to fail at that last step even though the prediction\n  itself completed. `python final/run.py --check` stops before TabFM and is unaffected.\n- **`base` is a feature, and that is not a leak.** A column that estimates the target row by\n  row is poison for an in-context model — a leave-one-out four-C cell mean of the residual,\n  fully honest, cost 29 RMSE. `base` is safe for the opposite reason: 259 parameters over\n  24k rows is a smooth transform of the features, not an answer key.\n- **The out-of-fold first stage is load-bearing, and so is its being a *ridge*.** A boosted\n  tree scores 40 better as a standalone trend and 18 worse as this pipeline's first stage.\n  Sharpening the trend is the failure mode this task rewards least.\n- **Rows with impossible measurements are left alone on purpose.** ~30 training rows carry\n  values that are not measurements (a 2.00ct stone with y=58.9mm, a table of 95%). Imputing\n  them was a wash; marking them NaN cost 2.1. With TabFM's default outlier clipping the row\n  still matches on carat, the grades and `base`, whereas NaN-ing eight of twenty-one columns\n  leaves a row with no near neighbours at all."},{"id":"E-CommereShippingData","name":"E-CommereShippingData","short_name":"E-CommereShippingData","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.257592,"plain_note":null,"n_train":7332,"n_test":3667,"n_folds":9,"thresholds":null,"summary":"The pipeline throws away almost the entire table. Analysis of the 7332 training rows showed that only three of the ten raw columns carry signal, and that they carry it as a piecewise-constant structure rather than as a smooth function: a deterministic region (`Discount_offered \u003e 10`, or `2000 \u003c Weight_in_gms \u003c 4000`, or `Weight_in_gms \u003e 6000`) covers ~26% of rows and is essentially 100% positive; among the rest…","score":0.250845,"gain_pct":2.619258,"medal":null,"category":"II","lines":49,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","folds"],"tabfm_kwargs":{"norm_methods":"['none']","average_logits":"False"},"helper_functions":["_add"],"helper_ranges":{"_add":[17,31]},"hook_helpers":{"preprocess":[],"engineer":["_add"],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[13,14],"engineer":[37,38],"sample":[41,45],"postprocess":[48,49],"folds":[7,10]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'norm_methods': ['none'], 'average_logits': False}\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=3, random_state=0)\n  return list(rskf.split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _add(X):\n  X = X.copy()\n  w = X[\"Weight_in_gms\"].to_numpy(dtype=float)\n  c = X[\"Cost_of_the_Product\"].to_numpy(dtype=float)\n  d = X[\"Discount_offered\"].to_numpy(dtype=float)\n  det = (d \u003e 10) | ((w \u003e 2000) \u0026 (w \u003c 4000)) | (w \u003e 6000)\n  lite = w \u003c= 2000\n  pocket = lite \u0026 (c \u003c= 200)\n  near = (w \u003e= 4000) \u0026 (w \u003c= 4200)\n  seg = np.where(det, \"det\", np.where(pocket, \"pocket\",\n                 np.where(lite, \"lite\", np.where(near, \"near\", \"heavy\"))))\n  # plain object dtype: the judge host has no pyarrow, so a pyarrow-backed\n  # pandas string column cannot be unpickled on the other side of the hook.\n  X[\"seg\"] = pd.Series(seg, index=X.index, dtype=object)\n  return X[KEEP]\n\n\nKEEP = [\"Cost_of_the_Product\", \"seg\"]\n\n\ndef engineer(X_train, y_train, X_test):\n  return _add(X_train), _add(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  rng = np.random.default_rng(0)\n  k = int(round(0.9 * n))\n  return [np.sort(rng.choice(n, k, replace=False)) for _ in range(6)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# E-CommereShippingData — final pipeline\n\n## What it does\n\nThe pipeline throws away almost the entire table. Analysis of the 7332 training rows showed that\nonly three of the ten raw columns carry signal, and that they carry it as a piecewise-constant\nstructure rather than as a smooth function: a deterministic region (`Discount_offered \u003e 10`, or\n`2000 \u003c Weight_in_gms \u003c 4000`, or `Weight_in_gms \u003e 6000`) covers ~26% of rows and is essentially\n100% positive; among the rest, very light parcels (`Weight_in_gms \u003c= 2000`) that are also cheap\n(`Cost_of_the_Product \u003c= 200`) are ~85% positive, a narrow weight band just above 4000 g behaves\ndifferently from the bulk, and everything else sits near the base rate. So `engineer` collapses\nweight and discount into one five-level categorical `seg` column (`det` / `pocket` / `lite` /\n`near` / `heavy`) and keeps exactly one numeric column, `Cost_of_the_Product`, which still tilts\nthe heavy segment. Per-segment cross-validated logistic regressions over all ten raw columns came\nout at chance (0.49–0.50 AUC), which is why no further columns were added.\n\nTabFM is the only predictor: it does in-context learning over the two-column training table.\n`preprocess` and `postprocess` are identity. The remaining gains came from how TabFM estimates\nthat small model rather than from features — `norm_methods=['none']` and `average_logits=False`\nin `TABFM_KWARGS`, and `sample` returning six independent 90% subsamples of the training rows, so\nthe judge's 8-member ensemble is run six times over different contexts and averaged (48 members).\nValidation used repeated stratified 5-fold (3 repeats, 15 splits) so each fold's context is close\nin size to what the final fits on and paired comparisons are less partition-noisy. Metric is\n`1 - AUC`, lower is better; the search moved it from 0.2524 (raw columns, same folds) to 0.2450.\n\n## build.sh\n\nThere is nothing to build. `final/build.sh` prints one line and exits 0. The pipeline reads no\nfile from disk — every feature is computed from the dataframes the judge passes to the hooks — and\nno helper script or cache was produced during the run, so there is no `final/build/` directory.\nZero disk, instant.\n\n```\ncd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **`seg` must stay plain `object` dtype.** `_add` builds it with `dtype=object` on purpose. An\n  earlier version used a pandas string dtype, which is pyarrow-backed here; the judge host has no\n  pyarrow, so the column could not be unpickled across the hook boundary and the evaluation\n  errored out. Do not \"clean this up\" to `astype(\"string\")`.\n- **The segment boundaries are exact and were tuned.** `w \u003e 2000 \u0026 w \u003c 4000` (strict on both\n  sides), `w \u003c= 2000` for lite, `4000 \u003c= w \u003c= 4200` for near. Widening `near` from 4100 to 4200\n  alone was worth ~0.001 AUC. They are not round numbers by accident.\n- **The raw `Weight_in_gms` column is deliberately absent.** Adding it back on top of `seg` made\n  things clearly worse (0.2495 vs 0.2467); TabFM ends up smoothing across boundaries the code\n  already encodes. Conversely, masking `Cost_of_the_Product` to only the segments where a logistic\n  reference wanted it also hurt — TabFM wants that column raw and unconditioned.\n- **`sample` returning a list of index arrays means bagging, not subsetting.** Six draws is a\n  wall-clock cost of 6× one TabFM pass; dropping to 3 costs ~0.0005 AUC if runtime matters.\n- **The competition data is not regenerated by anything here.** It comes from the TabArena cache\n  (`~/.cache/tabarena`, dataset `E-CommereShippingData`, 9 folds per `final/config.yaml`) and the\n  judge loads it. `final/run.py` will fail if that cache is absent.\n- `final/run.py` refuses to run if the workspace `pipeline.py` differs from `final/pipeline.py`;\n  they are identical as shipped."},{"id":"Fitness_Club","name":"Fitness_Club","short_name":"Fitness_Club","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.178892,"plain_note":null,"n_train":1000,"n_test":500,"n_folds":30,"thresholds":null,"summary":"The task is to predict `attended` from six columns of 1000 gym-signup rows, scored as 1 − ROC-AUC. Almost all of the signal sits in `months_as_member`, which is monotone in the attendance rate over every decile; ranking rows by that raw column alone already beats the untouched TabFM pipeline.","score":0.178652,"gain_pct":0.134159,"medal":null,"category":"II","lines":55,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"norm_methods":"['quantile', 'power']","permute_categorical":"True"},"helper_functions":["_design","_oof_score"],"helper_ranges":{"_design":[32,38],"_oof_score":[41,51]},"hook_helpers":{"preprocess":[],"engineer":["_design","_oof_score"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[17,18],"engineer":[21,29],"postprocess":[54,55],"folds":[12,14]},"code":"import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import RepeatedStratifiedKFold\n\nTABFM_KWARGS = {'norm_methods': ['quantile', 'power'], 'permute_categorical': True}\n\nDROP = ('day_of_week', 'weight', 'days_before')   # columns TabFM does better without\nPRIOR_C = 0.05                                    # inverse shrinkage of the prior's logistic regression\nPRIOR_K = 5                                       # folds of the prior's out-of-fold column\n\n\ndef folds(X_train, y_train):\n  rskf = RepeatedStratifiedKFold(n_splits=3, n_repeats=5, random_state=0)\n  return list(rskf.split(np.zeros(len(y_train)), np.asarray(y_train)))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  keep = [c for c in X_train.columns if c not in DROP]\n  Xtr, Xte = X_train[keep].copy(), X_test[keep].copy()\n  y = np.asarray(y_train) == 'Yes'\n  if len(np.unique(y)) \u003e 1:      # `check` runs on a slice that can be single-class\n    d_tr = _design(Xtr)\n    d_te = _design(Xte).reindex(columns=d_tr.columns, fill_value=0.0)\n    Xtr['prior'], Xte['prior'] = _oof_score(d_tr.to_numpy(float), y, d_te.to_numpy(float))\n  return Xtr, Xte\n\n\ndef _design(X):\n  \"\"\"Numeric columns as they are, string columns as dummies.\"\"\"\n  num = X.select_dtypes(include=[np.number]).drop(columns=[c for c in ('row_id',) if c in X.columns])\n  obj = [c for c in X.columns if c not in num.columns and c != 'row_id']\n  num = num.astype(float)\n  return pd.concat([num.fillna(num.median())] +\n                   [pd.get_dummies(X[c].astype(str), prefix=c, dtype=float) for c in obj], axis=1)\n\n\ndef _oof_score(A, y, B):\n  \"\"\"Out-of-fold decision function on the training rows, full-fit one on the test rows.\"\"\"\n  from sklearn.linear_model import LogisticRegression\n  from sklearn.model_selection import StratifiedKFold\n  from sklearn.pipeline import make_pipeline\n  from sklearn.preprocessing import StandardScaler\n  mk = lambda: make_pipeline(StandardScaler(), LogisticRegression(C=PRIOR_C, max_iter=5000))\n  oof = np.zeros(len(A))\n  for tr, va in StratifiedKFold(PRIOR_K, shuffle=True, random_state=0).split(A, y):\n    oof[va] = mk().fit(A[tr], y[tr]).decision_function(A[va])\n  return oof, mk().fit(A, y).decision_function(B)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Fitness_Club — final pipeline\n\n## What it does\n\nThe task is to predict `attended` from six columns of 1000 gym-signup rows, scored as\n1 − ROC-AUC. Almost all of the signal sits in `months_as_member`, which is monotone in the\nattendance rate over every decile; ranking rows by that raw column alone already beats the\nuntouched TabFM pipeline. The method here is therefore about feeding TabFM a clean version of\nthat structure rather than about modelling capacity.\n\nThree columns — `day_of_week`, `weight`, `days_before` — are dropped, each of which hurt TabFM\non its own. One column is added: `prior`, the decision function of a heavily shrunk\nstandardised logistic regression (C = 0.05) on the surviving columns, computed out of fold\nacross 5 stratified folds for the training rows and from a full fit for the test rows. That\nsingle column is the largest gain of the run (0.17136 → 0.16844). Its out-of-fold noise is\npart of why it helps: smoothing it by averaging several out-of-fold splits is markedly worse.\nTabFM then predicts by in-context learning over those five columns, with `quantile` as its\nfirst normalisation (the target is a ranking and `months_as_member` is heavily skewed) and\n`permute_categorical` on for extra per-member diversity across the two remaining string\ncolumns. `postprocess` returns TabFM's probabilities unchanged.\n\nValidation uses 5 repeats of stratified 3-fold — 667 train / 333 validation, matching the 2:1\nratio the final split uses — which puts the paired resolution between two runs at about 0.0006.\nProgress over the run: 0.17374 (identity) → 0.16844.\n\n## What `build.sh` builds\n\nNothing. `final/pipeline.py` reads no files; the `prior` column is fitted inside `engineer()`\nfrom the frames the judge passes in. `build.sh` is a no-op that exits 0 — zero runtime, zero\ndisk. Run:\n\n```\nbash final/build.sh \u0026\u0026 python final/run.py\n```\n\n`python final/run.py` fits and scores in a couple of minutes on the competition data; the TabFM\npass is the only cost.\n\n## Things a reader could get wrong\n\n- **`final/build/runexp.py` is not a build step.** It is the search driver used during the run:\n  it rewrote the constants at the top of `pipeline.py` (`TABFM_KWARGS`, `DROP`, `PRIOR_C`,\n  `PRIOR_K`, and two constants that no longer exist in the final file) and shelled out to\n  `judge.py check` / `judge.py val` for each variant. Running it now would *overwrite*\n  `pipeline.py`. It is kept only as a record of how the numbers in the docstring were produced.\n- **The `prior` column is refitted, not restored.** It depends on which rows are in the\n  training frame, so it is different for every fold and for the final fit. That is deliberate —\n  a frozen precomputed version would leak across folds and, per the run's own experiments, a\n  less noisy version scores worse.\n- **`engineer` skips the prior when the label slice is single-class.** `judge.py check` runs the\n  hooks on a 200-row slice that may contain only one class; in that case the four base columns\n  are returned without `prior`. This is a guard for the dry run, not a code path the real fit\n  takes.\n- **The constants encode tuned optima, not defaults.** `PRIOR_C = 0.05` sits at the bottom of a\n  measured curve (0.015 → 0.1 gives .16909 / .16873 / .16844 / .16883 / .16904), and the drop\n  list is column-by-column measured. Changing them is not free."},{"id":"Food_Delivery_Time","name":"Food_Delivery_Time","short_name":"Food_Delivery_Time","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":7.329517,"plain_note":null,"n_train":30300,"n_test":15151,"n_folds":9,"thresholds":null,"summary":"The task is to predict `Time_taken(min)` (RMSE, lower better) for 15,151 deliveries from 30,300 training rows. The pipeline's premise, established from the training data alone, is that almost none of the 11 raw columns carry signal.","score":7.173553,"gain_pct":2.127889,"medal":null,"category":"I","lines":58,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer"],"tabfm_kwargs":{"permute_categorical":"True","enable_nnls":"True"},"helper_functions":["_feat"],"helper_ranges":{"_feat":[11,50]},"hook_helpers":{"preprocess":[],"engineer":["_feat"],"postprocess":[]},"hook_ranges":{"preprocess":[7,8],"engineer":[53,54],"postprocess":[57,58]},"code":"import numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'permute_categorical': True, 'enable_nnls': True}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _feat(df):\n  out = pd.DataFrame(index=df.index)\n  rlat = df['Restaurant_latitude'].astype(float).abs()\n  dlat = df['Delivery_location_latitude'].astype(float).abs()\n  rlon = df['Restaurant_longitude'].astype(float).abs()\n  dlon = df['Delivery_location_longitude'].astype(float).abs()\n  # the two deltas agree to 1e-6; average them and round the float noise off\n  delta = ((dlat - rlat) + (dlon - rlon)).abs() / 2.0\n  age = df['Delivery_person_Age'].astype(float)\n  rat = df['Delivery_person_Ratings'].astype(float)\n\n  out['age'] = age\n  out['rating'] = rat\n  out['delta'] = delta.round(2)\n  out['vehicle'] = df['Type_of_vehicle'].fillna('').astype(str).str.strip()\n  out['both'] = ((age == 29) \u0026 (rat == 4.6)).astype(np.int8)\n\n  # step codes: the drivers are plateaus with hard edges, and the numeric normalisation TabFM\n  # applies before attending smears an edge that a code states outright\n  out['age_ge30'] = (age \u003e= 30).astype(np.int8)\n  out['rat_bucket'] = np.select([rat \u003c 3.95, rat \u003c 4.45], [0, 1], default=2).astype(np.int8)\n  out['delta_bucket'] = np.select(\n      [out['delta'] \u003c 0.025, out['delta'] \u003c 0.035, out['delta'] \u003c 0.045, out['delta'] \u003c 0.065],\n      [0, 1, 2, 1], default=3).astype(np.int8)   # 0.04 (25.5 min) sits above 0.05/0.06 (23.9), 9 sigma\n  out['veh_slow'] = out['vehicle'].isin(['motorcycle', 'bicycle']).astype(np.int8)\n\n  # unordered views: neither is monotone (rating 5.0 -\u003e 25.5 min against 4.8 -\u003e 23.9, delta 0.04\n  # above 0.05), so let TabFM keep neighbouring levels apart. The same view of `age` is *not* here:\n  # age is flat inside each plateau, so its 22 levels were 22 ways to overfit (eval 88).\n  out['rating_s'] = rat.round(1).astype(str)\n  out['delta_s'] = out['delta'].astype(str)\n\n  # one coarse conjunction, 48 levels at ~630 rows each. Rows whose person record is imputed or\n  # sentinel get their own level rather than being filed as young-and-highly-rated.\n  unknown = (out['both'].to_numpy() == 1) | np.isin(age.to_numpy(), [15, 50])\n  age_st = np.where(unknown, 'u', out['age_ge30'].astype(str))\n  rat_st = np.where(unknown, 'u', out['rat_bucket'].astype(str))\n  out['cell'] = (out['delta_bucket'].astype(str) + out['veh_slow'].astype(str)\n                 + pd.Series(age_st, index=out.index) + pd.Series(rat_st, index=out.index))\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  return _feat(X_train), _feat(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Food_Delivery_Time — TabFM over four quantities, encoded as steps\n\n## What the pipeline does\n\nThe task is to predict `Time_taken(min)` (RMSE, lower better) for 15,151 deliveries from 30,300\ntraining rows. The pipeline's premise, established from the training data alone, is that almost none\nof the 11 raw columns carry signal. The target is `5*bucket + Uniform{0..4}` — `y % 5` is exactly\nuniform, so roughly 2.0 of the 87.7 total variance is irreducible label noise and the only\npredictable object is the bucket. The geography collapses too: `Delivery_location_lat/lon` equals\n`Restaurant_lat/lon` plus a delta that is identical in both axes to 1e-6 and takes only twelve\ndistinct values, always positive, so direction is never recoverable and the whole four-column\ncoordinate block reduces to that one quantised scalar — which beats both the haversine distance it\nimplies and the raw columns, partly because 8% of rows have (0,0) coordinates where the delta\nsurvives and a distance does not. Absolute position, the city prefix, `Type_of_order`, the 1320-level\ndelivery-person ID, out-of-fold target encodings of restaurant/city/person, and every unsupervised\ncount tried (rows per person, per restaurant, per coordinate; deliverers per restaurant; distance\nfrom the city centroid) all scored at or below the base. Row order carries nothing.\n\nThat leaves four quantities — courier age, courier rating, the delta, and vehicle type — and each\nacts as a **step, not a slope**: age \u003c30 averages ~23 min against ~29.4 for \u003e=30 and is flat inside\neach plateau; rating splits at 3.95 and 4.45; motorcycle/bicycle ~27.6 against\nscooter/electric_scooter ~24.4. So each is handed to TabFM in a mix of views — the raw numeric value,\nan unordered string (for rating and delta, whose levels are not monotone: rating 5.0 is slower than\n4.8, delta 0.04 slower than 0.05), and an explicit step code — because the normalisation TabFM\napplies to numeric columns before attending smears an edge that a code states outright. Age gets no\nstring view: it is flat within each plateau, so its 22 levels were 22 ways to overfit. On top sits one\ncoarse conjunction, `cell` (48 levels, ~630 rows each), of the four step codes. `cell` also carries\nthe data-quality repair: the ~1450 rows with `age==29 \u0026 rating==4.6` are a median-imputed courier\nrecord (their overlap is 3x what independence predicts, and they average the unconditional mean of\n25.7 rather than the 21.6 of the cell they would otherwise land in), and age 15 / age 50 are\nsentinels; all of these get their own `'u'` level instead of being read as young-and-highly-rated.\nA separate `both` flag marks the imputed pair for the model directly.\n\nThe prediction itself is a single frozen TabFM pass over these nine columns with\n`permute_categorical=True` and `enable_nnls=True`; no blending, no shrinkage, no auxiliary model.\nThose were all tried and rejected: an affine shrink probe puts the optimum at 1.0006, HistGBR and\nridge-on-interactions errors correlate at 0.988 with a best blend weight of 0, and the 102 exactly\nduplicated feature rows bound the within-duplicate variance at 60.2 (95% CI [47, 79]) against the\npipeline's MSE of 51.4 — there is no feature left to find. Local 3-fold CV RMSE 7.16854; test 7.17355,\n2.0% below the published TabFM-Ensemble baseline of 7.313547 on these folds and better than both\nbaselines.\n\n## What build.sh builds\n\nNothing — it prints one line and exits 0. `pipeline.py` opens no file and names no cache; every\ncolumn it uses is computed inside `_feat()` from the raw dataframes the judge passes in. There is\nno `final/build/` either: the run left no helper script behind, because all the analysis behind the\nconstants above was done in throwaway shell heredocs and its conclusions are the constants. Runtime\nis instant, disk is zero.\n\nThe full reproduction is still the documented two commands:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\n`run.py` needs the competition data under `data/` and a GPU for TabFM. The scored run took ~209 s end\nto end (about 76 s fit, 120 s predict across 9 TabArena folds).\n\n## Things a reader would otherwise get wrong\n\n- **`.aux_pred.npz` in the workspace root is dead.** It holds auxiliary HistGBR predictions from the\n  rejected blend at evals 12/13/50; the machinery was removed at eval 87 and `pipeline_093` never\n  reads it. `build.sh` deliberately does not regenerate it.\n- **`delta` is a rounded scalar, not a distance.** `_feat` averages the latitude and longitude deltas\n  (they agree to 1e-6) and rounds to 2 dp to kill float noise. The rounding is load-bearing: it is\n  what makes the twelve levels line up, and what makes `delta_s` a usable 12-level string.\n- **`delta_bucket` is not monotone by design.** Its `np.select` maps the 0.045–0.065 band back to\n  code `1`, because delta 0.04 (25.5 min) sits nine sigma above 0.05/0.06 (23.9). This looks like a\n  typo and is not.\n- **The step thresholds and the `'u'` markers are fitted to this training set**, not general domain\n  facts. On different data the plateau edges (3.95/4.45, age 30) and the imputation signature\n  (29 / 4.6, 15, 50) would have to be re-derived.\n- **The docstring LOG is the real experiment record**, including the rejected branches, and the\n  history of what produced it is in `history/pipeline_0NN.py` and `log.txt`. Deltas after eval 2 are\n  in the third decimal place; the fold-to-fold spread is much larger than most of them, so no single\n  late line should be read as significant on its own."},{"id":"GiveMeSomeCredit","name":"GiveMeSomeCredit","short_name":"GiveMeSomeCredit","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.131293,"plain_note":null,"n_train":100000,"n_test":50000,"n_folds":9,"thresholds":null,"summary":"A frozen TabFM predicts credit default by in-context learning over the raw training rows; the pipeline around it is deliberately thin. Two of the ten original columns are repaired before the model sees them.","score":0.130499,"gain_pct":0.604754,"medal":null,"category":"II","lines":44,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["preprocess","engineer"],"tabfm_kwargs":{"norm_methods":"['quantile', 'quantile_rtdl']","average_logits":"False"},"helper_functions":["_clean"],"helper_ranges":{"_clean":[22,32]},"hook_helpers":{"preprocess":[],"engineer":["_clean"],"postprocess":[]},"hook_ranges":{"preprocess":[11,19],"engineer":[35,40],"postprocess":[43,44]},"code":"import numpy as np\n\nCONTEXT_FRACTION = 0.8   # of the training rows, per member; see (3) in the docstring\n\nTABFM_KWARGS = {\n    'norm_methods': ['quantile', 'quantile_rtdl'],\n    'average_logits': False,\n}\n\n\ndef preprocess(X_train, y_train, X_test):\n  # Each member subsamples max_num_rows of the training rows, so this sets how much two\n  # members' contexts overlap and hence how much they disagree. Resolved here rather than\n  # written as a constant because the judge reads TABFM_KWARGS after the pre-hooks return,\n  # and a CV fold holds 66.7k rows against the final's 100k -- see (3) in the docstring for\n  # the two sweeps that say the right invariant is the count held out, not the fraction.\n  n = len(X_train)\n  TABFM_KWARGS['max_num_rows'] = n - int((1.0 - CONTEXT_FRACTION) * n)\n  return X_train, y_train, X_test\n\n\ndef _clean(x, mapping):\n  x = x.copy()\n  mi_na = x['MonthlyIncome'].isna()\n  # DebtRatio holds a ratio where MonthlyIncome is known and dollars where it is not; the\n  # dollar rows go onto the ratio branch's quantiles so the column is one ordering again.\n  src, dst = mapping\n  x.loc[mi_na, 'DebtRatio'] = np.interp(\n      x.loc[mi_na, 'DebtRatio'].to_numpy(float), src, dst)\n  # TabFM mean-fills numeric NaNs, so missingness has to become a column of its own.\n  x['income_missing'] = mi_na.astype(np.int8)\n  return x\n\n\ndef engineer(X_train, y_train, X_test):\n  mi_na = X_train['MonthlyIncome'].isna()\n  src = np.sort(X_train.loc[mi_na, 'DebtRatio'].to_numpy(float))\n  ratios = np.sort(X_train.loc[~mi_na, 'DebtRatio'].to_numpy(float))\n  dst = np.quantile(ratios, (np.arange(len(src)) + 0.5) / len(src))\n  return _clean(X_train, (src, dst)), _clean(X_test, (src, dst))\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# GiveMeSomeCredit — final pipeline\n\n## What it does\n\nA frozen TabFM predicts credit default by in-context learning over the raw training rows; the\npipeline around it is deliberately thin. Two of the ten original columns are repaired before the\nmodel sees them. `DebtRatio` is not one variable: for the ~80% of rows that report a\n`MonthlyIncome` it is a debt-to-income ratio, and for the rest it is a dollar amount (median 1149\nagainst 0.30), so the dollar rows are pushed through their own ECDF onto the ratio branch's\nquantiles and the column becomes a single ordering again. Separately, TabFM's numeric front end is\na plain mean-imputer, so a missing `MonthlyIncome` would otherwise vanish entirely; an explicit\n`income_missing` indicator restores it. No columns are added or dropped beyond that — every other\nengineered feature tried (delinquency totals, crosses, SVD components, log/ratio bundles) lost.\nOn the model side, the eight ensemble members cycle only the two rank-based normalisations\n(`quantile`, `quantile_rtdl`) instead of the default `none`/`power`, member outputs are averaged as\nprobabilities rather than logits, and `max_num_rows` is set to 80% of the training rows so the\nmembers bag distinct contexts rather than all sharing one. CV metric `1-auc` (lower better): the\nidentity pipeline scores 0.13403, this one 0.13305.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0. The pipeline reads no cache, index or\nprecomputed feature file — everything it needs is derived from the training DataFrame on each\ncall — and the run produced no helper scripts, so `final/build/` is absent by design. Zero extra\ndisk, zero build time.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\nThe single run is one TabFM pass with 8 estimators over 100k training rows; it needs a GPU and\ntakes on the order of minutes, not hours.\n\n## Things a reader could get wrong\n\n- **`max_num_rows` is computed, not fixed.** `preprocess` sets it from `len(X_train)`, because a CV\n  fold holds ~66.7k rows while the final fit sees 100k, and the tuned invariant is the *fraction*\n  (0.8), not a constant row count. Change `CONTEXT_FRACTION`, not the resolved number. This also\n  means the pipeline mutates the module-level `TABFM_KWARGS` dict at call time — the judge reads it\n  after the pre-hooks return, which is why that works.\n- **The ECDF mapping is fit on train and applied to both splits.** `engineer` derives `src`/`dst`\n  from the training rows only and reuses them for the test rows, so there is no leakage and test\n  rows outside the training range clamp at the endpoints (`np.interp` behaviour, intended).\n- **The 96/98 codes in the delinquency counters are left alone.** They look like not-available\n  sentinels and NaN-ing them is tempting, but that group defaults at ~51%, and sending it to the\n  column mean cost 0.00008. Same for `RevolvingUtilization \u003e= 13`.\n- **Resolution floor.** The judge is deterministic, so paired diffs are real, but any change to the\n  column count or normalisation order reshuffles which config each member draws; differences below\n  ~0.00005 are meaningless. Fold spread is ~0.0033.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` (refusing if the two differ)\n  because the judge loads the hooks by that path."},{"id":"hazelnut-spread-contaminant-detection","name":"hazelnut-spread-contaminant-detection","short_name":"hazelnut-spread-contaminant-detection","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.002297,"plain_note":null,"n_train":1600,"n_test":800,"n_folds":30,"thresholds":null,"summary":"The task is 1600 training rows × 30 numeric sensor readings (`s\u003ci\u003e\u003cj\u003e`, the off-diagonal of a 6×6 transmission matrix between six sensors), scored as 1−AUC, lower better. The pipeline hands that table to TabFM essentially untouched and spends its whole budget on TabFM's own ensembling.","score":0.002119,"gain_pct":7.749238,"medal":null,"category":"II","lines":61,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile', 'quantile_rtdl', 'robust']","n_feature_crosses":"'sqrt'","outlier_threshold":"3.0"},"helper_functions":["_plain"],"helper_ranges":{"_plain":[42,45]},"hook_helpers":{"preprocess":[],"engineer":["_plain"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[18,19],"engineer":[25,39],"postprocess":[48,49],"folds":[52,61]},"code":"import numpy as np\nimport pandas as pd\n\n# intent: colorder rand4\nTABFM_KWARGS = {\n    # Eight members over five normalisations -- none, power and quantile get two each,\n    # quantile_rtdl and robust one -- plus sqrt(30) random feature crosses on half of them.  The\n    # order sets that split: moving robust forward, so it takes two members and quantile one, costs\n    # +0.00014, and giving none or power a third member costs +0.00014 / +0.00009.\n    'norm_methods': ['none', 'power', 'quantile', 'quantile_rtdl', 'robust'],\n    'n_feature_crosses': 'sqrt',\n    # 3.0 and the 4.0 default are indistinguishable (0.001517 vs 0.001521 over 50 splits) while\n    # 2.0 and 8.0 are both clearly worse, so the z-clip wants to sit just about where it is.\n    'outlier_threshold': 3.0,\n}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\nCOLORDER = 'rand4' \n\n\ndef engineer(X_train, y_train, X_test):\n  # No new columns -- but the frames still have to survive the trip home: the judge unpickles a\n  # hook's output in an interpreter where importing pyarrow fails, and pandas 3 gives any index it\n  # builds fresh a pyarrow-backed string dtype that cannot be loaded there.  Normalising the column\n  # index to plain objects keeps that from biting a later edit that does build columns.\n  if COLORDER != 'none':\n    cols = [c for c in X_train.columns if c[0] == 's' and c[1:].isdigit()]\n    rest = [c for c in X_train.columns if c not in cols]\n    if COLORDER == 'rev':\n      order = cols[::-1]\n    else:\n      rng = np.random.default_rng(int(COLORDER[4:]))\n      order = [cols[i] for i in rng.permutation(len(cols))]\n    X_train, X_test = X_train[rest + order], X_test[rest + order]\n  return _plain(X_train), _plain(X_test)\n\n\ndef _plain(df):\n  out = df.copy()\n  out.columns = pd.Index(np.array([str(c) for c in df.columns], dtype=object), dtype=object)\n  return out\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n\n\ndef folds(X_train, y_train):\n  \"\"\"10-fold x 5 repeats.  The judge's default 3 folds spread by 4e-4 while the effects worth\n  chasing here are 1e-4, and even 10 x 2 left a paired standard error of ~1.2e-4; 50 splits bring\n  that to ~5e-5, and 1440 training rows per split also mirror the 1600 the final fits on.  The\n  2400 rows hold no exact duplicates and no replicate clusters, so they are exchangeable and\n  stratified k-fold is the right mirror of how the task's own folds are cut.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = np.asarray(y_train).ravel()\n  rskf = RepeatedStratifiedKFold(n_splits=10, n_repeats=5, random_state=1)\n  return [(tr, va) for tr, va in rskf.split(np.zeros(len(y)), y)]\n","readme":"# hazelnut-spread-contaminant-detection — final pipeline\n\n## What it does\n\nThe task is 1600 training rows × 30 numeric sensor readings (`s\u003ci\u003e\u003cj\u003e`, the off-diagonal of a 6×6\ntransmission matrix between six sensors), scored as 1−AUC, lower better. The pipeline hands that\ntable to TabFM essentially untouched and spends its whole budget on TabFM's own ensembling.\n\n`preprocess` and `postprocess` are the identity: the metric is rank-based, so TabFM's raw output is\nalready the thing being scored. `engineer` adds no columns — it only applies a fixed random\npermutation of the 30 sensor columns (`COLORDER = 'rand4'`, seeded, so train and test get the same\norder) and normalises the column index to plain Python objects so the frames survive being pickled\nback to the judge. The permutation matters only because TabFM's feature-cross generator is\norder-sensitive; it is a seed choice, not a transformation.\n\nThe tuning is all in `TABFM_KWARGS`: eight ensemble members spread over five normalisations\n(`none`, `power`, `quantile`, `quantile_rtdl`, `robust`) with `n_feature_crosses='sqrt'` and\n`outlier_threshold=3.0`. `none` and `power` carry the accuracy; the other three are there purely as\ndiversity. Widening the normalisation list from TabFM's default two and turning crosses on is the\nwhole measured gain (1−AUC 0.00160 → 0.00152 over 50 validation splits).\n\nTwo negative results are load-bearing and are documented at length in the pipeline docstring.\nEvery engineered representation that was tried lost — symmetric/antisymmetric pairs, row/column\nsums, Frobenius norm and singular values, row normalisation, PCA rotation, duplicated columns,\nmutual-information column selection — and so did every attempt to drop or synthesise rows. And\nclassical models plateau around 1−AUC 0.025 while TabFM sits at 0.0016, so there is nothing worth\nstacking on top of it.\n\n`folds()` overrides the judge's default 3-fold with 10-fold × 5 repeats (`RepeatedStratifiedKFold`,\n`random_state=1`). The effects being chased here are ~1e-4 while 3 folds spread by ~4e-4; 50 splits\nbring the paired standard error to ~5e-5, and 1440 training rows per split also mirror the 1600 the\nfinal model fits on. The 2400 rows contain no exact duplicates and no replicate clusters, so plain\nstratified k-fold is the right mirror of how the task's folds are cut.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a documented no-op that exits 0. The pipeline opens no files, loads no\ncaches and fits no auxiliary model, so there is no artifact standing between `data/train.csv` and\nthe TabFM pass. It runs in well under a second and needs no disk.\n\n```\ncd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n```\n\n## Things a reader might otherwise get wrong\n\n- **`final/build/` is not part of the build.** `sweep.py` (rewrite a module constant in\n  `pipeline.py`, then run `judge.py val`) and `cmp.py` (paired fold-by-fold comparison of past\n  `log.txt` results) were the search loop's driving and analysis tools. They produce no input to\n  `pipeline.py` and `build.sh` deliberately does not call them.\n- **`COLORDER` is not dead code.** It looks like a no-op reshuffle, and it is one as far as the raw\n  features go, but TabFM's feature-cross generator consults column order, so changing the seed\n  changes the prediction.\n- **`feat_shuffle_method` is inert here.** Whenever feature crosses are enabled, that branch of\n  TabFM's `EnsembleGenerator` builds its own permutations and never reads the flag — which is why\n  member diversity had to come from the normalisation list instead.\n- **The scored numbers in the docstring are 50-split validation means**, not test scores, and the\n  differences quoted (1e-4 scale) are only meaningful against the ~5e-5 paired standard error that\n  the 10×5 fold scheme buys. Re-running with the judge's default 3 folds will not resolve them.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` before running, and refuses\n  to do so if the two differ — they are identical as shipped."},{"id":"healthcare_insurance_expenses","name":"healthcare_insurance_expenses","short_name":"healthcare_insurance_expenses","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":4420.143476,"plain_note":null,"n_train":892,"n_test":446,"n_folds":30,"thresholds":null,"summary":"`charges` in this dataset is not a noisy function of the six covariates: it is a *closed form* in them, plus a one-sided contamination. A median (LAD) regression on `[age², age, children, bmi, male, region dummies, smoker, smoker·bmi, smoker·1(bmi\u003e30)]` reproduces the target to floating-point precision on ~91% of the training rows.","score":4344.104043,"gain_pct":1.720293,"medal":null,"category":"II","lines":154,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['none']"},"helper_functions":["_design","_fit_base"],"helper_ranges":{"_design":[22,32],"_fit_base":[35,50]},"hook_helpers":{"preprocess":["_design","_fit_base"],"engineer":[],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[53,78],"engineer":[99,118],"sample":[121,129],"postprocess":[143,154],"folds":[132,140]},"code":"import os\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'norm_methods': ['none']}\n\nMODE = 'clean'\nALPHA = 1.0        # weight on TabFM's own output vs the analytic base\nSPIKE_T = 500.0    # residual above which a training row counts as a spike, in currency units\nNDRAWS = 12         # independent contexts the judge averages; 1 = one draw of every row\nFRAC = 0.9         # rows kept per draw when NDRAWS \u003e 1\nDUP = 1            # copies of every context row: a denser context for the same information\nFEATS = 'base'      # columns reaching TabFM: 'base' | 'raw' | 'nobase' | 'all'\nOFF_SHRINK = 0.05       # 0 | 'auto' | float: pull E[spike] toward 0 by its estimation variance\nBASE_COL = 'base'\n# postprocess is handed the *original* X_test, not the engineered one, and each hook stage runs in a\n# fresh interpreter, so what preprocess fitted travels between the two stages through the workspace.\nCACHE = os.path.abspath('.base_cache.npz')  # the judge chdirs into the workspace\n\n\ndef _design(d):\n  \"\"\"The closed form's own columns.\"\"\"\n  age = d['age'].astype(float).to_numpy()\n  bmi = d['bmi'].astype(float).to_numpy()\n  s = (d['smoker'] == 'yes').astype(float).to_numpy()\n  cols = [age ** 2, age, d['children'].astype(float).to_numpy(), bmi,\n          (d['sex'] == 'male').astype(float).to_numpy()]\n  for r in ('northeast', 'northwest', 'southeast'):\n    cols.append((d['region'] == r).astype(float).to_numpy())\n  cols += [s, s * bmi, s * (bmi \u003e 30).astype(float)]\n  return np.column_stack(cols)\n\n\ndef _fit_base(X_train, y, X_test):\n  \"\"\"LAD hyperplane through the clean rows: the spikes are one-sided, so the median ignores them.\"\"\"\n  A, B = _design(X_train), _design(X_test)\n  mu, sd = A.mean(0), A.std(0) + 1e-9\n  A, B = np.c_[(A - mu) / sd, np.ones(len(A))], np.c_[(B - mu) / sd, np.ones(len(B))]\n  try:\n    from sklearn.linear_model import QuantileRegressor\n    q = QuantileRegressor(quantile=0.5, alpha=0.0, solver='highs').fit(A[:, :-1], y)\n    return q.predict(A[:, :-1]), q.predict(B[:, :-1])\n  except Exception:                            # keep the 30 final folds alive on any solver hiccup\n    c = np.linalg.lstsq(A, y, rcond=None)[0]   # trimmed least squares as a stand-in median fit\n    for _ in range(40):\n      r = y - A @ c\n      keep = r \u003c= np.quantile(r, 0.6)\n      c = np.linalg.lstsq(A[keep], y[keep], rcond=None)[0]\n    return A @ c, B @ c\n\n\ndef preprocess(X_train, y_train, X_test):\n  Xtr, Xte = X_train.copy(), X_test.copy()\n  y = np.asarray(y_train, dtype=float).ravel()\n  btr, bte = _fit_base(X_train, y, X_test)\n  resid = y - btr\n  off = float(resid.mean())                            # E[spike]: the only thing left to estimate\n  if OFF_SHRINK:                                       # that mean is over a 9%/91% mixture, so it is\n    se2 = float(resid.var(ddof=1)) / len(resid)        # noisy; shrink it by its own share of variance\n    s = off ** 2 / (off ** 2 + se2) if OFF_SHRINK == 'auto' else 1.0 - float(OFF_SHRINK)\n    off *= s\n\n  shift = 0.0 if MODE in ('clean', 'winsor') else off              # in 'clean' mode the context has no spikes,\n  Xtr[BASE_COL] = btr + shift                          # so the column must stay on the clean scale\n  Xte[BASE_COL] = bte + shift\n  np.savez(CACHE, base=bte + shift, off=off)\n\n  if MODE == 'resid':\n    y_train = pd.Series(resid - off, index=y_train.index, name=getattr(y_train, 'name', 'y'))\n  elif MODE == 'clean':\n    keep = resid \u003c= SPIKE_T\n    if keep.sum() \u003e= 50:                               # never hand TabFM an empty context\n      Xtr, y_train = Xtr[keep], y_train[keep]\n  elif MODE == 'winsor':                               # keep the spike rows' covariates, pull their\n    y_train = pd.Series(np.minimum(y, btr + SPIKE_T),  # target down onto the clean surface\n                        index=y_train.index, name=getattr(y_train, 'name', 'y'))\n  return Xtr, y_train, Xte\n\n\nRAW = ['age', 'sex', 'bmi', 'children', 'smoker', 'region']\n# Every column below is a term of the closed form: dropping them costs 60 RMSE ('rawonly'), which is\n# how much of the surface TabFM cannot reconstruct from the six raw columns on its own.\nSETS = {\n    'rawonly': RAW,\n    'base': ['base'],\n    'raw': RAW + ['base'],\n    'nobase': RAW + ['age2', 'sm_ob', 'sm_bmi'],\n    'all': RAW + ['age2', 'sm_ob', 'sm_bmi', 'base'],\n    'split': RAW + ['age2', 'smk', 'ob_smk', 'sm_bmi'],\n    'lin': ['age2', 'children', 'bmi', 'male', 'ne', 'nw', 'se', 'smk', 'sm_bmi', 'ob_smk'],\n    'linraw': RAW + ['age2', 'children', 'male', 'ne', 'nw', 'se', 'smk', 'sm_bmi', 'ob_smk'],\n    'base_eng': ['base', 'age2', 'sm_ob', 'sm_bmi'],\n    'base_eng2': ['base', 'age2', 'sm_ob', 'sm_bmi', 'smoker', 'children'],\n    'wide': RAW + ['age2', 'sm_ob', 'sm_bmi', 'smk', 'ob_smk', 'ob', 'male', 'age3'],\n}\n\n\ndef engineer(X_train, y_train, X_test):\n  Xtr, Xte = X_train.copy(), X_test.copy()\n  for d in (Xtr, Xte):\n    age = d['age'].astype(float)\n    bmi = d['bmi'].astype(float)\n    sm = (d['smoker'] == 'yes').astype(float)\n    ob = (bmi \u003e 30).astype(float)\n    d['age2'] = age ** 2\n    d['age3'] = age ** 3\n    d['sm_ob'] = sm + sm * ob\n    d['sm_bmi'] = sm * bmi\n    d['smk'] = sm\n    d['ob'] = ob\n    d['ob_smk'] = sm * ob\n    d['male'] = (d['sex'] == 'male').astype(float)\n    for r, c in (('northeast', 'ne'), ('northwest', 'nw'), ('southeast', 'se')):\n      d[c] = (d['region'] == r).astype(float)\n  keep = set(SETS.get(FEATS, SETS['all']))\n  cols = [c for c in Xtr.columns if c in keep or c.endswith('_id')]\n  return Xtr[cols], Xte[cols]\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  if DUP \u003e 1:\n    return [np.repeat(np.arange(n), DUP)]\n  if NDRAWS \u003c= 1 or FRAC \u003e= 1.0:\n    return [np.arange(n)]\n  k = max(50, int(round(n * FRAC)))\n  rng = np.random.default_rng(12345)\n  return [np.sort(rng.choice(n, k, replace=False)) for _ in range(NDRAWS)]\n\n\ndef folds(X_train, y_train):\n  \"\"\"Two shuffled 10-folds instead of the judge's single 3-fold.  Every candidate left is inside a\n  couple of RMSE units of the others, so the split has to be measured twice to rank them, and 803\n  context rows per fold sits closer to the 892 the final actually fits on.\"\"\"\n  from sklearn.model_selection import KFold\n  out = []\n  for seed in (0, 1):\n    out += list(KFold(10, shuffle=True, random_state=seed).split(X_train))\n  return out\n\n\ndef postprocess(pred, y_orig, X_test):\n  z = np.load(CACHE)\n  base, off = z['base'], float(z['off'])\n  assert len(base) == len(pred), 'base cache out of sync with the prediction'\n  p = np.asarray(pred, dtype=float).ravel()\n  if MODE == 'resid':\n    out = base + ALPHA * p\n  elif MODE in ('clean', 'winsor'):\n    out = ALPHA * p + (1.0 - ALPHA) * base + off\n  else:\n    out = ALPHA * p + (1.0 - ALPHA) * base\n  return pd.Series(out, index=pred.index, name=getattr(pred, 'name', None))\n","readme":"# healthcare_insurance_expenses — final pipeline\n\n## What it does\n\n`charges` in this dataset is not a noisy function of the six covariates: it is a *closed form* in\nthem, plus a one-sided contamination. A median (LAD) regression on\n`[age², age, children, bmi, male, region dummies, smoker, smoker·bmi, smoker·1(bmi\u003e30)]` reproduces\nthe target to floating-point precision on ~91% of the training rows. The remaining ~9% sit 2k–24k\ncurrency units *above* that surface, and nothing in the features predicts which rows those are\n(OOF AUC ≈ 0.47 for the spike indicator; the rate is flat across every slice). Under RMSE the\noptimal prediction is therefore `base(x) + E[spike]`, and the whole design is about handing TabFM a\ncontext in which saying that is easy.\n\nConcretely, `preprocess` fits the LAD hyperplane (`sklearn` `QuantileRegressor`, `quantile=0.5`,\n`alpha=0`, `highs` solver, on standardized design columns; a trimmed-least-squares loop is the\nfallback if the solver fails), computes `E[spike]` as the mean residual, and shrinks it 5% toward\nzero to account for the estimation variance of a mean taken over a 9%/91% mixture. In the chosen\n`MODE='clean'`, the spike rows (residual \u003e 500) are then **dropped from the context**, so TabFM sees\na noiseless map, and the fitted `base` value is passed in as the single feature column\n(`FEATS='base'`). `postprocess` adds the shrunken `E[spike]` back onto TabFM's output — that offset\nis the one piece of information the dropped rows carried. The base column and the offset travel\nfrom `preprocess` to `postprocess` through `.base_cache.npz`, because the two hook stages run in\nseparate interpreters.\n\nTabFM remains the predictor throughout: it maps `base → charges` over the clean context rows.\nAround it, `TABFM_KWARGS={'norm_methods': ['none']}` (the target is already on a natural scale), and\n`sample()` returns 12 independent 90% subsamples of the context, whose predictions the judge\naverages. `folds()` overrides the judge's single 3-fold with two shuffled 10-folds — the surviving\ncandidates were within a couple of RMSE units of each other, so the split had to be measured twice\nto rank them, and 803 context rows per fold is much closer to the 892 the final model actually fits\non.\n\nMetric is RMSE, lower is better; `data/meta.json` lists no medal thresholds for this task.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that explains why and exits 0. The pipeline has no\nprerequisites: its only file, `.base_cache.npz`, is written by `preprocess` on every run, and all\nfeatures are derived in-process from the raw `data/train.csv` / `data/test.csv` columns the judge\npasses to the hooks. Runtime ~0 s, disk ~0 B. There is no `final/build/` directory because no\nhelper script was written during the run — every experiment was an edit to `pipeline.py` followed by\n`python judge.py val`.\n\n## Things a reader could get wrong\n\n- **`.base_cache.npz` is not an input.** `final/run.py`'s static prerequisite scan sees the name as a\n  string constant, but it is written before it is read within the same run. Do not try to supply it,\n  and do not be surprised that it appears in the workspace after a run.\n- **The spike rows are dropped, not down-weighted.** `MODE='clean'` removes ~9% of the training rows\n  from TabFM's context entirely. Their contribution comes back only as the scalar `off` added in\n  `postprocess`. `MODE='direct'`, `'resid'` and `'winsor'` are the alternatives that were tried and\n  left in the file; changing `MODE` changes what `postprocess` must do, and the two are coupled.\n- **`ALPHA=1.0` means the analytic base does not appear directly in the output** — it reaches the\n  prediction only through the feature TabFM conditions on. Lowering `ALPHA` blends the raw LAD fit\n  back in.\n- **`OFF_SHRINK=0.05` is a fixed 5% shrink**, not the `'auto'` variance-based rule also implemented\n  on the same line; `'auto'` would compute `off²/(off²+se²)`.\n- `SETS` in `engineer` lists a dozen feature subsets explored during the run; only `FEATS='base'` is\n  live. The engineered columns are all terms of the closed form — dropping them and giving TabFM the\n  six raw columns alone (`'rawonly'`) costs about 60 RMSE."},{"id":"heloc","name":"heloc","short_name":"heloc","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.197733,"plain_note":null,"n_train":6972,"n_test":3487,"n_folds":9,"thresholds":null,"summary":"HELOC (FICO) credit-risk classification: 23 integer bureau columns, 6972 training rows, scored as 1 − AUC (lower is better). The prediction is made entirely by the frozen TabFM in-context model; the pipeline is a thin, deliberately minimal wrapper around it and the wrapper's whole content is three decisions. First, the feature view. TabFM is run with a single normalisation, `norm_methods=[\"quantile\"]`, instead of…","score":0.197291,"gain_pct":0.223534,"medal":null,"category":"II","lines":49,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","folds"],"tabfm_kwargs":{"norm_methods":"['quantile']","class_shift":"False"},"helper_functions":["_add"],"helper_ranges":{"_add":[24,35]},"hook_helpers":{"preprocess":[],"engineer":["_add"],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[20,21],"engineer":[38,39],"sample":[42,45],"postprocess":[48,49],"folds":[10,17]},"code":"import numpy as np\n\n# One view, the strongest one, on all eight members; the column permutation is the only\n# randomisation left and it is the only one that earns its keep.\nTABFM_KWARGS = {\"norm_methods\": [\"quantile\"], \"class_shift\": False}\n\nSORT_CONTEXT = \"ExternalRiskEstimate\"\n\n\ndef folds(X_train, y_train):\n  \"\"\"3x repeated stratified 5-fold. Three folds left a 0.0035 spread between folds, wide\n  enough to hide everything measured here; repeats average the partition away, and a\n  5-fold context (5578 rows) is also much closer to the 6972 the final fits on.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = y_train.iloc[:, 0] if hasattr(y_train, \"columns\") else y_train\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=3, random_state=0)\n  return list(rskf.split(np.zeros(len(y)), y))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _add(X):\n  \"\"\"The 23 raw columns untouched, plus one re-ordered copy of the one column FICO orders\n  backwards. Only the order of these four values matters -- the members rank every column\n  -- so: -8 (\"no inquiries at all\") above every real month count, -7 (\"an inquiry inside\n  the last 7 days\") just below zero, -9 (\"no bureau record\") at the bottom.\"\"\"\n  X = X.copy()\n  q = X[\"MSinceMostRecentInqexcl7days\"]\n  X[\"inq_mono\"] = (q.where(q \u003e= 0)\n                   .mask(q == -8, 40.0)\n                   .mask(q == -7, -1.0)\n                   .mask(q == -9, -2.0))\n  return X\n\n\ndef engineer(X_train, y_train, X_test):\n  return _add(X_train), _add(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"One draw of every training row: every variant that removed rows lost, roughly in\n  proportion to how many, and no amount of extra ensembling bought it back.\"\"\"\n  return [np.argsort(X_train[SORT_CONTEXT].to_numpy(), kind=\"stable\")]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# heloc — final pipeline\n\n## What it does\n\nHELOC (FICO) credit-risk classification: 23 integer bureau columns, 6972 training rows, scored as\n1 − AUC (lower is better). The prediction is made entirely by the frozen TabFM in-context model; the\npipeline is a thin, deliberately minimal wrapper around it and the wrapper's whole content is three\ndecisions.\n\nFirst, the feature view. TabFM is run with a single normalisation, `norm_methods=[\"quantile\"]`,\ninstead of the shipped `[\"none\", \"power\"]` mix. Quantile-normalising pushes each column's ranks\nthrough the normal quantile function, and measured on its own that view beats every other view and\nevery mix containing it — mixing only averages the weaker views back in. `class_shift=False` is the\none other knob that helped.\n\nSecond, the context. `sample()` returns one draw of *every* training row, ordered by\n`ExternalRiskEstimate`. Every variant that removed rows lost roughly in proportion to how many went\n(dropping the 396 \"no bureau record\" rows alone cost +0.0088, because 5.5% of query rows are that\nsame point and without it in context they have no evidence), and adding synthetic interpolated rows\nwas by far the worst result of the run (+0.015 at 50% synthetic). The ordering is nearly free —\nattention over the context is permutation-invariant — and is kept only because it costs nothing.\n\nThird, one derived column. `MSinceMostRecentInqexcl7days` codes \"no inquiries at all\" as −8 (a good\nrisk) and \"an inquiry in the last 7 days\" as −7 (a bad one), so under a rank view its best and worst\ncases both sort below every real month count. `engineer()` adds `inq_mono`, a re-ordered copy that\nplaces −8 above every month count, −7 just below zero and −9 at the bottom, *beside* the raw column\nrather than replacing it. FICO's three sentinels are otherwise left exactly as written — blanking\nthem costs +0.0044. `preprocess` and `postprocess` are identity, so TabFM's probability ranking is\nthe submitted ranking.\n\n`folds()` defines 3× repeated stratified 5-fold (15 fits) so that validation is stable enough to\nresolve the ~0.0002 effects the run was chasing; it does not affect the final test prediction.\n\nValidation score on those folds: 0.19463 (identity pipeline: 0.19591).\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` reads no files — no caches, no fitted artefacts, no precomputed\nfeatures. `build.sh` is a comment and `exit 0`; it takes no time and no disk. `final/build/` is\nempty because no standalone scripts were written during the run: every experiment was a direct edit\nof `pipeline.py` followed by `python judge.py val`.\n\n    bash final/build.sh \u0026\u0026 python final/run.py\n\n## Things a reader might otherwise get wrong\n\n- **The docstring numbers are paired deltas, not absolute scores.** Every `+0.000xx` in\n  `pipeline.py` is the cost of a variant against this configuration on the same 15 folds. Positive\n  means worse (the metric is 1 − AUC).\n- **The mixed default is not a diversity win here.** The natural instinct is to keep several\n  normalisation views for ensemble diversity; on this task that is strictly worse than the single\n  quantile view, because `none` is half the default mix and is the weakest view of the five.\n- **`inq_mono` is added, not substituted.** Overwriting the raw column with the recode costs\n  +0.00127 — TabFM wants both the sentinel's identity and the corrected ordering. Adding further\n  recodes of the same kind also loses; the plateau of useful derived columns tops out very early.\n- **Other models were measured and rejected.** HistGradientBoosting (0.20204), extra trees, random\n  forest and quantile+logistic all trail TabFM (0.19519 on the same folds); blending bu
