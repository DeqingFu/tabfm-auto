d carry an explicit `'NA'` level only where \"not recorded\" is itself\ninformative. TabFM is then run with `norm_methods=['none','quantile_rtdl']` (the eight ensemble\nmembers split across two normalisations) and `outlier_threshold=20.0` instead of the default 4.0.\n\n`folds()` overrides the judge's 3-fold CV with a 5-fold stratified split. That was the pivotal\nchoice of the run: at 3 folds each context is 31.8k rows, well short of the 47.7k the final model\nactually fits on, and several conclusions reached there — pruning weak columns, keeping the\n`power` normalisation, lumping rare ICD codes — all reversed once measured at 5 folds. The\nlast 3-fold configuration scored 0.33024; the shipped one scores 0.32708 at 5 folds.\n\n## What `build.sh` builds\n\nNothing. It is a comment and `exit 0`. The pipeline reads no cached artifact — every table it\nuses is derived inside the hooks from the DataFrames the judge passes in, and every lookup\n(drug list, bucket midpoints, ICD chapter ranges, discharge buckets) is a literal in\n`final/pipeline.py`. Zero runtime, zero disk.\n\nTo reproduce:\n\n```\ncd <this workspace> && bash final/build.sh && python final/run.py\n```\n\n`final/run.py` writes `final/submission.csv`. Runtime is dominated by the single TabFM pass over\n~48k context rows on a GPU; there is no training loop.\n\n## Things a reader could get wrong\n\n- **The docstring in `pipeline.py` is a run log, not a spec.** It narrates 71 evaluations in\n  chronological order, and several of its earlier conclusions are explicitly overturned later in\n  the same docstring (evals 60–71). Only the code below it, and the final section of the\n  docstring, describe what actually ships.\n- **`WEAK = []` and `MIN_DIAG = 1` / `LUMP = {...: 1}` are deliberate no-ops**, not leftovers.\n  They are the knobs whose non-trivial values won at 3 folds and lost at 5; the empty list and the\n  threshold of 1 are the *result* of that re-measurement. `DEAD` (four drug columns) is the only\n  column prune that survived.\n- **`folds()` changes the validation protocol, not the model.** The final fit uses the whole\n  training set; `folds()` only affects `judge.py val`. Scores in `log.txt` before eval 60 are on a\n  3-fold split and are not comparable to the ones after.\n- **`pd.set_option('mode.string_storage', 'python')` at import, and the object-dtype coercion at\n  the end of `engineer`, are required, not stylistic.** The judge runs the pipeline in a separate\n  process and cannot unpickle arrow-backed string arrays; removing either makes the run fail\n  rather than merely differ.\n- **Rows are exchangeable here** — no time or group structure was found in the encounter table, so\n  a plain stratified split mirrors how the test split was made.\n","package":[],"derivations":[]},{"id":"diamonds","name":"diamonds","short_name":"diamonds","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":499.65244,"plain_note":null,"n_train":35960,"n_test":17980,"n_folds":9,"thresholds":null,"summary":"The target is `price` and the metric is RMSE in dollars, so the pipeline splits the problem into a smooth global part, which an in-context model over ~24k rows is worst at, and a local part, which is what it is best at. A ridge regression in log-price fits the smooth part: a cubic spline in log(carat) with knots at the carat weights the trade pays a premium to cross (0.3, 0.5, 0.7, 1.0, 1.5, 2.0 plus fill-ins), the…","score":484.524027,"gain_pct":3.027787,"medal":null,"category":"II","lines":314,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["preprocess","engineer","postprocess"],"tabfm_kwargs":{"max_num_rows":"65536","n_svd_features":"'sqrt'"},"helper_functions":["_feat","_design","_grade_codes","_solve","_base","_oof_base"],"helper_ranges":{"_feat":[186,216],"_design":[219,240],"_grade_codes":[243,259],"_solve":[262,268],"_base":[271,272],"_oof_base":[275,284]},"hook_helpers":{"preprocess":["_feat","_design","_grade_codes","_solve","_base","_oof_base"],"engineer":["_feat"],"postprocess":[]},"hook_ranges":{"preprocess":[287,300],"engineer":[303,306],"postprocess":[309,314]},"code":"\"\"\"diamonds / RMSE on price. TabFM predicts the dollar residual off a ridge trend.\n\n499.88 (identity) -> 489.24. For scale: the population-weighted standard deviation of\nprice *given the four Cs* is 494.2, measured decile by decile over the 6117 repeated\ncarat/cut/colour/clarity cells so that each price band counts as much as it does in\nthe data, and on rows that have a match, conditioning further on depth and table\nmoves it from 180.4 to 179.7 -- nothing. So the nine attributes carry about what the\nfour Cs carry and the irreducible noise is around 490-500. I read that as \"at the\nfloor\" at eval 79 and was wrong: eval 81 then found 0.84. The number bounds the\nheadroom loosely, it does not say the search is over -- what says that is running out\nof *mechanisms*, not running out of variants.\n\nWhat the pipeline does, and the evidence for each piece:\n\n  - Ordinal grades (-2.6), spaced by value rather than by rank (-0.2). cut, colour\n    and clarity are quality scales: as strings TabFM gets only their appearance\n    order, as integers the ordering that prices them, and as their fitted additive\n    log-price effects the *distances* too -- D-to-E and I-to-J are not equal steps.\n    Rescaling the ranks without respacing changed nothing (72), so it is the spacing\n    that pays. Handing TabFM the strings alongside the numbers was worse (53).\n  - Geometry (-1.3). carat is mass and x*y*z volume, so their ratio is density, and\n    the shape ratios say what `depth` only summarises. The frame is at its width:\n    pruning to the non-redundant core lost 0.9 (19), carat-threshold features lost\n    0.9 (18), repaired dimensions lost 0.6 (47), a second scale column lost 1.0 (70),\n    putting the size columns in logs was a wash (77).\n  - Residualise, and hand over the scale (-1.2, growing to -2.9 as the trend\n    sharpened). The target is price minus a ridge fit of log(price), exponentiated\n    back with the dollar-least-squares scale. The trend has two jobs and only one is\n    the point: as a feature alone it is actively harmful (15, +8.8), as a subtraction\n    alone it loses 5.5 (16). Together they work, because the residual's spread grows\n    with price and `base` is what tells TabFM how large a correction this stone owes.\n  - Out-of-fold first stage (-0.9). Fit in-sample it hands TabFM residuals smaller\n    than the ones it must predict, and TabFM takes that optimism for the scale of its\n    own output. 5-fold is the optimum, with exact leave-one-out (28) on one side and\n    3-fold (52) on the other both slightly worse.\n  - The ridge penalty (-0.5), 1e-5, flat to 3e-6 (69) with 1e-4 measured beyond.\n  - n_svd_features (-0.4), the one TABFM_KWARGS value that pays, and only here: with\n    crosses against raw price it lost (11), alone against a dollar residual it wins.\n  - Bounding everything by the observed price range (-0.9). Price is truncated in\n    this data a little above $18800, so anything outside [min, max] of the fold is\n    wrong with certainty. The trend leaves that range often enough to matter -- it\n    reaches 24481 on the real test split, 59 rows above the training maximum -- and\n    bounding it fixes three things at once (80, 81): `base` as the feature stating\n    the scale, `base` as the value added back, and the residual the training rows\n    carry, where a 3ct stone was being handed a -6000 correction that existed only\n    because the trend had left the data.\n\nThree things govern, each learned the expensive way.\n\n**A better first stage is not a better pipeline.** A boosted-tree trend scores 40\n*better* alone and 18 worse overall (31). The ridge earns its place by being smooth:\nit takes the global carat curve and the grade levels, which is what an in-context\nmodel over 24k rows is worst at, and leaves everything local, which is what it is\nbest at. Six sharpenings failed the same way, most improving the trend's own RMSE\nwhile the score got worse -- three-way grade cells (8, 43), pairwise curvature (29),\nquality-tilted splines (30, 55), depth/table hinges (32), a dollar-space second stage\n(48), price^1 and price^2 row weights (38, 39). Block-wise penalties, the standard\nfix for one lambda serving a whole design, have no fuel here either: swept offline,\nneither rejected block improves the trend at any multiplier, and penalising the\nsparse high-carat hinges makes both the trend and its top-end bias worse, so those\nhinges are earning their keep. A saturating logit link, which removes the top-end\nbias almost exactly, costs 7.8 (84) by distorting the dense middle.\n\n**Context size beats every other use of the rows.** Bagged draws at 80% cost 1.7\n(17); dropping even the worst-explained 0.5% cost 0.7 (58); repeating the sparse\nexpensive tail cost 2.2 (67, though it gave the tightest fold spread of the run, so\nthe bandwidth argument was right and the side effect on the context's own\nnormalisation statistics was bigger). max_num_rows therefore sits above the row count\n-- which also keeps the 35960-row final at full context rather than the default 32768.\n\n**A column that estimates the target row by row is poison, however honest.** The\nfour-C cell mean of the residual, leave-one-out on the training rows, shrunk by\nn/(n+3), 79% coverage, correlation 0.152 in-context against 0.177 out -- no optimism,\nreal signal, and it cost 29 (68). An in-context model is fit *on* the context, so\nsuch a column is a shortcut it follows instead of the features, and the shortcut is\nweaker on a query than it looked. `base` is safe for the opposite reason: 259\nparameters over 24k rows is a smooth transform of the features, not an answer key.\n\nAlso measured and rejected: log and relative targets (raw-scale RMSE wants a\nconditional mean, +12.5); n_feature_crosses, enable_nnls and norm_methods, each\nre-asked after the regime changed under it; feat_shuffle_method, bit-identical either\nway in this build (73), so members differ only by normalisation and by whether they\ngot SVD columns; three flavours of ensembling by parameterisation (14, 20, 24 -- the\npasses share features, rows and noise); winsorising the target (57); a\ncarat-conditional band on top of the global one, rejected offline because the bounded\ntrend leaves such a band on 0, 8 and 2 rows per fold.\n\nThe correction's weight was solved, not searched: mse is exactly quadratic in it, so\none probe plus the trend's own error gives the optimum in closed form. The method\npredicted 494.42, 491.40 and 490.11 before the runs that returned 494.43, 491.44 and\n490.12. Asked five times, including separately for the 11% of stones above 1.5ct that\ncarry 70% of the squared error (59-60), it answered between 1.02 and 1.06 every time.\n\nEval 85 confirmed this file reproduces eval 81 exactly.\n\nIntent (eval 86): the same certainty argument as eval 81, applied to the inputs\nrather than the output. About 30 training and 19 test rows carry values that are not\nmeasurements -- a 2.00ct stone with y=58.9mm, a 0.51ct with z=31.8, a table of 95%,\na depth of 43 -- and they poison eight derived columns each (vol, density, diam, the\ntwo ratios, depth_calc, table_mm). x/cbrt(carat) is 6.418 across the clean data with\n99.8% of rows inside 6.06..6.76, so \"impossible\" is easy to define. Eval 47 replaced\nthem with estimates and washed; this marks them missing instead, which is what they\nare -- TabFM takes NaN natively and will fall back on carat, the grades and `base`,\nwhich for those rows is the whole of the trustworthy information. It also covers\ndepth and table, which eval 47 did not. (Winsorising depth and table for the *trend*\nwas checked offline and moves it by 0.09: the ridge is already robust to nine rows.)\n\nEval 86: 491.37, worse by 2.1 from 35 training and 18 test rows. So the certainty\nargument does not run backwards: bounding an *output* that cannot be right helps,\nbut refusing an *input* that cannot be right hurts. With outlier_threshold at its\ndefault the impossible value is already clipped to a bounded extreme and the row\nstill matches on carat, the grades and `base`; marked missing instead, it loses\neight of twenty-one columns and becomes a row with no near neighbours at all, which\nfor an in-context model is worse than a wrong number. Three treatments of these rows\nhave now been measured -- impute (47, wash), reject (86, -2.1), leave alone -- and\nleaving them alone wins.\n\nIntent (eval 88): re-ask the repeated out-of-fold split, which is the one noise\nsource in the pipeline that eval 81 made more influential. base_tr comes from a\nsingle 5-fold split, so on top of being honestly out-of-fold it carries the noise of\n*which* split it drew -- noise base_te does not have, in a column that now does three\njobs (the target's offset, TabFM's scale feature, and the thing the bound acts on).\nEval 37 called this a wash, but that was measured before the bound, before SVD and\nbefore the respacing, on a trend scoring 581 alone rather than 564. Three\npermutations averaged.\n\nEval 88: 489.44, inside the noise band and on the wrong side of it. Reverted; the\nsplit noise was not costing anything before the bound and is not costing anything\nafter it.\n\nIntent (eval 89): a per-row guard on the correction, in the same family as eval 81\nbut scaled locally instead of globally. The conditional spread of price is close to\n0.09 of price at every decile (62 at 486, 1237 at 14255), so `base` states not just\nthe level but the scale, and a prediction more than five of those away from the trend\nis a blow-up rather than a finding. Measured on the folds, only 0.11% of true prices\nsit outside base +/- 45%, so the band is loose enough to be safe and tight enough to\ncatch a runaway -- and unlike the global bound it is meaningful for cheap stones,\nwhere [min, max] of the whole training set says nothing at all.\n\nEval 89: 489.22. The 0.02 is noise by the standard this run has earned -- paired null\ndifferences on these folds run about +/-0.3 -- and I am keeping the guard for the\nother reason, not that one: on the real test split the trend reaches 24481, the final\nfits nine folds I never see, and an unbounded correction on top of an extrapolating\ntrend is the one failure mode that a squared metric cannot absorb. It costs nothing\nmeasurable and bounds a tail risk.\n\nStopped at 89 of 96 with the mechanisms exhausted. The distinction that matters, and\nthat I got wrong once at eval 79: running out of *variants* is not a reason to stop,\nrunning out of *mechanisms* is. Eval 81 came from noticing the trend left the data's\nsupport, not from sampling another knob. What is left now is candidates separated by\nless than 0.3, and since the final takes the minimum CV result, sampling more of\nthose lowers the recorded number by selecting luck rather than improving anything.\nIntent (eval 91): take the solved shrinkage rather than the rounded one. Eval 82's\nprobe pinned c* = 1.0426 on this trend and 1.03 was a rounding of it; the parabola\nsays 0.012. This is the one remaining candidate that is a fitted argmin rather than\na draw from the noise, so it is worth taking even though it cannot clear the 0.3 bar\nthat everything else has to.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'max_num_rows': 65536, 'n_svd_features': 'sqrt'}   # above the row count: every row stays in context\n\nCUT = {'Fair': 0, 'Good': 1, 'Very Good': 2, 'Premium': 3, 'Ideal': 4}\nCOLOR = {'J': 0, 'I': 1, 'H': 2, 'G': 3, 'F': 4, 'E': 5, 'D': 6}\nCLARITY = {'I1': 0, 'SI2': 1, 'SI1': 2, 'VS2': 3, 'VS1': 4, 'VVS2': 5, 'VVS1': 6, 'IF': 7}\n\n# preprocess and postprocess run in separate subprocesses over a shared workspace,\n# so the fold's test-row baseline travels through a scratch file, not a global.\n_STASH = '.base_test.npy'\nSHRINK = 1.043    # weight on TabFM's correction; solved for, flat over 1.00-1.10\n_GUARD = 0.45     # five conditional sigmas: the correction cannot exceed this share of base\n\n# knots where the trade itself puts them: the \"magic\" carat weights buyers pay a\n# premium to cross (0.3, 0.5, 0.7, 1.0, 1.5, 2.0) plus fill-in knots between them.\n_KNOTS = np.log(np.array([0.3, 0.4, 0.5, 0.7, 0.9, 1.0, 1.2, 1.5, 2.0, 2.5, 3.0]))\n_RIDGE, _KFOLD = 1e-5, 5\n_BOUNDS = (250.0, 25000.0)   # the trend's output range; set per fold from the prices seen\n\n\n_GRADES = (('cut', 5), ('color', 7), ('clarity', 8))\n_RANK_CODES = False   # True = uniform spacing, only rescaled; False = spaced by fitted value\n_CODES = {}        # per-fold grade codes, shared from preprocess to engineer\n\n\ndef _feat(d, codes=None):\n  \"\"\"Domain features. `codes` respaces the grade columns; the ridge always gets the\n  plain 0..k-1 ranks, because it builds its dummies by comparing against them.\"\"\"\n  o = pd.DataFrame(index=d.index)\n  ct = d['carat'].astype(float)\n  o['carat'] = ct\n  o['cut'] = d['cut'].map(CUT).astype(float)\n  o['color'] = d['color'].map(COLOR).astype(float)\n  o['clarity'] = d['clarity'].map(CLARITY).astype(float)\n  if codes:\n    for name, _ in _GRADES:\n      o[name] = codes[name][o[name].to_numpy().astype(int)]\n  o['depth'] = d['depth'].astype(float)\n  o['table'] = d['table'].astype(float)\n  x = d['x'].replace(0.0, np.nan).astype(float)      # a zero dimension is missing, not small\n  y = d['y'].replace(0.0, np.nan).astype(float)\n  z = d['z'].replace(0.0, np.nan).astype(float)\n  o['x'], o['y'], o['z'] = x, y, z\n\n  o['vol'] = x * y * z\n  o['log_carat'] = np.log(ct)\n  o['density'] = ct / (x * y * z)\n  o['size'] = np.cbrt(ct)\n  o['diam'] = 0.5 * (x + y)\n  o['yx'] = y / x\n  o['zx'] = z / x\n  o['depth_calc'] = 200.0 * z / (x + y)\n  o['table_mm'] = o['table'] * 0.005 * (x + y)\n  o['depth_dev'] = np.abs(o['depth'] - 61.9)\n  o['table_dev'] = np.abs(o['table'] - 56.5)\n  return o\n\n\ndef _design(f):\n  \"\"\"The trend in log-price: a carat spline, the three grades, and their pairs.\n  Cells are enumerated, never support-filtered, so train and test always produce\n  the same 259 columns.\"\"\"\n  lc = f['log_carat'].to_numpy()\n  cut, color, clarity = (f[c].to_numpy() for c in ('cut', 'color', 'clarity'))\n  cols = [np.ones_like(lc), lc, lc ** 2, lc ** 3]\n  cols += [np.maximum(lc - k, 0.0) for k in _KNOTS]\n\n  for g, k in ((cut, 5), (color, 7), (clarity, 8)):\n    for j in range(1, k):                              # drop first level, keep intercept\n      d = (g == j).astype(float)\n      cols += [d, d * lc, d * lc ** 2]\n  for A, ka, B, kb in ((color, 7, clarity, 8), (cut, 5, clarity, 8), (cut, 5, color, 7)):\n    for a in range(1, ka):\n      for b in range(1, kb):\n        d = ((A == a) & (B == b)).astype(float)\n        cols += [d, d * lc]\n\n  dp, tb = f['depth'].to_numpy() - 61.75, f['table'].to_numpy() - 57.46\n  cols += [dp, dp ** 2, tb, tb ** 2, dp * tb]\n  return np.nan_to_num(np.column_stack(cols), nan=0.0, posinf=0.0, neginf=0.0)\n\n\ndef _grade_codes(f, t):\n  \"\"\"Recode each grade level by its additive effect on log-price, order preserved.\"\"\"\n  lc = f['log_carat'].to_numpy()\n  cols, spans = [np.ones_like(lc), lc, lc ** 2, lc ** 3], {}\n  for name, k in _GRADES:\n    spans[name] = (len(cols), k)\n    cols += [(f[name].to_numpy() == j).astype(float) for j in range(1, k)]\n  A = np.nan_to_num(np.column_stack(cols), nan=0.0)\n  reg = 1e-8 * A.shape[0] * np.eye(A.shape[1])\n  reg[0, 0] = 0.0\n  w = np.linalg.solve(A.T @ A + reg, A.T @ t)\n  out = {}\n  for name, k in _GRADES:\n    i, _ = spans[name]\n    e = np.arange(float(k)) if _RANK_CODES else np.concatenate([[0.0], w[i:i + k - 1]])\n    out[name] = (e - e.mean()) / (e.std() + 1e-9)      # centred, unit scale, monotone\n  return out\n\n\ndef _solve(A, t):\n  reg = _RIDGE * A.shape[0] * np.eye(A.shape[1])\n  reg[0, 0] = 0.0\n  w = np.linalg.solve(A.T @ A + reg, A.T @ t)\n  e = np.exp(A @ w)\n  scale = float(e @ np.exp(t) / (e @ e))   # least squares in dollars, not Duan's mean-of-ratios\n  return w, scale\n\n\ndef _base(A, w, scale):\n  return np.clip(scale * np.exp(A @ w), *_BOUNDS)\n\n\ndef _oof_base(A, t):\n  \"\"\"The training rows' own baseline, each fifth of them fit without themselves.\"\"\"\n  out = np.empty(len(t))\n  edge = np.linspace(0, len(t), _KFOLD + 1).astype(int)\n  order = np.random.default_rng(0).permutation(len(t))\n  for i in range(_KFOLD):\n    va = order[edge[i]:edge[i + 1]]\n    tr = np.setdiff1d(order, va, assume_unique=True)\n    out[va] = _base(A[va], *_solve(A[tr], t[tr]))\n  return out\n\n\ndef preprocess(X_train, y_train, X_test):\n  global _BOUNDS\n  f_tr, f_te = _feat(X_train), _feat(X_test)\n  t = np.log(np.asarray(y_train, dtype=float))\n  _BOUNDS = (float(np.min(y_train)), float(np.max(y_train)))\n  _CODES.update(_grade_codes(f_tr, t))\n  A_tr = _design(f_tr)\n  base_tr = _oof_base(A_tr, t)\n  base_te = _base(_design(f_te), *_solve(A_tr, t))\n  np.save(_STASH, base_te)\n  X_train, X_test = X_train.copy(), X_test.copy()\n  X_train['base'], X_test['base'] = base_tr, base_te\n\n  return X_train, y_train.astype(float) - base_tr, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  a, b = _feat(X_train, _CODES), _feat(X_test, _CODES)\n  a['base'], b['base'] = X_train['base'].to_numpy(), X_test['base'].to_numpy()\n  return a, b\n\n\ndef postprocess(pred, y_orig, X_test):\n  base = np.load(_STASH)\n  out = SHRINK * np.asarray(pred, dtype=float) + base\n  out = np.clip(out, base * (1.0 - _GUARD), base * (1.0 + _GUARD))\n  # price is truncated in this data, so anything outside the observed range is wrong\n  return np.clip(out, float(np.min(y_orig)), float(np.max(y_orig)))\n","readme":"# diamonds — TabFM on a dollar residual off a ridge trend\n\n## What the pipeline does\n\nThe target is `price` and the metric is RMSE in dollars, so the pipeline splits the problem\ninto a smooth global part, which an in-context model over ~24k rows is worst at, and a local\npart, which is what it is best at. A ridge regression in log-price fits the smooth part: a\ncubic spline in log(carat) with knots at the carat weights the trade pays a premium to cross\n(0.3, 0.5, 0.7, 1.0, 1.5, 2.0 plus fill-ins), the three quality grades with their own\nlog-carat slopes and curvature, all three pairwise grade interactions, and quadratic\ndepth/table terms — 259 columns, penalty 1e-5, exponentiated back with a dollar\nleast-squares scale rather than a smearing estimate. That fitted value is `base`. For the\ntraining rows it is computed out-of-fold over 5 folds, so TabFM is not handed residuals\nsmaller than the ones it must predict; for the test rows it comes from a single fit on the\nwhole training split. `base` is clipped to the observed price range of the fold, because\nprice is truncated in this data and a trend that extrapolates past it (it reaches 24481 on\nthe real test split) is wrong with certainty.\n\nTabFM then predicts `price - base` in dollars, from the nine raw attributes plus geometry\n(volume, density, mean diameter, the y/x and z/x shape ratios, the recomputed depth, table\nin mm, deviations from the modal depth and table), the three grades recoded by their fitted\nadditive log-price effect rather than by rank — so D-to-E and I-to-J are not equal steps —\nand `base` itself as a feature, which is what tells TabFM how large a correction this stone\nowes. `max_num_rows` is set above the row count so every training row stays in context, and\n`n_svd_features='sqrt'` is the one TabFM knob that paid. Postprocess adds `1.043 *\nprediction` back to `base` (the shrinkage is a solved argmin, not a searched value: MSE is\nexactly quadratic in it), clips the result to `base ± 45%` as a per-row runaway guard, and\nclips again to the training price range.\n\nMeasured: 484.52 RMSE, the mean over the 9 TabArena folds, against published baselines of\n499.65 (plain TabFM) and 495.15 (TabFM-Ensemble). Search CV best was 489.21.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`. The pipeline reads no file it does not\nwrite itself — the only file it touches, `.base_test.npy`, is a within-fold scratch handoff\nfrom `preprocess` to `postprocess`, which run in separate subprocesses. It takes no time and\nno disk. No helper scripts were written during the run, which is why `final/build/` does not\nexist.\n\n## What a reader could get wrong\n\n- **The data is a judge prerequisite, not a pipeline one.** This is a TabArena task:\n  `judge.py` reads `${TABARENA_DIR:-$HOME/.cache/tabarena}/diamonds/fold_<k>/{train,test}.csv`\n  (30 folds cached, 9 used). `data/train.csv` and `data/test.csv` in this workspace are\n  fold 0, materialised by the judge. Those folds were downloaded by the repo's tabarena\n  downloader before this run started, from outside this workspace, so the exact invocation\n  is not in this run's record and `build.sh` deliberately does not guess at it. If the cache\n  is present, `python final/run.py` works as documented.\n- **`run.py` reproduces one fold, not the reported score.** It loads fold 0 and writes a\n  single `final/submission.csv`. The 484.52 in `result.json` is the mean over 9 folds, each\n  fitted independently — that is `judge.py`'s `tabarena_final` path, not the driver's. Also\n  note `run.py` ends by merging against `T.competition.sample_submission`, which a TabArena\n  task has no attribute for; expect it to fail at that last step even though the prediction\n  itself completed. `python final/run.py --check` stops before TabFM and is unaffected.\n- **`base` is a feature, and that is not a leak.** A column that estimates the target row by\n  row is poison for an in-context model — a leave-one-out four-C cell mean of the residual,\n  fully honest, cost 29 RMSE. `base` is safe for the opposite reason: 259 parameters over\n  24k rows is a smooth transform of the features, not an answer key.\n- **The out-of-fold first stage is load-bearing, and so is its being a *ridge*.** A boosted\n  tree scores 40 better as a standalone trend and 18 worse as this pipeline's first stage.\n  Sharpening the trend is the failure mode this task rewards least.\n- **Rows with impossible measurements are left alone on purpose.** ~30 training rows carry\n  values that are not measurements (a 2.00ct stone with y=58.9mm, a table of 95%). Imputing\n  them was a wash; marking them NaN cost 2.1. With TabFM's default outlier clipping the row\n  still matches on carat, the grades and `base`, whereas NaN-ing eight of twenty-one columns\n  leaves a row with no near neighbours at all.\n","package":[],"derivations":[]},{"id":"E-CommereShippingData","name":"E-CommereShippingData","short_name":"E-CommereShippingData","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.257592,"plain_note":null,"n_train":7332,"n_test":3667,"n_folds":9,"thresholds":null,"summary":"The pipeline throws away almost the entire table. Analysis of the 7332 training rows showed that only three of the ten raw columns carry signal, and that they carry it as a piecewise-constant structure rather than as a smooth function: a deterministic region (`Discount_offered > 10`, or `2000 < Weight_in_gms < 4000`, or `Weight_in_gms > 6000`) covers ~26% of rows and is essentially 100% positive; among the rest…","score":0.250845,"gain_pct":2.619258,"medal":null,"category":"II","lines":100,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","folds"],"tabfm_kwargs":{"norm_methods":"['none']","average_logits":"False"},"helper_functions":["_add"],"helper_ranges":{"_add":[68,82]},"hook_helpers":{"preprocess":[],"engineer":["_add"],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[64,65],"engineer":[88,89],"sample":[92,96],"postprocess":[99,100],"folds":[58,61]},"code":"\"\"\"E-CommereShippingData -- 1-auc, lower is better.\n\nReference (eval 2, identity + these folds): 0.25243.\n\nEval 3 (identity + det_late/w_lite/cost_lite): 0.24941.\n\nEval 4 (same three, only Weight/Cost/Discount kept): 0.24895.\nOffline logistic reference on the SAME 15 folds: 0.2457-0.2458, so TabFM is still ~0.004 behind\na four-term linear model. Offline the structure is:\n  det_late                                      -> ~100% Yes  (26% of rows)\n  Weight<=2000 & Cost<=200 (\"pocket\")           -> 85% Yes    (n~195)\n  Weight<=2000 & Cost>200                       -> 47%\n  4000<Weight<=4100 (\"near\", boundary bump)     -> 55%\n  Weight>4100                                   -> 42%, mildly increasing in Cost\nEval 5 (Cost, det_late, w_lite, pocket, w_near): 0.24672.\nEval 6 (+ raw Weight_in_gms): 0.24946 -- raw weight hurts, reverted.\nEval 7 (5 cols, norm_methods=['none']): 0.24646.\nEval 8 (+ n_feature_crosses='sqrt'): 0.24751 -- worse, dropped.\nEval 9 (+ average_logits=False): 0.24637 -- a hair better, kept.\nEval 10: ERROR -- a pyarrow-backed string column cannot cross the hook pickle boundary.\nEval 11 (seg categorical + Cost): 0.24627.\nEval 12 (near band widened to 4000<w<=4200): 0.24521.\nEval 13 (3 bagged 90% draws): 0.24496.\nEval 14 (+ enable_nnls=True): 0.24494 -- identical score, 9x the wall time. Dropped.\nEval 15 (+ permute_categorical=True): 0.24546 -- worse, dropped.\nEval 16 (exact boundaries + an out-of-fold per-segment rate column): 0.24519 -- the rate\ncolumn is redundant with the code and costs a little; dropped, boundaries kept.\nEval 17 (postprocess lifting det above everything): 0.24499 with tabfm_corr still 1.000 --\nthe lift was already monotone, i.e. TabFM ranks every det row above every other row on its\nown. Removed again; nothing to win there.\nEval 18 (cost masked to heavy|near): 0.24627 -- clearly worse for TabFM even though it helped\nthe logistic reference; TabFM wants the raw column. Reverted.\nPer-segment cross-validated LR over all ten raw columns: heavy 0.501, lite 0.492, near 0.498\n-- there is no signal left in this table beyond seg and cost, so the rest of the budget goes\non how TabFM estimates that model rather than on new columns.\nIntent (eval 19): 6 bagged draws instead of 3 (48 members averaged instead of 24).\n\nFolds: repeated stratified 5-fold (3 repeats, 15 splits):\n  * each fold's TabFM context is 5866 rows instead of 4888, closer to the 7332 the final fits on;\n  * every training row is validated three times under three different partitions, so the\n    partition-specific noise in a paired comparison drops by ~sqrt(3).\n\nData notes from local analysis of data/train.csv (7332 rows, 10 features, 59.7% 'Yes'):\n  * a deterministic region covers 26% of rows and is ~100% 'Yes':\n      Discount_offered > 10, or 2000 < Weight_in_gms <= 4000, or Weight_in_gms > 6000.\n  * the remaining 74% sit at 45.3% 'Yes' and carry one usable interaction:\n      light parcels (Weight_in_gms <~ 4130) that are cheap (Cost_of_the_Product <~ 190)\n      are ~80% 'Yes', everything else in that region is ~42-47%.\n  * every other column (warehouse, mode, gender, rating, calls, prior purchases) is flat\n    once weight and cost are conditioned on.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'norm_methods': ['none'], 'average_logits': False}\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=3, random_state=0)\n  return list(rskf.split(X_train, y_train))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _add(X):\n  X = X.copy()\n  w = X[\"Weight_in_gms\"].to_numpy(dtype=float)\n  c = X[\"Cost_of_the_Product\"].to_numpy(dtype=float)\n  d = X[\"Discount_offered\"].to_numpy(dtype=float)\n  det = (d > 10) | ((w > 2000) & (w < 4000)) | (w > 6000)\n  lite = w <= 2000\n  pocket = lite & (c <= 200)\n  near = (w >= 4000) & (w <= 4200)\n  seg = np.where(det, \"det\", np.where(pocket, \"pocket\",\n                 np.where(lite, \"lite\", np.where(near, \"near\", \"heavy\"))))\n  # plain object dtype: the judge host has no pyarrow, so a pyarrow-backed\n  # pandas string column cannot be unpickled on the other side of the hook.\n  X[\"seg\"] = pd.Series(seg, index=X.index, dtype=object)\n  return X[KEEP]\n\n\nKEEP = [\"Cost_of_the_Product\", \"seg\"]\n\n\ndef engineer(X_train, y_train, X_test):\n  return _add(X_train), _add(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  rng = np.random.default_rng(0)\n  k = int(round(0.9 * n))\n  return [np.sort(rng.choice(n, k, replace=False)) for _ in range(6)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# E-CommereShippingData — final pipeline\n\n## What it does\n\nThe pipeline throws away almost the entire table. Analysis of the 7332 training rows showed that\nonly three of the ten raw columns carry signal, and that they carry it as a piecewise-constant\nstructure rather than as a smooth function: a deterministic region (`Discount_offered > 10`, or\n`2000 < Weight_in_gms < 4000`, or `Weight_in_gms > 6000`) covers ~26% of rows and is essentially\n100% positive; among the rest, very light parcels (`Weight_in_gms <= 2000`) that are also cheap\n(`Cost_of_the_Product <= 200`) are ~85% positive, a narrow weight band just above 4000 g behaves\ndifferently from the bulk, and everything else sits near the base rate. So `engineer` collapses\nweight and discount into one five-level categorical `seg` column (`det` / `pocket` / `lite` /\n`near` / `heavy`) and keeps exactly one numeric column, `Cost_of_the_Product`, which still tilts\nthe heavy segment. Per-segment cross-validated logistic regressions over all ten raw columns came\nout at chance (0.49–0.50 AUC), which is why no further columns were added.\n\nTabFM is the only predictor: it does in-context learning over the two-column training table.\n`preprocess` and `postprocess` are identity. The remaining gains came from how TabFM estimates\nthat small model rather than from features — `norm_methods=['none']` and `average_logits=False`\nin `TABFM_KWARGS`, and `sample` returning six independent 90% subsamples of the training rows, so\nthe judge's 8-member ensemble is run six times over different contexts and averaged (48 members).\nValidation used repeated stratified 5-fold (3 repeats, 15 splits) so each fold's context is close\nin size to what the final fits on and paired comparisons are less partition-noisy. Metric is\n`1 - AUC`, lower is better; the search moved it from 0.2524 (raw columns, same folds) to 0.2450.\n\n## build.sh\n\nThere is nothing to build. `final/build.sh` prints one line and exits 0. The pipeline reads no\nfile from disk — every feature is computed from the dataframes the judge passes to the hooks — and\nno helper script or cache was produced during the run, so there is no `final/build/` directory.\nZero disk, instant.\n\n```\ncd <this workspace> && bash final/build.sh && python final/run.py\n```\n\n## Things a reader could get wrong\n\n- **`seg` must stay plain `object` dtype.** `_add` builds it with `dtype=object` on purpose. An\n  earlier version used a pandas string dtype, which is pyarrow-backed here; the judge host has no\n  pyarrow, so the column could not be unpickled across the hook boundary and the evaluation\n  errored out. Do not \"clean this up\" to `astype(\"string\")`.\n- **The segment boundaries are exact and were tuned.** `w > 2000 & w < 4000` (strict on both\n  sides), `w <= 2000` for lite, `4000 <= w <= 4200` for near. Widening `near` from 4100 to 4200\n  alone was worth ~0.001 AUC. They are not round numbers by accident.\n- **The raw `Weight_in_gms` column is deliberately absent.** Adding it back on top of `seg` made\n  things clearly worse (0.2495 vs 0.2467); TabFM ends up smoothing across boundaries the code\n  already encodes. Conversely, masking `Cost_of_the_Product` to only the segments where a logistic\n  reference wanted it also hurt — TabFM wants that column raw and unconditioned.\n- **`sample` returning a list of index arrays means bagging, not subsetting.** Six draws is a\n  wall-clock cost of 6× one TabFM pass; dropping to 3 costs ~0.0005 AUC if runtime matters.\n- **The competition data is not regenerated by anything here.** It comes from the TabArena cache\n  (`~/.cache/tabarena`, dataset `E-CommereShippingData`, 9 folds per `final/config.yaml`) and the\n  judge loads it. `final/run.py` will fail if that cache is absent.\n- `final/run.py` refuses to run if the workspace `pipeline.py` differs from `final/pipeline.py`;\n  they are identical as shipped.\n","package":[],"derivations":[]},{"id":"Fitness_Club","name":"Fitness_Club","short_name":"Fitness_Club","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.178892,"plain_note":null,"n_train":1000,"n_test":500,"n_folds":30,"thresholds":null,"summary":"The task is to predict `attended` from six columns of 1000 gym-signup rows, scored as 1 − ROC-AUC. Almost all of the signal sits in `months_as_member`, which is monotone in the attendance rate over every decile; ranking rows by that raw column alone already beats the untouched TabFM pipeline.","score":0.178652,"gain_pct":0.134159,"medal":null,"category":"II","lines":114,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"norm_methods":"['quantile', 'power']","permute_categorical":"True"},"helper_functions":["_design","_oof_score"],"helper_ranges":{"_design":[91,97],"_oof_score":[100,110]},"hook_helpers":{"preprocess":[],"engineer":["_design","_oof_score"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[76,77],"engineer":[80,88],"postprocess":[113,114],"folds":[71,73]},"code":"\"\"\"Fitness_Club -- predict `attended`, scored 1 - ROC-AUC (lower is better).\n\nTHE TASK. 1000 training rows, six columns, 30% positives. Attendance rises monotonically\nover every decile of months_as_member (4% -> 79%); that one column carries almost all of the\nsignal. The other five are jointly only marginally informative (likelihood-ratio test of the\nfull logistic model against months alone: p = 0.05). Ranking the rows by raw\nmonths_as_member, with no model at all, scores 0.17173 on these folds -- better than the\nidentity pipeline's 0.17374. So the whole problem is to let TabFM use the dominant column\ncleanly and add the faint rest without drowning in it.\n\nFOLDS. 5 repeats of stratified 3-fold, 667 train / 333 validation. The 2:1 ratio mirrors the\nfinal, which fits each of the 30 TabArena folds on 1000 of the dataset's 1500 rows. Fifteen\nsplits keep an evaluation near two minutes; paired differences between two runs on these\nsplits have a standard error of about 0.00027, so 0.0006 is the resolution.\n\nWHAT THIS PIPELINE DOES.\n1. engineer drops day_of_week, weight and days_before. Each of the three costs TabFM\n   accuracy on its own (dropping weight alone: 0.17358 -> 0.17082) and they are worthless in\n   a linear model too. time and category stay: hiding time costs 0.0016.\n2. engineer adds one column, `prior`: the score of a heavily shrunk logistic regression\n   (C=0.05, standardised, months + time and category dummies), out of fold over 5 folds of\n   the training rows and full-fit for the test rows. This is the single largest gain in the\n   run. The same four columns without it score 0.17136; with it, 0.16844.\n   The out-of-fold noise in that column is part of why it works: averaging five out-of-fold\n   splits into it, which makes it smoother, is far worse (0.17579). So is a spline version\n   (0.16987), a kNN one (0.18380), one fitted on the dropped columns (0.17184), one fitted\n   only on the weak columns (0.17366), and giving TabFM two of them (0.16937). Shrinkage is\n   a genuine optimum: C = 0.015 / 0.03 / 0.05 / 0.07 / 0.1 -> .16909 / .16873 / .16844 /\n   .16883 / .16904.\n3. TABFM_KWARGS: 'quantile' replaces the default 'none' as the first normalisation, since\n   months_as_member is heavily skewed (median 12, max 148) and the target is a ranking;\n   permute_categorical adds per-member diversity over the two remaining string columns\n   (without it, 0.16874). The rest of the constructor is close to inert here --\n   softmax_temperature 0.6 and 1.4 both give 0.17029 against 0.17032 for the default,\n   average_logits=False 0.17030, outlier_threshold 8.0 bit-identical to 4.0.\n4. postprocess returns TabFM's probabilities unchanged. An earlier version projected them\n   onto an isotonic fit in months_as_member and kept only a fraction LAM of the residual,\n   which was worth 0.0011 before the prior column existed but is harmful after it\n   (LAM = 0 / 0.25 / 1 -> 0.17149 / 0.16946 / 0.16844): once TabFM has the prior, its\n   departures from monotonicity in months carry signal rather than noise.\n\nWHAT DID NOT WORK. Extra views of months_as_member (log1p and a rank) were the best thing\nfound before the prior column and are harmful after it (0.16981). Also tried and worse:\nclass-balanced contexts (0.17038), 80% bagged contexts per member (0.17056), three averaged\ndraws (0.17047), dropping the worst-fitting 5% / 12% of context rows (0.17182 / 0.17267),\nrandom feature crosses (0.16881), SVD features (0.17056), class_shift=False (0.16856),\nfeat_shuffle_method='none' (0.17034), four normalisations instead of two (0.17267),\none-hot / NaN / out-of-fold-rate encodings of the categoricals (0.17030 / 0.17031 / 0.17069),\na months-by-PM interaction column (0.16863), hiding months_as_member from TabFM once the\nprior carries it (0.16923), and giving TabFM the prior's rank as well (0.17008).\n\nProgress: 0.17374 (identity) -> 0.16844.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]   OPTIONAL\n  postprocess(pred, y_orig, X_test)     -> pred\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]            OPTIONAL\n\"\"\"\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import RepeatedStratifiedKFold\n\nTABFM_KWARGS = {'norm_methods': ['quantile', 'power'], 'permute_categorical': True}\n\nDROP = ('day_of_week', 'weight', 'days_before')   # columns TabFM does better without\nPRIOR_C = 0.05                                    # inverse shrinkage of the prior's logistic regression\nPRIOR_K = 5                                       # folds of the prior's out-of-fold column\n\n\ndef folds(X_train, y_train):\n  rskf = RepeatedStratifiedKFold(n_splits=3, n_repeats=5, random_state=0)\n  return list(rskf.split(np.zeros(len(y_train)), np.asarray(y_train)))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  keep = [c for c in X_train.columns if c not in DROP]\n  Xtr, Xte = X_train[keep].copy(), X_test[keep].copy()\n  y = np.asarray(y_train) == 'Yes'\n  if len(np.unique(y)) > 1:      # `check` runs on a slice that can be single-class\n    d_tr = _design(Xtr)\n    d_te = _design(Xte).reindex(columns=d_tr.columns, fill_value=0.0)\n    Xtr['prior'], Xte['prior'] = _oof_score(d_tr.to_numpy(float), y, d_te.to_numpy(float))\n  return Xtr, Xte\n\n\ndef _design(X):\n  \"\"\"Numeric columns as they are, string columns as dummies.\"\"\"\n  num = X.select_dtypes(include=[np.number]).drop(columns=[c for c in ('row_id',) if c in X.columns])\n  obj = [c for c in X.columns if c not in num.columns and c != 'row_id']\n  num = num.astype(float)\n  return pd.concat([num.fillna(num.median())] +\n                   [pd.get_dummies(X[c].astype(str), prefix=c, dtype=float) for c in obj], axis=1)\n\n\ndef _oof_score(A, y, B):\n  \"\"\"Out-of-fold decision function on the training rows, full-fit one on the test rows.\"\"\"\n  from sklearn.linear_model import LogisticRegression\n  from sklearn.model_selection import StratifiedKFold\n  from sklearn.pipeline import make_pipeline\n  from sklearn.preprocessing import StandardScaler\n  mk = lambda: make_pipeline(StandardScaler(), LogisticRegression(C=PRIOR_C, max_iter=5000))\n  oof = np.zeros(len(A))\n  for tr, va in StratifiedKFold(PRIOR_K, shuffle=True, random_state=0).split(A, y):\n    oof[va] = mk().fit(A[tr], y[tr]).decision_function(A[va])\n  return oof, mk().fit(A, y).decision_function(B)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Fitness_Club — final pipeline\n\n## What it does\n\nThe task is to predict `attended` from six columns of 1000 gym-signup rows, scored as\n1 − ROC-AUC. Almost all of the signal sits in `months_as_member`, which is monotone in the\nattendance rate over every decile; ranking rows by that raw column alone already beats the\nuntouched TabFM pipeline. The method here is therefore about feeding TabFM a clean version of\nthat structure rather than about modelling capacity.\n\nThree columns — `day_of_week`, `weight`, `days_before` — are dropped, each of which hurt TabFM\non its own. One column is added: `prior`, the decision function of a heavily shrunk\nstandardised logistic regression (C = 0.05) on the surviving columns, computed out of fold\nacross 5 stratified folds for the training rows and from a full fit for the test rows. That\nsingle column is the largest gain of the run (0.17136 → 0.16844). Its out-of-fold noise is\npart of why it helps: smoothing it by averaging several out-of-fold splits is markedly worse.\nTabFM then predicts by in-context learning over those five columns, with `quantile` as its\nfirst normalisation (the target is a ranking and `months_as_member` is heavily skewed) and\n`permute_categorical` on for extra per-member diversity across the two remaining string\ncolumns. `postprocess` returns TabFM's probabilities unchanged.\n\nValidation uses 5 repeats of stratified 3-fold — 667 train / 333 validation, matching the 2:1\nratio the final split uses — which puts the paired resolution between two runs at about 0.0006.\nProgress over the run: 0.17374 (identity) → 0.16844.\n\n## What `build.sh` builds\n\nNothing. `final/pipeline.py` reads no files; the `prior` column is fitted inside `engineer()`\nfrom the frames the judge passes in. `build.sh` is a no-op that exits 0 — zero runtime, zero\ndisk. Run:\n\n```\nbash final/build.sh && python final/run.py\n```\n\n`python final/run.py` fits and scores in a couple of minutes on the competition data; the TabFM\npass is the only cost.\n\n## Things a reader could get wrong\n\n- **`final/build/runexp.py` is not a build step.** It is the search driver used during the run:\n  it rewrote the constants at the top of `pipeline.py` (`TABFM_KWARGS`, `DROP`, `PRIOR_C`,\n  `PRIOR_K`, and two constants that no longer exist in the final file) and shelled out to\n  `judge.py check` / `judge.py val` for each variant. Running it now would *overwrite*\n  `pipeline.py`. It is kept only as a record of how the numbers in the docstring were produced.\n- **The `prior` column is refitted, not restored.** It depends on which rows are in the\n  training frame, so it is different for every fold and for the final fit. That is deliberate —\n  a frozen precomputed version would leak across folds and, per the run's own experiments, a\n  less noisy version scores worse.\n- **`engineer` skips the prior when the label slice is single-class.** `judge.py check` runs the\n  hooks on a 200-row slice that may contain only one class; in that case the four base columns\n  are returned without `prior`. This is a guard for the dry run, not a code path the real fit\n  takes.\n- **The constants encode tuned optima, not defaults.** `PRIOR_C = 0.05` sits at the bottom of a\n  measured curve (0.015 → 0.1 gives .16909 / .16873 / .16844 / .16883 / .16904), and the drop\n  list is column-by-column measured. Changing them is not free.\n","package":[],"derivations":[]},{"id":"Food_Delivery_Time","name":"Food_Delivery_Time","short_name":"Food_Delivery_Time","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":7.329517,"plain_note":null,"n_train":30300,"n_test":15151,"n_folds":9,"thresholds":null,"summary":"The task is to predict `Time_taken(min)` (RMSE, lower better) for 15,151 deliveries from 30,300 training rows. The pipeline's premise, established from the training data alone, is that almost none of the 11 raw columns carry signal.","score":7.173553,"gain_pct":2.127889,"medal":null,"category":"I","lines":148,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer"],"tabfm_kwargs":{"permute_categorical":"True","enable_nnls":"True"},"helper_functions":["_feat"],"helper_ranges":{"_feat":[101,140]},"hook_helpers":{"preprocess":[],"engineer":["_feat"],"postprocess":[]},"hook_ranges":{"preprocess":[97,98],"engineer":[143,144],"postprocess":[147,148]},"code":"\"\"\"Food_Delivery_Time: TabFM over the four quantities that carry signal, encoded as steps.\n\nWHAT THE DATA IS (all from train.csv only)\n  * y = 5*bucket + Uniform{0..4}: y%5 is exactly uniform over 0..4, so ~2.0 of the 87.7 total variance\n    is pure label noise and the predictable object is the bucket.\n  * Delivery_location_* = Restaurant_* + delta, with delta_lat == delta_lon to 1e-6 and only 12\n    distinct values (0.01..0.14; 0.10 and 0.12 absent). Direction is never available (delta > 0\n    always), so the geography reduces to that one quantised scalar. It beats the haversine distance\n    it implies -- local 3-fold HistGBR 7.209 with delta, 7.294 with haversine, 7.466 on raw columns --\n    partly because 8% of rows have (0,0) coordinates for which delta survives and the distance does not.\n  * Everything else is noise: absolute lat/lon, the city prefix, Type_of_order, the 1320-level\n    Delivery_person_ID, out-of-fold target encodings of restaurant / city / person (7.221-7.228 vs a\n    7.210 base), and every unsupervised count I could build -- rows per person-id / restaurant / city /\n    restaurant coordinate / delivery coordinate, deliverers per restaurant, distance from the city\n    centroid (7.214 to 7.220). Row order carries nothing (lag-1 target autocorrelation -0.008).\n  * The three real drivers are steps, not slopes: age <30 ~23 min vs >=30 ~29.4 (flat within each --\n    22.8-23.3 across ages 20-28, 29.3-29.7 across 30-39); rating <3.95 ~37, 3.95-4.45 ~34.6,\n    >=4.45 ~24; vehicle motorcycle/bicycle ~27.6 vs scooter/electric_scooter ~24.4.\n  * age==29 AND rating==4.6 marks ~1189 rows whose delivery-person record was median-imputed. Each\n    marker alone is genuine (age 29 alone: 1189 rows, mean 23.2, the <30 plateau; rating 4.6 alone:\n    4435 rows, mean 24.7), but their overlap is 1450 rows where 512 are expected under independence,\n    and it averages 25.7 -- the unconditional mean. Age 15/rating 1.0 (24 rows) and age 50/rating 6.0\n    (29 rows) are each the same rows twice over: sentinels.\n\nHOW MUCH IS THERE TO GET\n  The 102 exactly-duplicated feature rows give a within-duplicate variance of 60.2 (df 105, 95% CI\n  [47, 79]) against this pipeline's MSE of 51.4, so there is no feature left to find. The estimate of\n  the conditional mean is already close to as good as it gets, too: the affine parabola probed at\n  eval 9 puts the optimal shrink at 1.0006, three 90% draws (24 members instead of 8) change nothing,\n  and a blend partner is useless because model families barely disagree here -- HistGBR and\n  ridge-on-interactions errors correlate at 0.988 and their best blend weight is 0. Everything that\n  moved the score after eval 2 was therefore representation, in steps of ~0.001.\n\nTHE PIPELINE\n  Four raw quantities (age, rating, delta, vehicle) in a mix of three views -- the raw value, an\n  unordered string, a step code -- plus one coarse conjunction `cell`. `cell` files the imputed\n  and sentinel rows under their own 'u' level, so they stop being read as \"young, highly rated\": that\n  cell averages 21.6 minutes and they average 25.7.\n\nLOG  (identity = 7.32129; published baselines on these folds: TabFM 7.329517, TabFM-Ens 7.313547)\n   2  the 6 informative columns, everything else dropped         7.17701\n   3  denoised context target 5*(y//5)+2                         7.17692  wash then, dropped at 53\n   4  + age_ge30 / rat_bucket step columns                       7.17497\n   5  norm_methods = all five                                    7.17691  worse\n   6  n_feature_crosses='sqrt' / 7 n_svd_features='sqrt'         7.17515 / 7.17800\n   8  max_num_rows=15000 (per-member bagging)                    7.17644  worse\n   9  affine shrink a=0.90                                       7.20039  -> optimum is a=1.0006\n  10  + `both` = is29 & is46                                     7.17479\n  11  outlier_threshold=10                                       7.17482  wash\n  12  aux HistGBR as a 10th column                               7.23819  much worse\n  13  aux HistGBR blended at w=0.30 (w=0.10 at eval 50: 7.17274) 7.17765  worse\n  14  three draws of 90% of the rows (24 members)                7.17491  wash at 3x the cost\n  15  + string copies of age / rating / delta                    7.17454\n  17  + city + Type_of_order                                     7.17469  worse\n  18  + rating x delta / age x rating / vehicle x rating strings 7.17839  worse\n  19  - is29, is46 (redundant once `both` and the strings exist) 7.17448\n  20  norm_methods=['none'] / 21 ['power']                       7.17457 / 7.17479\n  22  permute_categorical=True                                   7.17416  KEPT\n  23  - numeric age+rating / 24 - delta_s / 25 duplicated keys   7.17462 / 7.17509 / 7.17429\n  27  + delta_bucket (3 steps)                                   7.17350\n  28  - `both`                                                   7.17631  worse: it earns its place\n  31  + veh_slow / 32 delta_bucket 4 steps / 34 both             7.17279 / 7.17318 / 7.17267\n  36  + `cell`, the conjunction of the four step codes           7.17158  KEPT\n  38  crosses / 39 norm3 / 40 outlier_threshold=10               7.17262 / 7.17504 / 7.17291\n  41  cell on delta_s / 42 on vehicle / 43 a second coarser cell 7.17341 / 7.17324 / 7.17990\n  44  cell on rating_s / 45 cell + `both`                        7.17607 / 7.17177  worse\n  46  enable_nnls / 47 nnls_beta=1.0 / 54 nnls_beta=0.5          7.17143 / 7.17166 / 7.17134\n  48  - numeric delta / 49 - numeric rating                      7.17403 / 7.17385  both worse\n  51  + rat_lo, delta_far binaries / 52 + rat x delta            7.17271 / 7.17443  worse\n  53  raw target instead of the denoised one                     7.17079  KEPT\n  56  + enable_nnls on the raw target                            7.17013  KEPT -- a wash at eval 46,\n                                                                  a real gain once y is raw\n  58  - permute_categorical / 59 - cell                          7.17160 / 7.17223  both still earn it\n  61  crosses / 62 outlier / 63 binaries / 64 3-step delta       7.17353 / 7.17013 / 7.17080 / 7.17113\n  65  duplicated cell / 66 - vehicle string / 67 finer cell      7.17321 / 7.17156 / 7.17256\n  68  - numeric age / 69 three 90% draws                         7.17220 / 7.17053\n  70  cell marks the imputed rows 'u'                            7.16938\n  71  cell marks the imputed *and* sentinel rows 'u'             7.16896  KEPT = this pipeline\n  74  also blank the strings / 75 the numerics / 76 the codes    7.16996 / 7.16989 / 7.17348\n  77  blank all three / 78 cell on delta_far                     7.17168 / 7.17112  worse\n  79  cell splits rating 5.0 out / 80 5-step delta / 81 also 4.5 7.16993 / 7.17193 / 7.17057\n  82  79 and 80 together / 83 cell on 4-level vehicle            7.17046 / 7.17173  worse\n  84  - `both` / 85 - the four step codes / 86 feat_shuffle=none 7.16909 / 7.16940 / 7.16997\n  87  eval 71 rewritten clean, dead blend machinery removed     7.16896  (reproduced exactly)\n  88  - age_s                                                    7.16854  KEPT = this pipeline\n  89  - rating_s instead / 92 - both of them                     7.16868 / 7.17016\n  90  nnls_beta=0.85 / 91 outlier_threshold=2.0                  7.16898 / 7.16916\n  93  (this) eval 88 with the log written up; 7.16854 is 2.1% below the identity pipeline's 7.32129\n      and 2.0% below the published TabFM-Ensemble baseline of 7.313547 on these folds.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'permute_categorical': True, 'enable_nnls': True}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _feat(df):\n  out = pd.DataFrame(index=df.index)\n  rlat = df['Restaurant_latitude'].astype(float).abs()\n  dlat = df['Delivery_location_latitude'].astype(float).abs()\n  rlon = df['Restaurant_longitude'].astype(float).abs()\n  dlon = df['Delivery_location_longitude'].astype(float).abs()\n  # the two deltas agree to 1e-6; average them and round the float noise off\n  delta = ((dlat - rlat) + (dlon - rlon)).abs() / 2.0\n  age = df['Delivery_person_Age'].astype(float)\n  rat = df['Delivery_person_Ratings'].astype(float)\n\n  out['age'] = age\n  out['rating'] = rat\n  out['delta'] = delta.round(2)\n  out['vehicle'] = df['Type_of_vehicle'].fillna('').astype(str).str.strip()\n  out['both'] = ((age == 29) & (rat == 4.6)).astype(np.int8)\n\n  # step codes: the drivers are plateaus with hard edges, and the numeric normalisation TabFM\n  # applies before attending smears an edge that a code states outright\n  out['age_ge30'] = (age >= 30).astype(np.int8)\n  out['rat_bucket'] = np.select([rat < 3.95, rat < 4.45], [0, 1], default=2).astype(np.int8)\n  out['delta_bucket'] = np.select(\n      [out['delta'] < 0.025, out['delta'] < 0.035, out['delta'] < 0.045, out['delta'] < 0.065],\n      [0, 1, 2, 1], default=3).astype(np.int8)   # 0.04 (25.5 min) sits above 0.05/0.06 (23.9), 9 sigma\n  out['veh_slow'] = out['vehicle'].isin(['motorcycle', 'bicycle']).astype(np.int8)\n\n  # unordered views: neither is monotone (rating 5.0 -> 25.5 min against 4.8 -> 23.9, delta 0.04\n  # above 0.05), so let TabFM keep neighbouring levels apart. The same view of `age` is *not* here:\n  # age is flat inside each plateau, so its 22 levels were 22 ways to overfit (eval 88).\n  out['rating_s'] = rat.round(1).astype(str)\n  out['delta_s'] = out['delta'].astype(str)\n\n  # one coarse conjunction, 48 levels at ~630 rows each. Rows whose person record is imputed or\n  # sentinel get their own level rather than being filed as young-and-highly-rated.\n  unknown = (out['both'].to_numpy() == 1) | np.isin(age.to_numpy(), [15, 50])\n  age_st = np.where(unknown, 'u', out['age_ge30'].astype(str))\n  rat_st = np.where(unknown, 'u', out['rat_bucket'].astype(str))\n  out['cell'] = (out['delta_bucket'].astype(str) + out['veh_slow'].astype(str)\n                 + pd.Series(age_st, index=out.index) + pd.Series(rat_st, index=out.index))\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  return _feat(X_train), _feat(X_test)\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# Food_Delivery_Time — TabFM over four quantities, encoded as steps\n\n## What the pipeline does\n\nThe task is to predict `Time_taken(min)` (RMSE, lower better) for 15,151 deliveries from 30,300\ntraining rows. The pipeline's premise, established from the training data alone, is that almost none\nof the 11 raw columns carry signal. The target is `5*bucket + Uniform{0..4}` — `y % 5` is exactly\nuniform, so roughly 2.0 of the 87.7 total variance is irreducible label noise and the only\npredictable object is the bucket. The geography collapses too: `Delivery_location_lat/lon` equals\n`Restaurant_lat/lon` plus a delta that is identical in both axes to 1e-6 and takes only twelve\ndistinct values, always positive, so direction is never recoverable and the whole four-column\ncoordinate block reduces to that one quantised scalar — which beats both the haversine distance it\nimplies and the raw columns, partly because 8% of rows have (0,0) coordinates where the delta\nsurvives and a distance does not. Absolute position, the city prefix, `Type_of_order`, the 1320-level\ndelivery-person ID, out-of-fold target encodings of restaurant/city/person, and every unsupervised\ncount tried (rows per person, per restaurant, per coordinate; deliverers per restaurant; distance\nfrom the city centroid) all scored at or below the base. Row order carries nothing.\n\nThat leaves four quantities — courier age, courier rating, the delta, and vehicle type — and each\nacts as a **step, not a slope**: age <30 averages ~23 min against ~29.4 for >=30 and is flat inside\neach plateau; rating splits at 3.95 and 4.45; motorcycle/bicycle ~27.6 against\nscooter/electric_scooter ~24.4. So each is handed to TabFM in a mix of views — the raw numeric value,\nan unordered string (for rating and delta, whose levels are not monotone: rating 5.0 is slower than\n4.8, delta 0.04 slower than 0.05), and an explicit step code — because the normalisation TabFM\napplies to numeric columns before attending smears an edge that a code states outright. Age gets no\nstring view: it is flat within each plateau, so its 22 levels were 22 ways to overfit. On top sits one\ncoarse conjunction, `cell` (48 levels, ~630 rows each), of the four step codes. `cell` also carries\nthe data-quality repair: the ~1450 rows with `age==29 & rating==4.6` are a median-imputed courier\nrecord (their overlap is 3x what independence predicts, and they average the unconditional mean of\n25.7 rather than the 21.6 of the cell they would otherwise land in), and age 15 / age 50 are\nsentinels; all of these get their own `'u'` level instead of being read as young-and-highly-rated.\nA separate `both` flag marks the imputed pair for the model directly.\n\nThe prediction itself is a single frozen TabFM pass over these nine columns with\n`permute_categorical=True` and `enable_nnls=True`; no blending, no shrinkage, no auxiliary model.\nThose were all tried and rejected: an affine shrink probe puts the optimum at 1.0006, HistGBR and\nridge-on-interactions errors correlate at 0.988 with a best blend weight of 0, and the 102 exactly\nduplicated feature rows bound the within-duplicate variance at 60.2 (95% CI [47, 79]) against the\npipeline's MSE of 51.4 — there is no feature left to find. Local 3-fold CV RMSE 7.16854; test 7.17355,\n2.0% below the published TabFM-Ensemble baseline of 7.313547 on these folds and better than both\nbaselines.\n\n## What build.sh builds\n\nNothing — it prints one line and exits 0. `pipeline.py` opens no file and names no cache; every\ncolumn it uses is computed inside `_feat()` from the raw dataframes the judge passes in. There is\nno `final/build/` either: the run left no helper script behind, because all the analysis behind the\nconstants above was done in throwaway shell heredocs and its conclusions are the constants. Runtime\nis instant, disk is zero.\n\nThe full reproduction is still the documented two commands:\n\n    cd <this workspace> && bash final/build.sh && python final/run.py\n\n`run.py` needs the competition data under `data/` and a GPU for TabFM. The scored run took ~209 s end\nto end (about 76 s fit, 120 s predict across 9 TabArena folds).\n\n## Things a reader would otherwise get wrong\n\n- **`.aux_pred.npz` in the workspace root is dead.** It holds auxiliary HistGBR predictions from the\n  rejected blend at evals 12/13/50; the machinery was removed at eval 87 and `pipeline_093` never\n  reads it. `build.sh` deliberately does not regenerate it.\n- **`delta` is a rounded scalar, not a distance.** `_feat` averages the latitude and longitude deltas\n  (they agree to 1e-6) and rounds to 2 dp to kill float noise. The rounding is load-bearing: it is\n  what makes the twelve levels line up, and what makes `delta_s` a usable 12-level string.\n- **`delta_bucket` is not monotone by design.** Its `np.select` maps the 0.045–0.065 band back to\n  code `1`, because delta 0.04 (25.5 min) sits nine sigma above 0.05/0.06 (23.9). This looks like a\n  typo and is not.\n- **The step thresholds and the `'u'` markers are fitted to this training set**, not general domain\n  facts. On different data the plateau edges (3.95/4.45, age 30) and the imputation signature\n  (29 / 4.6, 15, 50) would have to be re-derived.\n- **The docstring LOG is the real experiment record**, including the rejected branches, and the\n  history of what produced it is in `history/pipeline_0NN.py` and `log.txt`. Deltas after eval 2 are\n  in the third decimal place; the fold-to-fold spread is much larger than most of them, so no single\n  late line should be read as significant on its own.\n","package":[],"derivations":[]},{"id":"GiveMeSomeCredit","name":"GiveMeSomeCredit","short_name":"GiveMeSomeCredit","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.131293,"plain_note":null,"n_train":100000,"n_test":50000,"n_folds":9,"thresholds":null,"summary":"A frozen TabFM predicts credit default by in-context learning over the raw training rows; the pipeline around it is deliberately thin. Two of the ten original columns are repaired before the model sees them.","score":0.130499,"gain_pct":0.604754,"medal":null,"category":"II","lines":127,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["preprocess","engineer"],"tabfm_kwargs":{"norm_methods":"['quantile', 'quantile_rtdl']","average_logits":"False"},"helper_functions":["_clean"],"helper_ranges":{"_clean":[105,115]},"hook_helpers":{"preprocess":[],"engineer":["_clean"],"postprocess":[]},"hook_ranges":{"preprocess":[94,102],"engineer":[118,123],"postprocess":[126,127]},"code":"\"\"\"GiveMeSomeCredit -- TabFM pipeline. Metric 1-auc, lower is better.\n\nIdentity pipeline 0.13403 -> this one 0.13305. Four changes survived; everything else was\ntried and rejected. Eval 61 is this file, unchanged from eval 54 except that NNLS is off\nagain (0.13309 with it, 2.5x the time).\n\nWHAT IS HERE\n\n1. norm_methods = ['quantile', 'quantile_rtdl'] (0.13403 -> 0.13366 for the first four\n   methods, then 0.13317 -> 0.13309 for dropping the parametric two, confirmed a second\n   time at 0.13318 vs 0.13308 on the bagged base). The default cycle is ['none','power'];\n   with columns like RevolvingUtilization (max 50708) and DebtRatio (max 326442) the\n   rank-based transforms are the ones worth spending members on. Both of them, though --\n   eight quantile members alone score 0.13348.\n2. average_logits=False, i.e. average probabilities, not logits (0.13363 -> 0.13354, and\n   still ahead by 0.00003 at the end).\n3. max_num_rows below the row count, so the eight members bag rather than share one\n   context (0.13309 -> 0.13305, and 0.13297 for the one-row-larger context this exact rule\n   resolves to -- the two differ by a single context row, which is a good measure of what\n   0.00008 is worth here). It is resolved from the training set's size, because the search\n   fits 66.7k rows per fold and the final fits 100k. Three bracketed sweeps, each on a\n   seeded subsample of the fold so that only n changes:\n       44444 rows   0.6 -> 0.13382   0.7 -> 0.13368   0.8  -> 0.13384\n       55555 rows   0.76 -> 0.13345  0.8 -> 0.13329   0.84 -> 0.13341\n       66666 rows   0.7 -> 0.13323   0.8 -> 0.13305   0.84 -> 0.13307   0.9 -> 0.13314\n   The optimum climbs from 0.7 at 44k and then sits at 0.8 for both larger sizes, so the\n   fraction plateaus rather than continuing to rise, and 0.8 is what the final gets: 80000\n   of its 100000 rows per member. (The two-point version of this read the optima at 44k and\n   66.7k as a constant 13333 rows held out, which fits both and would have asked for 86667\n   at the final; the 55555-row sweep is what rules it out -- 13333 held out there is a 0.76\n   fraction and scored 0.00016 worse than 0.8. The eval this file's score is inherited\n   from, 65, predates that sweep and carries the constant-holdout rule, which on the CV\n   folds is the same model to the row and only differs in what it asks for at the final,\n   where the 66.7k curve puts the gap at about 0.00006.)\n4. Two feature repairs, together 0.13345 -> 0.13317:\n   - DebtRatio is a debt-to-income ratio for the 80% of rows with a MonthlyIncome and a\n     dollar amount for the 20% without (median 1149 against 0.30). The dollar rows are\n     mapped through their own ECDF onto the ratio branch's quantiles so the column is one\n     ordering again. Removing this costs 0.00016.\n   - income_missing. TabFM's numeric block is a plain SimpleImputer, so a NaN becomes the\n     column mean and missingness never reaches the model; for a fifth of the rows that is\n     worth restoring. Removing it costs 0.00017, the largest single feature effect here.\n\nWHAT WAS TRIED AND IS NOT HERE\n\nContext composition is by far the most sensitive thing in this pipeline, and only one of\nthe ways to change it helped. Oversampling the positives 3x inside the context scored\n0.19498 against 0.13349 -- duplicated context rows are poison. Averaging two draws of a\nrandom 80% cost 0.0005; the same 80% subsampling *within* the eight members gained,\nbecause eight bagged members are worth what two are not. Dropping to 60% of the rows, or\nto a 32768-row context, both cost about 0.0002.\n\nFeatures: seven attempts, two survived. Adding columns loses whenever the column is\nsomething TabFM can already compute -- a delinquency total 0.00038, feature crosses\n0.00015-0.00024, SVD components 0.00016, ratios and logs and debt-in-dollars 0.0002 as a\nbundle. Dropping columns loses too (NumberOfDependents 0.00034), so the ten originals are\nright and the eleventh has to be information the imputer destroyed. Not every such bit\npays: dependents_missing covers 2.6% of rows and cost 0.00016. Repairs that look\nprincipled and are not: the 96/98 not-available codes in the delinquency counters belong\nat the top of those columns, where the raw values already put them, and NaN-ing them costs\n0.00008 by sending a group that defaults at 51% to the mean; the same for\nRevolvingUtilization >= 13 (0.00008) and for giving the no-income rows an imputed income\nof their own (0.00024).\n\nKnobs: NNLS 0.0002 (twice, before and after bagging), Platt calibration bit-identical for\n47% more time, feature crosses and SVD rejected under both ensembles, class_shift and\nfeat_shuffle_method both worth keeping at their defaults, and outlier_threshold and\nsoftmax_temperature flat to five decimals across 2.5-8.0 and 0.6-1.2.\n\nMeasurement notes: the judge is exactly deterministic, so paired differences are real\ndifferences in the model rather than run-to-run noise -- but a change that alters the\ncolumn count or the normalisation order also reshuffles which config each member draws,\nand two runs 333 context rows apart differ by 0.00004, so 0.00005 is the floor below which\na difference means nothing. Fold spread is 0.0033, an order of magnitude above that, so\nthe per-fold signs matter more than the mean.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]   OPTIONAL\n  postprocess(pred, y_orig, X_test)     -> pred\n  TABFM_KWARGS                          -> constructor knobs\n  folds(X_train, y_train)               -> OPTIONAL custom CV splits\n\"\"\"\nimport numpy as np\n\nCONTEXT_FRACTION = 0.8   # of the training rows, per member; see (3) in the docstring\n\nTABFM_KWARGS = {\n    'norm_methods': ['quantile', 'quantile_rtdl'],\n    'average_logits': False,\n}\n\n\ndef preprocess(X_train, y_train, X_test):\n  # Each member subsamples max_num_rows of the training rows, so this sets how much two\n  # members' contexts overlap and hence how much they disagree. Resolved here rather than\n  # written as a constant because the judge reads TABFM_KWARGS after the pre-hooks return,\n  # and a CV fold holds 66.7k rows against the final's 100k -- see (3) in the docstring for\n  # the two sweeps that say the right invariant is the count held out, not the fraction.\n  n = len(X_train)\n  TABFM_KWARGS['max_num_rows'] = n - int((1.0 - CONTEXT_FRACTION) * n)\n  return X_train, y_train, X_test\n\n\ndef _clean(x, mapping):\n  x = x.copy()\n  mi_na = x['MonthlyIncome'].isna()\n  # DebtRatio holds a ratio where MonthlyIncome is known and dollars where it is not; the\n  # dollar rows go onto the ratio branch's quantiles so the column is one ordering again.\n  src, dst = mapping\n  x.loc[mi_na, 'DebtRatio'] = np.interp(\n      x.loc[mi_na, 'DebtRatio'].to_numpy(float), src, dst)\n  # TabFM mean-fills numeric NaNs, so missingness has to become a column of its own.\n  x['income_missing'] = mi_na.astype(np.int8)\n  return x\n\n\ndef engineer(X_train, y_train, X_test):\n  mi_na = X_train['MonthlyIncome'].isna()\n  src = np.sort(X_train.loc[mi_na, 'DebtRatio'].to_numpy(float))\n  ratios = np.sort(X_train.loc[~mi_na, 'DebtRatio'].to_numpy(float))\n  dst = np.quantile(ratios, (np.arange(len(src)) + 0.5) / len(src))\n  return _clean(X_train, (src, dst)), _clean(X_test, (src, dst))\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# GiveMeSomeCredit — final pipeline\n\n## What it does\n\nA frozen TabFM predicts credit default by in-context learning over the raw training rows; the\npipeline around it is deliberately thin. Two of the ten original columns are repaired before the\nmodel sees them. `DebtRatio` is not one variable: for the ~80% of rows that report a\n`MonthlyIncome` it is a debt-to-income ratio, and for the rest it is a dollar amount (median 1149\nagainst 0.30), so the dollar rows are pushed through their own ECDF onto the ratio branch's\nquantiles and the column becomes a single ordering again. Separately, TabFM's numeric front end is\na plain mean-imputer, so a missing `MonthlyIncome` would otherwise vanish entirely; an explicit\n`income_missing` indicator restores it. No columns are added or dropped beyond that — every other\nengineered feature tried (delinquency totals, crosses, SVD components, log/ratio bundles) lost.\nOn the model side, the eight ensemble members cycle only the two rank-based normalisations\n(`quantile`, `quantile_rtdl`) instead of the default `none`/`power`, member outputs are averaged as\nprobabilities rather than logits, and `max_num_rows` is set to 80% of the training rows so the\nmembers bag distinct contexts rather than all sharing one. CV metric `1-auc` (lower better): the\nidentity pipeline scores 0.13403, this one 0.13305.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that exits 0. The pipeline reads no cache, index or\nprecomputed feature file — everything it needs is derived from the training DataFrame on each\ncall — and the run produced no helper scripts, so `final/build/` is absent by design. Zero extra\ndisk, zero build time.\n\n    bash final/build.sh && python final/run.py\n\nThe single run is one TabFM pass with 8 estimators over 100k training rows; it needs a GPU and\ntakes on the order of minutes, not hours.\n\n## Things a reader could get wrong\n\n- **`max_num_rows` is computed, not fixed.** `preprocess` sets it from `len(X_train)`, because a CV\n  fold holds ~66.7k rows while the final fit sees 100k, and the tuned invariant is the *fraction*\n  (0.8), not a constant row count. Change `CONTEXT_FRACTION`, not the resolved number. This also\n  means the pipeline mutates the module-level `TABFM_KWARGS` dict at call time — the judge reads it\n  after the pre-hooks return, which is why that works.\n- **The ECDF mapping is fit on train and applied to both splits.** `engineer` derives `src`/`dst`\n  from the training rows only and reuses them for the test rows, so there is no leakage and test\n  rows outside the training range clamp at the endpoints (`np.interp` behaviour, intended).\n- **The 96/98 codes in the delinquency counters are left alone.** They look like not-available\n  sentinels and NaN-ing them is tempting, but that group defaults at ~51%, and sending it to the\n  column mean cost 0.00008. Same for `RevolvingUtilization >= 13`.\n- **Resolution floor.** The judge is deterministic, so paired diffs are real, but any change to the\n  column count or normalisation order reshuffles which config each member draws; differences below\n  ~0.00005 are meaningless. Fold spread is ~0.0033.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` (refusing if the two differ)\n  because the judge loads the hooks by that path.\n","package":[],"derivations":[]},{"id":"hazelnut-spread-contaminant-detection","name":"hazelnut-spread-contaminant-detection","short_name":"hazelnut-spread-contaminant-detection","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.002297,"plain_note":null,"n_train":1600,"n_test":800,"n_folds":30,"thresholds":null,"summary":"The task is 1600 training rows × 30 numeric sensor readings (`s<i><j>`, the off-diagonal of a 6×6 transmission matrix between six sensors), scored as 1−AUC, lower better. The pipeline hands that table to TabFM essentially untouched and spends its whole budget on TabFM's own ensembling.","score":0.002119,"gain_pct":7.749238,"medal":null,"category":"II","lines":89,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["engineer","folds"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile', 'quantile_rtdl', 'robust']","n_feature_crosses":"'sqrt'","outlier_threshold":"3.0"},"helper_functions":["_plain"],"helper_ranges":{"_plain":[70,73]},"hook_helpers":{"preprocess":[],"engineer":["_plain"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[46,47],"engineer":[53,67],"postprocess":[76,77],"folds":[80,89]},"code":"\"\"\"Hazelnut-spread contaminant detection -- 1600 x 30 numeric sensor readings, metric 1-AUC.\n\nThe columns are s<i><j> for i != j in 1..6: the off-diagonal of a 6x6 transmission matrix between\nsix sensors.  Two findings shaped this pipeline.\n\n1. The raw table is already the right thing to hand TabFM.  Every alternative representation was\n   measured and every one lost: symmetric/antisymmetric pair combinations (+0.0004), row/column\n   sums, Frobenius norm and singular values (+0.0010), row-normalised features (+0.0009), a PCA\n   rotation (+0.0009), a second copy of every column (+0.0007), the top 20 columns by mutual\n   information (+0.0031).  Rows are equally untouchable: dropping the 20 training rows an SVM\n   contradicts most costs +0.0017, dropping 60 costs +0.0041, and jittered or mixup context rows\n   cost +0.0017 and +0.0068.  Every row sits on the decision surface and every column carries part\n   of it; nothing here is noise to be cleaned away.\n\n2. Classical models plateau near 1-auc 0.025 (SVC 0.025, MLP 0.025, HGB 0.033, logistic 0.046)\n   while TabFM sits at 0.0016, so there is nothing worth stacking on top of it either.  What is\n   left is TabFM's own ensembling, and with feat_shuffle_method inert whenever feature crosses are\n   on (that branch of EnsembleGenerator builds its own permutations and never consults the flag)\n   the members differ only by normalisation, class shift and crosses.  Widening norm_methods from\n   the default tw
