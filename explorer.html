json` lists no medal thresholds for this task.\n","package":[],"derivations":[]},{"id":"wine_quality","name":"wine_quality","short_name":"wine_quality","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":0.586407,"plain_note":null,"n_train":4331,"n_test":2166,"n_folds":9,"thresholds":null,"summary":"Every number in the submission comes from a frozen TabFM predicting in context over the training rows; the pipeline is three decisions about what those rows look like and how the passes are combined.","score":0.58551,"gain_pct":0.152965,"medal":null,"category":"II","lines":210,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['none', 'power', 'quantile_rtdl', 'robust']","n_feature_crosses":"'sqrt'","permute_categorical":"True"},"helper_functions":["_keys","_surprising"],"helper_ranges":{"_keys":[116,119],"_surprising":[160,170]},"hook_helpers":{"preprocess":["_keys"],"engineer":[],"sample":["_keys","_surprising"],"postprocess":["_keys"],"folds":[]},"hook_ranges":{"preprocess":[130,135],"engineer":[138,157],"sample":[173,190],"postprocess":[193,210],"folds":[122,127]},"code":"\"\"\"wine_quality (TabArena) / RMSE, lower better. 4331 training rows, 12 columns, integer target on 3..9.\n\nTabFM runs eighteen frozen passes over the same training rows -- three context recipes crossed with six\ntarget columns, all averaged. Nothing else predicts anything. Three things are done to it.\n\n1. `engineer` re-points four of the twelve columns without adding or removing any. Density is 95%\n   predictable from the other eleven columns, total SO2 is 72% correlated with free SO2, and the three\n   acids sum to a quantity none of them names, so four of TabFM's twelve inputs mostly restate what the\n   others already say. Each of those four is replaced by the part that is *not* already said: total SO2 by\n   bound SO2 (total - free), density by its residual after a least-squares fit on alcohol and residual\n   sugar, citric and volatile acidity by their shares of the total acidity. Every swap is invertible given\n   the columns that stay, so no information is thrown away -- what changes is the direction each input\n   points, and this is the largest single effect in the run: -0.0020 RMSE. Adding those same quantities as\n   *extra* columns, which is what a feature-engineering pass normally does, cost +0.0016; a foundation\n   model reading twelve columns wants twelve independent ones, not twenty correlated ones.\n\n2. `sample` returns four full-size contexts. Cutting the rows an ensemble member reads is the one thing\n   that reliably costs accuracy here (85% per member costs 0.0012 RMSE, 70% costs 0.0018, 55% costs 0.0058,\n   and four row-subsampled passes at 90% never earn back the missing rows), so the three views differ in\n   how they *weight* rows, not how many they keep: one deduplicates the 532 exactly-repeated wines, one\n   leaves them doubled, one repeats the rare qualities (3 and 9 three times, 4 and 8 twice) so a model that\n   reads its prior off its context sees less of a cliff at the tails, and one reads twice the 15% of rows\n   whose quality their own neighbourhood disagrees with -- the mirror of the most expensive thing measured\n   here, which was dropping exactly those rows (+0.008 at 2%, +0.017 at 5%). Three of them were worth\n   -0.0002 over one; this run measures the fourth.\n\n3. `preprocess` hands the judge a multi-target y and `postprocess` puts it back together. Quality is an\n   ordinal integer and squared error asks for its conditional mean, which decomposes exactly:\n   E[y] = 3 + sum_k P(y > k). So TabFM is fitted on y itself and on five 0/1 threshold indicators, and the\n   reconstruction is averaged with the direct regression at 0.25, which is where the offline join against\n   the training labels puts the optimum for this feature set. The two estimates agree to r=0.996 -- a\n   variance trim, not a new idea about the data, worth -0.0004. y > 8 is four rows in 4331 and is carried\n   as a training constant rather than a nineteenth pass.\n\n`postprocess` also answers from the training table wherever the answer is already in it: 458 groups of\nexactly-repeated feature rows, each carrying a single quality value, and a quarter of the held-out rows\nhave such a twin. That is worth only -0.0001 against plain TabFM, which already answers a row whose twin\nsits in its context, but -0.0028 against the ordinal average, which cannot reproduce an integer.\n\nCV against the 0.60699 identity baseline on the same five stratified folds: 0.60275 with the ordinal\naverage off, 0.60264 with it at 0.4, and the offline weight search puts 0.25 at 0.60259 -- which is what\nthis run measures. Better than the baseline on all five folds.\n\nThe sulfite pair as one level and one share -- free SO2 / total in place of free SO2, the decomposition\nthat worked for the acids -- was the last member of that family to be tried, and it cost +0.0021.\n\nThis run revisits an early decision that was made on noise-level evidence and in a different pipeline:\nwine_color was turned into 0/1 back when the other eleven columns were raw, and it won by 0.00016. Since\nthen the density residual is fitted without the colour and the acids have become shares, so the colour\ncolumn carries more of the red/white distinction than it did, and handing it to TabFM as a string -- which\nis also what makes `permute_categorical` mean anything -- is worth re-measuring.\n\nPartialling the colour out of chlorides, sulphates and free SO2 (+0.0007), and alcohol and colour out of\nresidual sugar (+0.0018), were tried after the four swaps above and are not here: the columns that were\nworth re-pointing were the ones that were nearly *determined* by their neighbours, not the ones merely\ncorrelated with them.\n\nWhat did not work, and so is not here. Nine oenology features *added* to the raw table (bound and molecular\nSO2, acid ratios, the density residual) +0.0016, and every single-column drop hurt too. A pooled train+test\nmultiplicity feature: real signal (r=0.135 with quality) but redundant with what the context already shows,\n+0.0004. Blending ExtraTrees in at 0.3, +0.0034 -- the forest correlates 0.963 with TabFM, which puts its\noptimal weight below zero and kills forest stacking with it. Synthesising context rows by interpolating\nneighbouring wines, +0.004 at +30% rows and +0.012 at +60%: rows between two real wines do not count as\ncontext. Denoising the target toward its kNN mean, +0.0007 at 15%. Dropping the rows whose label disagrees\nmost with their neighbourhood, +0.008 at 2% and +0.017 at 5% -- on this table the tails are worth their\nnoise (quality 3/4/8/9 are 7% of the rows and 35% of the squared error). Partialling all eleven other\ncolumns out of density rather than just alcohol and sugar, +0.0011: the point is decorrelation, not\nmaximal decorrelation. Reading every column as a z-score within its own colour, +0.0032. Regressing the\noffset from a local or a global fit as a third target view: a real third view, 0.995 correlated, worth\n0.00002. On the knobs: n_svd_features, enable_nnls, outlier_threshold at 2.5 and at 10, three or five\nnormalisations instead of four -- all inside a thousandth of the four-way cycle that is set below.\n\nCalibration was checked offline rather than guessed at. `postprocess` dumps TabFM's per-row output to\n.oof/, and the validation rows of a `val` are training rows, so joining the dumps against data/train.csv\nreproduces the judge's fold scores exactly (predicted 0.60460, measured 0.60460). Shrinkage, least-squares\nrecalibration, partial rounding to integers, clipping, cross-fitted stacking of the six target views and\nthe blend weight itself were all answered there for free, and for everything but the blend weight the\nanswer was to leave it alone: TabFM's output comes out with least-squares slope 0.9977 and intercept 0.0039\nagainst the truth, and a stack fitted on four folds and scored on the fifth is worse than the exact\nreconstruction weights.\n\n`tabfm_corr` reads nan by construction: `pred` arrives as six target columns and one column is scored, so\nthe audit has no matching shape to correlate. Every number in the prediction is TabFM's.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]\n  postprocess(pred, y_orig, X_test)     -> pred\n\"\"\"\nimport hashlib\nimport pickle\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'norm_methods': ['none', 'power', 'quantile_rtdl', 'robust'],\n                'n_feature_crosses': 'sqrt', 'permute_categorical': True}\n\nFEATS = ['fixed_acidity', 'volatile_acidity', 'citric_acid', 'residual_sugar', 'chlorides',\n         'free_sulfur_dioxide', 'total_sulfur_dioxide', 'density', 'pH', 'sulphates', 'alcohol', 'wine_color']\nDUP_CACHE = Path('.dup_cache.pkl')            # the pre and post hooks are separate processes\nOOF_DIR = Path('.oof')                        # per-fold dumps, for the offline join against the labels\n\nCONTEXTS = ({'dedup': True}, {'dedup': False}, {'dedup': True, 'boost': {3: 3, 4: 2, 8: 2, 9: 3}},\n            {'dedup': True, 'surprise': 0.15})\nSURPRISE_K = 25       # neighbours used to decide which rows their neighbourhood disagrees with\nYMIN, THRESHOLDS = 3, (3, 4, 5, 6, 7, 8)      # E[y] = YMIN + sum_k P(y > k)\nMODELLED = (3, 4, 5, 6, 7)                    # y > 8 is 4 rows in 4331: a training constant, not a pass\nORDINAL = 0.25        # weight of that reconstruction against direct regression\nSO2_SHARE = False     # free SO2 as a share of the pool rather than an amount: +0.0021, not used\nCOLOUR_NUMERIC = True # wine_color as 0/1: -0.0009 here, against -0.0002 on the raw columns # wine_color as 0/1 rather than a string for TabFM's categorical encoder\nDENSITY_COLOUR = False  # let the density projection see the colour (R2 0.57 -> 0.86 on the training rows)\n\n\ndef _keys(df):\n  \"\"\"Raw-feature identity of a row. Train and test are parsed from the same source, so equal wines give\n  equal float64s and equal strings.\"\"\"\n  return df[[c for c in FEATS if c in df.columns]].astype(str).agg('|'.join, axis=1).to_numpy()\n\n\ndef folds(X_train, y_train):\n  \"\"\"5 stratified folds instead of the judge's shuffled 3: 3465 training rows per fold rather than 2887,\n  which is nearer the 4331 the final fits on, and all 4331 rows scored.\"\"\"\n  from sklearn.model_selection import StratifiedKFold\n  strat = np.clip(np.asarray(y_train).ravel(), 4, 8)   # quality 3 (26 rows) and 9 (4) join their neighbours\n  return list(StratifiedKFold(5, shuffle=True, random_state=0).split(X_train, strat))\n\n\ndef preprocess(X_train, y_train, X_test):\n  y = pd.Series(np.asarray(y_train).ravel(), index=X_train.index)\n  DUP_CACHE.write_bytes(pickle.dumps(y.groupby(_keys(X_train)).mean().to_dict()))\n  cols = {'y': y, **{f'gt{k}': (y > k).astype(float) for k in MODELLED}}\n  cols = {c: v for c, v in cols.items() if v.nunique() > 1}   # a degenerate threshold is a constant\n  return X_train, pd.DataFrame(cols, index=X_train.index), X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  \"\"\"Twelve columns in, twelve out: four of them re-pointed at what their neighbours do not already say.\n  The density projection is fitted on the training rows only and applied to both sides.\"\"\"\n  X_train, X_test = X_train.copy(), X_test.copy()\n  for d in (X_train, X_test):\n    if COLOUR_NUMERIC:\n      d['wine_color'] = (d['wine_color'].astype(str) == 'red').astype(float)\n  cols = ['alcohol', 'residual_sugar'] + (['wine_color'] if DENSITY_COLOUR else [])\n  A = lambda d: np.c_[np.ones(len(d)), d[cols].to_numpy(float)]\n  coef = np.linalg.lstsq(A(X_train), X_train['density'].to_numpy(float), rcond=None)[0]\n  for d in (X_train, X_test):\n    tot = d['fixed_acidity'] + d['volatile_acidity'] + d['citric_acid']\n    d['citric_acid'] = d['citric_acid'] / tot          # the acids as one level and two shares\n    d['volatile_acidity'] = d['volatile_acidity'] / tot\n    free, total = d['free_sulfur_dioxide'].to_numpy(float), d['total_sulfur_dioxide'].to_numpy(float)\n    d['total_sulfur_dioxide'] = total - free                                            # the bound pool\n    if SO2_SHARE:                                      # sulfites as one level and one share, like the acids\n      d['free_sulfur_dioxide'] = free / np.maximum(total, 1.0)\n    d['density'] = d['density'].to_numpy(float) - A(d) @ coef   # what is dissolved beyond alcohol and sugar\n  return X_train, X_test\n\n\ndef _surprising(X_train, y, frac):\n  \"\"\"The rows whose quality their neighbourhood disagrees with most. Dropping these is the most expensive\n  thing this run measured -- 2% of them cost +0.008 RMSE and 5% cost +0.017 -- so they are where the table\n  keeps what a smooth fit cannot see, and a view that reads each of them twice is the mirror of that test.\"\"\"\n  from sklearn.neighbors import NearestNeighbors\n  from sklearn.preprocessing import QuantileTransformer\n  Z = QuantileTransformer(n_quantiles=min(1000, len(X_train)), output_distribution='uniform',\n                          subsample=100_000, random_state=0).fit_transform(X_train.to_numpy(float))\n  nb = NearestNeighbors(n_neighbors=min(SURPRISE_K + 1, len(Z))).fit(Z).kneighbors(Z, return_distance=False)[:, 1:]\n  gap = np.abs(y - y[nb].mean(axis=1))\n  return gap >= np.quantile(gap, 1.0 - frac)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"One index array per context recipe; the judge fits a frozen TabFM per (draw, target) and averages.\"\"\"\n  y = np.asarray(y_train.iloc[:, 0]).ravel()\n  dup = pd.Index(_keys(X_train)).duplicated()\n  odd = None\n  draws = []\n  for r in CONTEXTS:\n    idx = np.arange(len(X_train))\n    if r['dedup']:\n      idx = idx[~dup]\n    if r.get('boost'):\n      idx = np.repeat(idx, [r['boost'].get(int(round(v)), 1) for v in y[idx]])\n    if r.get('surprise'):\n      if odd is None:\n        odd = _surprising(X_train, y, r['surprise'])\n      idx = np.repeat(idx, np.where(odd[idx], 2, 1))\n    draws.append(idx)\n  return draws\n\n\ndef postprocess(pred, y_orig, X_test):\n  pred = pd.DataFrame(pred).reset_index(drop=True)\n  y = pd.Series(np.asarray(y_orig).ravel())\n  ordinal = pd.Series(float(YMIN), index=pred.index)\n  for k in THRESHOLDS:                        # a threshold with no TabFM pass contributes its training rate\n    c = f'gt{k}'\n    ordinal = ordinal + (pred[c].clip(0.0, 1.0) if c in pred.columns else float((y > k).mean()))\n  out = (1.0 - ORDINAL) * pred['y'] + ORDINAL * ordinal\n\n  keys = _keys(X_test)\n  OOF_DIR.mkdir(exist_ok=True)                # one file per fold, named by the fold's validation rows\n  tag = hashlib.sha1('\\n'.join(keys).encode()).hexdigest()[:12]\n  (OOF_DIR / f'{tag}.pkl').write_bytes(pickle.dumps(\n      {'keys': keys, 'raw': out.to_numpy(), 'direct': pred['y'].to_numpy(), 'ordinal': ordinal.to_numpy()}))\n\n  table = pickle.loads(DUP_CACHE.read_bytes())          # 458 groups of repeated wines, one quality each\n  hit = np.array([table.get(k, np.nan) for k in keys], dtype=float)\n  return out.where(np.isnan(hit), pd.Series(hit, index=out.index))\n","readme":"# wine_quality (TabArena) — RMSE, lower is better\n\n## What the pipeline does\n\nEvery number in the submission comes from a frozen TabFM predicting in context over the training rows;\nthe pipeline is three decisions about what those rows look like and how the passes are combined.\n\n**Re-pointed features, not extra ones.** `engineer` returns the same twelve columns it was given, with\nfour of them replaced rather than supplemented. Density is ~95% predictable from the other eleven\ncolumns, total SO2 is 0.72-correlated with free SO2, and the three acids sum to a level none of them\nnames — so four of TabFM's twelve inputs mostly restate the other eight. Each is swapped for the part\nits neighbours do *not* already say: total SO2 becomes the bound pool (total − free), density becomes\nits residual after a least-squares fit on alcohol and residual sugar (fitted on the training rows only,\napplied to both sides), citric and volatile acidity become their shares of the total acidity. Every swap\nis invertible given the columns that stay, so nothing is discarded; only the direction each input points\nchanges. This is the single largest effect in the run (−0.0020 RMSE). Adding the same quantities as\n*extra* columns — the ordinary feature-engineering move — cost +0.0016.\n\n**Four context views, all full size.** `sample` returns four index arrays over the same rows. Cutting\nrows is the one thing that reliably hurts here (85% of rows per member costs 0.0012, 55% costs 0.0058),\nso the views differ in how they *weight* rows, not how many they keep: one deduplicates the 532 exactly\nrepeated wines, one leaves them doubled, one repeats the rare qualities (3 and 9 ×3, 4 and 8 ×2) so a\nmodel reading its prior off its context sees less of a cliff at the tails, and one reads twice the 15%\nof rows whose quality their own 25-NN neighbourhood disagrees with.\n\n**Six target views, averaged back into one.** Squared error asks for the conditional mean of an ordinal\ninteger, which decomposes exactly as E[y] = 3 + Σ_k P(y > k). `preprocess` therefore hands the judge a\nmulti-target y — quality itself plus five 0/1 threshold indicators (y > 8 is four rows in 4331 and is\ncarried as a training constant instead of a sixth pass) — and `postprocess` reconstructs the ordinal\nestimate and averages it with the direct regression at weight 0.25, where an offline join against the\ntraining labels puts the optimum. Four context recipes × six target columns = eighteen frozen TabFM\npasses, all averaged. Finally, `postprocess` answers straight from the training table wherever the\nanswer is already in it: 458 groups of exactly repeated feature rows carry a single quality each, and a\nquarter of held-out rows have such a twin.\n\nFive-fold stratified CV (`folds()` overrides the judge's shuffled 3): **0.60259** against the 0.60699\nidentity baseline, better on all five folds.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`.\n\nThe pipeline has no caches, no precomputed features, no artifacts carried over from the search. The\ndensity projection, the acid shares, the duplicate index, the kNN surprise mask and the target views\nare all refitted from the judge's training rows on every fold. The one file the pipeline reads by name,\n`.dup_cache.pkl`, is written by `preprocess` seconds earlier in the same run — it exists only because\nthe judge runs the pre- and post-hooks in separate processes. Runtime and disk for the build step are\nboth zero; go straight to `python final/run.py`.\n\n## Things a reader could get wrong\n\n- **`tabfm_corr` prints `nan`, and that is by construction.** The audit correlates the pipeline's output\n  against a plain TabFM pass, but `pred` arrives as six target columns while one column is scored, so\n  the shapes do not match and no correlation is computed. It is not a sign that something outside TabFM\n  is predicting — nothing else predicts anything here.\n- **`final/build/` is instrumentation, not build steps.** `sweep.py` / `sweep2.py` rewrite\n  `TABFM_KWARGS` and drive `judge.py val` over a JSON list of variants (`sweep.py v7.json` and\n  friends — the `v*.json` and `variants.json` files in the workspace root are those inputs).\n  `blend.py`, `stack.py`, `ordinal_check.py` and `oof.py` join the `.oof/` dumps against\n  `data/train.csv` to answer calibration questions without spending evaluations. They set constants\n  such as `ORDINAL = 0.25`; they produce no input the pipeline reads, and re-running them would repeat\n  the search, not the build.\n- **The `.oof/` dumps are write-only from the pipeline's side.** `postprocess` writes one pickle per\n  fold, named by a hash of that fold's rows, and never reads them. They were the offline calibration\n  channel: because a `val` fold's validation rows are training rows, joining the dumps against\n  `data/train.csv` reproduces the judge's fold scores exactly (predicted 0.60460, measured 0.60460).\n  Deleting `.oof/` changes no prediction.\n- **`.dup_cache.pkl` is a single fixed path in the workspace root.** One fold at a time in one\n  workspace is fine (that is how the judge and `run.py` call it), but two folds running concurrently in\n  the same directory would overwrite each other's table.\n- **`folds()` is deliberate, not incidental.** Five stratified folds give 3465 context rows per fold\n  instead of the judge's 2887, closer to the 4331 the final fit sees, and score all 4331 rows. Quality\n  3 (26 rows) and 9 (4 rows) are clipped into their neighbours for stratification.\n- **The docstring's \"what did not work\" list is measured, not speculative** — added oenology features,\n  ExtraTrees blending, synthetic interpolated context rows, target denoising, dropping label-noisy\n  rows, per-colour z-scores. Each is a recorded regression, so re-adding one is a step backwards, not\n  an unexplored idea.\n","package":[],"derivations":[]}]}</script>
<script>/* TabFM-Auto Pipeline Explorer (vanilla JS, no dependencies).
   Every node is built with createElement / createElementNS and textContent; no HTML string is ever parsed.
   Inline styles are only set through the CSSOM (el.style.*), which the hash-based CSP allows. */
(function () {
  "use strict";

  /* ================================================================== data */
  const RAW = JSON.parse(document.getElementById("explorer-data").textContent);
  const TASKS = Array.isArray(RAW.tasks) ? RAW.tasks : [];
  const TASK_BY_ID = new Map(TASKS.map((t) => [t.id, t]));

  const HOOKS = ["preprocess", "engineer", "sample", "postprocess", "folds"];
  const SUITES = [
    ["tabarena_regression", "Regression"],
    ["tabarena_binary", "Binary"],
    ["tabarena_multiclass", "Multiclass"],
    ["all", "All (51)"],
  ];
  const SUITE_FULL = [
    ["tabarena_regression", "Regression"],
    ["tabarena_binary", "Binary"],
    ["tabarena_multiclass", "Multiclass"],
    ["all", "All TabArena datasets"],
  ];
  const SUITE_SHORT = {
    tabarena_binary: "Binary",
    tabarena_multiclass: "Multiclass",
    tabarena_regression: "Regression",
    mlebench: "MLE-Bench",
  };
  const CATEGORY = {
    I: "Cat. I \u00b7 Domain features",
    II: "Cat. II \u00b7 Statistical FE",
    III: "Cat. III \u00b7 Context & calibration",
  };
  const MEDALS = ["Gold", "Silver", "Bronze"];
  const MODES = new Set(["pipelines", "table"]);
  const TABS = new Set(["code", "package", "docs"]);
  const DASH = "\u2014";
  const MINUS = "\u2212";
  const SVGNS = "http://www.w3.org/2000/svg";

  /* ================================================================= state */
  const state = {
    mode: "pipelines",
    taskId: TASKS.length ? TASKS[0].id : "",
    tab: "code",
    suite: "tabarena_regression",
    query: "",
    sort: "gain",
    hook: "all",
    file: "",
    tableSort: { key: "gain", dir: -1 },
  };

  /* ========================================================== DOM helpers */
  function append(el, kids) {
    if (kids == null || kids === false) return el;
    if (Array.isArray(kids)) {
      for (const k of kids) append(el, k);
      return el;
    }
    el.appendChild(kids instanceof Node ? kids : document.createTextNode(String(kids)));
    return el;
  }
  function setProps(el, attrs, isSvg) {
    if (!attrs) return;
    for (const key of Object.keys(attrs)) {
      const v = attrs[key];
      if (v == null || v === false) continue;
      if (key === "class") {
        if (isSvg) el.setAttribute("class", v);
        else el.className = v;
      } else if (key === "text") {
        el.textContent = String(v);
      } else if (key === "style") {
        for (const p of Object.keys(v)) {
          if (p.startsWith("--")) el.style.setProperty(p, String(v[p]));
          else el.style[p] = v[p];
        }
      } else if (key.startsWith("on")) {
        if (typeof v === "function") el.addEventListener(key.slice(2), v);
      } else {
        el.setAttribute(key, v === true ? "" : String(v));
      }
    }
  }
  function h(tag, attrs, kids) {
    const el = document.createElement(tag);
    setProps(el, attrs, false);
    return append(el, kids);
  }
  function s(tag, attrs, kids) {
    const el = document.createElementNS(SVGNS, tag);
    setProps(el, attrs, true);
    return append(el, kids);
  }
  const byId = (id) => document.getElementById(id);

  /* =========================================================== formatting */
  function signed(x, d) {
    if (x == null || !isFinite(x)) return DASH;
    const r = Number(Number(x).toFixed(d));
    if (r === 0) return (0).toFixed(d);
    return (r > 0 ? "+" : MINUS) + Math.abs(r).toFixed(d);
  }
  const pctP = (p, d) => (p == null || !isFinite(p) ? DASH : signed(p, d == null ? 1 : d) + "%");
  const fmtInt = (n) => (n == null || !isFinite(n) ? DASH : Math.round(n).toLocaleString("en-US"));
  const signCls = (x) => (x == null || !isFinite(x) ? "" : x > 0 ? "pos" : x < 0 ? "neg" : "");
  function fmtScore(v) {
    if (v == null || !isFinite(v)) return DASH;
    const a = Math.abs(v);
    if (a === 0) return "0";
    if (a >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 1 });
    if (a >= 100) return v.toFixed(2);
    if (a >= 1) return v.toFixed(4);
    return v.toPrecision(4);
  }
  function median(xs) {
    const v = xs.filter((x) => x != null && isFinite(x)).sort((a, b) => a - b);
    if (!v.length) return null;
    const m = v.length >> 1;
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  }

  /* ============================================================ accessors */
  const isMle = (t) => t.suite === "mlebench";
  const gainRef = (t) => (isMle(t) ? "error reduction vs. the identity pipeline" : "error reduction vs. plain TabFM");
  const SEARCH = new Map(
    TASKS.map((t) => [
      t.id,
      {

  function sortHeader(cols, sortState, onSort) {

  function cmpVals(x, y, dir) {

    if (xn && yn) return 0;
    if (xn) return 1;
    if (yn) return -1;
    if (typeof x === "string") return dir * x.localeCompare(y, undefined, { sensitivity: "base" });

  function visibleTasks() {

      out.push({ t, where });

    const key = state.sort;
    const val = (t) => {
      if (key === "gain") return t.gain_pct == null ? -Infinity : t.gain_pct;
      if (key === "lines") return t.lines || 0;
      return 0;
    };
    const byName = (x, y) => x.t.name.localeCompare(y.t.name, undefined, { sensitivity: "base" });

  /* ============================================================ routing */

    const task = p.get("task");
    if (task && TASK_BY_ID.has(task)) {
      if (task !== state.taskId) { state.hook = "all"; state.file = ""; }
      state.taskId = task;
      const tObj = TASK_BY_ID.get(task);
      if (!suite && state.suite !== "all" && tObj.suite !== state.suite) {
        state.suite = tObj.suite;
      }
      if (!mode) state.mode = "pipelines";
    }
    const tab = p.get("tab");
    if (tab && TABS.has(tab)) state.tab = tab;
    const hk = p.get("hook");

  function workspaceCard(t) {

  /* ========================================================= code viewer */
  const KW = new Set(
    ("and as assert async await break class continue def del elif else except finally for from global if import in is " +
      "lambda nonlocal not or pass raise return try while with yield").split(" ")
  );
  const CONSTS = new Set(["True", "False", "None", "self", "cls"]);
  const BUILTINS = new Set(
    ("abs all any bool dict enumerate filter float getattr hasattr int isinstance len list map max min next object open " +
      "print range repr reversed round set setattr slice sorted str sum super tuple type zip np pd").split(" ")
  );
  const HOOK_WORDS = new Set(HOOKS.concat(["TABFM_KWARGS"]));
  const RE_TOK =
    /(#.*$)|([rRbBuUfF]{0,2}(?:"""|'''))|([rRbBuUfF]{0,2}(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'))|(\b0[xX][0-9a-fA-F_]+\b|\b\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?j?\b|\.\d+(?:[eE][+-]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([\s\S])/y;

  function tokenizeLine(line, st) {
    const out = [];
    let i = 0;
    if (st.triple) {
      const end = line.indexOf(st.triple);
      if (end < 0) return [["t-str", line]];
      out.push(["t-str", line.slice(0, end + 3)]);
      i = end + 3;
      st.triple = null;
    }
    let prev = "";
    while (i < line.length) {
      RE_TOK.lastIndex = i;
      const m = RE_TOK.exec(line);
      if (!m || !m[0]) {
        out.push(["", line.slice(i)]);
        break;
      }
      const tok = m[0];
      if (m[2]) {
        const delim = tok.slice(-3);
        const end = line.indexOf(delim, i + tok.length);
        if (end < 0) {
          out.push(["t-str", line.slice(i)]);
          st.triple = delim;
          break;
        }
        out.push(["t-str", line.slice(i, end + 3)]);
        i = end + 3;
        prev = "";
        continue;
      }
      if (m[1]) out.push(["t-com", tok]);
      else if (m[3]) out.push(["t-str", tok]);
      else if (m[4]) out.push(["t-num", tok]);
      else if (m[5]) {
        let cls = "";
        if (HOOK_WORDS.has(tok)) cls = "t-hook";
        else if (CONSTS.has(tok)) cls = "t-const";
        else if (KW.has(tok)) cls = "t-kw";
        else if (prev === "def" || prev === "class") cls = "t-fn";
        else if (BUILTINS.has(tok)) cls = "t-bi";
        out.push([cls, tok]);
      } else out.push(["", tok]);
      if (m[5]) prev = tok;
      else if (!m[6]) prev = "";
      i += tok.length;
    }
    return out;
  }
  function splitLines(code) {

    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();

  }
  function copyButton(text, name) {

  function flashTarget(el) {

  function hookButton(t, key) {

    }
    const active = (t.hooks_active || []).includes(key);
    const r = (t.hook_ranges || {})[key];
    const hs = ((t.hook_helpers || {})[key]) || [];
    let title = (active ? "Active hook" : "Pass-through hook") + (r ? " (lines " + r[0] + "\u2013" + r[1] + ")" : "");
    if (hs.length) title += " \u00b7 includes helpers: " + hs.map((fn) => fn + "()").join(", ");

      type: "button",

      onclick: () => {
        state.hook = key;
        renderPage();
        writeHash();
      },
    }, kids);
  }

  function codeView(t) {
    const hook = state.hook;
    const ranges = t.hook_ranges || {};
    const helperRanges = t.helper_ranges || {};
    const hookHelpers = t.hook_helpers || {};
    const allHelpers = t.helper_functions || [];
    const definedHooks = (t.hooks_defined || []).filter((k) => ranges[k]);
    const lines = splitLines(t.code);

    const st = { triple: null };
    const tokenized = lines.map((ln) => tokenizeLine(ln, st));

    const pre = h("pre", { class: "code", tabindex: "0", "aria-label": t.name + " pipeline.py" });
    const frag = document.createDocumentFragment();

    const appendRange = (lo, hi) => {
      for (let n = lo; n <= hi && n <= tokenized.length; n++) {
        const toks = tokenized[n - 1];
        const row = h("span", { class: "code-line", "data-line": String(n) });
        row.appendChild(h("span", { class: "ln", text: String(n) }));
        for (const tk of toks) {
          if (tk[0]) row.appendChild(h("span", { class: tk[0], text: tk[1] }));
          else row.appendChild(document.createTextNode(tk[1]));
        }
        frag.appendChild(row);
      }
    };

    if (hook === "all" || !ranges[hook]) {
      appendRange(1, lines.length);
    } else {
      const [hLo, hHi] = ranges[hook];
      const hs = hookHelpers[hook] || [];
      frag.appendChild(
        h("div", { class: "code-sect", "data-fn": hook }, [
          h("span", null, [
            "Hook ",
            h("b", { text: "def " + hook + "(...)" }),
            hs.length ? " \u00b7 calls " + hs.map((fn) => fn + "()").join(", ") : "",
          ]),
          h("span", { class: "mono", text: "lines " + hLo + "\u2013" + hHi }),
        ])
      );
      appendRange(hLo, hHi);
      for (const fn of hs) {
        const hr = helperRanges[fn];
        if (!hr) continue;
        frag.appendChild(
          h("div", { class: "code-sect", "data-fn": fn }, [
            h("span", null, ["Helper called by " + hook + "() \u00b7 ", h("b", { text: "def " + fn + "(...)" })]),
            h("span", { class: "mono", text: "lines " + hr[0] + "\u2013" + hr[1] }),
          ])
        );
        appendRange(hr[0], hr[1]);
      }
    }
    pre.appendChild(frag);

    const stageGroup = h(
      "div",
      { class: "stage-group" },
      [h("span", { class: "bar-label", text: "Stage" }), hookButton(t, "all")].concat(definedHooks.map((k) => hookButton(t, k)))
    );

    let helperGroup = null;
    const currentHelpers = hook === "all" ? allHelpers.slice(0, 6) : hookHelpers[hook] || [];
    if (currentHelpers.length) {
      const pills = [h("span", { class: "bar-label", text: hook === "all" ? "Helpers" : "Includes" })];
      for (const fn of currentHelpers) {
        const hr = helperRanges[fn];
        pills.push(
          h("button", {
            type: "button",
            class: "helper-btn",
            title: "Scroll to def " + fn + "()" + (hr ? " (lines " + hr[0] + "\u2013" + hr[1] + ")" : ""),
            onclick: () => {
              const target =
                pre.querySelector('.code-sect[data-fn="' + fn + '"]') ||
                (hr ? pre.querySelector('.code-line[data-line="' + hr[0] + '"]') : null);
              flashTarget(target);
            },
          }, fn + "()")
        );
      }
      if (hook === "all" && allHelpers.length > 6) {
        pills.push(h("span", { class: "bar-label", text: "+" + (allHelpers.length - 6) + " more" }));
      }
      helperGroup = h("div", { class: "helper-group" }, pills);
    }

    const stageBar = h("div", { class: "stage-bar" }, [stageGroup, helperGroup]);
    return [stageBar, h("div", { class: "code-wrap" }, pre)];
  }


  /* ============================================================ package */
  function fileText(t, f) {
    return f ? f.text || "" : "";
  }
  function currentFile(t) {
    const pkg = t.package || [];
    return pkg.find((f) => f.path === state.file) || pkg[0] || null;
  }
  function jumpToLine(n) {
    state.tab = "code";
    state.hook = "all";
    renderPage();
    writeHash();
    flashTarget(document.querySelector('.code-line[data-line="' + n + '"]'));
  }
  function openFile(file, line) {
    if (file === "pipeline.py") {
      jumpToLine(line || 1);
      return;
    }
    state.tab = "package";
    state.file = file;
    renderPage();
    writeHash();
    flashTarget(document.querySelector('.pkg-viewer .code-line[data-line="' + (line || 1) + '"]'));
  }
  function refChip(r) {
    return h("button", {
      type: "button",
      class: "ref-chip" + (r[1] === "pipeline.py" ? " is-pipe" : ""),
      title: "Open " + r[1] + (r[2] ? " at line " + r[2] : ""),
      onclick: () => openFile(r[1], r[2]),
    }, r[0]);
  }
  const TONE_CLS = { build: "rebuilt", snapshot: "snapshot", memo: "memo", raw: "raw" };
  function derivCard(d) {
    const kids = [
      h("div", { class: "dv-head" }, [
        h("span", { class: "dv-name", text: d.name }),
        h("span", { class: "art-kind " + (TONE_CLS[d.tone] || ""), text: d.tag }),
      ]),
      h("p", { class: "dv-what", text: d.what }),
    ];
    if (d.steps && d.steps.length) {
      kids.push(h("div", { class: "dv-row" }, [h("span", { class: "dv-k", text: "Made by" }), h("div", { class: "dv-chips" }, d.steps.map(refChip))]));
    }
    if (d.cmd) kids.push(h("pre", { class: "dv-cmd", text: d.cmd }));
    if (d.note) kids.push(h("p", { class: "dv-note", text: d.note }));
    if (d.preview && d.preview.rows.length) {
      const mx = Math.max.apply(null, d.preview.rows.map((r) => r[1])) || 1;
      kids.push(h("div", { class: "dv-row" }, [
        h("span", { class: "dv-k", text: "Inside" }),
        h("div", { class: "dv-prev" }, [
          h("div", { class: "dv-bars" }, d.preview.rows.map((r) => {
            const fill = h("span", { class: "dv-fill" });
            fill.style.width = Math.max(1.5, (100 * r[1]) / mx).toFixed(1) + "%";
            return h("div", { class: "dv-bar" + (r[2] === "drop" ? " is-drop" : "") }, [
              h("span", { class: "dv-bl", text: r[0], title: r[0] }),
              h("span", { class: "dv-track" }, fill),
              h("span", { class: "dv-bv", text: Number.isInteger(r[1]) ? String(r[1]) : r[1].toFixed(4) }),
            ]);
          })),
          h("p", { class: "dv-cap", text: d.preview.caption }),
        ]),
      ]));
    }
    if (d.use) {
      kids.push(h("div", { class: "dv-row" }, [
        h("span", { class: "dv-k", text: "Used by" }),
        h("div", null, [h("p", { class: "dv-use", text: d.use.text }), h("div", { class: "dv-chips" }, (d.use.refs || []).map(refChip))]),
      ]));
    }
    return h("article", { class: "dv-card" }, kids);
  }
  function artifactsBlock(t) {
    const ds = t.derivations || [];
    const kids = [h("h3", { class: "pkg-h", text: "How the inputs are built" }), h("div", { class: "dv-list" }, ds.map(derivCard))];
    return h("section", { class: "pkg" }, kids);
  }
  function packageView(t) {
    const pkg = t.package || [];
    const cur = currentFile(t);
    const out = [artifactsBlock(t)];
    if (!pkg.length) return out;
    const fileBar = h("div", { class: "stage-bar" }, [
      h("div", { class: "pkg-files" }, [
        h("div", { class: "pkg-group" }, [h("span", { class: "bar-label", text: "Scripts" })].concat(pkg.map((f) =>
          h("button", {
            type: "button",
            class: "file-btn" + (cur && cur.path === f.path ? " is-selected" : ""),
            "aria-pressed": cur && cur.path === f.path ? "true" : "false",
            title: f.path + " \u00b7 " + f.lines + " lines",
            onclick: () => {
              state.file = f.path;
              renderPage();
              writeHash();
            },
          }, [f.path.replace(/^build\//, ""), h("span", { class: "file-n", text: String(f.lines) })])
        ))),
      ]),
    ]);
    out.push(fileBar);
    if (cur) {
      const lines = splitLines(fileText(t, cur));
      const isMd = /\.md$/.test(cur.path);
      const st = { triple: null };
      const pre = h("pre", { class: "code", tabindex: "0", "aria-label": t.name + " " + cur.path });
      const frag = document.createDocumentFragment();
      lines.forEach((ln, i) => {
        const row = h("span", { class: "code-line", "data-line": String(i + 1) });
        row.appendChild(h("span", { class: "ln", text: String(i + 1) }));
        if (isMd) row.appendChild(document.createTextNode(ln));
        else for (const tk of tokenizeLine(ln, st)) {
          if (tk[0]) row.appendChild(h("span", { class: tk[0], text: tk[1] }));
          else row.appendChild(document.createTextNode(tk[1]));
        }
        frag.appendChild(row);
      });
      pre.appendChild(frag);
      out.push(h("div", { class: "code-wrap pkg-viewer" }, pre));
    }
    return out;
  }

  /* ============================================================ write-up */
  function inlineMd(el, text) {
    const src = String(text || "");
    const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*\s](?:[^*]*[^*\s])?\*)|(\[[^\]]+\]\([^)\s]+\))/g;
    let last = 0;
    let m;
    while ((m = re.exec(src))) {
      if (m.index > last) el.appendChild(document.createTextNode(src.slice(last, m.index)));
      if (m[1]) el.appendChild(h("code", { text: m[1].slice(1, -1) }));
      else if (m[2]) el.appendChild(inlineMd(h("b"), m[2].slice(2, -2)));
      else if (m[3]) el.appendChild(inlineMd(h("em"), m[3].slice(1, -1)));
      else el.appendChild(inlineMd(h("span"), m[4].slice(1, m[4].indexOf("]"))));
      last = re.lastIndex;
    }
    if (last < src.length) el.appendChild(document.createTextNode(src.slice(last)));
    return el;
  }
  function plainMd(text) {
    return String(text || "")
      .replace(/\[([^\]]+)\]\([^)\s]+\)/g, "$1")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/\*([^*\s](?:[^*]*[^*\s])?)\*/g, "$1");
  }
  const TABLE_ROW = /^\s*\|.*\|\s*$/;
  const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(?:\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  function tableCells(row) {
    return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  }
  function renderMarkdown(parent, text) {
    const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
    const indented = (l) => /^( {4}|\t)/.test(l);
    let para = [];
    let list = null;
    let listTag = "";
    const flushPara = () => {
      if (para.length) parent.appendChild(inlineMd(h("p"), para.join(" ")));
      para = [];
    };
    const endList = () => {
      list = null;
      listTag = "";
    };
    let i = 0;
    while (i < lines.length) {
      const ln = lines[i];
      if (/^\s*```/.test(ln)) {
        flushPara();
        endList();
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        parent.appendChild(h("pre", { text: buf.join("\n") }));
        continue;
      }
      if (TABLE_ROW.test(ln) && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
        flushPara();
        endList();
        const head = tableCells(ln);
        i += 2;
        const rows = [];
        while (i < lines.length && TABLE_ROW.test(lines[i])) rows.push(tableCells(lines[i++]));
        parent.appendChild(
          h("div", { class: "doc-tbl" }, h("table", null, [
            h("thead", null, h("tr", null, head.map((c) => inlineMd(h("th", { scope: "col" }), c)))),
            h("tbody", null, rows.map((r) => h("tr", null, r.map((c) => inlineMd(h("td"), c))))),
          ]))
        );
        continue;
      }
      const hm = /^(#{1,6})\s+(.*)$/.exec(ln);
      if (hm) {
        flushPara();
        endList();
        parent.appendChild(inlineMd(h("h" + Math.min(5, hm[1].length + 2)), hm[2]));
        i++;
        continue;
      }
      const lm = /^\s{0,3}([-*+]|\d+[.)])\s+(.*)$/.exec(ln);
      if (lm) {
        flushPara();
        const tag = /\d/.test(lm[1]) ? "ol" : "ul";
        if (!list || listTag !== tag) {
          list = h(tag);
          listTag = tag;
          parent.appendChild(list);
        }
        list.appendChild(inlineMd(h("li"), lm[2]));
        i++;
        continue;
      }
      if (list && /^\s{2,}\S/.test(ln)) {
        const li = list.lastElementChild;
        if (li) inlineMd(li, " " + ln.trim());
        i++;
        continue;
      }
      if (indented(ln)) {
        flushPara();
        endList();
        const buf = [];
        while (i < lines.length && (indented(lines[i]) || (!lines[i].trim() && i + 1 < lines.length && indented(lines[i + 1])))) {
          buf.push(lines[i].replace(/^( {4}|\t)/, ""));
          i++;
        }
        parent.appendChild(h("pre", { text: buf.join("\n") }));
        continue;
      }
      if (!ln.trim()) {
        flushPara();
        endList();
        i++;
        continue;
      }
      endList();
      para.push(ln.trim());
      i++;
    }
    flushPara();
  }
  function docsView(t) {
    const doc = h("div", { class: "doc" });
    if (t.readme) {
      renderMarkdown(doc, t.readme);
    } else {
      doc.appendChild(h("div", { class: "empty", text: "This run left no write-up." }));
    }
    return [doc];
  }

  /* ======================================================= all-tasks page */
  function medalCount(rows) {
    const n = rows.filter((t) => MEDALS.includes(t.medal)).length;
    const parts = MEDALS.map((k) => [k, rows.filter((t) => t.medal === k).length]).filter((x) => x[1] > 0);
    return { n, sub: parts.map((x) => x[1] + " " + x[0]).join(" \u00b7 ") || "No medals" };
  }
  function statTile(k, v, sub, cls) {
    return h("div", { class: "stat" }, [
      h("div", { class: "stat-k", text: k }),
      h("div", { class: "stat-v" + (cls ? " " + cls : ""), text: v }),
      sub ? h("div", { class: "stat-sub", text: sub }) : null,
    ]);
  }
  function tablePage() {
    const rows = TASKS.filter((t) => (state.suite === "all" || t.suite === state.suite) && matchQuery(t) !== null);
    const ts = state.tableSort;
    const val = (t, key) => {
      switch (key) {
        case "name": return t.name;
        case "suite": return SUITE_SHORT[t.suite] || t.suite;
        case "gain": return t.gain_pct;
        case "lines": return t.lines;
        case "hooks": return (t.hooks_active || []).length;
        default: return null;
      }
    };
    rows.sort((x, y) => cmpVals(val(x, ts.key), val(y, ts.key), ts.dir) || x.name.localeCompare(y.name));
    const cols = [
      { key: "name", label: "Task" },
      { key: "suite", label: "Suite & Metric" },
      { key: "plain", label: "Plain TabFM", num: true, sortable: false, title: "Zero-shot plain TabFM baseline" },
      { key: "score", label: "Final Score", num: true, sortable: false },
      { key: "gain", label: "Error Reduction (\u0394)", num: true, title: "Error reduction vs. plain TabFM" },
      { key: "hooks", label: "Active Hooks", dir: -1 },
      { key: "lines", label: "Lines", num: true },
    ];
    const body = rows.map((t) => {
      const hooks = t.hooks_active || [];
      const tr = h("tr", { class: "clickable" }, [
        h("td", { "data-label": "Task" }, [
          h("button", { type: "button", class: "link-btn", onclick: () => selectTask(t.id) }, t.short_name || t.name),
          t.summary ? h("div", { class: "cell-sum", title: plainMd(t.summary), text: plainMd(t.summary) }) : null,
        ]),
        h("td", { class: "suite-cell", "data-label": "Suite" }, [
          h("span", { text: SUITE_SHORT[t.suite] || t.suite_label }),
          h("span", { class: "suite-metric", text: t.metric_label }),
        ]),
        h("td", { class: "r mono", "data-label": "Baseline", text: isMle(t) && t.plain == null ? "fails" : fmtScore(t.plain) }),
        h("td", { class: "r mono", "data-label": "Final Score", text: fmtScore(t.score) }),
        h("td", { class: "r", "data-label": "\u0394" }, gainPill(t)),
        h("td", { "data-label": "Active Hooks" },
          hooks.length
            ? h("div", { class: "hook-pills" }, hooks.map((hk) => h("span", { class: "hook-tag", text: hk })))
            : h("span", { class: "suite-metric", text: "TABFM_KWARGS only" })
        ),
        h("td", { class: "r mono", "data-label": "Lines", text: String(t.lines) }),
      ]);
      tr.addEventListener("click", (e) => {
        if (e.target.closest("button")) return;
        selectTask(t.id);
      });
      return tr;
    });

    const suiteSeg = h("div", { class: "seg", role: "group", "aria-label": "Suite" }, SUITE_FULL.map(([k, lab]) => {
      const count = k === "all" ? TASKS.length : TASKS.filter((t) => t.suite === k).length;
      return h("button", {
        type: "button",
        id: "table-suite-" + k,
        class: state.suite === k ? "is-active" : null,
        "aria-pressed": state.suite === k ? "true" : "false",
        onclick: () => {
          state.suite = k;
          const vis = visibleTasks();
          if (vis.length && !vis.some((x) => x.t.id === state.taskId)) {
            state.taskId = vis[0].t.id;
            state.hook = "all";
          }
          syncControls();
          renderList();
          renderPage();
        },
      }, lab + " (" + count + ")");
    }));

    const nReg = TASKS.filter((t) => t.suite === "tabarena_regression").length;
    const nBin = TASKS.filter((t) => t.suite === "tabarena_binary").length;
    const nMul = TASKS.filter((t) => t.suite === "tabarena_multiclass").length;
    const medGain = median(TASKS.map((t) => t.gain_pct));
    const nImproved = TASKS.filter((t) => (t.gain_pct || 0) > 0).length;
    const summaryStrip = h("section", { class: "summary-strip", "aria-label": "Benchmark summary" }, [
      statTile("TabArena Datasets", String(TASKS.length), nReg + " Regression \u00b7 " + nBin + " Binary \u00b7 " + nMul + " Multiclass"),
      statTile("Median Error Reduction", pctP(medGain, 1), "Across all 51 TabArena datasets", signCls(medGain)),
      statTile("Datasets Improved", nImproved + " / " + TASKS.length, "Over zero-shot plain TabFM"),
      statTile("Median Pipeline Size", fmtInt(median(TASKS.map((t) => t.lines))) + " lines", "Compact Python hooks & helpers"),
    ]);

    return [
      summaryStrip,
      h("section", { class: "table-card" }, [
        h("div", { class: "table-toolbar" }, [
          suiteSeg,
          h("span", { class: "eyebrow", text: rows.length + " tasks shown \u00b7 click any row to inspect code & write-up" }),
        ]),
        h("div", { class: "tbl-wrap" }, h("table", { class: "tbl stack-tbl" }, [sortHeader(cols, state.tableSort, renderPage), h("tbody", null, body)])),
      ]),
    ];
  }

  /* =============================================================== theme */
  const THEME_KEY = "tabfm_auto_theme_v1";
  function themeIcon(dark) {
    const root = s("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" });
    if (dark) {
      root.appendChild(s("circle", { cx: 12, cy: 12, r: 4 }));
      root.appendChild(s("path", { d: "M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" }));
    } else {
      root.appendChild(s("path", { d: "M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" }));
    }
    return root;
  }
  function applyTheme(th) {
    document.documentElement.setAttribute("data-theme", th);
    const btn = byId("theme-toggle");
    btn.setAttribute("aria-label", th === "dark" ? "Switch to light theme" : "Switch to dark theme");
    btn.title = btn.getAttribute("aria-label");
    btn.replaceChildren(themeIcon(th === "dark"));
  }
  function initTheme() {
    let th = null;
    try {
      th = window.localStorage.getItem(THEME_KEY);
    } catch (e) {
      th = null;
    }
    if (th !== "light" && th !== "dark") {
      th = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    applyTheme(th);
    window.addEventListener("storage", (e) => { if (e.key === THEME_KEY && (e.newValue === "light" || e.newValue === "dark")) applyTheme(e.newValue); });
    byId("theme-toggle").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try {
        window.localStorage.setItem(THEME_KEY, next);
      } catch (e) {
        /* storage unavailable */
      }
    });
  }

  /* ================================================================ init */
  function init() {
    byId("brand-sub").textContent = "TabArena Pipeline Explorer \u00b7 51 Datasets (Regression, Binary, Multiclass)";
    initTheme();
    initControls();
    const first = visibleTasks()[0];
    if (first) state.taskId = first.t.id;
    readHash();
    for (const b of document.querySelectorAll(".mode-btn")) b.addEventListener("click", () => setMode(b.dataset.mode));
    window.addEventListener("hashchange", () => {
      readHash();
      render();
    });
    window.addEventListener("scroll", hideTip, { passive: true });
    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) {
        e.preventDefault();
        if (state.mode !== "pipelines") setMode("pipelines");
        byId("search-input").focus();
      }
    });
    render();
  }
  init();
})();
</script>
</body>
</html>
