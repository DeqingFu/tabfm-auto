o to five and turning crosses on is therefore the whole gain: 0.00160 -> 0.00152\n   over 50 validation splits, with quantile / quantile_rtdl / robust as diversity on top of the\n   none / power pair that carries the accuracy -- dropping either of those two costs more than the\n   diversity is worth, and n_svd_features costs +0.00017.\n\npreprocess and postprocess are identity: the metric is rank-based and TabFM's own output is\nalready what should be scored.  Row subsampling (max_num_rows below 1440, or several draws over\nduplicated slices) and NNLS member weights were measured too, and neither pays for itself.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\n# intent: colorder rand4\nTABFM_KWARGS = {\n    # Eight members over five normalisations -- none, power and quantile get two each,\n    # quantile_rtdl and robust one -- plus sqrt(30) random feature crosses on half of them.  The\n    # order sets that split: moving robust forward, so it takes two members and quantile one, costs\n    # +0.00014, and giving none or power a third member costs +0.00014 / +0.00009.\n    'norm_methods': ['none', 'power', 'quantile', 'quantile_rtdl', 'robust'],\n    'n_feature_crosses': 'sqrt',\n    # 3.0 and the 4.0 default are indistinguishable (0.001517 vs 0.001521 over 50 splits) while\n    # 2.0 and 8.0 are both clearly worse, so the z-clip wants to sit just about where it is.\n    'outlier_threshold': 3.0,\n}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\nCOLORDER = 'rand4' \n\n\ndef engineer(X_train, y_train, X_test):\n  # No new columns -- but the frames still have to survive the trip home: the judge unpickles a\n  # hook's output in an interpreter where importing pyarrow fails, and pandas 3 gives any index it\n  # builds fresh a pyarrow-backed string dtype that cannot be loaded there.  Normalising the column\n  # index to plain objects keeps that from biting a later edit that does build columns.\n  if COLORDER != 'none':\n    cols = [c for c in X_train.columns if c[0] == 's' and c[1:].isdigit()]\n    rest = [c for c in X_train.columns if c not in cols]\n    if COLORDER == 'rev':\n      order = cols[::-1]\n    else:\n      rng = np.random.default_rng(int(COLORDER[4:]))\n      order = [cols[i] for i in rng.permutation(len(cols))]\n    X_train, X_test = X_train[rest + order], X_test[rest + order]\n  return _plain(X_train), _plain(X_test)\n\n\ndef _plain(df):\n  out = df.copy()\n  out.columns = pd.Index(np.array([str(c) for c in df.columns], dtype=object), dtype=object)\n  return out\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n\n\ndef folds(X_train, y_train):\n  \"\"\"10-fold x 5 repeats.  The judge's default 3 folds spread by 4e-4 while the effects worth\n  chasing here are 1e-4, and even 10 x 2 left a paired standard error of ~1.2e-4; 50 splits bring\n  that to ~5e-5, and 1440 training rows per split also mirror the 1600 the final fits on.  The\n  2400 rows hold no exact duplicates and no replicate clusters, so they are exchangeable and\n  stratified k-fold is the right mirror of how the task's own folds are cut.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = np.asarray(y_train).ravel()\n  rskf = RepeatedStratifiedKFold(n_splits=10, n_repeats=5, random_state=1)\n  return [(tr, va) for tr, va in rskf.split(np.zeros(len(y)), y)]\n","readme":"# hazelnut-spread-contaminant-detection — final pipeline\n\n## What it does\n\nThe task is 1600 training rows × 30 numeric sensor readings (`s<i><j>`, the off-diagonal of a 6×6\ntransmission matrix between six sensors), scored as 1−AUC, lower better. The pipeline hands that\ntable to TabFM essentially untouched and spends its whole budget on TabFM's own ensembling.\n\n`preprocess` and `postprocess` are the identity: the metric is rank-based, so TabFM's raw output is\nalready the thing being scored. `engineer` adds no columns — it only applies a fixed random\npermutation of the 30 sensor columns (`COLORDER = 'rand4'`, seeded, so train and test get the same\norder) and normalises the column index to plain Python objects so the frames survive being pickled\nback to the judge. The permutation matters only because TabFM's feature-cross generator is\norder-sensitive; it is a seed choice, not a transformation.\n\nThe tuning is all in `TABFM_KWARGS`: eight ensemble members spread over five normalisations\n(`none`, `power`, `quantile`, `quantile_rtdl`, `robust`) with `n_feature_crosses='sqrt'` and\n`outlier_threshold=3.0`. `none` and `power` carry the accuracy; the other three are there purely as\ndiversity. Widening the normalisation list from TabFM's default two and turning crosses on is the\nwhole measured gain (1−AUC 0.00160 → 0.00152 over 50 validation splits).\n\nTwo negative results are load-bearing and are documented at length in the pipeline docstring.\nEvery engineered representation that was tried lost — symmetric/antisymmetric pairs, row/column\nsums, Frobenius norm and singular values, row normalisation, PCA rotation, duplicated columns,\nmutual-information column selection — and so did every attempt to drop or synthesise rows. And\nclassical models plateau around 1−AUC 0.025 while TabFM sits at 0.0016, so there is nothing worth\nstacking on top of it.\n\n`folds()` overrides the judge's default 3-fold with 10-fold × 5 repeats (`RepeatedStratifiedKFold`,\n`random_state=1`). The effects being chased here are ~1e-4 while 3 folds spread by ~4e-4; 50 splits\nbring the paired standard error to ~5e-5, and 1440 training rows per split also mirror the 1600 the\nfinal model fits on. The 2400 rows contain no exact duplicates and no replicate clusters, so plain\nstratified k-fold is the right mirror of how the task's folds are cut.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a documented no-op that exits 0. The pipeline opens no files, loads no\ncaches and fits no auxiliary model, so there is no artifact standing between `data/train.csv` and\nthe TabFM pass. It runs in well under a second and needs no disk.\n\n```\ncd <this workspace> && bash final/build.sh && python final/run.py\n```\n\n## Things a reader might otherwise get wrong\n\n- **`final/build/` is not part of the build.** `sweep.py` (rewrite a module constant in\n  `pipeline.py`, then run `judge.py val`) and `cmp.py` (paired fold-by-fold comparison of past\n  `log.txt` results) were the search loop's driving and analysis tools. They produce no input to\n  `pipeline.py` and `build.sh` deliberately does not call them.\n- **`COLORDER` is not dead code.** It looks like a no-op reshuffle, and it is one as far as the raw\n  features go, but TabFM's feature-cross generator consults column order, so changing the seed\n  changes the prediction.\n- **`feat_shuffle_method` is inert here.** Whenever feature crosses are enabled, that branch of\n  TabFM's `EnsembleGenerator` builds its own permutations and never reads the flag — which is why\n  member diversity had to come from the normalisation list instead.\n- **The scored numbers in the docstring are 50-split validation means**, not test scores, and the\n  differences quoted (1e-4 scale) are only meaningful against the ~5e-5 paired standard error that\n  the 10×5 fold scheme buys. Re-running with the judge's default 3 folds will not resolve them.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` before running, and refuses\n  to do so if the two differ — they are identical as shipped.\n","package":[],"derivations":[]},{"id":"healthcare_insurance_expenses","name":"healthcare_insurance_expenses","short_name":"healthcare_insurance_expenses","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":4420.143476,"plain_note":null,"n_train":892,"n_test":446,"n_folds":30,"thresholds":null,"summary":"`charges` in this dataset is not a noisy function of the six covariates: it is a *closed form* in them, plus a one-sided contamination. A median (LAD) regression on `[age², age, children, bmi, male, region dummies, smoker, smoker·bmi, smoker·1(bmi>30)]` reproduces the target to floating-point precision on ~91% of the training rows.","score":4344.104043,"gain_pct":1.720293,"medal":null,"category":"II","lines":177,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['none']"},"helper_functions":["_design","_fit_base"],"helper_ranges":{"_design":[45,55],"_fit_base":[58,73]},"hook_helpers":{"preprocess":["_design","_fit_base"],"engineer":[],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[76,101],"engineer":[122,141],"sample":[144,152],"postprocess":[166,177],"folds":[155,163]},"code":"\"\"\"What this task actually is.\n\n`charges` is a *closed form* in the six columns.  A median (LAD) regression on\n[age^2, age, children, bmi, male, region dummies, smoker, smoker*bmi, smoker*(bmi>30)] reproduces\nit to floating point on 91% of the training rows; the other 9% sit 2k-24k above it and nothing in\nthe features predicts which (OOF AUC 0.47 for the indicator, flat rate across every slice).  So the\nRMSE-optimal prediction is base(x) + E[spike], and the whole job is to hand TabFM a context in\nwhich that is the easiest thing to say.\n\nMODE:\n  'clean'  drop the spike rows from the context.  TabFM then learns a *noiseless* map (with the\n           closed form itself supplied as the `base` column), and postprocess adds back the one\n           number the dropped rows carried: their share of the mean, E[spike].\n  'direct' keep every row, `base` is just a feature, postprocess blends TabFM with the base.\n  'resid'  retarget to y - (base + E[spike]) and add it back.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]      OPTIONAL\n  postprocess(pred, y_orig, X_test)     -> pred\n  TABFM_KWARGS                                                        constructor knobs\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]               OPTIONAL\n\"\"\"\nimport os\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'norm_methods': ['none']}\n\nMODE = 'clean'\nALPHA = 1.0        # weight on TabFM's own output vs the analytic base\nSPIKE_T = 500.0    # residual above which a training row counts as a spike, in currency units\nNDRAWS = 12         # independent contexts the judge averages; 1 = one draw of every row\nFRAC = 0.9         # rows kept per draw when NDRAWS > 1\nDUP = 1            # copies of every context row: a denser context for the same information\nFEATS = 'base'      # columns reaching TabFM: 'base' | 'raw' | 'nobase' | 'all'\nOFF_SHRINK = 0.05       # 0 | 'auto' | float: pull E[spike] toward 0 by its estimation variance\nBASE_COL = 'base'\n# postprocess is handed the *original* X_test, not the engineered one, and each hook stage runs in a\n# fresh interpreter, so what preprocess fitted travels between the two stages through the workspace.\nCACHE = os.path.abspath('.base_cache.npz')  # the judge chdirs into the workspace\n\n\ndef _design(d):\n  \"\"\"The closed form's own columns.\"\"\"\n  age = d['age'].astype(float).to_numpy()\n  bmi = d['bmi'].astype(float).to_numpy()\n  s = (d['smoker'] == 'yes').astype(float).to_numpy()\n  cols = [age ** 2, age, d['children'].astype(float).to_numpy(), bmi,\n          (d['sex'] == 'male').astype(float).to_numpy()]\n  for r in ('northeast', 'northwest', 'southeast'):\n    cols.append((d['region'] == r).astype(float).to_numpy())\n  cols += [s, s * bmi, s * (bmi > 30).astype(float)]\n  return np.column_stack(cols)\n\n\ndef _fit_base(X_train, y, X_test):\n  \"\"\"LAD hyperplane through the clean rows: the spikes are one-sided, so the median ignores them.\"\"\"\n  A, B = _design(X_train), _design(X_test)\n  mu, sd = A.mean(0), A.std(0) + 1e-9\n  A, B = np.c_[(A - mu) / sd, np.ones(len(A))], np.c_[(B - mu) / sd, np.ones(len(B))]\n  try:\n    from sklearn.linear_model import QuantileRegressor\n    q = QuantileRegressor(quantile=0.5, alpha=0.0, solver='highs').fit(A[:, :-1], y)\n    return q.predict(A[:, :-1]), q.predict(B[:, :-1])\n  except Exception:                            # keep the 30 final folds alive on any solver hiccup\n    c = np.linalg.lstsq(A, y, rcond=None)[0]   # trimmed least squares as a stand-in median fit\n    for _ in range(40):\n      r = y - A @ c\n      keep = r <= np.quantile(r, 0.6)\n      c = np.linalg.lstsq(A[keep], y[keep], rcond=None)[0]\n    return A @ c, B @ c\n\n\ndef preprocess(X_train, y_train, X_test):\n  Xtr, Xte = X_train.copy(), X_test.copy()\n  y = np.asarray(y_train, dtype=float).ravel()\n  btr, bte = _fit_base(X_train, y, X_test)\n  resid = y - btr\n  off = float(resid.mean())                            # E[spike]: the only thing left to estimate\n  if OFF_SHRINK:                                       # that mean is over a 9%/91% mixture, so it is\n    se2 = float(resid.var(ddof=1)) / len(resid)        # noisy; shrink it by its own share of variance\n    s = off ** 2 / (off ** 2 + se2) if OFF_SHRINK == 'auto' else 1.0 - float(OFF_SHRINK)\n    off *= s\n\n  shift = 0.0 if MODE in ('clean', 'winsor') else off              # in 'clean' mode the context has no spikes,\n  Xtr[BASE_COL] = btr + shift                          # so the column must stay on the clean scale\n  Xte[BASE_COL] = bte + shift\n  np.savez(CACHE, base=bte + shift, off=off)\n\n  if MODE == 'resid':\n    y_train = pd.Series(resid - off, index=y_train.index, name=getattr(y_train, 'name', 'y'))\n  elif MODE == 'clean':\n    keep = resid <= SPIKE_T\n    if keep.sum() >= 50:                               # never hand TabFM an empty context\n      Xtr, y_train = Xtr[keep], y_train[keep]\n  elif MODE == 'winsor':                               # keep the spike rows' covariates, pull their\n    y_train = pd.Series(np.minimum(y, btr + SPIKE_T),  # target down onto the clean surface\n                        index=y_train.index, name=getattr(y_train, 'name', 'y'))\n  return Xtr, y_train, Xte\n\n\nRAW = ['age', 'sex', 'bmi', 'children', 'smoker', 'region']\n# Every column below is a term of the closed form: dropping them costs 60 RMSE ('rawonly'), which is\n# how much of the surface TabFM cannot reconstruct from the six raw columns on its own.\nSETS = {\n    'rawonly': RAW,\n    'base': ['base'],\n    'raw': RAW + ['base'],\n    'nobase': RAW + ['age2', 'sm_ob', 'sm_bmi'],\n    'all': RAW + ['age2', 'sm_ob', 'sm_bmi', 'base'],\n    'split': RAW + ['age2', 'smk', 'ob_smk', 'sm_bmi'],\n    'lin': ['age2', 'children', 'bmi', 'male', 'ne', 'nw', 'se', 'smk', 'sm_bmi', 'ob_smk'],\n    'linraw': RAW + ['age2', 'children', 'male', 'ne', 'nw', 'se', 'smk', 'sm_bmi', 'ob_smk'],\n    'base_eng': ['base', 'age2', 'sm_ob', 'sm_bmi'],\n    'base_eng2': ['base', 'age2', 'sm_ob', 'sm_bmi', 'smoker', 'children'],\n    'wide': RAW + ['age2', 'sm_ob', 'sm_bmi', 'smk', 'ob_smk', 'ob', 'male', 'age3'],\n}\n\n\ndef engineer(X_train, y_train, X_test):\n  Xtr, Xte = X_train.copy(), X_test.copy()\n  for d in (Xtr, Xte):\n    age = d['age'].astype(float)\n    bmi = d['bmi'].astype(float)\n    sm = (d['smoker'] == 'yes').astype(float)\n    ob = (bmi > 30).astype(float)\n    d['age2'] = age ** 2\n    d['age3'] = age ** 3\n    d['sm_ob'] = sm + sm * ob\n    d['sm_bmi'] = sm * bmi\n    d['smk'] = sm\n    d['ob'] = ob\n    d['ob_smk'] = sm * ob\n    d['male'] = (d['sex'] == 'male').astype(float)\n    for r, c in (('northeast', 'ne'), ('northwest', 'nw'), ('southeast', 'se')):\n      d[c] = (d['region'] == r).astype(float)\n  keep = set(SETS.get(FEATS, SETS['all']))\n  cols = [c for c in Xtr.columns if c in keep or c.endswith('_id')]\n  return Xtr[cols], Xte[cols]\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  if DUP > 1:\n    return [np.repeat(np.arange(n), DUP)]\n  if NDRAWS <= 1 or FRAC >= 1.0:\n    return [np.arange(n)]\n  k = max(50, int(round(n * FRAC)))\n  rng = np.random.default_rng(12345)\n  return [np.sort(rng.choice(n, k, replace=False)) for _ in range(NDRAWS)]\n\n\ndef folds(X_train, y_train):\n  \"\"\"Two shuffled 10-folds instead of the judge's single 3-fold.  Every candidate left is inside a\n  couple of RMSE units of the others, so the split has to be measured twice to rank them, and 803\n  context rows per fold sits closer to the 892 the final actually fits on.\"\"\"\n  from sklearn.model_selection import KFold\n  out = []\n  for seed in (0, 1):\n    out += list(KFold(10, shuffle=True, random_state=seed).split(X_train))\n  return out\n\n\ndef postprocess(pred, y_orig, X_test):\n  z = np.load(CACHE)\n  base, off = z['base'], float(z['off'])\n  assert len(base) == len(pred), 'base cache out of sync with the prediction'\n  p = np.asarray(pred, dtype=float).ravel()\n  if MODE == 'resid':\n    out = base + ALPHA * p\n  elif MODE in ('clean', 'winsor'):\n    out = ALPHA * p + (1.0 - ALPHA) * base + off\n  else:\n    out = ALPHA * p + (1.0 - ALPHA) * base\n  return pd.Series(out, index=pred.index, name=getattr(pred, 'name', None))\n","readme":"# healthcare_insurance_expenses — final pipeline\n\n## What it does\n\n`charges` in this dataset is not a noisy function of the six covariates: it is a *closed form* in\nthem, plus a one-sided contamination. A median (LAD) regression on\n`[age², age, children, bmi, male, region dummies, smoker, smoker·bmi, smoker·1(bmi>30)]` reproduces\nthe target to floating-point precision on ~91% of the training rows. The remaining ~9% sit 2k–24k\ncurrency units *above* that surface, and nothing in the features predicts which rows those are\n(OOF AUC ≈ 0.47 for the spike indicator; the rate is flat across every slice). Under RMSE the\noptimal prediction is therefore `base(x) + E[spike]`, and the whole design is about handing TabFM a\ncontext in which saying that is easy.\n\nConcretely, `preprocess` fits the LAD hyperplane (`sklearn` `QuantileRegressor`, `quantile=0.5`,\n`alpha=0`, `highs` solver, on standardized design columns; a trimmed-least-squares loop is the\nfallback if the solver fails), computes `E[spike]` as the mean residual, and shrinks it 5% toward\nzero to account for the estimation variance of a mean taken over a 9%/91% mixture. In the chosen\n`MODE='clean'`, the spike rows (residual > 500) are then **dropped from the context**, so TabFM sees\na noiseless map, and the fitted `base` value is passed in as the single feature column\n(`FEATS='base'`). `postprocess` adds the shrunken `E[spike]` back onto TabFM's output — that offset\nis the one piece of information the dropped rows carried. The base column and the offset travel\nfrom `preprocess` to `postprocess` through `.base_cache.npz`, because the two hook stages run in\nseparate interpreters.\n\nTabFM remains the predictor throughout: it maps `base → charges` over the clean context rows.\nAround it, `TABFM_KWARGS={'norm_methods': ['none']}` (the target is already on a natural scale), and\n`sample()` returns 12 independent 90% subsamples of the context, whose predictions the judge\naverages. `folds()` overrides the judge's single 3-fold with two shuffled 10-folds — the surviving\ncandidates were within a couple of RMSE units of each other, so the split had to be measured twice\nto rank them, and 803 context rows per fold is much closer to the 892 the final model actually fits\non.\n\nMetric is RMSE, lower is better; `data/meta.json` lists no medal thresholds for this task.\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a no-op that explains why and exits 0. The pipeline has no\nprerequisites: its only file, `.base_cache.npz`, is written by `preprocess` on every run, and all\nfeatures are derived in-process from the raw `data/train.csv` / `data/test.csv` columns the judge\npasses to the hooks. Runtime ~0 s, disk ~0 B. There is no `final/build/` directory because no\nhelper script was written during the run — every experiment was an edit to `pipeline.py` followed by\n`python judge.py val`.\n\n## Things a reader could get wrong\n\n- **`.base_cache.npz` is not an input.** `final/run.py`'s static prerequisite scan sees the name as a\n  string constant, but it is written before it is read within the same run. Do not try to supply it,\n  and do not be surprised that it appears in the workspace after a run.\n- **The spike rows are dropped, not down-weighted.** `MODE='clean'` removes ~9% of the training rows\n  from TabFM's context entirely. Their contribution comes back only as the scalar `off` added in\n  `postprocess`. `MODE='direct'`, `'resid'` and `'winsor'` are the alternatives that were tried and\n  left in the file; changing `MODE` changes what `postprocess` must do, and the two are coupled.\n- **`ALPHA=1.0` means the analytic base does not appear directly in the output** — it reaches the\n  prediction only through the feature TabFM conditions on. Lowering `ALPHA` blends the raw LAD fit\n  back in.\n- **`OFF_SHRINK=0.05` is a fixed 5% shrink**, not the `'auto'` variance-based rule also implemented\n  on the same line; `'auto'` would compute `off²/(off²+se²)`.\n- `SETS` in `engineer` lists a dozen feature subsets explored during the run; only `FEATS='base'` is\n  live. The engineered columns are all terms of the closed form — dropping them and giving TabFM the\n  six raw columns alone (`'rawonly'`) costs about 60 RMSE.\n","package":[],"derivations":[]},{"id":"heloc","name":"heloc","short_name":"heloc","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.197733,"plain_note":null,"n_train":6972,"n_test":3487,"n_folds":9,"thresholds":null,"summary":"HELOC (FICO) credit-risk classification: 23 integer bureau columns, 6972 training rows, scored as 1 − AUC (lower is better). The prediction is made entirely by the frozen TabFM in-context model; the pipeline is a thin, deliberately minimal wrapper around it and the wrapper's whole content is three decisions. First, the feature view. TabFM is run with a single normalisation, `norm_methods=[\"quantile\"]`, instead of…","score":0.197291,"gain_pct":0.223534,"medal":null,"category":"II","lines":150,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["engineer","sample","folds"],"tabfm_kwargs":{"norm_methods":"['quantile']","class_shift":"False"},"helper_functions":["_add"],"helper_ranges":{"_add":[125,136]},"hook_helpers":{"preprocess":[],"engineer":["_add"],"sample":[],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[121,122],"engineer":[139,140],"sample":[143,146],"postprocess":[149,150],"folds":[111,118]},"code":"\"\"\"HELOC (FICO) credit risk: 23 integer bureau columns, 6972 training rows, metric 1-AUC.\n\nValidation: 3x repeated stratified 5-fold (15 fits), set in evaluation 2 and unchanged\nsince. The judge is bit-deterministic -- a repeat of the same pipeline reproduced all 15\nfolds exactly -- so a paired fold-by-fold delta contains no run-to-run noise at all, only\nfold sampling, and its standard error is about 0.0002. Identity pipeline: 0.19591.\nThis pipeline: 0.19463.\n\nThe one large effect in the run is the normalisation. Each view measured on its own:\n\n    quantile 0.19490 < quantile_rtdl 0.19521 < power 0.19579 < robust 0.19598\n    four-view mix 0.19510   |   the shipped default ['none','power'] 0.19591\n\nWhat quantile does is push each column's ranks through the normal quantile function. Doing\nthat map by hand and handing TabFM the result with norm_methods=['none'] reproduces the\nscore (+0.00019 fitted on the training rows, +0.00009 fitted transductively on the query\nrows as well), so neither the 1000-bin grid nor the tie handling is what made it win.\nVarying only the *shape* of the map finds a peak exactly at the normal: a flat uniform map\ncosts +0.00067, a normal map at 80% width +0.00020, and stretching further -- Student-t(4)\n+0.00072, |z|^1.5 +0.00059 -- costs as much again. Ranking the columns is what matters,\nand the normal is the shape to rank them onto.\n\nMixing views is the obvious way to buy ensemble diversity, and it is a trap here: a mix\nonly averages the weaker views back in, and 'none' -- the worst of the five -- is half of\nthe default. quantile alone beats every mix that contains it. Adding a fifth view\n(+0.00004), synthetic crosses (+0.00011), SVD columns (+0.00005), NNLS member weights\n(+0.00006), Platt calibration (+0.00001) and probability averaging (+0.00003) all do\nnothing, several of them at four times the wall time; only two of the diversity knobs\nmatter at all, and in opposite directions -- feat_shuffle_method='none' costs +0.00028,\nclass_shift=False gains 0.00014.\n\nThe context is the model, and on 6972 rows it is already too small to give any of it up:\n\n  max_num_rows=4000, per-member subsampling      +0.00040   three 92% draws, 24 members  +0.00008\n  drop the 5% most-misfit rows                   +0.00116   every row twice              +0.00010\n  drop 3 near-duplicate columns                  +0.00072   3 draws + 25% doubled        +0.00066\n  drop the 396 \"no bureau record\" rows           +0.00878\n\n  50% synthetic context rows                     +0.01504   100% synthetic rows          +0.02526\n\nThose last two are the answer to the obvious follow-up. If removing rows costs roughly in\nproportion to how many go, the gradient points at adding some -- so I interpolated\nsame-class pairs sharing an exact sentinel mask, rounded back to integers. It is the worst\nresult in the run and the damage scales with the dose: TabFM attends over its rows as\nevidence, and a fabricated density is not a smoother prior, it is false testimony. The\ncontext wants every real row, once, and nothing invented.\n\nThe 396-row result is the sharpest of the run: those 396 rows are one point repeated,\nbut 5.5% of the query rows are that same point, and without it in context they have no\nevidence at all. Nothing bought back what removing rows cost -- three draws at 92% gain\nexactly what the missing 8% loses -- so there is one draw of everything. Ordering that\ndraw is nearly free of consequence (sorting by the target itself moves the score by\n0.00008), which is what a permutation-invariant attention over the context should look\nlike; the sort below is worth 0.00005 and is kept only because it costs nothing.\n\nFICO's three sentinels -- -9 no bureau record, -8 no usable value, -7 condition not met --\nare not missing data to TabFM. Blanking all three costs +0.00439 (worse on 15/15 folds),\nblanking only -9 costs +0.00109, and moving each one to the rank its own good-rate implies\ncosts +0.00045. They stay exactly as FICO wrote them. outlier_threshold is inert here:\nraising it to 12 reproduces the score to the last digit on all 15 folds, because a\nquantile view of 5578 rows never reaches the 4 sigma the clipper starts at; lowering it\nto 2 costs +0.00011.\n\nDerived columns, from 0 to 24 of them, are a plateau between 0.19467 and 0.19486, and\nevery larger set is worse (34 columns +0.00047, 47 columns +0.00170 over raw). Under\nquantile normalisation TabFM sees a column only as a rank, so a ratio it could infer adds\nnothing; the exception is a recode that changes the *order*, which is why the single\nderived column kept is inq_mono. MSinceMostRecentInqexcl7days codes \"no inquiries at all\"\nas -8 (good-rate 0.84 against a 0.48 base) and \"an inquiry inside the last 7 days\" as -7\n(0.39), so as shipped its best and its worst case both sort below every real month count.\nOverwriting the raw column with the recode instead of adding it beside costs +0.00127:\nTabFM wants both the code's identity and the corrected ordering. Three more recodes of\nthe same kind, for the -8 in the revolving-credit family, cost +0.00085 -- the dilution\nfrom three extra columns outweighs what they fix, and adding delq_mono beside it costs\n+0.00039. Inside inq_mono the placement of -9 is worth a little: at the bottom of the\norder (-2) rather than left as NaN it gains 0.00004, while placing it at the rank its\ngood-rate implies costs +0.00010 -- consistent with everything else here, a sentinel is\nbetter as a value than as an absence. Moving -7 from just below zero months to just above\nchanges nothing (+0.00002).\n\nRedundancy runs one way only: dropping three near-duplicate columns costs +0.00072, but\nappending a second copy of the strongest column costs +0.00036, and of the strongest five\n+0.00039. TabFM wants the columns the data has, no more and no fewer.\n\nOther models are not a lever. On the dumped out-of-fold predictions: HistGradientBoosting\n0.20204, extra trees 0.20221, random forest 0.20306, quantile + logistic 0.20195, against\nTabFM's 0.19519 on the same folds. Blending the best of them in at its best weight buys\n0.0004, and handing TabFM one as an out-of-fold column is a disaster (+0.00421) -- it\nleans on the summary and inherits the weaker model's mistakes.\n\nEverything above is a paired delta against this configuration on the same 15 folds; the\nrun measured 73 variants and the ones not listed are the ties. Nothing outside the\ntraining fold is ever read, and postprocess returns TabFM's probabilities untouched, so\nTabFM's ranking is the submitted ranking (tabfm_corr 1.000 throughout).\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]   OPTIONAL\n  postprocess(pred, y_orig, X_test)     -> pred\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]            OPTIONAL\n\"\"\"\nimport numpy as np\n\n# One view, the strongest one, on all eight members; the column permutation is the only\n# randomisation left and it is the only one that earns its keep.\nTABFM_KWARGS = {\"norm_methods\": [\"quantile\"], \"class_shift\": False}\n\nSORT_CONTEXT = \"ExternalRiskEstimate\"\n\n\ndef folds(X_train, y_train):\n  \"\"\"3x repeated stratified 5-fold. Three folds left a 0.0035 spread between folds, wide\n  enough to hide everything measured here; repeats average the partition away, and a\n  5-fold context (5578 rows) is also much closer to the 6972 the final fits on.\"\"\"\n  from sklearn.model_selection import RepeatedStratifiedKFold\n  y = y_train.iloc[:, 0] if hasattr(y_train, \"columns\") else y_train\n  rskf = RepeatedStratifiedKFold(n_splits=5, n_repeats=3, random_state=0)\n  return list(rskf.split(np.zeros(len(y)), y))\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _add(X):\n  \"\"\"The 23 raw columns untouched, plus one re-ordered copy of the one column FICO orders\n  backwards. Only the order of these four values matters -- the members rank every column\n  -- so: -8 (\"no inquiries at all\") above every real month count, -7 (\"an inquiry inside\n  the last 7 days\") just below zero, -9 (\"no bureau record\") at the bottom.\"\"\"\n  X = X.copy()\n  q = X[\"MSinceMostRecentInqexcl7days\"]\n  X[\"inq_mono\"] = (q.where(q >= 0)\n                   .mask(q == -8, 40.0)\n                   .mask(q == -7, -1.0)\n                   .mask(q == -9, -2.0))\n  return X\n\n\ndef engineer(X_train, y_train, X_test):\n  return _add(X_train), _add(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"One draw of every training row: every variant that removed rows lost, roughly in\n  proportion to how many, and no amount of extra ensembling bought it back.\"\"\"\n  return [np.argsort(X_train[SORT_CONTEXT].to_numpy(), kind=\"stable\")]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# heloc — final pipeline\n\n## What it does\n\nHELOC (FICO) credit-risk classification: 23 integer bureau columns, 6972 training rows, scored as\n1 − AUC (lower is better). The prediction is made entirely by the frozen TabFM in-context model; the\npipeline is a thin, deliberately minimal wrapper around it and the wrapper's whole content is three\ndecisions.\n\nFirst, the feature view. TabFM is run with a single normalisation, `norm_methods=[\"quantile\"]`,\ninstead of the shipped `[\"none\", \"power\"]` mix. Quantile-normalising pushes each column's ranks\nthrough the normal quantile function, and measured on its own that view beats every other view and\nevery mix containing it — mixing only averages the weaker views back in. `class_shift=False` is the\none other knob that helped.\n\nSecond, the context. `sample()` returns one draw of *every* training row, ordered by\n`ExternalRiskEstimate`. Every variant that removed rows lost roughly in proportion to how many went\n(dropping the 396 \"no bureau record\" rows alone cost +0.0088, because 5.5% of query rows are that\nsame point and without it in context they have no evidence), and adding synthetic interpolated rows\nwas by far the worst result of the run (+0.015 at 50% synthetic). The ordering is nearly free —\nattention over the context is permutation-invariant — and is kept only because it costs nothing.\n\nThird, one derived column. `MSinceMostRecentInqexcl7days` codes \"no inquiries at all\" as −8 (a good\nrisk) and \"an inquiry in the last 7 days\" as −7 (a bad one), so under a rank view its best and worst\ncases both sort below every real month count. `engineer()` adds `inq_mono`, a re-ordered copy that\nplaces −8 above every month count, −7 just below zero and −9 at the bottom, *beside* the raw column\nrather than replacing it. FICO's three sentinels are otherwise left exactly as written — blanking\nthem costs +0.0044. `preprocess` and `postprocess` are identity, so TabFM's probability ranking is\nthe submitted ranking.\n\n`folds()` defines 3× repeated stratified 5-fold (15 fits) so that validation is stable enough to\nresolve the ~0.0002 effects the run was chasing; it does not affect the final test prediction.\n\nValidation score on those folds: 0.19463 (identity pipeline: 0.19591).\n\n## What build.sh builds\n\nNothing. `final/pipeline.py` reads no files — no caches, no fitted artefacts, no precomputed\nfeatures. `build.sh` is a comment and `exit 0`; it takes no time and no disk. `final/build/` is\nempty because no standalone scripts were written during the run: every experiment was a direct edit\nof `pipeline.py` followed by `python judge.py val`.\n\n    bash final/build.sh && python final/run.py\n\n## Things a reader might otherwise get wrong\n\n- **The docstring numbers are paired deltas, not absolute scores.** Every `+0.000xx` in\n  `pipeline.py` is the cost of a variant against this configuration on the same 15 folds. Positive\n  means worse (the metric is 1 − AUC).\n- **The mixed default is not a diversity win here.** The natural instinct is to keep several\n  normalisation views for ensemble diversity; on this task that is strictly worse than the single\n  quantile view, because `none` is half the default mix and is the weakest view of the five.\n- **`inq_mono` is added, not substituted.** Overwriting the raw column with the recode costs\n  +0.00127 — TabFM wants both the sentinel's identity and the corrected ordering. Adding further\n  recodes of the same kind also loses; the plateau of useful derived columns tops out very early.\n- **Other models were measured and rejected.** HistGradientBoosting (0.20204), extra trees, random\n  forest and quantile+logistic all trail TabFM (0.19519 on the same folds); blending buys ~0.0004 and\n  feeding one in as an out-of-fold column costs +0.0042. None of that is in the shipped pipeline.\n- **`run.py` copies `final/pipeline.py` over the workspace `pipeline.py`** and refuses to run if the\n  two differ. They are identical as shipped; if you edit one, reconcile both.\n","package":[],"derivations":[]},{"id":"hiva_agnostic","name":"hiva_agnostic","short_name":"hiva_agnostic","benchmark":"TabArena","suite":"tabarena_multiclass","suite_label":"TabArena Multiclass Classification","domain":"TabArena Multiclass Classification","metric_label":"Log-Loss ↓","lower_is_better":true,"plain":0.206037,"plain_note":null,"n_train":2563,"n_test":1282,"n_folds":9,"thresholds":null,"summary":"The task is 2563 molecules × 1617 binary substructure bits, three classes with a very lopsided prior (CA 28 / CM 62 / CI 2473), scored by log loss. The run's central measurement is that TabFM's output carries signal in only one of its two independent directions: **active-vs-inactive** (CA+CM vs CI) is noise here — TabFM's AUC on it averages 0.49 across every representation tried, and so does every classical baseline…","score":0.177883,"gain_pct":13.664536,"medal":null,"category":"II","lines":249,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["engineer","sample","postprocess"],"tabfm_kwargs":{"max_num_rows":"600","outlier_threshold":"2.0"},"helper_functions":["_dump","_match","_squash"],"helper_ranges":{"_dump":[184,197],"_match":[200,208],"_squash":[211,212]},"hook_helpers":{"preprocess":[],"engineer":[],"sample":[],"postprocess":["_dump","_match","_squash"]},"hook_ranges":{"preprocess":[96,97],"engineer":[100,151],"sample":[154,181],"postprocess":[215,249]},"code":"\"\"\"hiva_agnostic: 2563 rows x 1617 binary substructure bits, 3 classes (CA 28 / CM 62 / CI 2473).\n\nTHE FINDING. TabFM's three-class output contains two directions that behave in opposite ways, and\nthe whole run turns on separating them and treating each on its own terms.\n\n  * **active-vs-inactive (CA+CM vs CI): no information.** TabFM's AUC on it is 0.42-0.60, mean\n    0.49, across every representation and context tried in evals 4-65. LR, RF, ExtraTrees,\n    BernoulliNB, Tanimoto-kNN, Tanimoto-SVM, SVD+LR, IDF-weighted, row-normalised, rare-only and\n    common-only bits all agree at 0.43-0.55, and only 6 of the 1617 bits reach chi2 p<0.01 where\n    16 are expected by chance. Letting this direction move the prediction is strictly harmful, in\n    all six runs tested: 0.17389 -> 0.17395 -> 0.17407 -> 0.17433 -> 0.17460 as its bound grows.\n  * **CA-vs-CM among the actives: real.** TabFM ranks CA above CM at AUC 0.55-0.67, positive in all\n    33 archived configurations. A permutation test that reshuffles CA/CM among the 90 active\n    validation rows -- selection and fitting stay inside the training fold, so this is an honest\n    out-of-fold null -- puts the log-loss gain at +1.2e-3 against a null sd of 6.9e-4, z=+2.7,\n    p=0.0009 at the final configuration (AUC 0.675, gain +2.1e-3 against a null sd of 1.2e-3).\n    And it passes the test the undecomposed calibrator failed: leave-one-fold-out fitting of the\n    bounds scores 0.17301 out of fold against 0.17389 for the prior, where the undecomposed\n    calibrator scored 0.17414 -- worse than doing nothing.\n\nThat asymmetry makes sense. CA-vs-CM is a potency split *inside* the actives, 28 against 62, and\nTabFM sees 18 and 42 of them in context -- a far better-posed in-context problem than 3.5% actives\nagainst 96.5% inactives. It also explains the published baselines: TabFM 0.206 and TabFM-Ensemble\n0.176 against a constant-prior 0.17389, i.e. an undifferentiated TabFM has nothing to add here.\n\nTwo consequences drive the design. postprocess decomposes TabFM's output into the two log-odds\ndirections, all but mutes the uninformative one and amplifies the informative one. And engineer\nselects features *for the direction that carries signal*: 64 bits ranked by chi2 on CA-vs-CM among\nthe fold's own actives. That was worth 0.17348 -> 0.17250; K = 16/32/48/64/96/192 gives\n0.17343/0.17270/0.17265/0.17250/0.17304/0.17270. Stabilising the selection makes it worse -- a\nsupport floor of 4 gives 0.17344 and bagging the chi2 over 20 bootstraps 0.17330 -- so the signal\nsits in low-support bits, and the held-out permutation test is what says it is nonetheless real.\n\n  engineer     32 TruncatedSVD components of the bit matrix (fit on the fold's train+test features,\n               no labels) + popcount + 64 CA-vs-CM chi2 bits. The SVD view is what carries the\n               CA-vs-CM signal on its own: AUC 0.58-0.65 against 0.52-0.58 for bit-based views.\n  sample       24 draws of 80% of the rows, with the rare classes repeated inside each draw until\n               CA and CM are equally represented (CA ~14x, CM ~6x). Repetition up-weights the CA/CM\n               contrast while leaving the CI context intact -- worth 0.17235 -> 0.17179 -- and\n               balancing the two rare classes against each other is worth a further 0.17179 ->\n               0.17132. Simply *removing* CI rows instead (6 inactives per active) is worse,\n               0.17366; repetition strength 3x/6x/12x gives 0.17184/0.17132/0.17173. max_num_rows=600 pins each of the 8 members to a 600-row\n               context, so a member sees the same amount of data in the 1708-row CV folds as in the\n               2563-row final folds and the CV measurement transfers -- 1200 and unlimited both\n               measured worse (0.17272, 0.17261). More draws sharpen the CA-vs-CM signal\n               specifically: AUC 0.62 / 0.64 / 0.65 at 4 / 8 / 12 draws.\n  postprocess  prior-match; split into u = active-vs-inactive log odds and v = CA-vs-CM log ratio,\n               both as deviations from the training prior; bound each with M*tanh(A*z/M) at\n               (Mu, Au) = (0.02, 2.0) and (Mv, Av) = (0.9, 50.0); rebuild and prior-match again.\n\nOn tabfm_corr, which reads ~0.2 here. Nothing but TabFM predicts: the output is a function of two\nlog-odds functionals of TabFM's own probabilities and the training class frequencies. The audit is\nlow because separating those directions needs an off-diagonal re-weighting -- the same thing\nTabFM's own multiclass_calibration_method='vector' does -- and no per-column-monotone map can\nsuppress z_CA + z_CM while amplifying z_CA - z_CM when the two are positively correlated. The\nmeasurement the skill notes prescribe instead: a postprocess that ignores `pred` and returns the\nprior scores 0.17389, against 0.17250 for this pipeline. Buying a higher audit number costs real\nscore -- Mu = 0.10 lifts the per-column minimum to 0.57 and the loss to 0.17295.\n\nOn the bounds. Av is flat from 30 upward, i.e. the transform has become the *sign* of TabFM's\nCA-vs-CM deviation applied at a fixed size, so the only parameter that matters is Mv, and it has a\nclear interior optimum: 0.7/0.8/0.9/1.0/1.2 give 0.17111/0.17098/0.17091/0.17090/0.17104. Mv is\nworth choosing carefully rather than maximising, because under the permutation null -- no signal --\nthis transform *costs* 1.8e-3 at this scale, and it only pays because the signal is real. The\nobserved optimum is biased upward by the fitting, so Mv is set to 0.9 rather than the CV-optimal\n1.0, shrinking by the (1 - 1/z^2) = 0.9 factor that z = 3.25 implies. All three folds now sit at or\nbelow their own priors (0.17387/0.16823/0.17077 against 0.17443/0.17362/0.17362).\n\nProgression: 0.17488 (499 bits) -> 0.17419 (32 chi2 bits + crosses) -> 0.17390 (SVD-16) -> 0.17362\n(bounded deviation) -> 0.17348 (decomposed) -> 0.17265 (CA/CM-targeted bits) -> 0.17235 (retuned\nbounds) -> 0.17179 (actives repeated) -> 0.17132 (CA/CM balanced in context) -> 0.17096 (Mv 0.9).\nConstant prior 0.17389; published TabFM 0.206, TabFM-Ensemble 0.176.\n\nIntent for this eval: the final configuration, with the prose brought in line with the constants;\nthe OOF dumps predict 0.17091.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nN_SVD = 32\nK_CACM = 64    # raw bits selected by chi2 on CA-vs-CM *among the actives* (0 = none)\nMIN_SUPP = 1   # support floor for a selectable bit; 4 measured worse (0.17344), the signal is in rare bits\nSEL_BAG = 1    # bootstrap resamples to average the chi2 over; 20 measured worse (0.17330)\nUSE_POPCOUNT = 1\nN_DRAWS = 24\nBAL_RATIO = 0.0   # >0: inactives per active inside one context; 0: plain bagging\nACT_REP = 6       # copies of the active rows inside each draw; 3/6/12 -> 0.17184/0.17132/0.17173 balanced\nRARE_BALANCE = 1  # 1: repeat each rare class to the same count, so CA and CM are balanced\nDRAW_FRAC = 0.8\nMU_DEV, AU_DEV = 0.02, 2.0   # bound / slope for the active-vs-inactive log odds (uninformative)\nMV_DEV, AV_DEV = 0.90, 50.0  # bound / slope for the CA-vs-CM log ratio -- the direction that carries signal\n\nTABFM_KWARGS = {\"max_num_rows\": 600, \"outlier_threshold\": 2.0}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  \"\"\"Low-rank view of the bit matrix, fit on this fold's features only (no labels anywhere).\"\"\"\n  from sklearn.decomposition import TruncatedSVD\n  cols = [c for c in X_train.columns if c != \"row_id\"]\n  A = X_train[cols].to_numpy(dtype=np.float32)\n  B = X_test[cols].to_numpy(dtype=np.float32)\n  k = int(min(N_SVD, A.shape[1] - 1, len(A) - 1))\n  sv = TruncatedSVD(k, random_state=0).fit(np.vstack([A, B]))\n  names = pd.Index([\"svd_%d\" % i for i in range(k)], dtype=object)   # dtype=object: a str Index\n  tr = pd.DataFrame(sv.transform(A), columns=names, index=X_train.index)   # built inside the hook\n  te = pd.DataFrame(sv.transform(B), columns=names, index=X_test.index)    # sandbox is pyarrow-\n  if K_CACM > 0:                          # bits picked for the one direction that carries signal\n    from sklearn.feature_selection import chi2\n    lab = pd.Series(y_train).astype(str).to_numpy()\n    major = pd.Series(lab).value_counts().index[0]\n    act = lab != major\n    rare = pd.Series(lab[act]).value_counts().index\n    if act.sum() > 4 and len(rare) > 1:\n      t = (lab[act] == rare[0]).astype(int)\n      Aa = A[act]\n      supp = Aa.sum(axis=0)\n      ok = (supp >= MIN_SUPP) & (supp <= len(Aa) - MIN_SUPP)\n      sc = np.full(A.shape[1], -np.inf)\n      if ok.any() and 0 < t.sum() < len(t):\n        if SEL_BAG > 1:   # average the score over bootstrap resamples: the selection is fit on ~60\n          rs = np.random.default_rng(7)   # actives, and a single chi2 on that is very unstable\n          acc = np.zeros(int(ok.sum()))\n          for _ in range(SEL_BAG):\n            i = rs.choice(len(Aa), len(Aa), replace=True)\n            if 0 < t[i].sum() < len(i):\n              col = Aa[i][:, ok]\n              good = col.std(axis=0) > 0\n              sub = np.zeros(int(ok.sum()))\n              if good.any():\n                sub[good] = chi2(col[:, good], t[i])[0]\n              acc += sub\n          sc[ok] = acc / SEL_BAG\n        else:\n          col = Aa[:, ok]\n          good = col.std(axis=0) > 0\n          sub = np.zeros(int(ok.sum()))\n          if good.any():\n            sub[good] = chi2(col[:, good], t)[0]\n          sc[ok] = sub\n      pick = np.sort(np.argsort(-sc, kind=\"mergesort\")[:K_CACM])\n      for i in pick:\n        tr[\"b%d\" % i] = A[:, i]\n        te[\"b%d\" % i] = B[:, i]\n  if USE_POPCOUNT:                                                         # backed, and the judge\n    tr[\"n_bits\"] = A.sum(axis=1)                                           # host cannot unpickle it\n    te[\"n_bits\"] = B.sum(axis=1)\n  return tr, te\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Bagged draws: the judge averages one full TabFM pass per draw, and different row subsets\n  decorrelate the members. max_num_rows also fixes each member's context at 600 rows, so a member\n  sees the same amount of data in the 1708-row CV folds as in the 2563-row final folds.\"\"\"\n  n = len(X_train)\n  rng = np.random.default_rng(12345)\n  if BAL_RATIO > 0:                       # enrich the context in actives: more CA/CM pairs in view\n    y = pd.Series(y_train).astype(str).to_numpy()\n    major = pd.Series(y).value_counts().index[0]\n    pos, neg = np.where(y != major)[0], np.where(y == major)[0]\n    m = int(min(len(neg), round(BAL_RATIO * len(pos))))\n    return [np.sort(np.concatenate([pos, rng.choice(neg, m, replace=False)])) for _ in range(N_DRAWS)]\n  k = max(2, int(round(DRAW_FRAC * n)))\n  out = [np.sort(rng.choice(n, k, replace=False)) for _ in range(N_DRAWS)]\n  if ACT_REP > 1:                         # repeat the actives: the CI context is kept intact, but\n    y = pd.Series(y_train).astype(str).to_numpy()          # TabFM sees each CA/CM pair more often\n    vc = pd.Series(y).value_counts()\n    major = vc.index[0]\n    rare = [c for c in vc.index if c != major]\n    top = max(int(vc[c]) for c in rare) if rare else 0\n    add = []\n    for c in rare:                        # RARE_BALANCE: the rarer of CA/CM gets proportionally\n      r = ACT_REP - 1                     # more copies, so the two are equally represented\n      if RARE_BALANCE and int(vc[c]) > 0:\n        r = max(1, int(round(ACT_REP * top / int(vc[c])))) - 1\n      add.append((c, r))\n    out = [np.sort(np.concatenate([d] + [d[y[d] == c] for c, r in add for _ in range(r)])) for d in out]\n  return out\n\n\ndef _dump(pred, y_orig, X_test):\n  \"\"\"Record TabFM's raw output so the calibration can be re-fitted offline against the OOF rows\n  instead of by spending evaluations on it. No-op unless a dumps/ directory already exists.\"\"\"\n  import os\n  import pickle\n  import time\n  if not os.path.isdir(\"dumps\"):\n    return\n  rid = X_test[\"row_id\"].to_numpy() if \"row_id\" in X_test.columns else np.arange(len(X_test))\n  rec = {\"pred\": np.asarray(pred, dtype=float), \"cols\": [str(c) for c in pd.DataFrame(pred).columns],\n         \"row_id\": np.asarray(rid),\n         \"prior\": {str(k): int(v) for k, v in pd.Series(y_orig).astype(str).value_counts().items()}}\n  with open(\"dumps/p_%.6f.pkl\" % time.time(), \"wb\") as f:\n    pickle.dump(rec, f)\n\n\ndef _match(P, pr, iters=300):\n  \"\"\"Scale the columns of P so its column means hit the prior pr (Saerens-style prior matching).\"\"\"\n  c = np.ones(P.shape[1])\n  for _ in range(iters):\n    Q = P * c\n    Q /= np.maximum(Q.sum(axis=1, keepdims=True), 1e-300)\n    c *= (pr / np.maximum(Q.mean(axis=0), 1e-12)) ** 0.7\n  Q = P * c\n  return Q / np.maximum(Q.sum(axis=1, keepdims=True), 1e-300)\n\n\ndef _squash(x, M, A):\n  return M * np.tanh(A * x / M) if M > 0 else np.zeros_like(x)\n\n\ndef postprocess(pred, y_orig, X_test):\n  \"\"\"Returns a plain ndarray in sorted-class order: the judge re-attaches the class columns, and a\n  pandas 3 str/pyarrow column Index built here fails to unpickle on the judge's side.\"\"\"\n  try:\n    _dump(pred, y_orig, X_test)\n  except Exception:\n    pass\n  df = pd.DataFrame(pred)\n  have = [str(c) for c in df.columns]\n  cols = sorted(have)\n  P = np.column_stack([np.asarray(df.iloc[:, have.index(c)], dtype=float) for c in cols])\n  vc = pd.Series(y_orig).astype(str).value_counts()\n  pr = np.array([float(vc.get(c, 0.0)) for c in cols])\n  pr = np.maximum(pr / max(pr.sum(), 1e-12), 1e-9)\n  pr = pr / pr.sum()\n  P = _match(np.clip(P, 1e-9, 1.0), pr)\n\n  if len(cols) != 3:                      # `check` runs on a slice that need not hold every class\n    z = np.log(np.clip(P, 1e-12, 1.0)) - np.log(pr)[None, :]\n    Q = pr[None, :] * np.exp(_squash(z, MV_DEV, AV_DEV))\n  else:\n    j = int(np.argmax(pr))                # the majority class; the other two are the rare pair\n    a, b = [i for i in range(3) if i != j]\n    pa, pi = P[:, a] + P[:, b], P[:, j]\n    u = np.log(pa / pi) - np.log((pr[a] + pr[b]) / pr[j])                    # active vs inactive\n    v = np.log(np.clip(P[:, a], 1e-12, 1.0) / np.clip(P[:, b], 1e-12, 1.0)) \\\n        - np.log(pr[a] / pr[b])                                              # CA vs CM\n    qa = 1.0 / (1.0 + np.exp(-(np.log((pr[a] + pr[b]) / pr[j]) + _squash(u, MU_DEV, AU_DEV))))\n    f = 1.0 / (1.0 + np.exp(-(np.log(pr[a] / pr[b]) + _squash(v, MV_DEV, AV_DEV))))\n    Q = np.empty_like(P)\n    Q[:, a], Q[:, j], Q[:, b] = qa * f, 1.0 - qa, qa * (1.0 - f)\n\n  Q = Q / Q.sum(axis=1, keepdims=True)\n  Q = np.clip(_match(Q, pr), 1e-7, 1.0)\n  return Q / Q.sum(axis=1, keepdims=True)\n","readme":"# hiva_agnostic — final pipeline\n\n## What it does\n\nThe task is 2563 molecules × 1617 binary substructure bits, three classes with a very lopsided prior\n(CA 28 / CM 62 / CI 2473), scored by log loss. The run's central measurement is that TabFM's output\ncarries signal in only one of its two independent directions: **active-vs-inactive** (CA+CM vs CI) is\nnoise here — TabFM's AUC on it averages 0.49 across every representation tried, and so does every\nclassical baseline — while **CA-vs-CM among the actives** is real (AUC 0.55–0.67, positive in all 33\narchived configurations; an out-of-fold permutation test over the CA/CM labels puts the log-loss gain\nat z ≈ +2.7). The whole design follows from treating those two directions separately.\n\nTabFM remains the only predictor. Around it: `engineer` builds a 32-component TruncatedSVD view of\nthe bit matrix (fit on the fold's train+test features, no labels), plus a popcount, plus 64 raw bits\nchosen by chi2 on the CA-vs-CM contrast *among that fold's actives* — features selected for the\ndirection that carries signal rather than for the class label as a whole. `sample` returns 24 draws\nof 80% of the rows, with the rare classes repeated inside each draw until CA and CM are equally\nrepresented (~14× and ~6×), which up-weights the CA/CM contrast in context while leaving the CI\nbackground intact; `max_num_rows=600` pins every ensemble member to the same context size in the\n1708-row CV folds as in the 2563-row final folds, so the CV measurement transfers. `postprocess`\nprior-matches TabFM's probabilities, decomposes them into the active-vs-inactive log odds `u` and the\nCA-vs-CM log ratio `v` (both as deviations from the training prior), squashes each with\n`M·tanh(A·z/M)` — `u` nearly muted at M=0.02, `v` amplified at M=0.9, A=50 — rebuilds the three\nprobabilities and prior-matches again. `Mv` is set to 0.9 rather than the CV-optimal 1.0, shrunk by\nthe (1 − 1/z²) factor the permutation-test z implies.\n\nCross-validated log loss went 0.17488 → 0.17096 over the run, against 0.17389 for the constant class\nprior and published baselines of 0.206 (TabFM) and 0.176 (TabFM-Ensemble).\n\n## What build.sh builds\n\nNothing. `final/build.sh` is a comment and `exit 0`: the pipeline reads no files at all. The SVD\nbasis, the chi2 selection and the bagged draws are all fitted inside the hooks on the fold in hand,\nand every tuned constant is a literal in `pipeline.py`. There is no `final/build/` directory because\nno standalone script was ever a prerequisite — the offline analysis during the run produced numbers\nthat were written into the module, not caches. Zero time, zero disk.\n\n    bash final/build.sh && python final/run.py\n\n## Things a reader could get wrong\n\n- **`dumps/` is optional and write-only.** `postprocess` calls `_dump`, which pickles TabFM's raw\n  per-fold output into `dumps/` *if that directory already exists*, and does nothing otherwise. It\n  was used during the run to re-fit the calibration bounds offline against out-of-fold rows without\n  spending evaluations. It never feeds back into a prediction; do not create the directory unless\n  you want the pickles (the archived ones from the search are under `runs_arch/`).\n- **The judge, not `run.py`, supplies the data.** This is a TabArena task\n  (`tabarena:hiva_agnostic`, see `task.json`), so the competition data comes from the harness's\n  TabArena cache under `~/.cache/tabarena`, not from a file in this workspace. `data/train.csv` and\n  `data/test.csv` here are the fold-0 split the search read for exploration.\n- **`postprocess` returns a plain ndarray in sorted-class order**, deliberately: the judge re-attaches\n  the class columns, and a pandas/pyarrow string column Index built inside the hook fails to unpickle\n  on the judge's side. Same reason `engineer` builds its column Index with `dtype=object`.\n- **The three-way decomposition only fires when all three classes are present.** `judge.py check`\n  runs the hooks on a 200-row slice that need not contain CA and CM, so there is a two-class fallback\n  branch; it is not the scored path.\n- **`tabfm_corr` reads ~0.2** for this pipeline. That is expected, not a sign that something other\n  than TabFM is predicting: the output is a function of two log-odds functionals of TabFM's own\n  probabilities, and separating those directions requires an off-diagonal re-weighting that no\n  per-column-monotone audit can score highly. The control measurement is that a `postprocess`\n  ignoring `pred` entirely and returning the prior scores 0.17389, against 0.17250 for this pipeline\n  at the same point in the run.\n","package":[],"derivations":[]},{"id":"houses","name":"houses","short_name":"houses","benchmark":"TabArena","suite":"tabarena_regression","suite_label":"TabArena Regression","domain":"TabArena Regression","metric_label":"RMSE ↓","lower_is_better":true,"plain":0.181622,"plain_note":null,"n_train":13760,"n_test":6880,"n_folds":9,"thresholds":null,"summary":"The task is the California block-group housing data: predict `LnMedianHouseValue` from eight columns, scored by RMSE on the log scale. TabFM makes every prediction; the pipeline only changes what it sees.","score":0.177057,"gain_pct":2.513462,"medal":null,"category":"I","lines":175,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer","postprocess"],"tabfm_kwargs":{"norm_methods":"['power', 'quantile', 'quantile_rtdl', 'robust']","outlier_threshold":"8.0"},"helper_functions":["_densify","_min_dist","_density","_rewrite"],"helper_ranges":{"_densify":[109,112],"_min_dist":[115,124],"_density":[127,145],"_rewrite":[152,163]},"hook_helpers":{"preprocess":[],"engineer":["_densify","_min_dist","_density","_rewrite"],"postprocess":[]},"hook_ranges":{"preprocess":[148,149],"engineer":[166,170],"postprocess":[173,175]},"code":"\"\"\"houses -- California block-group median house value, RMSE on the log scale.\n\nIdentity pipeline: 0.18603.  This one: 0.17979, on the same three folds (folds_sig=f5e648f0).\n23 columns from the original 8; TabFM makes every prediction and postprocess is monotone.\n\nTabFM is already a strong spatial model here -- a HistGradientBoosting fit on the same folds scores\n0.227 against its 0.186 -- so the search was mostly about finding the few things it cannot do rather\nthan helping it with the things it can.  Four rules came out of 91 evaluations:\n\n  1. Aggregating neighbours' *values* always loses.  kNN target encoding (+0.0085), smoothing the\n     context labels toward a neighbourhood mean (+0.0090) or away from it (+0.0023), neighbourhood\n     covariate means (+0.0009), income relative to its neighbourhood (+0.0008).  TabFM already\n     aggregates over its context; doing it in advance only destroys resolution.\n  2. Measuring neighbours' *geometry* always wins.  The density profile is the largest single\n     contributor in the pipeline, and pooling the test coordinates into it is the largest late one.\n  3. Reparameterise, do not append.  Rewriting the four collinear size columns as one level plus three\n     ratios paid where appending the same ratios to the raw table paid nothing.  Only two appended\n     geographic quantities ever survived, distance to the coast and distance to the metros, and both\n     are minima over a reference set -- shapes no amount of attention recovers from two coordinates.\n  4. Hand over the whole profile, not a summary of it.  Ten density scales beat five (-0.00016) and the\n     four sorted metro distances beat their min (-0.00016).  A min over four points discards three.\n\nContribution of each piece, re-measured jointly at this operating point rather than where it was found:\n\n    density profile removed          0.18252   -0.0024\n    size basis -> raw columns        0.18097   -0.0008\n    metro_km removed                 0.18088   -0.0006    (against the 15-column base, 0.18025)\n    norm_methods -> judge default    0.18058   -0.0004    (against the 20-column base, 0.18015)\n    coast_km removed                 0.18060   -0.00035   (against the 15-column base, 0.18025)\n\nClosed, each measured at least twice.  Ensembling: bagged draws, draws that duplicate rather than drop,\nfeature crosses, SVD features, NNLS member weights, and a second target parameterisation (rho=0.995\nbetween the two views, so the best possible blend was -0.00014) all tie or lose; feat_shuffle_method\nand outlier_threshold sit at their best values and every other constructor knob has been measured.\nOutput: a 4% rescale about the mean and a 25% expansion of the top decile put the optimal global scale\nat 1.006 and the optimal tail expansion at 0.07, worth 2e-5 and 4e-5.  Context editing: dropping rows\nloses (0.36% of them is neutral, 1% costs 0.0009), and so does perturbing the labels in either\ndirection -- on this task every row in the context is worth more than any tidying of it.\n\nRejected features, all landing in 0.1803-0.1811: a categorical region key, urban-core distance, an\nedge-of-settlement index, the Central Valley axis, settlement size by single linkage, density as\ncounts-within-radius, a population-weighted market-access index, radii enclosing K households rather\nthan K block groups, support in covariate space, coordinate multiplicity, arclength along the coast,\nsaturating the distance columns, and a spherical density metric.\n\nResolution was the one axis that rewarded tuning past that floor.  Density: 5 scales over k=3..300 give\n0.18025, 5 over k=2..200 give 0.18015, 10 over k=2..300 give 0.18009, 12 over k=1..600 give 0.18025 and\n14 over k=2..300 give 0.18043 -- ten over k=2..300 is a real optimum, since coarser, finer, wider and\nnarrower all lose.  It also removes an arbitrary constant: the two five-scale sets it hedges between\ndiffer by 1e-4 on an axis whose measurement floor is about 2e-4, so picking one of them would have been\npicking a lottery ticket.  Metros: the sorted four beat the min (0.17993 vs 0.18009), six sorted lose\n(0.18004), and splitting the water distance into ocean and bay ties (0.17999) for the third time.\n\n  v87 metro_km replaced by the sorted distances to all four\n      metros   <- BASE                                              0.17993   the resolution finding\n      transfers: a min over four points throws away three of them.\n\n  v88 six metros in the sorted profile                            0.18004   worse; four is still the set\n\n  v89 ocean and bay as two columns instead of their min           0.17999   a tie; the merged min stays,\n      the third time that split has failed to pay.\n\n  v90 'none' dropped from norm_methods   <- BASE                  0.17979   better on all three folds, and\n      it completes a trend: dropping 'none' cost 0.0007 at 8 columns, 3e-5 at 15, and pays 1.4e-4 at 23.\n      The unnormalised view earns its slots on a small tidy table and stops earning them once two thirds\n      of the columns are long-tailed kilometre distances.\n\n  v91 'power' dropped as well                                     0.18035   clearly worse; the four-entry\n      cycle power / quantile / quantile_rtdl / robust is the setting, two members each.\n\"\"\"\nimport numpy as np\n\nTABFM_KWARGS = {'norm_methods': ['power', 'quantile', 'quantile_rtdl', 'robust'],\n                'outlier_threshold': 8.0}\n\nDENS_KS = (2, 3, 6, 10, 20, 30, 60, 100, 200, 300)   # scales the density profile is sampled at\n\n_METRO_PTS = np.array([(34.05, -118.24), (37.77, -122.42), (32.72, -117.16), (37.34, -121.89)])\n\n# the shoreline of San Francisco / San Pablo / Suisun bay, anticlockwise from the Golden Gate.  Folded\n# into the coastline rather than kept as its own column: as a column it lost, folded in it ties on\n# score and puts Berkeley 3.6 km from the water instead of 25.\n_BAY_PTS = np.array([\n    (37.81, -122.48), (37.79, -122.39), (37.72, -122.38), (37.62, -122.36), (37.55, -122.27),\n    (37.48, -122.20), (37.44, -122.10), (37.42, -121.98), (37.47, -121.94), (37.55, -122.03),\n    (37.62, -122.10), (37.70, -122.17), (37.78, -122.25), (37.86, -122.31), (37.92, -122.35),\n    (37.98, -122.40), (38.02, -122.28), (38.07, -122.25), (38.06, -122.13), (38.03, -122.03),\n    (38.05, -121.90), (38.02, -121.80)])\n\n# the California coastline, north to south, following the named headlands and bays\n_COAST_PTS = np.array([\n    (42.00, -124.21), (41.75, -124.20), (41.53, -124.08), (41.29, -124.10), (41.06, -124.14),\n    (40.80, -124.16), (40.62, -124.31), (40.44, -124.41), (40.20, -124.35), (40.03, -124.07),\n    (39.83, -123.90), (39.63, -123.78), (39.45, -123.81), (39.20, -123.77), (38.95, -123.74),\n    (38.77, -123.53), (38.60, -123.35), (38.45, -123.13), (38.33, -123.05), (38.15, -122.97),\n    (38.00, -123.02), (37.91, -122.68), (37.81, -122.48), (37.66, -122.50), (37.46, -122.44),\n    (37.24, -122.42), (37.08, -122.27), (36.95, -122.03), (36.85, -121.81), (36.72, -121.80),\n    (36.60, -121.89), (36.45, -121.92), (36.31, -121.89), (36.14, -121.65), (36.02, -121.55),\n    (35.85, -121.42), (35.64, -121.19), (35.45, -120.94), (35.37, -120.86), (35.25, -120.75),\n    (35.14, -120.64), (34.98, -120.65), (34.90, -120.67), (34.70, -120.60), (34.55, -120.65),\n    (34.45, -120.47), (34.44, -120.05), (34.41, -119.69), (34.35, -119.47), (34.27, -119.29),\n    (34.15, -119.21), (34.09, -119.06), (34.05, -118.85), (34.03, -118.68), (34.01, -118.50),\n    (33.94, -118.43), (33.80, -118.42), (33.74, -118.40), (33.75, -118.19), (33.70, -118.08),\n    (33.65, -118.00), (33.60, -117.90), (33.52, -117.78), (33.46, -117.70), (33.42, -117.62),\n    (33.30, -117.50), (33.20, -117.39), (33.05, -117.31), (32.96, -117.27), (32.85, -117.27),\n    (32.72, -117.25), (32.58, -117.13), (32.53, -117.12)])\n\n\ndef _densify(p, n=20):\n  \"\"\"polyline vertices plus interpolated points, so a min over points is a min over the line\"\"\"\n  t = np.linspace(0.0, 1.0, n, endpoint=False)[:, None, None]\n  return np.vstack([(p[:-1][None] * (1 - t) + p[1:][None] * t).reshape(-1, 2), p[-1:]])\n\n\ndef _min_dist(lat, lon, c, chunk=2048):\n  \"\"\"km to the nearest of a set of reference points, in row blocks: the coastline is 1862 points and\n  the whole-fold cross product would be a 200 MB temporary for no reason\"\"\"\n  out = np.empty(len(lat))\n  for i in range(0, len(lat), chunk):\n    la, lo = lat[i:i + chunk], lon[i:i + chunk]\n    dlat = la[:, None] - c[None, :, 0]\n    dlon = (lo[:, None] - c[None, :, 1]) * np.cos(np.deg2rad(la))[:, None]\n    out[i:i + chunk] = np.sqrt(dlat ** 2 + dlon ** 2).min(1)\n  return 111.0 * out\n\n\ndef _density(Xtr, Xte, ks):\n  \"\"\"km to the k-th nearest block group, self excluded, over the pooled train+test coordinates.\n\n  Pooling the test coordinates -- their features, never their targets -- is worth -0.0006: half again\n  as many points to estimate from, and one estimator instead of two subtly different ones.  Weighting\n  the neighbours by their household count is worse: census block groups are already drawn to hold\n  similar populations, so counting them is the population density and weighting adds boundary noise.\"\"\"\n  from sklearn.neighbors import KDTree\n  s = np.array([1.0, np.cos(np.deg2rad(35.6))])\n  P = np.c_[Xtr.Latitude.to_numpy(float), Xtr.Longitude.to_numpy(float)] * s\n  Q = np.c_[Xte.Latitude.to_numpy(float), Xte.Longitude.to_numpy(float)] * s\n  R = np.vstack([P, Q])\n  ks = [min(k, len(R) - 1) for k in ks]\n  kmax = max(ks)\n  d, i = KDTree(R).query(R, k=kmax + 1)\n  selfm = i == np.arange(len(R))[:, None]   # co-located blocks tie at distance 0: self is not always column 0\n  selfm[~selfm.any(1), -1] = True\n  d = d[~selfm].reshape(len(d), kmax)\n  return {f'dens{k}_km': (111.0 * d[:len(P), k - 1], 111.0 * d[len(P):, k - 1]) for k in ks}\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef _rewrite(d):\n  \"\"\"the four collinear size columns as one level plus three ratios, plus the two geographic minima\"\"\"\n  o = d.drop(columns=['TotalRooms', 'TotalBedrooms', 'Population'])\n  o['rooms_per_hh'] = d.TotalRooms / d.Households      # dwelling size\n  o['bed_per_room'] = d.TotalBedrooms / d.TotalRooms   # dwelling type, orthogonal to its size\n  o['pop_per_hh'] = d.Population / d.Households        # household size\n  la, lo = d.Latitude.to_numpy(float), d.Longitude.to_numpy(float)\n  o['coast_km'] = _min_dist(la, lo, np.vstack([_densify(_COAST_PTS), _densify(_BAY_PTS)]))\n  m = np.sort(np.stack([_min_dist(la, lo, _METRO_PTS[j:j + 1]) for j in range(len(_METRO_PTS))]), axis=0)\n  for j in range(len(_METRO_PTS)):                       # the four expensive coastal markets, sorted:\n    o[f'metro{j + 1}_km'] = m[j]                         # metro1_km is the old min column\n  return o\n\n\ndef engineer(X_train, y_train, X_test):\n  A, B = _rewrite(X_train), _rewrite(X_test)\n  for name, (a, b) in _density(X_train, X_test, DENS_KS).items():\n    A[name], B[name] = a, b\n  return A, B[A.columns]\n\n\ndef postprocess(pred, y_orig, X_test):\n  y = np.asarray(y_orig, dtype=float).ravel()          # the target is censored: 13.1224 is ln(500001)\n  return np.clip(pred, y.min(), y.max())               # and 4.7% of the rows sit exactly on it\n","readme":"# houses — TabFM pipeline (pipeline_093)\n\n## What it does\n\nThe task is the California block-group housing data: predict `LnMedianHouseValue` from eight columns,\nscored by RMSE on the log scale. TabFM makes every prediction; the pipeline only changes what it sees.\n\nTwo edits to the table, both geometric. First a **reparameterisation**: the four collinear size columns\n(`TotalRooms`, `TotalBedrooms`, `Population`, `Households`) become one level (`Households`) plus three\nratios — rooms per household, bedrooms per room, people per household — rather than being appended\nalongside the originals. Second, **neighbourhood geometry**, which is the part TabFM cannot construct\nfor itself from two coordinates:\n\n- a **density profile**: the great-circle distance to the *k*-th nearest block group for ten scales\n  *k* = 2, 3, 6, 10, 20, 30, 60, 100, 200, 300, computed on a KD-tree over the **pooled train + test**\n  coordinates (features only — no test target is ever touched), self-matches excluded. Ten scales\n  handed over whole beat any summary of them.\n- **`coast_km`**: kilometres to the nearest point of a hand-written California coastline polyline, with\n  the San Francisco / San Pablo / Suisun bay shoreline folded into the same reference set. Both\n  polylines are densified with interpolated vertices so the minimum over points approximates a minimum\n  over the line.\n- **`metro1..4_km`**: distances to Los Angeles, San Francisco, San Diego and San Jose, **sorted**\n  ascending, so the model gets the whole profile instead of just the nearest.\n\nThat takes 8 columns to 23. TabFM's own knobs are set to `norm_methods = [power, quantile,\nquantile_rtdl, robust]` (the unnormalised `none` view is dropped — it stops paying once two thirds of\nthe columns are long-tailed distances) and `outlier_threshold = 8.0`. Postprocessing is a single\nmonotone step: clip predictions to the observed training target range, because the target is censored\nat ln(500001) = 13.1224 and about 4.7% of rows sit exactly on that cap.\n\nNo target-derived neighbourhood feature is used anywhere. kNN target encoding, label smoothing toward\nor away from a neighbourhood mean, and neighbourhood covariate means were all measured and all lost:\nTabFM already aggregates over its context, so pre-aggregating only destroys resolution.\n\nScores: CV 0.17979 (identity baseline 0.18603 on the same folds, `folds_sig=f5e648f0`); final test\n0.177057, mean over the 9 TabArena folds, against published TabFM baselines of 0.181622 (plain) and\n0.181461 (ensemble).\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no cache, no auxiliary file and no artefact of any kind — every feature is\ncomputed in-process from the `X_train` / `X_test` frames the judge passes in, and the coastline, bay\nand metro coordinates are literals in the module (hand-written, not derived from data). `build.sh`\ntherefore prints one line and exits 0: no runtime, no disk. `final/build/` is empty for the same\nreason; the scripts written during the run (`expl.py`, `expl2.py`, `kw.py`) were exploration that\nprinted to the terminal and produced no file.\n\n    cd <this workspace> && bash final/build.sh && python final/run.py\n\n## Things a reader could get wrong\n\n- **The density profile pools the test coordinates.** This is deliberate and worth −0.0006: it uses\n  test *features* only, never test targets, and gives one density estimator instead of two slightly\n  different ones. It does mean the feature values for a training row depend on which test rows are\n  present, so results are not identical if you change the test split.\n- **The self-exclusion in `_density` is not \"drop column 0\".** Co-located block groups tie at distance\n  0, so the code masks the neighbour whose index equals the row's own, with a fallback for rows where\n  no such tie appears in the retrieved *k*.\n- **Distances are a flat-earth approximation**, `111 km/degree` with a `cos(lat)` correction on\n  longitude (the KD-tree uses a fixed `cos(35.6°)` scaling). A spherical metric was tried and did not\n  help; do not \"fix\" this expecting an improvement.\n- **`metro1_km` is the old single min column** — the sorted profile is a superset, not a replacement of\n  a different quantity.\n- Runtime for the full 9-fold final was ~131 s wall clock at 8 estimators (≈19 s preprocess, ≈97 s\n  predict) on the run's GPU; a single `python final/run.py` is a fraction of that.\n","package":[],"derivations":[]},{"id":"HR_Analytics_Job_Change_of_Data_Scientists","name":"HR_Analytics_Job_Change_of_Data_Scientists","short_name":"HR_Analytics_Job_Change_of_Data_Scientists","benchmark":"TabArena","suite":"tabarena_binary","suite_label":"TabArena Binary Classification","domain":"TabArena Binary Classification","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.193755,"plain_note":null,"n_train":12772,"n_test":6386,"n_folds":9,"thresholds":null,"summary":"TabFM does all the predicting; the pipeline only decides how the table is represented to it. The raw HR table is mostly strings, several of which are ordinal but would be coded arbitrarily by TabFM's \"appearance-order\" categorical encoder, so each of those is rewritten as a number that respects its natural order: `experience` (`<1` → 0, `>20` → 21), `last_new_job` (`never` → 0, `>4` → 5), `education_level` (Primary…","score":0.193259,"gain_pct":0.255993,"medal":null,"category":"II","lines":140,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["preprocess","engineer"],"tabfm_kwargs":{"n_feature_crosses":"'sqrt'","permute_categorical":"True","norm_methods":"['none', 'power', 'quantile', 'quantile_rtdl', 'robust']"},"helper_functions":["_num","_plain","_feat","_target_encode"],"helper_ranges":{"_num":[29,34],"_plain":[37,44],"_feat":[51,67],"_target_encode":[70,87]},"hook_helpers":{"preprocess":[],"engineer":["_num","_plain","_feat","_target_encode"],"postprocess":[]},"hook_ranges":{"preprocess":[47,48],"engineer":[90,136],"postprocess":[139,140]},"code":"\"\"\"HR job-change, 1-auc.\n\nOrdinal strings -> their natural numeric order (TabFM's 'appearance' encoder would code them\narbitrarily); log1p on skewed training_hours. TABFM_KWARGS: feature crosses + all five\nnormalisations + categorical permutation, all measured one at a time (0.19745 -> 0.19583).\n\nIntent of this edit: FEATS toggles extra columns. Testing out-of-fold target encoding of `city`\n(122 levels, only its development index reaches TabFM today).\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'n_feature_crosses': 'sqrt', 'permute_categorical': True,\n                'norm_methods': ['none', 'power', 'quantile', 'quantile_rtdl', 'robust']}\n\nFEATS = {'city_te': False, 'city_cnt': False, 'miss': True, 'inter': False, 'drop_city': False, 'na_flags': False, 'na_level': False, 'size_rank': True}\nDROP = []\n\nTE_FOLDS = 5\nTE_PRIOR = 20.0\n\n_EXP = {'<1': 0.0, '>20': 21.0}\n_LNJ = {'never': 0.0, '>4': 5.0}\n_SIZE = {'<10': 5.0, '10/49': 30.0, '50-99': 75.0, '100-500': 300.0,\n         '500-999': 750.0, '1000-4999': 3000.0, '5000-9999': 7500.0, '10000+': 15000.0}\n_EDU = {'Primary School': 0.0, 'High School': 1.0, 'Graduate': 2.0, 'Masters': 3.0, 'Phd': 4.0}\n\n\ndef _num(s, mapping):\n  \"\"\"String column -> float, using `mapping` for the non-numeric levels.\"\"\"\n  s = s.astype('object')\n  out = s.map(mapping)\n  rest = pd.to_numeric(s.where(out.isna()), errors='coerce')\n  return out.astype(float).fillna(rest).astype(float)\n\n\ndef _plain(d):\n  \"\"\"Strip pandas-3 StringDtype (pyarrow-backed) from the frame *and its column index*: the\n  judge unpickles the hook output in a process that cannot always import pyarrow.\"\"\"\n  for c in d.columns:\n    if str(d[c].dtype) == 'str':\n      d[c] = d[c].astype(object)\n  d.columns = pd.Index(list(map(str, d.columns)), dtype=object)\n  return d\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train.astype(object), X_test\n\n\ndef _feat(X):\n  d = pd.DataFrame(index=X.index)\n  if 'row_id' in X.columns:                       # absent under `judge.py check`\n    d['row_id'] = X['row_id']\n  d['cdi'] = X['city_development_index'].astype(float)\n  d['city'] = X['city'].astype('object')\n  d['gender'] = X['gender'].astype('object')\n  d['rel_exp'] = (X['relevent_experience'].astype('object') == 'Has relevent experience').astype(float)\n  d['enrolled'] = X['enrolled_university'].astype('object')\n  d['edu'] = _num(X['education_level'], _EDU)\n  d['major'] = X['major_discipline'].astype('object')\n  d['experience'] = _num(X['experience'], _EXP)\n  d['comp_size'] = np.log10(_num(X['company_size'], _SIZE))\n  d['comp_type'] = X['company_type'].astype('object')\n  d['last_new_job'] = _num(X['last_new_job'], _LNJ)\n  d['train_hours'] = np.log1p(X['training_hours'].astype(float))\n  return d\n\n\ndef _target_encode(key_tr, key_te, y, folds=TE_FOLDS, prior=TE_PRIOR, seed=7):\n  \"\"\"Smoothed mean encoding: out-of-fold for the context rows, full-fit for the query rows.\n\n  The context rows are what TabFM attends over, so encoding them with their own label would put\n  the answer in the context; the inner K-fold keeps each context row's code label-free.\"\"\"\n  from sklearn.model_selection import StratifiedKFold\n  y = np.asarray(y, dtype=float)\n  k_tr = pd.Series(np.asarray(key_tr, dtype=object).astype(str))\n  k_te = pd.Series(np.asarray(key_te, dtype=object).astype(str))\n  gm = float(y.mean())\n  enc_tr = np.full(len(k_tr), gm)\n  for i, j in StratifiedKFold(folds, shuffle=True, random_state=seed).split(k_tr, y):\n    s = pd.Series(y[i]).groupby(k_tr.iloc[i].to_numpy()).agg(['sum', 'count'])\n    m = (s['sum'] + prior * gm) / (s['count'] + prior)\n    enc_tr[j] = k_tr.iloc[j].map(m).astype(float).fillna(gm).to_numpy()\n  s = pd.Series(y).groupby(k_tr.to_numpy()).agg(['sum', 'count'])\n  m = (s['sum'] + prior * gm) / (s['count'] + prior)\n  return enc_tr, k_te.map(m).astype(float).fillna(gm).to_numpy()\n\n\ndef engineer(X_train, y_train, X_test):\n  A, B = _feat(X_train), _feat(X_test)\n  yb = (np.asarray(y_train, dtype=object).ravel() == 'Yes').astype(float)\n\n  if FEATS['city_te']:\n    A['city_te'], B['city_te'] = _target_encode(X_train['city'], X_test['city'], yb)\n\n  if FEATS['city_cnt']:\n    vc = pd.Series(np.asarray(X_train['city'], dtype=object).astype(str)).value_counts()\n    for D, S in ((A, X_train), (B, X_test)):\n      D['city_n'] = np.log1p(pd.Series(np.asarray(S['city'], dtype=object).astype(str)).map(vc).fillna(0).to_numpy())\n\n  if FEAT
