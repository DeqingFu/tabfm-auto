 has to move to this context.\n# One draw halves the cost of each screen, and column-only changes are exact against this line: sample()\n# is seeded and TabFM's member subsampling rides on a fixed random_state, so two runs that differ only\n# in engineer() see literally the same rows. The noise in this run is entirely in comparisons that move\n# rows (eval 3 vs eval 4, identical model, folds 0.0009 apart).\n\"\"\"The four hooks plus TabFM's ensemble knobs.\n\n  preprocess(X_train, y_train, X_test)  -> (X_train, y_train, X_test)\n  engineer(X_train, y_train, X_test)    -> (X_train, X_test)\n  sample(X_train, y_train, X_test, max_rows) -> list[np.ndarray]   OPTIONAL\n  postprocess(pred, y_orig, X_test)     -> pred\n  folds(X_train, y_train) -> list[(train_idx, val_idx)]            OPTIONAL\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nCTX = 256000              # rows per ensemble member; the judge clamps anything above this\nPOOL = 2 * CTX            # draw size: eval 4 showed the full 8*CTX pool buys nothing but preprocessing\nN_DRAWS = 1               # screening setting; the shipping config uses 2 (4 was no better, eval 24)\nMIN_CLASS = 5             # class 5 has a single training row; a dead logit is all it can contribute\nEXTRA = ()                # feature groups under test, on top of the block eval 23 settled on\n\nTABFM_KWARGS = {\"max_num_rows\": CTX}\n\nSOIL = [f\"Soil_Type{i}\" for i in range(1, 41)]\nWILD = [f\"Wilderness_Area{i}\" for i in range(1, 5)]\n\n\ndef _fe(X):\n  f = lambda c: X[c].to_numpy(np.float32)\n  el, asp, slope = f(\"Elevation\"), f(\"Aspect\"), f(\"Slope\")\n  hdh, vdh = f(\"Horizontal_Distance_To_Hydrology\"), f(\"Vertical_Distance_To_Hydrology\")\n  hdr, hdf = f(\"Horizontal_Distance_To_Roadways\"), f(\"Horizontal_Distance_To_Fire_Points\")\n  h9, hn, h3 = f(\"Hillshade_9am\"), f(\"Hillshade_Noon\"), f(\"Hillshade_3pm\")\n  s = X[SOIL].to_numpy(np.int8)\n  w = X[WILD].to_numpy(np.int8)\n  cols = dict(\n      # elevation corrected for the water table, and the true distance to it\n      Euclid_Hydro=np.sqrt(hdh * hdh + vdh * vdh),\n      Elev_m_VDH=el - vdh,\n      Elev_p_VDH=el + vdh,\n      Elev_m_HDH2=el - 0.2 * hdh,\n      # dense views of the 38 sparse soil binaries, which the GAN left non-exclusive:\n      # 41% of rows set no bit at all and some set up to seven\n      Soil_count=s.sum(1).astype(np.int8),\n      Soil_first=np.where(s.any(1), np.argmax(s, 1) + 1, 0).astype(np.int16),\n      Soil_last=(s * np.arange(1, 41, dtype=np.int16)).max(1).astype(np.int16),\n      Soil_mean=(s * np.arange(1, 41, dtype=np.float32)).sum(1) / np.maximum(s.sum(1), 1),\n      Soil_g1=s[:, :10].sum(1).astype(np.int8),\n      Soil_g2=s[:, 10:20].sum(1).astype(np.int8),\n      Soil_g3=s[:, 20:30].sum(1).astype(np.int8),\n      Soil_g4=s[:, 30:].sum(1).astype(np.int8),\n      Wild_first=np.where(w.any(1), np.argmax(w, 1) + 1, 0).astype(np.int8),\n      Wild_code=w @ (1 << np.arange(4, dtype=np.int16)))\n\n  if \"artifact\" in EXTRA:\n    # the GAN put rows outside the physical range of their own columns; the test split has them too\n    cols.update(Wild_count=w.sum(1).astype(np.int8),\n                Aspect_oob=((asp < 0) | (asp > 360)).astype(np.int8),\n                Slope_neg=(slope < 0).astype(np.int8),\n                Dist_neg=((hdh < 0).astype(np.int8) + (hdr < 0) + (hdf < 0)),\n                Shade_oob=((h9 < 0).astype(np.int8) + (h9 > 255) + (hn < 0) + (hn > 255)\n                           + (h3 < 0) + (h3 > 255)))\n  if \"roadfire\" in EXTRA:\n    cols.update(Elev_m_HDR=el - 0.02 * hdr, Elev_m_HDF=el - 0.02 * hdf)\n  if \"aspect360\" in EXTRA:\n    cols.update(Aspect=np.mod(asp, 360.0).astype(np.float32))\n  return X.assign(**cols)\n\n\ndef preprocess(X_train, y_train, X_test):\n  vc = y_train.value_counts()\n  keep = y_train.isin(vc.index[vc >= MIN_CLASS])\n  if keep.all():\n    return X_train, y_train, X_test\n  return X_train[keep].reset_index(drop=True), y_train[keep].reset_index(drop=True), X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  return _fe(X_train), _fe(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  if n < N_DRAWS * POOL:\n    return [np.arange(n)]\n  perm = np.random.default_rng(0).permutation(n)\n  return [np.sort(perm[i * POOL:(i + 1) * POOL]) for i in range(N_DRAWS)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# tabular-playground-series-dec-2021 — scored pipeline\n\n## What it does\n\nThe task is a 7-class forest cover-type problem on a 3.6M-row GAN-generated table (the classic\nCovertype schema: 10 numeric terrain columns, 4 wilderness-area binaries, 40 soil-type binaries).\nTabFM makes the prediction; the pipeline only decides what it sees.\n\nThree things are done around it. **preprocess** drops classes with fewer than 5 training rows —\nclass 5 has a single row in this table, and a class TabFM cannot see more than once contributes a\ndead logit and nothing else. **engineer** adds 15 columns, all cheap algebra on the raw ones: four\nterrain combinations that encode elevation relative to the water table (`Elev_m_VDH`, `Elev_p_VDH`,\n`Elev_m_HDH2`, and the true Euclidean distance to hydrology), and eleven dense summaries of the\nsparse binaries. The soil block is the reason for most of them — the generator did not keep the\none-hot exclusive, so 41% of rows set no soil bit and some set up to seven; `Soil_count`,\n`Soil_first`/`Soil_last`/`Soil_mean` and four decade-group counts give TabFM in a handful of dense\ncolumns what it would otherwise have to read out of 40 nearly-empty ones. **sample** hands TabFM one\nseeded draw of 512000 rows (2× the context), from which each ensemble member takes its own 256000.\n\n`TABFM_KWARGS = {\"max_num_rows\": 256000}` — the judge's hard cap — is the single largest lever in\nthe whole run. Context size dominated: a feature block worth +0.00087 accuracy at a 65536-row window\nwas worth +0.00012 at 256000, because at that size the rows already carry what the features stood\nin for. `postprocess` is the identity.\n\nCV accuracy 0.96293, held-out test accuracy 0.96264 (gold threshold 0.9566), 8 estimators, ~26 min\nfor the final pass.\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no files — it works entirely from the frames `judge.py` passes to the\nhooks — so `final/build.sh` prints that and exits 0. Run it anyway if you want the invocation to be\nuniform; it takes under a second and needs no disk.\n\nThe submission itself is produced by:\n\n    cd <this workspace> && bash final/build.sh && python final/run.py\n\nwhich loads 3.6M train / 400k test rows and runs one 8-member TabFM pass. Budget an H100-class GPU\nand roughly half an hour.\n\n## Things a reader could get wrong\n\n- **`final/build/` is analysis, not build steps.** Those six scripts were run during the search to\n  decide what to ship and are dead weight at reproduction time. They read a parquet copy of the CSVs\n  that was made once with a shell one-liner —\n  `python -c \"import pandas as pd, os; d=os.environ['TMPDIR']+'/work'; pd.read_csv('data/train.csv').to_parquet(d+'/train.parquet'); pd.read_csv('data/test.csv').to_parquet(d+'/test.parquet')\"`\n  — and `screen.py` writes `$TMPDIR/work/screen.json`. Nothing in `pipeline.py` opens any of it.\n  `equiv.py` is the one worth keeping: it proves the shipped `pipeline.py` is bit-for-bit the same\n  function as `history/pipeline_027.py`, the snapshot that was scored.\n- **`N_DRAWS = 1` is deliberate, despite what its comment says.** The comment describes 1 as \"the\n  screening setting\" and 2 as shipping; the scored file is `pipeline_027.py`, which uses 1, and\n  that is what these numbers are. Do not \"fix\" it to 2 — that changes which rows TabFM sees and\n  invalidates the reported score.\n- **`EXTRA = ()` disables three feature groups** (`artifact`, `roadfire`, `aspect360`) that remain\n  in `_fe` as dead branches. They were tried and did not pay at the 256000 context. The code is\n  left in because the branches are what makes the shipped column set legible as a decision.\n- **Fold/seed structure matters for any comparison.** `sample()` is seeded on\n  `default_rng(0)` and TabFM's member subsampling rides on a fixed random_state, so two variants\n  that differ only in `engineer()` see literally identical rows and compare exactly; anything that\n  moves rows carries about ±0.0009 of fold-to-fold noise.\n","package":[],"derivations":[]},{"id":"tabular-playground-series-may-2022","name":"tabular-playground-series-may-2022","short_name":"tps-may-2022","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Manufacturing Telemetry","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.05179,"plain_note":"0.05179 (AUROC 0.94821)","n_train":800000,"n_test":100000,"n_folds":3,"thresholds":{"gold":0.00177,"silver":0.00178,"bronze":0.00182,"median":0.027325},"summary":"TabFM makes the prediction; the pipeline's job is to hand it a table whose structure it can read. Three things go in. First, `f_27` — the only non-numeric column, a fixed-width ten-character string — is unpacked into ten integer character codes plus `ch_nuniq`, the number of distinct characters in the string.","score":0.00179,"gain_pct":96.543734,"medal":"Bronze","category":null,"lines":280,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer","postprocess"],"tabfm_kwargs":{"max_num_rows":"262144"},"helper_functions":["_char_codes","_nunique","_cells","_terms","_raw","_cell_fit","_score","_summaries"],"helper_ranges":{"_char_codes":[158,161],"_nunique":[164,165],"_cells":[168,173],"_terms":[176,183],"_raw":[189,202],"_cell_fit":[205,227],"_score":[230,232],"_summaries":[235,257]},"hook_helpers":{"preprocess":[],"engineer":["_char_codes","_nunique","_cells","_terms","_raw","_cell_fit","_score","_summaries"],"postprocess":[]},"hook_ranges":{"preprocess":[260,261],"engineer":[264,268],"postprocess":[271,280]},"code":"\"\"\"Intent (v55): the characters are the one block that refused to thin (-0.00001 at v51, and\n-0.00001 again stacked on the narrower table at v54). The rule the ladder established says a\nblock thins once a summary carries it -- and a_ch never carried the character block properly,\nbecause ch_nuniq, the strongest thing the ten characters produce, was not among its terms. Held\nout, putting it in takes a_ch from 0.7975 to 0.8055. So cover the block first and then thin it,\nexactly the two-step that made f_03/f_04/f_06 free at v53: a_ch gains ch_nuniq as a term (it\nstays a column in its own right), and ch_1, ch_3, ch_4, ch_6 and ch_9 come out. ch_0, ch_2 and\nch_5 stay because they define the switch cells every summary is conditioned on, and ch_7 stays\nas the only uniform-alphabet position and the strongest of the ten. 36 -> 31 columns.\n\nSuperseded (v53): dropping f_21/f_22/f_26 cost 0.0018 -- the ternaries carry only the step at the\nthreshold, and the continuous part of those columns is most of what the big-float block is for.\nPut them back. That leaves one clean extrapolation of the integer result. The rule the ladder\nestablished is that a block thins only once a summary carries it: the integers went from twelve\ncolumns to none for +0.00004 because a_int and x_int_ch hold their structure, while the\ncharacters (a_ch) would not thin and the small floats -- the only block with no summary at all --\ncost 0.00024 when v30 dropped three of them. So do both halves this time: add a_sm over\nf_00..f_06 and f_28 (0.7224 standalone, the weakest of the summaries and squarely in the band\nthat works), and drop f_03, f_04 and f_06, whose within-cell correlation with the target is\n-0.001/0.001/-0.002. 38 -> 36 columns.\n\nSuperseded (v52): thinning the characters scored 0.99818 against v50's 0.99819, so unlike the\nintegers they carry more than a_ch holds -- put all ten back. The big floats are the last block\nwith summaries behind it (a_big, x_big_ch), and three of them are redundant in a second way as\nwell: f_21, f_22 and f_26 are the big halves of the three threshold interactions, so the part of\nthem that matters most already reaches TabFM as t_02_21, t_05_22 and t_00_01_26. They are also\nthe three weakest of the eight by surrogate importance (0.019, 0.024, 0.034 against 0.064-0.10\nfor the rest). Drop those three. 38 -> 35 columns.\n\nSuperseded (v51): the whole integer block gone scored 0.99819 -- 0.99815 at none, 0.99816 at five,\n0.99817 at eight, 0.99819 at twelve, monotone the whole way. The characters are the other block\nwith summaries behind it (a_ch, x_int_ch, x_big_ch), so try the same thinning there. Keep the\nthree that define the switch cells, ch_0, ch_2 and ch_5 -- without them TabFM cannot tell which\ncell a row is in, and every summary is cell-conditional -- and keep ch_7, the only position with\na uniform alphabet and the highest importance of the ten (0.056). Drop the other five: ch_1,\nch_3, ch_4, ch_6, ch_9 (0.0074 to 0.010). ch_nuniq is computed before the drop and stays.\n38 -> 33 columns.\n\nSuperseded (v50): eight integer columns gone scored 0.99817, better again than five (0.99816) and\nthan none (0.99815). Take the ladder to its end and drop the whole integer block -- f_07, f_08,\nf_10, f_11 are the last four, importances 0.0050/0.0048/0.0063/0.0087. Their content is not lost:\na_int carries the block's within-cell linear and product structure and x_int_ch its interaction\nwith the characters, which is exactly why this block and not the small floats is the one that\nthins. 50 -> 38 columns, the narrowest table since the ternaries went in.\n\nSuperseded (v49): dropping those five integer columns scored 0.99816, the best of the run, where\nthe same five cost 0.00025 at v12. The lesson is that a column decision has to be made at the\ncontext the pipeline ships with -- at 65536 the five carried information TabFM needed, at 256000\nwith a_int summarising the block they are width it can do without. Push the ladder: add the next\nthree by surrogate importance, f_09 (0.0020), f_15 (0.0024) and f_14 (0.0034). The integer block\nis the only one safe to thin this way -- it has a summary; the small floats do not, which is why\ndropping f_03/f_04/f_06 cost 0.00024 at v30.  50 -> 42 columns.\n\nSuperseded (v48): cutting every summary on all 48 switch cells scored 0.99806 against 0.99815, so\nv16's per-block cells were right after all. Revisit a column decision instead, because two things\nhave changed since it was made. v12 dropped the five weakest integer columns (f_12, f_13, f_16,\nf_17, f_18 -- surrogate permutation importance 0.0009 down to 0.0001) and lost 0.00025, but that\nwas measured at the 65536 default context and before any summary existed. Now the context is\n256000 and a_int carries the integer block's aligned linear and product structure, so both the\ncost of dropping them and the benefit of the narrower table have moved. 50 -> 45 columns.\n\nSuperseded (v41): v40 isolated the polynomial degree from the cell granularity -- degree 4 on the\nbig floats alone, with every cell exactly as v36 had it, still lost 0.00009 (0.99806). So it is\nsummary strength itself that TabFM dislikes, not thinner cells and not in-sample optimism: these\ncolumns work as weak hints and stop working as strong ones. Three independent checks agree that\nthe feature side is finished -- a cross-fitted HGB on [TabFM's logit, all 44 columns] scores\n0.99794 against 0.99805 for the logit alone, a tuned HGB on the same features and 650k rows\nreaches 0.99642, and a 3-seed MLP ensemble 0.99717. TabFM is well ahead of both and nothing\nfitted on its output improves its ranking.\n\nSo spend what is left on robustness. engineer takes 94s at the final's 800k rows against a 600s\nper-stage limit that fails the run outright, and the host ran ~10x slower earlier today than it\ndoes now. IRLS 5 -> 3 and out-of-fold splits 5 -> 2 leave the query-side summaries numerically\nidentical (correlation >= 0.99987, query AUCs unchanged to four places -- the query side only\never used the full fit) and take a fold from 60s to 21s, i.e. ~33s at final size. Only the\ncontext rows' summaries change at all, and they are now fitted on 50% of the fold instead of 80%.\n\nSuperseded (v36): the summaries are fitted on the training fold and then read off that same fold\nfor the context rows, while the rows being predicted are scored out of sample. For x_int_ch that\nis 120 terms fitted on ~33k rows per cell, so a context row sits about d/n = 0.4% of the signal\ncloser to the truth than a query row does -- and TabFM reads both off the same column, so the\nmismatch is exactly the kind of thing in-context learning would key on. Score the context rows\nout-of-fold instead (5 folds inside the training fold), the query rows from the full fit. Same\ncolumns, same coefficients for the query side, 61s per fold instead of 15s.\n\nBelow: the run as of v32, CV 0.99814 (identity pipeline: 0.94821).\n\nf_27 is a ten-character string; every other column is numeric. What the run found, in order of\nwhat it was worth:\n\n1. The three float interactions, with exact thresholds. A 0.01-step scan of the target rate puts\n   the jumps at f_02+f_21 = +5.20/-5.30, f_05+f_22 = +5.10/-5.40 and f_00+f_01+f_26 =\n   +5.00/-5.00 (rate 0.464 -> 0.914 across the last one). A 938-combination search over linear\n   combinations of the fifteen continuous columns finds no fourth. Getting f_00+f_01+f_26 right\n   was worth +0.00045 on its own.\n2. Redundancy costs more than width. Carrying the raw sums next to the ternaries cost 0.00030 --\n   each correlates ~0.93 with the big float inside it. But this only applies to duplicates:\n   pruning five weak integer columns cost 0.00025 (v12) and dropping f_03/f_04/f_06, whose\n   within-cell correlation with the target is -0.001/0.001/-0.002, cost 0.00030 (v30).\n3. Five switch variables. Within a cell of (f_29, f_30) the sign of corr(column, target) is\n   constant in one and flips in the other: f_30 governs f_19..f_26 (f_24 runs +0.30/+0.16/-0.18),\n   f_29 governs f_07..f_18 and the characters (f_07 +0.10 -> -0.19, ch_8 +0.00 -> +0.31).\n   Scanning every discrete column the same way adds ch_0, ch_2 and ch_5. This is why a binned\n   additive model reaches only 0.867 while the truth is ~0.998. Flipping the columns in place\n   destroys their shape and cost 0.00044 (v13); five summaries alongside them -- a ridge logistic\n   per cell over each block's terms, fitted on the training fold -- were worth +0.00018 in total.\n   Each summary alone scores 0.72-0.85, so they inform TabFM rather than replace it.\n4. Context. max_num_rows 256000 instead of the 65536 default: +0.00009. Worth nothing (+0.00003)\n   before the features were right.\n\nMeasured and rejected: 28 pairwise sums of the big floats (-0.00064), characters as categorical\nstrings (-0.00041), n_svd_features (-0.00010), class_shift=False (-0.00005), average_logits=False\n(-0.00006), NNLS member weighting (-0.00003), boundary-enriched draws (-0.00015; selecting on x\nalone is unbiased, but repeating rows in the context costs more than the resolution it buys).\nMeasured and neutral to within the fold spread of 0.00008: two draws at 256000, four norm_methods,\nn_feature_crosses, feat_shuffle_method='none', outlier_threshold=8, the 48-level cell as its own\ncolumn, a summary over f_00..f_06 and f_28, a hinge basis for the big floats, orthogonalising the\ncross summaries, a target encoding of (cell, ch_nuniq), and the ridge penalty over 5..150.\n\nDeliberately not done: one ridge quadratic over all 44 columns at once scores 0.9559 on its own.\nThat is not a feature -- it would leave TabFM polishing a prediction the pipeline already made.\nThe evidence also says it would not pay: every summary added after the first three moved the\nscore by at most 0.00002, because TabFM already models what they encode.\n\nWhere the remaining error is: 1.3% of validation rows carry essentially all of it, and they sit\nwhere ch_nuniq is 4-6 and all three ternaries are 0 -- i.e. where the target probability is near\n0.5. Calibration is clean, no correction on top of TabFM's score adds anything, and both\nensembling routes (more members, more context) are saturated.\n\"\"\"\nimport os\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'max_num_rows': 262144}\n\nFLOAT_COLS = ['f_00', 'f_01', 'f_02', 'f_03', 'f_04', 'f_05', 'f_06']\nINT_COLS = ['f_%02d' % i for i in range(7, 19)]\nBIG_COLS = ['f_%02d' % i for i in range(19, 27)]\nCHAR_COLS = ['ch_%d' % i for i in range(10)]\n# name -> (columns, columns to cross them with or None for self-products, switch cells)\nBLOCKS = {'a_int': (INT_COLS, None, 'sw16'),\n          'a_ch': (CHAR_COLS + ['ch_nuniq'], None, 'sw16'),\n          'a_big': (BIG_COLS, None, 'f_30'),\n          'x_int_ch': (INT_COLS, CHAR_COLS, 'sw16'),\n          'x_big_ch': (BIG_COLS, CHAR_COLS, 'f_30'),\n          'a_sm': (FLOAT_COLS + ['f_28'], None, 'one')}\nN_CELLS = {'sw16': 16, 'f_30': 3, 'one': 1}\nFIT_ROWS = None  # None: fit the summaries on the whole training fold\nRIDGE = 50.0\nIRLS = 3\nOOF_FOLDS = 2\n\nDIAG = ('~/tabfm-evolve/runs/tabular-playground-series-may-2022/'\n        'opus5-vertex-20260902T0709/diag')\n\n\ndef _char_codes(s):\n  \"\"\"(n, 10) int array of the ASCII offsets of a fixed-width 10-char string column.\"\"\"\n  a = np.asarray(s.astype(str).values, dtype='U10').view(np.uint32).reshape(len(s), 10)\n  return (a - ord('A')).astype(np.int16)\n\n\ndef _nunique(s):\n  return np.fromiter((len(set(v)) for v in s.astype(str).values), dtype=np.int8, count=len(s))\n\n\ndef _cells(df):\n  \"\"\"The switch cells each block is aligned within.\"\"\"\n  codes = _char_codes(df['f_27'])\n  sw16 = df['f_29'].values * 8 + codes[:, 0] * 4 + codes[:, 2] * 2 + codes[:, 5]\n  return {'sw16': sw16.astype(np.int16), 'f_30': df['f_30'].values.astype(np.int16),\n          'one': np.zeros(len(df), dtype=np.int16)}\n\n\ndef _terms(frame, cols, other):\n  \"\"\"Self blocks: the columns plus every product and square. Cross blocks: the outer products.\"\"\"\n  v = np.asarray(frame[cols].values, dtype=np.float32)\n  if other is not None:\n    u = np.asarray(frame[other].values, dtype=np.float32)\n    return (v[:, :, None] * u[:, None, :]).reshape(len(v), -1)\n  i, j = np.triu_indices(v.shape[1], 0)\n  return np.concatenate([v, v[:, i] * v[:, j]], axis=1)\n\n\nDROP_INTS = INT_COLS + ['f_03', 'f_04', 'f_06', 'ch_1', 'ch_3', 'ch_4', 'ch_6', 'ch_9']\n\n\ndef _raw(df):\n  \"\"\"The columns TabFM sees before the summaries are appended.\"\"\"\n  out = {c: df[c].values for c in df.columns if c != 'f_27'}\n  codes = _char_codes(df['f_27'])\n  for i in range(10):\n    out['ch_%d' % i] = codes[:, i]\n  out['ch_nuniq'] = _nunique(df['f_27'])\n  s1 = (df['f_02'] + df['f_21']).values\n  s2 = (df['f_05'] + df['f_22']).values\n  s3 = (df['f_00'] + df['f_01'] + df['f_26']).values\n  out['t_02_21'] = (s1 > 5.2).astype(np.int8) - (s1 < -5.3).astype(np.int8)\n  out['t_05_22'] = (s2 > 5.1).astype(np.int8) - (s2 < -5.4).astype(np.int8)\n  out['t_00_01_26'] = (s3 > 5.0).astype(np.int8) - (s3 < -5.0).astype(np.int8)\n  return pd.DataFrame(out, index=df.index)\n\n\ndef _cell_fit(terms, cell, y, n_cells, rows):\n  \"\"\"Ridge logistic per cell over `rows`; returns (mean, sd, weights) stacked by cell.\"\"\"\n  d = terms.shape[1]\n  mu = np.zeros((n_cells, d))\n  sd = np.ones((n_cells, d))\n  wts = np.zeros((n_cells, d + 1))\n  g = RIDGE * np.eye(d + 1)\n  g[-1, -1] = 1e-6\n  for c in range(n_cells):\n    m = rows & (cell == c)\n    if m.sum() < 500:\n      continue\n    t = terms[m].astype(np.float64)\n    yt = y[m]\n    mu[c] = t.mean(0)\n    sd[c] = np.maximum(t.std(0), 1e-9)\n    z = np.column_stack([(t - mu[c]) / sd[c], np.ones(len(t))])\n    w = np.zeros(d + 1)\n    for _ in range(IRLS):\n      pr = 1.0 / (1.0 + np.exp(-z @ w))\n      w = w + np.linalg.solve((z.T * (pr * (1 - pr))) @ z + g, z.T @ (yt - pr) - g @ w)\n    wts[c] = w\n  return mu, sd, wts\n\n\ndef _score(terms, cell, par):\n  mu, sd, wts = par\n  return ((terms - mu[cell]) / sd[cell] * wts[cell, :-1]).sum(1) + wts[cell, -1]\n\n\ndef _summaries(tr, te, ctr, cte, y):\n  \"\"\"Out-of-fold summaries for the context rows, full-fit ones for the rows being predicted.\n\n  The two sides must be on the same footing: a row scored by a fit that saw its own label sits\n  slightly closer to the truth than one scored out of sample, and TabFM reads the context rows\n  and the query rows off the same column.\n  \"\"\"\n  y = np.asarray(y, dtype=np.float64).ravel()\n  n = len(y)\n  part = np.random.default_rng(1).permutation(n) % OOF_FOLDS\n  allrows = np.ones(n, dtype=bool)\n  for name, (cols, other, switch) in BLOCKS.items():\n    t_tr = _terms(tr, cols, other)\n    cell = np.asarray(ctr[switch]).astype(np.int64)\n    te[name] = _score(_terms(te, cols, other), np.asarray(cte[switch]).astype(np.int64),\n                      _cell_fit(t_tr, cell, y, N_CELLS[switch], allrows))\n    out = np.zeros(n)\n    for k in range(OOF_FOLDS):\n      held = part == k\n      par = _cell_fit(t_tr, cell, y, N_CELLS[switch], ~held)\n      out[held] = _score(t_tr[held], cell[held], par)\n    tr[name] = out\n  return tr, te\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  tr, te = _raw(X_train), _raw(X_test)\n  ctr, cte = _cells(X_train), _cells(X_test)\n  tr, te = _summaries(tr, te, ctr, cte, y_train)\n  return tr.drop(columns=DROP_INTS), te.drop(columns=DROP_INTS)\n\n\ndef postprocess(pred, y_orig, X_test):\n  try:\n    os.makedirs(DIAG, exist_ok=True)\n    p = np.asarray(pred)[:, -1] if getattr(pred, 'ndim', 1) > 1 else np.asarray(pred)\n    np.savez_compressed(\n        os.path.join(DIAG, 'fold_%d_%d.npz' % (os.getpid(), len(X_test))),\n        id=np.asarray(X_test['id'].values), p=p.astype(np.float32))\n  except Exception:\n    pass\n  return pred\n","readme":"# tabular-playground-series-may-2022 — final pipeline\n\n## What it does\n\nTabFM makes the prediction; the pipeline's job is to hand it a table whose structure it can read. Three\nthings go in. First, `f_27` — the only non-numeric column, a fixed-width ten-character string — is\nunpacked into ten integer character codes plus `ch_nuniq`, the number of distinct characters in the\nstring. Second, three thresholded interactions: a 0.01-step scan of the target rate over linear\ncombinations of the continuous columns found exactly three places where the rate jumps, at\n`f_02+f_21 = +5.20/-5.30`, `f_05+f_22 = +5.10/-5.40` and `f_00+f_01+f_26 = +5.00/-5.00`; each becomes a\nternary column (+1 above, -1 below, 0 between). The raw sums are deliberately *not* carried alongside\nthem — they correlate ~0.93 with the big float inside each and cost score as duplicates. Third, six\nsummary columns. The data has switch variables: within a cell of `f_29` and the characters `ch_0`,\n`ch_2`, `ch_5` (16 cells) and within `f_30` (3 cells), the sign of each column's correlation with the\ntarget is constant, and it flips across cells. So for each block of columns — integers, characters,\nbig floats, small floats, and the integer×character and bigfloat×character outer products — a ridge\nlogistic regression (IRLS, 3 steps, penalty 50) is fitted per cell over that block's terms, and its\nlogit becomes one column. Each summary scores only 0.72–0.85 alone, which is the point: they inform\nTabFM rather than replace it. The context rows' summaries are scored out-of-fold (2 splits inside the\ntraining fold) and the query rows' from the full fit, so both sides of the column sit at the same\ndistance from the truth — TabFM reads them off the same column and keys on the mismatch otherwise.\nFinally the table is thinned: once a block has a summary carrying it, its raw columns come out. All\ntwelve integer columns, `f_03/f_04/f_06`, and five of the ten characters are dropped, leaving 31\ncolumns. The only TabFM knob changed from default is `max_num_rows: 262144` (the judge clamps it to\n256000). 3-fold CV AUC 0.99820 (identity pipeline: 0.94821).\n\n## What build.sh builds\n\nNothing. `build.sh` is a comment and `exit 0`. The pipeline reads no file: every feature above is\nrecomputed inside `engineer()` from the frames the judge passes in, and the per-cell summaries are\nrefitted per fold, so there is no cache, no feature table and no saved model to regenerate. No disk,\nno time. There is no `final/build/` directory either — no standalone script was written during the\nrun; the analyses behind the thresholds and the switch cells were throwaway shell heredocs that left\nno artifact the pipeline depends on.\n\nRun it with `python final/run.py`.\n\n## Things a reader could get wrong\n\n- **`DIAG` is an absolute path** to `<this workspace>/diag`, hardcoded in `pipeline.py`. `postprocess`\n  dumps every fold's predictions there for error analysis and is never read back; the whole block is\n  wrapped in `try/except: pass`, so on a machine where that path is not writable the pipeline is\n  unaffected. It is diagnostics, not part of the method.\n- **The thresholds are exact, not approximate.** `5.2 / -5.3 / 5.1 / -5.4 / 5.0 / -5.0` were located by\n  scan; rounding them all to ±5.0 loses real score. Getting `f_00+f_01+f_26` right alone was +0.00045.\n- **The dropped columns are not dead weight in general** — they are dead weight *given* the summaries\n  and *at this context size*. The same five integer columns cost 0.00025 when dropped at the 65536\n  default context and gained score at 256000 with `a_int` present. Re-screen columns before changing\n  either.\n- **Cost.** `engineer()` takes ~30s per fold at final size, against the judge's 600s per-stage limit;\n  the `IRLS=3` / `OOF_FOLDS=2` settings are a deliberate 3x speedup over the 5/5 version that leaves\n  the query-side summaries numerically identical (correlation ≥ 0.99987). The TabFM pass at 256000\n  context rows dominates the wall clock: the whole scored evaluation was ~970s for 3 folds.\n","package":[],"derivations":[]},{"id":"champs-scalar-coupling","name":"champs-scalar-coupling","short_name":"champs-coupling","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Quantum Chemistry (3D NMR)","metric_label":"Log-MAE ↓","lower_is_better":true,"plain":1.19025,"plain_note":"+1.19025","n_train":4191263,"n_test":467813,"n_folds":3,"thresholds":{"gold":-2.87509,"silver":-2.03119,"bronze":-1.90122,"median":-0.9529},"summary":"The predictor is the frozen TabFM, in-context, over sampled training couplings. Everything around it is about handing it a table where one row is a scalar-coupling pair described by geometry alone.","score":-1.54947,"gain_pct":null,"medal":"Above Median","category":null,"lines":187,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"max_num_rows":"256000"},"helper_functions":["_keys","_fill","_merge","_quota"],"helper_ranges":{"_keys":[94,100],"_fill":[103,109],"_merge":[131,136],"_quota":[148,163]},"hook_helpers":{"preprocess":["_keys","_fill"],"engineer":["_merge"],"sample":["_quota"],"postprocess":["_keys","_fill"],"folds":[]},"hook_ranges":{"preprocess":[112,127],"engineer":[139,144],"sample":[166,175],"postprocess":[179,187],"folds":[74,78]},"code":"\"\"\"v27: TYPE_W back to exponent 1, which v19's edit failed to restore.\n\nv26's six draws scored -1.55806.  Verifying the selected pipeline turned up that the revert of\nthe exponent-1.5 weights, written as part of v19, never applied: the file held them as\nnp.float64(...) literals and the string replacement matched nothing and raised nothing.  So v19\nthrough v26 all ran on the weights v18 had just measured 0.020 worse than exponent 1.  Restored\nhere.  Draws come down from six to two to fit what is left of the clock -- six would run past\nthe end of the session and contend with the final for a GPU -- so this is worth about\n-1.55806 + 0.020 - 0.011 if the two effects are additive, and it isolates the fix cleanly\nagainst v24, which is the same pipeline at two draws with the wrong weights.\n\"\"\"\nimport json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\nFEAT_PATH = 'features.parquet'\nFEAT_PATH2 = 'features2.parquet'\nFEAT_PATH3 = 'features3.parquet'\nFEAT_PATH4 = 'features4.parquet'\nFEAT_PATH5 = 'features5.parquet'\nFEAT_PATH6 = 'features6.parquet'\nFEAT_PATH7 = 'features7.parquet'\nNORM_PATH = '.ynorm.json'\n\nMAX_ROWS = 256000                # judge.context_rows, the hard cap\nPOOL = 512000                    # rows in the draw; each of the 8 members subsamples MAX_ROWS of them\nSAMPLE_ALPHA = 0.0               # 0 = equal rows per type, 1 = proportional\nN_DRAWS = 2                      # the judge runs one fit+predict per draw and averages them\n\nTABFM_KWARGS = {'max_num_rows': MAX_ROWS}\n\nNUM_FEATS = [\n    'a0_nearC', 'a0_nearH', 'a0_nearN', 'a0_nearO', 'a0_nn2', 'a0_nn3', 'a0_zd3', 'a1_deg',\n    'a1_dmin', 'a1_nearC', 'a1_nearH', 'a1_nearN', 'a1_nearO', 'a1_nn1', 'a1_nn2', 'a1_nn3',\n    'cos_i_n0_j', 'cos_n0_i_j', 'd_n0_j', 'dist', 'mol_nH', 'n0_n2', 'n0_nearC', 'n0_nearN',\n    'n0_nearO', 'n0_nn1', 'n0_zd3', 'p3_abscos_max', 'p3_cos', 'p3_cos2', 'p3_cos_t2', 'p3_d_i_m2',\n    'p3_d_m2_j', 'p3_d_n0_m2', 'a1_nbN', 'd_i_n0', 'a1_ed2'\n]\n\nNUM_FEATS2 = [\n    'a1_ang_max', 'a1_ang_mean', 'a1_ang_min', 'a1_nben', 'dist_over_path', 'mid_dmin', 'mid_n2',\n    'mid_zd2', 'n0_ang_max', 'n0_ang_mean', 'n0_ang_min', 'n0_nben', 'path_len', 'n0_2nbO'\n]\n\nNUM_FEATS3 = [\n    'a1_gd3', 'angH_a1_max', 'angH_a1_mean', 'angH_a1_min', 'angH_n0_max', 'angH_n0_mean',\n    'angH_n0_min', 'n0_bl_mean'\n]\n\nNUM_FEATS4 = [\n    'g0_dmax', 'g0_dmin', 'g0_dstd', 'g0t_ddiff', 'g1_dmax', 'g1_dmin', 'g1t_ddiff'\n]\n\nNUM_FEATS5 = [\n    'a0_ang1', 'a0_ang4', 'a0_radH0', 'a0_radH1', 'a0_radZ0', 'a0_radZ1', 'a1_oop', 'a1_radH0',\n    'a1_radZ0', 'n0_oop', 'p3_m2_ang_max', 'p3_m2_ang_mean', 'p3_m2_nben', 'p3_m2_zd3'\n]\n\nNUM_FEATS6 = [\n    'a0_nn4', 'a0_nnz1', 'a0_nnz2', 'hyp_anti', 'hyp_anti_en', 'hyp_c2', 'hyp_c2en',\n    'hyp_c2en_mean', 'hyp_n', 'hyp_nof', 'sub0_ang', 'sub0_len', 'sub0_z', 'sub1_ang', 'sub1_len',\n    'sub2_ang', 'sub2_len'\n]\n\nNUM_FEATS7 = [\n    'a1_cm0', 'a0_s2d', 'a0_s3d', 'a0_s3en', 'a1_s2d', 'a1_cm1', 'a1_cm3', 'a0_cm1', 'a1_cm2',\n    'a0_s2z', 'a0_s4d', 'a0_cm3', 'a0_cm2'\n]\n\n\n# ---------------------------------------------------------------- folds\ndef folds(X_train, y_train):\n  \"\"\"3 molecule-disjoint folds: the held-out test split is a disjoint set of molecules.\"\"\"\n  mol = pd.factorize(X_train['molecule_name'])[0]\n  h = (mol * 2654435761) % 3\n  return [(np.flatnonzero(h != k), np.flatnonzero(h == k)) for k in range(3)]\n\n\n# ---------------------------------------------------------------- target scaling\n# Centre on the median of the finest group that has MIN_GROUP training rows, falling back\n# through coarser keys; scale by the type's mean absolute deviation from that centre, so the\n# error budget stays equal across the eight types the metric averages over.\nTYPES = ['1JHC', '1JHN', '2JHC', '2JHH', '2JHN', '3JHC', '3JHH', '3JHN']\nMIN_GROUP = 300\n# The metric is the mean over types of log(MAE_t), so a 1% gain counts the same in every type,\n# while a model fitted on the pooled context trades absolute error.  Scaling type t's target by\n# its achieved relative error lines the two up: the pooled objective then weights dMAE_t by\n# 1/MAE_t, which is what d(sum log MAE_t) is.  Ratios measured on the GBDT surrogate.\nTYPE_W = np.array([1.334, 0.416, 2.141, 0.809, 0.732, 1.571, 0.686, 1.322])\n\n\ndef _keys(X):\n  \"\"\"(type, n0_deg, a1_deg, n0_nbH) packed into one int, and its three coarser prefixes.\"\"\"\n  F = pd.read_parquet(FEAT_PATH, columns=['id', 'n0_deg', 'a1_deg', 'n0_nbH']).set_index('id')\n  k = F.reindex(X['id'].to_numpy()).to_numpy(np.int64)\n  tc = np.searchsorted(TYPES, X['type'].to_numpy())\n  full = ((tc * 8 + k[:, 0]) * 8 + k[:, 1]) * 8 + k[:, 2]\n  return [full, full // 8, full // 64, full // 512]\n\n\ndef _fill(center, keys, tables):\n  for key, tab in zip(keys, tables):\n    todo = np.isnan(center)\n    if not todo.any():\n      break\n    center[todo] = tab.reindex(key[todo]).to_numpy(dtype=float)\n  return center\n\n\ndef preprocess(X_train, y_train, X_test):\n  keys = _keys(X_train)\n  y = y_train.to_numpy(float)\n  tables = []\n  for lev, key in enumerate(keys):\n    g = pd.Series(y).groupby(key)\n    med, cnt = g.median(), g.size()\n    tables.append(med if lev == len(keys) - 1 else med[cnt >= MIN_GROUP])\n  center = _fill(np.full(len(y), np.nan), keys, tables)\n  sc = pd.Series(np.abs(y - center)).groupby(keys[-1]).mean().clip(lower=1e-6)\n  sc = sc * TYPE_W[sc.index.to_numpy()]\n  with open(NORM_PATH, 'w') as f:\n    json.dump({'t': [[t.index.tolist(), t.to_numpy().tolist()] for t in tables],\n               's': [sc.index.tolist(), sc.to_numpy().tolist()]}, f)\n  z = (y - center) / sc.reindex(keys[-1]).to_numpy()\n  return X_train, pd.Series(z, index=y_train.index, name=y_train.name), X_test\n\n\n# ---------------------------------------------------------------- features\ndef _merge(X, F):\n  out = F.reindex(X['id'].to_numpy())\n  out.index = X.index\n  out.insert(0, 'type', X['type'].to_numpy())\n  out.insert(0, 'id', X['id'].to_numpy())\n  return out\n\n\ndef engineer(X_train, y_train, X_test):\n  F = pd.read_parquet(FEAT_PATH, columns=['id'] + NUM_FEATS).set_index('id')\n  for path, cols in ((FEAT_PATH2, NUM_FEATS2), (FEAT_PATH3, NUM_FEATS3),\n                     (FEAT_PATH4, NUM_FEATS4), (FEAT_PATH5, NUM_FEATS5), (FEAT_PATH6, NUM_FEATS6), (FEAT_PATH7, NUM_FEATS7)):\n    F = F.join(pd.read_parquet(path, columns=['id'] + cols).set_index('id'))\n  return _merge(X_train, F), _merge(X_test, F)\n\n\n# ---------------------------------------------------------------- context rows\ndef _quota(counts, total, alpha):\n  keys = list(counts)\n  avail = np.array([counts[k] for k in keys], float)\n  w = avail ** alpha if alpha > 0 else np.ones(len(keys))\n  q = np.zeros(len(keys))\n  free = np.ones(len(keys), bool)\n  left = float(min(total, avail.sum()))\n  for _ in range(20):\n    if left <= 0 or not free.any():\n      break\n    share = left * w * free / (w * free).sum()\n    take = np.minimum(avail - q, share)\n    q += take\n    left -= take.sum()\n    free = q < avail - 1e-9\n  return {k: int(v) for k, v in zip(keys, q)}\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  types = X_train['type'].to_numpy()\n  by = {t: np.flatnonzero(types == t) for t in pd.unique(types)}\n  q = _quota({k: len(v) for k, v in by.items()}, POOL, SAMPLE_ALPHA)\n  draws = []\n  for d in range(N_DRAWS):\n    rng = np.random.default_rng(d)\n    take = [rng.choice(v, q[k], replace=False) if q[k] < len(v) else v for k, v in by.items()]\n    draws.append(np.sort(np.concatenate(take)))\n  return draws\n\n\n# ---------------------------------------------------------------- back to the target scale\ndef postprocess(pred, y_orig, X_test):\n  with open(NORM_PATH) as f:\n    d = json.load(f)\n  keys = _keys(X_test)\n  tables = [pd.Series(v, index=pd.Index(i, dtype='int64')) for i, v in d['t']]\n  center = _fill(np.full(len(X_test), np.nan), keys, tables)\n  sc = pd.Series(d['s'][1], index=pd.Index(d['s'][0], dtype='int64'))\n  p = np.asarray(pred, float).ravel()\n  return pd.Series(p * sc.reindex(keys[-1]).to_numpy() + center, index=X_test.index)\n","readme":"# champs-scalar-coupling — final pipeline\n\n## What it does\n\nThe predictor is the frozen TabFM, in-context, over sampled training couplings. Everything around\nit is about handing it a table where one row is a scalar-coupling pair described by geometry alone.\n\nSeven precomputed parquet tables (`features*.parquet`, built by `build.sh`) hold ~280 columns per\ncoupling derived from `structures.csv`: a covalent bond graph inferred from covalent radii plus a\n0.40 Å slack, per-atom neighbourhood descriptors for the hydrogen, its bonded parent and the far\natom (degree, per-element neighbour counts and nearest distances, inverse-distance-weighted Z and\nelectronegativity sums, k-th nearest neighbour distances, Coulomb-matrix rows), the 3J dihedral\npath through the middle atom (Karplus-style cos, cos², |cos| statistics over all paths), bond-angle\nand out-of-plane geometry, substituent patterns one and two bonds past the hydrogen,\nhyperconjugation/anti-periplanar terms, shell-by-shell composition three to five bonds out, and\ndistance statistics of a coupling relative to the other couplings sharing an atom or a molecule.\n`engineer` selects 110 of those columns — the set was pruned column by column at the shipping\ncontext size, not at a cheap one.\n\nThe target is normalised rather than predicted raw. `preprocess` centres each coupling on the\nmedian of the finest group among `(type, parent degree, far-atom degree, parent H-count)` that has\nat least 300 training rows, falling back through three coarser prefixes, then divides by that\ntype's mean absolute deviation from the centre, times a fixed per-type weight `TYPE_W`. The weights\nmatter because the competition metric is the mean over the eight types of `log(MAE_t)`: a 1% gain\ncounts the same in every type, whereas a single model fitted on a pooled context trades absolute\nerror. Scaling type *t* by its achievable relative error makes the pooled objective weight `dMAE_t`\nby `1/MAE_t`, which is the gradient of `sum_t log MAE_t`. `postprocess` reads the tables back from\n`.ynorm.json` and inverts the transform on the test rows.\n\n`sample` builds the context: equal rows per coupling type (`SAMPLE_ALPHA = 0`, water-filled when a\ntype is smaller than its quota), 512,000 rows per draw, two draws with different seeds. Each of the\neight TabFM ensemble members subsamples the 256,000-row hard cap out of a draw, so the pool being\ntwice the cap is what gives the members different context. The judge runs one fit+predict per draw\nand averages.\n\nFolds are molecule-disjoint (`folds()` hashes the molecule name into 3 buckets), mirroring how the\nheld-out split was made. 3-fold CV log-MAE for this pipeline: **-1.564** (`[RESULT 27]` in\n`log.txt`; medal thresholds in `data/meta.json` are bronze -1.901, gold -2.875).\n\n## What `build.sh` builds\n\nSeven parquet tables in the workspace root, in dependency order (`features2` and `features4` read\n`features.parquet` back):\n\n| file | rows × cols | time |\n|---|---|---|\n| `features.parquet` | 4,659,076 × 105 | ~48 s |\n| `features2.parquet` | 4,659,076 × 29 | ~123 s |\n| `features3.parquet` | 4,659,076 × 21 | ~110 s |\n| `features4.parquet` | 4,659,076 × 19 | ~23 s |\n| `features5.parquet` | 4,659,076 × 32 | ~527 s |\n| `features6.parquet` | 4,659,076 × 24 | ~23 s |\n| `features7.parquet` | 4,659,076 × 49 | ~17 s |\n\nAbout 15 minutes wall-clock single-process, no GPU. Every column is float32; expect roughly 1–2 GB\nof parquet on disk for the seven together, and about 1–2 GB of RSS at peak — the scripts work on\ndense padded `(n_molecules, 29, 29)` tensors, which is ~440 MB per such array, and a few are live at\nonce.\n\n## Things a reader would otherwise get wrong\n\n- **The prerequisites are only these seven files.** `atoms.parquet`, `atompred.parquet` and\n  `features8.parquet` are also sitting in the workspace, and `final/build/` carries the scripts that\n  made them, but the scored `pipeline.py` names none of them. `build.sh` deliberately skips those\n  steps (and the importance/surrogate scripts). Running them would add ~20 minutes and change\n  nothing.\n- **`.ynorm.json` is not a build artifact.** `preprocess` writes it and `postprocess` reads it in\n  the same run; it is how the two hooks hand the normalisation tables to each other, since\n  `postprocess` never sees the engineered frame. A stale copy from a previous run is overwritten,\n  not reused.\n- **Nothing in `build/` reads the target.** The pair lists are loaded for `id`, `molecule_name`,\n  `atom_index_*` and `type` only, and molecules never straddle the train/test split, so the\n  group statistics in `features4` are safe to compute over train+test at once.\n- **`TYPE_W` is exponent 1, and that is load-bearing.** An earlier revert to it silently failed —\n  a string replacement that matched nothing because the file held the numbers as `np.float64(...)`\n  literals — and eight evaluations ran on exponent-1.5 weights worth about 0.020 more error. If you\n  edit those constants by script, re-read the file afterwards.\n- **`N_DRAWS = 2` was a clock decision, not a measured optimum.** Six draws scored -1.55806\n  (`[RESULT 25]`) with the wrong weights; two draws was what fit in the remaining session time.\n  More draws should help slightly and cost linearly in GPU time.\n- **`max_num_rows` above 256,000 is clamped by the judge.** `POOL = 512000` is the sampling pool,\n  not the context; do not read it as a context size.\n","package":[{"path":"build/build_features.py","lines":259,"direct":true,"text":"\"\"\"Precompute geometry / bond-topology features for every (train+test) coupling pair.\n\nMolecules are at most 29 atoms (QM9), so everything is done on dense padded\n(n_mol, 29, ...) tensors.  Output: features.parquet keyed by `id`.\nNothing here touches the target -- only structures.csv and the pair lists.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nT0 = time.time()\nELEMS = ['H', 'C', 'N', 'O', 'F']\nZNUM = np.array([1.0, 6.0, 7.0, 8.0, 9.0], np.float32)\nRCOV = np.array([0.31, 0.76, 0.71, 0.66, 0.57], np.float32)\nENEG = np.array([2.20, 2.55, 3.04, 3.44, 3.98], np.float32)\nA = 29\nBOND_SLACK = 0.40\n\n\ndef log(*a):\n  print(f\"[{time.time() - T0:7.1f}s]\", *a, flush=True)\n\n\n# ---------------------------------------------------------------- padded structures\ns = pd.read_csv('data/structures.csv')\nmol_code, mol_uniq = pd.factorize(s.molecule_name, sort=True)\ns['mol'] = mol_code\ns['ec'] = s.atom.map({e: i for i, e in enumerate(ELEMS)}).astype(np.int8)\nM = len(mol_uniq)\nlog('molecules', M, 'atoms', len(s))\n\npos = np.zeros((M, A, 3), np.float32)\nec = np.full((M, A), -1, np.int8)\npos[s.mol.values, s.atom_index.values] = s[['x', 'y', 'z']].values.astype(np.float32)\nec[s.mol.values, s.atom_index.values] = s.ec.values\nnatoms = np.bincount(s.mol.values, minlength=M).astype(np.float32)\nvalid = ec >= 0\necc = np.clip(ec, 0, None)\n\n# pairwise distances, inf where either atom is padding or i == j\nD = np.empty((M, A, A), np.float32)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  D[a:b] = np.linalg.norm(pos[a:b, :, None, :] - pos[a:b, None, :, :], axis=-1)\npairvalid = valid[:, :, None] & valid[:, None, :]\neye = np.eye(A, dtype=bool)[None]\nD[~pairvalid | eye] = np.inf\nlog('distances done')\n\n# ---------------------------------------------------------------- bond graph\nrr = RCOV[ecc]\nbond = (D <= (rr[:, :, None] + rr[:, None, :] + BOND_SLACK)) & pairvalid & ~eye\ndeg = bond.sum(2).astype(np.int8)\nhmask = valid & (ec == 0)\nlog('H atoms with degree != 1:', int((deg[hmask] != 1).sum()), 'of', int(hmask.sum()))\nlog('atoms with degree 0     :', int((deg[valid] == 0).sum()))\n\nnb_cnt = np.stack([(bond & (ec[:, None, :] == e)).sum(2) for e in range(5)], -1).astype(np.int8)  # (M,A,5)\nnbonds = bond.sum((1, 2)) / 2.0\nnrings = nbonds - natoms + 1.0\n\n# element counts per molecule\nmol_ecnt = np.stack([((ec == e) & valid).sum(1) for e in range(5)], -1).astype(np.float32)  # (M,5)\n\n# ---------------------------------------------------------------- per-atom descriptors\nDsafe = np.where(np.isfinite(D), D, np.float32(1e6))\nfinite = np.isfinite(D)\nnfin = finite.sum(2).astype(np.float32)\nd_mean = np.where(nfin > 0, np.where(finite, Dsafe, 0).sum(2) / np.maximum(nfin, 1), np.nan).astype(np.float32)\nd_min = np.where(nfin > 0, Dsafe.min(2), np.nan).astype(np.float32)\nd_max = np.where(nfin > 0, np.where(finite, Dsafe, 0).max(2), np.nan).astype(np.float32)\n\ncent = (pos * valid[..., None]).sum(1) / natoms[:, None]\nd_cent = np.linalg.norm(pos - cent[:, None, :], axis=-1).astype(np.float32)\nd_cent[~valid] = np.nan\n\ninvd = np.where(finite, 1.0 / np.maximum(Dsafe, 1e-3), 0.0).astype(np.float32)\nZb = np.where(valid, ZNUM[ecc], 0.0).astype(np.float32)\nEb = np.where(valid, ENEG[ecc], 0.0).astype(np.float32)\nsum_z_d2 = np.einsum('mij,mj->mi', invd ** 2, Zb).astype(np.float32)\nsum_z_d3 = np.einsum('mij,mj->mi', invd ** 3, Zb).astype(np.float32)\nsum_e_d2 = np.einsum('mij,mj->mi', invd ** 2, Eb).astype(np.float32)\nn_in_2 = ((D < 2.0) & finite).sum(2).astype(np.int8)\nn_in_3 = ((D < 3.0) & finite).sum(2).astype(np.int8)\nn_in_4 = ((D < 4.0) & finite).sum(2).astype(np.int8)\n\n# per-element nearest distance from each atom\nd_near_e = np.stack([np.where((ec[:, None, :] == e) & finite, Dsafe, np.float32(1e6)).min(2) for e in range(5)], -1)\nd_near_e[d_near_e > 1e5] = np.nan\n\n# k-th nearest neighbour distances\nDsort = np.sort(Dsafe, axis=2)\nnn = np.where(Dsort[:, :, :4] < 1e5, Dsort[:, :, :4], np.nan).astype(np.float32)\nlog('atom descriptors done')\n\n# ---------------------------------------------------------------- coupling pairs\ntr = pd.read_csv('data/train.csv', usecols=['id', 'molecule_name', 'atom_index_0', 'atom_index_1', 'type'])\nte = pd.read_csv('data/test.csv', usecols=['id', 'molecule_name', 'atom_index_0', 'atom_index_1', 'type'])\npairs = pd.concat([tr, te], ignore_index=True)\nmmap = pd.Series(np.arange(M), index=mol_uniq)\nm = mmap.reindex(pairs.molecule_name.values).values.astype(np.int64)\ni = pairs.atom_index_0.values.astype(np.int64)\nj = pairs.atom_index_1.values.astype(np.int64)\nN = len(pairs)\nlog('pairs', N)\n\n# parent atom of the H (atom_index_0 is always H)\nbond_i = bond[m, i]                      # (N, A)\nn0 = bond_i.argmax(1)\nassert bond_i.any(1).all(), 'some H has no bond'\n# parent of atom_1 when it is an H\nj_is_h = ec[m, j] == 0\nnj = bond[m, j].argmax(1)\n\nP = {}\nP['id'] = pairs.id.values\nP['type'] = pairs['type'].values\ntnum = pairs['type'].str[0].astype(np.int8).values\nP['jbond'] = tnum\n\npi, pj, pn0 = pos[m, i], pos[m, j], pos[m, n0]\ndist = np.linalg.norm(pi - pj, axis=1)\nP['dist'] = dist\nP['inv_dist3'] = 1.0 / dist ** 3\nP['d_i_n0'] = np.linalg.norm(pi - pn0, axis=1)\nP['d_n0_j'] = np.linalg.norm(pn0 - pj, axis=1)\n\n# molecule level\nP['natoms'] = natoms[m]\nfor k, e in enumerate(ELEMS):\n  P[f'mol_n{e}'] = mol_ecnt[m, k]\nP['mol_nrings'] = nrings[m].astype(np.float32)\nP['mol_dmax'] = d_max[m].max(1)\n\n\ndef atom_feats(prefix, idx):\n  P[f'{prefix}_deg'] = deg[m, idx]\n  for k, e in enumerate(ELEMS):\n    P[f'{prefix}_nb{e}'] = nb_cnt[m, idx, k]\n  P[f'{prefix}_dmean'] = d_mean[m, idx]\n  P[f'{prefix}_dmin'] = d_min[m, idx]\n  P[f'{prefix}_dcent'] = d_cent[m, idx]\n  P[f'{prefix}_zd2'] = sum_z_d2[m, idx]\n  P[f'{prefix}_zd3'] = sum_z_d3[m, idx]\n  P[f'{prefix}_ed2'] = sum_e_d2[m, idx]\n  P[f'{prefix}_n2'] = n_in_2[m, idx]\n  P[f'{prefix}_n3'] = n_in_3[m, idx]\n  P[f'{prefix}_n4'] = n_in_4[m, idx]\n  for k, e in enumerate(ELEMS):\n    P[f'{prefix}_near{e}'] = d_near_e[m, idx, k]\n  for k in range(1, 4):\n    P[f'{prefix}_nn{k}'] = nn[m, idx, k]\n\n\natom_feats('a0', i)\natom_feats('a1', j)\natom_feats('n0', n0)\nP['n0_z'] = ZNUM[ecc[m, n0]]\nP['a1_z'] = ZNUM[ecc[m, j]]\nlog('atom-mapped features done')\n\n\ndef unit(v):\n  n = np.linalg.norm(v, axis=1, keepdims=True)\n  return v / np.maximum(n, 1e-8)\n\n\n# angle at n0 between H and atom_1  (defined for 2J and 3J; for 1J n0 == j)\nP['cos_i_n0_j'] = (unit(pi - pn0) * unit(pj - pn0)).sum(1)\n# angle at the H between its parent and atom_1\nP['cos_n0_i_j'] = (unit(pn0 - pi) * unit(pj - pi)).sum(1)\n\n# ---------------------------------------------------------------- 3J path features\nis3 = tnum == 3\nidx3 = np.flatnonzero(is3)\nm3, i3, j3, n03 = m[idx3], i[idx3], j[idx3], n0[idx3]\ncnt = np.zeros(len(idx3), np.float32)\nsum_cos = np.zeros(len(idx3), np.float32)\nsum_cos2 = np.zeros(len(idx3), np.float32)\nsum_abscos = np.zeros(len(idx3), np.float32)\nmin_abscos = np.full(len(idx3), np.inf, np.float32)\nmax_abscos = np.full(len(idx3), -np.inf, np.float32)\nsum_t1 = np.zeros(len(idx3), np.float32)\nsum_t2 = np.zeros(len(idx3), np.float32)\nsum_dm = np.zeros(len(idx3), np.float32)\nfirst_m2 = np.full(len(idx3), -1, np.int64)\n\np_i3, p_j3, p_n03 = pos[m3, i3], pos[m3, j3], pos[m3, n03]\nb1 = p_n03 - p_i3\nfor c in range(A):\n  ok = bond[m3, n03, c] & bond[m3, c, j3] & (c != i3) & (c != j3)\n  w = np.flatnonzero(ok)\n  if len(w) == 0:\n    continue\n  pc = pos[m3[w], c]\n  v1 = b1[w]\n  v2 = pc - p_n03[w]\n  v3 = p_j3[w] - pc\n  c1 = np.cross(v1, v2)\n  c2 = np.cross(v2, v3)\n  cosd = (unit(c1) * unit(c2)).sum(1)\n  cosd = np.clip(cosd, -1, 1)\n  cnt[w] += 1\n  sum_cos[w] += cosd\n  sum_cos2[w] += cosd ** 2\n  ac = np.abs(cosd)\n  sum_abscos[w] += ac\n  min_abscos[w] = np.minimum(min_abscos[w], ac)\n  max_abscos[w] = np.maximum(max_abscos[w], ac)\n  sum_t1[w] += (unit(-v1) * unit(v2)).sum(1)\n  sum_t2[w] += (unit(-v2) * unit(v3)).sum(1)\n  sum_dm[w] += np.linalg.norm(pc - p_i3[w], axis=1)\n  new = first_m2[w] < 0\n  first_m2[w[new]] = c\n\nnz = np.maximum(cnt, 1)\n\n\ndef scatter3(name, vals, dtype=np.float32):\n  out = np.full(N, np.nan, np.float32)\n  out[idx3] = vals\n  P[name] = out.astype(dtype)\n\n\nscatter3('p3_count', cnt)\nscatter3('p3_cos', sum_cos / nz)\nscatter3('p3_cos2', sum_cos2 / nz)\nscatter3('p3_abscos', sum_abscos / nz)\nscatter3('p3_abscos_min', np.where(cnt > 0, min_abscos, np.nan))\nscatter3('p3_abscos_max', np.where(cnt > 0, max_abscos, np.nan))\nscatter3('p3_cos_t1', sum_t1 / nz)\nscatter3('p3_cos_t2', sum_t2 / nz)\nscatter3('p3_d_i_m2', sum_dm / nz)\nmm = np.clip(first_m2, 0, None)\nscatter3('p3_m2_deg', np.where(first_m2 >= 0, deg[m3, mm], np.nan))\nscatter3('p3_m2_z', np.where(first_m2 >= 0, ZNUM[ecc[m3, mm]], np.nan))\nscatter3('p3_m2_dmean', np.where(first_m2 >= 0, d_mean[m3, mm], np.nan))\nscatter3('p3_d_n0_m2', np.where(first_m2 >= 0, np.linalg.norm(pos[m3, mm] - p_n03, axis=1), np.nan))\nscatter3('p3_d_m2_j', np.where(first_m2 >= 0, np.linalg.norm(pos[m3, mm] - p_j3, axis=1), np.nan))\nlog('3J path features done; rows with no path:', int((cnt == 0).sum()))\n\n# ---------------------------------------------------------------- assemble\ndf = pd.DataFrame(P)\nfor c in df.columns:\n  if c in ('id', 'type'):\n    continue\n  df[c] = df[c].astype(np.float32)\n\n# X-only relative features\ng = df.groupby('type')['dist']\ndf['dist_rel_type'] = (df['dist'] / g.transform('mean')).astype(np.float32)\nmt = df.assign(mol=m).groupby(['mol', 'type'])['dist']\ndf['dist_rel_moltype'] = (df['dist'] - mt.transform('mean')).astype(np.float32)\ndf['moltype_count'] = mt.transform('size').astype(np.float32)\n\ndf.to_parquet('features.parquet', index=False)\nlog('written features.parquet', df.shape)\nprint(df.dtypes.value_counts())\nprint(df.head())\n"},{"path":"build/build_features2.py","lines":161,"direct":true,"text":"\"\"\"Second wave of geometry features -> features2.parquet (keyed by id).\n\nAdds what the first wave lacked: bond angles at the two heavy atoms of the coupling path\n(hybridisation is what sets 1J and modulates 2J), 2-core / ring membership, the composition of\nthe second coordination shell (inductive effects), and the atom density around the midpoint of\nthe pair.  Written to a separate file so it can be built while an evaluation is reading the first.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nT0 = time.time()\nELEMS = ['H', 'C', 'N', 'O', 'F']\nZNUM = np.array([1.0, 6.0, 7.0, 8.0, 9.0], np.float32)\nRCOV = np.array([0.31, 0.76, 0.71, 0.66, 0.57], np.float32)\nENEG = np.array([2.20, 2.55, 3.04, 3.44, 3.98], np.float32)\nA = 29\nBOND_SLACK = 0.40\nMAXDEG = 4\n\n\ndef log(*a):\n  print(f\"[{time.time() - T0:7.1f}s]\", *a, flush=True)\n\n\ns = pd.read_csv('data/structures.csv')\nmol_code, mol_uniq = pd.factorize(s.molecule_name, sort=True)\ns['mol'] = mol_code\ns['ec'] = s.atom.map({e: i for i, e in enumerate(ELEMS)}).astype(np.int8)\nM = len(mol_uniq)\npos = np.zeros((M, A, 3), np.float32)\nec = np.full((M, A), -1, np.int8)\npos[s.mol.values, s.atom_index.values] = s[['x', 'y', 'z']].values.astype(np.float32)\nec[s.mol.values, s.atom_index.values] = s.ec.values\nvalid = ec >= 0\necc = np.clip(ec, 0, None)\n\nD = np.empty((M, A, A), np.float32)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  D[a:b] = np.linalg.norm(pos[a:b, :, None, :] - pos[a:b, None, :, :], axis=-1)\npairvalid = valid[:, :, None] & valid[:, None, :]\neye = np.eye(A, dtype=bool)[None]\nD[~pairvalid | eye] = np.inf\nrr = RCOV[ecc]\nbond = (D <= (rr[:, :, None] + rr[:, None, :] + BOND_SLACK)) & pairvalid & ~eye\nlog('bond graph')\n\n# ---------------------------------------------------------------- bond angles at each atom\nnbidx = np.zeros((M, A, MAXDEG), np.int16)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  nbidx[a:b] = np.argsort(~bond[a:b], axis=2, kind='stable')[:, :, :MAXDEG].astype(np.int16)\nmi = np.arange(M)[:, None, None]\nai = np.arange(A)[None, :, None]\nnbmask = bond[mi, ai, nbidx]                                  # (M,A,MAXDEG)\nV = pos[mi, nbidx] - pos[:, :, None, :]                       # (M,A,MAXDEG,3)\nV /= np.maximum(np.linalg.norm(V, axis=-1, keepdims=True), 1e-8)\nC = np.einsum('makd,mald->makl', V, V)\npm = nbmask[:, :, :, None] & nbmask[:, :, None, :] & ~np.eye(MAXDEG, dtype=bool)\nnpair = pm.sum((2, 3))\nang_mean = np.where(npair > 0, np.where(pm, C, 0).sum((2, 3)) / np.maximum(npair, 1), np.nan)\nang_min = np.where(npair > 0, np.where(pm, C, np.inf).min((2, 3)), np.nan)\nang_max = np.where(npair > 0, np.where(pm, C, -np.inf).max((2, 3)), np.nan)\ndel V, C, pm\nlog('bond angles')\n\n# ---------------------------------------------------------------- 2-core (ring system)\nalive = valid.copy()\nfor _ in range(20):\n  d = (bond & alive[:, None, :] & alive[:, :, None]).sum(2)\n  new = alive & (d >= 2)\n  if np.array_equal(new, alive):\n    break\n  alive = new\nin_core = alive\ncore_n = in_core.sum(1).astype(np.float32)\nlog('2-core; molecules with a ring:', int((core_n > 0).sum()))\n\n# ---------------------------------------------------------------- second coordination shell\nAf = bond.astype(np.float32)\nsh2 = np.empty((M, A, A), bool)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  sh2[a:b] = (np.matmul(Af[a:b], Af[a:b]) > 0.5) & ~bond[a:b] & ~eye & pairvalid[a:b]\ndel Af\nnb2 = np.stack([(sh2 & (ec[:, None, :] == e)).sum(2) for e in range(5)], -1).astype(np.int8)\ndel sh2\nenb = np.where(valid, ENEG[ecc], 0.0).astype(np.float32)\nnben = np.einsum('mij,mj->mi', bond.astype(np.float32), enb).astype(np.float32)\nlog('second shell')\n\n# ---------------------------------------------------------------- coupling pairs\ntr = pd.read_csv('data/train.csv', usecols=['id', 'molecule_name', 'atom_index_0', 'atom_index_1'])\nte = pd.read_csv('data/test.csv', usecols=['id', 'molecule_name', 'atom_index_0', 'atom_index_1'])\npairs = pd.concat([tr, te], ignore_index=True)\nmmap = pd.Series(np.arange(M), index=mol_uniq)\nm = mmap.reindex(pairs.molecule_name.values).values.astype(np.int64)\ni = pairs.atom_index_0.values.astype(np.int64)\nj = pairs.atom_index_1.values.astype(np.int64)\nn0 = bond[m, i].argmax(1)\nN = len(pairs)\n\nP = {'id': pairs.id.values}\nfor pre, idx in (('n0', n0), ('a1', j)):\n  P[f'{pre}_ang_mean'] = ang_mean[m, idx]\n  P[f'{pre}_ang_min'] = ang_min[m, idx]\n  P[f'{pre}_ang_max'] = ang_max[m, idx]\n  P[f'{pre}_core'] = in_core[m, idx].astype(np.float32)\n  P[f'{pre}_nben'] = nben[m, idx]\n  for k, e in enumerate(ELEMS):\n    P[f'{pre}_2nb{e}'] = nb2[m, idx, k]\nP['mol_coren'] = core_n[m]\nlog('atom-mapped')\n\n# ---------------------------------------------------------------- midpoint neighbourhood\nmid_dmin = np.empty(N, np.float32)\nmid_n2 = np.empty(N, np.float32)\nmid_n3 = np.empty(N, np.float32)\nmid_zd2 = np.empty(N, np.float32)\nn_between = np.empty(N, np.float32)\nZb = np.where(valid, ZNUM[ecc], 0.0).astype(np.float32)\nstep = 400000\nfor a in range(0, N, step):\n  b = min(a + step, N)\n  mm = m[a:b]\n  mid = (pos[mm, i[a:b]] + pos[mm, j[a:b]]) * 0.5\n  dd = np.linalg.norm(pos[mm] - mid[:, None, :], axis=-1)\n  ok = valid[mm].copy()\n  r = np.arange(b - a)\n  ok[r, i[a:b]] = False\n  ok[r, j[a:b]] = False\n  dsafe = np.where(ok, dd, np.float32(1e6))\n  mid_dmin[a:b] = dsafe.min(1)\n  mid_n2[a:b] = (dsafe < 2.0).sum(1)\n  mid_n3[a:b] = (dsafe < 3.0).sum(1)\n  mid_zd2[a:b] = (np.where(ok, Zb[mm] / np.maximum(dd, 0.3) ** 2, 0)).sum(1)\n  half = np.linalg.norm(pos[mm, i[a:b]] - pos[mm, j[a:b]], axis=1) * 0.5\n  n_between[a:b] = (dsafe < half[:, None]).sum(1)\nP['mid_dmin'] = np.where(mid_dmin > 1e5, np.nan, mid_dmin)\nP['mid_n2'] = mid_n2\nP['mid_n3'] = mid_n3\nP['mid_zd2'] = mid_zd2\nP['n_between'] = n_between\nlog('midpoint')\n\n# ---------------------------------------------------------------- path length / extension\nF1 = pd.read_parquet('features.parquet', columns=['id', 'jbond', 'dist', 'd_i_n0', 'd_n0_j',\n                                                  'p3_d_n0_m2', 'p3_d_m2_j'])\nassert (F1.id.values == P['id']).all()\njb = F1.jbond.values\nplen = np.where(jb == 1, F1.dist.values,\n                np.where(jb == 2, F1.d_i_n0.values + F1.d_n0_j.values,\n                         F1.d_i_n0.values + F1.p3_d_n0_m2.values + F1.p3_d_m2_j.values))\nP['path_len'] = plen.astype(np.float32)\nP['dist_over_path'] = (F1.dist.values / plen).astype(np.float32)\n\ndf = pd.DataFrame({k: (v if k == 'id' else np.asarray(v, np.float32)) for k, v in P.items()})\ndf.to_parquet('features2.parquet', index=False)\nlog('written features2.parquet', df.shape)\nprint(df.describe().T.to_string())\n"},{"path":"build/build_features3.py","lines":159,"direct":true,"text":"\"\"\"Third feature wave -> features3.parquet (keyed by id).\n\nAngles and bond lengths seen *from the coupling partner* (the H-C-X angles are the s-character\nsignal 1J actually responds to), topological shell sizes, whether the 3J path runs through a\nring, and a geometry-only molecular polarity term.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nT0 = time.time()\nELEMS = ['H', 'C', 'N', 'O', 'F']\nZNUM = np.array([1.0, 6.0, 7.0, 8.0, 9.0], np.float32)\nRCOV = np.array([0.31, 0.76, 0.71, 0.66, 0.57], np.float32)\nENEG = np.array([2.20, 2.55, 3.04, 3.44, 3.98], np.float32)\nA, MAXDEG, BOND_SLACK = 29, 4, 0.40\n\n\ndef log(*a):\n  print(f\"[{time.time() - T0:7.1f}s]\", *a, flush=True)\n\n\ns = pd.read_csv('data/structures.csv')\nmol_code, mol_uniq = pd.factorize(s.molecule_name, sort=True)\ns['mol'] = mol_code\ns['ec'] = s.atom.map({e: i for i, e in enumerate(ELEMS)}).astype(np.int8)\nM = len(mol_uniq)\npos = np.zeros((M, A, 3), np.float32)\nec = np.full((M, A), -1, np.int8)\npos[s.mol.values, s.atom_index.values] = s[['x', 'y', 'z']].values.astype(np.float32)\nec[s.mol.values, s.atom_index.values] = s.ec.values\nvalid = ec >= 0\necc = np.clip(ec, 0, None)\nnatoms = valid.sum(1).astype(np.float32)\n\nD = np.empty((M, A, A), np.float32)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  D[a:b] = np.linalg.norm(pos[a:b, :, None, :] - pos[a:b, None, :, :], axis=-1)\npairvalid = valid[:, :, None] & valid[:, None, :]\neye = np.eye(A, dtype=bool)[None]\nD[~pairvalid | eye] = np.inf\nrr = RCOV[ecc]\nbond = (D <= (rr[:, :, None] + rr[:, None, :] + BOND_SLACK)) & pairvalid & ~eye\n\n# neighbour index table\nnbidx = np.zeros((M, A, MAXDEG), np.int16)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  nbidx[a:b] = np.argsort(~bond[a:b], axis=2, kind='stable')[:, :, :MAXDEG].astype(np.int16)\nmi = np.arange(M)[:, None, None]\nai = np.arange(A)[None, :, None]\nnbmask = bond[mi, ai, nbidx]\nVraw = pos[mi, nbidx] - pos[:, :, None, :]                    # (M,A,MAXDEG,3) atom -> neighbour\nblen = np.linalg.norm(Vraw, axis=-1)\nVh = Vraw / np.maximum(blen[..., None], 1e-8)\nbl = np.where(nbmask, blen, np.nan)\nbl_mean = np.nanmean(np.where(nbmask, blen, np.nan), axis=2)\nbl_min = np.where(nbmask.any(2), np.where(nbmask, blen, np.inf).min(2), np.nan)\nbl_max = np.where(nbmask.any(2), np.where(nbmask, blen, -np.inf).max(2), np.nan)\nlog('bond lengths')\n\n# 2-core\nalive = valid.copy()\nfor _ in range(20):\n  d = (bond & alive[:, None, :] & alive[:, :, None]).sum(2)\n  new = alive & (d >= 2)\n  if np.array_equal(new, alive):\n    break\n  alive = new\nin_core = alive\n\n# topological shells\nAf = bond.astype(np.float32)\nR = [bond]\nprev = bond.copy()\nfor k in range(3):\n  nxt = np.empty((M, A, A), bool)\n  for a in range(0, M, 20000):\n    b = min(a + 20000, M)\n    nxt[a:b] = (np.matmul(R[-1][a:b].astype(np.float32), Af[a:b]) > 0.5) & pairvalid[a:b] & ~eye\n    for q in R:\n      nxt[a:b] &= ~q[a:b]\n  R.append(nxt)\n  prev = nxt\ngd = np.stack([r.sum(2) for r in R], -1).astype(np.float32)   # (M,A,4): #atoms at graph distance 1..4\ndel Af, R, prev\nlog('graph shells')\n\n# geometry-only polarity: EN-weighted first moment about the centroid\ncent = (pos * valid[..., None]).sum(1) / natoms[:, None]\nw = np.where(valid, ENEG[ecc], 0.0)\nw = w - np.where(valid, w.sum(1, keepdims=True) / natoms[:, None], 0.0)\ndip = np.linalg.norm((w[..., None] * (pos - cent[:, None, :]) * valid[..., None]).sum(1), axis=-1)\n\n# ---------------------------------------------------------------- pairs\ntr = pd.read_csv('data/train.csv', usecols=['id', 'molecule_name', 'atom_index_0', 'atom_index_1', 'type'])\nte = pd.read_csv('data/test.csv', usecols=['id', 'molecule_name', 'atom_index_0', 'atom_index_1', 'type'])\npairs = pd.concat([tr, te], ignore_index=True)\nmmap = pd.Series(np.arange(M), index=mol_uniq)\nm = mmap.reindex(pairs.molecule_name.values).values.astype(np.int64)\ni = pairs.atom_index_0.values.astype(np.int64)\nj = pairs.atom_index_1.values.astype(np.int64)\nn0 = bond[m, i].argmax(1)\nN = len(pairs)\nP = {'id': pairs.id.values}\n\n\ndef partner_angles(prefix, base, other):\n  \"\"\"cos of the angle at `base` between the direction to `other` and each bond of `base`.\"\"\"\n  u = pos[m, other] - pos[m, base]\n  u /= np.maximum(np.linalg.norm(u, axis=1, keepdims=True), 1e-8)\n  c = (Vh[m, base] * u[:, None, :]).sum(-1)                   # (N, MAXDEG)\n  msk = nbmask[m, base] & (nbidx[m, base] != other[:, None])\n  n = msk.sum(1)\n  P[f'{prefix}_mean'] = np.where(n > 0, np.where(msk, c, 0).sum(1) / np.maximum(n, 1), np.nan)\n  P[f'{prefix}_min'] = np.where(n > 0, np.where(msk, c, np.inf).min(1), np.nan)\n  P[f'{prefix}_max'] = np.where(n > 0, np.where(msk, c, -np.inf).max(1), np.nan)\n\n\npartner_angles('angH_n0', n0, i)      # H-n0-X angles: s-character of n0 as the H sees it\npartner_angles('angH_a1', j, i)       # the same seen from the other end\n\nfor pre, idx in (('n0', n0), ('a1', j)):\n  P[f'{pre}_bl_mean'] = bl_mean[m, idx]\n  P[f'{pre}_bl_min'] = bl_min[m, idx]\n  P[f'{pre}_bl_max'] = bl_max[m, idx]\n  P[f'{pre}_gd3'] = gd[m, idx, 2]\n  P[f'{pre}_gd4'] = gd[m, idx, 3]\n\n# H-X bond length relative to the mean H-X length in the same molecule (X = same element)\ndHn0 = np.linalg.norm(pos[m, i] - pos[m, n0], axis=1)\nkey = pd.MultiIndex.from_arrays([m, ecc[m, n0]])\ng = pd.Series(dHn0).groupby(key)\nP['d_i_n0_rel'] = (dHn0 - g.transform('mean').to_numpy())\nP['mol_dip_geom'] = dip[m]\n\n# ---------------------------------------------------------------- does the 3J path use a ring\ntnum = pairs['type'].str[0].astype(np.int8).values\nidx3 = np.flatnonzero(tnum == 3)\nm3, i3, j3, n03 = m[idx3], i[idx3], j[idx3], n0[idx3]\ncore_frac = np.zeros(len(idx3), np.float32)\ncnt = np.zeros(len(idx3), np.float32)\nfor c in range(A):\n  ok = bond[m3, n03, c] & bond[m3, c, j3] & (c != i3) & (c != j3)\n  w2 = np.flatnonzero(ok)\n  if len(w2) == 0:\n    continue\n  cnt[w2] += 1\n  core_frac[w2] += in_core[m3[w2], c]\np3_m2_core = np.full(N, np.nan, np.float32)\np3_m2_core[idx3] = core_frac / np.maximum(cnt, 1)\nP['p3_m2_core'] = p3_m2_core\nP['p3_ring'] = np.where(tnum == 3, p3_m2_core * in_core[m, n0] * in_core[m, j], np.nan)\n\ndf = pd.DataFrame({k: (v if k == 'id' else np.asarray(v, np.float32)) for k, v in P.items()})\ndf.to_parquet('features3.parquet', index=False)\nlog('written features3.parquet', df.shape)\nprint(df.describe().T.to_string())\n"},{"path":"build/build_features4.py","lines":40,"direct":true,"text":"\"\"\"Fourth wave -> features4.parquet: statistics of a coupling's distance relative to the other\ncouplings that share one of its two atoms, or its molecule.  Uses the pair lists only (no target),\nand a molecule is wholly inside one split, so the groups never straddle train and test.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nt0 = time.time()\ncols = ['id', 'molecule_name', 'atom_index_0', 'atom_index_1', 'type']\npairs = pd.concat([pd.read_csv('data/train.csv', usecols=cols),\n                   pd.read_csv('data/test.csv', usecols=cols)], ignore_index=True)\nF = pd.read_parquet('features.parquet', columns=['id', 'dist'])\nassert (F.id.values == pairs.id.values).all()\npairs['dist'] = F.dist.values\nmol = pd.factorize(pairs.molecule_name)[0]\npairs['mol'] = mol\n\nout = {'id': pairs.id.values}\nfor tag, keys in (('g0', ['mol', 'atom_index_0']),\n                  ('g1', ['mol', 'atom_index_1']),\n                  ('g0t', ['mol', 'atom_index_0', 'type']),\n                  ('g1t', ['mol', 'atom_index_1', 'type']),\n                  ('gm', ['mol'])):\n  g = pairs.groupby(keys, sort=False)['dist']\n  mean = g.transform('mean').to_numpy()\n  out[f'{tag}_cnt'] = g.transform('size').to_numpy()\n  out[f'{tag}_ddiff'] = pairs.dist.values - mean\n  if tag in ('g0', 'g1'):\n    std = g.transform('std').to_numpy()\n    out[f'{tag}_dstd'] = std\n    out[f'{tag}_dmin'] = pairs.dist.values - g.transform('min').to_numpy()\n    out[f'{tag}_dmax'] = g.transform('max').to_numpy() - pairs.dist.values\n    out[f'{tag}_dz'] = np.where(std > 1e-6, (pairs.dist.values - mean) / np.maximum(std, 1e-6), np.nan)\n  print(tag, '%.0fs' % (time.time() - t0), flush=True)\n\ndf = pd.DataFrame({k: (v if k == 'id' else np.asarray(v, np.float32)) for k, v in out.items()})\ndf.to_parquet('features4.parquet', index=False)\nprint('written', df.shape, '%.0fs' % (time.time() - t0))\nprint(df.describe().T.to_string())\n"},{"path":"build/build_features5.py","lines":159,"direct":true,"text":"\"\"\"Fifth wave -> features5.parquet: a richer description of the 3J middle atom, out-of-plane\nangles at the path's heavy atoms, and smooth radial / angular symmetry functions around both\nends of the coupling.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nT0 = time.time()\nELEMS = ['H', 'C', 'N', 'O', 'F']\nZNUM = np.array([1.0, 6.0, 7.0, 8.0, 9.0], np.float32)\nRCOV = np.array([0.31, 0.76, 0.71, 0.66, 0.57], np.float32)\nENEG = np.array([2.20, 2.55, 3.04, 3.44, 3.98], np.float32)\nA, MAXDEG, BOND_SLACK = 29, 4, 0.40\nRS = (1.8, 2.5, 3.2, 4.2)\n\n\ndef log(*a):\n  print(f\"[{time.time() - T0:7.1f}s]\", *a, flush=True)\n\n\ns = pd.read_csv('data/structures.csv')\nmol_code, mol_uniq = pd.factorize(s.molecule_name, sort=True)\ns['mol'] = mol_code\ns['ec'] = s.atom.map({e: i for i, e in enumerate(ELEMS)}).astype(np.int8)\nM = len(mol_uniq)\npos = np.zeros((M, A, 3), np.float32)\nec = np.full((M, A), -1, np.int8)\npos[s.mol.values, s.atom_index.values] = s[['x', 'y', 'z']].values.astype(np.float32)\nec[s.mol.values, s.atom_index.values] = s.ec.values\nvalid = ec >= 0\necc = np.clip(ec, 0, None)\n\nD = np.empty((M, A, A), np.float32)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  D[a:b] = np.linalg.norm(pos[a:b, :, None, :] - pos[a:b, None, :, :], axis=-1)\npairvalid = valid[:, :, None] & valid[:, None, :]\neye = np.eye(A, dtype=bool)[None]\nD[~pairvalid | eye] = np.inf\nrr = RCOV[ecc]\nbond = (D <= (rr[:, :, None] + rr[:, None, :] + BOND_SLACK)) & pairvalid & ~eye\ndeg = bond.sum(2).astype(np.int8)\n\nnbidx = np.zeros((M, A, MAXDEG), np.int16)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  nbidx[a:b] = np.argsort(~bond[a:b], axis=2, kind='stable')[:, :, :MAXDEG].astype(np.int16)\nmi = np.arange(M)[:, None, None]\nai = np.arange(A)[None, :, None]\nnbmask = bond[mi, ai, nbidx]\nVraw = pos[mi, nbidx] - pos[:, :, None, :]\nblen = np.linalg.norm(Vraw, axis=-1)\nVh = Vraw / np.maximum(blen[..., None], 1e-8)\nbl_mean = np.where(nbmask.any(2), np.where(nbmask, blen, 0).sum(2) / np.maximum(nbmask.sum(2), 1), np.nan)\nC = np.einsum('makd,mald->makl', Vh, Vh)\npm = nbmask[:, :, :, None] & nbmask[:, :, None, :] & ~np.eye(MAXDEG, dtype=bool)\nnpair = pm.sum((2, 3))\nang_mean = np.where(npair > 0, np.where(pm, C, 0).sum((2, 3)) / np.maximum(npair, 1), np.nan)\nang_max = np.where(npair > 0, np.where(pm, C, -np.inf).max((2, 3)), np.nan)\ndel C, pm\n\nenb = np.where(valid, ENEG[ecc], 0.0).astype(np.float32)\nnben = np.einsum('mij,mj->mi', bond.astype(np.float32), enb).astype(np.float32)\nnbH = (bond & (ec[:, None, :] == 0)).sum(2).astype(np.int8)\nfinite = np.isfinite(D)\nDsafe = np.where(finite, D, np.float32(1e6))\ninvd = np.where(finite, 1.0 / np.maximum(Dsafe, 1e-3), 0.0).astype(np.float32)\nZb = np.where(valid, ZNUM[ecc], 0.0).astype(np.float32)\nzd3 = np.einsum('mij,mj->mi', invd ** 3, Zb).astype(np.float32)\nnn1 = np.where(finite.any(2), np.sort(Dsafe, 2)[:, :, 1], np.nan).astype(np.float32)\nlog('atom descriptors')\n\n# ---------------------------------------------------------------- out-of-plane at degree-3 atoms\n# |cos| between a bond and the normal of the plane of the two other bonds; 0 for planar sp2.\noop = np.full((M, A), np.nan, np.float32)\nthree = (deg == 3) & valid\nif three.any():\n  n1 = np.cross(Vh[:, :, 1], Vh[:, :, 2])\n  n1 /= np.maximum(np.linalg.norm(n1, axis=-1, keepdims=True), 1e-8)\n  oop = np.where(three, np.abs((Vh[:, :, 0] * n1).sum(-1)), np.nan).astype(np.float32)\nlog('out of plane')\n\n# ---------------------------------------------------------------- pairs\ncols = ['id', 'molecule_name', 'atom_index_0', 'atom_index_1', 'type']\npairs = pd.concat([pd.read_csv('data/train.csv', usecols=cols),\n                   pd.read_csv('data/test.csv', usecols=cols)], ignore_index=True)\nmmap = pd.Series(np.arange(M), index=mol_uniq)\nm = mmap.reindex(pairs.molecule_name.values).values.astype(np.int64)\ni = pairs.atom_index_0.values.astype(np.int64)\nj = pairs.atom_index_1.values.astype(np.int64)\nn0 = bond[m, i].argmax(1)\nN = len(pairs)\nP = {'id': pairs.id.values}\nP['n0_oop'] = oop[m, n0]\nP['a1_oop'] = oop[m, j]\n\n# ---------------------------------------------------------------- symmetry functions\nfor tag, idx in (('a0', i), ('a1', j)):\n  ang_sum1 = np.zeros(N, np.float32)\n  ang_sum4 = np.zeros(N, np.float32)\n  rad = np.zeros((N, len(RS)), np.float32)\n  radH = np.zeros((N, len(RS)), np.float32)\n  step = 400000\n  for a in range(0, N, step):\n    b = min(a + step, N)\n    mm, ii = m[a:b], idx[a:b]\n    d = D[mm, ii]                                             # (n, A), inf on padding / self\n    ok = np.isfinite(d)\n    ds = np.where(ok, d, np.float32(1e3))\n    z = np.where(ok, ZNUM[ecc[mm]], 0.0)\n    ish = np.where(ok, (ec[mm] == 0).astype(np.float32), 0.0)\n    for k, r in enumerate(RS):\n      g = np.exp(-2.0 * (ds - r) ** 2)\n      rad[a:b, k] = (g * z).sum(1)\n      radH[a:b, k] = (g * ish).sum(1)\n    u = pos[mm] - pos[mm, ii][:, None, :]\n    u /= np.maximum(np.linalg.norm(u, axis=-1, keepdims=True), 1e-8)\n    w = np.where(ok & (ds < 4.0), np.exp(-0.25 * ds ** 2), 0.0).astype(np.float32)\n    cc = np.einsum('nad,nbd->nab', u, u)\n    ww = w[:, :, None] * w[:, None, :]\n    ww[:, np.arange(A), np.arange(A)] = 0.0\n    h = (1.0 + cc) * 0.5\n    ang_sum1[a:b] = (ww * h).sum((1, 2)) * 0.5\n    ang_sum4[a:b] = (ww * h ** 4).sum((1, 2)) * 0.5\n  for k, r in enumerate(RS):\n    P[f'{tag}_radZ{k}'] = rad[:, k]\n    P[f'{tag}_radH{k}'] = radH[:, k]\n  P[f'{tag}_ang1'] = ang_sum1\n  P[f'{tag}_ang4'] = ang_sum4\n  log(f'symmetry functions {tag}')\n\n# ---------------------------------------------------------------- richer 3J middle atom\ntnum = pairs['type'].str[0].astype(np.int8).values\nidx3 = np.flatnonzero(tnum == 3)\nm3, i3, j3, n03 = m[idx3], i[idx3], j[idx3], n0[idx3]\nacc = {k: np.zeros(len(idx3), np.float32) for k in\n       ('nben', 'nbH', 'ang_mean', 'ang_max', 'zd3', 'nn1', 'bl_mean', 'oop', 'deg')}\ncnt = np.zeros(len(idx3), np.float32)\nsrc = {'nben': nben, 'nbH': nbH.astype(np.float32), 'ang_mean': ang_mean, 'ang_max': ang_max,\n       'zd3': zd3, 'nn1': nn1, 'bl_mean': bl_mean, 'oop': oop, 'deg': deg.astype(np.float32)}\nfor c in range(A):\n  ok = bond[m3, n03, c] & bond[m3, c, j3] & (c != i3) & (c != j3)\n  w = np.flatnonzero(ok)\n  if len(w) == 0:\n    continue\n  cnt[w] += 1\n  for k, arr in src.items():\n    acc[k][w] += np.nan_to_num(arr[m3[w], c], nan=0.0)\nfor k in src:\n  out = np.full(N, np.nan, np.float32)\n  out[idx3] = acc[k] / np.maximum(cnt, 1)\n  P[f'p3_m2_{k}'] = out\nlog('3J middle atom')\n\ndf = pd.DataFrame({k: (v if k == 'id' else np.asarray(v, np.float32)) for k, v in P.items()})\ndf.to_parquet('features5.parquet', index=False)\nlog('written features5.parquet', df.shape)\nprint(df.describe().T.to_string())\n"},{"path":"build/build_features6.py","lines":148,"direct":true,"text":"\"\"\"Sixth wave -> features6.parquet: the substituent pattern one and two bonds past the H.\n\n1JHC and the 2J types dominate the metric and both respond to what sits on the carbon the H is\nattached to, and to how those substituents' own bonds are oriented relative to the C-H bond\n(hyperconjugation: an anti-periplanar electronegative atom withdraws from the C-H sigma bond).\nSo: each substituent of n0 described individually rather than as a mean, and the H-n0-X-w\ndihedrals over the third shell, weighted by the electronegativity of w.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nT0 = time.time()\nELEMS = ['H', 'C', 'N', 'O', 'F']\nZNUM = np.array([1.0, 6.0, 7.0, 8.0, 9.0], np.float32)\nRCOV = np.array([0.31, 0.76, 0.71, 0.66, 0.57], np.float32)\nENEG = np.array([2.20, 2.55, 3.04, 3.44, 3.98], np.float32)\nA, MAXDEG, BOND_SLACK = 29, 4, 0.40\n\n\ndef log(*a):\n  print(f\"[{time.time() - T0:7.1f}s]\", *a, flush=True)\n\n\ndef unit(v):\n  return v / np.maximum(np.linalg.norm(v, axis=-1, keepdims=True), 1e-8)\n\n\ns = pd.read_csv('data/structures.csv')\nmol_code, mol_uniq = pd.factorize(s.molecule_name, sort=True)\ns['mol'] = mol_code\ns['ec'] = s.atom.map({e: i for i, e in enumerate(ELEMS)}).astype(np.int8)\nM = len(mol_uniq)\npos = np.zeros((M, A, 3), np.float32)\nec = np.full((M, A), -1, np.int8)\npos[s.mol.values, s.atom_index.values] = s[['x', 'y', 'z']].values.astype(np.float32)\nec[s.mol.values, s.atom_index.values] = s.ec.values\nvalid = ec >= 0\necc = np.clip(ec, 0, None)\n\nD = np.empty((M, A, A), np.float32)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  D[a:b] = np.linalg.norm(pos[a:b, :, None, :] - pos[a:b, None, :, :], axis=-1)\npairvalid = valid[:, :, None] & valid[:, None, :]\neye = np.eye(A, dtype=bool)[None]\nD[~pairvalid | eye] = np.inf\nrr = RCOV[ecc]\nbond = (D <= (rr[:, :, None] + rr[:, None, :] + BOND_SLACK)) & pairvalid & ~eye\n\nnbidx = np.zeros((M, A, MAXDEG), np.int16)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  nbidx[a:b] = np.argsort(~bond[a:b], axis=2, kind='stable')[:, :, :MAXDEG].astype(np.int16)\nmi = np.arange(M)[:, None, None]\nai = np.arange(A)[None, :, None]\nnbmask = bond[mi, ai, nbidx]\nlog('bond graph')\n\ncols = ['id', 'molecule_name', 'atom_index_0', 'atom_index_1']\npairs = pd.concat([pd.read_csv('data/train.csv', usecols=cols),\n                   pd.read_csv('data/test.csv', usecols=cols)], ignore_index=True)\nmmap = pd.Series(np.arange(M), index=mol_uniq)\nm = mmap.reindex(pairs.molecule_name.values).values.astype(np.int64)\ni = pairs.atom_index_0.values
