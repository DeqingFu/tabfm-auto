:root, [data-theme="light"] {
  color-scheme: light;
  --bg: hsl(210 24% 98%);
  --surface: hsl(0 0% 100%);
  --subtle: hsl(210 22% 95.5%);
  --subtle-2: hsl(210 20% 92.5%);
  --border: hsl(214 20% 89%);
  --hairline: hsl(214 18% 91.5%);
  --text: hsl(222 36% 11%);
  --text-2: hsl(218 20% 28%);
  --muted: hsl(215 14% 46%);
  --accent: hsl(20 78% 46%);
  --accent-soft: hsla(20 84% 50% / 0.11);
  --pos: hsl(158 72% 26%);
  --pos-soft: hsla(158 72% 36% / 0.12);
  --neg: hsl(352 70% 42%);
  --neg-soft: hsla(352 76% 48% / 0.11);
  --medal: hsl(38 88% 33%);
  --medal-soft: hsla(42 94% 48% / 0.16);
  --shadow-sm: 0 1px 2px hsla(220 30% 10% / 0.04);
  --shadow-md: 0 8px 24px hsla(220 30% 10% / 0.08);
  --code-bg: hsl(38 25% 96%);
  --code-bar: hsl(36 22% 93%);
  --code-sect: hsl(35 20% 91.5%);
  --code-border: hsl(35 16% 85%);
  --code-text: hsl(222 36% 12%);
  --code-ln: hsl(215 14% 52%);
  --t-kw: hsl(16 84% 40%);
  --t-fn: hsl(212 85% 38%);
  --t-hook: hsl(26 88% 36%);
  --t-str: hsl(152 68% 26%);
  --t-num: hsl(18 82% 38%);
  --t-com: hsl(215 14% 48%);
  --t-bi: hsl(194 78% 32%);
  --t-const: hsl(24 85% 38%);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: hsl(222 28% 6.5%);
  --surface: hsl(222 24% 9.8%);
  --subtle: hsl(220 22% 13%);
  --subtle-2: hsl(220 20% 16.5%);
  --border: hsl(218 18% 18%);
  --hairline: hsl(218 18% 15.5%);
  --text: hsl(210 24% 94%);
  --text-2: hsl(214 18% 76%);
  --muted: hsl(215 14% 56%);
  --accent: hsl(24 86% 60%);
  --accent-soft: hsla(24 86% 58% / 0.14);
  --pos: hsl(156 68% 62%);
  --pos-soft: hsla(156 68% 46% / 0.15);
  --neg: hsl(352 82% 68%);
  --neg-soft: hsla(352 78% 54% / 0.15);
  --medal: hsl(44 94% 64%);
  --medal-soft: hsla(44 92% 54% / 0.15);
  --shadow-sm: 0 1px 2px hsla(0 0% 0% / 0.28);
  --shadow-md: 0 10px 28px hsla(0 0% 0% / 0.45);
  --code-bg: hsl(224 30% 7.5%);
  --code-bar: hsl(222 26% 10.5%);
  --code-sect: hsl(220 24% 13%);
  --code-border: hsl(218 18% 17%);
  --code-text: hsl(214 24% 90%);
  --code-ln: hsl(218 14% 45%);
  --t-kw: hsl(14 88% 68%);
  --t-fn: hsl(205 90% 74%);
  --t-hook: hsl(42 94% 68%);
  --t-str: hsl(145 58% 68%);
  --t-num: hsl(32 92% 70%);
  --t-com: hsl(216 14% 54%);
  --t-bi: hsl(190 76% 72%);
  --t-const: hsl(28 90% 70%);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }


.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1600px;
  height: 100%;
  margin: 0 auto;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 24px;
  height: 24px;
  flex: none;
  display: block;
}
.brand-mark .logo-backbone { fill: #2563eb; }
.brand-mark .logo-cell-mid { fill: #2563eb; fill-opacity: 0.32; }
.brand-mark .logo-spark { fill: var(--accent); }
[data-theme="dark"] .brand-mark .logo-backbone { fill: #60a5fa; }
[data-theme="dark"] .brand-mark .logo-cell-mid { fill: #60a5fa; fill-opacity: 0.32; }
.brand-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
.brand-sep { color: var(--border); font-weight: 400; }
.brand-sub { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex: none; }

.mode-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
  border: 1px solid var(--hairline);
}
.mode-btn {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  border: 1px solid var(--border);
  background: var(--surface);
}
.icon-btn:hover { background: var(--subtle); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }


.app {
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  min-height: calc(100vh - 52px);
}
.app.no-sidebar { grid-template-columns: minmax(0, 1fr); }
.app.no-sidebar .sidebar { display: none; }


.sidebar {
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.sidebar-top {
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  height: 34px;
  border-radius: 7px;
  background: var(--subtle);
  border: 1px solid transparent;
  transition: border-color 0.12s, background 0.12s;
}
.search:focus-within { background: var(--surface); border-color: var(--accent); }
.search svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.search input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 12.5px;
  color: var(--text);
}
.search input::placeholder { color: var(--muted); }
.kbd-hint {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  line-height: 1.4;
}

.suite-pills {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--subtle);
}
.suite-btn {
  flex: 1 1 auto;
  padding: 4px 4px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}
.suite-btn:hover { color: var(--text); }
.suite-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.list-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}
.list-count { font-size: 12px; font-weight: 600; color: var(--muted); }
.sort-select {
  appearance: none;
  background: transparent;
  border: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  padding-right: 2px;
  text-align: right;
}
.sort-select:hover { color: var(--text); }

.task-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-item {
  width: 100%;
  text-align: left;
  padding: 7px 9px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.1s;
}
.task-item:hover { background: var(--subtle); }
.task-item.is-active { background: var(--accent-soft); }
.task-item-left { min-width: 0; flex: 1; }
.task-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-item.is-active .task-name { color: var(--accent); font-weight: 700; }
.task-sub {
  display: block;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


.gain {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex: none;
}
.gain.pos { background: var(--pos-soft); color: var(--pos); }
.gain.neg { background: var(--neg-soft); color: var(--neg); }
.gain.na { background: var(--subtle); color: var(--muted); }
.gain.medal { background: var(--medal-soft); color: var(--medal); font-family: var(--font-sans); }


.main { min-width: 0; }
.page {
  padding: 20px 24px 36px;
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}


.task-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.th-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.cat-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}
.th-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}
.th-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.kpi-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
}
.kpi {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-left: 18px;
  border-left: 1px solid var(--hairline);
}
.kpi:first-child { padding-left: 0; border-left: none; }
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi-val {
  font-family: var(--font-mono);
  font-size: 14px;

  display: inline-flex;

}
.th-summary {

  font-size: 13.5px;

}
.th-summary code, .cell-sum code, .doc code {

  color: var(--text);
}


.workspace {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ws-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 16px;
  min-height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.ws-tabs {
  display: flex;
  align-items: stretch;
  gap: 4px;
}
.ws-tab {
  position: relative;
  padding: 11px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.12s;
}
.ws-tab:hover { color: var(--text); }
.ws-tab.is-active { color: var(--text); }
.ws-tab.is-active::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.tab-meta {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.ws-right {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 0;
}
.kw-group {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.kw-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.kw-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--subtle);
  color: var(--text-2);
}
.tb-btn {
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--subtle);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.tb-btn:hover { background: var(--subtle-2); color: var(--text); }


.stage-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 16px;
  background: var(--subtle);
  border-bottom: 1px solid var(--border);
}
.stage-group, .helper-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.bar-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-right: 3px;
}
.hook-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.hook-btn:hover:not(:disabled) { border-color: var(--text-2); color: var(--text); }
.hook-btn.pass-hook { opacity: 0.65; font-weight: 500; }
.hook-btn.is-selected {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  opacity: 1;
}
.hook-sub {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  opacity: 0.78;
}
.helper-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--hairline);
}
.helper-btn:hover { border-color: var(--accent); color: var(--accent); }
.helper-btn.other-hook {
  background: transparent;
  border-style: dashed;
  color: var(--muted);
}
.helper-btn.other-hook:hover { color: var(--text); border-color: var(--border); }


.code-wrap { background: var(--code-bg); color: var(--code-text); }
.code {
  margin: 0;
  padding: 12px 0 16px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  tab-size: 2;
}
.code-sect {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  margin: 8px 0 4px;
  background: var(--code-sect);
  border-top: 1px solid var(--code-border);
  border-bottom: 1px solid var(--code-border);
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-2);
}
.code-sect:first-child { margin-top: 0; border-top: none; }
.code-sect b { font-family: var(--font-mono); color: var(--t-hook); font-weight: 600; }
.code-sect.is-flash { background: hsla(24 86% 54% / 0.24); }
.code-line {
  display: block;
  padding: 0 16px 0 0;
  white-space: pre;
}
.code-line:hover { background: hsla(215 28% 50% / 0.1); }
.code-line.is-flash { background: hsla(24 86% 54% / 0.22); }
.ln {
  display: inline-block;
  width: 46px;
  padding-right: 12px;
  text-align: right;
  color: var(--code-ln);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.t-kw { color: var(--t-kw); }
.t-fn { color: var(--t-fn); font-weight: 600; }
.t-hook { color: var(--t-hook); font-weight: 700; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-bi { color: var(--t-bi); }
.t-const { color: var(--t-const); }


.doc {
  padding: 22px 26px 28px;
  max-width: 82ch;
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
}
.doc h3, .doc h4, .doc h5 {
  margin: 20px 0 8px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.doc h3:first-child, .doc h4:first-child { margin-top: 0; }
.doc p { margin: 0 0 12px; color: var(--text-2); }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; color: var(--text-2); }
.doc li { margin-bottom: 5px; }
.doc b { color: var(--text); font-weight: 600; }
.doc em { font-style: italic; }
.doc pre {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-text);
  font-family: var(--font-mono);
  font-size: 12.5px;
  overflow-x: auto;
}
.doc-tbl { margin: 12px 0; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.doc-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc-tbl th, .doc-tbl td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--hairline); }
.doc-tbl th { background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 600; }
.doc-tbl tr:last-child td { border-bottom: none; }


.summary-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.stat {
  padding: 14px 18px;
  border-left: 1px solid var(--hairline);
}
.stat:first-child { border-left: none; }
.stat-k { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat-v {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-v.pos { color: var(--pos); }
.stat-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
}
.seg button {
  padding: 4px 11px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.seg button:hover { color: var(--text); }
.seg button.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td {
  padding: 10px 12px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--hairline);
}
.tbl th {
  background: var(--subtle);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  user-select: none;
}
.tbl th.sortable { cursor: pointer; }
.tbl th.sortable:hover { color: var(--text); }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr.clickable { cursor: pointer; transition: background 0.08s; }
.tbl tbody tr.clickable:hover { background: var(--subtle); }

.link-btn {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  text-align: left;
}
.tbl tbody tr.clickable:hover .link-btn { color: var(--accent); }
.tbl td:first-child { width: 35%; max-width: 0; }
.cell-sum {
  margin-top: 2px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.suite-cell { white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
.suite-metric { display: block; font-size: 12px; color: var(--muted); }
.hook-pills { display: flex; flex-wrap: nowrap; gap: 4px; }
.hook-tag {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--subtle);
  color: var(--text-2);
  white-space: nowrap;
}

.empty { padding: 32px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }


.tooltip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 11px;
  box-shadow: var(--shadow-md);
  font-size: 12px;
  min-width: 150px;
  transition: opacity 0.1s;
}
.tooltip.is-visible { opacity: 1; }
.tt-title { font-weight: 700; color: var(--text); margin-bottom: 4px; }
.tt-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
.tt-row b { font-family: var(--font-mono); color: var(--text); }


@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; max-height: 300px; border-right: none; border-bottom: 1px solid var(--border); }
  .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: none; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--hairline); }
  .hook-pills { flex-wrap: wrap; }
}

@media (max-width: 640px) {
  .brand-sep, .brand-sub, .kbd-hint, .tab-meta { display: none; }
  .page { padding: 12px; }
  .task-header { padding: 14px; }
  .kpi { padding-left: 12px; }
  .stack-tbl thead { display: none; }
  .stack-tbl, .stack-tbl tbody { display: block; width: 100%; }
  .stack-tbl tr {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .stack-tbl td { display: block; padding: 0; border: none; }
  .stack-tbl td.r { text-align: left; }
  .stack-tbl td:first-child, .stack-tbl td.wide { grid-column: 1 / -1; width: auto; max-width: none; }
  .stack-tbl td[data-label]::before {
    content: attr(data-label) ": ";
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .stack-tbl td:first-child::before { content: none; }
}
</style>

<script id="explorer-data" type="application/json">{"tasks":[{"id":"predict-volcanic-eruptions-ingv-oe","name":"predict-volcanic-eruptions-ingv-oe","short_name":"volcanic-eruptions","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Geophysics (Multi-Sensor Waveforms)","metric_label":"MAE ↓","lower_is_better":true,"plain":null,"plain_note":"Fails (IDs only in train.csv)","n_train":3987,"n_test":444,"n_folds":3,"thresholds":{"gold":3971366.0,"silver":4808057.0,"bronze":4999330.0,"median":6300677.0},"summary":"The task table holds one usable column, `segment_id`; everything the model sees is built offline from the 14 GB of raw ten-minute, ten-sensor seismic traces.","score":97355.0,"gain_pct":null,"medal":"Gold","category":null,"lines":325,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['power', 'quantile', 'quantile_rtdl', 'robust']","n_feature_crosses":"'sqrt'"},"helper_functions":["_feats","_graph","_anchor","_lookup","_extra","_pca_one","_select"],"helper_ranges":{"_feats":[37,49],"_graph":[52,89],"_anchor":[92,128],"_lookup":[131,137],"_extra":[185,188],"_pca_one":[191,219],"_select":[258,283]},"hook_helpers":{"preprocess":["_graph","_anchor"],"engineer":["_feats","_lookup","_extra","_pca_one","_select"],"sample":[],"postprocess":["_graph"],"folds":[]},"hook_ranges":{"preprocess":[141,182],"engineer":[222,255],"sample":[296,303],"postprocess":[306,325],"folds":[291,293]},"code":"import os\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {\"norm_methods\": [\"power\", \"quantile\", \"quantile_rtdl\", \"robust\"],\n                \"n_feature_crosses\": \"sqrt\"}\n\nTOPK = 160\nPOOLPAT = r\"^s\\d+_(lb|nb)\\d+$\"   # the ranking sees only these columns of the pool\nMAXCORR = 1.0                # a ranked column is skipped if it duplicates one already kept\nRANKY = False                # rank the columns against the rank of the residual, not the residual\nFEATSETS = (\"feats30.npz\",)  # ET-ranked raw columns\nFEATSETS2 = ()               # a second, separate ranking\nTOPK2 = 0\nPCABLOCKS = ((\"feats22.npz\", 109), (\"feats39.npz\", 80))\nRAWCOLS = (\"feats.npz\", [\"n_present\"] + [f\"s{j}_nanfrac\" for j in range(1, 11)])\nRAWCOLS2 = ()                # a second verbatim block\nPROJ = \"pca\"                 # \"pca\" (unsupervised) or \"pls\" (fitted against the residual)\nAUGMENT = True               # re-present anchored training rows as unanchored ones\nDUP_UNANCH = False           # and duplicate the ones that had no anchor to begin with\nPSEUDO = True                # and add the anchored test rows, targets from the graph\nANCH_W = 0.01                # sd of the anchored baseline, relative to the unanchored one\nZMIN = 25.0                  # edge threshold; every anchored validation row was exact at 25 and 20\n_HERE = os.getcwd()          # the hooks are exec'd with cwd = the workspace (no __file__)\n# feats.npz \u003c- extract.py, feats42.npz \u003c- extract42.py (block D, tapered band edges), feats30.npz \u003c- extract30.py (block B at a\n# 256-point median Welch with a per-window linear detrend), feats22.npz \u003c- extract22.py (block C at 4096), edges.npz \u003c- scan3.py then\n# refine.py. None can be rebuilt inside a hook's 600 s, so say so plainly rather than failing three\n# frames deep in numpy. The other feats*.npz in feat_cache are variants that lost; see log.txt.\nfor _f in (\"feats.npz\", \"feats42.npz\", \"feats30.npz\", \"feats22.npz\", \"edges.npz\"):\n  if not os.path.exists(os.path.join(_HERE, \"feat_cache\", _f)):\n    raise RuntimeError(f\"feat_cache/{_f} is missing; rebuild it before scoring this pipeline\")\n_C = {}\n_B = {}\n\n\n# ---------------------------------------------------------------- caches\ndef _feats(sets=None):\n  sets = FEATSETS if sets is None else sets\n  key = \"X\" + \"\".join(sets)\n  if key not in _C:\n    names, blocks = [], []\n    for fn in sets:\n      z = np.load(os.path.join(_HERE, \"feat_cache\", fn), allow_pickle=True)\n      names += [str(n) for n in z[\"names\"]]\n      blocks.append(z[\"X\"])\n      _C[\"fpos\"] = {int(s): i for i, s in enumerate(z[\"segment_id\"])}\n    _C[key + \"n\"] = names\n    _C[key] = np.hstack(blocks) if len(blocks) \u003e 1 else blocks[0]\n  return _C[key], _C[key + \"n\"], _C[\"fpos\"]\n\n\ndef _graph():\n  \"\"\"Components of the overlap graph, and each segment's sample offset inside its component.\"\"\"\n  if \"comp\" in _C:\n    return _C[\"comp\"], _C[\"pos\"], _C[\"gpos\"], _C[\"zbest\"]\n  E = np.load(os.path.join(_HERE, \"feat_cache\", \"edges.npz\"))\n  sids = E[\"segment_id\"]\n  n = len(sids)\n  k = E[\"z\"] \u003e= ZMIN\n  i, j, lag, z = E[\"i\"][k], E[\"j\"][k], E[\"lag\"][k], E[\"z\"][k]\n  o = np.argsort(-z)                                   # lay out from the most reliable edges\n  i, j, lag, z = i[o], j[o], lag[o], z[o]\n  adj = [[] for _ in range(n)]\n  for a, b, L in zip(i, j, lag):\n    adj[a].append((b, -int(L)))                        # y_b - y_a = -lag\n    adj[b].append((a, int(L)))\n  comp = np.full(n, -1, dtype=np.int64)\n  pos = np.zeros(n, dtype=np.float64)\n  zb = np.zeros(n, dtype=np.float32)\n  for a, b, zz in zip(i, j, z):\n    zb[a] = max(zb[a], zz)\n    zb[b] = max(zb[b], zz)\n  c = 0\n  for s in range(n):\n    if comp[s] \u003e= 0 or not adj[s]:\n      continue\n    comp[s], pos[s] = c, 0.0\n    stack = [s]\n    while stack:\n      u = stack.pop()\n      for v, d in adj[u]:\n        if comp[v] \u003c 0:\n          comp[v], pos[v] = c, pos[u] + d\n          stack.append(v)\n    c += 1\n  _C[\"comp\"], _C[\"pos\"] = comp, pos\n  _C[\"gpos\"] = {int(s): t for t, s in enumerate(sids)}\n  _C[\"zbest\"] = zb\n  return comp, pos, _C[\"gpos\"], zb\n\n\ndef _anchor(tr_sid, y, te_sid):\n  \"\"\"base / n_anchor / spread for the training rows (leave-one-out) and for the test rows.\"\"\"\n  comp, pos, gpos, zb = _graph()\n  csize = {}\n  for c in comp[comp \u003e= 0]:\n    csize[int(c)] = csize.get(int(c), 0) + 1\n  ti = np.array([gpos.get(int(s), -1) for s in tr_sid])\n  te = np.array([gpos.get(int(s), -1) for s in te_sid])\n  byc = {}\n  for k, v in enumerate(ti):\n    if v \u003e= 0 and comp[v] \u003e= 0:\n      byc.setdefault(comp[v], []).append(k)\n\n  def one(idx, loo):\n    est = np.full(len(idx), np.nan)\n    na = np.zeros(len(idx), dtype=np.float32)\n    sp = np.full(len(idx), np.nan)\n    zz = np.zeros(len(idx), dtype=np.float32)\n    cs = np.ones(len(idx), dtype=np.float32)\n    for t, v in enumerate(idx):\n      if v \u003c 0:\n        continue\n      zz[t] = zb[v]\n      cs[t] = csize.get(int(comp[v]), 1)\n      c = comp[v]\n      if c \u003c 0 or c not in byc:\n        continue\n      ks = [k for k in byc[c] if not (loo and ti[k] == v)]\n      if not ks:\n        continue\n      o = y[ks] - pos[ti[ks]]\n      est[t] = float(np.median(o)) + pos[v]\n      na[t] = len(ks)\n      sp[t] = float(o.max() - o.min())\n    return est, na, sp, zz, cs\n\n  return one(ti, True), one(te, False)\n\n\ndef _lookup(seg_ids, sets=None):\n  X, names, fpos = _feats(sets)\n  rows = np.array([fpos.get(int(s), -1) for s in seg_ids])\n  out = np.full((len(rows), X.shape[1]), np.nan, dtype=np.float32)\n  ok = rows \u003e= 0\n  out[ok] = X[rows[ok]]\n  return pd.DataFrame(out, columns=names)\n\n\n# ---------------------------------------------------------------- hooks\ndef preprocess(X_train, y_train, X_test):\n  y = np.asarray(y_train, dtype=float).ravel()\n  tr, te = _anchor(X_train[\"segment_id\"].to_numpy(), y, X_test[\"segment_id\"].to_numpy())\n  fill = float(np.median(y))\n  btr = np.where(np.isnan(tr[0]), fill, tr[0])\n  bte = np.where(np.isnan(te[0]), fill, te[0])\n  miss = np.isnan(tr[0])\n  wtr = np.where(miss, 1.0, ANCH_W)\n  wte = np.where(np.isnan(te[0]), 1.0, ANCH_W)\n  yt = (y - btr) / wtr\n  _B[\"te\"] = (bte,) + te[1:] + (np.isnan(te[0]),)\n  a = np.flatnonzero(~miss) if AUGMENT else np.zeros(0, dtype=int)\n  if DUP_UNANCH:\n    a = np.concatenate([a, np.flatnonzero(miss)])\n  if len(a):\n    est, na, sp, zz, cs = tr\n    tr = (None,\n          np.concatenate([na, np.zeros(len(a))]),          # no anchors behind the copy\n          np.concatenate([sp, np.full(len(a), np.nan)]),\n          np.concatenate([zz, zz[a]]),                     # zbest and component size are properties\n          np.concatenate([cs, cs[a]]))                     # of the segment, not of the anchoring\n    btr = np.concatenate([btr, np.full(len(a), fill)])\n    yt = np.concatenate([yt, y[a] - fill])\n    X_train = pd.concat([X_train, X_train.iloc[a]], ignore_index=True)\n    miss = np.concatenate([miss, np.ones(len(a), bool)])\n  q = np.flatnonzero(~np.isnan(te[0])) if PSEUDO else np.zeros(0, dtype=int)\n  if len(q):\n    est, na, sp, zz, cs = tr\n    tr = (None, np.concatenate([na, np.zeros(len(q))]),\n          np.concatenate([sp, np.full(len(q), np.nan)]),\n          np.concatenate([zz, te[3][q]]),\n          np.concatenate([cs, te[4][q]]))\n    btr = np.concatenate([btr, np.full(len(q), fill)])\n    yt = np.concatenate([yt, te[0][q] - fill])\n    X_train = pd.concat([X_train, X_test.iloc[q]], ignore_index=True)\n    miss = np.concatenate([miss, np.ones(len(q), bool)])\n  _B[\"tr\"] = (btr,) + tr[1:] + (miss,)\n  _B[\"n0\"], _B[\"y0\"] = len(y), y\n  # the pre and post hooks run in separate sandboxes, so the baseline travels through the workspace\n  np.savez(os.path.join(_HERE, \".anchor_base.npz\"),\n           sid=X_test[\"segment_id\"].to_numpy(), base=bte, w=wte)\n  return X_train, pd.Series(yt, index=X_train.index, name=\"y\"), X_test\n\n\ndef _extra(b):\n  base, na, sp, z, cs, miss = b\n  return pd.DataFrame({\"anch\": (~miss).astype(np.float32), \"anch_z\": z,\n                       \"anch_base\": base.astype(np.float32)})\n\n\ndef _pca_one(str_sid, ste_sid, fn, n, tag, y=None):\n  \"\"\"One block projected down, fitted on this fold's training rows only.\"\"\"\n  from sklearn.decomposition import PCA\n  pat = None\n  if isinstance(fn, tuple) and len(fn) == 2 and isinstance(fn[1], str) and fn[1].startswith(\"^\"):\n    fn, pat = fn\n  fns = (fn,) if isinstance(fn, str) else tuple(fn)\n  Rtr, Rte = _lookup(str_sid, fns), _lookup(ste_sid, fns)\n  if pat:\n    import re\n    c = [x for x in Rtr.columns if re.match(pat, x)]\n    Rtr, Rte = Rtr[c], Rte[c]\n  med = Rtr.median()\n  A = Rtr.fillna(med).to_numpy(dtype=np.float64)\n  B = Rte.fillna(med).to_numpy(dtype=np.float64)\n  ok = np.isfinite(A).all(0) \u0026 np.isfinite(B).all(0) \u0026 (A.std(0) \u003e 0)\n  A, B = A[:, ok], B[:, ok]\n  from sklearn.preprocessing import QuantileTransformer\n  qt = QuantileTransformer(output_distribution=\"normal\", n_quantiles=min(1000, len(A)),\n                           random_state=0, subsample=100000).fit(A)\n  A, B = qt.transform(A), qt.transform(B)\n  k = min(n, A.shape[0] - 1, A.shape[1])\n  if PROJ == \"pls\" and y is not None:\n    from sklearn.cross_decomposition import PLSRegression\n    p = PLSRegression(n_components=k, scale=False).fit(A, y)\n  else:\n    p = PCA(n_components=k, random_state=0).fit(A)\n  cols = [f\"{tag}{i}\" for i in range(k)]\n  return pd.DataFrame(p.transform(A), columns=cols), pd.DataFrame(p.transform(B), columns=cols)\n\n\ndef engineer(X_train, y_train, X_test):\n  str_sid, ste_sid = X_train[\"segment_id\"].to_numpy(), X_test[\"segment_id\"].to_numpy()\n  parts_tr, parts_te = [X_train[[\"segment_id\"]]], [X_test[[\"segment_id\"]]]\n  parts_tr.append(_extra(_B[\"tr\"]))\n  parts_te.append(_extra(_B[\"te\"]))\n  for spec in (RAWCOLS, RAWCOLS2):\n    if not spec:\n      continue\n    fn, cols = spec\n    Rtr, Rte = _lookup(str_sid, (fn,)), _lookup(ste_sid, (fn,))\n    if cols is not None:\n      Rtr, Rte = Rtr[cols], Rte[cols]\n    parts_tr.append(Rtr)\n    parts_te.append(Rte)\n  yv = np.asarray(y_train, dtype=float).ravel()\n  for sets, k in ((FEATSETS, TOPK), (FEATSETS2, TOPK2)):\n    if not (k and sets):\n      continue\n    Ftr, Fte = _lookup(str_sid, sets), _lookup(ste_sid, sets)\n    if sets is FEATSETS and POOLPAT:\n      import re\n      c = [x for x in Ftr.columns if re.match(POOLPAT, x)]\n      Ftr, Fte = Ftr[c], Fte[c]\n    keep = _select(Ftr, yv, k)\n    parts_tr.append(Ftr[keep])\n    parts_te.append(Fte[keep])\n  for t, (fn, n) in enumerate(PCABLOCKS):\n    Ptr, Pte = _pca_one(str_sid, ste_sid, fn, n, f\"p{t}_\",\n                        np.asarray(y_train, dtype=float).ravel())\n    parts_tr.append(Ptr)\n    parts_te.append(Pte)\n  for D, I in [(d, X_train.index) for d in parts_tr] + [(d, X_test.index) for d in parts_te]:\n    D.index = I\n  return pd.concat(parts_tr, axis=1), pd.concat(parts_te, axis=1)\n\n\ndef _select(F, y, k):\n  \"\"\"Rank columns by an ExtraTrees importance fitted on this fold's training rows only.\"\"\"\n  cols = [c for c in F.columns if F[c].notna().any() and F[c].std(skipna=True) \u003e 0]\n  if len(cols) \u003c= k or len(F) \u003c 60:\n    return cols[:k]\n  from sklearn.ensemble import ExtraTreesRegressor\n  A = np.nan_to_num(F[cols].to_numpy(dtype=np.float64), nan=-9.99e8)\n  if RANKY:\n    from scipy.stats import rankdata\n    y = rankdata(y)\n  et = ExtraTreesRegressor(n_estimators=300, min_samples_leaf=3, n_jobs=8, random_state=0)\n  et.fit(A, y)\n  order = np.argsort(-et.feature_importances_)\n  if MAXCORR \u003e= 1.0:\n    return [cols[i] for i in sorted(order[:k])]\n  Z = A - A.mean(0)\n  nrm = np.sqrt((Z * Z).sum(0))\n  Z /= np.where(nrm \u003e 0, nrm, 1)\n  kept = []\n  for i in order:\n    if kept and np.abs(Z[:, kept].T @ Z[:, i]).max() \u003e MAXCORR:\n      continue\n    kept.append(i)\n    if len(kept) == k:\n      break\n  return [cols[i] for i in sorted(kept)]\n\n\nNFOLD = 10\nNDRAW = 1\nDRAW_FRAC = 0.85\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import KFold\n  return list(KFold(NFOLD, shuffle=True, random_state=0).split(X_train))\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Bag over row subsets: one full TabFM fit per draw, averaged by the judge.\"\"\"\n  n = len(X_train)\n  if NDRAW \u003c= 1:\n    return [np.arange(n)]\n  rng = np.random.default_rng(0)\n  k = int(round(DRAW_FRAC * n))\n  return [np.sort(rng.choice(n, k, replace=False)) for _ in range(NDRAW)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  z = np.load(os.path.join(_HERE, \".anchor_base.npz\"))\n  sid = X_test[\"segment_id\"].to_numpy()\n  base = pd.Series(z[\"base\"], index=z[\"sid\"]).reindex(sid).to_numpy()\n  w = pd.Series(z[\"w\"], index=z[\"sid\"]).reindex(sid).to_numpy()\n  y = np.asarray(y_orig, dtype=float).ravel()\n  raw = np.asarray(pred, dtype=float).ravel()\n  out = raw * w + base\n  comp, cpos, gpos, _ = _graph()\n  g = np.array([gpos.get(int(t), -1) for t in sid])\n  un = (w == 1.0) \u0026 (g \u003e= 0)\n  cc = np.where(g \u003e= 0, comp[np.maximum(g, 0)], -1)\n  for c in np.unique(cc[un \u0026 (cc \u003e= 0)]):\n    m = un \u0026 (cc == c)\n    if m.sum() \u003e 1:\n      out[m] = np.median(out[m] - cpos[g[m]]) + cpos[g[m]]\n  with open(os.path.join(_HERE, \"preds.csv\"), \"a\") as f:\n    for sid, r, b in zip(X_test[\"segment_id\"].to_numpy(), raw, base):\n      f.write(f\"{int(sid)},{r:.1f},{b:.1f}\\n\")\n  return pd.Series(out, index=pred.index).clip(float(y.min()), float(y.max()))\n","readme":"# INGV volcanic eruption — final pipeline\n\n## What it does\n\nThe task table holds one usable column, `segment_id`; everything the model sees is built offline from\nthe 14 GB of raw ten-minute, ten-sensor seismic traces.\n\nThe pipeline has two halves. The first is an **overlap graph**. The 4431 segments are windows cut from\na handful of continuous recordings, and about half of them overlap another one; for an overlapping\npair the lag that maximises the cross-correlation *is* the difference of the two targets, to the\nsample. Every pair is cross-correlated on spectrally whitened, 1-bit-normalised traces of the five\nsensors that are almost never missing (raw correlation does not work — the traces' own\nautocorrelation puts the null max-z near 13 over 120k lags, whitened and signed it is 4.5, against\n~150 for a real overlap). Pairs above z = 25 become edges, connected components are recordings laid\nout on a common sample axis, and a segment sharing a component with a labelled one gets its target\nexactly. That covers ~44% of the rows and was exact on every anchored validation row.\n\nThe second half is **TabFM over a residual**. `preprocess` retargets to `y - base`, where `base` is\nthe graph anchor where there is one and the training median where there is not, divided by a per-row\nscale (0.01 for anchored rows, whose baseline is an algebraic identity, 1 otherwise); `postprocess`\nundoes the scaling, adds the baseline back, and makes the still-unanchored members of a labelled-free\ncomponent agree by averaging their implied origins. Every anchored training row is also appended a\nsecond time *as if it had no anchor*, and the anchored test rows join the context with targets derived\nfrom training labels through the lag identity — together worth ~35k of the score. TabFM sees 366\ncolumns: 160 raw spectral columns of block B ranked in-fold by an ExtraTrees out of a pool restricted\nto its 640 band columns, 109 + 80 in-fold PCA components over the fine spectra (block C) and the band\nenvelopes (block D), and 11 verbatim columns saying which sensors the segment has. The single\nlargest feature decision is that every spectrum is a **median**-of-periodograms rather than the mean\n`scipy.signal.welch` returns: a ten-minute segment is full of transients and a mean follows them,\nwhile the median measures the background the station sits on. Given the median, short windows win.\n\nScored 101832 (RMSE-style, lower is better) at 10-fold CV on the training set.\n\n## What `build.sh` builds\n\n`final/build.sh` regenerates all five caches `pipeline.py` reads from `feat_cache/`, from\n`data/train/*.csv` and `data/test/*.csv` only:\n\n| output | from | what it is |\n| --- | --- | --- |\n| `feats.npz` | `extract.py` | broad per-sensor time/frequency summaries; only `n_present` and `s*_nanfrac` reach TabFM |\n| `feats22.npz` | `extract22.py` | block C — 80 log bands of a 4096-point median periodogram (first PCA block) |\n| `feats30.npz` | `extract30.py` | block B — 256-point median periodogram, per-window linear detrend (the ranked block) |\n| `feats39.npz` | `extract39.py` | block D — band-limited 1 s envelope statistics, 25% raised-cosine band edges (second PCA block) |\n| `feats42.npz` | `extract42.py` | the 6.25%-taper variant of block D; see the caveat below |\n| `edges.npz` | `scan2.build()` → `scan3.py` → `refine.py` | the overlap graph: `(i, j, lag, z)` with `y_j - y_i = -lag` |\n\nRoughly 20 minutes end to end on the 64-core host this was built on, ~12 minutes of which is\n`scan3.py`'s decimated all-pairs scan; the extractors are dominated by reading the raw CSVs. Peak\ntransient disk under `feat_cache/` is about 20 GB — `ov_fft.npy` (11.6 GB), `sign.npy` (5.3 GB) and\n`dec_fft.npy` (2.9 GB) are intermediates of the graph build and can be deleted afterwards. The five\n`.npz` the pipeline actually reads are a few hundred MB.\n\n## Things a reader would otherwise get wrong\n\n- **`feats42.npz` is dead weight that is still mandatory.** `PCABLOCKS` uses `feats39.npz`; the\n  `feats42.npz` name survives only in the start-up existence check at the top of `pipeline.py`, whose\n  comment is stale (it describes the earlier configuration where the 6.25% taper was shipped and\n  `feats39.npz` did not exist). `build.sh` builds it so the check passes. Delete the check and you can\n  drop that step — but `pipeline.py` is the scored artefact and is left untouched.\n- **`scan2.py` must not be run as a script.** Its `main()` is the full-rate all-pairs scan that was\n  abandoned mid-run as too slow (it would have taken about a day); only `scan2.build()`, which writes\n  the whitened spectra both later stages read, is wanted. `scan3.py` then overwrites the\n  `ov_score.npy` / `ov_lag.npy` that `main()` would have produced.\n- **The build steps short-circuit on existing outputs.** `scan2.build()` returns early if\n  `ov_mask.npy` exists, `scan3.build_dec()` if `dec_fft.npy` does, `refine.build_sign()` if\n  `sign.npy` does. A partly-populated `feat_cache/` therefore gets skipped rather than repaired, so\n  `build.sh` deletes those markers before the graph stage. This means re-running `build.sh` redoes the\n  ~12-minute scan every time.\n- **Everything runs from the workspace root.** The scripts use relative `data/` and `feat_cache/`\n  paths; `build.sh` `cd`s there itself and puts `final/build/` on `PYTHONPATH` for the `scan2` import.\n- **No test labels are involved anywhere.** The pseudo-labelled test rows added to the context get\n  their targets from *training* labels through the lag identity, not from any held-out label.\n- **`postprocess` appends to `preds.csv`** in the workspace on every call — a diagnostic dump from the\n  run, harmless but it grows; the submission itself is written by `final/run.py`.\n- The other 45-odd `feats*.npz` in `feat_cache/` and the other scripts in `final/build/` are variants\n  that scored worse and are not part of the build; `log.txt` records what each one cost."},{"id":"nomad2018-predict-transparent-conductors","name":"nomad2018-predict-transparent-conductors","short_name":"nomad2018-conductors","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Materials Science (3D Crystal Lattice)","metric_label":"RMSLE ↓","lower_is_better":true,"plain":0.05737,"plain_note":"0.05737","n_train":2160,"n_test":240,"n_folds":3,"thresholds":{"gold":0.05589,"silver":0.06229,"bronze":0.06582,"median":0.06988},"summary":"TabFM predicts both targets in-context from the training rows; everything here is about what those rows look like. Two things carry the task. First, the metric is RMSLE, so the pipeline hands TabFM `log1p(y)` and inverts with `expm1` in `postprocess` — the model never sees the raw scale.","score":0.0444,"gain_pct":22.607635,"medal":"Gold","category":null,"lines":112,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{"n_svd_features":"'sqrt'","n_feature_crosses":"'sqrt'","norm_methods":"['none', 'quantile']","outlier_threshold":"3.0"},"helper_functions":["_geom","_raw","_keep","_attach"],"helper_ranges":{"_geom":[28,32],"_raw":[35,39],"_keep":[42,49],"_attach":[52,62]},"hook_helpers":{"preprocess":["_geom","_raw","_attach"],"engineer":["_geom","_keep"],"postprocess":[],"folds":[]},"hook_ranges":{"preprocess":[83,101],"engineer":[104,107],"postprocess":[110,112],"folds":[68,73]},"code":"import os\nimport numpy as np\nimport pandas as pd\n\n_WS = '~/tabfm-evolve/runs/nomad2018-predict-transparent-conductors/run'\nHERE = os.getcwd() if os.path.exists(os.path.join(os.getcwd(), 'geom_features.csv')) else _WS\n\nTARGETS = ['formation_energy_ev_natom', 'bandgap_energy_ev']\nKEY = ['spacegroup', 'number_of_total_atoms', 'percent_atom_al', 'percent_atom_ga',\n       'percent_atom_in', 'lattice_vector_1_ang', 'lattice_vector_2_ang',\n       'lattice_vector_3_ang', 'lattice_angle_alpha_degree', 'lattice_angle_beta_degree',\n       'lattice_angle_gamma_degree']\n\nTABFM_KWARGS = {'n_svd_features': 'sqrt', 'n_feature_crosses': 'sqrt', 'norm_methods': ['none', 'quantile'], 'outlier_threshold': 3.0}\n\n# rank_v3.csv is a frozen offline permutation-importance ranking of the descriptors. EXTRA and\n# DROP are the result of measured swaps on top of it: at this width TabFM is capacity-bound, so a\n# descriptor only pays if something weaker leaves to make room for it. Adding without dropping\n# loses every time -- of 100 single additions tested, only 16 improved at all.\nRANK = 'rank_v3.csv'\nN_GEOM = 45\nEXTRA = ['g_sro20_dist', 'g_sro20_rad', 'g_sro12_dist', 'g_sro4_same', 'g_oenv_mix', 'g_oenv_hasIn', 'g_oenv_hasAl', 'g_oenv_In', 'g_tb5_lowmean', 'g_tb10_wAl', 'g_tb5_ipr', 'g_rlx_mad_cat_std', 'g_g2_InO_4m', 'g_sro4_rad']\nDROP = ['g_spacegroup', 'g_MO_red_iqr', 'g_strain_In_mean', 'g_mad_cat_std', 'g_poly_q4_std', 'g_ang_OInO_mean', 'g_prdf_AlO_8', 'g_gii_ox', 'g_bvs_ox_min', 'g_poly_lav_skew', 'g_rlx_de', 'g_poly_ecn_p75', 'g_rlx_disp_O', 'g_ang_MOM_max', 'g_mad_In_std', 'g_MO_nn_red_p75', 'g_tb5_lowmean', 'g_InO_nn_max', 'g_strain_In_std', 'g_mad_cat_p75', 'g_sro4_same', 'g_bvs_ox_std', 'g_tb5_ipr', 'g_x_AlIn', 'g_mad_ox_p25', 'g_sro20_dist', 'g_nbr_In_Al']\n\n_CACHE = {}\n\n\ndef _geom():\n  if 'geom' not in _CACHE:\n    g = pd.read_csv(os.path.join(HERE, 'geom_features.csv'))\n    _CACHE['geom'] = {s: d.drop(columns=['split']).set_index('id') for s, d in g.groupby('split')}\n  return _CACHE['geom']\n\n\ndef _raw():\n  if 'raw' not in _CACHE:\n    _CACHE['raw'] = {s: pd.read_csv(os.path.join(HERE, 'data', '%s.csv' % s)).set_index('id')\n                     for s in ('train', 'test')}\n  return _CACHE['raw']\n\n\ndef _keep():\n  if 'keep' not in _CACHE:\n    r = pd.read_csv(os.path.join(HERE, RANK), index_col=0).iloc[:, 0]\n    cols = set(_geom()['train'].columns)\n    sel = [c for c in r.index if c in cols][:N_GEOM]\n    sel += [c for c in EXTRA if c in cols and c not in sel]\n    _CACHE['keep'] = [c for c in sel if c not in DROP]\n  return _CACHE['keep']\n\n\ndef _attach(X):\n  \"\"\"Look the geometry row up. `id` is only unique within a split and a validation fold carries\n  training ids, so decide per row by matching that id's csv columns against train.csv.\"\"\"\n  g, raw = _geom(), _raw()\n  ids = X['id'].to_numpy()\n  ref = raw['train'].reindex(ids)[KEY].to_numpy(float)\n  is_train = np.isclose(X[KEY].to_numpy(float), ref, atol=1e-6, equal_nan=True).all(1)\n  rows = np.where(is_train[:, None],\n                  g['train'].reindex(ids).to_numpy(float),\n                  g['test'].reindex(ids).to_numpy(float))\n  return pd.DataFrame(rows, columns=g['train'].columns, index=X.index)\n\n\nN_FOLDS = 5\n\n\ndef folds(X_train, y_train):\n  \"\"\"Rows are exchangeable, so plain shuffled K-fold mirrors how the test split was drawn.\n  Five folds rather than the judge's three: each fold then fits on 80% of the rows instead of\n  67%, which is closer to the 100% the final gets, and the estimate is less split-specific.\"\"\"\n  from sklearn.model_selection import KFold\n  return list(KFold(N_FOLDS, shuffle=True, random_state=0).split(X_train))\n\n\n# Extra context rows: copies of the training rows with the features jittered and the target\n# kept. Folds are fixed on the original rows before preprocess runs, so a copy can only ever\n# reach the training side of the fold its original belongs to.\nAUG_COPIES = 0\nAUG_SIGMA = 0.03\n\n\ndef preprocess(X_train, y_train, X_test):\n  ytr = np.log1p(y_train.clip(lower=0)).reset_index(drop=True)\n  # the geometry join belongs here rather than in engineer: engineer may not change the row\n  # count, and an augmented row has no id to look up\n  Xtr = pd.concat([X_train.reset_index(drop=True), _attach(X_train).reset_index(drop=True)], axis=1)\n  Xte = pd.concat([X_test.reset_index(drop=True), _attach(X_test).reset_index(drop=True)], axis=1)\n  if AUG_COPIES:\n    cols = [c for c in Xtr.columns if c != 'id']\n    sd = np.nan_to_num(Xtr[cols].to_numpy(float).std(0), nan=0.0)\n    rng = np.random.default_rng(0)\n    xs, ys = [Xtr], [ytr]\n    for _ in range(AUG_COPIES):\n      Xa = Xtr.copy()\n      Xa[cols] = Xtr[cols].to_numpy(float) + rng.normal(0, AUG_SIGMA, (len(Xtr), len(cols))) * sd\n      xs.append(Xa)\n      ys.append(ytr)\n    Xtr = pd.concat(xs, ignore_index=True)\n    ytr = pd.concat(ys, ignore_index=True)\n  return Xtr, ytr, Xte\n\n\ndef engineer(X_train, y_train, X_test):\n  \"\"\"preprocess already joined every descriptor; this only chooses which ones TabFM sees.\"\"\"\n  cols = [c for c in (['id'] + KEY + _keep()) if c in X_train.columns and c not in DROP]\n  return X_train[cols].reset_index(drop=True), X_test[cols].reset_index(drop=True)\n\n\ndef postprocess(pred, y_orig, X_test):\n  p = pred if isinstance(pred, pd.DataFrame) else pd.DataFrame(pred)\n  return np.expm1(p).clip(lower=0)\n","readme":"# nomad2018-predict-transparent-conductors — final pipeline\n\n## What it does\n\nTabFM predicts both targets in-context from the training rows; everything here is about what those\nrows look like. Two things carry the task. First, the metric is RMSLE, so the pipeline hands TabFM\n`log1p(y)` and inverts with `expm1` in `postprocess` — the model never sees the raw scale. Second,\nthe CSV is degenerate: 2160 training rows hold only 1221 distinct (spacegroup, composition, cell)\ntuples, so on the CSV alone many materials are literally indistinguishable. What separates them is in\n`geometry.xyz`. These cells are unrelaxed parent lattices, so two structures with identical CSV rows\ndiffer only in *which crystallographic site each cation took*. `geom.py` and its companions turn each\nstructure into ~845 descriptors of exactly that — bond valence sums and the global instability index,\nEwald/Madelung site potentials, coordination polyhedra (effective coordination, distortion indices,\nSteinhardt bond order), short-range order on the cation sublattice, percolation of each species\nthrough the M–O–M network, a tight-binding estimate of the conduction-band edge, radial symmetry\nfunctions, and a harmonic relaxation of the parent lattice — cached once in `geom_features.csv`.\n\nTabFM then sees the 11 CSV columns plus 37 of those descriptors. *Which* 37 is the whole result. At\nthis width the model is capacity-bound: a descriptor only pays if a weaker one leaves to make room,\nso the set was built by joint drop-and-swap rounds on top of a frozen offline importance ranking\n(`rank_v3.csv`), guided by leave-one-out. Of 100 single additions tried on top of a tuned set only 16\nimproved at all, where chance predicts 50; cutting the same number of columns off the ranking tail\ninstead scores 0.04252 against 0.04146 for the selected set. Validation is 5-fold shuffled KFold\n(rows are exchangeable) rather than the judge's 3, so each fold fits on 80% of the rows. Kernel-ridge\nstacking and blending, bagged draws, NNLS member weights, jittered duplicate context rows and\nunsupervised principal components were all measured and rejected; the code for those experiments is\nin `final/build/` (`krr.py`, `krrfwd.py`, `sweep.py`, `offline.py`) but none of it is on the path\nthat produces the submission.\n\n## What build.sh builds\n\n`pipeline.py` opens four files: `data/train.csv` and `data/test.csv` (raw), `geom_features.csv`, and\n`rank_v3.csv`.\n\n`build.sh` regenerates `geom_features.csv` in four appending steps, in this order:\n\n1. `geom.py` — parses every `data/{train,test}/\u003cid\u003e/geometry.xyz` and writes the ~845-column table.\n2. `sites.py` — KMeans taxonomy of cation sites per spacegroup; appends `g_site*`, `g_sitetype_*`.\n3. `pca.py` — principal components of the descriptor table; appends `g_pca*`, `g_rpca*`.\n4. `relax.py` — L-BFGS harmonic relaxation of the M–O bond network; appends `g_rlx_*`.\n\nOn the 48-core host it was built on this is a few minutes end to end (each script hard-codes\n`Pool(48)`; it still runs on a smaller machine, just proportionally slower). Disk is small: one CSV of\na few tens of MB, plus whatever the raw competition data already occupies.\n\n`rank_v3.csv` is **not** rebuilt — see below.\n\n## Things a reader would otherwise get wrong\n\n- **`rank_v3.csv` is a frozen artifact and cannot be regenerated from `final/build/geom.py`.** It was\n  computed partway through the run, on an earlier version of `geom.py` that emitted 534 descriptors;\n  the final one emits ~845 (the `g_g2_*`, `g_prdf_*`, `g_sro*`, `g_perc_*`, `g_oenv_*`, `g_tb*` and\n  `g_vegard_*` families came later — which is why the pipeline's `EXTRA` list is full of names absent\n  from the ranking). Re-running the importance recipe against the new table would reorder the top 45\n  and change the model. The committed `rank_v3.csv` in the workspace root is the artifact; `build.sh`\n  only checks it is present, and records the exact command that made it in a comment.\n- **Step order matters and `geom.py` must not be re-run afterwards.** Steps 2–4 merge into\n  `geom_features.csv` in place; re-running `geom.py` rewrites the file from scratch and silently drops\n  `g_rlx_mad_cat_std`, which the pipeline needs.\n- **`sites.py` deletes `g_siterank_*`.** Its drop filter is `startswith('g_site')`, which also matches\n  `geom.py`'s within-structure site-rank columns. That is what the scored table looked like, so the\n  step is kept as-is. Those columns sit at rank 116 in `rank_v3.csv`, well past the top 45, so nothing\n  selected is affected.\n- **Step 3 is optional.** No `g_pca*`/`g_rpca*` column is in `rank_v3.csv` or in `EXTRA`, so the\n  pipeline never selects one. It is in the build only because the scored `geom_features.csv` contains\n  them. Note also that `pca.py` does `import pipeline` to decide which descriptors to exclude from its\n  second PCA, so the `g_rpca*` values a rebuild produces differ slightly from the shipped ones (during\n  the run it saw an intermediate `pipeline.py`, and `g_rlx_*` did not exist yet). Nothing reads them.\n- **`OMP_NUM_THREADS=1` on the sklearn steps is not cosmetic.** On an oversubscribed host sklearn's\n  OpenMP path hangs rather than merely slowing down; `build.sh` sets it for `sites.py` and `pca.py`,\n  matching how they were actually invoked.\n- **`build.sh` symlinks `data/`, `geom_features.csv` and `rank_v3.csv` into `final/build/`** because\n  every build script resolves paths against its own directory (they lived in the workspace root during\n  the run). The symlinks are left in place so the build is re-runnable.\n- **The geometry join in `preprocess`, not `engineer`.** `id` is only unique within a split and a\n  validation fold hands the pipeline training ids, so `_attach` decides per row whether an id is a\n  train or a test structure by matching its CSV columns against `train.csv`. It lives in `preprocess`\n  because `engineer` may not change the row count.\n- `pipeline.py` prefers the current working directory for its caches and falls back to a hard-coded\n  workspace path, so `python final/run.py` (which chdirs to the workspace) works from a moved copy of\n  this directory as long as `build.sh` has run there."},{"id":"tabular-playground-series-dec-2021","name":"tabular-playground-series-dec-2021","short_name":"tps-dec-2021","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Cartography \u0026 Hydrology","metric_label":"Accuracy ↑","lower_is_better":false,"plain":0.96122,"plain_note":"0.96122","n_train":3600000,"n_test":400000,"n_folds":3,"thresholds":{"gold":0.9566,"silver":0.95658,"bronze":0.95658,"median":0.95342},"summary":"The task is a 7-class forest cover-type problem on a 3.6M-row GAN-generated table (the classic Covertype schema: 10 numeric terrain columns, 4 wilderness-area binaries, 40 soil-type binaries). TabFM makes the prediction; the pipeline only decides what it sees.","score":0.96264,"gain_pct":3.661681,"medal":"Gold","category":null,"lines":79,"hooks_defined":["preprocess","engineer","sample","postprocess"],"hooks_active":["preprocess","engineer","sample"],"tabfm_kwargs":{"\u003cexpression\u003e":"{'max_num_rows': CTX}"},"helper_functions":["_fe"],"helper_ranges":{"_fe":[16,55]},"hook_helpers":{"preprocess":[],"engineer":["_fe"],"sample":[],"postprocess":[]},"hook_ranges":{"preprocess":[58,63],"engineer":[66,67],"sample":[70,75],"postprocess":[78,79]},"code":"import numpy as np\nimport pandas as pd\n\nCTX = 256000              # rows per ensemble member; the judge clamps anything above this\nPOOL = 2 * CTX            # draw size: eval 4 showed the full 8*CTX pool buys nothing but preprocessing\nN_DRAWS = 1               # screening setting; the shipping config uses 2 (4 was no better, eval 24)\nMIN_CLASS = 5             # class 5 has a single training row; a dead logit is all it can contribute\nEXTRA = ()                # feature groups under test, on top of the block eval 23 settled on\n\nTABFM_KWARGS = {\"max_num_rows\": CTX}\n\nSOIL = [f\"Soil_Type{i}\" for i in range(1, 41)]\nWILD = [f\"Wilderness_Area{i}\" for i in range(1, 5)]\n\n\ndef _fe(X):\n  f = lambda c: X[c].to_numpy(np.float32)\n  el, asp, slope = f(\"Elevation\"), f(\"Aspect\"), f(\"Slope\")\n  hdh, vdh = f(\"Horizontal_Distance_To_Hydrology\"), f(\"Vertical_Distance_To_Hydrology\")\n  hdr, hdf = f(\"Horizontal_Distance_To_Roadways\"), f(\"Horizontal_Distance_To_Fire_Points\")\n  h9, hn, h3 = f(\"Hillshade_9am\"), f(\"Hillshade_Noon\"), f(\"Hillshade_3pm\")\n  s = X[SOIL].to_numpy(np.int8)\n  w = X[WILD].to_numpy(np.int8)\n  cols = dict(\n      # elevation corrected for the water table, and the true distance to it\n      Euclid_Hydro=np.sqrt(hdh * hdh + vdh * vdh),\n      Elev_m_VDH=el - vdh,\n      Elev_p_VDH=el + vdh,\n      Elev_m_HDH2=el - 0.2 * hdh,\n      # dense views of the 38 sparse soil binaries, which the GAN left non-exclusive:\n      # 41% of rows set no bit at all and some set up to seven\n      Soil_count=s.sum(1).astype(np.int8),\n      Soil_first=np.where(s.any(1), np.argmax(s, 1) + 1, 0).astype(np.int16),\n      Soil_last=(s * np.arange(1, 41, dtype=np.int16)).max(1).astype(np.int16),\n      Soil_mean=(s * np.arange(1, 41, dtype=np.float32)).sum(1) / np.maximum(s.sum(1), 1),\n      Soil_g1=s[:, :10].sum(1).astype(np.int8),\n      Soil_g2=s[:, 10:20].sum(1).astype(np.int8),\n      Soil_g3=s[:, 20:30].sum(1).astype(np.int8),\n      Soil_g4=s[:, 30:].sum(1).astype(np.int8),\n      Wild_first=np.where(w.any(1), np.argmax(w, 1) + 1, 0).astype(np.int8),\n      Wild_code=w @ (1 \u003c\u003c np.arange(4, dtype=np.int16)))\n\n  if \"artifact\" in EXTRA:\n    # the GAN put rows outside the physical range of their own columns; the test split has them too\n    cols.update(Wild_count=w.sum(1).astype(np.int8),\n                Aspect_oob=((asp \u003c 0) | (asp \u003e 360)).astype(np.int8),\n                Slope_neg=(slope \u003c 0).astype(np.int8),\n                Dist_neg=((hdh \u003c 0).astype(np.int8) + (hdr \u003c 0) + (hdf \u003c 0)),\n                Shade_oob=((h9 \u003c 0).astype(np.int8) + (h9 \u003e 255) + (hn \u003c 0) + (hn \u003e 255)\n                           + (h3 \u003c 0) + (h3 \u003e 255)))\n  if \"roadfire\" in EXTRA:\n    cols.update(Elev_m_HDR=el - 0.02 * hdr, Elev_m_HDF=el - 0.02 * hdf)\n  if \"aspect360\" in EXTRA:\n    cols.update(Aspect=np.mod(asp, 360.0).astype(np.float32))\n  return X.assign(**cols)\n\n\ndef preprocess(X_train, y_train, X_test):\n  vc = y_train.value_counts()\n  keep = y_train.isin(vc.index[vc \u003e= MIN_CLASS])\n  if keep.all():\n    return X_train, y_train, X_test\n  return X_train[keep].reset_index(drop=True), y_train[keep].reset_index(drop=True), X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  return _fe(X_train), _fe(X_test)\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  if n \u003c N_DRAWS * POOL:\n    return [np.arange(n)]\n  perm = np.random.default_rng(0).permutation(n)\n  return [np.sort(perm[i * POOL:(i + 1) * POOL]) for i in range(N_DRAWS)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  return pred\n","readme":"# tabular-playground-series-dec-2021 — scored pipeline\n\n## What it does\n\nThe task is a 7-class forest cover-type problem on a 3.6M-row GAN-generated table (the classic\nCovertype schema: 10 numeric terrain columns, 4 wilderness-area binaries, 40 soil-type binaries).\nTabFM makes the prediction; the pipeline only decides what it sees.\n\nThree things are done around it. **preprocess** drops classes with fewer than 5 training rows —\nclass 5 has a single row in this table, and a class TabFM cannot see more than once contributes a\ndead logit and nothing else. **engineer** adds 15 columns, all cheap algebra on the raw ones: four\nterrain combinations that encode elevation relative to the water table (`Elev_m_VDH`, `Elev_p_VDH`,\n`Elev_m_HDH2`, and the true Euclidean distance to hydrology), and eleven dense summaries of the\nsparse binaries. The soil block is the reason for most of them — the generator did not keep the\none-hot exclusive, so 41% of rows set no soil bit and some set up to seven; `Soil_count`,\n`Soil_first`/`Soil_last`/`Soil_mean` and four decade-group counts give TabFM in a handful of dense\ncolumns what it would otherwise have to read out of 40 nearly-empty ones. **sample** hands TabFM one\nseeded draw of 512000 rows (2× the context), from which each ensemble member takes its own 256000.\n\n`TABFM_KWARGS = {\"max_num_rows\": 256000}` — the judge's hard cap — is the single largest lever in\nthe whole run. Context size dominated: a feature block worth +0.00087 accuracy at a 65536-row window\nwas worth +0.00012 at 256000, because at that size the rows already carry what the features stood\nin for. `postprocess` is the identity.\n\nCV accuracy 0.96293, held-out test accuracy 0.96264 (gold threshold 0.9566), 8 estimators, ~26 min\nfor the final pass.\n\n## What build.sh builds\n\nNothing. `pipeline.py` reads no files — it works entirely from the frames `judge.py` passes to the\nhooks — so `final/build.sh` prints that and exits 0. Run it anyway if you want the invocation to be\nuniform; it takes under a second and needs no disk.\n\nThe submission itself is produced by:\n\n    cd \u003cthis workspace\u003e \u0026\u0026 bash final/build.sh \u0026\u0026 python final/run.py\n\nwhich loads 3.6M train / 400k test rows and runs one 8-member TabFM pass. Budget an H100-class GPU\nand roughly half an hour.\n\n## Things a reader could get wrong\n\n- **`final/build/` is analysis, not build steps.** Those six scripts were run during the search to\n  decide what to ship and are dead weight at reproduction time. They read a parquet copy of the CSVs\n  that was made once with a shell one-liner —\n  `python -c \"import pandas as pd, os; d=os.environ['TMPDIR']+'/work'; pd.read_csv('data/train.csv').to_parquet(d+'/train.parquet'); pd.read_csv('data/test.csv').to_parquet(d+'/test.parquet')\"`\n  — and `screen.py` writes `$TMPDIR/work/screen.json`. Nothing in `pipeline.py` opens any of it.\n  `equiv.py` is the one worth keeping: it proves the shipped `pipeline.py` is bit-for-bit the same\n  function as `history/pipeline_027.py`, the snapshot that was scored.\n- **`N_DRAWS = 1` is deliberate, despite what its comment says.** The comment describes 1 as \"the\n  screening setting\" and 2 as shipping; the scored file is `pipeline_027.py`, which uses 1, and\n  that is what these numbers are. Do not \"fix\" it to 2 — that changes which rows TabFM sees and\n  invalidates the reported score.\n- **`EXTRA = ()` disables three feature groups** (`artifact`, `roadfire`, `aspect360`) that remain\n  in `_fe` as dead branches. They were tried and did not pay at the 256000 context. The code is\n  left in because the branches are what makes the shipped column set legible as a decision.\n- **Fold/seed structure matters for any comparison.** `sample()` is seeded on\n  `default_rng(0)` and TabFM's member subsampling rides on a fixed random_state, so two variants\n  that differ only in `engineer()` see literally identical rows and compare exactly; anything that\n  moves rows carries about ±0.0009 of fold-to-fold noise."},{"id":"tabular-playground-series-may-2022","name":"tabular-playground-series-may-2022","short_name":"tps-may-2022","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Manufacturing Telemetry","metric_label":"1 - AUROC ↓","lower_is_better":true,"plain":0.05179,"plain_note":"0.05179 (AUROC 0.94821)","n_train":800000,"n_test":100000,"n_folds":3,"thresholds":{"gold":0.00177,"silver":0.00178,"bronze":0.00182,"median":0.027325},"summary":"TabFM makes the prediction; the pipeline's job is to hand it a table whose structure it can read. Three things go in. First, `f_27` — the only non-numeric column, a fixed-width ten-character string — is unpacked into ten integer character codes plus `ch_nuniq`, the number of distinct characters in the string.","score":0.00179,"gain_pct":96.543734,"medal":"Bronze","category":null,"lines":151,"hooks_defined":["preprocess","engineer","postprocess"],"hooks_active":["engineer","postprocess"],"tabfm_kwargs":{"max_num_rows":"262144"},"helper_functions":["_char_codes","_nunique","_cells","_terms","_raw","_cell_fit","_score","_summaries"],"helper_ranges":{"_char_codes":[29,32],"_nunique":[35,36],"_cells":[39,44],"_terms":[47,54],"_raw":[60,73],"_cell_fit":[76,98],"_score":[101,103],"_summaries":[106,128]},"hook_helpers":{"preprocess":[],"engineer":["_char_codes","_nunique","_cells","_terms","_raw","_cell_fit","_score","_summaries"],"postprocess":[]},"hook_ranges":{"preprocess":[131,132],"engineer":[135,139],"postprocess":[142,151]},"code":"import os\n\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {'max_num_rows': 262144}\n\nFLOAT_COLS = ['f_00', 'f_01', 'f_02', 'f_03', 'f_04', 'f_05', 'f_06']\nINT_COLS = ['f_%02d' % i for i in range(7, 19)]\nBIG_COLS = ['f_%02d' % i for i in range(19, 27)]\nCHAR_COLS = ['ch_%d' % i for i in range(10)]\n# name -\u003e (columns, columns to cross them with or None for self-products, switch cells)\nBLOCKS = {'a_int': (INT_COLS, None, 'sw16'),\n          'a_ch': (CHAR_COLS + ['ch_nuniq'], None, 'sw16'),\n          'a_big': (BIG_COLS, None, 'f_30'),\n          'x_int_ch': (INT_COLS, CHAR_COLS, 'sw16'),\n          'x_big_ch': (BIG_COLS, CHAR_COLS, 'f_30'),\n          'a_sm': (FLOAT_COLS + ['f_28'], None, 'one')}\nN_CELLS = {'sw16': 16, 'f_30': 3, 'one': 1}\nFIT_ROWS = None  # None: fit the summaries on the whole training fold\nRIDGE = 50.0\nIRLS = 3\nOOF_FOLDS = 2\n\nDIAG = ('~/tabfm-evolve/runs/tabular-playground-series-may-2022/'\n        'run/diag')\n\n\ndef _char_codes(s):\n  \"\"\"(n, 10) int array of the ASCII offsets of a fixed-width 10-char string column.\"\"\"\n  a = np.asarray(s.astype(str).values, dtype='U10').view(np.uint32).reshape(len(s), 10)\n  return (a - ord('A')).astype(np.int16)\n\n\ndef _nunique(s):\n  return np.fromiter((len(set(v)) for v in s.astype(str).values), dtype=np.int8, count=len(s))\n\n\ndef _cells(df):\n  \"\"\"The switch cells each block is aligned within.\"\"\"\n  codes = _char_codes(df['f_27'])\n  sw16 = df['f_29'].values * 8 + codes[:, 0] * 4 + codes[:, 2] * 2 + codes[:, 5]\n  return {'sw16': sw16.astype(np.int16), 'f_30': df['f_30'].values.astype(np.int16),\n          'one': np.zeros(len(df), dtype=np.int16)}\n\n\ndef _terms(frame, cols, other):\n  \"\"\"Self blocks: the columns plus every product and square. Cross blocks: the outer products.\"\"\"\n  v = np.asarray(frame[cols].values, dtype=np.float32)\n  if other is not None:\n    u = np.asarray(frame[other].values, dtype=np.float32)\n    return (v[:, :, None] * u[:, None, :]).reshape(len(v), -1)\n  i, j = np.triu_indices(v.shape[1], 0)\n  return np.concatenate([v, v[:, i] * v[:, j]], axis=1)\n\n\nDROP_INTS = INT_COLS + ['f_03', 'f_04', 'f_06', 'ch_1', 'ch_3', 'ch_4', 'ch_6', 'ch_9']\n\n\ndef _raw(df):\n  \"\"\"The columns TabFM sees before the summaries are appended.\"\"\"\n  out = {c: df[c].values for c in df.columns if c != 'f_27'}\n  codes = _char_codes(df['f_27'])\n  for i in range(10):\n    out['ch_%d' % i] = codes[:, i]\n  out['ch_nuniq'] = _nunique(df['f_27'])\n  s1 = (df['f_02'] + df['f_21']).values\n  s2 = (df['f_05'] + df['f_22']).values\n  s3 = (df['f_00'] + df['f_01'] + df['f_26']).values\n  out['t_02_21'] = (s1 \u003e 5.2).astype(np.int8) - (s1 \u003c -5.3).astype(np.int8)\n  out['t_05_22'] = (s2 \u003e 5.1).astype(np.int8) - (s2 \u003c -5.4).astype(np.int8)\n  out['t_00_01_26'] = (s3 \u003e 5.0).astype(np.int8) - (s3 \u003c -5.0).astype(np.int8)\n  return pd.DataFrame(out, index=df.index)\n\n\ndef _cell_fit(terms, cell, y, n_cells, rows):\n  \"\"\"Ridge logistic per cell over `rows`; returns (mean, sd, weights) stacked by cell.\"\"\"\n  d = terms.shape[1]\n  mu = np.zeros((n_cells, d))\n  sd = np.ones((n_cells, d))\n  wts = np.zeros((n_cells, d + 1))\n  g = RIDGE * np.eye(d + 1)\n  g[-1, -1] = 1e-6\n  for c in range(n_cells):\n    m = rows \u0026 (cell == c)\n    if m.sum() \u003c 500:\n      continue\n    t = terms[m].astype(np.float64)\n    yt = y[m]\n    mu[c] = t.mean(0)\n    sd[c] = np.maximum(t.std(0), 1e-9)\n    z = np.column_stack([(t - mu[c]) / sd[c], np.ones(len(t))])\n    w = np.zeros(d + 1)\n    for _ in range(IRLS):\n      pr = 1.0 / (1.0 + np.exp(-z @ w))\n      w = w + np.linalg.solve((z.T * (pr * (1 - pr))) @ z + g, z.T @ (yt - pr) - g @ w)\n    wts[c] = w\n  return mu, sd, wts\n\n\ndef _score(terms, cell, par):\n  mu, sd, wts = par\n  return ((terms - mu[cell]) / sd[cell] * wts[cell, :-1]).sum(1) + wts[cell, -1]\n\n\ndef _summaries(tr, te, ctr, cte, y):\n  \"\"\"Out-of-fold summaries for the context rows, full-fit ones for the rows being predicted.\n\n  The two sides must be on the same footing: a row scored by a fit that saw its own label sits\n  slightly closer to the truth than one scored out of sample, and TabFM reads the context rows\n  and the query rows off the same column.\n  \"\"\"\n  y = np.asarray(y, dtype=np.float64).ravel()\n  n = len(y)\n  part = np.random.default_rng(1).permutation(n) % OOF_FOLDS\n  allrows = np.ones(n, dtype=bool)\n  for name, (cols, other, switch) in BLOCKS.items():\n    t_tr = _terms(tr, cols, other)\n    cell = np.asarray(ctr[switch]).astype(np.int64)\n    te[name] = _score(_terms(te, cols, other), np.asarray(cte[switch]).astype(np.int64),\n                      _cell_fit(t_tr, cell, y, N_CELLS[switch], allrows))\n    out = np.zeros(n)\n    for k in range(OOF_FOLDS):\n      held = part == k\n      par = _cell_fit(t_tr, cell, y, N_CELLS[switch], ~held)\n      out[held] = _score(t_tr[held], cell[held], par)\n    tr[name] = out\n  return tr, te\n\n\ndef preprocess(X_train, y_train, X_test):\n  return X_train, y_train, X_test\n\n\ndef engineer(X_train, y_train, X_test):\n  tr, te = _raw(X_train), _raw(X_test)\n  ctr, cte = _cells(X_train), _cells(X_test)\n  tr, te = _summaries(tr, te, ctr, cte, y_train)\n  return tr.drop(columns=DROP_INTS), te.drop(columns=DROP_INTS)\n\n\ndef postprocess(pred, y_orig, X_test):\n  try:\n    os.makedirs(DIAG, exist_ok=True)\n    p = np.asarray(pred)[:, -1] if getattr(pred, 'ndim', 1) \u003e 1 else np.asarray(pred)\n    np.savez_compressed(\n        os.path.join(DIAG, 'fold_%d_%d.npz' % (os.getpid(), len(X_test))),\n        id=np.asarray(X_test['id'].values), p=p.astype(np.float32))\n  except Exception:\n    pass\n  return pred\n","readme":"# tabular-playground-series-may-2022 — final pipeline\n\n## What it does\n\nTabFM makes the prediction; the pipeline's job is to hand it a table whose structure it can read. Three\nthings go in. First, `f_27` — the only non-numeric column, a fixed-width ten-character string — is\nunpacked into ten integer character codes plus `ch_nuniq`, the number of distinct characters in the\nstring. Second, three thresholded interactions: a 0.01-step scan of the target rate over linear\ncombinations of the continuous columns found exactly three places where the rate jumps, at\n`f_02+f_21 = +5.20/-5.30`, `f_05+f_22 = +5.10/-5.40` and `f_00+f_01+f_26 = +5.00/-5.00`; each becomes a\nternary column (+1 above, -1 below, 0 between). The raw sums are deliberately *not* carried alongside\nthem — they correlate ~0.93 with the big float inside each and cost score as duplicates. Third, six\nsummary columns. The data has switch variables: within a cell of `f_29` and the characters `ch_0`,\n`ch_2`, `ch_5` (16 cells) and within `f_30` (3 cells), the sign of each column's correlation with the\ntarget is constant, and it flips across cells. So for each block of columns — integers, characters,\nbig floats, small floats, and the integer×character and bigfloat×character outer products — a ridge\nlogistic regression (IRLS, 3 steps, penalty 50) is fitted per cell over that block's terms, and its\nlogit becomes one column. Each summary scores only 0.72–0.85 alone, which is the point: they inform\nTabFM rather than replace it. The context rows' summaries are scored out-of-fold (2 splits inside the\ntraining fold) and the query rows' from the full fit, so both sides of the column sit at the same\ndistance from the truth — TabFM reads them off the same column and keys on the mismatch otherwise.\nFinally the table is thinned: once a block has a summary carrying it, its raw columns come out. All\ntwelve integer columns, `f_03/f_04/f_06`, and five of the ten characters are dropped, leaving 31\ncolumns. The only TabFM knob changed from default is `max_num_rows: 262144` (the judge clamps it to\n256000). 3-fold CV AUC 0.99820 (identity pipeline: 0.94821).\n\n## What build.sh builds\n\nNothing. `build.sh` is a comment and `exit 0`. The pipeline reads no file: every feature above is\nrecomputed inside `engineer()` from the frames the judge passes in, and the per-cell summaries are\nrefitted per fold, so there is no cache, no feature table and no saved model to regenerate. No disk,\nno time. There is no `final/build/` directory either — no standalone script was written during the\nrun; the analyses behind the thresholds and the switch cells were throwaway shell heredocs that left\nno artifact the pipeline depends on.\n\nRun it with `python final/run.py`.\n\n## Things a reader could get wrong\n\n- **`DIAG` is an absolute path** to `\u003cthis workspace\u003e/diag`, hardcoded in `pipeline.py`. `postprocess`\n  dumps every fold's predictions there for error analysis and is never read back; the whole block is\n  wrapped in `try/except: pass`, so on a machine where that path is not writable the pipeline is\n  unaffected. It is diagnostics, not part of the method.\n- **The thresholds are exact, not approximate.** `5.2 / -5.3 / 5.1 / -5.4 / 5.0 / -5.0` were located by\n  scan; rounding them all to ±5.0 loses real score. Getting `f_00+f_01+f_26` right alone was +0.00045.\n- **The dropped columns are not dead weight in general** — they are dead weight *given* the summaries\n  and *at this context size*. The same five integer columns cost 0.00025 when dropped at the 65536\n  default context and gained score at 256000 with `a_int` present. Re-screen columns before changing\n  either.\n- **Cost.** `engineer()` takes ~30s per fold at final size, against the judge's 600s per-stage limit;\n  the `IRLS=3` / `OOF_FOLDS=2` settings are a deliberate 3x speedup over the 5/5 version that leaves\n  the query-side summaries numerically identical (correlation ≥ 0.99987). The TabFM pass at 256000\n  context rows dominates the wall clock: the whole scored evaluation was ~970s for 3 folds."},{"id":"champs-scalar-coupling","name":"champs-scalar-coupling","short_name":"champs-coupling","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Quantum Chemistry (3D NMR)","metric_label":"Log-MAE ↓","lower_is_better":true,"plain":1.19025,"plain_note":"+1.19025","n_train":4191263,"n_test":467813,"n_folds":3,"thresholds":{"gold":-2.87509,"silver":-2.03119,"bronze":-1.90122,"median":-0.9529},"summary":"The predictor is the frozen TabFM, in-context, over sampled training couplings. Everything around it is about handing it a table where one row is a scalar-coupling pair described by geometry alone.","score":-1.54947,"gain_pct":null,"medal":"Above Median","category":null,"lines":176,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"\u003cexpression\u003e":"{'max_num_rows': MAX_ROWS}"},"helper_functions":["_keys","_fill","_merge","_quota"],"helper_ranges":{"_keys":[83,89],"_fill":[92,98],"_merge":[120,125],"_quota":[137,152]},"hook_helpers":{"preprocess":["_keys","_fill"],"engineer":["_merge"],"sample":["_quota"],"postprocess":["_keys","_fill"],"folds":[]},"hook_ranges":{"preprocess":[101,116],"engineer":[128,133],"sample":[155,164],"postprocess":[168,176],"folds":[63,67]},"code":"import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\nFEAT_PATH = 'features.parquet'\nFEAT_PATH2 = 'features2.parquet'\nFEAT_PATH3 = 'features3.parquet'\nFEAT_PATH4 = 'features4.parquet'\nFEAT_PATH5 = 'features5.parquet'\nFEAT_PATH6 = 'features6.parquet'\nFEAT_PATH7 = 'features7.parquet'\nNORM_PATH = '.ynorm.json'\n\nMAX_ROWS = 256000                # judge.context_rows, the hard cap\nPOOL = 512000                    # rows in the draw; each of the 8 members subsamples MAX_ROWS of them\nSAMPLE_ALPHA = 0.0               # 0 = equal rows per type, 1 = proportional\nN_DRAWS = 2                      # the judge runs one fit+predict per draw and averages them\n\nTABFM_KWARGS = {'max_num_rows': MAX_ROWS}\n\nNUM_FEATS = [\n    'a0_nearC', 'a0_nearH', 'a0_nearN', 'a0_nearO', 'a0_nn2', 'a0_nn3', 'a0_zd3', 'a1_deg',\n    'a1_dmin', 'a1_nearC', 'a1_nearH', 'a1_nearN', 'a1_nearO', 'a1_nn1', 'a1_nn2', 'a1_nn3',\n    'cos_i_n0_j', 'cos_n0_i_j', 'd_n0_j', 'dist', 'mol_nH', 'n0_n2', 'n0_nearC', 'n0_nearN',\n    'n0_nearO', 'n0_nn1', 'n0_zd3', 'p3_abscos_max', 'p3_cos', 'p3_cos2', 'p3_cos_t2', 'p3_d_i_m2',\n    'p3_d_m2_j', 'p3_d_n0_m2', 'a1_nbN', 'd_i_n0', 'a1_ed2'\n]\n\nNUM_FEATS2 = [\n    'a1_ang_max', 'a1_ang_mean', 'a1_ang_min', 'a1_nben', 'dist_over_path', 'mid_dmin', 'mid_n2',\n    'mid_zd2', 'n0_ang_max', 'n0_ang_mean', 'n0_ang_min', 'n0_nben', 'path_len', 'n0_2nbO'\n]\n\nNUM_FEATS3 = [\n    'a1_gd3', 'angH_a1_max', 'angH_a1_mean', 'angH_a1_min', 'angH_n0_max', 'angH_n0_mean',\n    'angH_n0_min', 'n0_bl_mean'\n]\n\nNUM_FEATS4 = [\n    'g0_dmax', 'g0_dmin', 'g0_dstd', 'g0t_ddiff', 'g1_dmax', 'g1_dmin', 'g1t_ddiff'\n]\n\nNUM_FEATS5 = [\n    'a0_ang1', 'a0_ang4', 'a0_radH0', 'a0_radH1', 'a0_radZ0', 'a0_radZ1', 'a1_oop', 'a1_radH0',\n
