.astype(np.int64)\nn0 = bond[m, i].argmax(1)\nN = len(pairs)\nP = {'id': pairs.id.values}\npi, pn0 = pos[m, i], pos[m, n0]\n\n# ---------------------------------------------------------------- n0's substituents, one by one\nnb = nbidx[m, n0].astype(np.int64)                              # (N, MAXDEG)\nok = nbmask[m, n0] & (nb != i[:, None])\npnb = pos[m[:, None], nb]                                       # (N, MAXDEG, 3)\nblen = np.linalg.norm(pnb - pn0[:, None, :], axis=-1)\nzsub = ZNUM[ecc[m[:, None], nb]]\nangsub = (unit(pnb - pn0[:, None, :]) * unit(pi - pn0)[:, None, :]).sum(-1)\norder = np.argsort(np.where(ok, -zsub * 100 + blen, 1e6), axis=1, kind='stable')\nr = np.arange(N)[:, None]\nfor k in range(3):\n  c = order[:, k]\n  good = ok[r[:, 0], c]\n  P[f'sub{k}_z'] = np.where(good, zsub[r[:, 0], c], np.nan)\n  P[f'sub{k}_len'] = np.where(good, blen[r[:, 0], c], np.nan)\n  P[f'sub{k}_ang'] = np.where(good, angsub[r[:, 0], c], np.nan)\nlog('substituents')\n\n# ---------------------------------------------------------------- third-shell dihedrals from the H\nhyp_n = np.zeros(N, np.float32)\nhyp_c2 = np.zeros(N, np.float32)\nhyp_c2en = np.zeros(N, np.float32)\nhyp_anti = np.full(N, -1.0, np.float32)\nhyp_anti_en = np.zeros(N, np.float32)\nhyp_nof = np.zeros(N, np.float32)\nb1 = pn0 - pi\nfor p in range(MAXDEG):\n  X = nb[:, p]\n  okX = ok[:, p]\n  if not okX.any():\n    continue\n  pX = pos[m, X]\n  v2 = pX - pn0\n  nbX = nbidx[m, X].astype(np.int64)\n  okXn = nbmask[m, X] & (nbX != n0[:, None])\n  for q in range(MAXDEG):\n    w = nbX[:, q]\n    g = okX & okXn[:, q]\n    idx = np.flatnonzero(g)\n    if len(idx) == 0:\n      continue\n    v3 = pos[m[idx], w[idx]] - pX[idx]\n    c1 = np.cross(b1[idx], v2[idx])\n    c2 = np.cross(v2[idx], v3)\n    cd = np.clip((unit(c1) * unit(c2)).sum(-1), -1, 1)\n    en = ENEG[ecc[m[idx], w[idx]]]\n    isnof = (ecc[m[idx], w[idx]] >= 2).astype(np.float32)\n    hyp_n[idx] += 1\n    hyp_c2[idx] += cd ** 2\n    hyp_c2en[idx] += en * cd ** 2\n    anti = np.where(cd < 0, cd ** 2, 0.0).astype(np.float32)\n    hyp_anti[idx] = np.maximum(hyp_anti[idx], anti)\n    hyp_anti_en[idx] = np.maximum(hyp_anti_en[idx], en * anti)\n    hyp_nof[idx] += isnof * cd ** 2\nP['hyp_n'] = hyp_n\nP['hyp_c2'] = hyp_c2\nP['hyp_c2en'] = hyp_c2en\nP['hyp_c2en_mean'] = hyp_c2en / np.maximum(hyp_n, 1)\nP['hyp_anti'] = np.where(hyp_n > 0, hyp_anti, np.nan)\nP['hyp_anti_en'] = np.where(hyp_n > 0, hyp_anti_en, np.nan)\nP['hyp_nof'] = hyp_nof\nlog('hyperconjugation dihedrals')\n\n# ---------------------------------------------------------------- more of the H's radial profile\nDsafe = np.where(np.isfinite(D), D, np.float32(1e6))\nsrt = np.argsort(Dsafe, axis=2)\ndsrt = np.take_along_axis(Dsafe, srt, axis=2)\nzsrt = ZNUM[ecc[np.arange(M)[:, None, None], srt]]\nfor k in (4, 5, 6):\n  v = dsrt[m, i, k]\n  P[f'a0_nn{k}'] = np.where(v < 1e5, v, np.nan)\nfor k in (1, 2, 3, 4):\n  P[f'a0_nnz{k}'] = np.where(dsrt[m, i, k] < 1e5, zsrt[m, i, k], np.nan)\nlog('radial profile')\n\ndf = pd.DataFrame({k: (v if k == 'id' else np.asarray(v, np.float32)) for k, v in P.items()})\ndf.to_parquet('features6.parquet', index=False)\nlog('written features6.parquet', df.shape)\nprint(df.describe().T.to_string())\n"},{"path":"build/build_features7.py","lines":99,"direct":true,"text":"\"\"\"Seventh wave -> features7.parquet: what lies more than three bonds away.\n\nEverything so far stops at the second or third coordination shell; a message-passing network\nwould keep going.  Two cheap stand-ins: aggregates over each exact graph-distance shell around\nthe two coupling atoms, and the sorted Coulomb vector (Z_k / d_k over the nearest atoms), which\nsummarises the whole local field without picking a shell at all.\n\"\"\"\nimport time\nimport numpy as np\nimport pandas as pd\n\nT0 = time.time()\nELEMS = ['H', 'C', 'N', 'O', 'F']\nZNUM = np.array([1.0, 6.0, 7.0, 8.0, 9.0], np.float32)\nRCOV = np.array([0.31, 0.76, 0.71, 0.66, 0.57], np.float32)\nENEG = np.array([2.20, 2.55, 3.04, 3.44, 3.98], np.float32)\nA, BOND_SLACK, NSHELL, NCM = 29, 0.40, 5, 8\n\n\ndef log(*a):\n  print(f\"[{time.time() - T0:7.1f}s]\", *a, flush=True)\n\n\ns = pd.read_csv('data/structures.csv')\nmol_code, mol_uniq = pd.factorize(s.molecule_name, sort=True)\ns['mol'] = mol_code\ns['ec'] = s.atom.map({e: i for i, e in enumerate(ELEMS)}).astype(np.int8)\nM = len(mol_uniq)\npos = np.zeros((M, A, 3), np.float32)\nec = np.full((M, A), -1, np.int8)\npos[s.mol.values, s.atom_index.values] = s[['x', 'y', 'z']].values.astype(np.float32)\nec[s.mol.values, s.atom_index.values] = s.ec.values\nvalid = ec >= 0\necc = np.clip(ec, 0, None)\n\nD = np.empty((M, A, A), np.float32)\nfor a in range(0, M, 20000):\n  b = min(a + 20000, M)\n  D[a:b] = np.linalg.norm(pos[a:b, :, None, :] - pos[a:b, None, :, :], axis=-1)\npairvalid = valid[:, :, None] & valid[:, None, :]\neye = np.eye(A, dtype=bool)[None]\nD[~pairvalid | eye] = np.inf\nrr = RCOV[ecc]\nbond = (D <= (rr[:, :, None] + rr[:, None, :] + BOND_SLACK)) & pairvalid & ~eye\n\nAf = bond.astype(np.float32)\nshells = [bond]\nfor _ in range(NSHELL - 1):\n  nxt = np.empty((M, A, A), bool)\n  for a in range(0, M, 20000):\n    b = min(a + 20000, M)\n    nxt[a:b] = (np.matmul(shells[-1][a:b].astype(np.float32), Af[a:b]) > 0.5) & pairvalid[a:b] & ~eye\n    for q in shells:\n      nxt[a:b] &= ~q[a:b]\n  shells.append(nxt)\ndel Af\nlog('shells')\n\nZb = np.where(valid, ZNUM[ecc], 0.0).astype(np.float32)\nEb = np.where(valid, ENEG[ecc], 0.0).astype(np.float32)\nDz = np.where(np.isfinite(D), D, 0.0).astype(np.float32)\nsh_cnt, sh_en, sh_z, sh_d = [], [], [], []\nfor R in shells:\n  Rf = R.astype(np.float32)\n  c = Rf.sum(2)\n  sh_cnt.append(c)\n  sh_en.append(np.einsum('mij,mj->mi', Rf, Eb))\n  sh_z.append(np.einsum('mij,mj->mi', Rf, Zb))\n  sh_d.append(np.where(c > 0, (Rf * Dz).sum(2) / np.maximum(c, 1), np.nan))\ndel shells\nlog('shell aggregates')\n\n# sorted Coulomb vector Z_k / d_k\nDsafe = np.where(np.isfinite(D), D, np.float32(1e6))\ncm = np.sort(np.where(np.isfinite(D), Zb[:, None, :] / np.maximum(Dsafe, 0.3), 0.0), axis=2)[:, :, ::-1]\ncm = np.ascontiguousarray(cm[:, :, :NCM])\ndel D, Dsafe\nlog('coulomb vector')\n\ncols = ['id', 'molecule_name', 'atom_index_0', 'atom_index_1']\npairs = pd.concat([pd.read_csv('data/train.csv', usecols=cols),\n                   pd.read_csv('data/test.csv', usecols=cols)], ignore_index=True)\nmmap = pd.Series(np.arange(M), index=mol_uniq)\nm = mmap.reindex(pairs.molecule_name.values).values.astype(np.int64)\ni = pairs.atom_index_0.values.astype(np.int64)\nj = pairs.atom_index_1.values.astype(np.int64)\nP = {'id': pairs.id.values}\nfor tag, idx in (('a0', i), ('a1', j)):\n  for k in range(1, NSHELL):\n    P[f'{tag}_s{k+1}cnt'] = sh_cnt[k][m, idx]\n    P[f'{tag}_s{k+1}en'] = sh_en[k][m, idx]\n    P[f'{tag}_s{k+1}z'] = sh_z[k][m, idx]\n    P[f'{tag}_s{k+1}d'] = sh_d[k][m, idx]\n  for k in range(NCM):\n    P[f'{tag}_cm{k}'] = cm[m, idx, k]\n\ndf = pd.DataFrame({k: (v if k == 'id' else np.asarray(v, np.float32)) for k, v in P.items()})\ndf.to_parquet('features7.parquet', index=False)\nlog('written features7.parquet', df.shape)\n"}],"derivations":[{"name":"features.parquet … features7.parquet","tone":"build","tag":"Built offline","what":"Per-coupling geometry and bond-topology features for all 4.66M train + test pairs, from structures.csv (3D coordinates) and the pair lists. No target is read.","steps":[["build_features.py","build/build_features.py",256],["build_features2.py","build/build_features2.py",159],["build_features3.py","build/build_features3.py",157],["build_features4.py","build/build_features4.py",38],["build_features5.py","build/build_features5.py",157],["build_features6.py","build/build_features6.py",146],["build_features7.py","build/build_features7.py",98]],"preview":{"caption":"Columns engineer() takes from each file (110 in total).","rows":[["features.parquet",37,""],["features2.parquet",14,""],["features3.parquet",8,""],["features4.parquet",7,""],["features5.parquet",14,""],["features6.parquet",17,""],["features7.parquet",13,""]]},"use":{"text":"engineer() joins the listed columns onto each coupling by id.","refs":[["FEAT_PATH*","pipeline.py",18],["NUM_FEATS*","pipeline.py",34],["engineer()","pipeline.py",139]]}}]},{"id":"ventilator-pressure-prediction","name":"ventilator-pressure-prediction","short_name":"ventilator-pressure","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Respiratory Control Time-Series","metric_label":"MAE ↓","lower_is_better":true,"plain":3.7845,"plain_note":"3.78450","n_train":5432400,"n_test":603600,"n_folds":3,"thresholds":{"gold":0.1119,"silver":0.1338,"bronze":0.1364,"median":0.1638},"summary":"The task is row-wise but the signal is per-breath, so the pipeline folds each breath's history into its rows and then hands TabFM a *correction* rather than the pressure itself.","score":0.35684,"gain_pct":90.571013,"medal":"Valid Submission","category":null,"lines":733,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","sample","postprocess","folds"],"tabfm_kwargs":{"max_num_rows":"256000","outlier_threshold":"8.0"},"helper_functions":["_geom","_bmat","_nn_lookup","_correct","_pca_cols","_nn_cols","_lag","_lead","_roll","_features","_scale","_fwd","_inv"],"helper_ranges":{"_geom":[331,345],"_bmat":[363,375],"_nn_lookup":[378,430],"_correct":[433,446],"_pca_cols":[449,456],"_nn_cols":[459,479],"_lag":[483,486],"_lead":[489,492],"_roll":[495,498],"_features":[501,590],"_scale":[593,594],"_fwd":[597,598],"_inv":[601,602]},"hook_helpers":{"preprocess":["_geom","_bmat","_nn_lookup","_correct","_pca_cols","_nn_cols","_lag","_lead","_roll","_features","_scale","_fwd"],"engineer":[],"sample":[],"postprocess":["_geom","_inv"],"folds":["_geom"]},"hook_ranges":{"preprocess":[629,678],"engineer":[681,682],"sample":[617,626],"postprocess":[691,733],"folds":[348,359]},"code":"\"\"\"Ventilator pressure. Row-wise TabFM needs the breath's history folded into the row.\n\n- folds(): grouped by breath_id. Validation = the first 38 steps of 1315 held-out breaths (49970 rows), under\n  the judge's 50000 scored rows per fold, so X_test keeps whole breath prefixes and lag/lead features work.\n- every feature is a function of steps 0..37 of the breath only, so a row's features are identical whether or\n  not the expiratory tail (steps 38..79, present in the real test split) is in the frame.\n- only u_out==0 rows are scored, so the training context is restricted to them.\n\nScores so far (65536 context unless noted): identity 3.78450 | 52 causal+breath columns 0.45623 (0.43455 at\n131072) | 30 lean columns 0.50173 | 75 columns 0.45469.\n\nThe breath neighbour lookup: a breath is identified by its whole u_in trajectory, so look up the nearest\ntraining breaths with the same (R, C) and hand TabFM their measured pressure at this step. On its own that\nlookup scores 0.63 MAE -- worse than TabFM -- but it is built from information TabFM's 65536-row context does\nnot contain, and adding it moved 0.45623 -> 0.40172. Leave-one-out on the training side so the column means the\nsame thing there (verified: 0.706/0.636 train vs 0.705/0.630 validation).\n\nv7 result: 0.40372 against 0.40172 -- the locally-linear reconstruction is a better lookup on its own but\nbuys TabFM nothing on top of the inverse-distance one. Kept (inside the fold spread of 0.012).\n\nv8 result: outlier_threshold=10 (from 4) scored 0.40732 -- no help, reverted. The clipping is not what costs\nthe high-pressure breaths.\n\nv9 result: norm_methods ['none','power','quantile','robust'] scored 0.42068 against 0.40372 for the default\n['none','power'] -- reverted.\n\nv10 intent: (a) pressure is quantised -- the 950 values in the training target lie on a 0.0703 grid -- so snap\npredictions to it. Offline on a synthetic prediction that is worth about -0.001. (b) Savitzky-Golay smoothing\nalong the breath is off: a quadratic over 5 steps costs 0.365 MAE of bias on the *exact* pressure trace, so the\ntrace is not smooth at that scale and no noise reduction pays for it. (c) dump each fold's raw TabFM output to\n.diag_*.npz -- validation rows are training rows, so their labels are mine, and the error can be read apart\noffline for free.\n\nv11 result: 0.40963 -- splitting the anchor into level and shape made it worse. Together with v5 (75 columns,\n0.45469 against 0.45623 for 52) and v7, TabFM is saturated on columns here: past ~59 nothing pays. Reverted to\nthe 59-column set of v6, the best measured feature set, now with the grid snapping of v10.\n\nv12 result: enable_nnls scored 0.40343 against ~0.401 expected for the same pipeline without it -- neutral, and\nit costs an extra prediction pass. Dropped.\n\nv13 result: 0.38729 at max_num_rows=256000 against ~0.401 at the default 65536 -- the best score so far, at\n2.5x the run time. The marginal value of context has shrunk since the lookup went in (-0.0217 for one doubling\nbefore it, -0.014 for two after), which fits: the lookup already carries information from all 2.02M rows.\n\nv14 result: (pressure + 2) ** 1.5 scored 0.40846 against ~0.401 for the identity target at 65536 -- reverted.\n\nv15 result: n_feature_crosses='sqrt' with n_svd_features='sqrt' scored 0.40612 against ~0.401 at 65536 --\ndropped. Every ensemble knob tried (outlier_threshold, norm_methods, enable_nnls, crosses, svd) is neutral or\nworse than the default, so the defaults stand and the remaining compute lever is how many members there are.\n\nv16 result: a second draw (sixteen members instead of eight) scored 0.38624 against 0.38729 for one, at twice\nthe run time. Dropped: 0.001 is a tenth of the fold spread.\n\nv17 result: 0.37957 at 65536 -- better than the absolute target at four times the context (0.38729), and\n-0.021 against the absolute target at the same context. The anchor alone is 0.559 MAE and the pipeline is\n0.380, so TabFM turns the anchor into something 32% better; tabfm_corr=0.038 is the residual parameterisation,\nnot a model that stopped predicting.\n\nv18 result: 0.36938, the two gains adding as expected.\n\nv19 result: 0.38168 against 0.37957 -- the seven mismatch columns cost more in width than they returned, the\nsame pattern as v5, v7 and v11.\n\nv20 result: 0.37322 with 44 columns against 0.37957 with 60 -- and 317s instead of 450s. Width was costing\naccuracy, not just time. Keep cutting.\n\nv21 result: 0.37453 with 35 columns against 0.37322 with 44 -- the optimum is flat between the two, so 44\nstands.\n\nv22 result: 0.36532, the best so far.\n\nv23 result: 0.37669 against 0.37322 -- a *better* anchor (0.552 instead of 0.581) made the pipeline worse.\nAnchor accuracy has almost no elasticity here: what TabFM uses is the mismatch signal, and the linear\ncorrection spends it. Reverted.\n\nv24 result: 0.37841 against 0.37322 -- equalising the regimes costs more (it drops a quarter of the rows to\nreach the smallest group) than the balance returns. Reverted. Also measured offline on the dumped predictions:\nSavitzky-Golay smoothing of the *residual* along the breath, which is far smoother than the pressure itself\n(0.116 bias against 0.365), still loses -- 0.379 -> 0.401 -- because TabFM's error is correlated inside a\nbreath (lag-1 0.906) and smoothing pays the bias without removing that.\n\nv25-v27 result: 0.37371 (feat_shuffle_method='none'), 0.37595 (norm_methods ['none','quantile']), 0.37353\n(['power']) against 0.37322. All neutral or worse; the constructor defaults stand.\n\nv28 result: 0.37614 against 0.37322 -- the second anchor did not pay either. Fitting the two measured points\n(baseline MAE 6.5 -> 0.401, baseline MAE 0.56 -> 0.373) gives a slope of 0.005: anchor accuracy is worth almost\nnothing, so the residual target's -0.021 was the parameterisation, not the baseline. Stop improving the anchor.\n\nv29 result: 0.37586 against 0.37322 -- dividing the residual by ((anchor + 3) / 10) ** 0.5 did not help\neither. Also ruled out: breath_id carries no session structure (adjacent ids share (R, C) at chance, 0.120\nagainst 0.118, and corr(previous breath's last pressure, this breath's first) = 0.001), and the initial\npressure barely varies (std 1.03), so the per-breath error is accumulated dynamics, not an unknown baseline.\n\nv30 result: 0.37316 against 0.37322 -- dead level, but it took eight extra columns to get there and width has\nbeen costing about 0.003 per eight columns, so the signature itself is worth roughly that much. Trade the block\nit duplicates for it.\n\nv31 result: 0.37848 -- the lag block is not redundant with the signature after all; both are needed or\nneither. Restored.\n\nNOTE on v28-v32: those five ran with norm_methods=['power'] still set from v27 and the default 65536 context --\nan edit that was meant to reset TABFM_KWARGS did not match. They are still valid against each other and against\nv27's 0.37353, which used the same constructor, and none of them won. One accident is useful: v32 reproduced\nv30 to the digit, which proves the step-38 fix below changes nothing that is scored.\n\nv33 result: 0.36248 against 0.36532 for the same 44 columns without the signature -- the best so far. The\nprediction held: eight columns that were exactly break-even at 65536 are worth -0.0028 at 256000, because what\nthey cost is sample complexity and the context is four times larger.\n\nv34 result: 0.36256 against 0.36248 -- sixteen principal scores are worth exactly what eight are. The linear\nsignature axis is closed: components 9-16 carry nothing, and since cumulative-u_in scores span the same\n32-dimensional space, no other linear projection of the trajectory will either. It also says the width penalty\nis not width: eight columns that carry nothing cost nothing at this context, so what the v20 prune removed was\nactively harmful content, not bulk.\n\nv35 result: 0.36728 against 0.36248 -- the long tail costs 0.0048, so the prune was removing harm, not bulk.\n\nv36 result: 0.36545 against 0.36248 -- cutting the five weakest u_in columns overshoots. The v33 set is the\noptimum: 61 columns cost 0.0048, 47 cost 0.0030, 52 is the floor.\n\nv37 result: 0.36216 against 0.36248 -- a tie that leans the right way, kept. Measured alongside it: every\ncolumn's correlation with the residual TabFM has to predict is under 0.11 (the largest is the running sum of\nthe reconstruction mismatch, 0.105), including the one the PID argument said should read the residual out\ndirectly -- the mismatch one step ahead, -0.056. The feature space is exhausted.\n\nv38 result: enable_nnls scored 0.36213 against 0.36216 -- neutral again, and it costs a prediction pass.\nDropped.\n\nv39 result: 0.35564 against 0.36216 -- the expansion is worth what the dump said it was.\n\nv40 result: 0.35159, exactly what the dump predicted.\n\nv41 result: 0.35045 against 0.35159 -- a second draw is worth -0.0011 now, and refitting the gains on its dump\ngives the same 1.29 / 1.06, so sixteen members shrink exactly as much as eight. The shrinkage is TabFM's own,\nnot member noise. Kept, then set aside for v42 to keep the cost of the next experiment down.\n\nv42 result: 0.37928 -- the dedicated level model is worse at the level than reading it off the whole-residual\nmodel (correlation 0.716 against 0.745), and refitting the gains on its dump only reaches 0.378. A target with\nno within-breath variation is harder, not easier: the row-level structure the level model then has to treat as\nnoise is exactly what the combined model uses to place the level. But its within-breath model was much better,\n0.777 against 0.731.\n\nv43 result: 0.35301, and refitting its gains only reaches 0.35399 -- worse than the single target's 0.35248 at\nthe same one draw. The hybrid has the better of both correlations (level 0.745, within 0.777) and still loses:\ncorrelation is an L2 measure and the dedicated within model's errors are the wrong shape for MAE. Reading the\nwithin part off the whole-residual model of that same run scores 0.35238, i.e. the second target adds nothing.\nReverted to one target and two draws (v41, 0.35045). Also measured: gradient boosting on the same breath-level\ncolumns predicts the per-breath residual at correlation 0.338 where TabFM reaches 0.745, so there is no helper\nfeature to add -- TabFM is well ahead of what the breath-level representation supports.\n\nv44 intent: the last untested constructor knob at the context that matters. TabFM z-clips numeric columns at\n4 sigma, which cuts the anchor columns (pressure-valued, mean 17.4, std 9.1, max 64.8) above ~54 -- the\nhigh-pressure breaths the error is worst on. It did not help at 65536 with the absolute target, where the\nanchor was one feature among many; now it is the baseline the whole prediction is built on.\n\nv43 detail: keep the winner of each. Targets are the whole residual and its within-breath part; the level comes\nfrom the first, the within part from the second. On the correlations that is a 8% smaller within-breath error.\n\nv42 detail: the level and the within-breath part of the correction are predicted about equally well (correlation\n0.745 and 0.731 with the truth) and a level estimate 10% better would be worth -0.018, so the level is where\nthe value is. Make it a target of its own: hand the judge a two-column y and let it fit one TabFM to the\nper-breath level and one to what varies inside the breath. The level target then carries no within-breath\nnoise, and its prediction is averaged over the breath before use.\n\nv41 detail: the shrinkage is a property of averaging eight members, so sixteen should shrink less at the\nsource. A second draw of the same rows in a different order gave only -0.001 back when the target was absolute\npressure and there was no gain correction; now that the correction is what is being averaged, and its\nexpansion is measured, the extra averaging should be worth more.\n\nv40 detail: the shrinkage is not uniform. Split the correction into its per-breath mean and what varies inside\nthe breath: out of fold the first wants 1.29 and the second only 1.06, which is another -0.0035 on top.\n\nv39 detail: TabFM under-corrects. Read off its own dumped output: the true residual regressed on the predicted\none has slope 1.196, and the MAE-optimal expansion is 1.165, stable across folds, regimes and step bands.\nMultiply the correction by it before adding the anchor back.\n\nv38-v39 detail: re-measure the two ensembling knobs at the context and target that matter. Both were rejected\nat 65536 with the absolute target and 60 columns, and v33 showed that a knob's sign can turn with context.\nFirst enable_nnls: non-negative member weights fitted out of fold rather than a flat average of the eight.\n\nv37 detail: the anchor is the baseline now, so its local shape should matter in a way it did not when it was\none feature among many (v11, before the residual target, made it worse). Add its value one step back and one\nahead, its rise since the breath started, and its local slope.\n\nv36 detail: keep going in that direction. Drop the five weakest u_in columns still standing -- lag3, lead2, d2,\nfd1 and the 5-step rolling mean -- for 47 columns.\n\nv35 detail: then find out which. Put back exactly the long tail the prune took out -- lags 4..20 and leads 3..5\n-- on top of the v33 winner.\n\nv34 detail: more of the signature. Sixteen principal scores instead of eight -- components 9-16 are under 1% of\nthe trajectory variance each, but that variance is the step-to-step jitter the pressure actually follows.\n\nv32 intent: two things. (a) the width penalty shrinks with context -- 60 columns against 44 costs 0.0064 at\n65536 and 0.0041 at 256000 -- so the eight principal scores, which were exactly break-even at 65536, should\npay for themselves at 256000. (b) the real test split has steps 38..79, outside the 0..37 window every feature\nis defined on; those rows were getting NaN across the whole row and a NaN prediction (harmless -- the grader\ndrops them, verified against mlebench's own reader and grader -- but half the submission). Hold the step-37\nvalues there instead. That cannot touch any score: no validation row and no training row is ever past step 37. so the lags, leads, differences and rolling mean of\nu_in are redundant with it. Drop all nine and keep the eight principal scores: 43 columns.\n\nv30 detail: a compact sequence representation instead of a longer one. 95% of the variance of a breath's u_in\ntrajectory is in four principal components and 99% in eight, so eight principal scores are a near-complete\ncoordinate for the breath. Give TabFM those as breath-level columns: it can then regress on (signature, step)\ndirectly, which is what the lookup approximates non-parametrically in 32 dimensions.\n\nv29 detail: if the win is the parameterisation, shape it further. The residual's size still grows with the\npressure, so divide it by ((anchor + 3) / 10) ** 0.5 -- a per-row scale the model can be handed back through,\nsince the anchor is known at prediction time -- and let TabFM predict a flatter quantity.\n\nv28 detail: the per-breath component of the error is 62% of its variance and a gradient boosting model on the\nbreath-level columns cannot predict it at all (R2 = -0.13 out of fold), so TabFM has already used everything\nthose columns say about the breath. The one source of genuinely new information is a second opinion on the\nbreath: an anchor matched on the cumulative u_in trajectory instead of u_in. It is worse alone (0.73 against\n0.58) but its error correlates only 0.62 with the first anchor's, so their disagreement is a signal about the\nlevel neither one can see alone.\n\nv25-v27 detail: the three remaining constructor knobs, re-measured now that the target is a residual and the\ntable is 44 columns wide: feat_shuffle_method='none', then norm_methods ['none','quantile'] and ['power'].\nScreened at 65536 against 0.37322.\n\nv24 detail: the error is 0.54-0.60 at R=50 and 0.19-0.38 at R=5, and the context is filled in proportion to how\ncommon each regime is (R=50,C=10 has 12264 breaths, R=20,C=10 has 5469). Give the nine regimes equal shares.\n\nv23 detail: the anchor is now the baseline the model corrects, so its own error matters directly. Fit, per\n(R, C) on the training breaths, the linear map from the reconstruction's 32-step u_in mismatch to its pressure\nerror, and fold it into the anchor: offline that is 0.581 -> 0.552 MAE. Screened at 65536 against 0.37322.\n\nv21 detail: 35 columns -- two lags, one lead, one difference, the breath summary and the anchor block.\n\nv20 detail: stop adding and start removing. Permutation importance on the residual target ranks nn_lle at\n1.01, nn_pk at 0.217 and then nothing above 0.06; every individual lag and lead of u_in is under 0.0025. Cut to\n45 columns -- the anchor block, the breath summary, three lags, two leads -- and keep the mismatch columns that\ndid rank (nn_urc_over_C 0.049, nn_ur_m1 0.029). Screened at 65536 against 0.37957.\n\nv19 detail: with the anchor as the baseline, the quantity TabFM must predict is driven by exactly the part of\nthe query's u_in trajectory the locally-linear reconstruction could not match. Hand it that mismatch: at this\nstep, one back, one ahead, its running sum, its total over the breath, and the two physical forms of the\ncorrection it implies -- mismatch x R (resistive) and its running sum / C (elastic). Offline, a purely linear\ncorrection of the anchor by that mismatch is worth -0.027 on the anchor itself; TabFM can use it nonlinearly.\nScreened at 65536 against 0.37957.\n\nv17 detail: the last structural idea. Retarget TabFM to pressure minus the locally-linear anchor instead of\npressure itself, so it spends its capacity on the correction rather than on re-deriving a quantity it is\nalready handed. The anchor is not in X_test when postprocess runs (the judge passes the raw frame there), so\npreprocess leaves it in the workspace keyed by the fold's first id and postprocess adds it back. tabfm_corr\nfalls by construction here -- it compares a correction against an absolute pressure. Screened at 65536 against\n~0.401.\n\nv16 detail: at max_num_rows=256000 the pool (8 x 256000 = 2.05M) already exceeds the 2.02M inspiratory training\nrows, so nothing is thinned and each member draws its 256000 from all of them -- about 65% of the rows are\ncovered by the eight members together. A second draw doubles that to sixteen members. The two draws must not be\nthe same index array: the judge builds every draw's estimator with the same random_state, so identical indices\ngive identical members. Handing it the same rows in a shuffled order changes which rows each member samples.\n\nv15 detail: the last two untried ensemble knobs, screened at 65536. n_feature_crosses and n_svd_features each\nadd sqrt(59) ~ 8 synthetic columns to the odd-indexed members only, so the ensemble mixes augmented and plain\nviews. No categorical column here is high-cardinality, so the SVD memory trap does not apply.\n\nv14 detail: the error grows with pressure -- 0.25 MAE in the lowest decile against 0.54 in the highest -- so the\nmodel spends its accuracy evenly in a space where the metric wants it evenly in pressure. Reshape the target\nwith (pressure + 2) ** 1.5, whose derivative is 2.3x larger at 35 cmH2O than at 5, and reshape the anchor\ncolumns the same way so the model still sees a near-linear relation to them. Measured at 65536 first.\n\nv13 detail: the one lever that has moved this task is how many rows each member holds in context: 65536 ->\n131072 was -0.0217 on the pre-lookup feature set. Go to the judge's cap, 256000, which is also the whole\ntraining pool (8 members x 256000 = 2.05M, and there are 2.02M inspiratory training rows), so every member\ndraws from all of them.\n\nv11 detail: TabFM sees the anchor trajectory only at the current step. The error is 64% a per-breath offset and\ncorrelates 0.80 with the anchor's own error, so split the anchor into level and shape -- its value at step 0\n(the breath's baseline), the rise since then, the local slope, and its value one step back and one/two ahead --\nand let TabFM correct level and shape separately.\n\nDiagnostics from the v10 dump (119757 scored validation rows): MAE 0.404, lag-1 autocorrelation of the error\n0.906, var(per-breath mean error)/var(error) = 0.637, so removing a per-breath constant would reach 0.250.\nError rises with the step (0.23 at step 0 to 0.47 by step 15) and with pressure (0.25 in the lowest decile,\n0.54 in the highest), and is worst at R=50 (0.54-0.60) against R=5,C=50 (0.19). Things measured offline and\nrejected: a fitted forward lung simulator (2.84 MAE on its own), local linear regression on the breath\ntrajectory (0.598 against 0.578 for the locally-linear reconstruction), row-level kNN over 400k reference rows\nwith a 12-column descriptor (0.879).\n\nv7 detail: reconstruct the query breath locally-linearly instead of by inverse-distance weights -- solve for the\nweights that best rebuild its u_in trajectory out of its 10 nearest neighbours and apply them to the\nneighbours' pressures. Offline that lookup is 0.578 against 0.641 for the inverse-distance one; give TabFM\nboth, plus the size of the largest weight as an extrapolation warning.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nL = 38                 # steps per breath used for every feature (max inspiratory step is 31)\nS = 32                 # steps of u_in that identify a breath for the neighbour lookup\nVAL_BREATHS = 1315     # 1315 * 38 = 49970 <= the judge's 50000 scored rows per fold\nN_FOLDS = 3\nNN_K = 3               # neighbours for the inverse-distance average\nNN_KL = 10             # neighbours for the locally-linear reconstruction\nNN_LAM = 0.1           # its ridge, relative to the mean Gram diagonal\nTGT_POW = 1.0          # target reshape (pressure + TGT_SHIFT) ** TGT_POW, 1.0 = off\nTGT_SHIFT = 2.0        # pressure bottoms out at -1.896\nRESIDUAL = 'nn_lle'    # predict pressure minus this anchor column instead of pressure itself ('' = off)\nRES_SCALE = 0.0        # ... divided by ((anchor + 3) / 10) ** this, to flatten an error that grows with\n                       # pressure (0.25 MAE in the lowest decile against 0.54 in the highest); 0 = off\n# TabFM shrinks its correction toward zero, the way any averaged predictor does: over the 119757 scored\n# validation rows the true residual regressed on the predicted one has slope 1.196 (std 0.99 against 0.61).\n# Undoing that is worth -0.0065. And it shrinks the two halves of the correction differently -- the part that\n# is constant over a breath needs 1.29, the part that varies inside it only 1.06 -- which is worth another\n# -0.0035. Both constants are stable across the three folds (1.28-1.30 and 1.06-1.07) and were fitted\n# leave-one-fold-out; a third component (a linear-in-step trend) and per-regime, per-step-band, per-confidence\n# and isotonic variants were all measured and add nothing.\nRES_GB = 1.29          # gain on the per-breath mean of the correction\nRES_GW = 1.063         # gain on its within-breath part\nRES_OFF = 0.017        # median offset left over\nNN_CORRECT = False     # correct the anchor by a per-(R,C) linear map from its u_in mismatch to its error\nNN_ALT = False\nPCA_K = 8              # principal scores of the breath's u_in trajectory, a compact signature of the breath        # a second anchor matched on the cumulative u_in trajectory: worse on its own (0.73 vs\n                       # 0.58) but its error correlates only 0.62 with the first one's\n\nTABFM_KWARGS = {'max_num_rows': 256000, 'outlier_threshold': 8.0}\n\nCFG = dict(lags=(1, 2, 3), leads=(1, 2), diffs=(1, 2), fdiffs=(1,), dd=False, rolls=(5,), emas=(),\n           expmax=True, expstd=False, expmean=True, cumsum=False, firsts=(0, 1),\n           breath=('n_insp', 'ins_max', 'ins_mean', 'ins_std', 'ins_area', 'diff_max', 'area_frac'),\n           cross=('R_over_C', 'area_over_C', 'u_in_x_R', 'ins_area_over_C'),\n           nn=('nn_p1', 'nn_pk', 'nn_ps', 'nn_lle', 'nn_d1', 'nn_dk', 'nn_du', 'nn_dp1',\n               'nn_ur', 'nn_ur_m1', 'nn_ur_c', 'nn_ur_tot',\n               'nn_lle_m1', 'nn_lle_p1', 'nn_rise', 'nn_slope') + tuple(f'pca{j}' for j in range(PCA_K)),\n           cross2=('nn_ur_xR', 'nn_urc_over_C'))\n\n\n# ---------------------------------------------------------------- breath geometry\ndef _geom(df):\n  \"\"\"(group code per row, n_groups, step index within breath).\"\"\"\n  codes, uniq = pd.factorize(df['breath_id'].to_numpy(), sort=False)\n  ts = df['time_step'].to_numpy()\n  order = np.lexsort((ts, codes))\n  n = len(df)\n  pos = np.arange(n)\n  gs = codes[order]\n  newg = np.empty(n, bool)\n  newg[0] = True\n  newg[1:] = gs[1:] != gs[:-1]\n  start = np.maximum.accumulate(np.where(newg, pos, 0))\n  step = np.empty(n, np.int64)\n  step[order] = pos - start\n  return codes, len(uniq), step\n\n\ndef folds(X_train, y_train):\n  codes, G, step = _geom(X_train)\n  perm = np.random.default_rng(12345).permutation(G)\n  idx = np.arange(len(X_train))\n  head = step < L\n  out = []\n  for f in range(N_FOLDS):\n    isval = np.zeros(G, bool)\n    isval[perm[f * VAL_BREATHS:(f + 1) * VAL_BREATHS]] = True\n    vmask = isval[codes]\n    out.append((idx[~vmask], idx[vmask & head]))\n  return out\n\n\n# ---------------------------------------------------------------- breath-level neighbour lookup\ndef _bmat(df, geom, y=None):\n  \"\"\"(u_in, pressure, (R,C) key) per breath over steps 0..S-1.\"\"\"\n  codes, G, step = geom\n  inb = step < S\n  U = np.zeros((G, S), np.float32)\n  U[codes[inb], step[inb]] = df['u_in'].to_numpy()[inb]\n  P = None\n  if y is not None:\n    P = np.zeros((G, S), np.float32)\n    P[codes[inb], step[inb]] = np.asarray(y, dtype=np.float32)[inb]\n  key = np.zeros(G, np.int64)\n  key[codes] = (df['R'].to_numpy() * 100 + df['C'].to_numpy())\n  return U, P, key\n\n\ndef _nn_lookup(Uq, gq, Ur, Pr, gr, k=NN_K, kl=NN_KL, lam=NN_LAM, self_pos=None, chunk=2048, eps=1e-3):\n  \"\"\"Nearest reference breaths by u_in trajectory inside the same (R, C) group.\n\n  Two reconstructions of the query breath's pressure: an inverse-distance average over the k nearest\n  (0.63 MAE on its own) and a locally-linear one -- the weights that best rebuild the query's u_in\n  trajectory out of its kl nearest neighbours, applied to their pressures (0.58).\"\"\"\n  Gq = len(Uq)\n  out = {n: np.zeros((Gq, S), np.float32) for n in ('p1', 'pk', 'ps', 'u1', 'lle', 'ur')}\n  for n in ('d1', 'dk', 'lw'):\n    out[n] = np.zeros(Gq, np.float32)\n  eye = np.eye(kl)[None]\n  for key in np.unique(gq):\n    qi = np.flatnonzero(gq == key)\n    ri = np.flatnonzero(gr == key)\n    if len(ri) < kl + 2:\n      continue\n    B = Ur[ri]\n    bn = (B * B).sum(1)\n    for s in range(0, len(qi), chunk):\n      q = qi[s:s + chunk]\n      A = Uq[q]\n      d = (A * A).sum(1)[:, None] + bn[None, :] - 2.0 * (A @ B.T)\n      if self_pos is not None:                        # self_pos indexes the reference array\n        sp = self_pos[q]\n        loc = np.clip(np.searchsorted(ri, sp), 0, len(ri) - 1)\n        hit = (sp >= 0) & (ri[loc] == sp)\n        d[np.flatnonzero(hit), loc[hit]] = np.inf\n      part = np.argpartition(d, kl, axis=1)[:, :kl]\n      dv = np.take_along_axis(d, part, 1)\n      order = np.argsort(dv, axis=1)\n      part = np.take_along_axis(part, order, 1)\n      dv = np.maximum(np.take_along_axis(dv, order, 1), 0.0)\n      nb = Pr[ri[part]]                                # (m, kl, S)\n      w = 1.0 / (np.sqrt(dv[:, :k] / S) + eps)\n      w /= w.sum(1, keepdims=True)\n      pk = (nb[:, :k] * w[:, :, None]).sum(1)\n      Z = (Ur[ri[part]] - A[:, None, :]).astype(np.float64)\n      Gm = Z @ Z.transpose(0, 2, 1)\n      tr = np.trace(Gm, axis1=1, axis2=2)[:, None, None] / kl\n      wl = np.linalg.solve(Gm + lam * np.maximum(tr, 1e-6) * eye, np.ones((len(q), kl, 1)))\n      wl /= wl.sum(1, keepdims=True)\n      wl = wl[:, :, 0]\n      out['lle'][q] = (nb * wl[:, :, None]).sum(1)\n      out['ur'][q] = -np.einsum('mk,mks->ms', wl, Z)   # u_in the reconstruction could not match: what drives\n                                                       # the pressure residual the model is asked to predict\n      out['lw'][q] = np.abs(wl).max(1)\n      out['p1'][q] = nb[:, 0, :]\n      out['pk'][q] = pk\n      out['ps'][q] = np.sqrt(np.maximum((nb[:, :k] ** 2 * w[:, :, None]).sum(1) - pk ** 2, 0.0))\n      out['u1'][q] = Ur[ri[part[:, 0]]]\n      out['d1'][q] = np.sqrt(dv[:, 0] / S)\n      out['dk'][q] = np.sqrt(dv[:, :k].mean(1) / S)\n  return out\n\n\ndef _correct(ntr, Ptr, ktr, nte, kte, rid=1e-6):\n  \"\"\"Per (R, C), the linear map from the reconstruction's u_in mismatch to its pressure error, fitted on the\n  training breaths and applied to both sides. Offline it takes the anchor from 0.581 to 0.552 MAE.\"\"\"\n  for key in np.unique(ktr):\n    m = ktr == key\n    Xt = np.concatenate([ntr['ur'][m], np.ones((int(m.sum()), 1), np.float32)], 1).astype(np.float64)\n    Gm = Xt.T @ Xt\n    Gm += rid * np.trace(Gm) / len(Gm) * np.eye(len(Gm))\n    W = np.linalg.solve(Gm, Xt.T @ (Ptr[m] - ntr['lle'][m]).astype(np.float64))\n    ntr['lle'][m] += (Xt @ W).astype(np.float32)\n    mq = kte == key\n    if mq.any():\n      Xq = np.concatenate([nte['ur'][mq], np.ones((int(mq.sum()), 1), np.float32)], 1).astype(np.float64)\n      nte['lle'][mq] += (Xq @ W).astype(np.float32)\n\n\ndef _pca_cols(Utr, Ute, k=PCA_K):\n  \"\"\"Top-k principal scores of the u_in trajectory, basis fitted on the training breaths. 95% of the variance\n  sits in four components, so this is a near-complete coordinate for the breath in eight columns -- TabFM can\n  regress pressure on (signature, step) rather than rediscovering the trajectory from lags.\"\"\"\n  mu = Utr.mean(0)\n  V = np.linalg.svd(Utr - mu, full_matrices=False)[2][:k]\n  pad = lambda A: np.pad(A, ((0, 0), (0, k - len(V))))      # a degenerate slice can span fewer than k directions\n  return pad((Utr - mu) @ V.T), pad((Ute - mu) @ V.T)\n\n\ndef _nn_cols(nn, U, alt=None):\n  \"\"\"(G, L) matrices from the lookup, padded past step S-1 with the last inspiratory value.\"\"\"\n  def pad(M):\n    return np.concatenate([M, np.repeat(M[:, -1:], L - S, axis=1)], axis=1).astype(np.float64)\n  one = np.ones((len(U), L))\n  A = pad(nn['lle'])\n  sh = lambda k: np.concatenate([np.repeat(A[:, :1], k, axis=1), A[:, :-k]], axis=1) if k > 0 else \\\n      np.concatenate([A[:, -k:], np.repeat(A[:, -1:], -k, axis=1)], axis=1)\n  return {'nn_p1': pad(nn['p1']), 'nn_pk': pad(nn['pk']), 'nn_ps': pad(nn['ps']),\n          'nn_lle': A, 'nn_dl': pad(nn['lle'] - nn['pk']),\n          'nn_du': pad(U - nn['u1']), 'nn_dp1': pad(nn['p1'] - nn['pk']),\n          'nn_d1': one * nn['d1'][:, None], 'nn_dk': one * nn['dk'][:, None],\n          'nn_lw': one * nn['lw'][:, None],\n          'nn_ur': pad(nn['ur']), 'nn_ur_m1': pad(np.concatenate([nn['ur'][:, :1], nn['ur'][:, :-1]], 1)),\n          'nn_ur_p1': pad(np.concatenate([nn['ur'][:, 1:], nn['ur'][:, -1:]], 1)),\n          'nn_ur_c': pad(np.cumsum(nn['ur'], axis=1)),\n          'nn_ur_tot': one * nn['ur'].sum(1)[:, None],\n          'nn_lle2': pad(alt['lle']) if alt else None,\n          'nn_dl2': pad(alt['lle'] - nn['lle']) if alt else None,\n          'nn_lle_m1': sh(1), 'nn_lle_p1': sh(-1), 'nn_lle_p2': sh(-2),\n          'nn_lle_0': one * A[:, :1], 'nn_rise': A - A[:, :1], 'nn_slope': A - sh(1)}\n\n\n# ---------------------------------------------------------------- features\ndef _lag(M, k, fill=0.0):\n  o = np.full_like(M, fill)\n  o[:, k:] = M[:, :-k]\n  return o\n\n\ndef _lead(M, k, fill=0.0):\n  o = np.full_like(M, fill)\n  o[:, :-k] = M[:, k:]\n  return o\n\n\ndef _roll(CS, w):\n  j = np.arange(L)\n  lo = np.maximum(j + 1 - w, 0)\n  return (CS[:, 1:] - CS[:, lo]) / (j + 1 - lo)\n\n\ndef _features(df, keep, geom=None, extra=None):\n  \"\"\"Feature matrix for the rows selected by `keep` (bool mask over df's rows).\"\"\"\n  cfg = CFG\n  codes, G, step = _geom(df) if geom is None else geom\n  inb = step < L\n\n  def mat(v, fill=0.0):\n    M = np.full((G, L), fill)\n    M[codes[inb], step[inb]] = np.asarray(v, dtype=np.float64)[inb]\n    return M\n\n  U = mat(df['u_in'].to_numpy())\n  TS = mat(df['time_step'].to_numpy())\n  OUT = mat(df['u_out'].to_numpy(), fill=1.0)\n  DT = np.zeros_like(TS)\n  DT[:, 1:] = np.diff(TS, axis=1)\n  IM = OUT < 0.5\n  nins = IM.sum(1, keepdims=True).astype(np.float64)\n  CSU = np.zeros((G, L + 1))\n  CSU[:, 1:] = np.cumsum(U, axis=1)\n  CSU2 = np.zeros((G, L + 1))\n  CSU2[:, 1:] = np.cumsum(U * U, axis=1)\n  area = np.cumsum(U * DT, axis=1)\n  cnt = np.arange(1, L + 1)[None, :].astype(np.float64)\n  emean = CSU[:, 1:] / cnt\n  ones = np.ones((G, L))\n\n  F = {'u_in': U, 'time_step': TS, 'step': np.tile(np.arange(L, dtype=np.float64), (G, 1)), 'area': area}\n  for k in cfg['lags']:\n    F[f'lag{k}'] = _lag(U, k)\n  for k in cfg['leads']:\n    F[f'lead{k}'] = _lead(U, k)\n  for k in cfg['diffs']:\n    F[f'd{k}'] = U - _lag(U, k)\n  for k in cfg['fdiffs']:\n    F[f'fd{k}'] = _lead(U, k) - U\n  if cfg['dd']:\n    F['dd1'] = (U - _lag(U, 1)) - (_lag(U, 1) - _lag(U, 2))\n  if cfg['cumsum']:\n    F['cumsum'] = CSU[:, 1:]\n  if cfg['expmean']:\n    F['expmean'] = emean\n  if cfg['expmax']:\n    F['expmax'] = np.maximum.accumulate(U, axis=1)\n  if cfg['expstd']:\n    F['expstd'] = np.sqrt(np.maximum(CSU2[:, 1:] / cnt - emean ** 2, 0.0))\n  for w in cfg['rolls']:\n    F[f'rm{w}'] = _roll(CSU, w)\n  for a in cfg['emas']:\n    E = np.zeros((G, L))\n    acc = np.zeros(G)\n    for j in range(L):\n      acc = a * U[:, j] + (1 - a) * acc\n      E[:, j] = acc\n    F[f'ema{a}'] = E\n  for j in cfg['firsts']:\n    F[f'u0_{j}'] = ones * U[:, j:j + 1]\n  if cfg['breath']:\n    Ui = np.where(IM, U, 0.0)\n    ins_mean = Ui.sum(1, keepdims=True) / nins\n    ins_max = np.where(IM, U, -np.inf).max(1, keepdims=True)\n    ins_std = np.sqrt(np.maximum((Ui * Ui).sum(1, keepdims=True) / nins - ins_mean ** 2, 0.0))\n    ins_area = (U * DT * IM).sum(1, keepdims=True)\n    B = {'n_insp': ones * nins, 'ins_max': ones * ins_max, 'ins_mean': ones * ins_mean,\n         'ins_std': ones * ins_std, 'ins_area': ones * ins_area, 'diff_max': ins_max - U,\n         'diff_mean': ins_mean - U, 'area_frac': area / np.maximum(ins_area, 1e-6)}\n    for k in cfg['breath']:\n      F[k] = B[k]\n  if extra:\n    for k in cfg['nn']:\n      F[k] = extra[k]\n\n  ci, si = codes[keep], np.minimum(step[keep], L - 1)   # the real test split carries steps 38..79, which are\n  cols = {}                                              # expiratory and unscored; hold the last in-window value\n  for nm, M in F.items():                                # there rather than emit NaN across half the submission\n    cols[nm] = M[ci, si].astype(np.float32)\n  R = df['R'].to_numpy().astype(np.float64)[keep]\n  C = df['C'].to_numpy().astype(np.float64)[keep]\n  cols['R'] = R.astype(np.float32)\n  cols['C'] = C.astype(np.float32)\n  X = {'RC': R * C, 'R_over_C': R / C, 'area_over_C': cols['area'] / C, 'u_in_x_R': cols['u_in'] * R,\n       'expmean_over_C': (cols['expmean'] / C) if cfg['expmean'] else None,\n       'ins_area_over_C': (cols['ins_area'] / C) if 'ins_area' in cols else None}\n  for k in cfg['cross']:\n    cols[k] = X[k].astype(np.float32)\n  if cfg.get('cross2') and 'nn_ur' in cols:      # the residual target is driven by the mismatch, times R / C\n    X2 = {'nn_ur_xR': cols['nn_ur'] * R, 'nn_urc_over_C': cols['nn_ur_c'] / C}\n    for k in cfg['cross2']:\n      cols[k] = X2[k].astype(np.float32)\n  return pd.DataFrame(cols)\n\n\ndef _scale(b):\n  return np.maximum((b + 3.0) / 10.0, 0.2) ** RES_SCALE if RES_SCALE else np.ones_like(b)\n\n\ndef _fwd(v):\n  return np.sign(v + TGT_SHIFT) * np.abs(v + TGT_SHIFT) ** TGT_POW if TGT_POW != 1.0 else v\n\n\ndef _inv(v):\n  return np.sign(v) * np.abs(v) ** (1.0 / TGT_POW) - TGT_SHIFT if TGT_POW != 1.0 else v\n\n\nBALANCE_RC = False     # equalise the nine (R, C) regimes in the context instead of taking them as they come\nN_DRAWS = 2            # passes over the same rows in a different order: distinct members, averaged by the judge\nTWO_TARGET = ''        # '' | 'rb+rw' | 'r+rw'. Two columns of y, so the judge fits one TabFM per column and\n                       # postprocess adds them up -- both predictions are TabFM's, but tabfm_corr reads nan,\n                       # because the audit needs postprocess to hand back the shape it was given and two\n                       # columns have to come back as one. 'rb+rw' (level and within as separate targets) was\n                       # measured and lost: a target held constant over a breath is *harder* to learn (level\n                       # correlation 0.716 against 0.745), though the same run's within-breath model was much\n                       # better (0.777 against 0.731). 'r+rw' keeps the winner of each: the level read off the\n                       # whole-residual model, the within part from the dedicated one.\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  n = len(X_train)\n  if not BALANCE_RC:\n    rng = np.random.default_rng(7)\n    return [np.arange(n)] + [rng.permutation(n) for _ in range(N_DRAWS - 1)]\n  k = (X_train['R'].to_numpy() * 100 + X_train['C'].to_numpy()).astype(np.int64)\n  u, cnt = np.unique(k, return_counts=True)\n  q = int(cnt.min())\n  rng = np.random.default_rng(11)\n  return [np.sort(np.concatenate([rng.choice(np.flatnonzero(k == gk), q, replace=False) for gk in u]))]\n\n\ndef preprocess(X_train, y_train, X_test):\n  gtr, gte = _geom(X_train), _geom(X_test)\n  Utr, Ptr, ktr = _bmat(X_train, gtr, y_train)\n  Ute, _, kte = _bmat(X_test, gte)\n  etr = ete = None\n  if CFG['nn']:\n    ntr = _nn_lookup(Utr, ktr, Utr, Ptr, ktr, self_pos=np.arange(len(Utr)))\n    nte = _nn_lookup(Ute, kte, Utr, Ptr, ktr)\n    if NN_CORRECT:\n      _correct(ntr, Ptr, ktr, nte, kte)\n    atr = ate = None\n    if NN_ALT:\n      Dtr, Dte = np.cumsum(Utr, 1) / 8.0, np.cumsum(Ute, 1) / 8.0\n      atr = _nn_lookup(Dtr, ktr, Dtr, Ptr, ktr, self_pos=np.arange(len(Dtr)))\n      ate = _nn_lookup(Dte, kte, Dtr, Ptr, ktr)\n    etr, ete = _nn_cols(ntr, Utr, atr), _nn_cols(nte, Ute, ate)\n    if PCA_K:\n      str_, ste = _pca_cols(Utr, Ute)\n      for j in range(PCA_K):\n        etr[f'pca{j}'] = np.ones((len(Utr), L)) * str_[:, j:j + 1]\n        ete[f'pca{j}'] = np.ones((len(Ute), L)) * ste[:, j:j + 1]\n  keep = (X_train['u_out'].to_numpy() == 0)\n  Xtr = _features(X_train, keep, gtr, etr)\n  ytr = y_train[keep].reset_index(drop=True)\n  Xte = _features(X_test, np.ones(len(X_test), bool), gte, ete)\n  if RESIDUAL:\n    b_tr, b_te = Xtr[RESIDUAL].to_numpy(np.float64), Xte[RESIDUAL].to_numpy(np.float64)\n    s_tr, s_te = _scale(b_tr), _scale(b_te)\n    r = (ytr.to_numpy() - b_tr) / s_tr\n    if TWO_TARGET:\n      ck = gtr[0][keep]\n      cnt = np.bincount(ck, minlength=gtr[1])\n      lvl = (np.bincount(ck, weights=r, minlength=gtr[1]) / np.maximum(cnt, 1))[ck]\n      a = lvl if TWO_TARGET == 'rb+rw' else r\n      ytr = pd.DataFrame({TWO_TARGET.split('+')[0]: a, 'rw': r - lvl}, index=ytr.index)\n    else:\n      ytr = pd.Series(r, index=ytr.index)\n    if 'id' in X_test.columns:\n      np.savez(f'.base_{int(X_test[\"id\"].iloc[0])}.npz', id=X_test['id'].to_numpy(), base=b_te, scale=s_te)\n  if TGT_POW != 1.0:\n    ytr = pd.Series(_fwd(ytr.to_numpy()), index=ytr.index)\n    for c in ('nn_p1', 'nn_pk', 'nn_lle'):\n      if c in Xtr.columns:\n        Xtr[c] = _fwd(Xtr[c].to_numpy()).astype(np.float32)\n        Xte[c] = _fwd(Xte[c].to_numpy()).astype(np.float32)\n    for a, b, c in (('nn_dp1', 'nn_p1', 'nn_pk'), ('nn_dl', 'nn_lle', 'nn_pk')):\n      if a in Xtr.columns:\n        Xtr[a] = Xtr[b] - Xtr[c]\n        Xte[a] = Xte[b] - Xte[c]\n  return Xtr, ytr, Xte\n\n\ndef engineer(X_train, y_train, X_test):\n  return X_train, X_test\n\n\nSG_WINDOW = 0          # Savitzky-Golay window over the inspiratory steps of a breath (0 = off)\nSG_ORDER = 2\nROUND_TO_GRID = True\nDUMP_PRED = True       # keep each fold's raw TabFM output beside the workspace, to read the error apart offline\n\n\ndef postprocess(pred, y_orig, X_test):\n  two = isinstance(pred, pd.DataFrame) and list(pred.columns)[-1:] == ['rw']\n  V = _inv(np.asarray(pred, dtype=np.float64))\n  v = (V[:, 0] + V[:, 1]) if two else V.ravel().copy()\n  raw = all(c in X_test.columns for c in ('breath_id', 'u_out'))   # judge.py check hands postprocess the\n  rraw = None\n  if RESIDUAL and raw:\n    z = np.load(f'.base_{int(X_test[\"id\"].iloc[0])}.npz')\n    assert np.array_equal(z['id'], X_test['id'].to_numpy()), 'stale anchor cache'\n    codes, G, step = _geom(X_test)\n    ins = X_test['u_out'].to_numpy() == 0\n    cnt = np.maximum(np.bincount(codes[ins], minlength=G), 1)\n    bmean = lambda a: (np.bincount(codes[ins], weights=a[ins], minlength=G) / cnt)[codes]\n    if two:\n      rb, rw = bmean(V[:, 0] * z['scale']), V[:, 1] * z['scale']\n      rw = rw - bmean(rw)\n      rraw = rb + rw\n    else:\n      rraw = v * z['scale']\n      rb = bmean(rraw)\n      rw = rraw - rb\n    v = RES_GB * rb + RES_GW * rw + RES_OFF + z['base']\n  if SG_WINDOW and raw:                                            # engineered frame; val/test hand it the raw one\n    from scipy.signal import savgol_filter\n    codes, G, step = _geom(X_test)\n    ins = (X_test['u_out'].to_numpy() == 0) & (step < S)\n    nins = np.bincount(codes[ins], minlength=G)\n    M = np.zeros((G, S))\n    M[codes[ins], step[ins]] = v[ins]\n    for n in np.unique(nins):\n      if n < SG_WINDOW:\n        continue\n      g = np.flatnonzero(nins == n)\n      M[g, :n] = savgol_filter(M[g, :n], SG_WINDOW, SG_ORDER, axis=1, mode='interp')\n    v[ins] = M[codes[ins], step[ins]]\n  if DUMP_PRED and raw:\n    np.savez(f'.diag_{int(X_test[\"id\"].iloc[0])}.npz', id=X_test['id'].to_numpy(), pred=v,\n             rraw=rraw if rraw is not None else v, V=V)\n  if ROUND_TO_GRID:\n    grid = np.unique(np.asarray(y_orig, dtype=np.float64))\n    j = np.clip(np.searchsorted(grid, v), 1, len(grid) - 1)\n    v = np.where(np.abs(v - grid[j - 1]) <= np.abs(v - grid[j]), grid[j - 1], grid[j])\n  return pd.Series(v, index=getattr(pred, 'index', None))\n","readme":"# ventilator-pressure-prediction — final pipeline\n\n## What it does\n\nThe task is row-wise but the signal is per-breath, so the pipeline folds each breath's history into\nits rows and then hands TabFM a *correction* rather than the pressure itself.\n\nFirst it builds an anchor by nearest-neighbour lookup at the breath level. A breath is identified by\nits 32-step `u_in` trajectory; within the same `(R, C)` group the ten nearest training breaths are\nfound and the weights that best rebuild the query breath's `u_in` trajectory out of theirs are solved\nfor (ridge-regularised, weights summing to one) and applied to their measured pressure traces. That\nlocally-linear reconstruction is ~0.56 MAE on its own — worse than TabFM alone — but it carries\ninformation from all 2.02M training rows that no 256k-row context can hold, and it is what the rest is\nbuilt on. An inverse-distance average over the three nearest breaths, the residual `u_in` the\nreconstruction could not match (with its lag, lead, running sum and the physical `×R` / `÷C` forms of\nthe correction it implies), the neighbour distances, and eight principal scores of the breath's `u_in`\ntrajectory come along as features. On the training side the lookup is leave-one-out, so the column\nmeans the same thing there as at prediction time.\n\nTabFM's target is then `pressure − anchor`, over a 44-column table of per-row `u_in` lags/leads/\ndifferences/rolling means, breath-level summaries, `(R, C)` crosses and the anchor block — 256000 rows\nof context per member, two draws of the training rows in different orders so the judge builds sixteen\nmembers instead of eight. Only inspiratory rows (`u_out == 0`) go into the context, since only those\nare scored. In postprocess the correction is put back: TabFM shrinks it, as any averaged predictor\ndoes, and the two halves shrink differently, so the per-breath mean of the correction is multiplied by\n1.29 and the within-breath part by 1.063, a constant offset added, the anchor added back, and the\nresult snapped to the 0.0703 grid the training pressures lie on. Validation folds are grouped by\nbreath (the first 38 steps of 1315 held-out breaths per fold) so lag/lead features see whole breath\nprefixes.\n\nScores: 0.35041 MAE (3-fold CV) / 0.35684 on the held-out test split.\n\n## build.sh\n\nThere is nothing to build. `final/build.sh` exists, prints one line and exits 0. The pipeline computes\nevery artefact it reads inside `preprocess`; the only files it touches on disk are\n`.base_<id>.npz` (the anchor handed from `preprocess` to `postprocess`, which does not see the\nengineered frame) and `.diag_<id>.npz` (a write-only dump of the raw TabFM output, kept for offline\nerror analysis). Both are written by the run itself, take a few tens of MB for the full test split,\nand are safe to delete.\n\n```\nbash final/build.sh && python final/run.py\n```\n\nRuntime is dominated by the TabFM passes: the scored final run took ~4040 s (~68 min) on one H100.\nAbout 35 GB of GPU memory is needed for a 256000-row context member; members run one at a time.\nThe preprocessing itself (the neighbour lookup over ~143k breaths, chunked at 2048 queries) is a few\nminutes of CPU and fits comfortably in RAM alongside the 5.4M-row training frame.\n\n## Things a reader would otherwise get wrong\n\n- **The lookup is not the model.** Its 0.56 MAE alone is worse than TabFM's absolute-pressure score,\n  and making it *more* accurate measurably hurt (v23, v28): what TabFM consumes is the mismatch\n  signal, not the anchor's accuracy. Do not \"improve the anchor\" expecting the pipeline to follow.\n- **The 1.29 / 1.063 gains are fitted, not tuned.** They come from regressing the true residual on\n  TabFM's predicted one over the dumped validation predictions, leave-one-fold-out, and were stable\n  across folds (1.28–1.30, 1.06–1.07). They are worth about -0.010 MAE together. If the context size,\n  the number of draws or the target changes, refit them from a `.diag_*.npz` dump — but note that\n  sixteen members shrink as much as eight, so the shrinkage is TabFM's own, not member noise.\n- **Everything is a function of steps 0..37 only.** The real test split carries steps 38..79, which are\n  expiratory and unscored; `_features` holds the step-37 value there rather than emitting NaN across\n  half the submission. No scored row is ever past step 37, so this cannot change any score.\n- **`tabfm_corr` is not a health check here.** It reads about -0.1 because TabFM predicts a residual\n  and the audit correlates its output against absolute pressure. The anchor alone is 0.56 MAE and the\n  pipeline is 0.35, so TabFM is doing most of the work.\n- `run.py` copies `final/pipeline.py` over the workspace `pipeline.py` and refuses to run if the two\n  differ. They are identical as shipped; if you edit one, reconcile by hand.\n","package":[],"derivations":[]},{"id":"smartphone-decimeter-2022","name":"smartphone-decimeter-2022","short_name":"smartphone-decimeter","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"GNSS Satellite Navigation","metric_label":"Haversine (m) ↓","lower_is_better":true,"plain":null,"plain_note":"Fails (IDs only in train.csv)","n_train":258546,"n_test":37087,"n_folds":3,"thresholds":{"gold":1.768,"silver":2.119,"bronze":3.068,"median":3.3280000000000003},"summary":"The competition asks for a phone's latitude/longitude each second; the raw WLS fix shipped in `device_gnss.csv` scores 4.11 (average of the 50th and 95th percentile horizontal error, metres). Most of the work here is a classical GNSS baseline, and TabFM corrects what is left of it.","score":4.32841,"gain_pct":null,"medal":"Valid Submission","category":null,"lines":871,"hooks_defined":["preprocess","engineer","postprocess","folds"],"hooks_active":["preprocess","engineer","postprocess","folds"],"tabfm_kwargs":{"max_num_rows":"16384","outlier_threshold":"8.0"},"helper_functions":["ecef2lla","lla2ecef","enu_basis","seg_ls","gnss_path","build_epochs","epochs","tridiag","robust_smooth","trip_frame","fuse","anchor_fuse","baseline","features","_norm_keys","_align","_time_smooth","_phone_mean","reduce_offset"],"helper_ranges":{"ecef2lla":[84,92],"lla2ecef":[95,100],"enu_basis":[103,108],"seg_ls":[111,124],"gnss_path":[128,134],"build_epochs":[137,319],"epochs":[322,337],"tridiag":[341,353],"robust_smooth":[356,368],"trip_frame":[371,429],"fuse":[432,471],"anchor_fuse":[474,517],"baseline":[520,606],"features":[625,686],"_norm_keys":[689,693],"_align":[696,711],"_time_smooth":[749,768],"_phone_mean":[771,805],"reduce_offset":[808,828]},"hook_helpers":{"preprocess":["ecef2lla","lla2ecef","enu_basis","seg_ls","gnss_path","build_epochs","epochs","tridiag","robust_smooth","trip_frame","fuse","anchor_fuse","baseline","_norm_keys","_align","_time_smooth"],"engineer":["features"],"postprocess":["ecef2lla","lla2ecef","enu_basis","seg_ls","gnss_path","build_epochs","epochs","tridiag","robust_smooth","trip_frame","fuse","anchor_fuse","baseline","_norm_keys","_align","_time_smooth","_phone_mean","reduce_offset"],"folds":[]},"hook_ranges":{"preprocess":[714,742],"engineer":[745,746],"postprocess":[831,865],"folds":[868,871]},"code":"# FINAL. Raw WLS fix 4.11048 -> engineered baseline 2.26722 -> +TabFM offset (3-fold, drive-grouped).\n# Baseline: per-epoch TDCP (time-differenced carrier phase, ~5 cm/step) + robust tridiagonal smoothing of the\n# WLS track; then, per drive, the phones' anchors are replaced by a robust cross-phone average, re-smoothed,\n# and the tracks averaged again weighted by each phone's carrier-phase quality. TabFM predicts what is left:\n# the 61 s-smoothed north/east residual, collapsed to one constant per drive. The carrier-phase acceptance is\n# deliberately loose: the smoother's IRLS handles a marginal step better than rejecting it does.\n\"\"\"GSDC-2022. Intent: replace the raw WLS fix with a TDCP-smoothed, cross-phone-fused baseline and let\nTabFM predict the remaining north/east offset of that baseline from GNSS quality features.\n\nLayout\n  cache/ep/<tripId>.parquet   per-epoch table distilled from data/{train,test}/<drive>/<phone>/device_gnss.csv\n                              (built on demand; ~1.2 s per trip).\n  preprocess  -> y becomes (dn, de) metres = ground truth minus baseline, in the local ENU frame.\n  postprocess -> baseline + TabFM's offset, converted back to lat/lon.\n  folds       -> grouped by drive, mirroring a test split made of whole unseen drives.\n\"\"\"\nimport os\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nMPD = 111320.0                      # metres per degree of latitude\nOM = 7.2921151467e-5                # earth rotation rate, rad/s\nC = 299792458.0\nWS = Path.cwd()\nDATA = WS / \"data\"\nCACHE = WS / \"cache\" / \"ep5\"   # bumped when build_epochs changes; the old dir keeps older snapshots working\n\nTABFM_KWARGS = {\"max_num_rows\": 16384, \"outlier_threshold\": 8.0}\n\n# ---- baseline hyper-parameters (tuned offline against train.csv, no test labels involved) ----\nBASE_VER = \"v24\"    # bump to invalidate cache/base\nSIG_M = 5.0        # metres: assumed WLS anchor noise (overridden per epoch by phdop)\nSIG_M_A = 3.0      # sigma_m = clip(SIG_M_A * phdop, 1.5, 30)\nSIG_D = 0.3        # metres: assumed noise of a one-second TDCP displacement\nSIG_D_STOP = 0.005  # ... and while the vehicle is standing still\nHUB_M = 0.7\nITERS = 6\nFUSE_POW = 0.5     # cross-phone average weights each phone by 1/sigma_m**FUSE_POW at that epoch\nFUSE_HUB = 1.5\nANC_HUB = 1.0      # metres: robustness scale of the cross-phone anchor average\nANC_PASS = 8       # IRLS passes of that average\nFUSE_C = 1.0       # position fusion weights a phone by 1/(td_rms + FUSE_C/td_n_sat)**FUSE_TDP:\nFUSE_TDP = 2.0     # after the anchors are shared, what separates the phones is their carrier-phase quality\nDEV_A = 0.15       # sigma_m is inflated by the local deviation of the fix from its dead-reckoned track\nTD_HUB = 0.6       # Huber scale of the per-epoch TDCP solve. Tight, because the CYCLE_SLIP and\n                   # TOW gates are off: admitting the marginal phase only pays if the loss rejects it\nANC_SP_A = 0.1     # sigma_m is inflated by the cross-phone disagreement of the anchors at that epoch\nANC_KCAP = 4.0     # sigma_m is divided by sqrt(effective phones), capped here\nSIG_M2 = (2.0, 4.5)   # sigma_m clip for the second (post anchor-fusion) smoothing pass\nSIG_D2 = 0.28      # displacement sigma in that pass\nHUB_M2 = 0.5       # anchor Huber scale in that pass\nOUTLIER = 3.5     # metres from the dead-reckoned track before an anchor is dropped outright\nOFF_CAP = 6.0      # metres: hard cap on the applied offset (no effect on CV, a guard for the test split)\nSHRINK = 1.1       # how much of TabFM's offset to apply; >1 undoes part of the regression to the\n                   # mean in a shrunk estimate. Nested-selection checked: every held-out fold picks 1.1\nSMOOTH_S = 1e9     # seconds: centred time window the offset is averaged over (1e9 = per-trip constant)\nTWO_TARGETS = False# predict the residual at both 61 s and trip scale and average the two\nTGT_CLIP = 15.0    # metres: the residual is clipped before smoothing; the metric is quantile-based,\n                   # so the far tail of the label is not worth model capacity\nTARGET_S = 61.0    # seconds: window the training target is averaged over (the offset itself is still\n                   # collapsed to a per-trip constant by SMOOTH_S; a 61 s target trains better than a trip mean)\nPHONE_MEAN = True  # average the offset across the phones of a drive before applying it\nTRIP_FEATS = False # trip-level descriptors only; measured worse, kept off\nTRIP_STD = True    # per-trip standard deviations alongside the means\nN_DRAWS = 1        # independent context draws averaged by the judge\nNDRAW_ROWS = 130000   # rows per draw (unused: N_DRAWS = 1)\n\nGNSS_COLS = ['utcTimeMillis', 'Svid', 'ConstellationType', 'SignalType', 'State', 'Cn0DbHz',\n             'PseudorangeRateMetersPerSecond', 'PseudorangeRateUncertaintyMetersPerSecond',\n             'MultipathIndicator', 'RawPseudorangeMeters', 'RawPseudorangeUncertaintyMeters',\n             'SvPositionXEcefMeters', 'SvPositionYEcefMeters', 'SvPositionZEcefMeters',\n             'SvElevationDegrees', 'SvAzimuthDegrees',\n             'SvVelocityXEcefMetersPerSecond', 'SvVelocityYEcefMetersPerSecond', 'SvVelocityZEcefMetersPerSecond',\n             'SvClockBiasMeters', 'SvClockDriftMetersPerSecond', 'IsrbMeters',\n             'IonosphericDelayMeters', 'TroposphericDelayMeters',\n             'WlsPositionXEcefMeters', 'WlsPositionYEcefMeters', 'WlsPositionZEcefMeters',\n             'AccumulatedDeltaRangeState', 'AccumulatedDeltaRangeMeters',\n             'AccumulatedDeltaRangeUncertaintyMeters']\n\n\n# ---------------------------------------------------------------- geodesy\ndef ecef2lla(x, y, z):\n    a, b = 6378137.0, 6356752.314245\n    e2, e2_ = 6.69437999013e-3, 6.73949674226e-3\n    r = np.sqrt(x * x + y * y)\n    t = np.arctan2(z * (a / b), r)\n    lat = np.arctan2(z + e2_ * b * np.sin(t) ** 3, r - e2 * a * np.cos(t) ** 3)\n    lon = np.arctan2(y, x)\n    n = a / np.sqrt(1 - e2 * np.sin(lat) ** 2)\n    return np.degrees(lat), np.degrees(lon), r / np.cos(lat) - n\n\n\ndef lla2ecef(lat, lon, alt):\n    a, e2 = 6378137.0, 6.69437999013e-3\n    lat, lon = np.radians(lat), np.radians(lon)\n    n = a / np.sqrt(1 - e2 * np.sin(lat) ** 2)\n    return ((n + alt) * np.cos(lat) * np.cos(lon), (n + alt) * np.cos(lat) * np.sin(lon),\n            (n * (1 - e2) + alt) * np.sin(lat))\n\n\ndef enu_basis(lat, lon):\n    la, lo = np.radians(lat), np.radians(lon)\n    sl, cl, sb, cb = np.sin(lo), np.cos(lo), np.sin(la), np.cos(la)\n    return (np.stack([-sl, cl, np.zeros_like(sl)], 1),\n            np.stack([-sb * cl, -sb * sl, cb], 1),\n            np.stack([cb * cl, cb * sl, sb], 1))\n\n\ndef seg_ls(codes, n_seg, H, y, w):\n    \"\"\"Per-segment weighted least squares. H (N,k), y (N,), w (N,) -> (sol, residual, normal matrix).\"\"\"\n    k = H.shape[1]\n    ATA = np.zeros((n_seg, k, k))\n    ATb = np.zeros((n_seg, k))\n    for i in range(k):\n        ATb[:, i] = np.bincount(codes, weights=w * H[:, i] * y, minlength=n_seg)\n        for j in range(i, k):\n            v = np.bincount(codes, weights=w * H[:, i] * H[:, j], minlength=n_seg)\n            ATA[:, i, j] = v\n            ATA[:, j, i] = v\n    ATAr = ATA + np.eye(k)[None] * 1e-3\n    sol = np.linalg.solve(ATAr, ATb[:, :, None])[:, :, 0]\n    return sol, y - np.einsum('nk,nk->n', H, sol[codes]), ATAr\n\n\n# ---------------------------------------------------------------- per-trip GNSS distillation\ndef gnss_path(trip_id):\n    drive, phone = trip_id.rsplit(\"-\", 1)\n    for split in (\"train\", \"test\"):\n        p = DATA / split / drive / phone / \"device_gnss.csv\"\n        if p.exists():\n            return p\n    return None\n\n\ndef build_epochs(trip_id):\n    path = gnss_path(trip_id)\n    if path is None:\n        return None\n    d = pd.read_csv(path, usecols=GNSS_COLS, low_memory=False)\n    for c in GNSS_COLS:\n        if c != 'SignalType' and d[c].dtype == object:\n            d[c] = pd.to_numeric(d[c], errors='coerce')\n    d = d.dropna(subset=['utcTimeMillis'])\n    d['utcTimeMillis'] = d.utcTimeMillis.astype(np.int64)\n    d = d.sort_values(['utcTimeMillis', 'ConstellationType', 'SignalType', 'Svid'], kind='stable').reset_index(drop=True)\n    t, codes = np.unique(d.utcTimeMillis.to_numpy(), return_inverse=True)\n    E, N = len(t), len(d)\n    cnt = np.bincount(codes, minlength=E).astype(float)\n\n    W0 = np.stack([np.bincount(codes, weights=np.nan_to_num(d[c].to_numpy()), minlength=E) / cnt\n                   for c in ('WlsPositionXEcefMeters', 'WlsPositionYEcefMeters', 'WlsPositionZEcefMeters')], 1)\n    prm = d.RawPseudorangeMeters.to_numpy()\n    sv0 = np.stack([d.SvPositionXEcefMeters.to_numpy(), d.SvPositionYEcefMeters.to_numpy(),\n                    d.SvPositionZEcefMeters.to_numpy()], 1)\n    svv0 = np.stack([d.SvVelocityXEcefMetersPerSecond.to_numpy(), d.SvVelocityYEcefMetersPerSecond.to_numpy(),\n                     d.SvVelocityZEcefMetersPerSecond.to_numpy()], 1)\n    corr = (prm + d.SvClockBiasMeters.to_numpy() - d.IsrbMeters.to_numpy()\n            - d.IonosphericDelayMeters.to_numpy() - d.TroposphericDelayMeters.to_numpy())\n    st = np.nan_to_num(d.State.to_numpy(), nan=0).astype(np.int64)\n    valid = (((st & 1) > 0) & np.isfinite(prm) & np.isfinite(corr)      # TOW_DECODED is not required: the\n             & np.isfinite(sv0).all(1) & (prm > 1e6) & (prm < 1e8))      # range bound and the IRLS suffice\n    th = OM * np.nan_to_num(prm) / C\n    ct_, st_ = np.cos(th), np.sin(th)                                     # Sagnac rotation into the reception frame\n    sv = np.nan_to_num(np.stack([ct_ * sv0[:, 0] + st_ * sv0[:, 1], -st_ * sv0[:, 0] + ct_ * sv0[:, 1], sv0[:, 2]], 1))\n    svv = np.nan_to_num(np.stack([ct_ * svv0[:, 0] + st_ * svv0[:, 1], -st_ * svv0[:, 0] + ct_ * svv0[:, 1], svv0[:, 2]], 1))\n    corr = np.nan_to_num(corr)\n    elev = np.nan_to_num(d.SvElevationDegrees.to_numpy())\n    azim = np.nan_to_num(d.SvAzimuthDegrees.to_numpy())\n    cn0 = np.nan_to_num(d.Cn0DbHz.to_numpy())\n    sig = np.clip(np.nan_to_num(d.RawPseudorangeUncertaintyMeters.to_numpy(), nan=1e3), 0.5, None)\n    sigd = np.clip(np.nan_to_num(d.PseudorangeRateUncertaintyMetersPerSecond.to_numpy(), nan=1e3), 0.02, None)\n    con = np.nan_to_num(d.ConstellationType.to_numpy(), nan=0).astype(np.int64)\n\n    lat_r, lon_r, alt_r = ecef2lla(W0[:, 0], W0[:, 1], W0[:, 2])\n    fin = np.isfinite(lat_r) & np.isfinite(lon_r)\n    if not fin.any():\n        return None\n    lat0, lon0 = float(np.nanmedian(lat_r[fin])), float(np.nanmedian(lon_r[fin]))\n    latc = np.where(fin, lat_r, lat0)\n    lonc = np.where(fin, lon_r, lon0)\n    altc = np.nan_to_num(alt_r, nan=float(np.nanmedian(alt_r[np.isfinite(alt_r)])) if np.isfinite(alt_r).any() else 0.0)\n    Px, Py, Pz = lla2ecef(latc, lonc, altc)\n    P = np.stack([Px, Py, Pz], 1)\n    eh, nh, uh = enu_basis(latc, lonc)\n    dv = sv - P[codes]\n    rng = np.linalg.norm(dv, axis=1)\n    los = dv / np.maximum(rng, 1)[:, None]\n    le = (los * eh[codes]).sum(1)\n    ln = (los * nh[codes]).sum(1)\n    lu = (los * uh[codes]).sum(1)\n\n    yres = np.where(valid, corr - rng, 0.0)\n    w_pr = np.where(valid, 1.0 / sig ** 2, 0.0)\n    Hp = np.stack([-le, -ln, -lu, np.ones(N)], 1)\n    wp = w_pr.copy()\n    for _ in range(3):\n        solp, resp, ATAp = seg_ls(codes, E, Hp, yres, wp)\n        s = np.sqrt(np.maximum(np.bincount(codes, weights=wp * resp ** 2, minlength=E)\n                               / np.maximum(np.bincount(codes, weights=wp, minlength=E), 1e-9), 0))\n        a = np.abs(resp) / np.maximum(s, 3.0)[codes]\n        wp = w_pr * np.where(a <= 2.5, 1.0, 2.5 / np.maximum(a, 1e-9))\n\n    ydop = np.where(valid, np.nan_to_num(d.PseudorangeRateMetersPerSecond.to_numpy())\n                    + np.nan_to_num(d.SvClockDriftMetersPerSecond.to_numpy()) - (los * svv).sum(1), 0.0)\n    w0 = np.where(valid, 1.0 / sigd ** 2, 0.0)\n    wd = w0\n    for _ in range(4):\n        sold, resd, ATAd = seg_ls(codes, E, Hp, ydop, wd)\n        s = np.sqrt(np.maximum(np.bincount(codes, weights=wd * resd ** 2, minlength=E)\n                               / np.maximum(np.bincount(codes, weights=wd, minlength=E), 1e-9), 0))\n        a = np.abs(resd) / np.maximum(s, 0.3)[codes]\n        wd = w0 * np.where(a <= 2.5, 1.0, 2.5 / np.maximum(a, 1e-9))\n\n    # time-differenced carrier phase: p(t) - p(t-1), linearised about the reference at t-1\n    adr = d.AccumulatedDeltaRangeMeters.to_numpy()\n    adrs = np.nan_to_num(d.AccumulatedDeltaRangeState.to_numpy(), nan=0).astype(np.int64)\n    adru = np.clip(np.nan_to_num(d.AccumulatedDeltaRangeUncertaintyMeters.to_numpy(), nan=1e3), 0.02, None)\n    adr_ok = ((adrs & 1) > 0) & ((adrs & 2) == 0) & np.isfinite(adr) & valid   # CYCLE_SLIP is left in:\n    # the flag is over-conservative on these receivers and the IRLS below rejects the steps that really slipped\n    key = (con * 1000 + np.nan_to_num(d.Svid.to_numpy(), nan=0).astype(np.int64)) * 1000 \\\n        + pd.factorize(d.SignalType.to_numpy())[0]\n    svclk = np.nan_to_num(d.SvClockBiasMeters.to_numpy())\n    cur = pd.DataFrame({'k': key, 'e': codes, 'adr': adr, 'ok': adr_ok, 'u': adru,\n                        'svx': sv[:, 0], 'svy': sv[:, 1], 'svz': sv[:, 2], 'svclk': svclk})\n    prev = cur.copy()\n    prev['e'] = prev['e'] + 1\n    mg = cur.merge(prev, on=['k', 'e'], suffixes=('', '_p'))\n    if len(mg) == 0:\n        solt = np.zeros((E, 4))\n        ntd = np.zeros(E)\n        td_rms = np.zeros(E)\n        ATAt = np.tile(np.eye(4), (E, 1, 1))\n    else:\n        ec = mg.e.to_numpy()\n        good = mg.ok.to_numpy() & mg.ok_p.to_numpy() & (np.abs((t[ec] - t[ec - 1]) / 1000.0 - 1.0) < 0.3)\n        Pref = P[ec - 1]\n        svc = np.stack([mg.svx.to_numpy(), mg.svy.to_numpy(), mg.svz.to_numpy()], 1)\n        svp = np.stack([mg.svx_p.to_numpy(), mg.svy_p.to_numpy(), mg.svz_p.to_numpy()], 1)\n        rc = np.linalg.norm(svc - Pref, axis=1)\n        rp = np.linalg.norm(svp - Pref, axis=1)\n        lc = (svc - Pref) / np.maximum(rc, 1)[:, None]\n        Ht = np.stack([-(lc * eh[ec - 1]).sum(1), -(lc * nh[ec - 1]).sum(1), -(lc * uh[ec - 1]).sum(1),\n                       np.ones(len(mg))], 1)\n        ytd = np.where(good, mg.adr.to_numpy() - mg.adr_p.to_numpy()\n                       + mg.svclk.to_numpy() - mg.svclk_p.to_numpy() - (rc - rp), 0.0)\n        w0t = np.where(good, 1.0 / mg.u.to_numpy() ** 2, 0.0)\n        wt_ = w0t\n        for _ in range(4):\n            solt, rest, ATAt = seg_ls(ec, E, Ht, ytd, wt_)\n            s = np.sqrt(np.maximum(np.bincount(ec, weights=wt_ * rest ** 2, minlength=E)\n                                   / np.maximum(np.bincount(ec, weights=wt_, minlength=E), 1e-9), 0))\n            a = np.abs(rest) / np.maximum(s, 0.05)[ec]\n            wt_ = w0t * np.where(a <= TD_HUB, 1.0, TD_HUB / np.maximum(a, 1e-9))\n        ntd = np.bincount(ec, weights=good.astype(float), minlength=E)\n        td_rms = np.sqrt(np.maximum(np.bincount(ec, weights=wt_ * rest ** 2, minlength=E)\n                                    / np.maximum(np.bincount(ec, weights=wt_, minlength=E), 1e-9), 0))\n\n    def bc(x, w=None):\n        return np.bincount(codes, weights=(x if w is None else x * w), minlength=E)\n\n    vm = valid.astype(float)\n    nval = bc(vm)\n\n    def mean(x):\n        return bc(x * vm) / np.maximum(nval, 1)\n\n    Cd = np.linalg.inv(ATAd)\n    Cp = np.linalg.inv(ATAp)\n    Ct = np.linalg.inv(ATAt)\n    out = pd.DataFrame({\n        'tripId': trip_id, 'UnixTimeMillis': t,\n        'lat': lat_r, 'lon': lon_r, 'alt': alt_r,\n        'gn_e': solp[:, 0], 'gn_n': solp[:, 1], 'gn_u': solp[:, 2], 'gn_clk': solp[:, 3],\n        'vel_e': sold[:, 0], 'vel_n': sold[:, 1], 'vel_u': sold[:, 2], 'clkdrift': sold[:, 3],\n        'td_e': solt[:, 0], 'td_n': solt[:, 1], 'td_u': solt[:, 2],\n        'td_n_sat': ntd, 'td_rms': td_rms,\n        'n_sat': cnt, 'n_val': nval,\n        'cn0_mean': mean(cn0), 'elev_mean': mean(elev), 'pru_mean': mean(sig),\n        'mp_mean': mean(np.nan_to_num(d.MultipathIndicator.to_numpy().astype(float))),\n        'prru_mean': mean(sigd),\n        'iono_mean': mean(np.nan_to_num(d.IonosphericDelayMeters.to_numpy())),\n        'tropo_mean': mean(np.nan_to_num(d.TroposphericDelayMeters.to_numpy())),\n        'res_rms': np.sqrt(np.maximum(bc(resp ** 2, vm) / np.maximum(nval, 1), 0)),\n        'res_wrms': np.sqrt(np.maximum(bc(resp ** 2, wp) / np.maximum(bc(wp), 1e-9), 0)),\n        'resd_wrms': np.sqrt(np.maximum(bc(resd ** 2, wd) / np.maximum(bc(wd), 1e-9), 0)),\n        'w_drop': bc((wp < 0.5 * w_pr).astype(float) * vm),\n        'dhdop': np.sqrt(np.clip(Cd[:, 0, 0] + Cd[:, 1, 1], 0, None)),\n        'phdop': np.sqrt(np.clip(Cp[:, 0, 0] + Cp[:, 1, 1], 0, None)),\n        'pvdop': np.sqrt(np.clip(Cp[:, 2, 2], 0, None)),\n        'tdhdop': np.sqrt(np.clip(Ct[:, 0, 0] + Ct[:, 1, 1], 0, None)),\n    })\n    _, _, ATAg = seg_ls(codes, E, Hp, np.zeros(N), vm)\n    Cg = np.linalg.inv(ATAg)\n    out['hdop'] = np.sqrt(np.clip(Cg[:, 0, 0] + Cg[:, 1, 1], 0, None))\n    out['vdop'] = np.sqrt(np.clip(Cg[:, 2, 2], 0, None))\n    for c, name in [(1, 'gps'), (3, 'glo'), (4, 'qzs'), (5, 'bds'), (6, 'gal')]:\n        out['n_' + name] = bc(((con == c) & valid).astype(float))\n    out['cn0_hi'] = bc(((cn0 > 35) & valid).astype(float))\n    out['elev_lo'] = bc(((elev < 20) & valid).astype(float))\n    out['cn0_std'] = np.sqrt(np.maximum(mean(cn0 ** 2) - mean(cn0) ** 2, 0))\n    # residual structure: mean robust-weighted pseudorange residual by azimuth quadrant and elevation band\n    az = np.radians(azim)\n    hi = elev >= 30\n    for qi, (name, m) in enumerate([('n', (np.cos(az) > 0.7071)), ('e', (np.sin(az) > 0.7071)),\n                                    ('s', (np.cos(az) < -0.7071)), ('w', (np.sin(az) < -0.7071))]):\n        for bnd, bm in [('hi', hi), ('lo', ~hi)]:\n            msk = (m & bm & valid).astype(float)\n            out[f'r_{name}{bnd}'] = bc(resp * msk) / np.maximum(bc(msk), 1)\n            out[f'c_{name}{bnd}'] = bc(msk)\n    out['los_e'] = mean(le)\n    out['los_n'] = mean(ln)\n    out['los_u'] = mean(lu)\n    for c in out.columns:\n        if out[c].dtype == np.float64:\n            out[c] = out[c].astype(np.float32)\n    out['UnixTimeMillis'] = t\n    return out\n\n\ndef epochs(trip_id):\n    CACHE.mkdir(parents=True, exist_ok=True)\n    f = CACHE / (trip_id + \".parquet\")\n    if f.exists():\n        try:\n            return pd.read_parquet(f)\n        except Exception:\n            pass\n    out = build_epochs(trip_id)\n    if out is None:\n        return None\n    try:\n        out.to_parquet(f)\n    except Exception:\n        pass\n    return out\n\n\n# ---------------------------------------------------------------- trajectory smoothing / fusion\ndef tridiag(a, b, m, d):\n    from scipy.linalg import solveh_banded\n    n = len(m)\n    main = a.astype(float).copy()\n    rhs = a * m\n    main[1:] += b[1:]\n    main[:-1] += b[1:]\n    rhs[1:] += b[1:] * d[1:]\n    rhs[:-1] -= b[1:] * d[1:]\n    ab = np.zeros((2, n))\n    ab[0, 1:] = -b[1:]\n    ab[1, :] = main\n    return solveh_banded(ab, rhs, lower=False, check_finite=False)\n\n\ndef robust_smooth(m_e, m_n, d_e, d_n, a0, b0, hub_m=HUB_M, iters=ITERS, fl_m=1.0):\n    a = a0.copy()\n    pe = pn = None\n    for it in range(iters):\n        pe = tridiag(a, b0, m_e, d_e)\n        pn = tridiag(a, b0, m_n, d_n)\n        if it == iters - 1 or hub_m is None:\n            break\n        rm = np.hypot(pe - m_e, pn - m_n)\n        sel = a0 > 1e-6\n        sm = max(float(np.median(rm[sel])) * 1.4826, fl_m) if sel.any() else fl_m\n        a = a0 * np.where(rm <= hub_m * sm, 1.0, hub_m * sm / np.maximum(rm, 1e-9))\n    return pe, pn\n\n\ndef trip_frame(g, sig_m=SIG_M, sig_d=SIG_D, outlier=OUTLIER, tdmin=4, dopthr=20.0):\n    t = g.UnixTimeMillis.to_numpy().astype(np.int64)\n    lat = g.lat.to_numpy().astype(float)\n    lon = g.lon.to_numpy().astype(float)\n    fin = np.isfinite(lat) & np.isfinite(lon) & (np.abs(lat) <= 89.0) & (np.abs(lon) <= 180.0)\n    if not fin.any():\n        lat = np.full(len(t), 37.4)\n        lon = np.full(len(t), -122.0)\n        fin = np.ones(len(t), bool)\n    lat0 = float(np.nanmedian(lat[fin]))\n    lon0 = float(np.nanmedian(lon[fin]))\n    cs = float(np.cos(np.radians(lat0)))\n    m_n = np.where(fin, (lat - lat0) * MPD, 0
