  --surface: #ffffff;
  --subtle: #f0f4f9;
  --subtle-2: #e2e8f0;
  --border: #d5dfec;
  --hairline: #e5ecf5;
  --text: #0b1220;
  --text-2: #334155;
  --muted: #5f6b7c;
  --accent: #1a73e8;
  --accent-soft: hsla(214 89% 51% / 0.11);
  --pos: #0d7a52;
  --pos-soft: hsla(158 81% 26% / 0.12);
  --neg: hsl(352 70% 42%);
  --neg-soft: hsla(352 76% 48% / 0.11);
  --medal: #b45309;
  --medal-soft: hsla(42 94% 48% / 0.16);
  --gold: #b45309;
  --gold-soft: hsla(42 94% 48% / 0.18);
  --silver: #475569;
  --silver-soft: hsla(215 20% 60% / 0.18);
  --bronze: #9a3412;
  --bronze-soft: hsla(22 90% 52% / 0.16);
  --shadow-sm: 0 1px 2px hsla(220 30% 10% / 0.04);
  --shadow-md: 0 8px 24px hsla(220 30% 10% / 0.08);
  --code-bg: #f3f6fb;
  --code-bar: #eaf0f8;
  --code-sect: #e2eaf5;
  --code-border: #d5dfec;
  --code-text: #0f172a;
  --code-ln: #64748b;
  --t-kw: #1a73e8;
  --t-fn: #00838f;
  --t-hook: #4f46e5;
  --t-str: #0d7a52;
  --t-num: #0284c7;
  --t-com: #64748b;
  --t-bi: #0369a1;
  --t-const: #4338ca;
  --font-sans: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Google Sans Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070b14;
  --surface: #0f1624;
  --subtle: #162033;
  --subtle-2: #1e2b42;
  --border: #223049;
  --hairline: #1a253a;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --muted: #8b9bb4;
  --accent: #589df6;
  --accent-soft: hsla(213 90% 65% / 0.15);
  --pos: #34d399;
  --pos-soft: hsla(156 68% 46% / 0.15);
  --neg: hsl(352 82% 68%);
  --neg-soft: hsla(352 78% 54% / 0.15);
  --medal: #fbbf24;
  --medal-soft: hsla(44 92% 54% / 0.15);
  --gold: #fbbf24;
  --gold-soft: hsla(44 92% 54% / 0.16);
  --silver: #cbd5e1;
  --silver-soft: hsla(215 20% 70% / 0.16);
  --bronze: #fb923c;
  --bronze-soft: hsla(24 94% 60% / 0.16);
  --shadow-sm: 0 1px 2px hsla(0 0% 0% / 0.35);
  --shadow-md: 0 10px 28px hsla(0 0% 0% / 0.5);
  --code-bg: #050811;
  --code-bar: #0b111e;
  --code-sect: #111a2e;
  --code-border: #1e2b42;
  --code-text: #e2e8f0;
  --code-ln: #64748b;
  --t-kw: #589df6;
  --t-fn: #22d3ee;
  --t-hook: #818cf8;
  --t-str: #34d399;
  --t-num: #38bdf8;
  --t-com: #64748b;
  --t-bi: #67e8f9;
  --t-const: #a5b4fc;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }


.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1600px;
  height: 100%;
  margin: 0 auto;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 24px;
  height: 24px;
  flex: none;
  display: block;
}
.brand-mark .logo-backbone { fill: #1a73e8; }
.brand-mark .logo-cell-mid { fill: #1a73e8; fill-opacity: 0.36; }
.brand-mark .logo-spark { fill: #00b4d8; }
[data-theme="dark"] .brand-mark .logo-backbone { fill: #589df6; }
[data-theme="dark"] .brand-mark .logo-cell-mid { fill: #589df6; fill-opacity: 0.38; }
[data-theme="dark"] .brand-mark .logo-spark { fill: #22d3ee; }
.brand-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
.brand-sep { color: var(--border); font-weight: 400; }
.brand-sub { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex: none; }

.mode-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 8px;
  background: var(--subtle);
  border: 1px solid var(--hairline);
}
.mode-btn {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  border: 1px solid var(--border);
  background: var(--surface);
}
.icon-btn:hover { background: var(--subtle); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }


.app {
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  min-height: calc(100vh - 52px);
}
.app.no-sidebar { grid-template-columns: minmax(0, 1fr); }
.app.no-sidebar .sidebar { display: none; }


.sidebar {
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.sidebar-top {
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  height: 34px;
  border-radius: 7px;
  background: var(--subtle);
  border: 1px solid transparent;
  transition: border-color 0.12s, background 0.12s;
}
.search:focus-within { background: var(--surface); border-color: var(--accent); }
.search svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.search input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 12.5px;
  color: var(--text);
}
.search input::placeholder { color: var(--muted); }
.kbd-hint {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  line-height: 1.4;
}

.suite-pills {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--subtle);
}
.suite-btn {
  flex: 1 1 auto;
  padding: 4px 4px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}
.suite-btn:hover { color: var(--text); }
.suite-btn.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.list-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}
.list-count { font-size: 12px; font-weight: 600; color: var(--muted); }
.sort-select {
  appearance: none;
  background: transparent;
  border: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  padding-right: 2px;
  text-align: right;
}
.sort-select:hover { color: var(--text); }

.task-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-item {
  width: 100%;
  text-align: left;
  padding: 7px 9px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.1s;
}
.task-item:hover { background: var(--subtle); }
.task-item.is-active { background: var(--accent-soft); }
.task-item-left { min-width: 0; flex: 1; }
.task-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-item.is-active .task-name { color: var(--accent); font-weight: 700; }
.task-sub {
  display: block;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


.gain {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex: none;
}
.gain.pos { background: var(--pos-soft); color: var(--pos); }
.gain.neg { background: var(--neg-soft); color: var(--neg); }
.gain.na { background: var(--subtle); color: var(--muted); }
.gain.medal { background: var(--medal-soft); color: var(--medal); font-family: var(--font-sans); }
.gain.medal.gold { background: var(--gold-soft); color: var(--gold); }
.gain.medal.silver { background: var(--silver-soft); color: var(--silver); }
.gain.medal.bronze { background: var(--bronze-soft); color: var(--bronze); }
.gain.medal::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 5px; flex: none; }
.badge-stack { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.badge-stack.row { flex-direction: row; align-items: center; gap: 5px; }


.main { min-width: 0; }
.page {
  padding: 20px 24px 36px;
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}


.task-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.th-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.cat-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}
.th-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}
.th-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.kpi-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
}
.kpi {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-left: 18px;
  border-left: 1px solid var(--hairline);
}
.kpi:first-child { padding-left: 0; border-left: none; }
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.th-summary {
  margin: 10px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--hairline);
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-2);
  max-width: 92ch;
}
.th-summary code, .cell-sum code, .doc code {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--subtle);
  color: var(--text);
}


.workspace {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ws-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 16px;
  min-height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.ws-tabs {
  display: flex;
  align-items: stretch;
  gap: 4px;
}
.ws-tab {
  position: relative;
  padding: 11px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.12s;
}
.ws-tab:hover { color: var(--text); }
.ws-tab.is-active { color: var(--text); }
.ws-tab.is-active::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.tab-meta {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.ws-right {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 0;
}
.kw-group {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.kw-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.kw-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--subtle);
  color: var(--text-2);
}
.tb-btn {
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--subtle);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.tb-btn:hover { background: var(--subtle-2); color: var(--text); }


.stage-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 16px;
  background: var(--subtle);
  border-bottom: 1px solid var(--border);
}
.stage-group, .helper-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.bar-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-right: 3px;
}
.hook-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.hook-btn:hover:not(:disabled) { border-color: var(--text-2); color: var(--text); }
.hook-btn.pass-hook { opacity: 0.65; font-weight: 500; }
.hook-btn.is-selected {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  opacity: 1;
}
.hook-sub {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  opacity: 0.78;
}
.helper-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--hairline);
}
.helper-btn:hover { border-color: var(--accent); color: var(--accent); }
.helper-btn.other-hook {
  background: transparent;
  border-style: dashed;
  color: var(--muted);
}
.helper-btn.other-hook:hover { color: var(--text); border-color: var(--border); }


.code-wrap { background: var(--code-bg); color: var(--code-text); }
.code {
  margin: 0;
  padding: 12px 0 16px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  tab-size: 2;
}
.code-sect {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  margin: 8px 0 4px;
  background: var(--code-sect);
  border-top: 1px solid var(--code-border);
  border-bottom: 1px solid var(--code-border);
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-2);
}
.code-sect:first-child { margin-top: 0; border-top: none; }
.code-sect b { font-family: var(--font-mono); color: var(--t-hook); font-weight: 600; }
.code-sect.is-flash { background: hsla(214 89% 51% / 0.20); }
.code-line {
  display: block;
  padding: 0 16px 0 0;
  white-space: pre;
}
.code-line:hover { background: hsla(215 28% 50% / 0.1); }
.code-line.is-flash { background: hsla(214 89% 51% / 0.18); }
.ln {
  display: inline-block;
  width: 46px;
  padding-right: 12px;
  text-align: right;
  color: var(--code-ln);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.t-kw { color: var(--t-kw); }
.t-fn { color: var(--t-fn); font-weight: 600; }
.t-hook { color: var(--t-hook); font-weight: 700; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-bi { color: var(--t-bi); }
.t-const { color: var(--t-const); }


.doc {
  padding: 22px 26px 28px;
  max-width: 82ch;
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
}
.doc h3, .doc h4, .doc h5 {
  margin: 20px 0 8px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.doc h3:first-child, .doc h4:first-child { margin-top: 0; }
.doc p { margin: 0 0 12px; color: var(--text-2); }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; color: var(--text-2); }
.doc li { margin-bottom: 5px; }
.doc b { color: var(--text); font-weight: 600; }
.doc em { font-style: italic; }
.doc pre {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-text);
  font-family: var(--font-mono);
  font-size: 12.5px;
  overflow-x: auto;
}
.doc-tbl { margin: 12px 0; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.doc-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc-tbl th, .doc-tbl td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--hairline); }
.doc-tbl th { background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 600; }
.doc-tbl tr:last-child td { border-bottom: none; }


.summary-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.stat {
  padding: 14px 18px;
  border-left: 1px solid var(--hairline);
}
.stat:first-child { border-left: none; }
.stat-k { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat-v {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-v.pos { color: var(--pos); }
.stat-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;

<script id="explorer-data" type="application/json">{"tasks":[{"id":"predict-volcanic-eruptions-ingv-oe","name":"predict-volcanic-eruptions-ingv-oe","short_name":"volcanic-eruptions","benchmark":"MLE-Bench-Tabular","suite":"mlebench","suite_label":"MLE-Bench-Tabular","domain":"Geophysics (Multi-Sensor Waveforms)","metric_label":"MAE ↓","lower_is_better":true,"plain":null,"plain_note":"Fails (IDs only in train.csv)","n_train":3987,"n_test":444,"n_folds":3,"thresholds":{"gold":3971366.0,"silver":4808057.0,"bronze":4999330.0,"median":6300677.0},"summary":"The task table holds one usable column, `segment_id`; everything the model sees is built offline from the 14 GB of raw ten-minute, ten-sensor seismic traces.","score":97355.0,"gain_pct":null,"medal":"Gold","category":null,"lines":1009,"hooks_defined":["preprocess","engineer","sample","postprocess","folds"],"hooks_active":["preprocess","engineer","sample","postprocess","folds"],"tabfm_kwargs":{"norm_methods":"['power', 'quantile', 'quantile_rtdl', 'robust']","n_feature_crosses":"'sqrt'"},"helper_functions":["_feats","_graph","_anchor","_lookup","_extra","_pca_one","_select"],"helper_ranges":{"_feats":[721,733],"_graph":[736,773],"_anchor":[776,812],"_lookup":[815,821],"_extra":[869,872],"_pca_one":[875,903],"_select":[942,967]},"hook_helpers":{"preprocess":["_graph","_anchor"],"engineer":["_feats","_lookup","_extra","_pca_one","_select"],"sample":[],"postprocess":["_graph"],"folds":[]},"hook_ranges":{"preprocess":[825,866],"engineer":[906,939],"sample":[980,987],"postprocess":[990,1009],"folds":[975,977]},"code":"\"\"\"INGV volcanic eruption: time_to_eruption from ten 10-minute seismic traces per segment.\n\nIntent (v163): put anch_n and anch_spread back.\n\n25% and 12.5% are tied (100610 vs 100614) so the taper sits anywhere in that range; keeping 25%.\nThe lesson from the taper is that any 8-fold margin under ~1k was noise, so the rest of that tier\ngets re-taken too. Dropping anch_n and anch_spread won by 84 -- the smallest margin in the run.\n\nv162: 25% taper. The 12.5% roll-off is worth 1152 at 10 folds (100614) where it was 9\n*behind* at 8 -- so that call was noise and re-taking it on the matched basis was the right move. The\ntaper curve is worth walking again from here: at 8 folds 25% read 545 behind 6.25%, which on this\nevidence means nothing.\n\nv161: re-decide the coin-flip calls on the 10-fold basis, starting with the taper width.\n\nAt 10 folds the same configuration scores 101766 against 8 folds' 101832, so the estimate is stable\nand the extra 2.5% of training rows buys almost nothing -- but the basis now matches the test split\nexactly. The decisions worth re-taking here are the ones whose 8-fold margins were inside the noise.\nThe narrowest was the band-edge taper: 6.25% beat 12.5% by 9.\n\nv160: validate at 10 folds, which is what the test split actually is.\n\nThe held-out split is 444 of 4431, 10.02%. I moved from 3 folds to 8 to measure in that regime and\npicked 8 rather than 10 to keep each evaluation affordable -- with 230 minutes and 350 evaluations\nleft that trade no longer makes sense. Ten folds holds out 10.0%, so the anchoring coverage, the\ncontext length and the number of pseudo-labelled rows all sit where they will in the final. Every\nscore before this line was measured on a different training pool and is not comparable to the ones\nafter it; the configuration is unchanged, so the number moving is the measurement, not the pipeline.\n\nv159: back to 101832. The broadband-envelope family costs 5.3k in the pool (107150), so\nthe ranked block draws from the two band families and nothing else -- lb+nb beats lb alone, lb+nb+tb,\nlb+nb+ev, and every wider pool tried. Fourteen consecutive losses since the band-edge taper, now\nincluding a joint sensor-tier drop, the baseline's fill value and every family combination.\n\nv158: add the broadband-envelope family to the pool.\n\nNaN is 311 worse than the median fill (102143) -- a constant that says \"middle of the distribution\"\nis apparently a better neighbour for attention than an absent value -- so anch_base keeps its fill.\nOf block B's four families the pool has only two; tb (drift) was tested and was 332 worse, but ev,\nthe statistics of the broadband 1 s envelope, never was. Block D covers *per-band* envelopes through\nits PCA, which is a different quantity from the whole trace's.\n\nv157: say \"no baseline\" with NaN instead of with the median.\n\nDropping s3/s7/s9 is 3.2k worse (105078): the pool narrowing that paid was about feature *families*,\nnot sensors -- every sensor carries its own station information and none is redundant. Back to all\nten. The anch_base column is the exact target where a row is anchored and the training median\neverywhere else, so two thirds of its values are one constant that asserts a baseline the row does\nnot have. TabFM takes NaN natively; NaN is what those rows actually have.\n\nv156: drop the weakest tier of sensors from the ranking pool.\n\nThe parallel nomad run's note says a flat leave-one-out is a weakness ranking, not convergence, and\nthat the tier has to be dropped *jointly*. The analogue here is sensors: measured over the eight\nfolds, s3, s7 and s9 take 7.6/7.8/7.7% of the importance and 8/8/10 of the 160 slots each, against\ns4's 17.6% and 21 slots. Dropping all three at once takes the pool from 640 to 448, which is the\nsame move that was worth 1.6k when it went from 990 to 640.\n\nv155: final -- 101832. Interpolating the dropouts is 721 worse (102553), which fits the\none other thing block A ever contributed: the dropout pattern is a station signature, and zero\nfilling leaves it in the spectrum where interpolation erases it. The artefact was information.\n\nv154: interpolate the dropouts instead of zero-filling them.\n\nOne data-handling default has never been looked at: every block turns a sensor's missing samples\ninto zeros. 4.3% of traces have partial dropouts -- a median of four runs, the longest a median of\n505 samples and up to half the trace -- and a zero-filled gap is a step at each edge, which is a\nbroadband transient the spectrum then has to carry. That is the same class of artefact as block D's\nfilter ringing, which was worth 1k. Linear interpolation puts nothing there.\n\nv153: final -- 101832. 2048 is 5.8k worse and 8192 is 5.4k worse, both by wider margins\nthan when the window was first chosen, so block C sits at 4096 and every component of the pipeline\nhas now been re-measured against the finished version of every other. Ten consecutive losses since\nthe band-edge taper, across filtering, detrending, normalisation, band grids, filterbanks, window\nlengths and slot splits.\n\nv152: the other side, 2048. 8192 is 5.4k worse (107237), a wider margin than the 2.2k it\nlost by before, so the optimum has not drifted upward. Close the bracket downward and the pipeline\nis done.\n\nv151: re-check block C's window length against the finished pipeline.\n\nMaking block C's drift robust is 4k worse (105812): drift over ten minutes is a long-timescale\nquantity and a 256-point median inside a frame measures something else entirely. It keeps its\n8192-point frames, and the estimator sweep is complete. Block C's own window length was fixed at\n4096 when block D was untapered, ANCH_W was 0.03 and the ranked block had no detrend; the margins\nthere were only ~2k, so re-measure 8192 against the pipeline as it now stands.\n\nv150: the last mean estimator in the pipeline.\n\nBlock C's band powers became a median long ago but its drift family did not: it still takes one\n8192-point periodogram per time frame, which is a single periodogram, the noisiest estimator there\nis, and it is the only mean left anywhere. Thirteen frames, each its own 256-point median. (The same\nsubstitution inside block B's drift was part of a bundled change that lost 1.2k; this one is\nisolated, and block C's drift reaches TabFM through a PCA rather than a ranking.)\n\nv149: back to 101832. Normal olumns worth a slot\nare the eleven that say which sensors the segment has.\n\nv75: make the second ranked block block E instead.\n\nThirty verbatim columns of block D were a wash (129368 against 129135) -- its PCA already spans what\nthey say. Block E is the other station-signature family after presence (inter-sensor coherence per\nband and inter-sensor lag) and it failed as a PCA block, which is the same shape as presence, whose\nPCA-imputed form was worthless and whose verbatim form was the only late win.\n\nv74: a second, small ranked block from block D.\n\nThe presence columns are the run's only late win and what makes them different is that they reach\nTabFM verbatim rather than through a projection. Block D earns more per PCA column than any other\nblock but has never been offered a verbatim slot: ranking over B+D diluted B's own ranking, and\nranking over D instead of B was 6k worse, but a *separate* 30-column ranking of D touches neither.\nIt buys those 30 slots from D's own PCA share.\n\nv73: back to v68, the best measured (129135). The presence pattern as a string category\nwas 4.2k worse (133321) -- eleven numeric presence columns already say everything the key does, and\nthe twelfth column is not free.\n\nv72: the presence pattern as a category, not a number.\n\nBlock D should not pay for the presence columns (130862 against block C's 129135). miss_pat failed\nas a float column, but an integer encoding of a bit pattern is meaningless as a number -- 0b0100000100\nis not \"between\" its neighbours. TabFM takes strings natively, so the same key as a ten-character\nstring is a station identifier rather than a magnitude.\n\nv71: take the presence columns' eleven slots out of block D instead of block C. Adding\nthem on top rather than in place scored 134405 against 129135 -- 377 columns is worse than 366 even\nwhen the extra eleven are the ones that just helped -- so the budget binds to the column, and the\nonly question left is which block should pay.\n\nv70: the eleven presence columns without paying for them. miss_pat and the le_* family\nwere 2.2k worse (131386) -- of block A's segment-level summaries only presence itself is worth a\nslot -- so those go, and block C gets its 80 back: the question is whether the 640 the presence\ncolumns bought was net of what the six PCA components they displaced were worth.\n\nv69: the rest of block A's segment-level summaries, verbatim.\n\nThe eleven presence columns were worth 640 (129135). They are the first columns from block A that\nhave ever helped, and what they have in common is that they describe the segment as a whole rather\nthan one sensor -- which is exactly what a per-sensor PCA cannot express and what its NaN imputation\nerases. miss_pat (the presence pattern as one key) and the le_* family (the spread of log energy\nacross sensors) are the rest of that shape.\n\nv68: put sensor presence back as explicit columns.\n\nWeak edges are noise -- of 64 component pairs linked by two or more of them, 9 agree on the offset\nand none of those 9 is right -- so coverage is closed for good. Block J (sensor-averaged spectra)\ndiluted the ranking (137378) and is out. What is genuinely missing is which sensors a segment has:\nthe ranked block carries it as NaNs, but both PCA blocks impute their NaNs with the training median\nbefore projecting, so the station signature is erased from 160 of the 366 columns. Eleven columns\ngive it back, taken out of block C's share.\n\nv67: block J -- the spectrum averaged across the segment's sensors -- added to the pool\nthe 200 raw columns are ranked from. Two results say a band estimate's variance matters more to\nretrieval than its bandwidth (4096-point Welch beats 16384 by 11k and 2048 by 0.7k); averaging the\nsame band over 5-10 sensors cuts that variance again. The pool grows 990 -> 1230, a sixth, which is\nfar short of the dilution that sank the B+C+D pool.\n\nv66: final configuration. max_num_rows below the context length -- letting each member\ndraw its own row subset -- was 8.9k worse (138660), the last of a long run of changes that all cost\nsomething, so the pipeline stands as measured at 129774.\n\nWHAT THIS DOES\n\nThe table the judge hands over holds one column, segment_id; everything else is built offline from\nthe 14 GB of raw traces by extract*.py, scan3.py and refine.py, and cached under feat_cache/.\n\n1. Anchoring. The 4431 segments are windows cut from a handful of continuous recordings and about\n   half of them overlap another. For an overlapping pair the lag that maximises the cross-correlation\n   IS the difference of their targets, to the sample. Every pair is cross-correlated on spectrally\n   whitened, 1-bit-normalised traces of five sensors (raw correlation does not work: the traces'\n   own autocorrelation puts the null max-z at ~13 over 120k lags, whitened and signed it is 4.5,\n   against ~150 for a real overlap). Pairs above z=25 become edges; connected components are\n   recordings laid out on a common sample axis. A segment sharing a component with a labelled one\n   gets its target exactly -- 44% of validation rows at 8 folds, and 1756 of 1756 of them exact.\n\n2. Residual target. `preprocess` retargets to y - base: the anchor where there is one, the training\n   median where there is not, and it divides by a per-row sd -- ANCH_W where the baseline is an\n   algebraic identity, 1 where it is the median. `postprocess` scales the correction back and adds\n   the baseline. `tabfm_corr` is uninformative under this parameterisation (skills/tabfm.md 5).\n\n3. Context. An anchored row's residual is 0, which is the answer for an anchored query and a pull\n   toward the median for everything else, so every anchored training row is appended a second time\n   as if it had no anchor (baseline = median, target = y - median). The test rows the graph reaches\n   join on the same terms -- their targets come from training labels through the lag identity, so no\n   test label is read. Together worth 35k.\n\n4. Columns (366). 160 raw columns of block B, ranked by an ExtraTrees fitted inside the fold out of\n   a pool restricted to its 640 band columns; 109 + 80 components of an in-fold PCA over the fine\n   spectra (block C) and the band envelopes (block D), both rank-normalised first; and 11 verbatim\n   columns saying which sensors the segment has -- the PCA imputes its NaNs, so without those the\n   station signature is missing from 189 of the columns. The ranked block and the PCA blocks are\n   not interchangeable in either direction: the ranking wants columns that are individually\n   informative, the PCA wants a block whose variance is worth spanning.\n\n   366 is a hard optimum -- 306, 377 and 426 columns are all worse, whatever fills them -- so a new\n   feature family has to be tested as a swap, never as an addition. And what TabFM wants out of a\n   ranking is a *redundant* subset of a *narrow* pool: dropping correlated duplicates costs 13k,\n   regridding away duplicate low bands costs 2.1k, but widening the pool costs every time.\n\n   Every spectrum here is a **median**-of-periodograms, not the mean Welch returns by default, and\n   this is worth more than every other feature decision combined: 129135 -> 106685 (and -> 103302\n   with a per-window linear detrend in the ranked block, which block C does not want). A ten-minute\n   segment is full of transients and a mean over 29 windows follows them; the median measures the\n   background the station sits on and the tremor it sustains. Given the median, the window length\n   wants to be *short* -- the ordering reverses, because a median over 468 windows is a far better\n   estimator than one over 14 -- and the two blocks land in different places: 256 points for the\n   ranked block (0.39 Hz, coarser than the tremor band itself) and 4096 for block C, whose 80 log\n   bands are the whole point of it.\n\n4b. Block D band-limits by zeroing FFT bins, which is an ideal filter in frequency and a sinc in\n   time, so every transient rings across the envelope it then measures. A 6.25% raised-cosine\n   roll-off on each band edge is worth 1k. It does not generalise: replacing the *hard band sums*\n   of blocks B and C with an overlapping filterbank cost 6.2k and 5.5k.\n\n5. `postprocess` also makes the unanchored predictions obey the graph: a component with no labelled\n   member still knows its members' relative offsets, so their implied origins are averaged.\n\nWHAT DID NOT WORK, so it is not tried again: feature blocks A (time domain), E (cross-sensor\ncoherence), F (time-frequency image), G (12-band envelopes), H (entropy / sub-0.1 Hz / peak shape);\nblock B at finer or coarser Welch resolution; the untouched spectra instead of a ranking of them;\ndecorrelating the ranked block; ranking over more than one block; PLS instead of PCA; one PCA over\ntwo blocks; a 1-NN baseline (TabFM collapses onto it) or a 1-NN column (crowds out the spectra); a\nsigned-sqrt residual; row-subsample bagging in `sample` and per-member subsampling via\nmax_num_rows; enable_nnls; n_svd_features; outlier_threshold; one normalisation for all members;\nexact duplicate context rows; blending a kNN or local ridge into the output; an affine\nrecalibration (scale 1.0 is exactly optimal).\n\nSCORES (8 folds from v41 on; before that 3, and the two are not comparable)\n  final: 101832 — 129135 by the median periodogram (see 4) and the narrowed pool, then\n         103302 -> 101832 by ANCH_W 0.01 and a 6.25% raised-cosine roll-off on block D's\n         band edges (its brick-wall filter was ringing into the envelopes it measures)\n  3-fold: 339254 identity+features -> 305229 anchored -> 231916 block B -> 216742 PCA(C)\n          -> 212696 block D -> 199573 ANCH_W -> 196500 component averaging -> 171534 augment\n          -> 161744 pseudo -> 160135\n  8-fold: 132512 -> 130791 (80/80 PCA) -> 129774 (rank-normalised PCA)\n\"\"\"\nimport os\nimport numpy as np\nimport pandas as pd\n\nTABFM_KWARGS = {\"norm_methods\": [\"power\", \"quantile\", \"quantile_rtdl\", \"robust\"],\n                \"n_feature_crosses\": \"sqrt\"}\n\nTOPK = 160\nPOOLPAT = r\"^s\\d+_(lb|nb)\\d+$\"   # the ranking sees only these columns of the pool\nMAXCORR = 1.0                # a ranked column is skipped if it duplicates one already kept\nRANKY = False                # rank the columns against the rank of the residual, not the residual\nFEATSETS = (\"feats30.npz\",)  # ET-ranked raw columns\nFEATSETS2 = ()               # a second, separate ranking\nTOPK2 = 0\nPCABLOCKS = ((\"feats22.npz\", 109), (\"feats39.npz\", 80))\nRAWCOLS = (\"feats.npz\", [\"n_present\"] + [f\"s{j}_nanfrac\" for j in range(1, 11)])\nRAWCOLS2 = ()                # a second verbatim block\nPROJ = \"pca\"                 # \"pca\" (unsupervised) or \"pls\" (fitted against the residual)\nAUGMENT = True               # re-present anchored training rows as unanchored ones\nDUP_UNANCH = False           # and duplicate the ones that had no anchor to begin with\nPSEUDO = True                # and add the anchored test rows, targets from the graph\nANCH_W = 0.01                # sd of the anchored baseline, relative to the unanchored one\nZMIN = 25.0                  # edge threshold; every anchored validation row was exact at 25 and 20\n_HERE = os.getcwd()          # the hooks are exec'd with cwd = the workspace (no __file__)\n# feats.npz <- extract.py, feats42.npz <- extract42.py (block D, tapered band edges), feats30.npz <- extract30.py (block B at a\n# 256-point median Welch with a per-window linear detrend), feats22.npz <- extract22.py (block C at 4096), edges.npz <- scan3.py then\n# refine.py. None can be rebuilt inside a hook's 600 s, so say so plainly rather than failing three\n# frames deep in numpy. The other feats*.npz in feat_cache are variants that lost; see log.txt.\nfor _f in (\"feats.npz\", \"feats42.npz\", \"feats30.npz\", \"feats22.npz\", \"edges.npz\"):\n  if not os.path.exists(os.path.join(_HERE, \"feat_cache\", _f)):\n    raise RuntimeError(f\"feat_cache/{_f} is missing; rebuild it before scoring this pipeline\")\n_C = {}\n_B = {}\n\n\n# ---------------------------------------------------------------- caches\ndef _feats(sets=None):\n  sets = FEATSETS if sets is None else sets\n  key = \"X\" + \"\".join(sets)\n  if key not in _C:\n    names, blocks = [], []\n    for fn in sets:\n      z = np.load(os.path.join(_HERE, \"feat_cache\", fn), allow_pickle=True)\n      names += [str(n) for n in z[\"names\"]]\n      blocks.append(z[\"X\"])\n      _C[\"fpos\"] = {int(s): i for i, s in enumerate(z[\"segment_id\"])}\n    _C[key + \"n\"] = names\n    _C[key] = np.hstack(blocks) if len(blocks) > 1 else blocks[0]\n  return _C[key], _C[key + \"n\"], _C[\"fpos\"]\n\n\ndef _graph():\n  \"\"\"Components of the overlap graph, and each segment's sample offset inside its component.\"\"\"\n  if \"comp\" in _C:\n    return _C[\"comp\"], _C[\"pos\"], _C[\"gpos\"], _C[\"zbest\"]\n  E = np.load(os.path.join(_HERE, \"feat_cache\", \"edges.npz\"))\n  sids = E[\"segment_id\"]\n  n = len(sids)\n  k = E[\"z\"] >= ZMIN\n  i, j, lag, z = E[\"i\"][k], E[\"j\"][k], E[\"lag\"][k], E[\"z\"][k]\n  o = np.argsort(-z)                                   # lay out from the most reliable edges\n  i, j, lag, z = i[o], j[o], lag[o], z[o]\n  adj = [[] for _ in range(n)]\n  for a, b, L in zip(i, j, lag):\n    adj[a].append((b, -int(L)))                        # y_b - y_a = -lag\n    adj[b].append((a, int(L)))\n  comp = np.full(n, -1, dtype=np.int64)\n  pos = np.zeros(n, dtype=np.float64)\n  zb = np.zeros(n, dtype=np.float32)\n  for a, b, zz in zip(i, j, z):\n    zb[a] = max(zb[a], zz)\n    zb[b] = max(zb[b], zz)\n  c = 0\n  for s in range(n):\n    if comp[s] >= 0 or not adj[s]:\n      continue\n    comp[s], pos[s] = c, 0.0\n    stack = [s]\n    while stack:\n      u = stack.pop()\n      for v, d in adj[u]:\n        if comp[v] < 0:\n          comp[v], pos[v] = c, pos[u] + d\n          stack.append(v)\n    c += 1\n  _C[\"comp\"], _C[\"pos\"] = comp, pos\n  _C[\"gpos\"] = {int(s): t for t, s in enumerate(sids)}\n  _C[\"zbest\"] = zb\n  return comp, pos, _C[\"gpos\"], zb\n\n\ndef _anchor(tr_sid, y, te_sid):\n  \"\"\"base / n_anchor / spread for the training rows (leave-one-out) and for the test rows.\"\"\"\n  comp, pos, gpos, zb = _graph()\n  csize = {}\n  for c in comp[comp >= 0]:\n    csize[int(c)] = csize.get(int(c), 0) + 1\n  ti = np.array([gpos.get(int(s), -1) for s in tr_sid])\n  te = np.array([gpos.get(int(s), -1) for s in te_sid])\n  byc = {}\n  for k, v in enumerate(ti):\n    if v >= 0 and comp[v] >= 0:\n      byc.setdefault(comp[v], []).append(k)\n\n  def one(idx, loo):\n    est = np.full(len(idx), np.nan)\n    na = np.zeros(len(idx), dtype=np.float32)\n    sp = np.full(len(idx), np.nan)\n    zz = np.zeros(len(idx), dtype=np.float32)\n    cs = np.ones(len(idx), dtype=np.float32)\n    for t, v in enumerate(idx):\n      if v < 0:\n        continue\n      zz[t] = zb[v]\n      cs[t] = csize.get(int(comp[v]), 1)\n      c = comp[v]\n      if c < 0 or c not in byc:\n        continue\n      ks = [k for k in byc[c] if not (loo and ti[k] == v)]\n      if not ks:\n        continue\n      o = y[ks] - pos[ti[ks]]\n      est[t] = float(np.median(o)) + pos[v]\n      na[t] = len(ks)\n      sp[t] = float(o.max() - o.min())\n    return est, na, sp, zz, cs\n\n  return one(ti, True), one(te, False)\n\n\ndef _lookup(seg_ids, sets=None):\n  X, names, fpos = _feats(sets)\n  rows = np.array([fpos.get(int(s), -1) for s in seg_ids])\n  out = np.full((len(rows), X.shape[1]), np.nan, dtype=np.float32)\n  ok = rows >= 0\n  out[ok] = X[rows[ok]]\n  return pd.DataFrame(out, columns=names)\n\n\n# ---------------------------------------------------------------- hooks\ndef preprocess(X_train, y_train, X_test):\n  y = np.asarray(y_train, dtype=float).ravel()\n  tr, te = _anchor(X_train[\"segment_id\"].to_numpy(), y, X_test[\"segment_id\"].to_numpy())\n  fill = float(np.median(y))\n  btr = np.where(np.isnan(tr[0]), fill, tr[0])\n  bte = np.where(np.isnan(te[0]), fill, te[0])\n  miss = np.isnan(tr[0])\n  wtr = np.where(miss, 1.0, ANCH_W)\n  wte = np.where(np.isnan(te[0]), 1.0, ANCH_W)\n  yt = (y - btr) / wtr\n  _B[\"te\"] = (bte,) + te[1:] + (np.isnan(te[0]),)\n  a = np.flatnonzero(~miss) if AUGMENT else np.zeros(0, dtype=int)\n  if DUP_UNANCH:\n    a = np.concatenate([a, np.flatnonzero(miss)])\n  if len(a):\n    est, na, sp, zz, cs = tr\n    tr = (None,\n          np.concatenate([na, np.zeros(len(a))]),          # no anchors behind the copy\n          np.concatenate([sp, np.full(len(a), np.nan)]),\n          np.concatenate([zz, zz[a]]),                     # zbest and component size are properties\n          np.concatenate([cs, cs[a]]))                     # of the segment, not of the anchoring\n    btr = np.concatenate([btr, np.full(len(a), fill)])\n    yt = np.concatenate([yt, y[a] - fill])\n    X_train = pd.concat([X_train, X_train.iloc[a]], ignore_index=True)\n    miss = np.concatenate([miss, np.ones(len(a), bool)])\n  q = np.flatnonzero(~np.isnan(te[0])) if PSEUDO else np.zeros(0, dtype=int)\n  if len(q):\n    est, na, sp, zz, cs = tr\n    tr = (None, np.concatenate([na, np.zeros(len(q))]),\n          np.concatenate([sp, np.full(len(q), np.nan)]),\n          np.concatenate([zz, te[3][q]]),\n          np.concatenate([cs, te[4][q]]))\n    btr = np.concatenate([btr, np.full(len(q), fill)])\n    yt = np.concatenate([yt, te[0][q] - fill])\n    X_train = pd.concat([X_train, X_test.iloc[q]], ignore_index=True)\n    miss = np.concatenate([miss, np.ones(len(q), bool)])\n  _B[\"tr\"] = (btr,) + tr[1:] + (miss,)\n  _B[\"n0\"], _B[\"y0\"] = len(y), y\n  # the pre and post hooks run in separate sandboxes, so the baseline travels through the workspace\n  np.savez(os.path.join(_HERE, \".anchor_base.npz\"),\n           sid=X_test[\"segment_id\"].to_numpy(), base=bte, w=wte)\n  return X_train, pd.Series(yt, index=X_train.index, name=\"y\"), X_test\n\n\ndef _extra(b):\n  base, na, sp, z, cs, miss = b\n  return pd.DataFrame({\"anch\": (~miss).astype(np.float32), \"anch_z\": z,\n                       \"anch_base\": base.astype(np.float32)})\n\n\ndef _pca_one(str_sid, ste_sid, fn, n, tag, y=None):\n  \"\"\"One block projected down, fitted on this fold's training rows only.\"\"\"\n  from sklearn.decomposition import PCA\n  pat = None\n  if isinstance(fn, tuple) and len(fn) == 2 and isinstance(fn[1], str) and fn[1].startswith(\"^\"):\n    fn, pat = fn\n  fns = (fn,) if isinstance(fn, str) else tuple(fn)\n  Rtr, Rte = _lookup(str_sid, fns), _lookup(ste_sid, fns)\n  if pat:\n    import re\n    c = [x for x in Rtr.columns if re.match(pat, x)]\n    Rtr, Rte = Rtr[c], Rte[c]\n  med = Rtr.median()\n  A = Rtr.fillna(med).to_numpy(dtype=np.float64)\n  B = Rte.fillna(med).to_numpy(dtype=np.float64)\n  ok = np.isfinite(A).all(0) & np.isfinite(B).all(0) & (A.std(0) > 0)\n  A, B = A[:, ok], B[:, ok]\n  from sklearn.preprocessing import QuantileTransformer\n  qt = QuantileTransformer(output_distribution=\"normal\", n_quantiles=min(1000, len(A)),\n                           random_state=0, subsample=100000).fit(A)\n  A, B = qt.transform(A), qt.transform(B)\n  k = min(n, A.shape[0] - 1, A.shape[1])\n  if PROJ == \"pls\" and y is not None:\n    from sklearn.cross_decomposition import PLSRegression\n    p = PLSRegression(n_components=k, scale=False).fit(A, y)\n  else:\n    p = PCA(n_components=k, random_state=0).fit(A)\n  cols = [f\"{tag}{i}\" for i in range(k)]\n  return pd.DataFrame(p.transform(A), columns=cols), pd.DataFrame(p.transform(B), columns=cols)\n\n\ndef engineer(X_train, y_train, X_test):\n  str_sid, ste_sid = X_train[\"segment_id\"].to_numpy(), X_test[\"segment_id\"].to_numpy()\n  parts_tr, parts_te = [X_train[[\"segment_id\"]]], [X_test[[\"segment_id\"]]]\n  parts_tr.append(_extra(_B[\"tr\"]))\n  parts_te.append(_extra(_B[\"te\"]))\n  for spec in (RAWCOLS, RAWCOLS2):\n    if not spec:\n      continue\n    fn, cols = spec\n    Rtr, Rte = _lookup(str_sid, (fn,)), _lookup(ste_sid, (fn,))\n    if cols is not None:\n      Rtr, Rte = Rtr[cols], Rte[cols]\n    parts_tr.append(Rtr)\n    parts_te.append(Rte)\n  yv = np.asarray(y_train, dtype=float).ravel()\n  for sets, k in ((FEATSETS, TOPK), (FEATSETS2, TOPK2)):\n    if not (k and sets):\n      continue\n    Ftr, Fte = _lookup(str_sid, sets), _lookup(ste_sid, sets)\n    if sets is FEATSETS and POOLPAT:\n      import re\n      c = [x for x in Ftr.columns if re.match(POOLPAT, x)]\n      Ftr, Fte = Ftr[c], Fte[c]\n    keep = _select(Ftr, yv, k)\n    parts_tr.append(Ftr[keep])\n    parts_te.append(Fte[keep])\n  for t, (fn, n) in enumerate(PCABLOCKS):\n    Ptr, Pte = _pca_one(str_sid, ste_sid, fn, n, f\"p{t}_\",\n                        np.asarray(y_train, dtype=float).ravel())\n    parts_tr.append(Ptr)\n    parts_te.append(Pte)\n  for D, I in [(d, X_train.index) for d in parts_tr] + [(d, X_test.index) for d in parts_te]:\n    D.index = I\n  return pd.concat(parts_tr, axis=1), pd.concat(parts_te, axis=1)\n\n\ndef _select(F, y, k):\n  \"\"\"Rank columns by an ExtraTrees importance fitted on this fold's training rows only.\"\"\"\n  cols = [c for c in F.columns if F[c].notna().any() and F[c].std(skipna=True) > 0]\n  if len(cols) <= k or len(F) < 60:\n    return cols[:k]\n  from sklearn.ensemble import ExtraTreesRegressor\n  A = np.nan_to_num(F[cols].to_numpy(dtype=np.float64), nan=-9.99e8)\n  if RANKY:\n    from scipy.stats import rankdata\n    y = rankdata(y)\n  et = ExtraTreesRegressor(n_estimators=300, min_samples_leaf=3, n_jobs=8, random_state=0)\n  et.fit(A, y)\n  order = np.argsort(-et.feature_importances_)\n  if MAXCORR >= 1.0:\n    return [cols[i] for i in sorted(order[:k])]\n  Z = A - A.mean(0)\n  nrm = np.sqrt((Z * Z).sum(0))\n  Z /= np.where(nrm > 0, nrm, 1)\n  kept = []\n  for i in order:\n    if kept and np.abs(Z[:, kept].T @ Z[:, i]).max() > MAXCORR:\n      continue\n    kept.append(i)\n    if len(kept) == k:\n      break\n  return [cols[i] for i in sorted(kept)]\n\n\nNFOLD = 10\nNDRAW = 1\nDRAW_FRAC = 0.85\n\n\ndef folds(X_train, y_train):\n  from sklearn.model_selection import KFold\n  return list(KFold(NFOLD, shuffle=True, random_state=0).split(X_train))\n\n\ndef sample(X_train, y_train, X_test, max_rows):\n  \"\"\"Bag over row subsets: one full TabFM fit per draw, averaged by the judge.\"\"\"\n  n = len(X_train)\n  if NDRAW <= 1:\n    return [np.arange(n)]\n  rng = np.random.default_rng(0)\n  k = int(round(DRAW_FRAC * n))\n  return [np.sort(rng.choice(n, k, replace=False)) for _ in range(NDRAW)]\n\n\ndef postprocess(pred, y_orig, X_test):\n  z = np.load(os.path.join(_HERE, \".anchor_base.npz\"))\n  sid = X_test[\"segment_id\"].to_numpy()\n  base = pd.Series(z[\"base\"], index=z[\"sid\"]).reindex(sid).to_numpy()\n  w = pd.Series(z[\"w\"], index=z[\"sid\"]).reindex(sid).to_numpy()\n  y = np.asarray(y_orig, dtype=float).ravel()\n  raw = np.asarray(pred, dtype=float).ravel()\n  out = raw * w + base\n  comp, cpos, gpos, _ = _graph()\n  g = np.array([gpos.get(int(t), -1) for t in sid])\n  un = (w == 1.0) & (g >= 0)\n  cc = np.where(g >= 0, comp[np.maximum(g, 0)], -1)\n  for c in np.unique(cc[un & (cc >= 0)]):\n    m = un & (cc == c)\n    if m.sum() > 1:\n      out[m] = np.median(out[m] - cpos[g[m]]) + cpos[g[m]]\n  with open(os.path.join(_HERE, \"preds.csv\"), \"a\") as f:\n    for sid, r, b in zip(X_test[\"segment_id\"].to_numpy(), raw, base):\n      f.write(f\"{int(sid)},{r:.1f},{b:.1f}\\n\")\n  return pd.Series(out, index=pred.index).clip(float(y.min()), float(y.max()))\n","readme":"# INGV volcanic eruption — final pipeline\n\n## What it does\n\nThe task table holds one usable column, `segment_id`; everything the model sees is built offline from\nthe 14 GB of raw ten-minute, ten-sensor seismic traces.\n\nThe pipeline has two halves. The first is an **overlap graph**. The 4431 segments are windows cut from\na handful of continuous recordings, and about half of them overlap another one; for an overlapping\npair the lag that maximises the cross-correlation *is* the difference of the two targets, to the\nsample. Every pair is cross-correlated on spectrally whitened, 1-bit-normalised traces of the five\nsensors that are almost never missing (raw correlation does not work — the traces' own\nautocorrelation puts the null max-z near 13 over 120k lags, whitened and signed it is 4.5, against\n~150 for a real overlap). Pairs above z = 25 become edges, connected components are recordings laid\nout on a common sample axis, and a segment sharing a component with a labelled one gets its target\nexactly. That covers ~44% of the rows and was exact on every anchored validation row.\n\nThe second half is **TabFM over a residual**. `preprocess` retargets to `y - base`, where `base` is\nthe graph anchor where there is one and the training median where there is not, divided by a per-row\nscale (0.01 for anchored rows, whose baseline is an algebraic identity, 1 otherwise); `postprocess`\nundoes the scaling, adds the baseline back, and makes the still-unanchored members of a labelled-free\ncomponent agree by averaging their implied origins. Every anchored training row is also appended a\nsecond time *as if it had no anchor*, and the anchored test rows join the context with targets derived\nfrom training labels through the lag identity — together worth ~35k of the score. TabFM sees 366\ncolumns: 160 raw spectral columns of block B ranked in-fold by an ExtraTrees out of a pool restricted\nto its 640 band columns, 109 + 80 in-fold PCA components over the fine spectra (block C) and the band\nenvelopes (block D), and 11 verbatim columns saying which sensors the segment has. The single\nlargest feature decision is that every spectrum is a **median**-of-periodograms rather than the mean\n`scipy.signal.welch` returns: a ten-minute segment is full of transients and a mean follows them,\nwhile the median measures the background the station sits on. Given the median, short windows win.\n\nScored 101832 (RMSE-style, lower is better) at 10-fold CV on the training set.\n\n## What `build.sh` builds\n\n`final/build.sh` regenerates all five caches `pipeline.py` reads from `feat_cache/`, from\n`data/train/*.csv` and `data/test/*.csv` only:\n\n| output | from | what it is |\n| --- | --- | --- |\n| `feats.npz` | `extract.py` | broad per-sensor time/frequency summaries; only `n_present` and `s*_nanfrac` reach TabFM |\n| `feats22.npz` | `extract22.py` | block C — 80 log bands of a 4096-point median periodogram (first PCA block) |\n| `feats30.npz` | `extract30.py` | block B — 256-point median periodogram, per-window linear detrend (the ranked block) |\n| `feats39.npz` | `extract39.py` | block D — band-limited 1 s envelope statistics, 25% raised-cosine band edges (second PCA block) |\n| `feats42.npz` | `extract42.py` | the 6.25%-taper variant of block D; see the caveat below |\n| `edges.npz` | `scan2.build()` → `scan3.py` → `refine.py` | the overlap graph: `(i, j, lag, z)` with `y_j - y_i = -lag` |\n\nRoughly 20 minutes end to end on the 64-core host this was built on, ~12 minutes of which is\n`scan3.py`'s decimated all-pairs scan; the extractors are dominated by reading the raw CSVs. Peak\ntransient disk under `feat_cache/` is about 20 GB — `ov_fft.npy` (11.6 GB), `sign.npy` (5.3 GB) and\n`dec_fft.npy` (2.9 GB) are intermediates of the graph build and can be deleted afterwards. The five\n`.npz` the pipeline actually reads are a few hundred MB.\n\n## Things a reader would otherwise get wrong\n\n- **`feats42.npz` is dead weight that is still mandatory.** `PCABLOCKS` uses `feats39.npz`; the\n  `feats42.npz` name survives only in the start-up existence check at the top of `pipeline.py`, whose\n  comment is stale (it describes the earlier configuration where the 6.25% taper was shipped and\n  `feats39.npz` did not exist). `build.sh` builds it so the check passes. Delete the check and you can\n  drop that step — but `pipeline.py` is the scored artefact and is left untouched.\n- **`scan2.py` must not be run as a script.** Its `main()` is the full-rate all-pairs scan that was\n  abandoned mid-run as too slow (it would have taken about a day); only `scan2.build()`, which writes\n  the whitened spectra both later stages read, is wanted. `scan3.py` then overwrites the\n  `ov_score.npy` / `ov_lag.npy` that `main()` would have produced.\n- **The build steps short-circuit on existing outputs.** `scan2.build()` returns early if\n  `ov_mask.npy` exists, `scan3.build_dec()` if `dec_fft.npy` does, `refine.build_sign()` if\n  `sign.npy` does. A partly-populated `feat_cache/` therefore gets skipped rather than repaired, so\n  `build.sh` deletes those markers before the graph stage. This means re-running `build.sh` redoes the\n  ~12-minute scan every time.\n- **Everything runs from the workspace root.** The scripts use relative `data/` and `feat_cache/`\n  paths; `build.sh` `cd`s there itself and puts `final/build/` on `PYTHONPATH` for the `scan2` import.\n- **No test labels are involved anywhere.** The pseudo-labelled test rows added to the context get\n  their targets from *training* labels through the lag identity, not from any held-out label.\n- **`postprocess` appends to `preds.csv`** in the workspace on every call — a diagnostic dump from the\n  run, harmless but it grows; the submission itself is written by `final/run.py`.\n- The other 45-odd `feats*.npz` in `feat_cache/` and the other scripts in `final/build/` are variants\n  that scored worse and are not part of the build; `log.txt` records what each one cost.\n","package":[{"path":"build/extract.py","lines":213,"direct":true,"text":"\"\"\"Offline feature extraction from the raw 10-minute, 10-sensor segment files.\n\nRuns outside the judge (the hooks have a 600 s/stage limit and 14 GB of CSVs do not fit in it).\nWrites feat_cache/feats.npz: names (U), segment_id (int64), X (float32 n_seg x n_feat).\n\"\"\"\nimport os\nimport sys\nimport glob\nimport time\n\nos.environ.setdefault(\"OPENBLAS_NUM_THREADS\", \"1\")\nos.environ.setdefault(\"OMP_NUM_THREADS\", \"1\")\nos.environ.setdefault(\"MKL_NUM_THREADS\", \"1\")\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import signal as sps\nfrom scipy import stats as sst\n\nFS = 100.0                      # 60001 samples over 10 minutes\nNPERSEG = 4096\nBANDS = [(0, 0.5), (0.5, 1), (1, 2), (2, 3), (3, 4), (4, 6), (6, 8), (8, 10), (10, 13),\n         (13, 16), (16, 20), (20, 25), (25, 30), (30, 36), (36, 43), (43, 50)]\nQS = [0.1, 1, 5, 10, 25, 50, 75, 90, 95, 99, 99.9]\nAQS = [50, 75, 90, 95, 99, 99.9]\nLAGS = [1, 2, 5, 10, 50, 100, 500, 1000, 5000]\nNCHUNK = 20\n\n\ndef _slope(v):\n  n = len(v)\n  t = np.arange(n, dtype=np.float64)\n  t -= t.mean()\n  d = (t * t).sum()\n  return float((t * (v - v.mean())).sum() / d) if d > 0 else 0.0\n\n\ndef sensor_feats(x):\n  \"\"\"~110 features for one sensor trace (float32, may hold NaN).\"\"\"\n  f = {}\n  nan = np.isnan(x)\n  nf = float(nan.mean())\n  f[\"nanfrac\"] = nf\n  if nf > 0.5:                                   # sensor effectively absent: everything else is undefined\n    return f, None\n  v = x[~nan].astype(np.float64)\n  x0 = np.where(nan, 0.0, x).astype(np.float64)  # zero-filled, for spectra / diffs\n  n = len(v)\n  mu, sd = v.mean(), v.std()\n  f[\"mean\"], f[\"std\"] = mu, sd\n  f[\"absmean\"] = np.abs(v).mean()\n  f[\"rms\"] = np.sqrt((v * v).mean())\n  f[\"logenergy\"] = np.log1p((v * v).sum())\n  f[\"min\"], f[\"max\"] = v.min(), v.max()\n  f[\"ptp\"] = f[\"max\"] - f[\"min\"]\n  qs = np.percentile(v, QS)\n  for q, val in zip(QS, qs):\n    f[f\"q{q}\"] = val\n  f[\"iqr\"] = qs[6] - qs[4]\n  f[\"r99\"] = qs[9] - qs[1]\n  f[\"r999\"] = qs[10] - qs[0]\n  med = qs[5]\n  av = np.abs(v)\n  f[\"mad\"] = np.median(np.abs(v - med))\n  f[\"skew\"] = float(sst.skew(v))\n  f[\"kurt\"] = float(sst.kurtosis(v))\n  aq = np.percentile(av, AQS)\n  for q, val in zip(AQS, aq):\n    f[f\"aq{q}\"] = val\n  f[\"zerofrac\"] = float((v == 0).mean())\n  f[\"zcr\"] = float((np.diff(np.signbit(v)) != 0).mean())\n  s = sd if sd > 0 else 1.0\n  for k in (2, 3, 4, 6, 10):\n    f[f\"out{k}\"] = float((av > k * s).mean())\n  # Hjorth\n  d1 = np.diff(x0)\n  d2 = np.diff(d1)\n  v0, v1, v2 = x0.var(), d1.var(), d2.var()\n  f[\"hj_mob\"] = np.sqrt(v1 / v0) if v0 > 0 else 0.0\n  f[\"hj_comp\"] = (np.sqrt(v2 / v1) / f[\"hj_mob\"]) if v1 > 0 and f[\"hj_mob\"] > 0 else 0.0\n  f[\"d1_std\"], f[\"d1_absmean\"] = d1.std(), np.abs(d1).mean()\n  dq = np.percentile(np.abs(d1), [50, 95, 99, 100])\n  f[\"d1_q50\"], f[\"d1_q95\"], f[\"d1_q99\"], f[\"d1_max\"] = dq\n  f[\"d2_std\"], f[\"d2_absmean\"] = d2.std(), np.abs(d2).mean()\n  f[\"d1_over_std\"] = f[\"d1_std\"] / s\n  # autocorrelation\n  xc = x0 - x0.mean()\n  den = float((xc * xc).sum()) or 1.0\n  for L in LAGS:\n    f[f\"ac{L}\"] = float((xc[:-L] * xc[L:]).sum() / den)\n  # non-stationarity over 20 chunks\n  m = (len(x0) // NCHUNK) * NCHUNK\n  C = x0[:m].reshape(NCHUNK, -1)\n  cs = C.std(1)\n  ca = np.abs(C).mean(1)\n  for nm, arr in ((\"cstd\", cs), (\"cabs\", ca)):\n    f[f\"{nm}_mean\"] = arr.mean()\n    f[f\"{nm}_std\"] = arr.std()\n    f[f\"{nm}_min\"] = arr.min()\n    f[f\"{nm}_max\"] = arr.max()\n    f[f\"{nm}_cv\"] = arr.std() / (arr.mean() + 1e-12)\n    f[f\"{nm}_rng\"] = arr.max() / (arr.min() + 1e-12)\n    f[f\"{nm}_slope\"] = _slope(arr) / (arr.mean() + 1e-12)\n  half = len(x0) // 2\n  e1 = float((x0[:half] ** 2).mean())\n  e2 = float((x0[half:] ** 2).mean())\n  f[\"ehalf_ratio\"] = np.log1p(e2) - np.log1p(e1)\n  # spectrum\n  fr, P = sps.welch(x0, fs=FS, nperseg=NPERSEG, noverlap=NPERSEG // 2, detrend=\"constant\")\n  tot = float(P.sum()) or 1e-30\n  f[\"ptot\"] = np.log1p(tot)\n  for lo, hi in BANDS:\n    sel = (fr >= lo) & (fr < hi)\n    b = float(P[sel].sum())\n    f[f\"b{lo}_{hi}\"] = np.log1p(b)\n    f[f\"rb{lo}_{hi}\"] = b / tot\n  Pn = P / tot\n  f[\"sp_centroid\"] = float((fr * Pn).sum())\n  f[\"sp_spread\"] = float(np.sqrt(((fr - f[\"sp_centroid\"]) ** 2 * Pn).sum()))\n  f[\"sp_skew\"] = float((((fr - f[\"sp_centroid\"]) / (f[\"sp_spread\"] + 1e-9)) ** 3 * Pn).sum())\n  f[\"sp_kurt\"] = float((((fr - f[\"sp_centroid\"]) / (f[\"sp_spread\"] + 1e-9)) ** 4 * Pn).sum())\n  f[\"sp_entropy\"] = float(-(Pn * np.log(Pn + 1e-30)).sum())\n  f[\"sp_flat\"] = float(np.exp(np.log(P + 1e-30).mean()) / (P.mean() + 1e-30))\n  cum = np.cumsum(Pn)\n  for r in (0.25, 0.5, 0.75, 0.85, 0.95):\n    f[f\"sp_roll{int(r * 100)}\"] = float(fr[np.searchsorted(cum, r)])\n  k = int(np.argmax(P))\n  f[\"sp_peakf\"] = float(fr[k])\n  f[\"sp_peakrel\"] = float(P[k] / tot)\n  # spectral non-stationarity: how the spectrum drifts across the segment\n  fs2, ts2, S = sps.spectrogram(x0, fs=FS, nperseg=2048, noverlap=0, detrend=\"constant\")\n  Ssum = S.sum(0)\n  f[\"tf_e_cv\"] = float(Ssum.std() / (Ssum.mean() + 1e-30))\n  f[\"tf_e_slope\"] = _slope(np.log1p(Ssum))\n  cent = (fs2[:, None] * S).sum(0) / (Ssum + 1e-30)\n  f[\"tf_cent_mean\"] = float(cent.mean())\n  f[\"tf_cent_std\"] = float(cent.std())\n  f[\"tf_cent_slope\"] = _slope(cent)\n  return f, x0\n\n\ndef seg_feats(path):\n  d = pd.read_csv(path, dtype=np.float32).to_numpy()\n  out = {}\n  filled = []\n  present = []\n  for j in range(d.shape[1]):\n    f, x0 = sensor_feats(d[:, j])\n    for k, val in f.items():\n      out[f\"s{j + 1}_{k}\"] = val\n    filled.append(x0)\n    present.append(x0 is not None)\n  present = np.array(present)\n  out[\"n_present\"] = float(present.sum())\n  out[\"miss_pat\"] = float(int(\"\".join(\"1\" if p else \"0\" for p in present), 2))\n  # cross-sensor correlations\n  for i in range(10):\n    for j in range(i + 1, 10):\n      key = f\"c{i + 1}_{j + 1}\"\n      if filled[i] is None or filled[j] is None:\n        continue\n      a, b = filled[i], filled[j]\n      sa, sb = a.std(), b.std()\n      out[key] = float(((a - a.mean()) * (b - b.mean())).mean() / (sa * sb)) if sa > 0 and sb > 0 else 0.0\n  # cross-sensor energy summary\n  le = np.array([out.get(f\"s{j + 1}_logenergy\", np.nan) for j in range(10)], dtype=np.float64)\n  ok = ~np.isnan(le)\n  if ok.sum() > 1:\n    out[\"le_mean\"] = float(le[ok].mean())\n    out[\"le_std\"] = float(le[ok].std())\n    out[\"le_max\"] = float(le[ok].max())\n    out[\"le_min\"] = float(le[ok].min())\n    out[\"le_argmax\"] = float(np.flatnonzero(ok)[int(np.argmax(le[ok]))])\n  return out\n\n\ndef one(args):\n  sid, path = args\n  try:\n    return sid, seg_feats(path)\n  except Exception as e:                                     # a corrupt file must not sink the whole pass\n    sys.stderr.write(f\"{sid}: {e}\\n\")\n    return sid, {}\n\n\ndef main():\n  from multiprocessing import Pool\n  jobs = []\n  for split in (\"train\", \"test\"):\n    for p in sorted(glob.glob(f\"data/{split}/*.csv\")):\n      jobs.append((int(os.path.basename(p)[:-4]), p))\n  print(f\"{len(jobs)} segments\", flush=True)\n  t0 = time.time()\n  res = {}\n  with Pool(64) as pool:\n    for i, (sid, f) in enumerate(pool.imap_unordered(one, jobs, chunksize=4)):\n      res[sid] = f\n      if (i + 1) % 500 == 0:\n        print(f\"  {i + 1} in {time.time() - t0:.0f}s\", flush=True)\n  names = sorted({k for f in res.values() for k in f})\n  sids = np.array(sorted(res), dtype=np.int64)\n  X = np.full((len(sids), len(names)), np.nan, dtype=np.float32)\n  idx = {n: j for j, n in enumerate(names)}\n  for i, sid in enumerate(sids):\n    for k, v in res[sid].items():\n      X[i, idx[k]] = v\n  os.makedirs(\"feat_cache\", exist_ok=True)\n  np.savez_compressed(\"feat_cache/feats.npz\", names=np.array(names), segment_id=sids, X=X)\n  print(f\"done {X.shape} in {time.time() - t0:.0f}s\", flush=True)\n\n\nif __name__ == \"__main__\":\n  main()\n"},{"path":"build/extract30.py","lines":122,"direct":true,"text":"\"\"\"Block B: 256-point median-of-periodograms with a per-window linear detrend.\n\nOriginally: log-spaced spectral shape, how the spectrum drifts across the ten\nminutes, and envelope statistics. The first block (extract.py) is broad but coarse in frequency;\nthe unanchored segments -- the 63% with no overlapping partner, which carry 95% of the remaining\nerror -- have to be matched on spectral character alone.\n\"\"\"\nimport os\nimport sys\nimport glob\nimport time\n\nos.environ.setdefault(\"OPENBLAS_NUM_THREADS\", \"1\")\nos.environ.setdefault(\"OMP_NUM_THREADS\", \"1\")\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import signal as sps\n\nFS = 100.0\nNB = 32\nEDGES = np.geomspace(0.05, 50.0, NB + 1)\nTB = np.geomspace(0.2, 50.0, 7)          # 6 coarse bands for the time-evolution block\nW, NW = 100, 600                         # 1 s envelope\n\n\ndef _bands(fr, P, edges):\n  out = np.empty(len(edges) - 1)\n  for k in range(len(edges) - 1):\n    sel = (fr >= edges[k]) & (fr < edges[k + 1])\n    out[k] = P[sel].sum() if sel.any() else 0.0\n  return out\n\n\ndef _slope(v):\n  t = np.arange(len(v), dtype=np.float64)\n  t -= t.mean()\n  d = (t * t).sum()\n  return float((t * (v - v.mean())).sum() / d) if d > 0 else 0.0\n\n\ndef sensor_feats(x):\n  f = {}\n  if np.isnan(x).mean() > 0.5:\n    return f\n  x0 = np.nan_to_num(x).astype(np.float64)\n  x0 -= x0.mean()\n  fr, P = sps.welch(x0, fs=FS, nperseg=256, noverlap=128, detrend=\"linear\", average=\"median\")\n  b = _bands(fr, P, EDGES)\n  tot = b.sum() or 1e-30\n  for k in range(NB):\n    f[f\"lb{k}\"] = np.log10(b[k] + 1e-12)\n    f[f\"nb{k}\"] = np.log10(b[k] / tot + 1e-9)\n  # spectral drift: 7 frames x 6 bands\n  fr2, t2, S = sps.spectrogram(x0, fs=FS, nperseg=8192, noverlap=0, detrend=\"constant\")\n  Bt = np.stack([_bands(fr2, S[:, m], TB) for m in range(S.shape[1])])   # frames x 6\n  Lt = np.log10(Bt + 1e-12)\n  for k in range(len(TB) - 1):\n    f[f\"tb{k}_mean\"] = Lt[:, k].mean()\n    f[f\"tb{k}_slope\"] = _slope(Lt[:, k])\n    f[f\"tb{k}_std\"] = Lt[:, k].std()\n  # 1 s envelope\n  w = x0[:W * NW].reshape(NW, W)\n  e = np.log1p(np.sqrt((w * w).mean(1)))\n  for q in (1, 5, 25, 50, 75, 95, 99):\n    f[f\"ev_q{q}\"] = float(np.percentile(e, q))\n  f[\"ev_std\"] = e.std()\n  f[\"ev_slope\"] = _slope(e)\n  ec = e - e.mean()\n  den = float((ec * ec).sum()) or 1.0\n  for L in (1, 5, 20, 60):\n    f[f\"ev_ac{L}\"] = float((ec[:-L] * ec[L:]).sum() / den)\n  fe, Pe = sps.welch(ec, fs=1.0, nperseg=256, noverlap=128, detrend=\"constant\")\n  eb = _bands(fe, Pe, np.array([0.0, 0.01, 0.03, 0.1, 0.5]))\n  te = eb.sum() or 1e-30\n  for k in range(4):\n    f[f\"ev_b{k}\"] = float(eb[k] / te)\n  return f\n\n\ndef seg_feats(path):\n  d = pd.read_csv(path, dtype=np.float32).to_numpy()\n  out = {}\n  for j in range(d.shape[1]):\n    for k, v in sensor_feats(d[:, j]).items():\n      out[f\"s{j + 1}_{k}\"] = v\n  return out\n\n\ndef one(args):\n  sid, path = args\n  try:\n    return sid, seg_feats(path)\n  except Exception as e:\n    sys.stderr.write(f\"{sid}: {e}\\n\")\n    return sid, {}\n\n\ndef main():\n  from multiprocessing import Pool\n  jobs = sorted((int(os.path.basename(p)[:-4]), p)\n                for s in (\"train\", \"test\") for p in glob.glob(f\"data/{s}/*.csv\"))\n  t0 = time.time()\n  res = {}\n  with Pool(48) as pool:\n    for i, (sid, f) in enumerate(pool.imap_unordered(one, jobs, chunksize=4)):\n      res[sid] = f\n      if (i + 1) % 1000 == 0:\n        print(f\"  {i + 1} in {time.time() - t0:.0f}s\", flush=True)\n  names = sorted({k for f in res.values() for k in f})\n  sids = np.array(sorted(res), dtype=np.int64)\n  X = np.full((len(sids), len(names)), np.nan, dtype=np.float32)\n  idx = {n: j for j, n in enumerate(names)}\n  for i, sid in enumerate(sids):\n    for k, v in res[sid].items():\n      X[i, idx[k]] = v\n  np.savez_compressed(\"feat_cache/feats30.npz\", names=np.array(names), segment_id=sids, X=X)\n  print(f\"done {X.shape} in {time.time() - t0:.0f}s\", flush=True)\n\n\nif __name__ == \"__main__\":\n  main()\n"},{"path":"build/extract22.py","lines":122,"direct":true,"text":"\"\"\"Block C: 80 log bands from a 4096-point median-of-periodograms (28 windows).\n\nOriginally: the same spectral idea as extract2 at much finer resolution.\n\nThe ExtraTrees importance over block B is dominated by the log-spaced band powers between 0.2 and\n2.5 Hz -- volcanic tremor -- so this block spends its budget there: a 16384-point Welch (0.0061 Hz\nbins) aggregated into 80 log-spaced bands, the same bands normalised by the segment's total power,\nhow each of 10 coarse bands drifts over the ten minutes, and each sensor's band power relative to\nthe other sensors of the same segment (the per-segment normalisation cancels, leaving site response).\n\"\"\"\nimport os\nimport sys\nimport glob\nimport time\n\nos.environ.setdefault(\"OPENBLAS_NUM_THREADS\", \"1\")\nos.environ.setdefault(\"OMP_NUM_THREADS\", \"1\")\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import signal as sps\n\nFS = 100.0\nNB = 80\nEDGES = np.geomspace(0.02, 50.0, NB + 1)\nTNB = 10\nTEDGES = np.geomspace(0.1, 25.0, TNB + 1)\nXNB = 20\nXEDGES = np.geomspace(0.05, 50.0, XNB + 1)\n\n\ndef _bandsum(P, lo, hi):\n  \"\"\"P is a PSD on a uniform grid starting at 0 with spacing df; sum over [lo, hi).\"\"\"\n  out = np.empty(len(lo))\n  for k in range(len(lo)):\n    out[k] = P[lo[k]:hi[k]].sum()\n  return out\n\n\ndef _idx(fr, edges):\n  lo = np.searchsorted(fr, edges[:-1], \"left\")\n  hi = np.maximum(np.searchsorted(fr, edges[1:], \"left\"), lo + 1)\n  return lo, np.minimum(hi, len(fr))\n\n\ndef _slope(v):\n  t = np.arange(len(v), dtype=np.float64)\n  t -= t.mean()\n  d = (t * t).sum()\n  return float((t * (v - v.mean())).sum() / d) if d > 0 else 0.0\n\n\ndef seg_feats(path):\n  d = pd.read_csv(path, dtype=np.float32).to_numpy()\n  out = {}\n  xb = np.full((10, XNB), np.nan)\n  for j in range(10):\n    x = d[:, j]\n    if np.isnan(x).mean() > 0.5:\n      continue\n    x0 = np.nan_to_num(x).astype(np.float64)\n    x0 -= x0.mean()\n    fr, P = sps.welch(x0, fs=FS, nperseg=4096, noverlap=2048, detrend=\"constant\", average=\"median\")\n    lo, hi = _idx(fr, EDGES)\n    b = _bandsum(P, lo, hi)\n    tot = b.sum() or 1e-30\n    for k in range(NB):\n      out[f\"s{j + 1}_L{k}\"] = np.log10(b[k] + 1e-12)\n      out[f\"s{j + 1}_N{k}\"] = np.log10(b[k] / tot + 1e-9)\n    xl, xh = _idx(fr, XEDGES)\n    xb[j] = np.log10(_bandsum(P, xl, xh) + 1e-12)\n    fr2, _, S = sps.spectrogram(x0, fs=FS, nperseg=8192, noverlap=4096, detrend=\"constant\")\n    tl, th = _idx(fr2, TEDGES)\n    Lt = np.log10(np.stack([_bandsum(S[:, m], tl, th) for m in range(S.shape[1])]) + 1e-12)\n    for k in range(TNB):\n      out[f\"s{j + 1}_T{k}m\"] = Lt[:, k].mean()\n      out[f\"s{j + 1}_T{k}s\"] = _slope(Lt[:, k])\n      out[f\"s{j + 1}_T{k}d\"] = Lt[:, k].std()\n  ok = ~np.isnan(xb[:, 0])\n  if ok.sum() > 1:\n    ref = xb[ok].mean(0)\n    for j in range(10):\n      if not ok[j]:\n        continue\n      for k in range(XNB):\n        out[f\"s{j + 1}_R{k}\"] = xb[j, k] - ref[k]\n  return out\n\n\ndef one(args):\n  sid, path = args\n  try:\n    return sid, seg_feats(path)\n  except Exception as e:\n    sys.stderr.write(f\"{sid}: {e}\\n\")\n    return sid, {}\n\n\ndef main():\n  from multiprocessing import Pool\n  jobs = sorted((int(os.path.basename(p)[:-4]), p)\n                for s in (\"train\", \"test\") for p in glob.glob(f\"data/{s}/*.csv\"))\n  t0 = time.time()\n  res = {}\n  with Pool(48) as pool:\n    for i, (sid, f) in enumerate(pool.imap_unordered(one, jobs, chunksize=4)):\n      res[sid] = f\n      if (i + 1) % 1500 == 0:\n        print(f\"  {i + 1} in {time.time() - t0:.0f}s\", flush=True)\n  names = sorted({k for f in res.values() for k in f})\n  sids = np.array(sorted(res), dtype=np.int64)\n  X = np.full((len(sids), len(names)), np.nan, dtype=np.float32)\n  idx = {n: j for j, n in enumerate(names)}\n  for i, sid in enumerate(sids):\n    for k, v in res[sid].items():\n      X[i, idx[k]] = v\n  np.savez_compressed(\"feat_cache/feats22.npz\", names=np.array(names), segment_id=sids, X=X)\n  print(f\"done {X.shape} in {time.time() - t0:.0f}s\", flush=True)\n\n\nif __name__ == \"__main__\":\n  main()\n"},{"path":"build/extract39.py","lines":124,"direct":true,"text":"\"\"\"Block D with cosine-tapered band edges instead of brick-wall ones.\n\nZeroing FFT bins outside a band is an ideal filter in frequency and a sinc in time: every transient\nin the trace rings across the whole envelope. A raised-cosine roll-off over the outer 25% of each\nband trades a little band separation for an impulse response that decays.\n\nOriginally: band-limited envelope statistics.\n\nVolcanic tremor is characterised as much by how intermittent it is in each band as by how much power\nsits there. Blocks B and C measure power; this one filters each sensor into six bands in the\nfrequency domain and describes the 1 s amplitude envelope of each: level, spread, shape, burstiness\nand how it drifts over the ten minutes.\n\"\"\"\nimport os\nimport sys\nimport glob\nimport time\n\nos.environ.setdefault(\"OPENBLAS_NUM_THREADS\", \"1\")\nos.environ.setdefault(\"OMP_NUM_THREADS\", \"1\")\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import fft as sfft\nfrom scipy import stats as sst\n\nFS = 100.0\nN = 60001\nNFFT = 65536\nBANDS = [(0.1, 0.5), (0.5, 1.0), (1.0, 2.0), (2.0, 5.0), (5.0, 12.0), (12.0, 30.0)]\nW, NW = 100, 600\n\n\ndef _slope(v):\n  t = np.arange(len(v), dtype=np.float64)\n  t -= t.mean()\n  d = (t * t).sum()\n  return float((t * (v - v.mean())).sum() / d) if d > 0 else 0.0\n\n\ndef sensor_feats(x):\n  f = {}\n  if np.isnan(x).mean() > 0.5:\n    return f\n  x0 = np.nan_to_num(x).astype(np.float64)\n  x0 -= x0.mean()\n  F = sfft.rfft(x0, n=NFFT)\n  fr = np.fft.rfftfreq(NFFT, 1.0 / FS)\n  for bi, (lo, hi) in enumerate(BANDS):\n    w = np.zeros_like(fr)\n    inn = (fr >= lo) & (fr < hi)\n    w[inn] = 1.0\n    tap = 0.25 * (hi - lo)                      # raised-cosine roll-off on each edge\n    for a, b, rise in ((lo - tap, lo, True), (hi, hi + tap, False)):\n      m = (fr >= a) & (fr < b)\n      if m.any():\n        u = (fr[m] - a) / (b - a)\n        w[m] = 0.5 * (1 - np.cos(np.pi * u)) if rise else 0.5 * (1 + np.cos(np.pi * u))\n    G = F * w\n    b = sfft.irfft(G, n=NFFT)[:W * NW]\n    e = np.sqrt((b.reshape(NW, W) ** 2).mean(1))\n    le = np.log10(e + 1e-9)\n    f[f\"b{bi}_m\"] = le.mean()\n    f[f\"b{bi}_sd\"] = le.std()\n    f[f\"b{bi}_sk\"] = float(sst.skew(le))\n    q = np.percentile(le, [5, 25, 50, 75, 95])\n    f[f\"b{bi}_q5\"], f[f\"b{bi}_q25\"] = q[0], q[1]\n    f[f\"b{bi}_q75\"], f[f\"b{bi}_q95\"] = q[3], q[4]\n    f[f\"b{bi}_iqr\"] = q[3] - q[1]\n    f[f\"b{bi}_slope\"] = _slope(le)\n    med = np.median(e)\n    f[f\"b{bi}_burst\"] = float((e > 2 * med).mean()) if med > 0 else 0.0\n    c = le - le.mean()\n    den = float((c * c).sum()) or 1.0\n    for L in (5, 30, 120):\n      f[f\"b{bi}_ac{L}\"] = float((c[:-L] * c[L:]).sum() / den)\n  # ratios between adjacent bands: spectral shape of the *envelope level*\n  for bi in range(len(BANDS) - 1):\n    f[f\"r{bi}\"] = f[f\"b{bi + 1}_m\"] - f[f\"b{bi}_m\"]\n  return f\n\n\ndef seg_feats(path):\n  d = pd.read_csv(path, dtype=np.float32).to_numpy()\n  out = {}\n  for j in range(d.shape[1]):\n    for k, v in sensor_feats(d[:, j]).items():\n      out[f\"s{j + 1}_{k}\"] = v\n  return out\n\n\ndef one(args):\n  sid, path = args\n  try:\n    return sid, seg_feats(path)\n  except Exception as e:\n    sys.stderr.write(f\"{sid}: {e}\\n\")\n    return sid, {}\n\n\ndef main():\n  from multiprocessing import Pool\n  jobs = sorted((int(os.path.basename(p)[:-4]), p)\n                for s in (\"train\", \"test\") for p in glob.glob(f\"data/{s}/*.csv\"))\n  t0 = time.time()\n  res = {}\n  with Pool(48) as pool:\n    for i, (sid, f) in enumerate(pool.imap_unordered(one, jobs, chunksize=4)):\n      res[sid] = f\n      if (i + 1) % 1500 == 0:\n        print(f\"  {i + 1} in {time.time() - t0:.0f}s\", flush=True)\n  names = sorted({k for f in res.values() for k in f})\n  sids = np.array(sorted(res), dtype=np.int64)\n  X = np.full((len(sids), len(names)), np.nan, dtype=np.float32)\n  idx = {n: j for j, n in enumerate(names)}\n  for i, sid in enumerate(sids):\n    for k, v in res[sid].items():\n      X[i, idx[k]] = v\n  np.savez_compressed(\"feat_cache/feats39.npz\", names=np.array(names), segment_id=sids, X=X)\n  print(f\"done {X.shape} in {time.time() - t0:.0f}s\", flush=True)\n\n\nif __name__ == \"__main__\":\n  main()\n"},{"path":"build/scan2.py","lines":149,"direct":true,"text":"\"\"\"All-pairs overlap detection on spectrally whitened, 1-bit-normalised traces.\n\nPlain cross-correlation of the raw traces is swamped by their own autocorrelation and by amplitude\nbursts: the null max-z over 120k lags sits at ~13 instead of ~4.5. Whitening the spectrum (divide by\na 64-bin moving average of |F|) and then taking the sign of the trace fixes both — measured null over\nrandom pairs: median 4.5, max 5.8, exactly a max-of-120k-Gaussians. True overlapping pairs sit at\nz ~ 150. Five sensors that are almost never missing are summed in the frequency domain, so the whole\nthing still costs one inverse FFT per pair.\n\nfeat_cache/ov_score.npy (n x n float32) and ov_lag.npy (n x n int32): y_j - y_i = -lag[i, j].\n\"\"\"\nimport os\nimport time\n\nos.environ.setdefault(\"OPENBLAS_NUM_THREADS\", \"1\")\nos.environ.setdefault(\"OMP_NUM_THREADS\", \"1\")\n\nimport numpy as np\nfrom scipy import fft as sfft\n\nNFFT = 131072\nNRAW = 60001\nLMIN, LMAX = 60, 59940\nSENS = [0, 3, 5, 6, 9]           # sensors 1, 4, 6, 7, 10: fully missing in <1% of segments\nSMOOTH = 64\nCH = 64\nNW = 48\n\nA0, A1 = LMIN, LMAX + 1\nB0, B1 = NFFT - LMAX, NFFT - LMIN + 1\nINVA = (1.0 / np.sqrt(NRAW - np.arange(A0, A1))).astype(np.float32)\nINVB = (1.0 / np.sqrt(NRAW - np.abs(np.arange(B0, B1) - NFFT))).astype(np.float32)\n\n\ndef _prep(x):\n  \"\"\"spectral whitening then 1-bit normalisation -> unit-variance sign trace, as a spectrum.\"\"\"\n  x = np.nan_to_num(x).astype(np.float64)\n  x -= x.mean()\n  F = sfft.rfft(x, n=NFFT)\n  a = np.abs(F)\n  s = np.convolve(a, np.ones(SMOOTH) / SMOOTH, mode=\"same\")\n  w
